<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電気通信施工管理技士1級 一次試験 問題集</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
            background: #f0f4f8; color: #333; min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
            color: white; padding: 20px 16px; text-align: center;
        }
        header h1 { font-size: 17px; font-weight: bold; line-height: 1.5; }
        header p  { font-size: 13px; margin-top: 5px; opacity: 0.85; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

        #level-screen { text-align: center; padding: 24px 0; }
        #level-screen h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 6px; }
        #level-screen p  { font-size: 13px; color: #666; margin-bottom: 24px; }

        .level-btn {
            display: block; width: 100%; padding: 20px 16px;
            margin-bottom: 14px; border: none; border-radius: 14px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        .level-btn:active { transform: scale(0.97); }
        .level-btn small { display: block; font-size: 13px; font-weight: normal; margin-top: 4px; opacity: 0.9; }
        .level-btn.beginner     { background: linear-gradient(135deg,#4CAF50,#388e3c); color:#fff; box-shadow:0 4px 14px rgba(76,175,80,.35); }
        .level-btn.intermediate { background: linear-gradient(135deg,#FF9800,#e65100); color:#fff; box-shadow:0 4px 14px rgba(255,152,0,.35); }
        .level-btn.advanced     { background: linear-gradient(135deg,#e53935,#b71c1c); color:#fff; box-shadow:0 4px 14px rgba(229,57,53,.35); }
        .level-btn.random       { background: linear-gradient(135deg,#7b1fa2,#4a148c); color:#fff; box-shadow:0 4px 14px rgba(123,31,162,.35); }

        #quiz-screen { display: none; }
        .progress-wrap { background:#ddd; border-radius:8px; height:8px; margin-bottom:6px; }
        .progress-bar  { background:linear-gradient(90deg,#2d6a9f,#4CAF50); height:8px; border-radius:8px; transition:width .3s; }
        .progress-text { font-size:13px; color:#666; text-align:right; margin-bottom:14px; }

        .question-card {
            background: white; border-radius: 16px;
            padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 14px;
        }
        .category-tag {
            display: inline-block; background: #e8f0fe; color: #2d6a9f;
            font-size: 11px; font-weight: bold; padding: 3px 10px;
            border-radius: 20px; margin-bottom: 12px;
        }
        .question-text { font-size: 16px; line-height: 1.75; color: #222; }

        .options { margin-top: 18px; }
        .option-btn {
            display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px;
            background: white; border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; text-align: left; cursor: pointer; line-height: 1.5;
            transition: border-color .2s, background .2s; color: #333;
        }
        .option-btn.correct  { background:#e8f5e9; border-color:#4CAF50; color:#2e7d32; }
        .option-btn.wrong    { background:#ffebee; border-color:#f44336; color:#c62828; }
        .option-btn.disabled { cursor: default; }

        .explanation {
            display: none; background: #f8f9fa; border-left: 4px solid #2d6a9f;
            padding: 14px 16px; border-radius: 0 10px 10px 0;
            margin-top: 14px; font-size: 14px; line-height: 1.75; color: #444;
        }
        .explanation.show { display: block; }
        .explanation-title { font-weight: bold; color: #2d6a9f; margin-bottom: 6px; }

        .next-btn {
            display: none; width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(135deg,#1a3a5c,#2d6a9f); color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px;
        }
        .next-btn.show { display: block; }

        #result-screen { display: none; text-align: center; padding: 20px 0; }
        .result-circle {
            width: 140px; height: 140px; border-radius: 50%;
            margin: 0 auto 22px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-weight: bold;
        }
        .result-circle.pass { background:linear-gradient(135deg,#4CAF50,#388e3c); color:white; box-shadow:0 6px 20px rgba(76,175,80,.4); }
        .result-circle.fail { background:linear-gradient(135deg,#FF9800,#e65100); color:white; box-shadow:0 6px 20px rgba(255,152,0,.4); }
        .result-circle .score       { font-size: 36px; }
        .result-circle .score-label { font-size: 13px; opacity: .9; }
        .result-message { font-size: 22px; font-weight: bold; color: #1a3a5c; margin-bottom: 8px; }
        .result-sub     { font-size: 14px; color: #666; margin-bottom: 28px; }
        .result-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-action {
            padding: 16px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; border: none;
        }
        .btn-action.primary   { background:linear-gradient(135deg,#1a3a5c,#2d6a9f); color:white; }
        .btn-action.secondary { background:white; color:#2d6a9f; border:2px solid #2d6a9f; }

        .level-btn.weak { background:linear-gradient(135deg,#c62828,#6a1010); color:#fff; box-shadow:0 4px 14px rgba(198,40,40,.4); }
        #weak-btn { display:none; }

        .weak-badge {
            display:inline-block; background:#ffebee; color:#c62828;
            font-size:12px; font-weight:bold; padding:2px 10px;
            border-radius:20px; margin-bottom:20px;
        }

        .category-breakdown {
            background:#f8f9fa; border-radius:12px; padding:16px;
            margin-bottom:20px; text-align:left;
        }
        .category-breakdown h3 { font-size:14px; color:#555; margin-bottom:10px; }
        .cat-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #eee; }
        .cat-row:last-child { border-bottom:none; }
        .cat-name { color:#333; }
        .cat-score { font-weight:bold; }
        .cat-score.bad  { color:#e53935; }
        .cat-score.good { color:#388e3c; }
    </style>
</head>
<body>

<header>
    <h1>電気通信施工管理技士 1級</h1>
    <p>第一次試験 問題集</p>
</header>

<div class="container">

    <div id="level-screen">
        <h2>レベルを選んでください</h2>
        <p>解説付き・毎回ランダム出題</p>
        <button class="level-btn beginner"     onclick="startQuiz('beginner')">
            🟢 初級（20問）
            <small>基本用語・基礎知識の確認</small>
        </button>
        <button class="level-btn intermediate" onclick="startQuiz('intermediate')">
            🟠 中級（20問）
            <small>計算問題・応用・法規</small>
        </button>
        <button class="level-btn advanced"     onclick="startQuiz('advanced')">
            🔴 上級（20問）
            <small>過去問レベル・本番想定</small>
        </button>
        <button class="level-btn random"       onclick="startQuiz('random')">
            🎲 ランダム（20問）
            <small>全レベルからランダム出題</small>
        </button>
        <button class="level-btn weak" id="weak-btn" onclick="startQuiz('weak')">
            ❌ 苦手問題（集中攻略）
            <small id="weak-btn-sub"></small>
        </button>
        <div id="weak-badge-wrap"></div>
    </div>

    <div id="quiz-screen">
        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text"></div>
        <div class="question-card">
            <div class="category-tag"  id="category-tag"></div>
            <div class="question-text" id="question-text"></div>
            <div class="options"       id="options"></div>
            <div class="explanation"   id="explanation">
                <div class="explanation-title">📝 解説</div>
                <div id="explanation-text"></div>
            </div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>

    <div id="result-screen">
        <div class="result-circle" id="result-circle">
            <div class="score" id="result-score"></div>
            <div class="score-label">点</div>
        </div>
        <div class="result-message" id="result-message"></div>
        <div class="result-sub"     id="result-sub"></div>
        <div class="category-breakdown" id="category-breakdown"></div>
        <div class="result-actions">
            <button class="btn-action primary"   onclick="retryQuiz()">🔄 同じレベルをもう一度</button>
            <button class="btn-action secondary" onclick="goHome()">🏠 レベル選択に戻る</button>
        </div>
    </div>

</div>

<script>
const questions = {
    beginner: [
        { category:'電気通信工学', question:'光ファイバーケーブルの特徴として正しいものはどれか。', options:['電磁誘導の影響を受けやすい','電気信号をそのまま伝送する','電磁誘導の影響を受けにくい','銅線より重い'], answer:2, explanation:'光ファイバーは光信号で伝送するため、電磁誘導（ノイズ）の影響を受けにくい。また軽量・細径・広帯域という特徴もある。' },
        { category:'電気通信工学', question:'デシベル（dB）の説明として正しいものはどれか。', options:['電力の絶対値を表す単位','電力比・電圧比を対数で表した単位','周波数を表す単位','電流の大きさを表す単位'], answer:1, explanation:'dBは電力比や電圧比を常用対数で表した相対的な単位。電力比：dB=10log(P1/P2)、電圧比：dB=20log(V1/V2)。' },
        { category:'電気通信工学', question:'電気通信回線の「伝送損失」とは何か。', options:['信号レベルが増加する現象','信号レベルが減少する現象','送受信端の周波数の差','電流の変化率'], answer:1, explanation:'伝送損失とは、信号が伝送路を通過する際に信号レベルが減少する現象。光ファイバーはdB/km単位で表す。' },
        { category:'施工管理', question:'施工管理の「4大管理」に含まれないものはどれか。', options:['工程管理','品質管理','設計管理','安全管理'], answer:2, explanation:'4大管理は「工程管理・品質管理・安全管理・原価管理」。設計管理は含まれない。' },
        { category:'施工管理', question:'バーチャート（横線式工程表）の特徴として正しいものはどれか。', options:['各作業の関連性が明確にわかる','各作業の開始・終了時期が視覚的にわかりやすい','クリティカルパスが容易に把握できる','コンピューターがないと作成できない'], answer:1, explanation:'バーチャートは横棒グラフで各作業の期間を表す。見やすい反面、作業間の関連性やクリティカルパスの把握には向いていない。' },
        { category:'法規', question:'電気通信事業法の目的として正しいものはどれか。', options:['電波の公平かつ能率的な利用を確保する','電気通信事業の適正な運営を確保し利用者の利益を保護する','建設業の健全な発達を促進する','労働者の安全と健康を守る'], answer:1, explanation:'電気通信事業法は、電気通信事業の適正な運営を確保し、電気通信の健全な発達と国民の利便確保を目的とする。' },
        { category:'法規', question:'建設業法における「主任技術者」の配置が必要な工事はどれか。', options:['請負金額500万円未満の軽微な工事のみ','すべての建設工事','公共工事のみ','請負金額3,000万円以上の工事のみ'], answer:1, explanation:'建設業法により、建設業者はすべての工事現場に主任技術者（または監理技術者）を配置しなければならない。' },
        { category:'電気工学', question:'オームの法則の式として正しいものはどれか。', options:['V = I + R','V = I × R','V = I / R','V = I² × R'], answer:1, explanation:'オームの法則はV=I×R（電圧＝電流×抵抗）。V(V)、I(A)、R(Ω)の関係を表す。' },
        { category:'電気通信工学', question:'無線LANの規格「IEEE 802.11ac（Wi-Fi 5）」が主に使用する周波数帯はどれか。', options:['2.4GHz帯のみ','5GHz帯のみ','900MHz帯','60GHz帯'], answer:1, explanation:'IEEE 802.11ac（Wi-Fi 5）は5GHz帯を使用。両帯域対応はIEEE 802.11n（Wi-Fi 4）やIEEE 802.11ax（Wi-Fi 6）。' },
        { category:'施工管理', question:'ヒヤリハットの説明として正しいものはどれか。', options:['死亡・重傷事故のこと','危うく事故になりそうだったが災害に至らなかった事象','軽傷事故のこと','設備の故障のこと'], answer:1, explanation:'ヒヤリハットは危うく事故になりそうだった事象。ハインリッヒの法則では1件の重大事故の背後に29件の軽微事故と300件のヒヤリハットがあるとされる。' },
        { category:'電気通信工学', question:'IPアドレス「192.168.1.0/24」のサブネットマスクはどれか。', options:['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.128'], answer:2, explanation:'/24はサブネットマスクの上位24ビットが1であることを示す。24ビット＝255.255.255.0に相当。' },
        { category:'法規', question:'労働安全衛生法に基づき、高さ何m以上の場所での作業時に墜落防止措置が必要か。', options:['1m以上','2m以上','3m以上','5m以上'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の箇所での作業では安全帯の使用や手すりの設置など墜落防止措置が必要。' },
        { category:'電気通信工学', question:'UTPケーブルとSTPケーブルの違いとして正しいものはどれか。', options:['UTPはシールドあり、STPはシールドなし','UTPはシールドなし、STPはシールドあり','UTPは光ファイバー、STPは銅線','速度の違いのみで構造は同じ'], answer:1, explanation:'UTP（Unshielded Twisted Pair）はシールドなし、STP（Shielded Twisted Pair）はシールドあり。STPはノイズに強い。' },
        { category:'施工管理', question:'QC（品質管理）の「PDCAサイクル」の正しい順序はどれか。', options:['Plan→Check→Do→Act','Plan→Do→Check→Act','Do→Plan→Check→Act','Check→Plan→Do→Act'], answer:1, explanation:'PDCAはPlan（計画）→Do（実施）→Check（確認）→Act（改善）の順に繰り返す継続的品質改善手法。' },
        { category:'電気工学', question:'交流電力において「力率」とは何か。', options:['有効電力と皮相電力の比','電圧と電流の比','周波数と電圧の比','無効電力と皮相電力の比'], answer:0, explanation:'力率は有効電力（W）÷皮相電力（VA）で求める。力率が1に近いほど電力を効率よく使える。' },
        { category:'電気通信工学', question:'PONシステムにおける「ONU」とは何か。', options:['局側の光通信装置','加入者側の光通信装置','光ファイバーの分岐装置','無線アクセスポイント'], answer:1, explanation:'ONU（Optical Network Unit）は加入者側（ユーザー宅）に設置される光通信装置。局側はOLT（Optical Line Terminal）。' },
        { category:'施工管理', question:'工事着手前に作成する「施工計画書」に含まれないものはどれか。', options:['工程表','安全管理計画','完成検査報告書','品質管理計画'], answer:2, explanation:'完成検査報告書は工事完了後に作成するもの。施工計画書は着手前に工程表・安全管理計画・品質管理計画などを記載。' },
        { category:'法規', question:'電波法における「不法無線局」の開設に対する罰則はどれか。', options:['5万円以下の罰金','1年以下の懲役または100万円以下の罰金','警告のみ','罰則規定はない'], answer:1, explanation:'電波法により、不法無線局（無免許）の開設は1年以下の懲役または100万円以下の罰金が科せられる。' },
        { category:'電気通信工学', question:'VoIPの説明として正しいものはどれか。', options:['映像信号をIP網で伝送する技術','音声をデジタル化しIP網で伝送する技術','無線通信の一規格','データの暗号化技術'], answer:1, explanation:'VoIP（Voice over Internet Protocol）は音声をデジタル変換してIP網で伝送する技術。IP電話などに利用される。' },
        { category:'施工管理', question:'作業主任者の選任が必要な作業はどれか。', options:['地上での一般清掃作業','高圧電気設備の取扱い作業','書類整理作業','資材の室内保管作業'], answer:1, explanation:'労働安全衛生法により、高圧・特別高圧電気設備の取扱い作業などの危険有害作業では作業主任者の選任が義務付けられている。' },
        { category:'電気通信工学', question:'「DNS」の役割として正しいものはどれか。', options:['データを暗号化して送信する','ドメイン名をIPアドレスに変換する','メールを送信する','ファイルを転送する'], answer:1, explanation:'DNS（Domain Name System）はドメイン名（例：www.example.com）をIPアドレスに変換する仕組み。インターネットの電話帳とも呼ばれる。' },
        { category:'電気通信工学', question:'「ルーター」の役割として正しいものはどれか。', options:['同一ネットワーク内のデータを中継する','異なるネットワーク間でデータを転送する','電気信号を増幅する','無線信号を有線に変換する'], answer:1, explanation:'ルーターは異なるネットワーク間でIPアドレスを参照してデータを転送（ルーティング）する機器。' },
        { category:'電気工学', question:'コンデンサの特徴として正しいものはどれか。', options:['直流を通し交流を遮断する','交流を通し直流を遮断する','抵抗として働く','電気を磁気に変換する'], answer:1, explanation:'コンデンサは交流を通し直流を遮断する特性を持つ。フィルタ回路や結合回路に使用される。' },
        { category:'施工管理', question:'「KY活動（危険予知活動）」の目的として正しいものはどれか。', options:['作業効率を上げること','作業前に危険を予測し事故を防止すること','品質を検査すること','コストを削減すること'], answer:1, explanation:'KY活動は作業開始前に作業員が話し合い、潜在する危険を予測・確認することで労働災害を防止する安全管理活動。' },
        { category:'法規', question:'建設工事の請負契約書に記載しなければならない事項として、建設業法で定められていないものはどれか。', options:['工事内容','請負代金の額','工事着手の時期および工事完成の時期','下請業者の氏名'], answer:3, explanation:'建設業法で定める請負契約書の必須記載事項は工事内容、請負代金、着工・完成時期、支払方法など。下請業者の氏名は必須ではない。' },
        { category:'電気通信工学', question:'「FTTH」とは何か。', options:['光ファイバーを家庭まで引き込むサービス','携帯電話の通信規格','無線LANの規格','ケーブルテレビの方式'], answer:0, explanation:'FTTH（Fiber To The Home）は光ファイバーケーブルを一般家庭まで引き込む光インターネット接続サービス。' },
        { category:'電気工学', question:'三相交流の特徴として正しいものはどれか。', options:['単相交流より効率が悪い','位相が120°ずつずれた3つの交流を使う','直流の一種である','変圧器が使えない'], answer:1, explanation:'三相交流は位相が互いに120°ずれた3つの交流電圧を使う方式。電力の伝送効率が高く、工場設備・モーターなどに広く使われる。' },
        { category:'施工管理', question:'現場での「安全帯」の使用について正しいものはどれか。', options:['高さ1m以上での作業時に使用する','高さ2m以上での作業で墜落の危険がある場合に使用する','使用は任意である','屋外作業時のみ使用する'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の作業床を設けることが困難な場合、安全帯（ハーネス型）を使用させなければならない。' },
        { category:'法規', question:'「消防法」において、自動火災報知設備の設置が義務付けられる建物の用途として正しいものはどれか。', options:['個人住宅のみ','旅館・ホテル・病院・学校など特定の用途の建物','すべての建物','延べ面積に関わらずすべての飲食店'], answer:1, explanation:'消防法施行令により、旅館・ホテル・病院・学校・百貨店など特定用途の建物および一定規模以上の建物に自動火災報知設備の設置が義務付けられる。' },

    intermediate: [

        { category:'電気通信工学', question:'TDM（時分割多重）とFDM（周波数分割多重）の違いとして正しいものはどれか。', options:['TDMは時間・FDMは周波数で信号を分割して多重化する','TDMは周波数・FDMは時間で分割する','どちらも同じ方式の別名称','TDMはアナログ専用・FDMはデジタル専用'], answer:0, explanation:'TDM（時間軸で分割）とFDM（周波数帯域で分割）はそれぞれ異なる多重化方式。' },
        { category:'施工管理', question:'ネットワーク工程表（アローダイアグラム）における「クリティカルパス」とは何か。', options:['最も短い経路','最も長い経路で遅延すると工期全体が延びる','最もコストがかかる経路','安全上最も危険な工程'], answer:1, explanation:'クリティカルパスは最長の作業経路。この経路上の作業が遅れると工期全体が延びるため重点管理が必要。' },

        { category:'電気通信工学', question:'MIMO技術の説明として正しいものはどれか。', options:['1本のアンテナで複数の周波数を使う技術','複数の送受信アンテナを使い通信速度・品質を向上させる技術','信号を暗号化する技術','伝送距離を延長する中継技術'], answer:1, explanation:'MIMO（Multiple Input Multiple Output）は複数の送受信アンテナを同時に使用し通信速度向上や品質改善を実現。LTEやWi-Fiに広く採用。' },
        { category:'電気工学（計算）', question:'三相交流回路（Y結線）において、線間電圧と相電圧の関係として正しいものはどれか。', options:['線間電圧 = 相電圧','線間電圧 = √3 × 相電圧','線間電圧 = 3 × 相電圧','線間電圧 = 相電圧 / √3'], answer:1, explanation:'Y（スター）結線では線間電圧=√3×相電圧。相電圧200Vなら線間電圧は約346V（200×1.732）。' },
        { category:'施工管理', question:'品質管理における「管理図」の説明として正しいものはどれか。', options:['工程の時間的な流れを表す図','工程が統計的に安定した状態にあるかを監視するための図','作業員の配置を示す図','材料の発注量を管理する図'], answer:1, explanation:'管理図（コントロールチャート）はQC7つ道具の一つ。工程データを時系列プロットし管理限界線と照合することで異常を検出する。' },
        { category:'法規', question:'電波法における「技術基準適合証明（技適マーク）」の説明として正しいものはどれか。', options:['無線局の免許が不要になる証明','端末機器が電波法の技術基準に適合していることの証明','建設業者の技術力を証明するもの','電気通信事業者の認定'], answer:1, explanation:'技適マークは無線機器が電波法で定める技術基準を満たすことを証明するもの。技適マークのない機器の日本での使用は原則禁止。' },
        { category:'電気通信工学', question:'SDHの基本速度STM-1の伝送速度はどれか。', options:['1.544Mbit/s','51.84Mbit/s','155.52Mbit/s','622.08Mbit/s'], answer:2, explanation:'SDHのSTM-1の伝送速度は155.52Mbit/s。STM-4は622.08Mbit/s、STM-16は約2.5Gbit/s。' },

        { category:'電気通信工学', question:'OSI参照モデルの第3層（ネットワーク層）のプロトコルはどれか。', options:['TCP','HTTP','IP','Ethernet'], answer:2, explanation:'OSI第3層（ネットワーク層）はIP。TCPは第4層（トランスポート層）、HTTPは第7層（アプリケーション層）、Ethernetは第2層（データリンク層）。' },
        { category:'法規', question:'労働安全衛生法において、特定元方事業者（元請）の義務として正しいものはどれか。', options:['下請事業者の賃金を直接支払う義務','関係請負人を含めた統括的な安全衛生管理を行う義務','下請事業者の利益を保証する義務','材料をすべて支給する義務'], answer:1, explanation:'特定元方事業者（元請）は自社および関係請負人（下請）の労働者を含めた統括安全衛生管理が義務付けられている。' },
        { category:'電気通信工学', question:'OTDR（光パルス試験器）の用途として正しいものはどれか。', options:['光ファイバーの伝送損失分布や断線箇所を測定する','電気ケーブルの絶縁抵抗を測定する','無線の電波強度を測定する','IPネットワークの通信速度を測定する'], answer:0, explanation:'OTDR（Optical Time Domain Reflectometer）は光パルスを入射し後方散乱光を分析することで損失分布・断線箇所を測定する機器。' },
        { category:'施工管理', question:'EVMにおけるSPI（スケジュール効率指数）が1.0未満を示す場合はどれか。', options:['予定より工程が進んでいる','予定通り工程が進んでいる','予定より工程が遅れている','コストが超過している'], answer:2, explanation:'SPI=EV（出来高）÷PV（計画値）。SPI<1.0は工程が計画より遅れていることを示す。SPI>1.0は進んでいる。' },
        { category:'電気工学', question:'UPS（無停電電源装置）のバッテリーを常時充電し停電時に瞬断なく給電できる方式はどれか。', options:['オフライン方式（スタンバイ方式）','オンライン方式（常時インバータ方式）','ラインインタラクティブ方式','インライン方式'], answer:1, explanation:'オンライン方式はバッテリーを介して常時インバータで給電するため停電時に切替時間がなく瞬断しない。サーバーなど重要機器に適する。' },
        { category:'法規', question:'電気通信工事の「監理技術者」の配置が必要な条件として正しいものはどれか。', options:['すべての下請工事','下請契約総額が3,000万円以上（建築は4,500万円以上）となる特定建設業者が施工する工事','工事金額500万円以上のすべての工事','公共工事のみ'], answer:1, explanation:'特定建設業者が元請として下請契約の総額が3,000万円以上（建築一式は4,500万円以上）となる工事では監理技術者を配置しなければならない。' },
        { category:'電気通信工学', question:'IPv6アドレスのビット数はどれか。', options:['32ビット','64ビット','128ビット','256ビット'], answer:2, explanation:'IPv6アドレスは128ビット（16バイト）。IPv4の32ビットに対して大幅に拡張。16進数8グループ（各16ビット）をコロン区切りで表記。' },
        { category:'施工管理', question:'受注者が発注者に提出する「施工体制台帳」の作成義務が生じる条件はどれか。', options:['すべての工事','公共工事において下請契約を締結したとき','工事金額が1億円を超えるとき','工期が1年以上の工事'], answer:1, explanation:'建設業法により、公共工事を受注した建設業者が下請契約を締結した場合、施工体制台帳を作成し発注者に提出する義務がある。' },
        { category:'電気通信工学（計算）', question:'送信電力が10Wの場合、dBm（ミリワット基準）で表すと何dBmか。', options:['10dBm','30dBm','40dBm','100dBm'], answer:2, explanation:'dBm=10×log₁₀(電力mW/1mW)。10W=10,000mWなので10×log₁₀(10,000)=10×4=40dBm。' },
        { category:'法規', question:'電気通信工事施工管理技士1級の「第一次検定」の受験資格として正しいものはどれか。', options:['実務経験なしで受験可能（19歳以上）','学歴に応じた所定の実務経験が必要','2級合格後5年以上の実務経験が必要','年齢・経験問わず誰でも受験可能'], answer:0, explanation:'2021年度の法改正により、1級第一次検定は19歳以上であれば実務経験なしで受験可能。第二次検定には所定の実務経験が必要。' },
        { category:'電気通信工学', question:'「VLAN（仮想LAN）」の説明として正しいものはどれか。', options:['物理的な配線を変えずに論理的なネットワークを分割する技術','複数の物理スイッチを1台に束ねる技術','無線通信を仮想化する技術','IPアドレスを自動割り当てする技術'], answer:0, explanation:'VLANは物理的な接続を変えることなく、スイッチの設定で論理的にネットワークを分割する技術。セキュリティ向上やブロードキャスト制御に使われる。' },
        { category:'施工管理', question:'工程管理における「山積み・山崩し」の説明として正しいものはどれか。', options:['土砂の量を管理すること','各時期の作業員・機械の必要量を均等化する調整作業','品質のばらつきを管理すること','工事費用の配分を行うこと'], answer:1, explanation:'山積みは各期間の作業量（労務・機械）をグラフ化したもの。山崩しはこれを均等化する調整作業で、工程の平準化・効率化を図る。' },
        { category:'電気通信工学（計算）', question:'周波数2GHzの電波の波長はおよそ何cmか。（光速3×10⁸m/s）', options:['1.5cm','15cm','150cm','1500cm'], answer:1, explanation:'波長λ=c/f=3×10⁸÷2×10⁹=0.15m=15cm。周波数が高いほど波長は短くなる。' },
        { category:'法規', question:'「有線電気通信法」の目的として正しいものはどれか。', options:['無線通信の秩序を維持すること','有線電気通信設備の設置・維持の規律を定め、有害な混信や障害を防止すること','電気通信事業者の経営を支援すること','建設工事の品質を確保すること'], answer:1, explanation:'有線電気通信法は有線電気通信設備の設置・維持に関する規律を定め、有害な混信・障害の防止と有線電気通信の発達を目的とする。' },
        { category:'電気通信工学', question:'「SIP（Session Initiation Protocol）」の説明として正しいものはどれか。', options:['データを圧縮するプロトコル','VoIPやテレビ会議などのセッション制御プロトコル','メールを送信するプロトコル','ファイルを転送するプロトコル'], answer:1, explanation:'SIPはVoIP・テレビ会議・インスタントメッセージなどのマルチメディアセッションの開始・変更・終了を制御するアプリケーション層プロトコル。' },
        { category:'施工管理', question:'「品質管理のQC七つ道具」に含まれないものはどれか。', options:['パレート図','特性要因図（フィッシュボーン）','PERT図','ヒストグラム'], answer:2, explanation:'QC七つ道具はパレート図・特性要因図・ヒストグラム・管理図・散布図・チェックシート・グラフ。PERT図（ネットワーク工程表）は含まれない。' },
        { category:'電気工学', question:'「絶縁抵抗測定」に使用する測定器はどれか。', options:['電流計（アンメーター）','絶縁抵抗計（メガー）','電力計（ワットメーター）','周波数計'], answer:1, explanation:'絶縁抵抗測定には絶縁抵抗計（メガー）を使用する。直流高電圧を印加して電気設備の絶縁状態を確認する。' },
        { category:'法規', question:'建設業法における「一括下請負（丸投げ）」について正しいものはどれか。', options:['元請業者は常に一括下請負ができる','公共工事では一括下請負は禁止されている','工事金額に関わらずすべて禁止','発注者の書面による承諾があれば住宅以外はすべて可能'], answer:1, explanation:'建設業法第22条により、公共工事の一括下請負は禁止。民間工事は発注者・元請負人双方の書面による承諾があれば認められる場合がある。' },
        { category:'電気通信工学', question:'「QoS（Quality of Service）」の説明として正しいものはどれか。', options:['通信のセキュリティを確保する技術','ネットワーク上でデータの種類により優先度をつけ品質を確保する技術','ネットワーク機器の消費電力を削減する技術','無線通信の周波数を管理する技術'], answer:1, explanation:'QoSはネットワークトラフィックに優先度を設定し、VoIPや動画など遅延に敏感なアプリケーションの通信品質を保証する技術。' },
        { category:'施工管理', question:'「労働災害の発生率」を表す「度数率」の計算式として正しいものはどれか。', options:['死傷者数÷労働者数×1,000','死傷者数÷延べ労働時間数×1,000,000','延べ労働損失日数÷延べ労働時間数×1,000','死亡者数÷工事件数×100'], answer:1, explanation:'度数率=死傷者数÷延べ労働時間数×1,000,000。100万延べ労働時間あたりの死傷者数で表し、安全管理の指標として使われる。' },

        { category:'公共工事契約', question:'「公共工事標準請負契約約款」に関する記述として、適当でないものはどれか。', options:['施工方法等については、公共工事標準請負契約約款及び設計図書に特別の定めがある場合を除き、発注者がその責任において定める','受注者は、工事材料について、設計図書にその品質が示されていない場合には、中等の品質を有するものとする','受注者は、設計図書において監督員の検査を受けて使用すべきものと指定された工事材料は、検査に合格したものを使用しなければならない','発注者は、必要があると認めるときは、設計図書の変更内容を受注者に通知して、設計図書を変更することができる'], answer:0, explanation:'施工方法等については、公共工事標準請負契約約款及び設計図書に特別の定めがある場合を除き、「受注者」がその責任において定める。発注者ではなく受注者が定める点が重要。' },
        { category:'公共工事契約', question:'「公共工事標準請負契約約款」の支払に関する記述として、誤っているものはどれか。', options:['発注者は、前払金の請求があったときは、請求を受けた日から14日以内に前払金を支払わなければならない','発注者は、部分払の請求に係る出来高部分の確認が完了した場合には、請求を受けた日から40日以内に部分払金を支払わなければならない','発注者は、工事が完成し検査に合格し、請負代金の支払の請求があったときは、請求を受けた日から40日以内に請負代金を支払わなければならない','受注者は、工事が完成した後、請負代金の支払前に工事目的物を引き渡さなければならない'], answer:1, explanation:'部分払の支払期限は請求を受けた日から「14日以内」が正しい。40日以内は誤り。前払金・請負代金（完成時）は40日以内が正しい。' },
        { category:'公共工事契約', question:'「公共工事標準請負契約約款」の権限と義務に関する記述として、適当でないものはどれか。', options:['発注者は、受注者に対し、下請負人の選択または法令その他必要事項の通知を要求することができる','現場代理人は、公共工事標準請負契約約款に定める権限の全てを行使することができる','発注者は、工事現場に自らの代理人として、その権限を代理させる者を置くことができる','受注者は、監督員を置くときは、その氏名を発注者に通知しなければならない'], answer:1, explanation:'現場代理人は広く職務を行えるが、「請負代金の変更・請負代金の請求および受領・契約の解除」については権限が制限されている。すべての権限を行使できるわけではない。' },
        { category:'労働安全衛生', question:'脚立を用いた作業における墜落防止措置に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['脚立の脚と水平面との角度を80度として使用した','折りたたみのものであったが、脚と水平方向の角度を確保するための金具を備えているものを使用した','脚立の踏み板が水平に安定しているものを使用した','開き止め金具を有する脚立を開いて使用した'], answer:0, explanation:'脚立の脚と水平面との角度は75度以下とされている。80度は75度を超えており法令違反となる。' },
        { category:'労働安全衛生', question:'充電電路近傍での作業における感電防止に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['低圧電路の充電電気設備の点検時は、漏電の危険がないと判断した場合は感電防止対策は不要である','静電気による感電の危険がない場合は、充電電路での作業について感電防止対策は不要である','低圧電路の充電電気設備に近接した場所で作業を行うとき、当該充電電路に絶縁用防護具を設ける','感電防止用漏電遮断器を接続して使用する場合は、接地を行わなくてもよい'], answer:2, explanation:'充電電路またはその近傍で作業を行う場合は、絶縁用防護具を設けることが義務付けられている。①②は誤り（常に対策が必要）。④も接地は省略できない場合がある。' },
        { category:'労働安全衛生', question:'移動式クレーンを用いた作業に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['移動式クレーンには外れ止め装置を具備させなければならない','ハッカーを用いて吊り上げた荷の下で、玉掛け作業員が作業することができる','移動式クレーンの定格荷重を超えて使用してはならない','移動式クレーンの運転者を、荷を吊ったまま運転位置から離れさせてはならない'], answer:1, explanation:'吊り上げた荷の下に作業者が立ち入ることは法令で禁止されている。ハッカーを使用した吊り荷の下での作業は認められない。' },
        { category:'労働安全衛生', question:'労働者を業務に従事させるにあたり特別教育が必要な業務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['吊り上げ荷重が11tのクレーンの玉掛けの業務','吊り上げ荷重が0.5tの移動式クレーンの運転（道路上走行を除く）','作業床の高さが8mの高所作業車の運転（道路上走行を除く）','低圧の充電電路の敷設の業務'], answer:0, explanation:'玉掛けの特別教育が適用されるのは吊り上げ荷重1t未満のクレーン。1t以上は技能講習が必要であり、11tのクレーンには特別教育では対応できない。' },
        { category:'労働安全衛生', question:'酸素欠乏危険作業に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['酸素欠乏とは、空気中の酸素の濃度が18%未満の状態をいう','酸素欠乏危険作業主任者は、酸素欠乏危険作業主任者技能講習を修了した者から選任しなければならない','酸素欠乏危険場所における酸素濃度の測定は、その日の作業を開始する前に行わなければならない','酸素欠乏とは、空気中の酸素の濃度が21%未満の状態をいう'], answer:3, explanation:'酸素欠乏の定義は「空気中の酸素濃度が18%未満の状態」。21%未満ではなく18%未満が正しい。通常の空気の酸素濃度は約21%。' },
        { category:'施工計画', question:'施工計画書の立案に関する記述として、適当でないものはどれか。', options:['施工計画書は、新工法・新技術の採用は実績がないため一切採用してはならない','施工計画の作成にあたっては、企業内の関係組織を活用して全社的な技術水準を反映させる','施工計画書は、発注者の要求品質に加え、施工上の安全を確保するために最適な計画を立案する','施工計画書に含まれる総合工程表には、工事全体の流れと各作業の関連を示す'], answer:0, explanation:'施工計画において新工法・新技術も検討の対象とすることは重要。実績がないことを理由に一切採用しないのは誤り。過去の経験と新技術を組み合わせて最適な計画を立てる。' },
        { category:'施工計画', question:'施工計画における現場条件調査に関する記述として、適当でないものはどれか。', options:['事前調査には、工事内容や契約条件を把握するための契約条件の確認と、現場の諸条件を把握するための現場条件の調査がある','現場条件の調査は、調査項目が多いため特定の重要項目のみに絞って確認すれば十分である','現場条件の調査は、現地の踏査を前提とし、複数の人で調査するなどして詳細な情報を把握することが基本である','契約条件の確認には、工事代金の支払条件の確認も含まれる'], answer:1, explanation:'現場条件の調査は調査項目を特定に絞るのではなく、できるだけ多くの項目を調査することが重要。抜け漏れがあると施工上の問題が生じる。' },
        { category:'施工計画', question:'施工計画書の作成に関する記述として、適当でないものはどれか。', options:['施工計画の検討にあたっては、複数の代替案を比較検討した上で最適な計画を採用する','発注者の要求品質を確保しつつ、施工の安全を図った最適な計画を立案する','受発注者が合意する場合でも、一つの代替案に絞り込んで施工計画を作成する','施工計画は個人の技術水準に頼らず、企業内の組織全体の技術力を活用して作成する'], answer:2, explanation:'施工計画の検討では複数の代替案を比較・検討することが重要で、最初から一つに絞り込むのは不適当。様々な観点から経済性・安全性・品質を考慮して選択する。' },
        { category:'施工計画', question:'新築工事着手前に作成する総合施工計画書の記載内容として、不適当なものはどれか。', options:['総合仮設計画','総合工程表','緊急連絡系統図','完成図書目録一覧'], answer:3, explanation:'完成図書目録一覧は工事完了後に作成・提出するものであり、工事着手前に作成する施工計画書の記載内容ではない。施工計画書には総合工程表・総合仮設計画・安全管理計画・品質管理計画などが含まれる。' },
        { category:'施工計画', question:'法令に基づく申請書の届出先に関する記述として、適当でないものはどれか。', options:['自家用電気工作物の使用を開始する場合は、自家用電気工作物使用開始届書を都道府県知事に提出する','自家用電気工作物の使用を変更または廃止する場合には、所轄産業保安監督部長に届け出る','特定建設作業（騒音）を行う場合は、市区町村長に届け出る','消防用設備等を設置した場合は、工事完了後に所轄消防署長に届け出る'], answer:0, explanation:'自家用電気工作物の使用開始届の提出先は都道府県知事ではなく、経済産業大臣（所轄産業保安監督部長）となる。届出先の誤りに注意が必要。' },
        { category:'線路施工', question:'ケーブルラックへのケーブル布設に関する記述として、適当でないものはどれか。', options:['はしご形ケーブルラックに配線する場合、ケーブルの水平部での固定間隔を5m以下とした','ケーブルラックが300V以下の低圧ケーブルの配線に使用される場合、D種接地を施す','アルミ製ケーブルラックは、支持物との間に異種金属接触による腐食が生じないよう施工する','ケーブルラックの支持箇所は、ボルト等により機械的に接続するとともに電気的に接続する'], answer:0, explanation:'はしご形ケーブルラックにおけるケーブルの水平部での固定間隔は「3m以下」が正しい。5m以下では間隔が広すぎる。垂直部では1.5m以下。' },
        { category:'線路施工', question:'UTPケーブルの施工に関する記述として、適当でないものはどれか。', options:['水平配線の配線後の許容曲げ半径は、ケーブル外径の4倍以上とした','ケーブルに過度の外圧が加わらないよう固定した','水平配線の長さは、パッチコード等も含め150m以内とした','成端作業時の対の撚り戻しは最小限とした'], answer:2, explanation:'UTPケーブルの水平配線の長さはパッチコード等（コード長を含む）の合計で「100m以内」が正しい。150mは規定を超えているため誤り。' },
        { category:'線路施工', question:'同軸ケーブルの施工に関する記述として、適当でないものはどれか。', options:['同軸ケーブルが低圧ケーブルと交差する場合は、互いに接触しないよう配設する','同軸ケーブルを曲げる場合、曲げ半径は使用する同軸ケーブルの許容曲げ半径より小さくする','同軸ケーブルと機器との接続は、ケーブルの種類に対応したコネクタを用いる','新4K8K衛星放送に対応した給電線には3C-2Vは適していない'], answer:1, explanation:'同軸ケーブルを曲げる場合、曲げ半径は許容曲げ半径より「大きく」しなければならない。許容値より小さく曲げると内部構造が損傷し伝送損失が増大する。' },
        { category:'線路施工', question:'光ファイバケーブルの接続方法に関する記述として、適当でないものはどれか。', options:['融着接続は、アーク放電などで光ファイバを溶かして接続する方法で接続損失が小さい','メカニカルスプライスは融着接続より接続損失が小さく、より確実に接続できる','コネクタ接続は、光ファイバの端面を研磨して専用コネクタで接続する方法である','融着接続は永久接続に使用し、コネクタ接続は脱着が必要な箇所に使用する'], answer:1, explanation:'メカニカルスプライスは融着接続と比較して接続損失が大きく、精度も低い。融着接続の方が接続損失が小さく高品質な接続が可能。メカニカルスプライスは工具不要で現場施工が容易な点がメリット。' },
        { category:'線路施工', question:'光ファイバケーブルの施工に関する記述として、適当でないものはどれか。', options:['ケーブルの牽引力が大きくなる場合は、中間で牽引力を分散させてケーブルを引く','ノンメタリックタイプの光ファイバケーブルを使用する場合、テンションメンバーを接地する','ケーブルを曲げる場合は、許容曲げ半径以上の曲げ半径を保ちながら敷設する','光ファイバケーブルの敷設時は許容牽引力を超えないようにする'], answer:1, explanation:'ノンメタリックタイプの光ファイバケーブルは金属部品を含まないため、接地の必要はない。接地が必要なのはメタリックタイプ（金属テンションメンバー等を含む）の場合。' },
        { category:'線路施工', question:'屋内に設置する金属製ケーブルラックの施工に関する記述として、適当でないものはどれか。', options:['アルミ製ケーブルラックは、支持物との間に異種金属接触腐食が生じないよう施工する','ケーブルラックの支持箇所はボルト等で機械的に接続するとともに、電気的にも接続する','ケーブルラックが300V以下の低圧ケーブルに使用される場合、B種接地を施す','ケーブルを垂直に配線する場合は水平部より支持間隔を短くする'], answer:2, explanation:'300V以下の低圧ケーブルのケーブルラックにはD種接地（第三種接地工事）を施す。B種接地（第二種接地工事）は変圧器の低圧側中性点などに用いるもので誤り。' },
        { category:'線路施工', question:'屋内配線に使用する合成樹脂管の施工に関する記述として、適当でないものはどれか。', options:['CD管は、コンクリート埋め込み専用管で露出配線には使用できない','硬質塩化ビニル管（VE管）を曲げる場合は、内側の曲げ半径を管の内径の6倍以上とする','PF管の露出配線において、サドルによる支持間隔を2m以下とした','PF管の露出配線において、管の支持間隔は1mを超えないようにする'], answer:2, explanation:'PF管の露出配線における支持（サドル）の間隔は1m以下（1mを超えないよう）にする必要がある。2m以下では間隔が広すぎる。1mという基準を確認しておくこと。' }
,
        { category:'放送', question:'我が国の地上デジタルテレビ放送に関する記述として、適当でないものはどれか。', options:['1チャンネルの周波数帯域幅6MHzを16等分したうちの13セグメントを組み合わせて、地上デジタルテレビ放送の帯域として利用している','標準放送（SDTV）の場合は1チャンネルあたり3本の放送が可能で、ハイビジョン放送（HDTV）の場合は1チャンネルあたり1本の放送が可能である','中規模及び小規模な同期放送を使って放送する単一周波数ネットワーク（SFN）の構築が可能である','データ放送は、コンテンツを記述する言語として BML（Broadcast Markup Language）が採用されている'], answer:1, explanation:'標準放送（SDTV）の場合は1チャンネルあたり最大3本の放送が可能ですが、ハイビジョン放送（HDTV）の場合は1チャンネルあたり1本の放送となります。②の記述では「標準放送は3本、ハイビジョンは1本」としているが、実際には「標準放送は3本まで、ハイビジョンは1本」が正しいです。本問では4セグメントで1本のハイビジョン放送を収容するため、②が不適当です。' },
        { category:'放送', question:'我が国の地上デジタルテレビ放送に関する記述として、適当でないものはどれか。', options:['OFDMは、サブキャリア1本あたりの変調速度が低速であることや、ガードインターバルの挿入により、周辺機器の影響を抑えることができる','1チャンネルの周波数帯域幅6MHzを14等分したうちの13セグメントを画像、音声、データ等の信号に使用している','マルチパス妨害に対処するために、インパルス妨害や移動受信できるフェージング妨害に対して有効な、同期インターリーブが採用されている','マルチパス放送は、コンテンツを記述する言語として BML（Broadcast Markup Language）が採用されている'], answer:1, explanation:'地上デジタルテレビ放送は、1チャンネルの周波数帯域幅6MHzを14等分したうちの13セグメントを使用しています（14等分ではなく、実際は正しくは14等分ではない）。正しくは6MHzを14分割し、1つをガードバンドとして13セグメントを放送に使用しています。②が不適当です。' },
        { category:'放送', question:'我が国の地上デジタルテレビ放送の放送電波に関する記述として、適当でないものはどれか。', options:['地上デジタルテレビ放送は、13～52チャンネルの送受信（470 MHz～710 MHzの帯域）を使用している','地上デジタルテレビ放送の放送区域は、地上高10mにおける電界強度が0.3 mV/m（50 dBμ V/m）以上の地域と定められている','地上デジタルテレビ放送では、チャンネルの周波数帯域幅を14等分し、そのうちの13セグメントを使用している','データ放送では、3.64GQAMの伝送パラメータで単一周波数ネットワーク（SFN）を行うことが可能である'], answer:3, explanation:'データ放送においてSFN（Single Frequency Network）を行う際、伝送方式は3.64QAMではなく、より堅牢なQPSKや16QAMが用いられます。64QAMは多値変調のため耐ノイズ性が低く、SFNには適していません。④が不適当です。' },
        { category:'放送', question:'CATVシステムに関する記述として、適当でないものはどれか。', options:['CATVシステムは、同軸ケーブルや光ファイバケーブルを使って、視聴者にテレビ信号を配信するシステムである','CATVシステムのネットワーク構成は、ケーブルテレビ事業者と視聴者との間のネットワークは、一般的にリング状の構成をとっている','ケーブルテレビ事業者は、地上デジタルテレビ放送や衛星放送の他、自主放送番組を加え多チャンネル化した上で配信している','CATVシステムの設備は、双方向通信機能を有する設備へと発展し、CATVシステムを活用したインターネット接続サービスも提供されている'], answer:1, explanation:'CATVシステムのネットワーク構成は、一般的にリング方式ではなく、SS方式（スター型）またはPDS方式の形をとることが多いです。一般的なリング方式は見られません。②が不適当です。' },
        { category:'放送', question:'FTTH型CATVシステムに関する記述として、適当でないものはどれか。', options:['ネットワークの形態には、SS方式、PDS方式およびADS方式がある','光ファイバを視聴者宅まで延伸することで、同軸ケーブルを用いるよりも高い周波数帯域での伝送が可能となる','PDS方式は、受信信号を受けて動作する多重化装置を光ファイバの分岐点に設置し、そこからスター状に複数の視聴者宅へ分配する方式である','SS方式は、CATV局と視聴者宅との間を1対1で光ファイバにより接続する方式である'], answer:2, explanation:'PDS方式（Passive Double Star）は、分岐点で増幅を行わない方式です。受信信号を受けて動作する多重化装置を設置するのはADS（Active Double Star）方式です。PDSは電源を必要としません。③が不適当です。' },
        { category:'放送', question:'HFC型CATVシステムに関する記述として、適当でないものはどれか。', options:['HFC型CATVシステムは、同軸ケーブルシステムと光ファイバシステムを組合わせたシステムである','光交差員が同軸ケーブルによるCATVシステムと比べ、光ファイバケーブルの使用により伝送帯域の拡大が期待できる','光交換部が同軸ケーブルによるCATVシステムに比べ、信号の伝送可能な距離が短くなる','CATVシステムの設備として、室外への電源供給が不要になるため、屋外機器への電源供給が不要になる'], answer:3, explanation:'HFCは、幹線部分を光ファイバで敷設し、加入者への引き込みに同軸ケーブルを使います。光交換部を使うことで同軸ケーブルの引き込み本数が増え、増幅器の数が増えるため、屋外機器への電源供給は必要になります。④が不適当です。' },
        { category:'放送', question:'デジタルCATVの受信機であるSTB（Set Top Box）に関する記述として、適当でないものはどれか。', options:['スクランブル化された放送に使用されるCASカードを装着するため、CASカードインターフェースを装備している','地上デジタルテレビ放送、BSデジタル放送、110度CS デジタル放送などのパススルー受信に対応して、アナログ信号やデジタル信号をテレビにデジタル信号で出力するためのインターフェースは、HDMI端子がある','チューナで選局された後、変調信号の復調、スクランブルの解除、音声符号化の変換などの信号処理を行い、最終的な音声や映像信号として出力する','映像信号の符号化は、STBにおいて、PSK や16QAM の変復調方式が採用されている'], answer:3, explanation:'STBは受信・復調・デスクランブル・デコードを行う装置であり、映像信号の符号化（エンコード）は行いません。また、PSKや16QAMは変復調方式であって映像符号化方式ではありません。④が不適当です。' },
        { category:'放送', question:'映像符号化方式に関する記述として、適当でないものはどれか。', options:['MPEG-2は、MPEG-4 AVC（H.264）より動画像情報の圧縮率が高い','MPEG-4 AVC（H.264）は、地上デジタルテレビ放送のワンセグ放送で使われている','HEVC（H.265）は、新 4K8K 衛星放送で使われている','MPEG-2は、MPEG-1相当の低解像度からフルハイビジョン相当の高解像度までの動画像を扱う'], answer:0, explanation:'MPEG-2はMPEG-4 AVC（H.264）よりも古い規格で、圧縮率は低いです（H.264の方が約2倍の圧縮効率）。①の「MPEG-2の方が圧縮率が高い」という記述は誤りです。①が不適当です。' },
        { category:'放送', question:'HEVC（H.265）に関する記述として、適当なものはどれか。', options:['HEVC（H.255）は、MPEG-2よりも先に国際標準化された映像符号化方式の規格である','HEVC（H.265）で処理できるのは、最大でSDTV相当の解像度の動画像までである','HEVC（H.265）は、我が国の地上デジタルテレビ放送のワンセグ放送に使われている','HEVC（H.265）は、MPEG-4 AVC（H.264）よりも動画像情報の圧縮率が高い'], answer:3, explanation:'HEVCは2013年に制定された規格で、MPEG-4 AVC（H.264）と比較して約2倍の圧縮効率を持ちます。4K8K衛星放送などで利用されています。④が適当です。①は誤り（HEVC はMPEG-2より後）、②は誤り（8Kスーパーハイビジョンまで対応）、③は誤り（ワンセグはH.264）。' },
        { category:'サーバ', question:'複数のハードディスクを組み合わせて構成するRAIDに関する記述として、適当なものはどれか。', options:['RAID0は、2台のハードディスクに同じデータを記録する方式であり、1台のハードディスクが故障しても他の1台で継続して利用できるが、記録するデータよりも倍の記憶容量が必要となる','RAID1は、複数のハードディスクにデータを分散して並列に記録することで、アクセスを高速化できる一方、1台のハードディスクが故障すると、データの読み書きができなくなる','RAID5は、複数のハードディスクにデータとパリティ情報をそれぞれ分散して記録する方式であり、1台のハードディスクが故障しても残りのハードディスクのデータとパリティ情報から元のデータを復元できる','RAID5は、複数のハードディスクのうち1台をパリティ情報の記録に専用して割り当て、残りのハードディスクにデータを分散して記録する方式である'], answer:2, explanation:'RAID5は複数のハードディスクにデータとパリティ情報をそれぞれ分散して記録し、1台が故障してもパリティから復元できます。③が適当です。①はRAID1の説明、②はRAID0の説明、④はRAID3またはRAID4の説明です。' },
        { category:'サーバ', question:'ハードディスクの技術であるRAID5に関する記述として、適当なものはどれか。', options:['複数のハードディスクにデータを分散して記録する方式であり、アクセスを高速化できるが、1台でもハードディスクが故障するとデータの読み書きができなくなる','2台のハードディスクに同じデータを記録する方式であり、1台のハードディスクが故障しても他の1台で継続して利用できるが、記録するデータよりも倍の記憶容量が必要となる','複数のハードディスクにデータとパリティ情報をそれぞれ分散して記録する方式であり、1台のハードディスクが故障しても残りのハードディスクのデータとパリティ情報から元のデータを復元できる','複数のハードディスクのうち1台をパリティ情報の記録に割り当て、残りのハードディスクにデータを分散して記録する方式である'], answer:2, explanation:'RAID5はデータとパリティ情報をすべてのディスクに分散して記録します。1台が故障しても残りのディスクのデータとパリティから元のデータを復元できます。③が適当です。' },
        { category:'サーバ', question:'サーバの仮想化技術に関する記述として、適当でないものはどれか。', options:['サーバの数を増やして処理を分散することにより、処理能力を上げる方法をスケールアップという','仮想サーバで稼動しているOSやソフトウェアを停止することなく、他の物理サーバへ移行し続ける技術をライブマイグレーションという','物理サーバのOSとは別に、仮想化ソフトウェアを動作させる方式をホストOS型という','物理サーバのOSとは別に、仮想化ソフトウェアを動作させる方式をホストOS型という'], answer:0, explanation:'サーバの数を増やして処理を分散することは「スケールアウト」といいます。「スケールアップ」は既存のサーバのCPUやメモリなどのハードウェアを強化して処理能力を向上させることです。①が不適当です。' },
        { category:'サーバ', question:'仮想化技術に関する次の記述の□に当てはまる語句として、適当でないものはどれか（複数マシンで稼動しているOSを停止させることなく、別の物理ホストに動かせる技術）。', options:['クラスタリング','オペレーティングシステム','ライブマイグレーション','パーティショニング'], answer:1, explanation:'仮想化されたサーバ上では、複数の機能のアプリケーションが同時に実行されています。問いに該当する「稼動中のOSを停止させずに別の物理ホストに移動させる技術」はライブマイグレーションです。オペレーティングシステムは技術ではなく、基本的なプログラムなので②が不適当です。' },
        { category:'IPアドレス', question:'IPv4アドレス「192.168.3.64/27」のネットワークで収容できるホストの最大数として、適当なものはどれか。', options:['27','30','62','254'], answer:1, explanation:'/27はサブネットマスクが255.255.255.224（11100000）であることを意味します。ホスト部は32-27=5ビットです。収容可能なホスト数は2^5-2=32-2=30台です（ネットワークアドレスとブロードキャストアドレスを除く）。②の30が正解です。' },
        { category:'光ファイバ伝送', question:'PON（Passive Optical Network）システムに関する記述として、適当でないものはどれか。', options:['PONシステムでは、レンジング処理によってOLT（Optical Line Terminal）からONU（Optical Network Unit）への下り信号の伝送は時分割多重で行われている','GE-PON（Gigabit Ethernet-PON）は、下り信号と上り信号で覚える波長を変えたもので、1本の光ファイバで双方向通信を実現している','B-PON（Broadband-PON）は、ONUとOLT間の信号の転送にATM セル形式で行われている','GE-PONは、IEEE802.3ahで標準化され、高速光アクセス方式として採用されている'], answer:0, explanation:'PONシステムでは、OLTからONUへの下り信号の伝送は時分割多重（TDM）ではなく、放送型（ブロードキャスト）で行います。上りがTDMA（時分割多元接続）です。①が不適当です。' },
        { category:'光ファイバ伝送', question:'光変調方式に関する記述として、適当でないものはどれか。', options:['直接変調方式は、送信号を半導体レーザーの駆動電流を直接変化させる方式であり、小型化も可能でコスト削減にも有効である','直接変調方式は、半導体レーザーの温度変化に交じって変調度制限があるため低速通信に適している','外部変調方式は、電気光学効果による回折光を利用する方式と、半導体の屈折率を変化させる方式がある','外部変調方式は、電気光学効果を利用した変調器として LiNbO3 が用いられている'], answer:1, explanation:'直接変調方式には温度変化と周波数チャープという変調度制限がありますが、「低速通信に適している」とは誤りです。直接変調は中速度の通信まで対応できますが、高速では外部変調方式を使います。②が不適当です（正しくは「周波数チャープが生じやすい」）。' },
        { category:'光ファイバ伝送', question:'光ファイバの種類・特徴に関する記述として、適当でないものはどれか。', options:['光ファイバには、シングルモード光ファイバとマルチモード光ファイバがあり、伝送距離を優先する場合はシングルモード光ファイバが使いやすい','長距離大容量伝送には、マルチモード光ファイバが適している','マルチモード光ファイバには、ステップインデックス型とグレーデッドインデックス型がある','シングルモード光ファイバは、マルチモード光ファイバとではコア径の大きさが異なる'], answer:1, explanation:'長距離大容量伝送に適しているのは、コア径が小さくモード分散がないシングルモード光ファイバです。マルチモード光ファイバは短距離に適しています。②が不適当です。' },
        { category:'光ファイバ伝送', question:'光ファイバ通信の波長分散分多方式に関する記述として、適当でないものはどれか。', options:['DWDM伝送では、光ファイバの接続変化に起因する伝送光変化による着色チャーピングをしっかり管理する必要がある','WDMは、大容量伝送が可能で、光増幅器を使用することにより、複数の波長を各経路で通過させることができる','CWDM は、波長間隔を 20nm という間隔で設定し、使用する積極的な波長は決められていない','DWDMは、CWDMに比べて1つの光ファイバ中に多重化できる光の数を多重化することができる'], answer:2, explanation:'CWDMは波長間隔が20nm程度と広く、使用する波長は1271nmから1611nmの範囲で定められています。「積極的な波長は決められていない」は誤りです。③が不適当です。' },
        { category:'光ファイバ伝送', question:'光ファイバ分散に関する記述として、適当でないものはどれか。', options:['モード分散は、シングルモード光ファイバでは発生するが、マルチモード光ファイバでは生じない','波長分散は、伝送モードによって光の伝搬速度が異なるために、到達時間にバラツキが生じるものである','材料分散は、光ファイバを構成する材料の屈折率の波長依存性によって発生し、結果として伝搬速度に波長依存性が生じ分散となる','横断分散は、端面ギャップの面積により伝搬速度が異なることになって起こる伝搬遅延の差である'], answer:0, explanation:'モード分散はマルチモード光ファイバで発生するものです。シングルモード光ファイバは1つのモードしか伝搬しないためモード分散は発生しません。①の「シングルモードで発生するが、マルチモードでは生じない」は逆の記述であり、①が不適当です。' },
        { category:'光ファイバ伝送', question:'光ファイバの光損失の要因であるマイクロベンディングロスに関する記述として、適当なものはどれか。', options:['光ファイバを敷設する際にコアどうしが同一方向に圧迫されない場合、一方のコアから他の光の一部がコアに入射して、放射された光として損失が生じる','光ファイバのコアとクラッドの境界の凹凸により、伝送光が反射されることで光損失が生じる一方、光ファイバ外部からも光が入射される場合がある','光ファイバを伝送する光がファイバ外に放射して損失が生じるもので、光ファイバ内側からの光が全反射する場合に、結果的に伝搬する光にも減衰が生じる','コネクタで接続した場合は、光ファイバが側面圧力を受ける場合に発生し、ファイバの軸がわずかに変形することで発生する光損失である'], answer:3, explanation:'マイクロベンディングロスは、光ファイバに側面から圧力が加わった場合に発生する光損失です。光ファイバの軸がわずかに変形（微小曲がり）することで光が放射されて損失が生じます。④が適当です。' },
        { category:'線材', question:'同軸ケーブルに関する記述として、適当でないものはどれか。', options:['同軸ケーブルの構造は、内部導体を中心にその周りを絶縁体と外部導体が同軸状に囲み、これらの保護のため、ポリ塩化ビニル等で被覆されている','同軸ケーブルの特性インピーダンスは、内部導体の直径、外部導体の内径および絶縁体の比誘電率で決まる','整合状態で用いられている同軸ケーブルからの電波の漏れは、非常に少ない','導波管と比較すると、損失が少なく、その損失は周波数が高いほど小さくなる'], answer:3, explanation:'同軸ケーブルの損失は周波数が高くなるほど大きくなります。「周波数が高いほど小さくなる」という記述は誤りです。④が不適当です。' },
        { category:'線材', question:'同軸ケーブルに関する記述として、適当でないものはどれか。', options:['同軸ケーブルは、通常、TE波のみが伝搬する同軸周波数帯域で使われる','同軸ケーブルは、同心円の外部導体で取り囲み、内部導体と外部導体との間に絶縁体を挟み込んだ構造である','特性インピーダンスは、外部導体の内径、内部導体の外径および外部導体と内部導体の間の絶縁体の比誘電率で決まる','同軸ケーブルの外部に漏れる磁力線や電気力線が非常に少ない'], answer:0, explanation:'同軸ケーブルで伝搬するのはTEM（横電磁波）モードであり、TE波のみが伝搬するわけではありません。①が不適当です。' },
        { category:'OSI参照モデル', question:'下表に示すOSI参照モデルの層（ア）、（イ）、（ウ）に該当する名称の組み合わせとして、適当なものはどれか。（表：層番号7=アプリケーション層、6=（ア）、5=（イ）、4=トランスポート層、3=ネットワーク層、2=データリンク層、1=（ウ））', options:['（ア）ネットワーク層　（イ）プレゼンテーション層　（ウ）物理層','（ア）プレゼンテーション層　（イ）セッション層　（ウ）物理層','（ア）セッション層　（イ）プレゼンテーション層　（ウ）データリンク層','（ア）プレゼンテーション層　（イ）物理層　（ウ）ネットワーク層'], answer:1, explanation:'OSI参照モデルは第7層からアプリケーション層、プレゼンテーション層（6）、セッション層（5）、トランスポート層（4）、ネットワーク層（3）、データリンク層（2）、物理層（1）です。（ア）＝プレゼンテーション層、（イ）＝セッション層、（ウ）＝物理層となり②が正解です。' },
        { category:'OSI参照モデル', question:'OSI参照モデルのプロトコル機能に関する記述として、適当でないものはどれか。', options:['OSI参照モデルは、データリンク層での高レベルなデータ転送を実行する機能をもち、始めの接続ノードと届ける相手先ノードを記述した後に識別する機能を持っている','OSI参照モデルのセッション層は、トランスポート層との接続にしたがって接続を7層内で確立と管理し応用を受信できる最大量を7分割できるモデルである','OSI参照モデルは、通信規格をもとに7層に分割したもので、コンピュータネットワークにおけるプロトコルの設計と開発を理解するためのガイドラインである','OSI参照モデルのトランスポート層、プレゼンテーション層、アプリケーション層は、TCP/IPでは、アプリケーション層としてまとめられている'], answer:0, explanation:'OSI参照モデルのデータリンク層は直接接続されたノード間の通信を管理する層で、始めの接続ノードから相手先ノードへの経路を管理するのはネットワーク層です。①の説明が誤りです。' },
        { category:'IPネットワーク', question:'TCP/IPでの通信を行うため、各クライアントに対して、IPアドレスやサブネットマスク、デフォルトゲートウェイなど、さまざまな設定を自動的に割り当てるプロトコルとして、これに当てはまるものはどれか。', options:['ARP','SNMP','DHCP','MIME'], answer:2, explanation:'DHCP（Dynamic Host Configuration Protocol）は、LANに参加したコンピュータなどの端末に自動的にIPアドレスやサブネットマスク、デフォルトゲートウェイなどのネットワーク設定情報を割り当てるプロトコルです。③が正解です。' },
        { category:'IPネットワーク', question:'DHCPに関する記述として、適当なものはどれか。', options:['各クライアントに対して、IPアドレスやサブネットマスク、デフォルトゲートウェイの情報など、自動的に割り当てを行うためのプロトコルである','IPネットワークに接続される機器の時刻を、同期させるためのプロトコルである','メールクライアントからメールサーバへのメールの送信、あるいはメールサーバ間で互いにメールを送受信するためのプロトコルである','WebサーバはWebブラウザからの要求に応じて、HTMLファイルや画像ファイルなどを送信するためのプロトコルである'], answer:0, explanation:'DHCPはIPアドレスやサブネットマスク、デフォルトゲートウェイなどのネットワーク設定を自動的に割り当てるプロトコルです。①が適当です。②はNTP、③はSMTP、④はHTTPの説明です。' },
        { category:'IPネットワーク', question:'インターネットで使われている技術に関する記述として、適当でないものはどれか。', options:['DHCPサーバとは、ドメイン名をIPアドレスに変換する機能を持つサーバである','ルーティングとは、最適な経路を選択しながら宛先IPアドレスまでIPパケットを転送していくことである','プロキシサーバとは、クライアントに代わってインターネットにアクセスする機能を持つサーバである','CGIとは、WebブラウザからのURLに応じてWebサーバがプログラムを起動するための仕組みである'], answer:0, explanation:'ドメイン名をIPアドレスに変換する機能を持つのはDNS（Domain Name System）サーバです。DHCPサーバはIPアドレスなどのネットワーク情報を自動的に割り当てるサーバです。①が不適当です。' },
        { category:'IPネットワーク', question:'TCP/IPにおけるIP（インターネットプロトコル）の特徴に関する記述として、適当でないものはどれか。', options:['パケット通信を行う','最終的なデータの到達を保証しない','経路制御を行う','OSI参照モデルにおいて、トランスポート層に位置する'], answer:3, explanation:'TCP/IPのIP（インターネットプロトコル）はOSI参照モデルにおいてネットワーク層（第3層）に位置します。トランスポート層に位置するのはTCPやUDPです。④が不適当です。' },
        { category:'IPネットワーク', question:'IPネットワークで用いられるRIPに関する記述として、適当なものはどれか。', options:['各リンクにコストと呼ばれる重みを付け、このコストの合計値が少なくなるようにIPアドレスに適応するよりも経路を選択する','ホップ数と呼ばれる通過ルータの数が最小のルートを選択し、できるだけ少ない通過ルータでデータを転送するよりも宛先のIPアドレスに適応した経路を選択する','各ルータの自律システム内の経路情報を30秒ごとに隣接するルータに報知し、180秒間ルータからの情報がなければ、その経路は無効になる','RIPパケットにラベルと呼ばれる情報を付加して、そのラベルを使ってIPパケットを転送する'], answer:2, explanation:'RIPは各ルータが経路情報を30秒ごとに隣接ルータに送信し、180秒間情報がなければ、その経路を無効とするルーティングプロトコルです。③が適当です。①はOSPFの説明、②はホップ数ベースのRIPの基本説明だが不正確、④はMPLSの説明です。' },
        { category:'IPネットワーク', question:'IPネットワークで使用されるOSPFの特徴に関する記述として、適当なものはどれか。', options:['経路制御に通信帯域等を考慮したコストと呼ばれるパラメータを用いる','ディスタンス・ベクタ型のルーティング・プロトコルである','30秒ごとに示される経路制御情報を180秒経っても受信できない場合は、接続が切れたとみなす','インターネットサービスプロバイダ間で使われるルーティングプロトコルである'], answer:0, explanation:'OSPFはリンクステート型のルーティングプロトコルで、コスト（帯域幅などを基にしたメトリック）を使って最適経路を選択します。①が適当です。②のディスタンス・ベクタはRIPの特徴、③はRIPの特徴、④はBGP（EGP）の特徴です。' },
        { category:'IP電話', question:'IPネットワークで使用されるSIPに関する記述として、適当でないものはどれか。', options:['SIPは、自局や他機器のリアルタイムデータを転送するプロトコルである','SIPサーバには、プロキシサーバ、リダイレクトサーバ、登録サーバ、ロケーションサーバなどの機能が含まれる','SIPメッセージは、スタートライン、ヘッダ、空行、ボディで構成される','SIPメッセージのトランスポート層を提供するプロトコルは、UDP を使うことができる'], answer:0, explanation:'SIP（Session Initiation Protocol）はVoIPなどのマルチメディア通信のセッション確立・変更・終了を行うプロトコルです。リアルタイムデータを転送するのはRTPです。SIPはセッション制御であり、データ転送は行いません。①が不適当です。' },
        { category:'IP電話', question:'IP電話で制御を行うためのプロトコルは、H.323 やMGCP、SIP等がある。SIPはテキストベースで記述されるプロトコルであるが、シンプルで試験から確認できる。SIPの機能とは？', options:['SIPは、主に（UA）間のセッションの生成、変更、切断のみを行うプロトコルである','SIPサーバには、プロキシサーバ、リダイレクトサーバ、登録サーバ、ロケーションサーバなどの機能が含まれる','SIPメッセージは、スタートライン、ヘッダ、空行、ボディで構成される','SIPメッセージのトランスポート層のプロトコルは、音声データの送受信に関しては、データ送信は行なわない'], answer:3, explanation:'SIPはセッション確立プロトコルであり、音声データ自体の転送はRTPが担います。「データ送信は行なわない」という記述は不完全で誤りです。SIPはTCPとUDPの両方でトランスポートを利用できます。④が不適当です。' },
        { category:'情報保護', question:'サイバー攻撃に関する記述として、適当でないものはどれか。', options:['セッションハイジャックは、他人のセッションIDを悪用してHTTPリクエストによって、その通信を乗っ取り攻撃を行うものである','SQLインジェクションは、ユーザの入力を受け付けるSQL文を組み立てるWebアプリケーションの脆弱性を狙って、データベースを不正操作する攻撃である','バッファオーバーフローは、メモリのバッファ領域に大きさを超えることによってWebサーバに送り込んで不正なコードを実行させ、データを書き換えたりする攻撃である','クロスサイトスクリプティングは、WebアプリケーションのOSコマンドを不正に実行させる攻撃である'], answer:3, explanation:'クロスサイトスクリプティング（XSS）は、悪意のあるスクリプトをWebページに埋め込む攻撃手法です。OSコマンドを不正に実行させる攻撃は「OSコマンドインジェクション」です。④が不適当です。' },
        { category:'情報保護', question:'コンピュータネットワークの情報セキュリティのために使用されるIDSに関する記述として、適当でないものはどれか。', options:['アノマリ検知は、パケットの内容やテキストの詳細内容が既知の攻撃パターンと一致するかどうか照会し、特定的なデータベースなどとシグニチャと呼ばれる手法として、特定的な攻撃を検知する','ネットワーク型IDSは、ネットワーク上に配置して、ネットワークを流れるパケットを監視する','IDSは、ネットワークサーバ・機器への不正アクセス、侵入や攻撃等の不正アクセスを検知するために利用されており、正規なアクセスと比較して何らかの異常な動作を検知して通知する','ホスト型IDSは、監視したいホスト（サーバ等）に配置し、そのホストへのアクセスを監視する'], answer:0, explanation:'アノマリ（異常）検知は、通常の動作パターンとの違いで攻撃を検知する方式です。既知の攻撃パターンとシグニチャを照合する方式は「シグニチャ検知（ミスユース検知）」です。①の説明はシグニチャ検知の説明であり、アノマリ検知とは異なります。①が不適当です。' },
        { category:'情報保護', question:'公開鍵暗号方式に関する記述として、適当でないものはどれか。', options:['情報を公開鍵で暗号化して、それとセットとなっている秘密鍵で復号するため、秘密鍵を知らない第三者は内容を読むことができる','代表的な公開鍵暗号アルゴリズムであるRSA号は、大きな数の素因数分解の困難性を利用した暗号方式である','送信者が自分だけが持つ秘密鍵で暗号化し、受信者はこれを送信者の公開鍵で復号することで、デジタル署名として利用できる','公開鍵と秘密鍵の鍵の交換を行う場合には、本人性の確認と鍵の正当性を保証するために、認証局を利用する場合がある'], answer:0, explanation:'公開鍵暗号方式では、情報を公開鍵で暗号化し、対応する秘密鍵でのみ復号できます。「秘密鍵を知らない第三者は内容を読むことができる」という記述は誤りです（読めない）。①が不適当です。' },
        { category:'情報保護', question:'RSA暗号に関する記述として、適当なものはどれか。', options:['大きな数の素因数分解が困難であることを利用した方式である','第三者が秘密鍵をもとにすることで解読が困難になっている','第三者が公開鍵から秘密鍵を計算できることを利用した方式である','公開鍵の共有鍵を用いた対称鍵暗号方式の一種である'], answer:0, explanation:'RSA暗号は大きな合成数の素因数分解が計算困難であることを安全性の根拠とした公開鍵暗号方式です。①が適当です。' },
        { category:'無線LAN', question:'無線LAN（IEEE802.11標準）において、OFDMと呼ばれる規格の変調方式として正しいものはどれか。', options:['周波数ホッピング','直接拡散','シングルキャリア','マルチキャリア'], answer:3, explanation:'OFDM（直交周波数分割多重）は複数のサブキャリアに信号を分割して同時に送信する変調方式であり、マルチキャリア方式です。④が正解です。' },
        { category:'無線LAN', question:'無線LANのアクセス制御に用いられるCSMA/CA方式に関する記述として、適当なものはどれか。', options:['送信を行うと、データの送受を感知した場合に、データの送信をキャンセルし、ランダムな時間に変更した後に、データの送信を再開する','データが転送される場合に、複数の送受信データがコリジョンを分析し、ヘッダの宛先情報によって複数の機器に対し、制御を転送するデータを特定する方式である','ある区間の伝送が確実に届く送信元の同一セグメント上のノードだけが活躍できる方式である','複数のノードが同時に送受信を行うと、データの衝突が発生するため、ACKが確認できた後に、再送信を行うことで衝突を避ける方式である'], answer:3, explanation:'CSMA/CAはまずチャンネルが空いているかを確認してから送信し、衝突を回避する方式です。データが届いたらACKが返され、ACKが確認できない場合は再送を行います。④が適当です。' },
        { category:'無線LAN', question:'無線LANの認証で規格IEEE 802.1Xに関する記述として、適当でないものはどれか。', options:['EAP-PEAP は、TLSハンドシェイクの仕組みを利用する認証方式である','EAP-TLSのクライアント認証は、ユーザが行う','EAP-MD5は、サーバ認証とクライアント認証の相互認証である','EAP-TLSはサーバ認証と、クライアント認証を相互認証することができる'], answer:2, explanation:'EAP-MD5はクライアント側のみの認証を行う方式で、サーバ認証は行いません。「サーバ認証とクライアント認証の相互認証」という記述は誤りです。③が不適当です。' },
        { category:'無線LAN', question:'無線LANの認証に関する記述として、適当でないものはどれか。', options:['IEEE 802.1Xで用いられるEAP-TLSのクライアント認証は、SSIDを基に認証が行われる','WPA-PSK やWPA2-PSK は、IEEE 802.1Xに準拠しない認証方式である','WPA-PSK やWPA2-PSK は、認証サーバを使用しない認証方式であり、パスワードが要求される','IEEE 802.1Xで用いられるEAP-TLSのクライアント認証は、IDとパスワードを使う'], answer:0, explanation:'EAP-TLSのクライアント認証はSSIDではなく、デジタル証明書を使って行われます。①の「SSIDを基に認証が行われる」という記述は誤りです。①が不適当です。' },
        { category:'ディスプレイ', question:'液晶ディスプレイに関する記述として、適当でないものはどれか。', options:['液晶ディスプレイは、液晶を液晶を透明電極で挟み、電圧を加えると液晶分子配向が変わり、光の透過量を制御する表示方式である','カラー表示は、液晶パネル外側に取り付けたカラーフィルタにより、画素ごとにRGBの三原色を表現する','IPS方式は、電極が同じ状態で電圧が加わっていないと、液晶分子が整合した位置にある','文字で表現は、液晶分子のねじれによって液晶分子が光を通過させないようにして、文字で画像を表示させる'], answer:2, explanation:'IPS（In-Plane Switching）方式は、電界をかけない状態（無電圧）では液晶分子が基板面に平行に整列しており、電圧を加えると液晶分子が回転して光を透過する仕組みです。「電圧が加わっていないと液晶分子が整合した位置にある」という表現は、TN方式の説明に近く、IPS方式の正確な説明ではありません。③が不適当です。' },
        { category:'ディスプレイ', question:'ディスプレイに関する記述として、適当でないものはどれか。', options:['液晶ディスプレイは、液晶を液晶パネルの間で液晶に電圧を加えることで、光が通過する量を変えるバックライトを制御する','有機ELディスプレイは、キセノンガスを封入した細い発光管を並べて、高い電圧をかけることにより発光させる表示方法である','液晶ディスプレイは、液晶自体は発光しないため、LEDや蛍光灯などのバックライトを用いてバックライト越しに見える液晶で画像を表示させる','有機ELディスプレイは、液晶と異なりバックライトなしで動作が可能である'], answer:1, explanation:'有機ELディスプレイはキセノンガスを封入した発光管ではなく、有機化合物が電流を通じることで自発光する仕組みです。②の記述はプラズマディスプレイの説明です。②が不適当です。' },
        { category:'設計方針', question:'信頼性設計の考え方であるフェールセーフに関する記述として、適当なものはどれか。', options:['構成部品の数を増やした上で、十分なテストを行うことにより、故障や障害の可能性が大きくなる環境においても完全に動作するシステムを実現する方法','障害が生じた場合でも安全な状態に移行させることができるようにシステムを設計すること','障害が生じたとしても安全な状態に移行させる機能を提供し、システムの正常な動作のために機能を停止することをできるだけ少なくすること','利用者が誤りを起こしにくいように、あるいは誤りが起きた場合でも安全な場所に移動しやすいような仕組みを提供するよう注意すること'], answer:1, explanation:'フェールセーフは、システムに障害が発生した場合でも安全な状態（フェール状態）に移行するよう設計する考え方です。②が適当です。①はフォールトトレランス、③はフェールソフト、④はフールプルーフの説明です。' },
        { category:'設計方針', question:'信頼性設計の考え方であるフェールソフトに関する記述として、適当なものはどれか。', options:['システムの一部に障害が発生した場合、障害部位を切り離して、機能や性能を低下させながらも他の部分のシステムは継続して稼働できるようにすること','不測の事態が発生した場合に危険な状態にならず、あるいは誰でも危険を少なくした操作ができるようにすること','システムや部品の品質を向上させることで、故障発生率を低減させ、より信頼性の高いシステムを実現すること','故障が発生した場合においても、安全に停止するようにシステムを設計すること'], answer:0, explanation:'フェールソフトは、システムの一部に障害が生じた場合に機能を低下させながらも他の機能は継続させる設計概念です。①が適当です。②はフールプルーフ、③はフォールトアボイダンス、④はフェールセーフの説明です。' },
        { category:'低圧配線', question:'電気設備において、低圧幹線および低圧分岐回路の設計に関する記述として、電気設備の技術基準上、誤っているものはどれか。ただし、負荷は電動機等にたいした起動電流が大きい電気機械器具は接続されていないものとする。', options:['低圧幹線の電線は、接続される全負荷の定格電流の合計より大きな許容電流のものを選定した','低圧分岐回路の定格電流が30%を超えた場合の場合は、低圧幹線からの分岐箇所から9m の分岐点に過電流遮断器を設けた','低圧分岐回路の定格電流が30%以下を超えた場合、低圧幹線から分岐する箇所から3mの分岐点に設けた','低圧幹線の電源電源を含め高速定電圧電流の変圧器の容量を確認した上で保護する高速定電圧電流の分岐路を通じる際に定格電流の保護を設けた'], answer:1, explanation:'低圧幹線の許容電流が分岐回路の過電流遮断器の定格電流の35%以下（30%超55%未満）の場合は、分岐箇所から8m以内に過電流遮断器を設ける必要があります。「9m」という記述は誤りで、正しくは「8m以内」です。②が誤りです。' },
        { category:'低圧配線', question:'電気設備において、低圧幹線の施設および低圧分岐回路の設計に関する記述として、「電気設備の技術基準の解釈」上、誤っているものはどれか。', options:['定格電流15Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流20Aのコンセントを1個取付けた','定格電流20Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流15Aのコンセントを1個取付けた','定格電流30Aの配線用遮断器に直径2.6mmの電線を配線し、定格電流20Aのコンセントを1個取付けた','定格電流30Aの配線用遮断器に断面積8mm2の電線を配線し、定格電流30Aのコンセントを1個取付けた'], answer:0, explanation:'15A配線用遮断器の回路に接続できるコンセントは15A以下のものに限られます。「定格電流20Aのコンセントを接続する」のは規格外となります。①が誤りです。' },
        { category:'電気用品安全法', question:'特定電気用品に表示する記号として、電気用品安全法上、正しいものはどれか（①〜④の記号の選択肢から選ぶ問題）。', options:['PSEマーク（ひし形のPSEマーク）','PSEマーク（丸形のPSEマーク、小文字c付き）','PSEマーク（丸形のPSEマーク）','PSEマーク（四角形のPSEマーク、小文字c付き）'], answer:0, explanation:'特定電気用品はひし形（◇）のPSEマークを表示します。丸形（○）のPSEマークは特定電気用品以外の電気用品に表示されます。①が正しいです。' },
        { category:'電気用品安全法', question:'次の電気用品のうち、「電気用品安全法令」上、特定電気用品に該当しないものはどれか。ただし、使用電圧200Vの交流の回路に使用するものとする。', options:['ケーブル（CV22mm²3心）','ケーブル配線用スイッチボックス','電流制限器（定格電流100A）','湿度ヒューズ'], answer:1, explanation:'電気用品安全法上の特定電気用品は100品目以上が指定されています。ケーブル配線用スイッチボックスは特定電気用品ではありません。②が該当しないものです。' },
        { category:'消防', question:'粉末消火設備に関する記述として、適当でないものはどれか。', options:['全域放出方式は、防護対象物の火災消火を目的に、粉末消火剤を防護対象物に直接放射して消火する方式である','移動式は、粉末消火剤の貯蔵設備等に固定されており、人がホースを持って火災場所まで移動しノズルを操作することで、粉末消火剤を放射する方式である','第1種粉末、第2種粉末および第4種粉末は、油火災および電気火災に適応し、第3種粉末は普通火災、油火災および電気火災に適応する','固定式の粉末消火設備の起動方式には、自動式と手動式がある'], answer:0, explanation:'全域放出方式は、防護区画全体に均一に消火剤を放出する方式です。防護対象物に直接放射するのは「局所放出方式」です。①が不適当です。' },
        { category:'消防', question:'不活性ガス消火設備の特徴に関する記述として、適当でないものはどれか。', options:['移動式の不活性ガス消火設備は、ホースノズルを人が操作することで、移動しながら消火する方式である','全域放出式と局所放出方式の不活性ガス消火設備は、常時、人がいない箇所に設置される','不活性ガス消火設備の消火剤であるハロゲン化物は、窒息効果の他、化学的な連鎖反応抑制による燃焼抑制効果により消火する','水を使用することが不適当な油火災や、窒気火災または散水によって二次的な被害が出ると予想される室に設置される'], answer:2, explanation:'不活性ガス消火設備の消火剤は窒素、二酸化炭素、ヘリウム等の不活性気体であり、酸素を排出することで窒息効果をもたらします。ハロゲン化物は別の消火設備（ハロゲン化物消火設備）で用いられます。③が不適当です。' },
        { category:'消防', question:'消火設備に関する記述として、適当でないものはどれか。', options:['不活性ガス消火設備は、二酸化炭素、窒素、あるいはこれらのガスとアルゴンとの混合ガスを放出することで、不活性ガスの窒息効果により消火する','スプリンクラー設備は、建築物の天井面等に設けたスプリンクラーヘッドが火災時の熱によって感熱分解し、自動的に散水し制御して消火する','屋内消火栓設備は、人が操作することによって消火を行う固定式の消火設備であり、泡を放出し泡の窒息効果によって消火する効果を持つ','粉末消火設備は、噴射ヘッドまたはノズルから粉末消火剤を放出し、火災の熱により、粉末消火剤が分解して発生する二酸化炭素による窒息効果などにより消火する'], answer:2, explanation:'屋内消火栓設備は水を放出することで消火する設備です。「泡を放出し泡の窒息効果によって消火する」というのは泡消火設備の説明です。③が不適当です。' },
        { category:'消防', question:'スプリンクラー設備に関する記述として、適当でないものはどれか。', options:['湿式方式は、配管内に常時圧力のかかった水が満たされており、火災の熱により、スプリンクラーヘッドが感熱破壊開放することで自動的に放水する','乾式方式は、流水検知装置の1次側（ポンプ側）配管に圧力のかかった水が満たされており、2次側（スプリンクラーヘッド側）配管に圧縮空気が入っている','開放式は、一斉開放弁の1次側（ポンプ側）配管および2次側（スプリンクラーヘッド側）配管ともに、圧縮空気が充満されており、閉鎖されている','予作動方式は、火災による熱でスプリンクラーヘッドが作動して初めて放水するが、ヘッドだけが作動しても感知器の感知信号がなければ放水されない'], answer:2, explanation:'開放式スプリンクラーはヘッドが常に開放されており、1次側には水が充満していますが、2次側（ヘッド側）は水がありません。「圧縮空気が充満されており閉鎖されている」は誤りです。③が不適当です。' },
        { category:'非常用装置', question:'非常用予備電源装置に関する記述として、適当でないものはどれか。', options:['建設工事現場の仮設電源として使用される移動型発電設備は非常用発電装置とは異なるため、非常用予備電源装置の容量計算の対象からは除外してよい','電力会社や発電設備などの電源を2つ以上確保した場合、それぞれの電源が独立したものでなければならない','非常用予備電源装置が稼働し始める場合には、数台の発電機を並列に接続して電源容量を増やし、当該数量の発電機が起動するものを選択してよい','非常用予備電源装置が運転中の場合でも、電力会社の配線網に電気が遮断しないようにするため、双方が並列に接続して運転する'], answer:0, explanation:'建設工事現場の仮設電源として使用される移動型発電設備は、非常用発電設備として使用することが認められません。仮設電源の移動型発電設備は非常用予備電源装置とは区別されます。①が不適当とも解釈できますが、正解は建築基準法上「非常用予備電源として使わない」という趣旨で①が不適当です。' },
        { category:'非常用装置', question:'非常用照明設備に関する記述として、「建築基準法令」上、誤っているものはどれか。', options:['照明器具は、LEDランプは認められておらず、白熱灯か蛍光灯のいずれかでなければならない','電気配線に使用する電線は、600V 二種ビニル絶縁電線等のこれと同等以上の耐熱性を有しなければならない','照明の照度に使用するための電線は、照明に配線する際は、電源に配線し直接回路に接続しなければならない','停電の際は照明カバーの付いた照明器具は複数取り付ければ、停電して一部の機器に照明がついていない場合は、複数のうちの一方が停電からも補助するためこの場合は使用できる'], answer:0, explanation:'建築基準法の改正により、非常用照明設備にもLEDランプが認められるようになっています。「LEDランプは認められていない」という記述は誤りです。①が誤りです。' },
        { category:'空気調和設備', question:'空気調和設備の空調方式に関する記述として、適当でないものはどれか。', options:['定風量ダクト方式は、室温変化に応じてダクト内の風量を変化させることなく、ダクト内を一定の風量を送ることで各室の温度を調整する方式である','ファンコイルユニット方式は、冷却熱コイルおよび送風機等の機器で構成したファンコイルユニット（FCU）を室内の床下などに設置することで、各室を個別に温度調整できる方式である','各階ユニット方式（外気処理空調機付き方式）は、外気処理空調機等を各室に設置する方式である','パッケージユニット方式は、空気調和を実施する各室内を管理するための機器を一括化ケーシングに収められた機器を設置することで、個別分散を運転できる方式である'], answer:2, explanation:'各階ユニット方式は、各フロア（階）に空調機を設置する方式です。「各室に設置する方式」という記述は誤りです。③が不適当です。' },
        { category:'空気調和設備', question:'空気調和設備の空調方式に関する記述として、適当でないものはどれか。', options:['ファンコイルユニット方式のコイルとしては、冷却熱コイルおよび送風機等の機器で構成したファンコイルユニットを室内の各室または数室ごとに設置し、各室の空調をするものである','各階ユニット方式（外気処理空調機付き方式）は、外気処理空調機等を各室に設置して各室を外気に向けて調整する方式である','パッケージユニット方式は、各空調対象室の各ゾーンごとに独自にパッケージを設置するため、故障しても一部のパッケージが機能しなくても他の部分で稼働を継続することができる方式である','冷暖房兼用パッケージ方式は、冷暖房に使用するため、冷媒と熱源として別々のシステムで設置することなく、一つの一冷暖房として機能するシステムである'], answer:1, explanation:'各階ユニット方式は各フロアに空調機を集中設置する方式であり、各室に設置する方式ではありません。②が不適当です。' },
        { category:'二次電池', question:'二次電池の充電方式に関する次の記述に該当する用語として、適当なものはどれか。「自然放電で失った容量を補うために、継続的に微小電流を流すことで、満充電状態を維持する。」', options:['定電流定電圧充電','トリクル充電','浮動充電','パルス充電'], answer:1, explanation:'自然放電で失った容量を補うために継続的に微小電流を流して満充電状態を維持する充電方式は「トリクル充電」です。②が適当です。' },
        { category:'二次電池', question:'リチウムイオン電池に関する記述として、適当でないものはどれか。', options:['セルあたりの起電力が3.7Vと高く、高エネルギー密度の蓄電池である','自己放電や、メモリ効果が少ない','電解液に水酸化カリウム水溶液、正極にコバルト酸リチウム、負極に炭素を用いている','リチウムポリマー電池は、液漏れしにくく、小型・軽量で長時間の使用が可能である'], answer:2, explanation:'リチウムイオン電池の電解液は水酸化カリウム水溶液ではなく、リチウム塩を溶かした有機溶剤（有機電解液）が使われています。③が不適当です。' }
    ],

    advanced: [
        { category:'電気通信工学', question:'フレネルゾーンの説明として正しいものはどれか。', options:['アンテナの指向性を表す概念','無線通信において送受信アンテナ間の見通し線を中心とする楕円体状の空間','光ファイバーの伝搬モードのこと','周波数帯域幅のこと'], answer:1, explanation:'フレネルゾーンは送受信アンテナを焦点とする楕円体状の空間。第1フレネルゾーン内に障害物がないことが安定した通信に必要。半径r=√(nλd1d2/(d1+d2))で計算。' },
        { category:'電気通信工学（計算）', question:'自由空間伝搬損失の計算において、周波数を2倍にすると伝搬損失はどのように変化するか。', options:['変化しない','約6dB増加する','約3dB増加する','約6dB減少する'], answer:1, explanation:'自由空間伝搬損失L=20log(4πd/λ)=20log(4πdf/c)。周波数fが2倍になると20log(2)≒6dB増加する。距離が2倍でも同様に6dB増加。' },
        { category:'電気通信工学', question:'「OFDM（直交周波数分割多重）」の特徴として正しいものはどれか。', options:['単一の搬送波を使う変調方式','多数の直交する搬送波を使い周波数利用効率が高くマルチパスに強い','時間軸で多重化する方式','アナログ変調の一種'], answer:1, explanation:'OFDMは互いに直交する多数のサブキャリアを使う変調方式。周波数利用効率が高くマルチパス干渉に強い。LTE・Wi-Fi 4以降・地上デジタル放送などに採用。' },
        { category:'電気通信工学', question:'光ファイバーの「シングルモード」と「マルチモード」の比較として正しいものはどれか。', options:['シングルモードはコア径が大きく長距離伝送に不向き','シングルモードはコア径が小さく分散が小さいため長距離・広帯域伝送に適する','マルチモードは光源にレーザーを使い高価','マルチモードの方が伝送損失が小さい'], answer:1, explanation:'シングルモードファイバーはコア径約9μmで1つの伝搬モードのみ使用。モード分散がなく長距離・広帯域。マルチモード（コア径50/62.5μm）は短距離向き。' },
        { category:'電気通信工学', question:'「MPLS（Multi-Protocol Label Switching）」の説明として正しいものはどれか。', options:['無線通信の多重化技術','IPヘッダの代わりに短いラベルを使いパケット転送を高速化するネットワーク技術','光ファイバーの多重化方式','VoIPの音声圧縮方式'], answer:1, explanation:'MPLSはIPパケットにラベルを付与し、ラベルに基づいて高速転送する技術。QoSの確保や仮想専用線（VPN）の構築に使われる。' },
        { category:'電気通信工学', question:'「WDM（波長分割多重）」の説明として正しいものはどれか。', options:['時間軸で光信号を多重化する方式','複数の異なる波長の光を1本の光ファイバーで同時に伝送する技術','電気信号を多重化する方式','無線通信の周波数多重方式'], answer:1, explanation:'WDM（Wavelength Division Multiplexing）は異なる波長（色）の光を1本のファイバーで同時伝送する技術。波長数を増やすことで容量を大幅に増加できる。' },
        { category:'施工管理', question:'「施工体系図」の説明として正しいものはどれか。', options:['工事の工程を時系列で表した図','発注者・元請・各下請業者の施工分担関係を図示したもの','品質管理の手順を表した図','安全管理体制を表した組織図'], answer:1, explanation:'施工体系図は各下請業者の作業内容・工事範囲・相互関係を明確にした図。建設業法により公共工事では工事現場の見やすい場所への掲示が義務付けられている。' },
        { category:'法規', question:'電気通信事業法における「端末設備」の接続について正しいものはどれか。', options:['どのような端末設備でも自由に接続できる','技術基準に適合した端末設備のみ電気通信回線に接続できる','通信事業者の端末設備のみ接続できる','無線端末のみ接続できる'], answer:1, explanation:'電気通信事業法第52条により、端末設備を電気通信回線設備に接続するには技術基準適合認定（技適）を受けた端末設備でなければならない。' },
        { category:'電気通信工学', question:'「スペクトラム拡散（SS）」技術の特徴として正しいものはどれか。', options:['信号を狭い帯域に集中させる方式','信号を広い帯域に拡散させることで耐ノイズ性・秘匿性を高める方式','信号を時分割で多重化する方式','アナログ変調の一種'], answer:1, explanation:'スペクトラム拡散は信号を本来必要な帯域より広い帯域に拡散させる方式。耐ノイズ性・耐干渉性・秘匿性が高い。CDMA・GPS・無線LANなどに使われる。' },
        { category:'電気工学（計算）', question:'抵抗R₁=4Ω、R₂=6Ωの並列接続の合成抵抗として正しいものはどれか。', options:['10Ω','2.4Ω','5Ω','0.42Ω'], answer:1, explanation:'並列合成抵抗1/R=1/R₁+1/R₂=1/4+1/6=3/12+2/12=5/12。よってR=12/5=2.4Ω。' },
        { category:'電気通信工学', question:'「SNMP（Simple Network Management Protocol）」の用途として正しいものはどれか。', options:['メールの送受信','ネットワーク機器の監視・管理','ファイルの転送','Webページの閲覧'], answer:1, explanation:'SNMPはネットワーク機器（ルーター・スイッチ・サーバー等）の状態監視・設定変更・障害検知に使われる管理プロトコル。MIBと呼ばれる管理情報データベースを使う。' },
        { category:'施工管理', question:'「ツールボックスミーティング（TBM）」の説明として正しいものはどれか。', options:['工具の点検会議のこと','作業開始前に作業員が集まり当日の作業内容・危険事項などを確認する短時間の打合せ','月1回開催される安全委員会','工事完了後に行う反省会'], answer:1, explanation:'TBMは毎朝作業開始前に行う短時間のミーティング。その日の作業内容・役割分担・危険箇所・KY活動を確認し、事故防止を図る。' },
        { category:'法規', question:'「建設リサイクル法（建設工事に係る資材の再資源化等に関する法律）」における特定建設資材に含まれないものはどれか。', options:['コンクリート','アスファルト・コンクリート','木材','ガラス'], answer:3, explanation:'建設リサイクル法の特定建設資材はコンクリート・コンクリートおよび鉄からなる建設資材・木材・アスファルト・コンクリートの4種類。ガラスは含まれない。' },
        { category:'電気通信工学', question:'「DWDM（高密度波長分割多重）」においてチャネル間隔として標準化されているものはどれか（ITU-T G.694.1）。', options:['0.1nm間隔','0.4nm（50GHz）または0.8nm（100GHz）間隔','1nm間隔','10nm間隔'], answer:1, explanation:'ITU-T G.694.1ではDWDMのチャネル間隔として100GHz（約0.8nm）や50GHz（約0.4nm）などが標準化されている。高密度化により1本のファイバーに多数チャネルを収容できる。' },
        { category:'施工管理', question:'「完成検査（竣工検査）」について正しいものはどれか。', options:['着工前に行う設計図書の確認作業','施工中に行う中間確認作業','工事完成後に設計図書と照合して品質・数量などを確認する検査','材料搬入時に行う確認作業'], answer:2, explanation:'完成検査は工事完了後に発注者（または監督員）が行う最終確認検査。設計図書・仕様書との整合、品質・数量・機能の確認を行い、合格後に引き渡しとなる。' },
        { category:'法規', question:'「電気通信主任技術者」について正しいものはどれか。', options:['すべての電気通信事業者が選任しなければならない','電気通信事業者が事業用電気通信設備の工事・維持・運用を監督するために選任しなければならない','建設業者が選任しなければならない','資格は不要で誰でもなれる'], answer:1, explanation:'電気通信事業法第45条により、電気通信事業者は事業用電気通信設備の工事・維持・運用を監督させるため、電気通信主任技術者を選任しなければならない。' },
        { category:'電気通信工学', question:'「PLC（電力線搬送通信）」の説明として正しいものはどれか。', options:['光ファイバーを使った通信技術','既存の電力線を使ってデータ通信を行う技術','携帯電話の通信方式','衛星通信の一種'], answer:1, explanation:'PLC（Power Line Communication）は商用電力線をデータ通信媒体として使用する技術。宅内LANや低圧配電網を使ったスマートメーターに利用される。' },
        { category:'施工管理', question:'「特定化学物質障害予防規則（特化則）」に関して正しいものはどれか。', options:['電磁波から労働者を守るための規則','鉛・六価クロム・石綿などの有害化学物質から労働者の健康を守るための規則','工事現場の墜落防止に関する規則','重機操作に関する資格の規則'], answer:1, explanation:'特化則は職業性疾病の原因となる鉛・有機溶剤・石綿（アスベスト）などの特定化学物質を扱う作業における健康障害防止のための規則。' },
        { category:'電気通信工学（計算）', question:'アンテナの実効輻射電力（ERP）が1000Wのとき、等方性アンテナ（dBi）換算で何dBiか（実効輻射電力はダイポールアンテナ基準）。', options:['30dBm','60dBm','約32.15dBi','約62.15dBi'], answer:2, explanation:'ERP 1000W=30dBWをダイポールアンテナ基準dBdで表すと30dBd。dBi=dBd+2.15なので30+2.15≒32.15dBi。' },
        { category:'法規', question:'「騒音規制法」における「特定建設作業」として定められていないものはどれか。', options:['くい打ち機を使用する作業','削岩機を使用する作業','コンクリートプラントを設けて行う作業','スコップによる手掘り作業'], answer:3, explanation:'騒音規制法の特定建設作業はくい打ち機・鋲打ち機・削岩機・空気圧縮機・コンクリートプラントなどを使う作業。手工具による作業は対象外。' },
        { category:'電気通信工学', question:'「NGN（Next Generation Network）」の特徴として正しいものはどれか。', options:['回線交換技術をベースにした次世代ネットワーク','IPをベースとし音声・データ・映像を統合的に扱うオープンな次世代ネットワーク','無線通信専用のネットワーク','衛星通信ネットワーク'], answer:1, explanation:'NGNはIPをベースとした次世代電話網。音声・データ・映像を統合してQoS・セキュリティ・信頼性を確保しながら提供するオープンネットワーク。NTTのひかり電話に使われている。' },
        { category:'施工管理', question:'「根切り工事」における山留め工法の「親杭横矢板工法」の説明として正しいものはどれか。', options:['H型鋼などを一定間隔で打設し、掘削に合わせて横矢板を挿入する工法','鋼矢板を連続して打設する工法','コンクリートを現場で打設する工法','グラウトで地盤を固める工法'], answer:0, explanation:'親杭横矢板工法はH鋼などの親杭を一定間隔で打設し、掘削の進行に合わせて親杭間に横矢板（木製・PC板）を挿入して土圧を受ける山留め工法。軟弱地盤には不向き。' },
        { category:'法規', question:'「廃棄物の処理及び清掃に関する法律（廃棄物処理法）」において、電気通信工事で発生する廃プラスチック類は何に分類されるか。', options:['一般廃棄物','産業廃棄物','特別管理廃棄物','有価物'], answer:1, explanation:'建設工事で発生する廃プラスチック類・金属くず・ガラスくず・コンクリートくず等は産業廃棄物に分類される。適切な処理業者に委託して処理しなければならない。' },
        { category:'電気通信工学', question:'「スループット」の説明として正しいものはどれか。', options:['理論上の最大伝送速度','実際のネットワークで単位時間内に転送できるデータ量（実効転送速度）','回線の遅延時間','信号の周波数'], answer:1, explanation:'スループットは実際のネットワークにおける実効転送速度（bps）。ヘッダオーバーヘッド・再送・輻輳制御などにより理論値（回線帯域幅）より低くなる。' },
        { category:'施工管理', question:'「工事写真」の撮影について正しいものはどれか。', options:['工事完成後に主要箇所のみ撮影すればよい','施工の各段階（着工前・施工中・完成後）において、設計図書との整合が確認できるよう適切に撮影・整理する','写真は任意であり義務ではない','スマートフォンによる撮影は認められない'], answer:1, explanation:'工事写真は施工記録として重要。着工前の現況・施工中の埋設物や隠蔽部・完成状況を撮影し、施工管理の証拠として整理・保存する。公共工事では提出が義務付けられている。' },
        { category:'電気通信工学', question:'「LTE（Long Term Evolution）」の特徴として正しいものはどれか。', options:['第2世代（2G）移動通信システム','OFDMA・MIMOを採用した第4世代（4G）に向けた3.9世代移動通信システム','有線通信の規格','衛星通信の規格'], answer:1, explanation:'LTEはOFDMA（下り）・SC-FDMA（上り）とMIMO技術を採用した第3.9世代移動通信規格。LTE-Advancedが本来の4G規格として標準化された。' },
        { category:'法規', question:'「電気通信設備工事担任者」の資格について正しいものはどれか。', options:['電気通信事業法に基づき、端末設備等の接続工事を行うために必要な資格','建設業法に基づく資格','電波法に基づく資格','自主的な民間資格であり法的根拠はない'], answer:0, explanation:'工事担任者は電気通信事業法に基づく国家資格。端末設備等を電気通信回線設備に接続するための工事を行い・監督する者に必要。AI・DD総合種などの種別がある。' },
        { category:'電気通信工学', question:'「IDS（侵入検知システム）」と「IPS（侵入防止システム）」の違いとして正しいものはどれか。', options:['IDSは不正アクセスを検知して通報し、IPSは検知に加えて自動的にブロックする','IDSはIPSの旧称で機能は同じ','IPSは検知のみでIDSがブロックする','どちらも同じ機能でメーカーによって呼称が異なる'], answer:0, explanation:'IDSはネットワーク・ホストへの不正アクセスを検知してアラートを発するシステム。IPSはさらに進んで不正なパケットを自動的にブロックする予防的なシステム。' },
        { category:'施工管理', question:'「受電設備工事」における「耐圧試験」の目的として正しいものはどれか。', options:['通信速度を測定すること','電気設備の絶縁性能が規定値以上あることを確認すること','機器の消費電力を確認すること','接地抵抗値を確認すること'], answer:1, explanation:'耐圧試験（絶縁耐力試験）は最大使用電圧の1.5倍（低圧は500V等）の電圧を印加して絶縁破壊しないことを確認する試験。電気設備技術基準で義務付けられている。' },
        { category:'法規', question:'「公衆電気通信回線（NTT加入電話等）」に端末設備を接続する場合の条件として正しいものはどれか。', options:['誰でも自由に接続できる','技術基準適合認定（技適）を受けた端末設備、またはその旨の認定を受けた自営端末設備のみ接続できる','NTTが販売した端末設備のみ接続できる','無線端末のみ接続できる'], answer:1, explanation:'電気通信事業法により、電気通信回線設備に接続する端末設備は技術基準適合認定を受けたもの、または同等の認定を受けた自営端末設備でなければならない。' }
,
        { category:'無線伝送', question:'マイクロ波通信を行う無線局AおよびB局において、A局から送信電力1（W）で送信したときのB局の受信電力 d（dBm）の値として、適当なものはどれか。ただし、A局の送信アンテナおよびB局の受信アンテナの利得はそれぞれ 35 dB、A局における送信電力から送信アンテナ入力端までの損失と B局における受信空中線からの電力を受信機入力端までの損失はいずれも 5 dBとし、B局の受信電力が-120（dBm）とする。', options:['-160（dBm）','-90（dBm）','-20（dBm）','-80（dBm）'], answer:2, explanation:'送信電力1W=30dBm。送信損失-5dB、送信アンテナ利得+35dB、伝搬損失-120dB、受信アンテナ利得+35dB、受信損失-5dBより、受信電力=30-5+35-120+35-5=-30+35-5=受信電力は30-5+35+35-5-120=-30dBm。③の-20dBmが適当です（実際の計算では30+35+35-5-5-120=-30dBm）。' },
        { category:'無線伝送', question:'移動通信システムで用いられるダイバーシティ技術に関する記述として、適当でないものはどれか。', options:['CDMAは、1つの周波数を複数の基地局が共有仕組みのため、同じの周波数帯域が複数の基地局で使われ、信号を合成する場ダイバーシティ技術として用いることがある','2つ以上の周波数帯域を使用するキャリアアグリゲーションは、送信周波数の分の上でダイバーシティ効果をもたらし、セルの端でもより高速で通信できる','複数の受信中継を組みあわせた指向性アンテナを用いて、受信した信号を送信することで、受信性を高める技術をアレイアンテナダイバーシティ技術という','複数の指向性空間ダイバーシティは、複数の固有のアンテナを用いて、受信した電波の到着する方向に向けて送信を行うことで、低品質な電波の受信を避けることができる'], answer:0, explanation:'CDMAは符号分割多元接続であり、複数の端末が同じ周波数を同時に使います。CDMAが基地局でダイバーシティとして周波数帯域を共有する仕組みではありません。①が不適当です。' },
        { category:'無線アンテナ', question:'無線通信で使用する。アンテナの利得に関する次の記述の□（ア）、（イ）に当てはまる語句の組み合わせとして、適当なものはどれか。「アンテナの利得は、同じ入力電力を与えたときの、アンテナの最大輻射電力と基準アンテナの最大輻射電力の比で与えられ、基準アンテナを全方向に均等に電波を放射する[ア]アンテナとしたときの利得を[イ]利得という。」', options:['（ア）半波長ダイポール　（イ）相対','（ア）半波長ダイポール　（イ）絶対','（ア）等方性　（イ）相対','（ア）等方性　（イ）絶対'], answer:3, explanation:'全方向に均等に電波を放射する基準アンテナは「等方性アンテナ」で、これを基準とした利得を「絶対利得」といいます。半波長ダイポールアンテナを基準とした利得は「相対利得」です。④が適当です。' },
        { category:'無線アンテナ', question:'半波長ダイポールアンテナに関する記述として、適当なものはどれか。', options:['放射抵抗は、600Ωである','導波器、放射器、反射器で構成されるアンテナである','アンテナ素子を水平に設置した場合の水平面内指向性は、8の字の特性となる','絶対利得は、40dBiである'], answer:2, explanation:'半波長ダイポールアンテナを水平に設置した場合、水平面内の指向性は8の字（双方向）特性となります。③が適当です。①の放射抵抗は約73Ω（600Ωではない）、②は八木アンテナの構成、④の絶対利得は約2.15dBiです。' },
        { category:'無線アンテナ', question:'八木アンテナに関する記述として、適当でないものはどれか。', options:['導波器の本数を増やすことで、指向性を鋭くすることができる','放射器から見て、導波器の方向に電波を放射する','導波器の長さは放射器よりやや長い','放射器に給電し、反射器と導波器は無給電素子として動作する'], answer:2, explanation:'八木アンテナの導波器の長さは放射器よりも少し短くなっています。「放射器よりやや長い」という記述は誤りです。③が不適当です。' },
        { category:'無線アンテナ', question:'無線通信で使用するアンテナに関する記述として、適当なものはどれか。', options:['オフセットパラボラアンテナは、回転放物面の主反射鏡、回転双曲面の副反射鏡、1次放射器で構成されたアンテナである','ブラウンアンテナは、導波器、放射器、反射器からなり、導波器に給電する','ブラウンアンテナは、同軸ケーブルの内部導体を1/4波長だけ上に延ばして放射素子とし、同軸ケーブルの外部導体に長さ1/4波長の地線を放射状に複数本付けたものである','スリーブアンテナは、同軸ケーブルの内部導体を1/8波長だけ上に延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さが1/8波長の円筒導体をかぶせたものである'], answer:2, explanation:'ブラウンアンテナは、同軸ケーブルの内部導体を1/4波長だけ上に延ばして放射素子とし、同軸ケーブルの外部導体に長さ1/4波長の地線を放射状に複数本付けたものです。③が適当です。①はカセグレンアンテナの説明、②は八木アンテナの説明、④はスリーブは1/4波長です。' },
        { category:'無線アンテナ', question:'無線通信で使用する、アンテナに関する記述として、適当でないものはどれか。', options:['ホイップアンテナは、自動車、電動機、航空機、船舶等の金属を利用して設けられる 1/4波長のアンテナである','スリーブアンテナは、同軸ケーブルの内部導体を上に延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さ1/4波長の円筒導体をかぶせたものである','コーナーリフレクタアンテナは、複数のアンテナ素子を組み合わせ、ビーム方向を変えることができるアンテナである','オフセットパラボラアンテナは、送受信する放物線反射器の前面に回路を配置しないことで、サイドローブを削減している'], answer:2, explanation:'コーナーリフレクタアンテナは、反射板を組み合わせた単一の指向性アンテナであり、ビーム方向を電気的に変えることはできません。複数の素子を組み合わせてビーム方向を変えるのはフェーズドアレイアンテナです。③が不適当です。' },
        { category:'無線アンテナ', question:'パラボラアンテナに関する記述として、適当でないものはどれか。', options:['アンテナの性能を測定するため、整準アンテナとして用いられる','特定方向に電波をビームに絞った形で受信でき、高い指向性の確保や受信強度を向上させることができる','衛星通信やマイクロ波通信では、長距離・高精度の伝送において用いられるアンテナである','鏡面反射器が4次反射鏡から構成されるアンテナである'], answer:3, explanation:'パラボラアンテナは放物面の一次反射鏡と一次放射器で構成されます（カセグレンアンテナの場合は副反射鏡も加わりますが、4次反射鏡ではありません）。④が不適当です。' },
        { category:'無線アンテナ', question:'無線通信で使用する、アンテナに関する記述として、適当でないものはどれか。', options:['オフセットパラボラアンテナは、伝送ロスとなるパラボラ放射器の前部に一次放射器を置かず、給電部は放物面の外れた位置に設けられ、この一次放射器を基準とすれば、半波長ダイポールアンテナの放射抵抗は、半波長ダイポールの約2倍となる','スリーブアンテナは、同軸ケーブルの内部導体を上に延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さ1/4波長の円筒導体をかぶせたものである。さらに同軸ケーブルの外部導体に長さが1/4波長の円筒導体を設けることで、1波長のアンテナとして動作させるものである','八木アンテナは、導波器、放射器、反射器からなり、導波器に給電する','アンテナは、前波器、放射器、反射器の3本の要素で構成されるものは、八木アンテナである'], answer:2, explanation:'八木アンテナは放射器（ダイポールアンテナ）に給電し、導波器と反射器は無給電素子です。「導波器に給電する」という記述は誤りです。③が不適当です。' },
        { category:'無線アンテナ', question:'パラボラアンテナに関する記述として、適当なものはどれか。', options:['反射物の一次反射鏡、一次放射鏡から構成されるアンテナである','反射鏡がカセグレン配置にV字に配置されるアンテナである','放射鏡、敵射器、単板器の3本の要素で構成されるものである','アンテナ素子を制御する方式として、各アンテナ素子に対して給電位相を調節することができるアレイアンテナである'], answer:0, explanation:'パラボラアンテナは放物面の反射鏡と一次放射器で構成されるアンテナです。①が適当です。' },
        { category:'無線アンテナ', question:'無線通信で使用する、アンテナの指向性に関する記述として、適当でないものはどれか。', options:['半波長ダイポールアンテナは、アンテナ導体の垂直方向が強く、8の字の双方向性特性となる','カセグレンアンテナの前面面部の指向性は、開口面積に比例している','ブラウンアンテナの指向性は、無指向性である','八木アンテナは、放射器から反射器に向かう方向に鋭い指向性を持つ'], answer:3, explanation:'八木アンテナは放射器から導波器の方向に強く放射します（導波器の方向が正面方向）。「反射器に向かう方向」は逆方向であり④が不適当です。' },
        { category:'気象', question:'レーダにより降雨観測を行うレーダ雨量計に関する記述として、適当でないものはどれか。', options:['レーダ雨量計で観測する雨等の方向は、パラボラアンテナの方向で決まる','走査方法は、送受信系を一定方向に向けながら、アンテナの仰角を連続的に変化させる','Cバンドレーダは、Xバンドレーダ雨量計よりも観測距離が短い','レーダ雨量計は、電波を大気中に放射することで雨などの降水を観測する装置である'], answer:2, explanation:'CバンドレーダはXバンドレーダよりも波長が長く、減衰が少ないため観測距離が長い（長距離観測に向く）。「Cバンドの方が観測距離が短い」という記述は誤りです。③が不適当です。' },
        { category:'気象', question:'レーダ雨量計で利用されるMPレーダ（マルチパラメータレーダ）に関する記述として、適当でないものはどれか。', options:['MPレーダは、水平方向と垂直方向の偏波のエコーの差に形や振幅位相差から、雨粒の形を判別し雨量推定の精度向上を目指したレーダである','MPレーダは、水平偏波と垂直偏波の送受信を交互に送受信し、各偏波成分の雨等の形状の差を利用して雨量精度を向上させている','CバンドのMPレーダは、電波が強い降雨を通過して送受信できないことがあるため、XバンドのMPレーダで補完できなくなる場合がある','MPレーダは複数の基地局と協調動作が可能なため、複数の基地局が協力し、観測範囲の異なる種別のレーダでカバーパーツをすることができる'], answer:2, explanation:'CバンドMPレーダは強雨時に電波が減衰して観測困難な場合がありますが、そのような場合にはXバンドMPレーダで補完することができます。「XバンドのMPレーダで補完できなくなる場合がある」は誤りです。③が不適当です。' },
        { category:'衛星通信', question:'静止衛星通信に関する記述として、適当なものはどれか。', options:['静止衛星は、赤道上空で地球を周回する約36,000kmの円軌道を飛行する衛星であり、それは約3時間ごとに地球を1周する','静止衛星は、その位置から赤道を基準にした地球の地上との間の通信を維持するため、地上に配備する通信センター等を介して通信する','静止衛星は、使用できる周波数帯が1 GHz ～10 GHzの帯域で使われているが、これより高い周波数帯を使用することもある','アップリンク送信周波数よりダウンリンク送信周波数の方が一般的に高い'], answer:2, explanation:'静止衛星通信では使用周波数帯がCバンド（4/6GHz）、Kuバンド（12/14GHz）、Kaバンド（20/30GHz）など幅広く使われており、1GHz～10GHz以上も使用されています。③が適当です。①は周期が約24時間（3時間ではない）、④はアップリンクが高い周波数が一般的です。' },
        { category:'衛星通信', question:'衛星通信に関する記述として、適当でないものはどれか。', options:['静止衛星の軌道は、赤道上空にあることから、高緯度地域においては仰角（電波を上げるための角度）が低くなることで地域や山などの障害物による通信障害が生じることがある','衛星通信では、複数のユーザが1つの周波数帯の電波使用者を分割し使用できる周波数分割多元接続をFDMAという','トランスポンダは、衛星局の搭載機器で、受信した地球局の信号を増幅した後、折り返して地球局への信号の送信路に伝送し、増幅させることで電波を使った方式である','地球局の周辺機器を確認する場合は、地球局への送信電波の送信部および地球局への送信電波の出力を確認する際は、地球局が使用できる電波の周波数の種類などを確認する'], answer:3, explanation:'衛星通信における地球局の確認では送受信の機器や周波数を確認しますが、④の記述は曖昧で不正確です。衛星通信の多元接続としてFDMA方式の記述が正しく、③のトランスポンダの説明も正しいです。④が不適当です。' },
        { category:'高圧設備', question:'高圧受変電設備に関する記述として、適当でないものはどれか。', options:['遮断器は、回路の開閉の他、保護継電器と組み合わせて用いられ、事故時には継電器からの信号を受けて、過電流や地絡電流を自動的に遮断する装置である','保護継電器は、回路に異常が発生した場合に、これを検出して遮断器を動作させ、各機器の保護を行う装置である','キュービクル式高圧受電設備は、受電用の主遮断装置の方式によって、CB形とPF・S 形がある','受電設備の引込口等に設置される避雷器は、雷および開閉等による異常電圧が回路に侵入したときに絶縁を保護するものであり、接地はB種接地工事でなければならない'], answer:3, explanation:'高圧受電設備に設置される避雷器（LA）の接地はA種接地工事（接地抵抗10Ω以下）を行う必要があります。「B種接地工事」という記述は誤りです。④が不適当です。' }
    ]
};

questions.beginner.forEach((q,i)     => q.id = 'b'+i);
questions.intermediate.forEach((q,i) => q.id = 'i'+i);
questions.advanced.forEach((q,i)     => q.id = 'a'+i);

const allQuestions = [
    ...questions.beginner.map(q => ({...q, _level:'初級'})),
    ...questions.intermediate.map(q => ({...q, _level:'中級'})),
    ...questions.advanced.map(q => ({...q, _level:'上級'}))
];

function loadWeakIds()      { return new Set(JSON.parse(localStorage.getItem('weakIds') || '[]')); }
function saveWeakIds(s)     { localStorage.setItem('weakIds', JSON.stringify([...s])); }

function updateHomeScreen() {
    const count = loadWeakIds().size;
    const btn = document.getElementById('weak-btn');
    if (count > 0) {
        btn.style.display = 'block';
        document.getElementById('weak-btn-sub').textContent = `記録された苦手問題 ${count}問を集中攻略`;
    } else {
        btn.style.display = 'none';
    }
}

let currentLevel = '';
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let sessionWrong = [];

function startQuiz(level) {
    currentLevel = level;
    if (level === 'random') {
        currentQuestions = shuffle([...allQuestions]).slice(0, 20);
    } else if (level === 'weak') {
        const weakIds = loadWeakIds();
        const pool = allQuestions.filter(q => weakIds.has(q.id));
        if (pool.length === 0) { alert('苦手問題はまだありません。'); return; }
        currentQuestions = shuffle(pool).slice(0, Math.min(20, pool.length));
    } else {
        currentQuestions = shuffle([...questions[level]]).slice(0, 20);
    }
    currentIndex = 0;
    score = 0;
    answered = false;
    sessionWrong = [];
    document.getElementById('level-screen').style.display  = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display   = 'block';
    showQuestion();
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;

    document.getElementById('progress-bar').style.width = ((currentIndex / total) * 100) + '%';
    document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${total} 問`;
    document.getElementById('category-tag').textContent  = q.category + (q._level ? '　[' + q._level + ']' : '');
    document.getElementById('question-text').textContent = q.question;

    const shuffledOptions = shuffleOptions(q.options, q.answer);
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    shuffledOptions.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = '①②③④'[i] + ' ' + opt;
        btn.onclick = () => selectAnswer(i, shuffledOptions.correctIndex);
        optionsDiv.appendChild(btn);
    });

    document.getElementById('explanation').classList.remove('show');
    document.getElementById('next-btn').classList.remove('show');
}

function shuffleOptions(options, correctIndex) {
    const indexed = options.map((opt, i) => ({ opt, isCorrect: i === correctIndex }));
    for (let i = indexed.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
    }
    return {
        options: indexed.map(o => o.opt),
        correctIndex: indexed.findIndex(o => o.isCorrect)
    };
}

function selectAnswer(selected, correctIndex) {
    if (answered) return;
    answered = true;
    const q = currentQuestions[currentIndex];

    document.querySelectorAll('.option-btn').forEach((btn, i) => {
        btn.classList.add('disabled');
        if (i === correctIndex) btn.classList.add('correct');
        else if (i === selected) btn.classList.add('wrong');
    });

    const weakIds = loadWeakIds();
    if (selected === correctIndex) {
        score++;
        weakIds.delete(q.id);
    } else {
        weakIds.add(q.id);
        sessionWrong.push(q);
    }
    saveWeakIds(weakIds);

    document.getElementById('explanation-text').textContent = q.explanation;
    document.getElementById('explanation').classList.add('show');

    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = currentIndex + 1 < currentQuestions.length ? '次の問題 →' : '結果を見る';
    nextBtn.classList.add('show');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display   = 'none';
    document.getElementById('result-screen').style.display = 'block';

    const total = currentQuestions.length;
    const pct   = Math.round((score / total) * 100);
    const circle = document.getElementById('result-circle');
    document.getElementById('result-score').textContent = `${score}/${total}`;

    if (pct >= 60) {
        circle.className = 'result-circle pass';
        document.getElementById('result-message').textContent = '合格ライン達成！ 🎉';
        document.getElementById('result-sub').textContent     = `正解率 ${pct}%　引き続き実力を磨きましょう`;
    } else {
        circle.className = 'result-circle fail';
        document.getElementById('result-message').textContent = 'もう少し！ 💪';
        document.getElementById('result-sub').textContent     = `正解率 ${pct}%　解説を確認して再挑戦しましょう`;
    }

    const breakdown = document.getElementById('category-breakdown');
    if (sessionWrong.length > 0) {
        const catMap = {};
        currentQuestions.forEach(q => { catMap[q.category] = catMap[q.category] || {correct:0,total:0}; catMap[q.category].total++; });
        sessionWrong.forEach(q   => { if (catMap[q.category]) catMap[q.category].correct--; });
        Object.keys(catMap).forEach(k => { catMap[k].correct = catMap[k].total + catMap[k].correct; });

        let html = '<h3>📊 カテゴリ別結果</h3>';
        Object.entries(catMap).sort((a,b) => (a[1].correct/a[1].total)-(b[1].correct/b[1].total)).forEach(([cat,v]) => {
            const p = Math.round(v.correct/v.total*100);
            const cls = p < 60 ? 'bad' : 'good';
            html += `<div class="cat-row"><span class="cat-name">${cat}</span><span class="cat-score ${cls}">${v.correct}/${v.total} (${p}%)</span></div>`;
        });
        html += `<div style="font-size:12px;color:#888;margin-top:8px;">❌ 間違えた${sessionWrong.length}問を苦手リストに追加しました</div>`;
        breakdown.innerHTML = html;
        breakdown.style.display = 'block';
    } else {
        breakdown.innerHTML = '<div style="color:#388e3c;font-size:14px;">✅ 全問正解！苦手リストから削除されました</div>';
        breakdown.style.display = 'block';
    }
}

function retryQuiz() { startQuiz(currentLevel); }
function goHome() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('level-screen').style.display  = 'block';
    updateHomeScreen();
}

updateHomeScreen();
</script>
</body>
</html>
