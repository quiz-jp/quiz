        { category:'消防法(消防用設備等)', question:'消防用設備等に関する記述として、「消防法令」上、誤っているものはどれか。', options:['消火設備、警報設備および避難設備は、消防の用に供する設備に該当する','無線通信補助設備は、消火活動上必要な施設に該当する','自動火災報知設備には、非常電源を附置しなければならない','漏電火災警報器は、甲種消防設備士が設置工事にあたり、乙種消防設備士が整備にあたる'], answer:3, explanation:'漏電火災警報器を扱う第7類には甲種が存在しない。例外的に電気工事士が設置工事にあたり、整備は乙種消防設備士が行う。したがって④が誤り(工事は電気工事士が行う)。' },
        { category:'建築基準法(用語の定義)', question:'「建築基準法」を根拠法とし、以下の用途に供する建築物の中で特殊建築物として、定められていないものを選べ。', options:['劇場','学校','事務所','危険物の貯蔵場'], answer:2, explanation:'建築基準法第2条の第2号にて特殊建築物の定義がなされており、学校、劇場、危険物の貯蔵場等24種が特殊建築物である。一戸建住宅と事務所、商店等は除かれるため、該当しない建築物は③事務所。' },
        { category:'建築基準法(用語の定義)', question:'「建築基準法」に規定されている用語に関する記述として、誤っているものはどれか。', options:['居室とは、居住、執務、作業、集会、娯楽その他、これらに類する目的のために、継続的に使用する室をいう','建築設備とは、土地に定着する工作物のうち、屋根および柱、もしくは壁を有するもの(これに類する構造のものを含む)をいう','建築とは、建築物を新築し、増築し、改築し、または移転することをいう','建築主とは、建築物に関する工事の請負契約の注文者、または請負契約によらないで自らその工事をする者をいう'], answer:1, explanation:'建築設備の定義は「建築物に設ける電気、ガス、給水、排水、換気、暖房、冷房、消火、排煙、もしくは汚物処理の設備、または煙突、昇降機もしくは避雷針」である。②で示されている内容は「建築物」の説明のため②が誤り。' },
        { category:'廃棄物処理法', question:'建設現場で発生する廃棄物の種類に関する記述として、廃棄物の処理及び清掃に関する法令上、正しいものはどれか。', options:['工作物の除去に伴って生じた紙くずは、一般廃棄物である','工作物の除去に伴って生じた木くずは、一般廃棄物である','工作物の除去に伴って生じた繊維くずは、産業廃棄物である','工作物の除去に伴って生じたコンクリート破片は、特別管理一般廃棄物である'], answer:2, explanation:'産業廃棄物は事業活動に伴って生じた廃棄物のうち紙くず、木くず、繊維くず、コンクリートの破片等14項目が該当する。建設工事に関わる紙くずや木くずは産業廃棄物であり、コンクリート破片も特別管理一般廃棄物ではなく産業廃棄物。したがって③のみが正しい。' },
        { category:'廃棄物処理法', question:'廃棄物に関する記述について、「廃棄物の処理および清掃に関する法令」上、誤っているものはどれか。', options:['ごみ、粗大ごみ、燃え殻、汚泥、ふん尿、廃油、廃酸、廃アルカリ、動物の死体その他の汚物または不要物であって、固形状または液状のものは、廃棄物である','建設業に係るもので、工作物の新築、改築または除去に伴って生じた金属くずは、一般廃棄物である','産業廃棄物を生ずる事業者は、産業廃棄物の運搬または処分を他人に委託する場合には、当該委託に係る産業廃棄物の引渡しと同時に、当該産業廃棄物の運搬を受託した者に対し、産業廃棄物管理票を交付しなければならない','事業者は、産業廃棄物が運搬されるまでの間、環境省令で定める技術上の基準に従い、生活環境の保全上支障のないように、産業廃棄物を保管しなければならない'], answer:1, explanation:'建設業に係る工作物の新築、改築または除去に伴って生じた金属くずは産業廃棄物であり、一般廃棄物ではない。したがって②が誤り。' },
        { category:'不正アクセス禁止法', question:'不正アクセス行為に関する次の記述の□に当てはまる語句の組み合わせとして、「不正アクセス行為の禁止等に関する法律」上、正しいものはどれか。「(ア)を有する特定電子計算機に電気通信回線を通じて、当該(ア)に係る他人の識別符号を入力して当該特定電子計算機を作動させ、当該(ア)により制限されている(イ)をし得る状態にさせる行為。」', options:['(ア)通信制御機能 (イ)遠隔操作','(ア)通信制御機能 (イ)特定利用','(ア)アクセス制御機能 (イ)遠隔操作','(ア)アクセス制御機能 (イ)特定利用'], answer:3, explanation:'「アクセス制御機能を有する」とは、当該計算機の利用にあたりIDやパスワード等を必要とする形に設定されている状態のこと。「特定利用」は「その計算機を利用」と読み替えてよい。④が正しい。' },
        { category:'不正アクセス禁止法', question:'「不正アクセス行為の禁止等に関する法律」で禁止されている行為に関する記述として、誤っているものはどれか。', options:['アクセス制限されているコンピュータに対して、そのコンピュータの正規の利用者のIDとパスワードを、本人に無断でインターネットを経由して入力し、利用できる状態にする行為','電気通信回線に接続されていないパソコンを、そのパソコンの正規の利用者でない者が直接操作して表計算ソフトを使用する行為','Webサイトのログインに使用している他人のIDとパスワードを、正当な理由なしに正規の利用者以外の者に提供する行為','インターネット専業銀行のアクセス管理者に無断で、当該銀行のWebサイトを装った偽のWebサイトに顧客のIDとパスワードを入力するように求める文章、入力欄および送信ボタンを表示し、それをインターネット上に公開して、公衆が閲覧できる状態にする行為'], answer:1, explanation:'不正アクセス行為とされるのは、あくまで電気通信回線を経由したアクセスに限定される。サーバやコンピュータを目の前にして直接操作する行為は同法令の対象にならない。したがって②が誤り(オフラインは対象外)。' },
        { category:'放送(地上デジタルTV)', question:'我が国の地上デジタルテレビ放送に関する記述として、適当なものはどれか。', options:['一定の帯域でできる限り大きい伝送容量を確保するため、TC8PSKの変調が採用されている','電波の反射等の妨害に強く、移動受信が可能なOFDMが採用されている','ITU-T勧告J.83 Annex Cによる64QAMや256QAMの変調が採用されている','映像信号の変調に振幅変調が採用され、音声信号の変調に周波数変調が採用されている'], answer:1, explanation:'TC8PSKはBSやCS放送で用いる変調方式で地デジ放送では使用していない(①不適当)。ITU-T勧告J.83 Annex Cはデジタル有線テレビジョン放送の枠組み(③不適当)。振幅変調(AM)や周波数変調(FM)はアナログ伝送の概念(④不適当)。地デジはOFDMを採用し、ガードインターバルにより遅延波を許容でき、電波が反射する環境でも比較的安定して受信できる。②が適当。' },
        { category:'放送(地上デジタルTV)', question:'我が国の地上デジタルテレビ放送に関する記述として、適当でないものはどれか。', options:['1チャネルの周波数帯域幅6MHzを16等分したうちの13個のセグメントを組み合わせて、地上デジタルテレビ放送の信号としている','標準放送(SDTV)の場合は1チャネルあたり3本の放送が可能で、ハイビジョン放送(HDTV)の場合は1チャネルあたり1本の放送が可能である','中継局も親局と同じ周波数を使って放送する単一周波数ネットワーク(SFN)の構築が可能である','データ放送では、コンテンツを記述する言語としてBMLが採用されている'], answer:0, explanation:'1チャネルの帯域幅6MHzは14のマスに等分し、そのうち1つはワンセグ放送、12セグメントを標準放送またはハイビジョン放送に使用。両サイドの0.5セグメントは隣の局と干渉を防ぐクッションの役割を持つ。したがって16等分とする①が不適当(正しくは14等分)。' },
        { category:'放送(地上デジタルTV)', question:'我が国の地上デジタルテレビ放送に関する記述として、適当でないものはどれか。', options:['OFDMは、サブキャリア1本あたりの変調速度が低速であることや、ガードインターバルの挿入により、降雨減衰の影響を抑えることができる','1チャネルの周波数帯域幅6MHzを14等分したうちの13セグメントを画像、音声、データの情報伝送に使用している','マルチパス妨害に有効な周波数インタリーブと、インパルス雑音や移動受信で生じるフェージング妨害に有効な、時間インタリーブが採用されている','データ放送では、コンテンツを記述する言語としてBML(Broadcast Markup Language)が採用されている'], answer:0, explanation:'ガードインターバルは電波の反射等によって遅れて到着した信号を待つための工夫であり、降雨減衰の対策にはならない。降雨減衰を強く受けるのは10GHz以上の高い周波数帯で、地デジが使うUHF帯はあまり大きな減衰は受けない。①が不適当。' },
        { category:'放送(地上デジタルTV)', question:'我が国の地上デジタルテレビ放送の放送電波に関する記述として、適当でないものはどれか。', options:['地上デジタルテレビ放送は、13〜52チャネルの周波数(470MHz〜710MHz)を使用している','地上デジタルテレビ放送の放送区域は、地上高10mにおいて電界強度が0.3mV/m(50dBμV/m)以上である区域と定められている','地上デジタルテレビ放送では、チャネルの周波数帯幅6MHzを14等分したうちの13セグメントを使用している','地上デジタルテレビ放送でモード3、64QAMの伝送パラメータで単一周波数ネットワーク(SFN)を行った場合を考慮し、送信周波数の許容差は1Hzと規定されている'], answer:1, explanation:'放送区域は「基幹放送局の開設の根本的基準」において、地上10mの高さで電界強度が1mV/m(60dBμV/m)以上である区域と規定されている。②が不適当。' },
        { category:'放送(CATV)', question:'CATVシステムに関する記述として、適当でないものはどれか。', options:['CATVシステムは、同軸ケーブルや光ファイバケーブルを使って、視聴者にテレビ信号を分配するシステムである','CATVシステムのうち、ケーブルテレビ事業者と視聴者との間のネットワークは、一般的にリング状の構成をとっている','ケーブルテレビ事業者は、地上デジタルテレビ放送や衛星放送の他、自主放送番組を加え多チャンネル化した上で配信している','CATVシステムのネットワーク設備は、双方向通信機能を有する設備へと発展し、CATVシステムを活用したインターネット接続サービスも提供されている'], answer:1, explanation:'CATVシステムの接続構成はSS方式や、PDS方式の形をとることが多く、一般的にリング方式は見られない。②が不適当。' },
        { category:'放送(CATV)', question:'FTTH型CATVシステムに関する記述として、適当でないものはどれか。', options:['ネットワークの形態には、SS方式、PDS方式およびADS方式がある','光ファイバを視聴者宅まで延伸することで、同軸ケーブルを用いるよりも高い周波数帯域までの伝送が可能となる','PDS方式は、電源供給を受けて動作する多重化装置を光ファイバの分岐点に設置し、そこからスター状に複数の視聴者宅へ分配する方式である','SS方式は、CATV局と視聴者宅との間を1対1で光ファイバにより接続する方式である'], answer:2, explanation:'PDS(Passive Double Star)は分岐点で増幅を行わない方式で、到着した信号を単純に分岐するだけなので電源を必要としない。増幅を行い電源を必要とするのはADS(Active Double Star)方式。③が不適当。' },
        { category:'放送(CATV)', question:'HFC型CATVシステムに関する記述として、適当でないものはどれか。', options:['HFC型CATVシステムは、同軸ケーブルシステムと光ファイバシステムを融合させたシステムである','全区間が同軸ケーブルによるCATVシステムと比べ、光ファイバケーブルの利用により信号品質の向上を図ることができる','全区間が同軸ケーブルによるCATVシステムと比べ、光ファイバケーブルの利用により増幅器の縦続接続段数を少なくできる','屋外に電源を必要とする機器の設置が不要であるため、屋外機器への電源供給が必要なくなる'], answer:3, explanation:'光ファイバと同軸ケーブルとが接続されていることから必ず変換点が必要になり、また同軸区間では増幅器を設けるケースもある。これらは電源がないと稼働しない機器であるため、④の記述は不適当。' },
        { category:'放送(CATV)', question:'デジタルCATVの受信機であるSTB(Set Top Box)に関する記述として、適当でないものはどれか。', options:['スクランブルの解除に使用されるCASカードを装着するための、CASカードインターフェースを装備している','地上デジタルテレビ放送、BSデジタル放送、110度CSデジタル放送は、パススルー方式で再放送された64QAMまたは256QAMの変調信号を受信する','映像信号と音声信号をテレビにデジタルで出力するためのインターフェースには、HDMI端子がある','受信信号は、チューナで選択された後、変調信号の復調、スクランブルの解除、希望番組の選択、映像復号処理および音声復号処理を行い、テレビに出力する'], answer:1, explanation:'CATVの外部から取り入れた各放送を再放送する場合の手段はパススルー方式ばかりとは限らず、トランスモジュレーション方式の場合もあり得る。また各放送の多重化方式にはPSKや16QAMも採用されている。②が不適当。' },
        { category:'IPアドレス(IPv4)', question:'IPv4アドレス「192.168.3.64/27」のネットワークで収容できるホストの最大数として、適当なものはどれか。', options:['27','30','62','254'], answer:1, explanation:'「/27」は左から27ビット目までがネットワークアドレスという意味で、ホスト側で使用できるのは残りの5ビット。2進数の5ビットで表せるのは0〜31の32個だが、頭と最後は特殊アドレスで使用できないため、ホストに割り当て可能なのは差引きの30個。②が適当。' },
        { category:'IPネットワーク(DHCP)', question:'TCP/IPで通信を行うため、各クライアントに対して、IPアドレスやサブネットマスク、デフォルトゲートウェイなど、さまざまな設定を自動的に割り当てるプロトコルとして、適当なものはどれか。', options:['ARP','SNMP','DHCP','MIME'], answer:2, explanation:'ARPはIPアドレスからMACアドレスの情報を取得するためのプロトコル。SNMPはネットワーク経由で機器の監視や制御を行うプロトコル。DHCPはLANに参加した端末(ホスト)に自動的にIPアドレス等の情報を割り当てる機能で、IPアドレスの他サブネットマスクやデフォルトゲートウェイのアドレス、DNSサーバのアドレス等も含まれる。③が適当。MIMEは電子メールでテキスト文字以外の情報を扱えるようにする拡張仕様。' },
        { category:'IPネットワーク(DHCP)', question:'DHCPに関する記述として、適当なものはどれか。', options:['各クライアントに対して、IPアドレスやサブネットマスク、デフォルトゲートウェイのアドレス、DNSサーバのアドレスなどを、自動的に割り当てるためのプロトコルである','IPネットワークに接続される機器の時刻を、同期させるためのプロトコルである','メールクライアントからメールサーバへのメールの送信、あるいはメールサーバ相互間でメールを送受信するためのプロトコルである','WebサーバとWebブラウザとの間において、HTMLファイルや画像ファイルなどを送受信するためのプロトコルである'], answer:0, explanation:'時刻の同期を取るためのプロトコルはNTP(②不適当)。メールを送受信するためのプロトコルの代表的なものはSMTP(③不適当)。HTMLファイルや画像ファイル等を送受信するプロトコルはHTTP(④不適当)。各クライアントに通信に必要なIPアドレス等の情報を自動的に割り当てるためのプロトコルがDHCPで①が適当。' },
        { category:'IPネットワーク(接続技術)', question:'インターネットで使われている技術に関する記述として、適当でないものはどれか。', options:['DHCPサーバとは、ドメイン名をIPアドレスに変換する機能を持つサーバである','ルーティングとは、最適な経路を選択しながら宛先IPアドレスまでIPパケットを転送していくことである','プロキシサーバとは、クライアントに変わってインターネットにアクセスする機能を持つサーバである','CGIとは、Webブラウザからの要求に応じてWebサーバがプログラムを起動するための仕組みである'], answer:0, explanation:'DHCPはLANに参加した端末に自動的にIPアドレス等を割り当てる機能。ドメイン名をIPアドレスに変換する機能はDNS(Domain Name System)。①が不適当。' },
        { category:'IPネットワーク(接続技術)', question:'TCP/IPにおけるIP(インターネットプロトコル)の特徴に関する記述として、適当でないものはどれか。', options:['パケット通信を行う','最終的なデータの到達を保証しない','経路制御を行う','OSI参照モデルにおいて、トランスポート層に位置する'], answer:3, explanation:'TCP/IPは第4層のTCP(Transmission Control Protocol)と、第3層のIP(Internet Protocol)の総称。IPはOSI参照モデルのネットワーク層(第3層)に位置し、トランスポート層ではない。④が不適当(ネットワーク層)。' },
        { category:'IPネットワーク(経路選択)', question:'IPネットワークで用いられるRIPに関する記述として、適当なものはどれか。', options:['各リンクにコストと呼ばれる重みをつけ、このコストの合計値が小さくなるように経路を選択する','ホップ数と呼ばれる通過するルータの数が、できるだけ少ない数を通過して目的のIPアドレスに到達するように経路を選択する','各組織が運用するネットワークである自律システムに対してAS番号が割り当てられ、このAS番号を使って経路を選択する','IPパケットにラベルと呼ばれる情報を付加し、そのラベルを使ってIPパケットを転送する'], answer:1, explanation:'コストの合計値が最少となるように経路を選択するのはリンクステート型のOSPF(①不適当)。AS番号を用いて経路選択を行うプロトコルはEGP(③不適当)。ラベルによってパケットを転送するプロトコルはMPLS(④不適当)。RIPはディスタンス・ベクタ型で、ホップ数(通過するルータの数)によって最適なルートを決定する。②が適当。' },
        { category:'IPネットワーク(経路選択)', question:'IPネットワークで使用されるOSPFの特徴に関する記述として、適当なものはどれか。', options:['経路判断に通信帯域等を基にしたコストと呼ばれる重みパラメータを用いる','ディスタンス・ベクタ型のルーティング・プロトコルである','30秒ごとに配布される経路制御情報が180秒間待っても来ない場合には、接続が切れたと判断する','インターネットサービスプロバイダ間で使われるルーティング・プロトコルである'], answer:0, explanation:'OSPFは各リンクごとにコストという重みづけを設定し、コストの合計値が最少になるように経路を選択する。①が適当。OSPFはリンクステート型のルーティング・プロトコル(②不適当)。経路情報等の更新メッセージを30秒ごとに配信するのはRIP(③不適当)。プロバイダ間のルーティングはAS間で用いるEGPによって経路を選択する(④不適当)。' },
        { category:'IP電話(VoIP技術)', question:'IPネットワークで使用されるVoIPに関する記述として、適当でないものはどれか。', options:['音声データに付加するヘッダとして、IPヘッダ、TCPヘッダ、RTPヘッダがある','アナログ信号である音声を、デジタル信号に変換する符号化方式にG.711がある','優先制御は、ルータが受け取った音声データのパケットを、他のデータのパケットよりも優先的に送信することである','呼制御は、回線の接続、切断、発呼や着呼等、電話をかけるための制御や、かけた相手を呼び出すための制御である'], answer:0, explanation:'デジタル音声を伝送するためのデータ構造では、第4層(トランスポート層)のプロトコルはTCPではなくUDPが用いられる。①が不適当(TCPではなくUDP)。' },
        { category:'IP電話(VoIP技術)', question:'IP電話等で使用されるSIPに関する記述として、適当でないものはどれか。', options:['SIPは、音声や動画等のリアルタイムデータを伝送するプロトコルである','SIPサーバは、プロキシサーバ、リダイレクトサーバ、登録サーバ、ロケーションサーバの機能で構成される','SIPメッセージは、スタートライン、ヘッダ、空白行、ボディで構成される','SIPメッセージの伝送には、トランスポート層のプロトコルである、UDPを使うことができる'], answer:0, explanation:'SIPは端末(UA)間でのセッションの生成、変更、切断のみを行うプロトコルであり、セッション確立後の音声データ等の伝送には関与しない。①が不適当(データ伝送は行わない)。' },
        { category:'情報保護(脅威)', question:'サイバー攻撃に関する記述として、適当でないものはどれか。', options:['セッションハイジャックとは、他人のセッションIDを推測したり窃取することで、同じセッションIDを使用したHTTPリクエストによって、なりすましの通信を行う攻撃である','SQLインジェクションとは、ユーザからの入力値を用いてSQL文を組立てるWebアプリケーションの脆弱性を利用して、データベースを不正操作する攻撃である','バッファオーバフローとは、メモリ上のバッファ領域をあふれさせることによってWebサーバに送り込んだ不正なコードを実行させたり、データを書き換えたりする攻撃である','クロスサイトスクリプティングとは、Webアプリケーションを通じて、Webサーバ上でOSコマンドを不正に実行させる攻撃である'], answer:3, explanation:'クロスサイトスクリプティングとは、攻撃者が脆弱性のあるWebページに罠を仕掛け、一般ユーザがアクセスした際に個人情報を盗む等の攻撃。「Webアプリケーションを通じてWebサーバ上でOSコマンドを不正に実行させる攻撃」はOSコマンドインジェクションである。④が不適当。' },
        { category:'情報保護(脅威)', question:'コンピュータネットワークの情報セキュリティのために使用されるIDSに関する記述として、適当でないものはどれか。', options:['アノマリ検知は、パケットの内容やホスト上の動作が既知の攻撃手法について、特徴的なパターンを登録したデータベースであるシグネチャと一致した場合に、攻撃と判定する','ネットワーク型IDSは、ネットワーク上に配置されて、ネットワークに流れるパケットを検査する','IDSは、ネットワークやサーバを監視し、侵入や攻撃等の不正なアクセスを検知した場合に、管理者へ通知する','IDSは、攻撃を検知できずに見逃してしまうことや、正常な通信や正常な動作を攻撃と誤検知してしまうことがある'], answer:0, explanation:'シグネチャと一致した場合に攻撃と判定するのはシグネチャ型の説明。アノマリ型は逆で、正常なパターンを登録しておき、これに外れた動作パターンを検知したときに攻撃と判断する。①が不適当。' },
        { category:'情報保護(暗号化)', question:'公開鍵暗号方式に関する記述として、適当でないものはどれか。', options:['情報を公開鍵で暗号化して、それと対となっている秘密鍵で復号するので、秘密鍵を知らない第三者は、暗号文を復号することができないため情報の機密性を確保できる','代表的な公開鍵暗号アルゴリズムであるRSA暗号は、大きな数の素因数分解の困難性を利用した暗号方式である','n人がお互いに暗号文の交換を行うためには、n/2個の公開鍵と秘密鍵の対が必要となる','秘密鍵で暗号化した暗号文をそれと対となっている公開鍵で復号することができる'], answer:2, explanation:'1人が公開鍵暗号方式を構築したい場合には、公開鍵と秘密鍵のセットは1対だけ必要になる。2人であれば2対必要。n人が構築する際にはn対の鍵セットを用意する必要がある。n/2個とする③が不適当(n個)。' },
        { category:'情報保護(暗号化)', question:'RSA暗号に関する記述として、適当なものはどれか。', options:['大きな数の素因数分解が困難であることを利用した方式である','離散対数問題を解くことが困難であることを利用した方式である','第2原像計算を解くことが困難であることを利用した方式である','部分集合和問題を解くことが困難であることを利用した方式である'], answer:0, explanation:'離散対数問題を解くことが困難であることを応用したのはElGamal暗号(②不適当)。第2原像計算を解くことが困難であることはハッシュ値の逆方向計算を難解にする手法として用いられている(③不適当)。RSA暗号は素因数分解の困難性を利用したもの。①が適当。' },
        { category:'低圧配線', question:'電気設備において、低圧の幹線および配線に関する記述として、電気設備の技術基準の解釈上、誤っているものはどれか。ただし、負荷には電動機またはこれに類する起動電流が大きい電気機械器具は接続されていないものとする。', options:['低圧幹線の電線は、供給される負荷である電気使用機械器具の定格電流の合計値以上の許容電流のものを施設した','低圧分岐回路の電線の許容電流が、その電線に接続する低圧幹線を保護する過電流遮断器の定格電流の35%であるため、低圧幹線の分岐点から9mの箇所に分岐回路を保護する過電流遮断器を施設した','低圧幹線の電源側電路に施設する過電流遮断器は、当該低圧幹線に使用する電線の許容電流よりも低い値の定格電流のものを施設した','低圧分岐回路の電線の許容電流が、その電線に接続する低圧幹線を保護する過電流遮断器の定格電流の30%であるため、低圧幹線の分岐点から3mの箇所に分岐回路を保護する過電流遮断器を施設した'], answer:1, explanation:'分岐回路で使用する電線の許容電流値(Iw)が幹線遮断器の定格電流値IBの55%以上であれば距離に制限はない。IwがIBの55%未満で35%以上であれば、過電流遮断器と分岐点との距離は8m以下とする必要がある。9mでは不可のため②が誤り。35%未満の場合は3m以下としなければならない。' },
        { category:'低圧配線', question:'電気設備において、低圧幹線の施設や低圧分岐回路等の施設に関する記述として、「電気設備の技術基準の解釈」上、誤っているものはどれか。ただし、負荷には電動機またはこれに類する起動電流が大きい電気機械器具は接続されていないものとする。', options:['低圧幹線の電源側電路に施設する過電流遮断器には、当該低圧幹線の許容電流以下の定格電流のものを使用する','低圧分岐回路の電線の許容電流が、低圧幹線を保護する過電流遮断器の定格電流の35%であるため、低圧幹線の分岐点からの電線の長さが8mの箇所に低圧分岐回路を保護する過電流遮断器を施設する','低圧幹線の電線として、当該低圧幹線を通じて供給される電気使用機械器具の定格電流の合計値以上の許容電流のものを使用する','低圧分岐回路の電線の許容電流が、低圧幹線を保護する過電流遮断器の定格電流の30%であるため、低圧幹線の分岐点からの電線の長さが4mの箇所に低圧分岐回路を保護する過電流遮断器を施設する'], answer:3, explanation:'IwがIBの35%以上の場合、過電流遮断器と分岐点との距離は8m以下とすればよく②は正しい。IwがIBの35%未満となるケースでは、このときの距離は3m以下としなければならず、4mでは不可となる。したがって④が誤り。' },
        { category:'低圧配線', question:'事務室におけるコンセント専用の低圧分岐回路に関する記述として、電気設備の技術基準の解釈上、誤っているものはどれか。ただし、電線は軟銅線のものを使用し、その長さは、分岐点から配線用遮断器までは2m、配線用遮断器からコンセントまでは7mとする。', options:['定格電流30Aの配線用遮断器に直径2mmの電線を配線し、定格電流15Aのコンセントを1個取り付ける','定格電流20Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流20Aのコンセントを1個取り付ける','定格電流15Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流15Aのコンセントを1個取り付ける','定格電流30Aの配線用遮断器に直径2.6mmの電線を配線し、定格電流30Aのコンセントを1個取り付ける'], answer:0, explanation:'定格電流30Aの配線用遮断器を用いた場合には30A分岐回路とみなされ、直径2.6mm以上の太さの電線を使用しなければならない。取り付けるコンセントも定格電流20A以上30A以下のものである必要がある。したがって選択肢①は規格を外れた配線となる。' },
        { category:'低圧配線', question:'事務室におけるコンセント専用の低圧分岐回路に関する記述として、「電気設備の技術基準の解釈」上、誤っているものはどれか。ただし、電線は軟銅線のものを使用し、その長さは、分岐点から配線用遮断器までは2m、配線用遮断器からコンセントまでは7mとする。', options:['定格電流15Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流20Aのコンセントを1個取り付ける','定格電流20Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流15Aのコンセントを1個取り付ける','定格電流30Aの配線用遮断器に直径2.6mmの電線を配線し、定格電流30Aのコンセントを1個取り付ける','定格電流40Aの配線用遮断器に断面積8mm2の電線を配線し、定格電流30Aのコンセントを1個取り付ける'], answer:0, explanation:'回路に取り付けるコンセントの定格電流値は、少なくとも遮断器の定格電流値と同じか、それ以下でなければならない。15A分岐回路のコンセントは15A以下とする必要があり、20Aのコンセントは明らかに超過しているため①が誤り。' },
        { category:'電気用品安全法', question:'次の電気用品のうち、「電気用品安全法令」上、特定電気用品に該当しないものはどれか。ただし、使用電圧200Vの交流の電路に使用するものとする。', options:['ケーブル(CV22mm2 3心)','ケーブル配線用スイッチボックス','電流制限器(定格電流100A)','温度ヒューズ'], answer:1, explanation:'現行法での「特定電気用品」は100品目以上が指定されている。大分類を列挙すると、電線類、ヒューズ、配線器具、電流制限器、小形単相変圧器類、電熱器具、電動力応用機械器具、電子応用機械器具、交流用電気機械器具、携帯発電機の10種類。選択肢の中では②の「ケーブル配線用スイッチボックス」が該当しない。' },
        { category:'消防設備', question:'粉末消火設備に関する記述として、適当でないものはどれか。', options:['全域放出方式は、防護対象物の火災消火を目的に、粉末消火剤を防護対象物に直接放射して消火する方式である','移動式は、粉末消火剤の貯蔵容器等は固定されており、人がホースを持って火災場所まで移動しノズルを操作することで、粉末消火剤を放射する方式である','第1種粉末、第2種粉末および第4種粉末は、油火災および電気火災に適応し、第3種粉末は普通火災、油火災および電気火災に適応する','固定式の粉末消火設備の起動方式には、自動式と手動式がある'], answer:0, explanation:'固定式には全域方式と局所方式の二種類があり、局所方式は防護対象物に消火剤を直接放射して消火する。一方の全域方式は、対象となる部屋全体に均一に消火剤を放射するものであり、①の記載は不適当。粉末消火設備は主成分の違いにより第1種から第4種に区分され、普通火災に適応しているのは第3種だけである(③適当)。' },
        { category:'消防設備', question:'不活性ガス消火設備の特徴に関する記述として、適当でないものはどれか。', options:['移動式の不活性ガス消火設備は、ホースノズルを人が操作することで、移動しながら消火する方式である','全域放出方式と局所放出方式の不活性ガス消火設備は、常時、人がいない部分に設置される','不活性ガス消火設備の消火剤であるハロゲン化物は、窒息効果の他、化学的な連鎖反応抑制による燃焼抑制効果により消火する','水を使用することが不適切な油火災や、電気火災または散水によって二次的な被害が出ると予想される室に設置される'], answer:2, explanation:'不活性ガス消火設備の消火剤は、主に窒素ガスや二酸化炭素が用いられる。これらは熱の作用を受けても酸素を排出せず、酸素濃度を下げる窒息効果のみによって消火の作用を得る。ハロゲン化物を消火剤とする方式はハロゲン化物消火設備であり、③が不適当。' },
        { category:'消防設備', question:'消火設備に関する記述として、適当でないものはどれか。', options:['不活性ガス消火設備は、二酸化炭素、窒素、あるいはこれらのガスとアルゴンとの混合ガスを放射することで、不活性ガスによる窒息効果により消火する','スプリンクラー設備は、建築物の天井面等に設けたスプリンクラーヘッドが火災時の熱を感知して感熱分解部を破壊することで、自動的に散水を開始して消火する','屋内消火栓設備は、人が操作することによって消火を行う固定式の消火設備であり、泡の放出により消火する','粉末消火設備は、噴射ヘッドまたはノズルから粉末消火剤を放出し、火災の熱により、粉末消火剤が分解して発生する二酸化炭素による窒息効果により消火する'], answer:2, explanation:'泡を放出して消火の効果をもたらす設備は泡消火設備であり、屋内に施設されていたとしても屋内消火栓設備という名称ではない。屋内消火栓設備は水を放出することで消火の効果を得るため、③が不適当。その他の選択肢①、②、④は正しい。' },
        { category:'消防設備', question:'スプリンクラー設備に関する記述として、適当でないものはどれか。', options:['湿式方式は、配管内に常時圧力のかかった水が満たされており、火災の熱により、スプリンクラーヘッドが感熱開放することで自動的に放水する','乾式方式は、流水検知装置の1次側(ポンプ側)配管に圧力のかかった水が満たされており、2次側(スプリンクラーヘッド側)配管には圧縮空気が入っている','開放式は、一斉開放弁の1次側(ポンプ側)配管および2次側(スプリンクラーヘッド側)配管とも、圧縮空気や圧力のかかった水が入っておらず、開放されている','予作動方式は、火災による熱でスプリンクラーヘッドが作動して初めて放水するが、ヘッドだけが作動しても感知器の感知信号がなければ放水されない'], answer:2, explanation:'開放式は、文字通りヘッドが常に開いており、末端の配管内に水は充填されていないが、水は一斉開放弁で止められている。1次側には充填されているため③が不適当。火災発生時には、送水系統とは別に電気式の感知器を設けて火災信号を受信するか、または手動で起動させて送水を行う。' },
        { category:'非常用装置', question:'非常用予備発電装置に関する記述として、適当でないものはどれか。', options:['建設工事現場の仮設電源として使用される移動用発電設備は電気事業法令上、非常用予備発電装置として扱われる','非常用予備発電装置の負荷容量は、一般的に商用電源の負荷容量と比較して、必要最小限にするため、必要な負荷を選択して投入する','法令や条例によって騒音値が規制される場合は、敷地境界における騒音規制値を満足する性能を有する必要がある','非常用予備発電装置が運転される場合には、電力会社の配電線等に電気が流出しないようにする必要がある'], answer:0, explanation:'経済産業省の通達によると、工事現場の仮設電源として使用される移動用発電設備は「発電所」に分類され、定義上は非常用予備発電装置としては扱われないことになる。①が不適当。' },
        { category:'非常用装置', question:'非常用の照明装置に関する記述として、「建築基準法令」上、誤っているものはどれか。', options:['照明器具には、LEDランプは認められておらず、白熱灯または蛍光灯のいずれかでなければならない','電気配線に使用する電線は、600V二種ビニル絶縁電線その他これと同等以上の耐熱性を有するものとしなければならない','予備電源は、常用の電源が断たれた場合に自動的に切り替えられて接続され、かつ、常用の電源が復旧した場合に自動的に切り替えられて復帰するものとしなければならない','照明器具(照明カバーその他照明器具に付属するものを含む)のうち主要な部分は、難燃材料で造り、または覆うこと'], answer:0, explanation:'非常用の照明装置は建築基準法が根拠法だが、実際には国土交通省の告示にて細目が定められている。その中で照明器具の仕様が限定されていて、白熱灯、蛍光灯、LEDランプのいずれかと規定されている。したがって①が誤り。' }
,
        { category:'線路施工（架空配線）', question:'「有線電気通信法令」上、架空通信ケーブルと他の電線等との離隔距離に関する記述として、誤っているものはどれか。', options:['架空通信ケーブルと他人の設置した架空電線との離隔距離を40cmとする','架空通信ケーブルと他人の建造物との離隔距離を50cmとする','架空通信ケーブルと使用電圧が高圧の強電流ケーブルが交差するので、その離隔距離を35cmとする','架空通信ケーブルを高圧の強電流ケーブルと同一の支持物に連続して共架するので、その離隔距離を60cmとする'], answer:2, explanation:'他人の架空電線や建造物との離隔は「30cm以下は不可」（30cm超が必要）なので40cm・50cmは適法。高圧の強電流ケーブルと交差する場合の離隔距離は40cm以上必要なため、35cmは誤り。高圧の強電流ケーブルと共架（同一支持物に2か所以上連続して架設）する場合は50cm以上必要（60cmは適法）。なお低圧では交差時30cm（強電流絶縁電線は60cm）、共架時30cm（絶縁電線75cm）となる。' },
        { category:'線路施工（架空配線）', question:'「有線電気通信法令」上、架空配線（架空電線）の高さに関する記述として、適当なものはどれか。', options:['横断歩道橋の上に架空配線を行う場合、その路面からの高さを2.5mとする','道路の縦断方向に架空配線を行う場合、その路面からの高さを4.5mとする','鉄道を横断する架空配線を行う場合、その軌条面からの高さを5.5mとする','河川を横断する架空配線は、舟行に支障を及ぼすおそれがない高さとする'], answer:3, explanation:'有線電気通信設備令施行規則第7条により、横断歩道橋の上は路面から3m以上、道路上は路面から5m以上、鉄道または軌道（路面電車）を横断するときは軌条面（レールの上面）から6m以上と定められている。河川については具体的な数値の規定はなく「舟行に支障を及ぼすおそれがない高さ」とされているため④が正しい。①は3m以上、②は5m以上、③は6m以上が必要。' },
        { category:'工程管理（各種工程表）', question:'工程管理に用いられるガントチャートに関する記述として、適当なものはどれか。', options:['縦軸に部分工事（工種）をとり、横軸に各部分工事の出来高比率（達成度）を棒線で記入した図表である','各部分工事に必要な日数を把握することができる','縦軸に出来高比率をとり、横軸に工期をとって、工事全体の出来高比率の累計を曲線で表した図表である','各部分工事の工期に対する影響の度合いを把握することができる'], answer:0, explanation:'ガントチャートは縦軸に工種（部分工事）をとり、横軸に各部分工事の出来高比率（達成度）を棒線で記入した図表で、部分工事ごとの進捗度合いが一目でわかる。ただし横軸が時間ではないため、各部分工事の開始・終了時期や所要日数は読み取れず、全体工期に対する影響の度合いや工事全体の出来高比率の累計も把握できない。③は工程管理曲線の説明である。' },
        { category:'工程管理（工程管理曲線）', question:'工程管理曲線の代表的なものであるバナナ曲線に関する記述として、適当でないものはどれか。', options:['上方許容限界曲線や下方許容限界曲線は、過去の工事実績データから作成される','予定工程曲線がバナナ曲線の許容限界範囲内に入らない場合は、一般に不合理な工程計画と考えられ、工程計画の調整を行う必要がある','バナナ曲線によって管理する予定工程曲線は出来高累計曲線で描かれるが、実施工程曲線は3本の直線で表現される','実施工程曲線が上方許容限界曲線より上にくる場合は、工程が計画より進み過ぎている状態である'], answer:2, explanation:'予定工程曲線も実施工程曲線も、ともに出来高累計のS字曲線で描かれ、3本の直線ではないため③が不適当。上方・下方許容限界曲線は過去の工事実績等から作成され、予定工程曲線が許容限界範囲に入らない場合は工程計画の調整が必要となる。実施線が上方許容限界より上なら進み過ぎ、下方許容限界より下なら工程遅延の状態である。' },
        { category:'工程管理（各種工程表）', question:'タクト工程表に関する記述として、適当なものはどれか。', options:['縦軸にその建物の階層をとり、横軸に出来高比率をとった工程表である','高層ビルの基準階等の繰り返し行われる作業の工程管理に適している','全体の稼働人数の把握が難しく、工期の遅れ等に対する変化への対応が困難である','バーチャート工程表に比べ、特定の作業と他の作業との関連性を詳細に把握できる'], answer:1, explanation:'タクト工程表は縦軸に建物の階層別をとり、横軸には出来高比率ではなく時間（日程）を配した工程表である。各階で作業内容が近似するビルの内装・電気・水道等の付帯工事について、フロア全体の作業項目を1つのセットとして繰り返し作業で工程管理を行う手法で、高層ビルの基準階等の繰り返し作業に適する。フロアごとの作業内容が慣習的なものとなるため稼働人数の把握・算出は容易で、工程遅延時も人員や機械の追加等の対処がしやすい。ただし特定の1つの作業と他の作業との関連性は、バーチャートと同様に詳細には把握できない。' },
        { category:'工程管理（各種工程表）', question:'建設工事の工程管理に用いられる斜線式工程表に関する記述として、適当でないものはどれか。', options:['トンネルや舗装工事のように、一方向にしか進捗できない工事によく用いられる','工事の施工場所と日数の関係を明確にすることができる','工事のクリティカルパスを求めることができる','縦軸に工期をとり、横軸に工事総延長等の距離を配する形が一般的である'], answer:2, explanation:'クリティカルパスが算出可能な図表はネットワーク工程表（アロー・ダイヤグラム）だけであり、斜線式工程表では求められないため③が不適当。斜線式工程表は縦軸に工期、横軸に工事総延長等の距離を配し、各工種の作業を1本の斜線で表現することで、作業期間・着手地点・作業方向・作業速度等を示すことができ、場所と日程の関係が読み取りやすい。トンネルや舗装工事のように一方向に進行する工事に用いられる。' },
        { category:'工程管理（山積み・山崩し）', question:'工程管理における作業人員や資材の山積みや山崩しに関する記述として、適当なものはどれか。', options:['山積みで凹部になっている部分は作業のネックになる部分であるため、作業人員を増員する','山積みでは、作業を進めるのに必要な作業人員や資材の日々の累計を計算して、その状況を把握する','山崩しでは、許容される余裕の範囲を超えて作業を遅らせることによって、作業の平均化を図る','山崩しでは、全体工期を守る必要はなく、平準化を最優先して作業を調整する'], answer:1, explanation:'山積みとは、工程計画の立案段階で作業の順序と各作業に要する資源（人員や資機材）の配置を棒グラフで示し、必要資源の日々の累計を計算して状況を把握するものである。山積みの凹部は縦軸方向のリソースが少ない箇所を指すだけで、ボトルネックという意味ではない。山崩しはピーク時の突出した部位を下げて平準化する試みだが、全体工期を守ることが前提であり、許容される余裕の範囲を超えて作業を遅らせ工事が遅延する状況は避けるべきである。' },
        { category:'ネットワーク工程表', question:'次のネットワーク工程表におけるクリティカルパスの所要日数として、適当なものはどれか。作業A（結合点0→1、4日）、作業B（1→2、5日）、作業C（1→3、6日）、作業D（1→4、8日）、作業E（3→5、7日）、作業F（2→5、8日）、作業G（5→6、3日）で、結合点2→3および4→3にダミー作業がある。', options:['19日','21日','22日','24日'], answer:2, explanation:'結合点3には、A+C=10日、A+B+ダミー=9日、A+D+ダミー=12日の3ルートが到達し、最も数値が大きい12日を採用する（作業B～Dの全てが完了しなければ作業Eに進めないため）。結合点5にはE経由で12+7=19日、F経由で4+5+8=17日が到達し、大きい19日を採用。最後に作業Gの3日を足して合計22日がクリティカルパスの所要日数となる。クリティカルパスは時間的な余裕が全くないルートであり、全体の作業工程はこれよりも短く実施できない。' },
        { category:'品質管理（QC7つ道具）', question:'品質管理に用いる図表のうち、横軸に測定対象のデータ区間をとり、縦軸にそのデータ区間ごとの出現度数を棒グラフとして積み上げた図表の名称として、適当なものはどれか。', options:['パレート図','管理図','特性要因図','ヒストグラム'], answer:3, explanation:'データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図はヒストグラムである。中央が最も高く左右対称の正規分布（ガウス分布）に近い形が理想的で、山が2つに分かれる等の極端に歪んだ形になった場合は異常値としてアラームを上げて工程を疑い調査を行う。QC7つ道具の1つで、測定値の分布状況の把握に広く用いられる。' },
        { category:'品質管理（管理図）', question:'シューハート管理図に関する記述として、適当でないものはどれか。', options:['中心線（CL）は、設定された目標値のことである','上方管理限界（UCL）は、一般に中心線から標準偏差σの3倍の位置とされる','統計論的に、プロットした点が3σの外に出てしまう確率は約0.3%とされている','連続する9点が中心線に対して同じ側にあっても、管理限界線の内にあれば工程に異常はないと判断する'], answer:3, explanation:'JIS Z 9021「シューハート管理図」では異常判定ルールとして8項目が定められており、「連続する9点が中心線に対して同じ側にある」場合は管理限界線の内にあっても工程に異常があると判定される。他にも「点が管理限界線の外にある」「6点以上連続して上昇または下降している」「連続する14点が交互に増減している」等がある。中心線（CL）は目標値、上方管理限界（UCL）は3σの位置に置かれ、3σの外に出る確率は統計論的に約0.3%とされる。' },
        { category:'品質管理（検査）', question:'抜取検査において、不合格とすべきロットを合格としてしまう可能性を表す用語として、適当なものはどれか。', options:['生産者危険','消費者危険','工程能力指数','抜取誤差'], answer:1, explanation:'抜取検査では検査の対象とならなかった製品が不良品である懸念が残る。このように不合格とすべきロットを合格としてしまう可能性を「消費者危険」と呼ぶ。逆に、合格とすべきロットを不合格にしてしまう可能性は「生産者危険」という。なお、抜取検査が望まれるのは破壊検査が必要な場合、数量が非常に多い場合、製品が連続体の場合等であり、全数検査が望まれるのはわずかな不良品の混入も許されない場合等である。' },
        { category:'品質マネジメントシステム（JIS Q 9000）', question:'JIS Q 9000:2015（品質マネジメントシステム－基本及び用語）における「トレーサビリティ」の定義として、適当なものはどれか。', options:['対象の履歴、適用又は所在を追跡できること','要求事項を満たしていないこと','求められたとおりに、かつ、求められたときに、機能する能力','対象に本来備わっている特性の集まりが、要求事項を満たす程度'], answer:0, explanation:'JIS Q 9000:2015の用語及び定義において、トレーサビリティ（traceability）は「対象の履歴、適用又は所在を追跡できること」と定義されている。「要求事項を満たしていないこと」は不適合（nonconformity）、「求められたとおりに、かつ、求められたときに、機能する能力」はディペンダビリティ（dependability）、「対象に本来備わっている特性の集まりが要求事項を満たす程度」は品質（quality）の定義である。' }
    ],

    advanced: [
        { category:'電気通信工学', question:'フレネルゾーンの説明として正しいものはどれか。', options:['アンテナの指向性を表す概念','無線通信において送受信アンテナ間の見通し線を中心とする楕円体状の空間','光ファイバーの伝搬モードのこと','周波数帯域幅のこと'], answer:1, explanation:'フレネルゾーンは送受信アンテナを焦点とする楕円体状の空間。第1フレネルゾーン内に障害物がないことが安定した通信に必要。半径r=√(nλd1d2/(d1+d2))で計算。' },
        { category:'電気通信工学（計算）', question:'自由空間伝搬損失の計算において、周波数を2倍にすると伝搬損失はどのように変化するか。', options:['変化しない','約6dB増加する','約3dB増加する','約6dB減少する'], answer:1, explanation:'自由空間伝搬損失L=20log(4πd/λ)=20log(4πdf/c)。周波数fが2倍になると20log(2)≒6dB増加する。距離が2倍でも同様に6dB増加。' },
        { category:'電気通信工学', question:'「OFDM（直交周波数分割多重）」の特徴として正しいものはどれか。', options:['単一の搬送波を使う変調方式','多数の直交する搬送波を使い周波数利用効率が高くマルチパスに強い','時間軸で多重化する方式','アナログ変調の一種'], answer:1, explanation:'OFDMは互いに直交する多数のサブキャリアを使う変調方式。周波数利用効率が高くマルチパス干渉に強い。LTE・Wi-Fi 4以降・地上デジタル放送などに採用。' },
        { category:'電気通信工学', question:'光ファイバーの「シングルモード」と「マルチモード」の比較として正しいものはどれか。', options:['シングルモードはコア径が大きく長距離伝送に不向き','シングルモードはコア径が小さく分散が小さいため長距離・広帯域伝送に適する','マルチモードは光源にレーザーを使い高価','マルチモードの方が伝送損失が小さい'], answer:1, explanation:'シングルモードファイバーはコア径約9μmで1つの伝搬モードのみ使用。モード分散がなく長距離・広帯域。マルチモード（コア径50/62.5μm）は短距離向き。' },
        { category:'電気通信工学', question:'「MPLS（Multi-Protocol Label Switching）」の説明として正しいものはどれか。', options:['無線通信の多重化技術','IPヘッダの代わりに短いラベルを使いパケット転送を高速化するネットワーク技術','光ファイバーの多重化方式','VoIPの音声圧縮方式'], answer:1, explanation:'MPLSはIPパケットにラベルを付与し、ラベルに基づいて高速転送する技術。QoSの確保や仮想専用線（VPN）の構築に使われる。' },
        { category:'電気通信工学', question:'「WDM（波長分割多重）」の説明として正しいものはどれか。', options:['時間軸で光信号を多重化する方式','複数の異なる波長の光を1本の光ファイバーで同時に伝送する技術','電気信号を多重化する方式','無線通信の周波数多重方式'], answer:1, explanation:'WDM（Wavelength Division Multiplexing）は異なる波長（色）の光を1本のファイバーで同時伝送する技術。波長数を増やすことで容量を大幅に増加できる。' },
        { category:'施工管理', question:'「施工体系図」の説明として正しいものはどれか。', options:['工事の工程を時系列で表した図','発注者・元請・各下請業者の施工分担関係を図示したもの','品質管理の手順を表した図','安全管理体制を表した組織図'], answer:1, explanation:'施工体系図は各下請業者の作業内容・工事範囲・相互関係を明確にした図。建設業法により公共工事では工事現場の見やすい場所への掲示が義務付けられている。' },
        { category:'法規', question:'電気通信事業法における「端末設備」の接続について正しいものはどれか。', options:['どのような端末設備でも自由に接続できる','技術基準に適合した端末設備のみ電気通信回線に接続できる','通信事業者の端末設備のみ接続できる','無線端末のみ接続できる'], answer:1, explanation:'電気通信事業法第52条により、端末設備を電気通信回線設備に接続するには技術基準適合認定（技適）を受けた端末設備でなければならない。' },
        { category:'電気通信工学', question:'「スペクトラム拡散（SS）」技術の特徴として正しいものはどれか。', options:['信号を狭い帯域に集中させる方式','信号を広い帯域に拡散させることで耐ノイズ性・秘匿性を高める方式','信号を時分割で多重化する方式','アナログ変調の一種'], answer:1, explanation:'スペクトラム拡散は信号を本来必要な帯域より広い帯域に拡散させる方式。耐ノイズ性・耐干渉性・秘匿性が高い。CDMA・GPS・無線LANなどに使われる。' },
        { category:'電気工学（計算）', question:'抵抗R₁=4Ω、R₂=6Ωの並列接続の合成抵抗として正しいものはどれか。', options:['10Ω','2.4Ω','5Ω','0.42Ω'], answer:1, explanation:'並列合成抵抗1/R=1/R₁+1/R₂=1/4+1/6=3/12+2/12=5/12。よってR=12/5=2.4Ω。' },
        { category:'電気通信工学', question:'「SNMP（Simple Network Management Protocol）」の用途として正しいものはどれか。', options:['メールの送受信','ネットワーク機器の監視・管理','ファイルの転送','Webページの閲覧'], answer:1, explanation:'SNMPはネットワーク機器（ルーター・スイッチ・サーバー等）の状態監視・設定変更・障害検知に使われる管理プロトコル。MIBと呼ばれる管理情報データベースを使う。' },
        { category:'施工管理', question:'「ツールボックスミーティング（TBM）」の説明として正しいものはどれか。', options:['工具の点検会議のこと','作業開始前に作業員が集まり当日の作業内容・危険事項などを確認する短時間の打合せ','月1回開催される安全委員会','工事完了後に行う反省会'], answer:1, explanation:'TBMは毎朝作業開始前に行う短時間のミーティング。その日の作業内容・役割分担・危険箇所・KY活動を確認し、事故防止を図る。' },
        { category:'法規', question:'「建設リサイクル法（建設工事に係る資材の再資源化等に関する法律）」における特定建設資材に含まれないものはどれか。', options:['コンクリート','アスファルト・コンクリート','木材','ガラス'], answer:3, explanation:'建設リサイクル法の特定建設資材はコンクリート・コンクリートおよび鉄からなる建設資材・木材・アスファルト・コンクリートの4種類。ガラスは含まれない。' },
        { category:'電気通信工学', question:'「DWDM（高密度波長分割多重）」においてチャネル間隔として標準化されているものはどれか（ITU-T G.694.1）。', options:['0.1nm間隔','0.4nm（50GHz）または0.8nm（100GHz）間隔','1nm間隔','10nm間隔'], answer:1, explanation:'ITU-T G.694.1ではDWDMのチャネル間隔として100GHz（約0.8nm）や50GHz（約0.4nm）などが標準化されている。高密度化により1本のファイバーに多数チャネルを収容できる。' },
        { category:'施工管理', question:'「完成検査（竣工検査）」について正しいものはどれか。', options:['着工前に行う設計図書の確認作業','施工中に行う中間確認作業','工事完成後に設計図書と照合して品質・数量などを確認する検査','材料搬入時に行う確認作業'], answer:2, explanation:'完成検査は工事完了後に発注者（または監督員）が行う最終確認検査。設計図書・仕様書との整合、品質・数量・機能の確認を行い、合格後に引き渡しとなる。' },
        { category:'法規', question:'「電気通信主任技術者」について正しいものはどれか。', options:['すべての電気通信事業者が選任しなければならない','電気通信事業者が事業用電気通信設備の工事・維持・運用を監督するために選任しなければならない','建設業者が選任しなければならない','資格は不要で誰でもなれる'], answer:1, explanation:'電気通信事業法第45条により、電気通信事業者は事業用電気通信設備の工事・維持・運用を監督させるため、電気通信主任技術者を選任しなければならない。' },
        { category:'電気通信工学', question:'「PLC（電力線搬送通信）」の説明として正しいものはどれか。', options:['光ファイバーを使った通信技術','既存の電力線を使ってデータ通信を行う技術','携帯電話の通信方式','衛星通信の一種'], answer:1, explanation:'PLC（Power Line Communication）は商用電力線をデータ通信媒体として使用する技術。宅内LANや低圧配電網を使ったスマートメーターに利用される。' },
        { category:'施工管理', question:'「特定化学物質障害予防規則（特化則）」に関して正しいものはどれか。', options:['電磁波から労働者を守るための規則','鉛・六価クロム・石綿などの有害化学物質から労働者の健康を守るための規則','工事現場の墜落防止に関する規則','重機操作に関する資格の規則'], answer:1, explanation:'特化則は職業性疾病の原因となる鉛・有機溶剤・石綿（アスベスト）などの特定化学物質を扱う作業における健康障害防止のための規則。' },
        { category:'電気通信工学（計算）', question:'アンテナの実効輻射電力（ERP）が1000Wのとき、等方性アンテナ（dBi）換算で何dBiか（実効輻射電力はダイポールアンテナ基準）。', options:['30dBm','60dBm','約32.15dBi','約62.15dBi'], answer:2, explanation:'ERP 1000W=30dBWをダイポールアンテナ基準dBdで表すと30dBd。dBi=dBd+2.15なので30+2.15≒32.15dBi。' },
        { category:'法規', question:'「騒音規制法」における「特定建設作業」として定められていないものはどれか。', options:['くい打ち機を使用する作業','削岩機を使用する作業','コンクリートプラントを設けて行う作業','スコップによる手掘り作業'], answer:3, explanation:'騒音規制法の特定建設作業はくい打ち機・鋲打ち機・削岩機・空気圧縮機・コンクリートプラントなどを使う作業。手工具による作業は対象外。' },
        { category:'電気通信工学', question:'「NGN（Next Generation Network）」の特徴として正しいものはどれか。', options:['回線交換技術をベースにした次世代ネットワーク','IPをベースとし音声・データ・映像を統合的に扱うオープンな次世代ネットワーク','無線通信専用のネットワーク','衛星通信ネットワーク'], answer:1, explanation:'NGNはIPをベースとした次世代電話網。音声・データ・映像を統合してQoS・セキュリティ・信頼性を確保しながら提供するオープンネットワーク。NTTのひかり電話に使われている。' },
        { category:'施工管理', question:'「根切り工事」における山留め工法の「親杭横矢板工法」の説明として正しいものはどれか。', options:['H型鋼などを一定間隔で打設し、掘削に合わせて横矢板を挿入する工法','鋼矢板を連続して打設する工法','コンクリートを現場で打設する工法','グラウトで地盤を固める工法'], answer:0, explanation:'親杭横矢板工法はH鋼などの親杭を一定間隔で打設し、掘削の進行に合わせて親杭間に横矢板（木製・PC板）を挿入して土圧を受ける山留め工法。軟弱地盤には不向き。' },
        { category:'法規', question:'「廃棄物の処理及び清掃に関する法律（廃棄物処理法）」において、電気通信工事で発生する廃プラスチック類は何に分類されるか。', options:['一般廃棄物','産業廃棄物','特別管理廃棄物','有価物'], answer:1, explanation:'建設工事で発生する廃プラスチック類・金属くず・ガラスくず・コンクリートくず等は産業廃棄物に分類される。適切な処理業者に委託して処理しなければならない。' },
        { category:'電気通信工学', question:'「スループット」の説明として正しいものはどれか。', options:['理論上の最大伝送速度','実際のネットワークで単位時間内に転送できるデータ量（実効転送速度）','回線の遅延時間','信号の周波数'], answer:1, explanation:'スループットは実際のネットワークにおける実効転送速度（bps）。ヘッダオーバーヘッド・再送・輻輳制御などにより理論値（回線帯域幅）より低くなる。' },
        { category:'施工管理', question:'「工事写真」の撮影について正しいものはどれか。', options:['工事完成後に主要箇所のみ撮影すればよい','施工の各段階（着工前・施工中・完成後）において、設計図書との整合が確認できるよう適切に撮影・整理する','写真は任意であり義務ではない','スマートフォンによる撮影は認められない'], answer:1, explanation:'工事写真は施工記録として重要。着工前の現況・施工中の埋設物や隠蔽部・完成状況を撮影し、施工管理の証拠として整理・保存する。公共工事では提出が義務付けられている。' },
        { category:'電気通信工学', question:'「LTE（Long Term Evolution）」の特徴として正しいものはどれか。', options:['第2世代（2G）移動通信システム','OFDMA・MIMOを採用した第4世代（4G）に向けた3.9世代移動通信システム','有線通信の規格','衛星通信の規格'], answer:1, explanation:'LTEはOFDMA（下り）・SC-FDMA（上り）とMIMO技術を採用した第3.9世代移動通信規格。LTE-Advancedが本来の4G規格として標準化された。' },
        { category:'法規', question:'「電気通信設備工事担任者」の資格について正しいものはどれか。', options:['電気通信事業法に基づき、端末設備等の接続工事を行うために必要な資格','建設業法に基づく資格','電波法に基づく資格','自主的な民間資格であり法的根拠はない'], answer:0, explanation:'工事担任者は電気通信事業法に基づく国家資格。端末設備等を電気通信回線設備に接続するための工事を行い・監督する者に必要。AI・DD総合種などの種別がある。' },
        { category:'電気通信工学', question:'「IDS（侵入検知システム）」と「IPS（侵入防止システム）」の違いとして正しいものはどれか。', options:['IDSは不正アクセスを検知して通報し、IPSは検知に加えて自動的にブロックする','IDSはIPSの旧称で機能は同じ','IPSは検知のみでIDSがブロックする','どちらも同じ機能でメーカーによって呼称が異なる'], answer:0, explanation:'IDSはネットワーク・ホストへの不正アクセスを検知してアラートを発するシステム。IPSはさらに進んで不正なパケットを自動的にブロックする予防的なシステム。' },
        { category:'施工管理', question:'「受電設備工事」における「耐圧試験」の目的として正しいものはどれか。', options:['通信速度を測定すること','電気設備の絶縁性能が規定値以上あることを確認すること','機器の消費電力を確認すること','接地抵抗値を確認すること'], answer:1, explanation:'耐圧試験（絶縁耐力試験）は最大使用電圧の1.5倍（低圧は500V等）の電圧を印加して絶縁破壊しないことを確認する試験。電気設備技術基準で義務付けられている。' },
        { category:'法規', question:'「公衆電気通信回線（NTT加入電話等）」に端末設備を接続する場合の条件として正しいものはどれか。', options:['誰でも自由に接続できる','技術基準適合認定（技適）を受けた端末設備、またはその旨の認定を受けた自営端末設備のみ接続できる','NTTが販売した端末設備のみ接続できる','無線端末のみ接続できる'], answer:1, explanation:'電気通信事業法により、電気通信回線設備に接続する端末設備は技術基準適合認定を受けたもの、または同等の認定を受けた自営端末設備でなければならない。' },
        { category:'線路施工(配線材)', question:'屋内に設置する金属製ケーブルラックの施工に関する記述として、適当でないものはどれか。', options:['アルミ製ケーブルラックは、支持物との間に異種金属接触による腐食を起こさないように措置する','ケーブルラック本体相互は、ボルト等により機械的に接続すれば、電気的には接続しなくてもよい','温度変化の大きな箇所に施設する直線部分の長いケーブルラックには、伸縮継手金具を使用する','使用電圧が300V以下の低圧ケーブルの配線に使用するケーブルラックには、D種接地工事を施す'], answer:1, explanation:'ケーブルラック本体相互を連結する際には、機械的に堅牢な接続を実施するとともに、両者間を等電位に保つために電気的な接続も施さなくてはなりません。接地工事の区分は電圧により、A種とB種は高圧用、低圧はC種(300V超)とD種(300V以下)です。使用電圧300V以下の場合はD種接地工事となり、B種を施すという記述が出たら誤りです。' },
        { category:'線路施工(配線材)', question:'屋内配線に使用する合成樹脂管の施工に関する記述として、適当なものはどれか。', options:['太さ28mmの硬質ビニル管を曲げるときは、曲げの内側の半径を管内径の5倍以上とする','PF管の露出配管において管を支持するサドルの支持点間の距離は、2m以下とする','CD管は耐燃性を有するため、露出場所への配管に適している','CD管相互の接続は、適合するカップリングにより接続する'], answer:3, explanation:'CD管相互の接続は適合するカップリングによる接続が適当です。合成樹脂可とう電線管の曲げ半径は、太さが22mmを超える場合、曲げの内側部分の半径を管内径の6倍以上としなければならず、5倍では不可です。可とう電線管の支持点間距離は内線規程により1m以下と定められており、2mではNGです。また耐燃性を有するのはPF管であり、CD管は耐燃性がないためオレンジ色に着色して区別され、主にコンクリート埋設に用いられます。' },
        { category:'携帯電話システム（LTE）', question:'第4世代移動通信システムと呼ばれるLTEに関する記述として、適当でないものはどれか。', options:['データの変調において、FSKを採用している','複数のアンテナにより送受信を行うMIMO伝送技術を採用している','無線アクセス方式において、上りリンクと下りリンクで異なった方式を採用している','パケット交換でサービスすることを前提としている'], answer:0, explanation:'LTE携帯電話システムでは、データの変調はPSKとQAMとで行われている。FSKもデジタル変調方式の1つだが、あまり多くの信号を載せることができないため、現行の携帯電話システムでは採用されていない。MIMOは送信・受信アンテナとも複数となっている無線伝送のスタイルで採用されている。①が不適当。' },
        { category:'携帯電話システム（LTE）', question:'携帯電話システムであるLTEに関する記述として、適当でないものはどれか。', options:['複数の送受信アンテナにより、異なる信号のセットを同一時間に同一周波数帯を用いて送受信することで、伝送容量の増大や伝送品質の向上を図るMIMOが採用されている','上りリンクの無線アクセス方式にはSC-FDMAを採用し、下りリンクの無線アクセス方式にはCDMAを採用している','音声サービスを実現するため、IPパケットにより音声データをリアルタイムに伝送するVoiceover LTEを採用している','フェージング等の無線環境に合わせて、データの変調方式を柔軟に切り替える適応変調を採用している'], answer:1, explanation:'LTEの無線アクセス方式は、基地局から移動端末へ向かう下り回線ではOFDMAが採用されている。上り回線ではSC-FDMAを用いる。下りはCDMAではないため②が不適当。また符号誤りを防ぐため、受信電界強度が低くなるにつれて変調方式を切り替える適応変調が採用されている。' },
        { category:'電気の基礎（電磁気学）', question:'右図に示すように、真空中にr=0.1〔m〕の間隔で平行に置いた無限に長い2本の直線導体に、同じ向きにI1=I2=2〔A〕の電流が流れているとき、導体1mあたりに働く力F〔N/m〕として、適当なものはどれか。ただし、真空中の透磁率μ0=4π×10^-7〔H/m〕とする。', options:['4×10^-6〔N/m〕','8×10^-6〔N/m〕','16×10^-6〔N/m〕','25×10^-6〔N/m〕'], answer:1, explanation:'導線1mあたりに働く力はF=μ0×(I1・I2)/(2πr)〔N/m〕。諸数値を代入すると、F=4π×10^-7×(2×2)/(2π×0.1)=8.0×10^-6〔N/m〕となり②が適当。電流の向きが同じときは2本の導線は引き合い、反対向きのときは反発し合う。' },
        { category:'電気の基礎（コンデンサ）', question:'下図に示す電極間の距離d0=0.02〔mm〕、電極の面積S=100〔cm2〕の平行板空気コンデンサにおいて、電極間に厚さd1=0.01〔mm〕、比誘電率εr=10の誘電体を挿入し、電極間に充電電圧V=24〔V〕を与えたときの、このコンデンサが蓄える電気量Q〔μC〕の値として、適当なものはどれか。ただし、コンデンサの初期電荷は0とし、端効果は無視できるものとする。また、真空の誘電率ε0=8.85×10^-12〔F/m〕、空気の比誘電率は1とする。', options:['0.01〔μC〕','0.19〔μC〕','0.30〔μC〕','2.3〔μC〕'], answer:1, explanation:'誘電体を電極間距離の半分のみ挿入しているため、真空（空気）部分と誘電体部分で作られる2つのコンデンサが直列につながっているとして計算する。C0=8.85×10^-9〔F〕、Cr=8.85×10^-8〔F〕、合成静電容量は和分の積でC=8.045×10^-9〔F〕。Q=C・V=8.045×10^-9×24=0.193×10^-6〔C〕となり②が適当。' },
        { category:'直流回路', question:'下図に示す最大目盛Ia=50〔mA〕、内部抵抗r=5.6〔Ω〕の電流計に分流器を接続して、測定範囲をI=0.4〔A〕まで拡大したときの分流器の倍率mと、分流器の抵抗RS〔Ω〕の値の組み合わせとして、適当なものはどれか。', options:['分流器の倍率m：7、分流器の抵抗RS：0.9〔Ω〕','分流器の倍率m：7、分流器の抵抗RS：0.8〔Ω〕','分流器の倍率m：8、分流器の抵抗RS：0.9〔Ω〕','分流器の倍率m：8、分流器の抵抗RS：0.8〔Ω〕'], answer:3, explanation:'電流計に流せる最大の電流は0.05〔A〕なので、残りの0.35〔A〕を分流器のルートに迂回させる。電流計の両端にかかる最高電圧はE=0.05×5.6=0.28〔V〕で、これが分流器RSにも印加されるため、RS=0.28/0.35=0.8〔Ω〕。分流器の倍率は抵抗値の比ではなく、全体として何倍まで電流を流せるかを指すので、m=0.4/0.05=8。④が適当。' },
        { category:'交流回路', question:'下図に示すRLC直列回路において、R=40〔Ω〕、XL=20〔Ω〕、XC=60〔Ω〕のとき、インピーダンスの大きさZ〔Ω〕と回路の性質の組み合わせとして、適当なものはどれか。', options:['Z=40√2〔Ω〕、回路の性質：容量性','Z=40√2〔Ω〕、回路の性質：誘導性','Z=40√5〔Ω〕、回路の性質：容量性','Z=40√5〔Ω〕、回路の性質：誘導性'], answer:0, explanation:'直列接続の合成インピーダンスはZ=√(R2+(XL−XC)2)。代入するとZ=√(40^2+(20−60)^2)=40√2〔Ω〕。リアクタンスをベクトルで見たとき、XL（コイル）寄りなら誘導性、XC（コンデンサ）寄りなら容量性となる。本例題ではXC寄りなので容量性の回路であり、①が適当。' },
        { category:'交流回路', question:'下図に示すRLC並列回路において、回路のインピーダンスZ〔Ω〕として、適当なものはどれか。ただし、ωは電源の角周波数〔rad/s〕である。', options:['Z = 1 / ( R + j(ωL − 1/ωC) )〔Ω〕','Z = 1 / ( R + j(ωC − 1/ωL) )〔Ω〕','Z = R / ( 1 + jR(ωC − 1/ωL) )〔Ω〕','Z = R / ( 1 + jR(ωL − 1/ωC) )〔Ω〕'], answer:2, explanation:'抵抗・コイル・コンデンサの3素子が並列につながる回路では、それぞれのアドミタンス（インピーダンスの逆数）を足す。1/Z=1/R+1/(jωL)+jωC を整理して逆数をとると、Z=R/(1+jR(ωC−1/ωL))〔Ω〕となり、③が適当。' },
        { category:'情報源符号化（PCM方式）', question:'パルス符号変調（PCM）に関する記述として、適当でないものはどれか。', options:['標本化は、連続したアナログ信号の振幅を一定の時間間隔で区切り、断続的な信号にすることであり、この時間間隔は標本化定理により決められる','パルス符号変調は、標本化、量子化、符号化の3段階の手順で行われる','符号化は、量子化された信号の振幅値を2進符号に置き換えることである','量子化によって生じる量子化前の信号の振幅値と量子化後の信号の振幅値の差を、折り返し雑音という'], answer:3, explanation:'PCMは標本化→量子化→符号化の順で処理を行う。アナログ信号の元値と量子化された後のデータとの差分は「量子化雑音」または「量子化誤差」といい、折り返し雑音ではない。したがって④が不適当。標本化は取り扱うアナログ信号の最高周波数の2倍以上の周波数でサンプリングを行う。' },
        { category:'変調方式（QAM）', question:'デジタル変調のQAM方式に関する記述として、適当でないものはどれか。', options:['16QAMは、受信信号レベルが安定であれば16PSKに比べBER特性が良好となる','64QAMは、16QAMよりも1シンボルで多くの情報を伝送できる','QAM方式は、搬送波の位相と周波数の両方を変化させる変調方式である','QAM方式は、我が国の地上デジタルテレビ放送のOFDM信号を構成するサブキャリアの変調に利用されている'], answer:2, explanation:'QAM変調は、複数の振幅を持つ2つの正弦波を互いに軸をπ/2ラジアン変化させて掛け算する方式であり、搬送波の位相と周波数を変化させる方式ではない。③が不適当。16PSKの信号点間距離は0.39、16QAMは0.47であり、16QAMのほうがエラーに強い。64QAMは1シンボルあたり6ビット分の情報を載せる。' },
        { category:'変調方式（QAM）', question:'デジタル変調のQAM方式に関する記述として、適当でないものはどれか。', options:['16QAMは、直交している2つの4値ASK変調信号を合成して得ることができる','16QAMは、受信信号レベルが安定であれば16PSKに比べBER特性が良好となる','64QAMの信号点間距離は、QPSK（4PSK）の1/7となる','64QAMは、16QAMに比べ同程度の占有周波数帯幅で2倍の情報量を伝送できる'], answer:3, explanation:'64QAMは16QAMよりも1.5倍の情報量を伝送することが可能。64値は2の6乗で6ビット分、16値は2の4乗で4ビット分であり、6ビット/4ビット=1.5倍。したがって④が不適当。16QAMは4値ASKを掛け合わせて4×4=16値をとる。64QAMの信号点間距離は約0.2、4PSKは約1.4で約7倍の開きがある。' },
        { category:'変調方式（シフトキーイング）', question:'デジタル無線の変調方式に関する記述として、適当でないものはどれか。', options:['ASKは、伝送信号の振幅の違いに情報を載せる方式であり、振幅性雑音や受信信号のレベル変化によってBERが悪化しやすい','QPSKは、4つの位相点を用いて情報を伝送する方式であり、1シンボルで4ビットの情報を送ることができる','64QAMは、直交する2つの8値のASK変調信号を合成する方式であり、1シンボルで6ビットの情報を送ることができる','FSKは、情報を搬送波の周波数の違いに置き換えて伝送する方式であり、振幅性雑音に強い'], answer:1, explanation:'4PSK（QPSK）は、1シンボルに2ビット分の情報を格納し、これの表現に4値を必要とする。4ビットではないため②が不適当。64QAMは縦軸8通り、横軸8通りの振幅を持ち8×8=64個の位置を取ることができ、1シンボルで64値（6ビット分）を伝送可能。' },
        { category:'変調方式（シフトキーイング）', question:'デジタル変調であるPSKに関する記述として、適当でないものはどれか。', options:['搬送波電力対雑音電力比（C/N）が同じ場合、BPSKと8PSKの誤り率を比較するとBPSKのほうが誤り率が小さい','QPSKの変調信号は、搬送波発振回路から出力される搬送波とその搬送波の位相を90度ずらした搬送波にそれぞれBPSK変調を行った後、この2つの信号を合成することで得られる','PSKは、ベースバンド信号の0と1に応じて、搬送波の振幅を変化させる変調方式である','QPSKは1シンボルで2ビットの情報を伝送でき、8PSKは1シンボルで3ビットの情報を伝送できる'], answer:2, explanation:'PSKは搬送波を時間方向にずらして（位相を変化させて）信号を表現する変調方式である。搬送波の振幅を変化させる変調方式はASKであり、PSKではない。③の記載が不適当。2PSKと8PSKを比べると、2PSKが格納できる情報量は1/3だが送受信エラーが起きた場合の被害も1/3で済む。' },
        { category:'多元接続', question:'CDMA（符号分割多元接続）に関する記述として、適当なものはどれか。', options:['個々のユーザに使用チャネルとして直交周波数関係にある複数のキャリアを個別に割り当てる方式である','個々のユーザに使用チャネルとして個別に信号のスペクトルを拡散する拡散符号を割り当てる方式である','個々のユーザに使用チャネルとして1つの搬送波のタイムスロットを個別に割り当てる方式である','個々のユーザに対して個別に使用する周波数を割り当てる方式である'], answer:1, explanation:'信号のスペクトルを拡散する符号を使用チャネルとして個々のユーザに割り当てる方式がCDMAであり、②が適当。①の直交周波数関係にある複数のキャリアを割り当てる方式はOFDMA、③のタイムスロットを個別に割り当てる方式はTDMA、④の周波数を割り当てる方式はFDMAである。' },
        { category:'多元接続', question:'移動体通信で用いられる無線アクセス方式の特徴に関する記述として、適当でないものはどれか。', options:['無線資源を周波数で分割するFDMA方式は、デジタル変調だけでなくアナログ変調にも用いることができる','送信信号にユーザ固有の符号を乗算してスペクトルを拡散するCDMA方式は、隣接する基地局間で異なる周波数を使用する必要がある','無線資源を時間で分割するTDMA方式は、各ユーザはフレームごとに間欠的に情報を送信するため、音声データ等を圧縮して送信する必要があることから、デジタル変調で用いられる','直交関係にある複数のキャリアを個々のユーザの使用チャネルに割り当てるOFDMAは、移動通信のマルチパス環境下でも高品質な信号伝送が可能である'], answer:1, explanation:'CDMA方式は、ユーザに固有の符号を付与してスペクトル拡散を行うことで、他のユーザと同じ周波数を用いても区別が可能。基地局に対しても同一の周波数を使うことで、瞬断なく基地局間を移動できるソフトハンドオーバが実現した。したがって②が不適当。' },
        { category:'電波伝播', question:'中波帯の電波の伝わり方に関する記述として、適当なものはどれか。', options:['直接波による伝搬が主体であるが、電波の伝搬路中に降雨域があると降水粒子による散乱やエネルギーの吸収による電波の減衰が発生し、周波数が高くなるほどその減衰が大きくなる','昼間は主に地表波により伝搬し、夜間は電離層のE層で反射して遠くまで伝搬する','大地と電離層のD層の間を反射しながら伝搬するので、導波管の中を伝わる電波と同じような電磁界の模様が生じ、減衰が少なく非常に遠くまで伝搬する','スポラディックE層の発生により、電波が反射され、見通し距離を超えて非常に遠くまで伝搬することがある'], answer:1, explanation:'降雨による減衰を多く受けるのは10GHz以上の高い周波数帯（SHF帯）なので①は不適当。電離層のうちE層で反射を起こすのは中波であり②が適当。電離層のD層で反射をするのは周波数の低い長波（LF）なので③は不適当。スポラディックE層で反射するのは超短波（VHF）帯なので④も不適当。' },
        { category:'電波伝播', question:'VHF帯の電波の見通し外伝搬に関する記述として、適当でないものはどれか。', options:['電波の伝搬路上に山岳があるとき、山岳の尾根の厚みが波長に比べて薄く、完全導体とみなせるような場合には、山頂が二次放射源となった電波の受信電界強度が、山岳のない場合の球面大地回折波より著しく強くなる場合がある','大地と電離層のD層の間を反射しながら伝搬するので、導波管の中を伝わる電波と同じような電磁界の模様が生じ、減衰が少なく非常に遠くまで伝搬する','送信点および受信点から見通せる地上から数km上空の空間に電波を放射すると、送受信アンテナのビームが交差する部分のうち、受信アンテナのビーム角に含まれる方向に散乱された電波が受信される','地上約100kmの所に突然電子密度の濃い層のスポラディックE層が現われると、電波が密度の濃い層で反射され、地上に戻ってくるため非常に遠くまで伝搬する'], answer:1, explanation:'VHF帯は通常はD〜Fの全ての層を突き抜けてしまい、宇宙へと進む。D層での反射は起こさないため②が不適当。①はナイフエッジと呼ばれる尖った山岳の尾根で起こる回折現象。③は対流圏散乱を意味する。④のスポラディックE層は突発的に発生し、VHF帯はこの層で反射を起こして想定外の遠方まで電波が届く場合がある。' },
        { category:'マイクロ波通信（中継方式）', question:'マイクロ波通信の中継方式の1つである無給電中継方式に関する記述として、適当なものはどれか。', options:['受信したマイクロ波からベースバンド信号を復調し、波形整形や同期調整を行った後、再び変調して送信する方式である','受信したマイクロ波をそのまま増幅して送信するか、または受信したマイクロ波を目的の周波数に変換した後に増幅して送信する方式である','受信したマイクロ波帯の信号を中間周波数に変換して増幅した後、再びマイクロ波帯に変換して送信する方式である','電波を反射板等で反射させて、電波の伝搬方向を変えて中継する方式である'], answer:3, explanation:'①は再生中継、②は直接中継、③はヘテロダイン中継の説明でありいずれも不適当。電気的な中継装置を持たずに反射板等で伝搬方向を変える形式を無給電中継方式と呼び、④が適当。反射板を鏡のように配置する形や、2つの空中線を給電線で背中合わせに接続する形等がある。' },
        { category:'マイクロ波通信（中継方式）', question:'マイクロ波通信の中継方式に関する記述として、適当でないものはどれか。', options:['受信したマイクロ波帯の信号を中間周波数に変換して増幅した後、再びマイクロ波帯に変換して送信する方式をヘテロダイン中継方式という','電波を反射板等で反射させて電波の伝搬方向を変えて中継する方式を、無給電中継方式という','受信した信号を目的の周波数に変換した後、または直接増幅して送信する方式を直接中継方式といい、衛星回線の中継で用いられる','受信波よりベースバンド信号を復調し、波形整形や同期調整を行った後、再び変調して送信する方式を再生中継方式といい、アナログ回線の中継に用いられる'], answer:3, explanation:'再生中継は、中継局に到着した受信波をいったん復調して信号レベルまで戻し、波形の歪み等を一掃して完全な形のパルスを生成し直す方式。つまりデジタル信号のための方式であって、アナログ回線には適用できない。したがって④が不適当。' },
        { category:'交換方式', question:'回線交換方式とパケット交換方式の特徴に関する記述として、適当でないものはどれか。', options:['回線交換方式は、送信側と受信側のデータ端末装置の通信速度が異なっていてもよい','回線交換方式は、送信側と受信側のデータ端末装置の伝送制御方式が同じでなければならない','パケット交換方式は、回線交換方式に比べて回線の利用効率が高い','パケット交換方式は、各パケットは異なる伝送路をたどる可能性がある'], answer:0, explanation:'回線交換方式の場合は、送信方と受信方とで、データ端末装置の通信速度を一致させる必要がある。①の記述は不適当。同様に伝送制御方式も一致させなければならない。パケット交換方式はデータを圧縮して送受信できることや、1つの回線をユーザが占有しないことから利用効率は高くなる。' },
        { category:'交換方式', question:'パケット交換方式に関する記述として、適当でないものはどれか。', options:['端末装置からのデータを、パケットと呼ぶ一定量の単位に区切って交換機内のメモリに蓄積し、パケットに付加された宛先等の情報によりパケットを次の交換機に転送する','通信回線を特定の端末装置間で占有することがないので、通信回線の利用効率を高めることができる','パケットは、故障箇所を回避する迂回ルートを自動的に選択して転送される','送信側の端末装置と受信側の端末装置の通信速度を一致させる必要がある'], answer:3, explanation:'パケット交換方式は回線交換方式と異なり、送受信間で端末の通信速度を一致させる必要はない。通信プロトコルであるTCP/IPに準拠していれば、双方で適切な速度を選択して伝送が行なわれる。したがって④が不適当。' },
        { category:'コンピュータ', question:'コンピュータの中央処理装置に関する記述として、適当でないものはどれか。', options:['制御装置は、主記憶装置に記憶されているプログラムの命令を取り出して解読し、制御信号を各装置に送り制御する','中央処理装置は、制御装置、演算装置、主記憶装置および補助記憶装置で構成される','演算装置は、制御装置からの制御信号により算術・論理・比較・シフト等の演算を行う','中央処理装置の性能を表す指標であるMIPSは、1秒間に実行できる命令の数を10^6で除した値である'], answer:1, explanation:'中央処理装置は制御装置と演算装置を包括した概念として定義され、一般論的には記憶装置は中央処理装置には含まない場合が多い。少なくとも補助記憶装置を含むことはないため、②が不適当。MIPSは1秒間に実行できる百万単位の命令数なので④は適当。' },
        { category:'コンピュータ', question:'ハードディスク装置に関する記述として、適当でないものはどれか。', options:['平均アクセス時間は、平均シーク時間、平均サーチ時間およびデータ転送時間を合計した時間である','セクタは、トラックをいくつかに等分割した領域で、データの読み書きの最小単位である','平均シーク時間は、磁気ディスクの1回転に要する時間の半分である','磁性材料を塗布した磁気ディスクを高速で回転させ、磁気ヘッドによってデータの読み書きを行う'], answer:2, explanation:'シーク時間とは位置決め時間ともいい、磁気ヘッドが目的の場所まで移動するのにかかる時間のこと。「磁気ディスクの1回転に要する時間の半分」は平均サーチ時間の説明であるため、③が不適当。' },
        { category:'コンピュータ', question:'コンピュータシステムの利用形態である、バッチ処理に関する記述として、適当なものはどれか。', options:['コンピュータに入力するデータを、一定量または一定期間蓄えておき、それをひとまとめにして処理する方式である','人とコンピュータが、ディスプレイ等を通じて、やり取りをしながら処理を進める方式である','コンピュータの処理時間をごく短い時間単位に分割し、それを各端末に順次割り当てて実行することで、各端末の利用者があたかもコンピュータを独占しているかのように使える方式である','処理要求やデータの発生に対して、ただちに処理を行い結果を返す方式である'], answer:0, explanation:'データを一定量あるいは一定期間蓄えておき、あるタイミングで一括処理する方式がバッチ処理であり①が適当。②は対話型処理、③はマルチタスク、④はリアルタイム処理の説明である。' },
        { category:'コンピュータ', question:'コンピュータシステムの利用形態に関する記述として、適当なものはどれか。', options:['コンピュータに入力するデータ等を、一定量または一定期間蓄えておき、それをひとまとめにして処理する方式をリアルタイム制御処理という','人とコンピュータが、ディスプレイ等を通じて、やり取りをしながら処理を進める方式を対話型処理という','センサにより機器の状態や外部の状況を常に監視し、状態や環境の変化に応じて機器の制御を行う方式をバッチ処理という','オンラインで接続された端末からの要求に基づいて、関連する複数の処理を1つの処理単位として即座に実行し結果を返す方式を、パイプライン処理という'], answer:1, explanation:'リアルタイム処理は処理要求を即座に実行して結果を返す方式なので①は不適当。人間に近い形でコンピュータを扱える方式を対話型処理と呼ぶため②が適当。バッチ処理は一定量・一定期間蓄積して一括処理する方式なので③は不適当。関連する複数の事項を1つの処理単位として実行する方式はトランザクション処理であり④も不適当。' },
        { category:'データベース', question:'データベース管理システム（DBMS）の機能に関する記述として、適当でないものはどれか。', options:['データベース定義機能とは、データベースの構造やデータの格納形式を内部スキーマ、概念スキーマおよび外部スキーマとして定義する機能をいう','障害回復機能とは、バックアップファイルやログファイルを事前に採取し、データベースの運用中に発生した障害から回復させるための機能をいう','排他制御機能とは、データベースの利用者ごとに利用できるデータを制限することにより、不正なアクセスからデータを守る機能をいう','データベース操作機能とは、データベースへの操作（登録、読出し、更新、削除）をデータベース言語を用いて行う機能をいう'], answer:2, explanation:'排他制御機能は、複数のユーザによって共有されているデータに対して、データの整合性を保つための仕組みであり、最初の1ユーザのみにアクセス権を与えて他のユーザには更新を禁止する手法。不正なアクセスからデータを守る機能ではないため、③が不適当。' },
        { category:'データベース', question:'データベースのデータモデルの1つであるリレーショナルモデルに関する記述として、適当なものはどれか。', options:['データを2次元の表形式で表し、複数の表を関連付けてデータ構造を表現するデータモデルである','データを階層型の木構造で表現し、データ間を網の目状につないでおり、親が複数の子を持つことができるだけでなく、子も複数の親を持つことができる','データを階層型の木構造で表現し、データ間は親子関係になっており、親は複数の子を持つことができるが、子は1つの親しか持つことができない','文字や数値等のデータだけでなく、データとデータに対する操作を含めてオブジェクトとして扱うデータモデルである'], answer:0, explanation:'リレーショナル型データベースはテーブルの概念を用いてデータを表形式で整理する方式であり①が適当。子が複数の親を持てる形はネットワーク型（②）、子が1つの親しか持てない形式は階層型（③）、データと操作をまとめて扱うのはオブジェクト指向データベース（④）である。' },
        { category:'半導体', question:'半導体に関する記述として、適当でないものはどれか。', options:['シリコンの真性半導体にヒ素等のドナーを混入したN形半導体では、自由電子の数が正孔の数より多くなる','半導体の電気伝導度は、真性半導体に添加されるドナーやアクセプタとなる不純物の濃度に依存する','逆方向電圧を加えたPN接合ダイオードでは、空乏層の領域で正孔と自由電子が結合しにくい状態になり、空乏層が狭くなる','ガリウムヒ素を用いた化合物半導体では、半導体材料中を移動する電子の速度がシリコン半導体より速くなり、電子回路の高速動作が可能になる'], answer:2, explanation:'PN接合に逆方向の電圧を印加すると、電子と正孔の双方が電源側に引っ張られるため、空乏層の間隔は広くなる。したがって③が不適当。' },
        { category:'半導体', question:'トランジスタ増幅回路の接地方式に関する記述として、適当でないものはどれか。', options:['エミッタ接地回路の入力信号と出力信号は、同位相である','ベース接地回路の入力信号と出力信号は、同位相である','コレクタ接地回路の入力信号と出力信号は、同位相である','コレクタ接地回路は、エミッタホロワとも呼ばれている'], answer:0, explanation:'エミッタ接地回路では、ベース電流が大きくなるほど比例して電圧降下も大きくなり、出力には入力と裏返しの模様の波形が現れる。波形の正負が反転した状態で位相で見ると180度ずれた逆位相になるため、①が不適当。' },
        { category:'各種回路', question:'下図に示す発振回路のブロック図に関する記述として、適当でないものはどれか。', options:['特定の周波数を発振させるには、帰還回路に周波数選択回路を入れて、単一周波数だけを帰還するようにする','増幅度Aの増幅回路と帰還率βの帰還回路で構成された発振回路を発振させるための利得条件は、A・β≧1にする必要がある','帰還回路をコイルLとコンデンサCで作る発振回路には、ハートレー発振回路がある','増幅回路と帰還回路で構成された発振回路を発振させるための、帰還回路の出力Vfと増幅回路の入力Viの位相条件は、逆位相にする必要がある'], answer:3, explanation:'増幅回路が吐き出した広帯域の信号の中から希望の周波数だけを帰還回路で絞り込み、増幅回路に戻して循環させて発振する仕組みであるため、位相は当然に同位相でなければならない。④が不適当。' },
        { category:'制御', question:'フィードバック制御システムに関する記述として、適当でないものはどれか。', options:['フィードバック制御とは、フィードバックによって制御量を目標値と比較し、それらを一致させるように操作量を生成する制御である','伝達関数を四角で囲んだものをブロックといい、ブロックと加算・減算・分岐の記号を組み合わせ、信号の流れを矢印で描いた図をシーケンス図という','フィードバック制御は制御量により、プロセス制御、サーボ機構、自動調整に分類される','目標値が時間的に一定である制御を定値制御、時間的に変化する目標値に追従する制御を追従制御という'], answer:1, explanation:'フィードバック制御の流れを描いた図表はブロック線図と呼ばれる。シーケンス図は主にシーケンス制御で用いられるため、②が不適当。' },
        { category:'制御', question:'フィードバック制御システムの制御動作に関する記述として、適当でないものはどれか。', options:['積分動作は、過去の偏差の積算値を操作量として与える動作であり、フィードバック制御システムの応答性の改善に効果がある','PID動作は、比例動作、積分動作、微分動作を組み合わせたもので、それぞれのゲインを適切に設定してフィードバック制御システムを構成する','微分動作は、偏差の変化率に微分ゲインを掛け算した値を操作量とするものであり、微分ゲインが大きな値ほど操作量が大きくなる','比例動作は、操作量を偏差に比例させる動作であり、フィードバック制御システムにおいて基本となる動作である'], answer:0, explanation:'積分動作（I動作）は偏差を時間に関して積分して比例動作に加える考え方で、オフセットを埋める方向に作用するが、積分するための準備として過去の偏差を蓄積するため応答性が悪い欠点がある。①が不適当。' },
        { category:'電波法令(無線設備)', question:'受信設備の条件に関する次の記述の□に当てはまる語句の組み合わせとして、「電波法」上、正しいものはどれか。「受信設備は、その副次的に発する(ア)または(イ)が、総務省令で定める限度をこえて、他の無線設備の機能に支障を与えるものであってはならない。」', options:['(ア)電波 (イ)高周波電流','(ア)電波 (イ)渦電流','(ア)熱 (イ)高周波電流','(ア)熱 (イ)渦電流'], answer:0, explanation:'電波法第29条(受信設備の条件)により、受信設備は、その副次的に発する電波又は高周波電流が、総務省令で定める限度をこえて他の無線設備の機能に支障を与えるものであってはならない。①が正しい組み合わせ。' },
        { category:'電波法令(無線設備)', question:'無線設備の送信装置における周波数の安定のための条件について、「電波法令」上、誤っているものはどれか。', options:['周波数をその許容偏差内に維持するため、送信装置は、できる限り電源電圧または負荷の変化によって、発振周波数に影響を与えないものでなければならない','移動局の送信装置は、実際上起り得る気圧の変化によっても、周波数をその許容偏差内に維持するものでなければならない','周波数をその許容偏差内に維持するため、発振回路の方式は、できる限り外囲の温度もしくは湿度の変化によって、影響を受けないものでなければならない','水晶発振回路に使用する水晶発振子は、発振周波数が当該送信装置の水晶発振回路により、またはこれと同一の条件の回路により、あらかじめ試験を行って決定されているものであることこと'], answer:1, explanation:'移動局の送信装置は、実際上起り得る振動又は衝撃によっても周波数をその許容偏差内に維持するものでなければならない(無線設備規則第15条)。気圧の変化は関係ないため②が誤り。' },
        { category:'電波法令(無線局)', question:'無線局の免許の欠格事由に関する次の記述の□に当てはまる語句の組み合わせとして、「電波法」上、正しいものはどれか。「電波法に規定する罪を犯し(ア)以上の刑に処せられ、その(イ)を終わり、またはその(イ)を受けることがなくなった日から(ウ)年を経過しない者には、無線局の免許を与えないことができる。」', options:['(ア)罰金 (イ)執行 (ウ)2','(ア)罰金 (イ)処分 (ウ)3','(ア)過料 (イ)執行 (ウ)3','(ア)過料 (イ)処分 (ウ)2'], answer:0, explanation:'電波法第5条(欠格事由)により、罰金以上の刑に処せられたときは、その執行を終わるか、あるいはその執行を受けることがなくなった日から2年を経過しないと新たな免許を受けることができない。①が正しい。' },
        { category:'電波法令(無線局)', question:'無線局の種別および定義に関する記述として、「電波法令」上、正しいものはどれか。', options:['無線標定陸上局とは、無線測位業務を行う無線局をいう','無線呼出局とは、携帯局と通信を行うため陸上に開設する移動しない無線局をいう','地球局とは、固定業務を行う無線局をいう','陸上移動局とは、陸上を移動中またはその特定しない地点に停止中運用する無線局(船上通信局を除く)をいう'], answer:3, explanation:'無線標定陸上局は「無線標定業務を行う移動しない無線局」(無線測位業務を行うのは無線測位局)。無線呼出局は「無線呼出業務を行う陸上に開設する無線局」(②の記述は携帯基地局)。地球局は宇宙局と通信を行う等のため地表または地球の大気圏の主要部分に開設する無線局(固定業務を行うのは固定局)。④の記載が正しい。' },
        { category:'放送(符号化方式)', question:'映像符号化方式に関する記述として、適当でないものはどれか。', options:['MPEG-2は、MPEG-4 AVC(H.264)より動画像情報の圧縮率が高い','MPEG-4 AVC(H.264)は、地上デジタルテレビ放送のワンセグ放送で使われている','HEVC(H.265)は、新4K8K衛星放送で使われている','MPEG-2は、MPEG-1相当の低解像度からフルハイビジョン相当の高解像度までの動画像を扱う'], answer:0, explanation:'MPEG-4 AVC(H.264)は、これより8年も前に制定されたMPEG-2と比較すると2倍近くの圧縮率を誇る。つまりMPEG-2の圧縮率のほうが低い。①が不適当(正しくは低い)。' },
        { category:'放送(符号化方式)', question:'HEVC(H.265)に関する記述として、適当なものはどれか。', options:['HEVC(H.265)は、MPEG-2よりも先に国際標準化された映像符号化方式の規格である','HEVC(H.265)で処理できるのは、最大でSDTV相当の解像度の動画像までである','HEVC(H.265)は、我が国の地上デジタルテレビ放送のワンセグ放送に使われている','HEVC(H.265)は、MPEG-4 AVC(H.264)よりも動画像情報の圧縮率が高い'], answer:3, explanation:'HEVCは2013年に定められた標準規格で、MPEG-2(1995年)のほうが遥かに古い(①不適当)。HEVCは8Kスーパーハイビジョン相当の解像度まで対応可能(②不適当)。ワンセグ放送で採用されている圧縮形式はMPEG-4 AVC(H.264)(③不適当)。HEVCはMPEG-4 AVCと比較すると約2倍の圧縮効率となる。④が適当。' },
        { category:'サーバ(RAID)', question:'複数のハードディスクを組み合わせて構成するRAIDに関する記述として、適当なものはどれか。', options:['RAID0は、2台のハードディスクに同じデータを記録する方式であり、1台のハードディスクが故障しても他の1台で継続して利用できるが、記録するデータよりも倍の記憶容量が必要となる','RAID1は、複数のハードディスクにデータを分散して記録する方式であり、アクセスを高速化できるが、1台でもハードディスクが故障すると、データの読み書きができなくなる','RAID4は、複数のハードディスクのうち1台をパリティ情報の記録に割り当て、残りの複数のハードディスクにデータをブロック単位で分散して記録する方式である','RAID5は、複数のハードディスクにデータを分散して記録し、さらに複数の専用のハードディスクにハミングコードを分散して記録する方式である'], answer:2, explanation:'2台のディスクに同じデータを書き込む方式はRAID1(ミラーリング)であり①は不適当。データを分散して記録し高速化する方式はRAID0(ストライピング)であり②も不適当。1台をパリティ記録専用に割り当て、残りにブロック単位で分散して記録するのはRAID4で③が適当。RAID5はハミングコードは用いておらず④は不適当。' },
        { category:'サーバ(RAID)', question:'ハードディスクの技術であるRAID5に関する記述として、適当なものはどれか。', options:['複数のハードディスクにデータを分散して記録する方式であり、アクセスを高速化できるが、1台でもハードディスクが故障するとデータの読み書きができなくなる','2台のハードディスクに同じデータを記録する方式であり、1台のハードディスクが故障しても他の1台で継続して利用できるが、記録するデータよりも倍の記憶容量が必要となる','複数のハードディスクにデータとパリティ情報をそれぞれ分散して記録する方式であり、1台のハードディスクが故障しても残りのハードディスクのデータとパリティ情報から元のデータを復元できる','複数のハードディスクのうち1台をパリティ情報の記録に割り当て、残りのハードディスクにデータを分散して記録する方式である'], answer:2, explanation:'①はRAID0(ストライピング)、②はRAID1(ミラーリング)の説明。複数のハードディスクにデータを分散して記録し、かつパリティ情報も分散して記録する方式がRAID5であり③が適当。④はパリティ専用ディスクを設けるRAID3または4の説明。' },
        { category:'サーバ(仮想化)', question:'サーバの仮想化技術に関する記述として、適当でないものはどれか', options:['サーバの数を増やして処理を分散することにより、処理能力を上げる方法をスケールアップという','仮想サーバで稼働しているOSやソフトウェアを停止することなく、他の物理サーバへ移し替える技術をライブマイグレーションという','物理サーバのハードウェア上で、仮想化ソフトウェアを直接稼働させる方式をハイパーバイザ型という','物理サーバのOS上で、仮想化ソフトウェアを動作させる方式をホストOS型という'], answer:0, explanation:'サーバの台数を増やして分散処理を行い、システム全体の処理能力や可用性を高めることは「スケールアウト」という。ハードウェアを高性能なものに置き換えて処理能力を高めるのが「スケールアップ」。①が不適当。' },
        { category:'サーバ(仮想化)', question:'仮想化技術に関する次の記述に該当する名称として、適当なものはどれか。「仮想マシンで稼働しているOSを停止させることなく、別の物理ホストに移動させる技術」', options:['クラスタリング','オペレーティングシステム','ライブマイグレーション','パーティショニング'], answer:2, explanation:'クラスタリングは複数のコンピュータを結合してあたかも1つのコンピュータのように扱う技術(①不適当)。オペレーティングシステムはシステム全体を管理する基本的なプログラム群(②不適当)。パーティショニングはデータベースにおいて1つのテーブルデータを分割して管理する仕組み(④不適当)。稼働中の仮想マシンを停止せずに別のホストへ移行させる機能はライブマイグレーションで③が適当。' },
        { category:'光ファイバ伝送(特徴・性質)', question:'PON(Passive Optical Network)システムに関する記述として、適当でないものはどれか。', options:['PONシステムでは、レンジング処理によってOLT(Optical Line Terminal)からONU(Optical Network Unit)への下り信号の衝突を防いでいる','GE-PON(Gigabit Ethernet-PON)は、下り信号と上り信号で異なる波長の光を使う波長分割多重により、1心の光ファイバで双方向通信を実現している','B-PON(Broadband-PON)は、ONUとOLT間の伝送をATMセル単位で行っている','GE-PONは、IEEE802.3ahで標準化された、高速光アクセス方式の1つである'], answer:0, explanation:'信号の衝突を懸念するのは各ONUからOLTへ向かう上り回線の場合。下り回線はOLTが全ONU宛の信号を整理して格納した形で送出するので衝突は起こらない。レンジング処理とは上り信号を送信させる準備として伝送の仕様や遅延時間等を調べる手順のこと。①が不適当。' },
        { category:'光ファイバ伝送(特徴・性質)', question:'光変調方式に関する記述として、適当でないものはどれか。', options:['直接光変調方式は、送信信号で半導体レーザからの光の位相を変化させる変調方式である','直接光変調方式は、構成が簡単で、小型化も容易、コスト低廉である等の特徴を有する変調方式である','外部光変調方式は、半導体レーザからの無変調の光を光変調器により送信信号で変調を行う方式である','外部光変調方式には、電気光学効果による屈折率変化を利用する方式と、半導体の電界吸収効果による光透過率の変化を利用する方式がある'], answer:0, explanation:'直接変調方式は、送信信号のビットによって半導体レーザに電圧を印加し、変調はオンかオフのどちらかで表現する単純な形となり、振幅を変化させる強度変調に分類される。この方式では位相を変化させることはできない。①が不適当(強度変調のみ)。' },
        { category:'光ファイバ伝送(特徴・性質)', question:'光ファイバの種類・特徴に関する記述として、適当でないものはどれか。', options:['光ファイバには、シングルモード光ファイバとマルチモード光ファイバがあり、伝送損失はシングルモード光ファイバのほうが小さい','長距離大容量伝送には、マルチモード光ファイバが適している','マルチモード光ファイバには、ステップインデックス型とグレーデッドインデックス型の2種類がある','シングルモード光ファイバは、マルチモード光ファイバと比べてコア径を小さくすることで、光伝搬経路を単一としたものである'], answer:1, explanation:'シングルモード光ファイバは反射をせずに一直線に進むため反射損がなく伝送損失が小さい。長距離の伝送にはシングルモード光ファイバのほうが向いており、標準的な伝送距離はマルチモードが2km程度なのに対しシングルモードは約40kmと圧倒的。②が不適当。' },
        { category:'光ファイバ伝送(特徴・性質)', question:'光ファイバ通信の波長分割多重方式に関する記述として、適当なものはどれか。', options:['DWDM伝送では、光ファイバの非線形効果に起因する四光波混合による波長チャーピングが発生する','WDMは、大容量伝送が可能で、光増幅器を使用することにより、複数の波長を各波長に分波して増幅する','DWDMは、波長間隔を20nmとすることが規定され、使用する帯域の規定はない','DWDMは、CWDMに比べて、多くの光信号を多重化することができる'], answer:3, explanation:'CWDMは収容数数本〜10本・波長間隔約20nm、DWDMは収容数約100本・波長間隔約1nm。DWDMはCWDMと比較して約10倍も多くの光信号を多重化することが可能で④が適当。光増幅器は分波せずに一括して増幅可能(②不適当)。DWDMの波長間隔は約1nm程度(③不適当)。波長チャーピングは光変調時にキャリアの密度が時間的に変化して波長が変動する現象(①不適当)。' },
        { category:'光ファイバ伝送(分散)', question:'光ファイバの分散に関する記述として、適当でないものはどれか。', options:['モード分散は、シングルモード光ファイバでは発生しないが、マルチモード光ファイバで発生する','波長分散は、伝搬モードによって光の伝送経路が異なるために、到達時間が違うことで生じる分散である','構造分散は、光の一部がクラッド部分へ染み出して反射するが、この染み出しの割合が光の波長により異なり、結果的に伝搬経路の長さが光の波長により違ったものとなるために生じる分散である','材料分散は、光ファイバの媒質の屈折率が光の波長によって異なるために、光の伝搬速度が波長により異なることで生じる分散である'], answer:1, explanation:'伝搬モードによって伝搬経路が異なり到達時間にズレが生じるのはモード分散の説明。波長分散は材料分散と構造分散とを合算したもので、光源の波長のわずかな幅により波長ごとに伝搬時間が異なるため到達にズレが生じるもの。②が不適当。' },
        { category:'光ファイバ伝送(分散)', question:'光ファイバの分散に関する記述として、適当でないものはどれか。', options:['パルス信号の伝送中に分散が発生すると、パルス幅が広がり、隣りのパルスと重なるため符号誤りが発生する要因となる','偏波モード分散は、光ファイバに外部から不均一な応力が加わった場合などにおいて、直交する2方向に偏波した2つのモード間に遅延差が生じる分散である','シングルモード光ファイバでは、主に波長分散によって伝送帯域が制限される','マルチモード光ファイバでは、主に構造分散によって伝送帯域が制限される'], answer:3, explanation:'マルチモードにおいても構造分散は発生するが、影響はそれほど大きくない。むしろモード分散が支配的といえる。④が不適当(主にモード分散による)。' },
        { category:'光ファイバ伝送(損失)', question:'光ファイバの光損失の要因であるマイクロベンディングロスに関する記述として、適当なものはどれか。', options:['光ファイバを接続する場合にコアどうしが完全に均一に接続されない場合、一方のコアから出た光の一部が他方のコアに入射できず、放射されて生じる損失である','光ファイバのコアとクラッドの境界面の凹凸により光が乱反射され、光ファイバ外に放射されることにより生じる損失である','光ファイバに側面から不均一な圧力が加わると、光ファイバの軸がわずかに曲がることで生じる損失である','光ファイバ中を伝わる光が外へ漏れることなしに光ファイバ材料自身によって吸収され、熱に変換されることにより生じる損失である'], answer:2, explanation:'①は接続損失のうちの軸ずれ、②は構造の不均一性による散乱損失、④は吸収損失の説明。マイクロベンディングロスは曲がり損失の一種で、ファイバに対して側面から不均一な圧力が加わった場合に、ファイバの軸がわずかに曲がって発生する損失のこと。③が適当。' },
        { category:'光ファイバ伝送(損失)', question:'光ファイバの損失要因であるレイリー散乱損失に関する次の記述の空欄に当てはまる語句の組み合わせとして、適当なものはどれか。「レイリー散乱損失は、光ファイバの屈折率のゆらぎにより生じる損失であり、その大きさは波長の(ア)乗に(イ)する。」', options:['(ア)2 (イ)比例','(ア)2 (イ)反比例','(ア)4 (イ)比例','(ア)4 (イ)反比例'], answer:3, explanation:'レイリー散乱による損失の大きさは、光波長の4乗に反比例する。つまり伝搬する光の波長が短くなるにしたがって光損失は急激に増大する。実際の光ファイバ通信ではレイリー散乱損失の影響が少ない1μm〜1.675μmの帯域の波長を用いている。④が適当。' },
        { category:'線材(同軸ケーブル)', question:'同軸ケーブルに関する記述として、適当でないものはどれか。', options:['同軸ケーブルの構造は、内部導体を中心にその周りを絶縁体と外部導体が同軸状に囲み、これらの保護のため、ポリ塩化ビニル等で被覆されている','同軸ケーブルの特性インピーダンスは、内部導体の直径、外部導体の内径および、絶縁体の比誘電率で決まる','整合状態で用いられている同軸ケーブルからの電波の漏れは、非常に少ない','導波管と比較すると損失が少なく、その値は周波数が高いほど小さくなる'], answer:3, explanation:'同軸ケーブルの短所として、流れる信号の周波数が高くなると損失が大きくなる傾向がある。また一般的に導波管のほうが損失は少ない。④が不適当。' },
        { category:'線材(同軸ケーブル)', question:'同軸ケーブルに関する記述として、適当でないものはどれか。', options:['同軸ケーブルは、通常、TE波のみが伝搬する周波数範囲で使われる','内部導体を同心円の外部導体で取り囲み、内部導体と外部導体の間に絶縁体を挟み込んだ構造である','特性インピーダンスは、外部導体の内径、内部導体の外径および、外部導体と内部導体の間の絶縁体の比誘電率で決まる','同軸ケーブルは、外部導体の外側に漏れる磁力線や電気力線が非常に少ない'], answer:0, explanation:'同軸ケーブルを断面で見ると、進行方向には電界成分も磁界成分も現れない。つまりTEMモードにて伝搬される。TEモードではないので①が不適当(TEM波のみを通す)。' },
        { category:'無線伝送(受信電力)', question:'マイクロ波通信を行う無線局であるA局とB局の間において、A局から送信機出力1〔W〕で送信したときのB局の受信機入力電力〔dBm〕の値として、適当なものはどれか。ただし、A局の送信空中線およびB局の受信空中線の絶対利得はそれぞれ35〔dBi〕、A局における送信空中線から送信機までの給電線の損失およびB局における受信空中線から受信機までの給電線の損失はそれぞれないものとし、A局とB局の間の自由空間基本伝搬損失は120〔dB〕とする。', options:['-160〔dBm〕','-90〔dBm〕','-20〔dBm〕','80〔dBm〕'], answer:2, explanation:'送信機出力1〔W〕=1000〔mW〕=10³〔mW〕をdBmに換算すると10log10³=30〔dBm〕。受信機の入力電力は+30+35-120+35=-20〔dBm〕。③が適当。' },
        { category:'無線伝送(ダイバーシティ)', question:'移動通信システムで用いられるダイバーシティ技術に関する記述として、適当でないものはどれか。', options:['CDMAは、1つの周波数を複数の基地局が共有しているため、周辺の基地局で受信される信号を利用する時間ダイバーシティ受信により回線の信頼性を高めている','2つ以上の周波数帯域を使用するキャリアアグリゲーションは、通信速度の向上だけでなく、通信が安定する周波数ダイバーシティ効果も得られる','複数の伝搬経路を経由して受信された信号を最大比合成するRAKE受信は、パスダイバーシティ効果が得られる','偏波ダイバーシティは、直交する偏波特性のアンテナを用いて、受信した信号を合成することにより電波の偏波面の変動による受信レベルの変動を改善する'], answer:0, explanation:'複数の受信局で受信された信号を合成したり補完したりする手法はルートダイバーシティに近い概念であり、時間ダイバーシティではない。時間ダイバーシティは同一の信号を時間をずらして2回以上送信することで信頼性を向上させる仕組み。①が不適当。' },
        { category:'OSI参照モデル', question:'下表に示すOSI参照モデルの空欄(ア)、(イ)、(ウ)に当てはまる名称の組み合わせとして、適当なものはどれか。〔階層7:アプリケーション層、6:(ア)、5:セッション層、4:トランスポート層、3:(イ)、2:データリンク層、1:(ウ)〕', options:['(ア)ネットワーク層 (イ)プレゼンテーション層 (ウ)物理層','(ア)ネットワーク層 (イ)物理層 (ウ)プレゼンテーション層','(ア)プレゼンテーション層 (イ)ネットワーク層 (ウ)物理層','(ア)プレゼンテーション層 (イ)物理層 (ウ)ネットワーク層'], answer:2, explanation:'OSI参照モデルは第7層から順にアプリケーション層、プレゼンテーション層、セッション層、トランスポート層、ネットワーク層、データリンク層、物理層。第6層がプレゼンテーション層、第3層がネットワーク層、第1層が物理層となり③が適当。7階層の名称は暗記必須。' },
        { category:'OSI参照モデル', question:'OSI参照モデルのプロトコル階層に関する記述として、適当なものはどれか。', options:['OSI参照モデルは、データリンク層で信頼度の高いデータ転送を実現する機能をもち、データの順序制御、網内のデータ紛失に対する誤り検出・回復等を行っている','OSI参照モデルのセッション層は、トランスポート層以下の機能によって確立された通信をさらに、応用プロセス間で合意された一定のルールに従い、通信の多重化を行う','OSI参照モデルは、通信に必要な機能を7階層に分類し整理したモデルであり、コンピュータネットワークにおけるプロトコルの設計や機能を理解するためのガイドラインである','OSI参照モデルのトランスポート層、プレゼンテーション層、アプリケーション層が、TCP/IPでは、アプリケーション層としてまとめられている'], answer:2, explanation:'①の記述はトランスポート層の説明でデータリンク層ではない。TCP/IPのアプリケーション層に相当するのはOSI参照モデルのセッション層以上の全て(アプリケーション層、プレゼンテーション層、セッション層の3層)でトランスポート層は含まれない(④不適当)。通信に必要な機能を7階層に分類し整理したモデルという③がOSI参照モデルの説明として最も適した文面。' },
        { category:'無線アンテナ(基準アンテナ)', question:'無線通信で使用する、アンテナの利得に関する次の記述の空欄の(ア)、(イ)に当てはまる語句の組み合わせとして、適当なものはどれか。「アンテナの利得は、同じ入力電力を与えたときの、アンテナの最大輻射電力と基準アンテナの最大輻射電力の比で与えられ、基準アンテナを全方向に均等に電波を放射する(ア)アンテナとしたときの利得を(イ)利得という。」', options:['(ア)半波長ダイポール (イ)相対','(ア)半波長ダイポール (イ)絶対','(ア)等方性 (イ)相対','(ア)等方性 (イ)絶対'], answer:3, explanation:'等方性アンテナと比較した場合を絶対利得と定義している。それに対し、半波長ダイポールアンテナと比較した場合は相対利得と呼ばれる。等方性アンテナとは前後左右上下斜めの全方向に均等に電波を放射する豆粒のような空中線モデルのこと。④が適当。' },
        { category:'無線アンテナ(基準アンテナ)', question:'半波長ダイポールアンテナに関する記述として、適当なものはどれか。', options:['放射抵抗は、600Ωである','導波器、放射器、反射器で構成されるアンテナである','アンテナ素子を水平に設置した場合の水平面内指向性は、8の字の特性となる','絶対利得は、40dBiである'], answer:2, explanation:'半波長ダイポールアンテナの放射抵抗は約73Ωで600Ωではない(①不適当)。導波器、放射器、反射器の3本の要素で構成されるものは八木アンテナ(②不適当)。指向性はエレメント(素子)の直角方向に広がり、水平に置いた場合の水平面内指向性は8の字の特性で③が適当。絶対利得は2.15dB(④不適当)。' },
        { category:'無線アンテナ', question:'八木アンテナに関する記述として、適当でないものはどれか。', options:['導波器の本数を増やすことで、指向性を鋭くすることができる','放射器から見て、導波器の方向に電波を発射する','導波器の長さは放射器よりやや長い','放射器に給電し、反射器と導波器は無給電素子として動作する'], answer:2, explanation:'八木アンテナの基本形は3本の棒状のエレメントで構成され、中央の放射器は半波長ダイポールアンテナ。給電は放射器の中央部に行い、導波器と反射器には給電しない。電波は放射器から見て導波器のある方向へ進行する。3本のエレメントは長さが異なり、導波器は放射器より少し短く、逆に反射器は少し長い。したがって③が不適当。' },
        { category:'無線アンテナ', question:'無線通信で使用するアンテナに関する記述として、適当なものはどれか。', options:['オフセットパラボラアンテナは、回転放物面の主反射鏡、回転双曲面の副反射鏡、1次放射器で構成されたアンテナである','八木アンテナは、導波器、放射器、反射器からなり、導波器に給電する','ブラウンアンテナは、同軸ケーブルの内部導体を1/4波長だけ上に延ばして放射素子とし、同軸ケーブルの外部導体に長さ1/4波長の地線を放射状に複数本付けたものである','スリーブアンテナは、同軸ケーブルの内部導体を1/8波長だけ上に延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さが1/8波長の円筒導体をかぶせたものである'], answer:2, explanation:'オフセットパラボラアンテナの構成は回転放物面の主反射鏡と1次放射器で、回転双曲面の副反射鏡は用いない(①不適当)。八木アンテナの給電は放射器(輻射器)に行う(②不適当)。ブラウンアンテナは放射素子・地線ともに1/4波長で③が適当。スリーブアンテナの放射素子・円筒導体の長さはどちらも1/4波長(④不適当)。' },
        { category:'無線アンテナ', question:'無線通信で使用するアンテナに関する記述として、不適当なものはどれか。', options:['ホイップアンテナは、自動車、電車、航空機、船舶等の金属体を利用して設置される1/4波長垂直接地アンテナである','スリーブアンテナは、同軸ケーブルの内部導体を1/4波長延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さが1/4波長の円筒導体を設けたものである','ブラウンアンテナは、水平面内の指向性が無指向性である','コーナレフレクタアンテナは、反射器を利用して指向性を広くしている'], answer:3, explanation:'コーナレフレクタアンテナは、半波長ダイポールアンテナの後部に折り曲げた金属板を鏡として配置した空中線で、反射板により電界成分が合成されて単一の方向へ放たれる。つまり反射器を利用して指向性を狭くしており、④が不適当。その他のホイップアンテナ、スリーブアンテナ、ブラウンアンテナの説明は適当。' },
        { category:'無線アンテナ', question:'無線通信で使用する、アンテナに関する記述として、適当でないものはどれか。', options:['八木アンテナは、1/2波長ダイポールアンテナを放射器として中央に置き、その後方約1/4波長のところに反射器、前方約1/4波長のところに導波器を配置したアンテナである','フェーズドアレイアンテナは、複数のアンテナ素子を並べ、各アンテナ素子への励振電力を調整することで、ビーム方向を変えることができるアンテナである','オフセットパラボラアンテナは、伝送路となるパラボラ反射鏡の前面を避けた位置に一次放射器を置くことで、サイドローブ特性を改善している','ブラウンアンテナは、同軸ケーブルの内部導体を1/4波長だけ上に伸ばして放射素子とし、同軸ケーブルの外部導体に長さ1/4波長の地線を放射状に複数本付けたものである'], answer:1, explanation:'フェーズドアレイアンテナは、平面上に複数の放射素子を並べて固定し、各素子の上流方にデジタル移相器を設けて、給電電流の励振位相を変化させて電波を放射する。放射された電波が合成されることで主ビームを任意の方向に向けるよう制御される。励振電力ではなく励振位相を調整するため②が不適当。その他の選択肢の記述はいずれも適当。' },
        { category:'無線アンテナ', question:'パラボラアンテナに関する記述として、適当でないものはどれか。', options:['アンテナの性能を測定するための、基準アンテナとして用いられる','特定方向に電波をビーム状に放射したり、特定方向からの電波を高感度で受信できる','衛星通信やマイクロ波通信等では、利得の高いアンテナとして広く用いられている','放物面をもつ反射器と一次放射器から構成されるアンテナである'], answer:0, explanation:'パラボラアンテナは指向性が強く、電波を細く高密度(ペンシルビーム)で放射でき、送受信局が1対1の関係になるマイクロ波通信等で採用例が多い。他の空中線の性能を測定するための基準アンテナとして活用するのは電磁ホーンアンテナであり、パラボラを用いることは一般にはない。したがって①が不適当。' },
        { category:'無線アンテナ', question:'パラボラアンテナに関する記述として、適当なものはどれか。', options:['放物面をもつ反射器と、一次放射器から構成されるアンテナである','放射器の後方にV型の反射器を配置したアンテナである','反射器、放射器、導波器で構成されるアンテナである','複数のアンテナ素子をある間隔で並べ、各アンテナ素子に給電するアンテナである'], answer:0, explanation:'パラボラアンテナは反射鏡を用いた空中線で、反射鏡には2次曲線(放物線)を回転させた回転放物面を採用し、焦点に一次放射器(電磁ホーンアンテナ)を配する。①が適当。放射器の後方にV型の反射器を配置したのはコーナレフレクタアンテナ(②不適当)。反射器・放射器・導波器の3要素で構成されるのは八木アンテナ(③不適当)。複数素子に給電する方式の一例は対数周期アンテナ(④不適当)。' },
        { category:'無線アンテナ', question:'無線通信で使用するアンテナに関する記述として、適当なものはどれか。', options:['オフセットパラボラアンテナは、伝送路となるパラボラ反射鏡の前面に一次放射器を置かないことで、サイドローブ特性を改善している','折り返し半波長ダイポールアンテナの放射抵抗は、半波長ダイポールアンテナの約2倍になる','スリーブアンテナは、同軸ケーブルの内導体を1/8波長延ばして放射素子とし、さらに同軸ケーブルの外側導体に長さが1/8波長の円筒導体を設けることで、1波長のアンテナとして動作させるものである','八木アンテナは、導波器、放射器、反射器からなり、導波器に給電する'], answer:0, explanation:'折り返し半波長ダイポールアンテナの放射抵抗は約292Ωで、半波長ダイポールアンテナの約73Ωの4倍(②不適当)。スリーブアンテナの長さはどちらも1/4波長で、全体として半波長アンテナと等価(③不適当)。八木アンテナの給電は放射器に行う(④不適当)。オフセットパラボラアンテナは主反射鏡の一部を切り取った形にして伝播路から障害物を外しており、①が適当。' },
        { category:'無線アンテナ', question:'無線通信で使用する、アンテナの指向性に関する記述として、適当でないものはどれか。', options:['半波長ダイポールアンテナは、アンテナ導体の垂直方向が強くなる、8の字形の指向性を持つ','カセグレンアンテナの垂直面内の指向性は、無指向性である','ブラウンアンテナの水平面内の指向性は、無指向性である','八木アンテナは、放射器から見て、導波器の方向に最も強い指向性を持つ'], answer:1, explanation:'カセグレンアンテナは、一次放射器と反射鏡との間に副反射鏡を挟んだパラボラアンテナの派生形で、大地雑音の直接混入を減らすことができる。パラボラアンテナの派生形であり鋭い指向性を持つため、②が不適当。' },
        { category:'気象レーダ', question:'レーダにより降雨観測を行うレーダ雨量計に関する記述として、適当でないものはどれか。', options:['レーダ雨量計で観測する雨等の方位は、パラボラアンテナの方位角から求める','二重偏波レーダは、送信波と受信波の周波数のずれを観測することで雨等の移動速度を観測するレーダである','Cバンドレーダ雨量計は、Xバンドレーダ雨量計よりも観測範囲が広い','Cバンドレーダ雨量計は、Xバンドレーダ雨量計よりも直径の大きなパラボラアンテナが使われている'], answer:1, explanation:'二重偏波方式は、偏波を水平面と垂直面の2面に用意し、両波を同時に送信して大気中の雨粒で反射した電波を受信する。この際に両波の受信波の位相のずれを測定することで雨量強度を算出する。周波数のずれではないため②が不適当。Cバンド(5.3GHz帯・半径300km)はXバンド(9.3〜9.4GHz帯・半径50km)より観測範囲が広く、パラボラアンテナの直径も大きい(約4.3m対約2m)。' },
        { category:'気象レーダ', question:'レーダ雨量計で利用されているMPレーダ(マルチパラメータレーダ)に関する記述として、適当でないものはどれか。', options:['MPレーダは、落下中の雨滴がつぶれた形をしている性質を利用し、偏波間位相差から高精度に降雨強度を推定している','MPレーダは、水平偏波と垂直偏波の電波を交互に送受信して観測する気象レーダである','偏波間位相差は、Xバンドのほうが弱から中程度の雨でも敏感に反応するため、XバンドMPレーダは電波が完全に消散して観測不可能とならない限り高精度な降雨強度推定ができる','XバンドのMPレーダでは、降雨減衰の影響により観測不能となる領域が発生する場合があるが、レーダのネットワークを構築し、観測不能となる領域を別のレーダでカバーすることにより解決している'], answer:1, explanation:'水平偏波と垂直偏波の電波は同時に送受信している。交互ではない。交互の送受信では、瞬間値に誤差が発生してしまうため②が不適当。雨滴は落下時に空気抵抗を受けて水平方向に扁平し、衝突するときの両偏波間の位相差を測定して降雨強度を算出する(①適当)。' },
        { category:'無線LAN', question:'無線LAN(IEEE802.11標準)において、OFDMと呼ばれる規格の変調方式として正しいものはどれか。', options:['周波数ホッピング','直接拡散','シングルキャリア','マルチキャリア'], answer:3, explanation:'OFDMは直交周波数分割多重変調の意で、免許されている周波数(キャリア)をさらに細かいサブキャリアに分け、その1本1本を各ユーザに割り当てる。複数のキャリアを用いて通信することから「マルチキャリア」と呼ばれ、④が正しい。周波数ホッピング(FHSS)と直接拡散(DSSS)はスペクトル拡散変調を行うCDMの方式。' },
        { category:'無線LAN', question:'無線LANのアクセス制御に用いられるCSMA/CA方式に関する記述として、適当なものはどれか。', options:['送信ノードは、データの衝突を検知した場合は、データの送信を中止し、ランダムな時間だけ待機した後に、データの送信を再開する','情報をセルと呼ばれる固定長の伝送単位に分割して、ヘッダの宛先情報に基づいて伝送する','送信ノードは衝突検知ができないため、受信ノードからの肯定応答信号により、送信データが受信ノードに正しく届いたことを確認する','伝送路上を巡回しているトークンと呼ばれるデータを取得したノードだけが送信権を得ることで、データの衝突を回避する'], answer:2, explanation:'無線LANの場合は、各送信ノードは自分が送信したデータが衝突したかどうかの検知ができないため、衝突を前提とした設計になっている。送信ノードは衝突の有無にかかわらず、ランダムな時間だけ待機した後に送信を行う(①不適当)。②はATM(非同期転送モード)の説明。CSMA/CAではランダム時間の待機後にデータを送信し、相手方から肯定応答信号(ACK)を受信することで正常通信を把握する。③が適当。④はトークンパッシング方式の説明。' },
        { category:'無線LAN', question:'無線LANの認証で使われる規格IEEE802.1Xに関する記述として、適当でないものはどれか。', options:['EAP-PEAPは、TLSハンドシェイクの仕組みを利用する認証方式である','EAP-TTLSのクライアント認証は、ユーザ名とパスワードにより行う','EAP-MD5は、サーバ認証とクライアント認証の相互認証である','EAP-TLSのクライアント認証は、クライアントのデジタル証明書を検証することで行う'], answer:2, explanation:'数あるEAP方式の中でも、EAP-MD5だけはサーバ側の認証を行わない。したがって送信した情報が第三者に盗み取られるリスクがある。MD5以外の方式はいずれも相互認証の機能を持っている。③が不適当。' },
        { category:'無線LAN', question:'無線LANの認証に関する記述として、適当でないものはどれか。', options:['IEEE802.1Xで用いられるEAP-TTLSのクライアント認証は、SSIDによる認証である','WPA-EAPやWPA2-EAPは、認証サーバによる認証方法である','WPA-PSKやWPA2-PSKは、IEEE802.1Xを利用しない認証方法である','IEEE802.1Xで用いられるEAP-MD5のクライアント認証は、パスワード認証である'], answer:0, explanation:'EAP-TTLS方式では、クライアント認証はユーザIDとパスワードの組み合わせを照合することによって行う。SSIDを用いた形ではないため①が不適当。パーソナルモード(WPA-PSK、WPA2-PSK)はAPとクライアント端末間でPSKという秘密鍵を生成して認証の手順を進め、IEEE802.1Xを利用しない(③適当)。' },
        { category:'衛星通信', question:'静止衛星通信に関する記述として、適当なものはどれか。', options:['静止衛星は、赤道上空およそ36,000〔km〕の円軌道を約12時間かけて周回する','静止軌道上に2機の衛星を配置すれば、北極、南極付近を除く地球上の大部分を対象とする、世界的な通信網を構築できる','衛星通信には、電波の窓と呼ばれる周波数である1〜10〔GHz〕の電波しか使用できない','アップリンク周波数よりダウンリンク周波数のほうが低い'], answer:3, explanation:'静止衛星は地球の自転と同じサイクルで公転しており、公転周期は約24時間(①不適当)。北極と南極地域を除き世界のほぼ全域を網羅するためには、通信用の衛星は最低でも3個は必要(②不適当)。1GHz〜10GHzは「電波の窓」と呼ばれるが、静止衛星との通信はもっと高い10GHz以上の周波数を用いるケースが多い(③不適当)。したがって④が適当。' },
        { category:'衛星通信', question:'衛星通信に関する記述として、適当でないものはどれか。', options:['静止衛星の軌道は、赤道面にあることから、高緯度地域においては仰角(衛星を見上げる角度)が低くなり、建造物等により衛星と地球局との間の見通しを確保することが難しくなる','複数の地球局が同一周波数で同一帯域幅の信号を使用するFDMAによる多元接続方式は、回線ごとに異なる時間を割り当てて送受信する方式である','トランスポンダは、衛星が受信した微弱な信号の増幅、受信周波数から送信周波数への周波数変換および信号波の電力増幅を行う','衛星通信では、電波干渉を避けるため、地球局から衛星への無線回線と、衛星から地球局への無線回線に異なる周波数帯の電波を使用している'], answer:1, explanation:'1本の搬送波周波数を複数のユーザが共有し、各ユーザが自分の持ち時間にのみ通信を行う方式はTDMA(時分割多元接続)である。②の記述はTDMA方式の説明であり不適当。FDMAは免許された周波数帯をさらに細かく分割して各ユーザに割り当てる周波数分割多元接続方式。' },
        { category:'ディスプレイ', question:'液晶ディスプレイに関する記述として、適当でないものはどれか。', options:['液晶ディスプレイは、液晶を透明電極で挟み、電圧を加えると液晶の分子配列が変わり、光が通過したり遮断されたりする原理を利用している','カラー表示は、透明電極の外側に取り付けたカラーフィルタにより、画素ごとにRGBの三原色を作ることで行う','IPS方式は、電圧をかけない状態では液晶分子はねじれているが、電圧をかけると液晶分子のねじれがなくなることを利用するものであるが視野角が狭い','液晶自体は発光しないため、LEDや蛍光管によるバックライトから放出された光が液晶を通過することで、文字や画像を表示させる'], answer:2, explanation:'電圧をかけない状態で液晶が捻じれた形で並び、電圧印加でねじれがなくなるのは一般的なTN方式の説明。IPS方式は構造が異なり、TN方式の弱点だった視野角の狭さを大幅に改善している。したがって③が不適当。' },
        { category:'ディスプレイ', question:'ディスプレイに関する記述として、適当でないものはどれか。', options:['液晶ディスプレイは、液晶を透明電極で挟み、電圧を加えると分子配列が変わり、光が通過したり遮断されたりする原理を利用している','有機ELディスプレイは、キセノンガス等のガスが封入された微小空間で放電によりガスがプラズマ状態となり、紫外線が発生し、その紫外線を蛍光体に当てて可視光を発生させる','液晶ディスプレイは、液晶自体は発光しないため、LEDや蛍光管によるバックライトから放出された光が液晶を通過することで、文字や画像を表示させる','有機ELディスプレイは、液晶ディスプレイよりも薄型化が可能である'], answer:1, explanation:'有機ELディスプレイの「EL」とは電子発光という意味で、素子自体が発光するため液晶ディスプレイのようなバックライトを必要とせず、薄型化を実現できる。②の記述はプラズマディスプレイの説明であり不適当。' },
        { category:'信頼性設計', question:'信頼性設計の考え方であるフェールセーフに関する記述として、適当なものはどれか。', options:['構成部品の品質を高めたり、十分なテストを行ったりして、故障や障害の原因となる要素を取り除くことで信頼性を向上させることである','故障や操作ミス、設計上の不具合等の障害が発生することをあらかじめ予測しておき、障害が生じてもできるだけ安全な状態に移行する仕組みにすることである','システムの一部に障害が発生しても、予備系統への切り替え等によりシステムの正常な稼働を維持することである','利用者が操作や取り扱い方を誤っても危険が生じない、あるいは、誤った操作や危険な使い方ができないような構造や仕掛けを、設計段階で組み込むことである'], answer:1, explanation:'①はフォールトアボイダンスで、そもそも「故障させない」前提で設計されるもの。フェールセーフのキーワードは「安全な状態」で、故障等が発生することを前提に安全に停止させることを目標とした考え方であり、②が適当。③はフェールオーバで、故障時はあらかじめ待機している予備系の設備に切り替えて運用を継続する。④はフールプルーフの説明。' },
        { category:'信頼性設計', question:'信頼性設計の考え方であるフェールソフトに関する記述として、適当なものはどれか。', options:['システムの一部に障害が発生した場合、障害が発生した部分を切り離して、機能や性能を低下させても、システムの稼働を継続できるようにすることである','利用者が操作や取り扱い方を誤っても危険が生じない、あるいは、誤った操作や危険な使い方ができないような構造や仕掛けを、設計段階で組み込むことである','故障や操作ミス、設計上の不具合等の障害が発生することをあらかじめ予測しておき、障害が生じてもできるだけ安全な状態に移行する仕組みにすることである','障害や故障が発生しても、外部に影響が出ないような仕組みにする設計思想のこと。故障の発生を他の装置から隠ぺいして、誤った処理結果の流出を防止する'], answer:0, explanation:'1つ目の記述はフェールソフトの説明で、キーワードは「切り離す」。別名を縮退運転ともいい、一例として航空機のエンジンは1台が故障しても残った1台で飛行を継続できる仕組みになっている。①が適当。②はフールプルーフ、④はフォールトマスキングの説明。' },
        { category:'高圧設備', question:'キュービクル式高圧受電設備の主遮断装置に関する、次の記述の空欄に当てはまる語句の組み合わせとして、適当なものはどれか。「PF・S形は、(ア)と(イ)とを組み合わせたもの、または一体としたものである。」', options:['(ア)遮断器 (イ)限流ヒューズ','(ア)遮断器 (イ)過電流継電器','(ア)高圧交流負荷開閉器 (イ)限流ヒューズ','(ア)高圧交流負荷開閉器 (イ)過電流継電器'], answer:2, explanation:'キュービクル式の高圧受電設備は、受電用の主遮断装置の方式によってCB形とPF・S形の2種類に分類できる。CB形は主遮断装置に真空遮断器(VCB)+過電流継電器を用いた大容量向け。PF・S形は「パワーヒューズ・スイッチ」の略で、高圧交流負荷開閉器と限流ヒューズを組み合わせたもので、300kVA以下の中容量の受電に適している。③の組み合わせが適当。' },
        { category:'高圧設備', question:'高圧受変電設備に関する記述として、適当でないものはどれか。', options:['遮断器は、回路の開閉の他、保護継電器と組み合わせて用いられ、事故時には継電器からの信号により、過電流や短絡・地絡電流を自動的に遮断する装置である','保護継電器は、回路に異常が発生した場合に、これを検出して遮断器を動作させ、各機器の保護をするものである','キュービクル式高圧受電設備は、受電用の主遮断装置の方式によって、CB形とPF・S形がある','受電設備の引込口等に設置される避雷器は、雷および開閉等による異常電圧が回路に侵入したとき大地に放電させるものであり、接地はB種接地工事でなければならない'], answer:3, explanation:'高圧避雷器は、A種接地工事とする必要がある。この際の抵抗値は10Ω以下。なおB種接地は、高圧と低圧を変成する変圧器の低圧側に配するものである。したがって④の記載が不適当。' },
        { category:'二次電池', question:'二次電池の充電方式に関する次の記述に該当する用語として、適当なものはどれか。「自然放電で失った容量を補うために、継続的に微小電流を流すことで、満充電状態を維持する。」', options:['定電圧定電流充電','トリクル充電','浮動充電','パルス充電'], answer:1, explanation:'掲題の方式はトリクル充電。浮動(フロート)充電とも似ているが接続の仕方が異なり、浮動充電は蓄電池と負荷とが並列につながっているのに対し、トリクル充電は別回路で構成されている。浮動充電は常に定電圧を印加して満充電を維持し、流れる電流はほぼ0A。トリクル充電は通常時は微小電流を流して満充電を維持し、停電時には回路を切り替えて蓄電池から負荷へ供給する。②が適当。' },
        { category:'二次電池', question:'リチウムイオン電池に関する記述として、適当でないものはどれか。', options:['セルあたりの起電力が3.7Vと高く、高エネルギー密度の蓄電池である','自己放電や、メモリ効果が少ない','電解液に水酸化カリウム水溶液、正極にコバルト酸リチウム、負極に炭素を用いている','リチウムポリマー電池は、液漏れしにくく、小型・軽量で長時間の使用が可能である'], answer:2, explanation:'リチウムイオン電池の構造は、正極にはリチウムやコバルトの酸化物、負極には結晶構造中にリチウムを含んだ炭素を用いている。電解質には液状の、リチウム塩を溶かした有機溶媒が使われており、水酸化カリウム水溶液ではない。よって③が不適当。起電力は3.7Vで①は適当。' }
,
        { category:'線路施工（導波管）', question:'マイクロ波多重無線設備で使用される導波管に関する記述として、適当でないものはどれか。', options:['気密窓導波管は、導波管内の防湿のための乾燥空気充填用や気密試験用として、通信機械室内の引込口付近に配置される','テーパー導波管は、両端で寸法が異なる形状の導波管で、違うサイズの導波管を接続する際の中継部材として用いられる','テーパー導波管は防湿の機能をもつため、乾燥空気充填用として引込口付近に用いられる','導波管のフランジ結合用のねじには、錆を防ぐためにステンレス製を用いるケースが多い'], answer:2, explanation:'テーパー導波管は両端で寸法が異なる特殊な導波管で、違うサイズの導波管を接続する際の中継部材として用いられるものであり、防湿の機能は関係ない。防湿のための乾燥空気充填用・気密試験用の役割を持つのは、通信機械室と室外との境界部分（引込口付近）に配置される気密窓導波管である。フランジ結合用ねじはスチール（鋼鉄）製だと錆びるおそれがあるため、ステンレス製を用いるケースが多い。' },
        { category:'線路施工（導波管）', question:'導波管の施工における気密形・非気密形の使い分けに関する記述として、適当なものはどれか。', options:['室外に施設する導波管には、非気密形を使用する','室内に設ける導波管には、必ず気密形を使用しなければならない','室外に施設する導波管には気密形を使用し、室内に設けるものについては非気密形でも特に問題はない','フランジ接続の結合用ねじには、スチール（鋼鉄）製を使用するのがよい'], answer:2, explanation:'導波管はフランジ部をねじ止めして接続するが、このフランジ部から雨水等が入り込まないように、室外に施設する導波管には気密形を使用する。気密形は接合部にOリングを用いる等の措置を施して防水効果を高めている。逆に室内に設けるものについては非気密形でも特に問題はない。結合用ねじは錆を防ぐためステンレス製を使用する（スチール製は錆びるおそれがある）。' },
        { category:'電気の基礎（電磁気学）', question:'次の図に示す磁性体の磁束密度B〔T〕と磁界の強さH〔A/m〕の曲線（ヒステリシス曲線）に関する記述として、適当なものはどれか。', options:['この曲線は、無負荷飽和曲線と呼ばれる','電磁石の鉄心の材料としては、残留磁気と保磁力が大きい強磁性体が適している','この曲線を一回りするときに消費される電気エネルギーは、この曲線内の面積に反比例する','この曲線のaは残留磁気を表し、bは保磁力を表す'], answer:3, explanation:'掲出のグラフはヒステリシス曲線（磁化曲線）であり、無負荷飽和曲線は同期発電機の特性を示す別の曲線である（①は不適当）。電磁石の鉄心に残留磁気と保磁力の大きい材料を使うと、電流を増減しても希望の強さに到達しにくく好ましくない（②も不適当）。曲線を一周する際に消費されるヒステリシス損（コアロス）は曲線内の面積に比例する（③も不適当）。外部磁界を取り除いても磁性体に残る磁束密度aが残留磁気、磁束密度を0にするために必要な外部磁場の大きさbが保磁力であり、④が適当。' },
        { category:'電気の基礎（点電荷）', question:'真空中においてA点にQA=+64〔μC〕の点電荷を置いたとき、A点から2m離れたB点における電界の強さ〔V/m〕として、適当なものはどれか。ただし、比例定数k=1/(4πε0)は9.0×10^9〔N・m^2/C^2〕とする。', options:['3.6×10^4〔V/m〕','7.2×10^4〔V/m〕','1.44×10^5〔V/m〕','2.88×10^5〔V/m〕'], answer:2, explanation:'点電荷Q〔C〕からr〔m〕離れた位置の電界強度はE=k×Q/r^2〔V/m〕で表される。距離の2乗に反比例する点に注意。E=9.0×10^9×(64×10^-6)/2^2=9.0×10^9×16×10^-6=1.44×10^5〔V/m〕となる。' },
        { category:'電気の基礎（点電荷）', question:'真空中にQ1=2〔μC〕とQ2=8〔μC〕の正電荷が距離L=30〔cm〕を隔てて置かれているとき、2つの電荷間に働く静電力の大きさF〔N〕として、適当なものはどれか。ただし、真空の誘電率はε0=1/(36π)×10^-9〔F/m〕とする。', options:['0.4〔N〕','0.8〔N〕','1.6〔N〕','3.2〔N〕'], answer:2, explanation:'静電気に関するクーロンの法則より、F=Q1×Q2/(4πε0r^2)〔N〕。静電力の大きさは電荷量の積に比例し、距離の2乗に反比例する。距離が〔cm〕で与えられているので0.3〔m〕に換算して代入すると、F=(2×10^-6×8×10^-6)/(4π×(1/36π)×10^-9×0.3^2)=1.6〔N〕となる。同種の電荷は反発し合い、異種であれば引き合う。' },
        { category:'電気の基礎（環状鉄心）', question:'平均磁路長ℓ=40〔cm〕、断面積S=8〔cm^2〕、透磁率μ=1.0×10^-2〔H/m〕の環状鉄心に巻かれた巻数N=100のコイルの自己インダクタンスL〔H〕として、適当なものはどれか。ただし、磁束の漏れはないものとする。', options:['2×10^-2〔H〕','2×10^-1〔H〕','2〔H〕','2×10^1〔H〕'], answer:1, explanation:'環状鉄心に巻かれたコイルの自己インダクタンスはL=μSN^2/ℓ〔H〕で表される。問題文の長さ〔cm〕、断面積〔cm^2〕をメートル単位に換算して代入すると、L=(1.0×10^-2×8×10^-4×100^2)/0.4=2×10^-1〔H〕となる。断面積が分子、磁路長が分母である点に注意。' },
        { category:'電気の基礎（環状鉄心）', question:'平均磁路長L=50〔cm〕、断面積S=10〔cm^2〕、比透磁率μr=500の環状鉄心に巻数N1=500、N2=200の2つのコイルがあるとき、両コイルの相互インダクタンスM〔mH〕として、適当なものはどれか。ただし、真空の透磁率μ0=1.2×10^-6〔H/m〕とし、磁束の漏れはないものとする。', options:['1.2×10^1〔mH〕','6×10^1〔mH〕','1.2×10^2〔mH〕','2.4×10^2〔mH〕'], answer:2, explanation:'相互インダクタンスはM=μ0×μr×S×N1×N2/L〔H〕で表される。片方のコイルの電流がΔt秒間にΔIだけ変化したとき、もう一方のコイルに発生する起電力はe=-M×ΔI/Δt〔V〕であり、Mは相互誘導の大きさの程度を表す。数値を代入すると、M=(1.2×10^-6×500×0.1×0.01×500×200)/0.5=1.2×10^-1〔H〕=1.2×10^2〔mH〕。長さと断面積のメートル換算、および解答単位が〔mH〕である点に注意。' },
        { category:'電気の基礎（コンデンサ）', question:'C1=2〔μF〕とC2=4〔μF〕のコンデンサを直列に接続し、その両端にV=12〔V〕を加えたとき、2つのコンデンサに蓄えられるエネルギーW〔J〕として、適当なものはどれか。', options:['4.8×10^-5〔J〕','9.6×10^-5〔J〕','1.92×10^-4〔J〕','4.32×10^-4〔J〕'], answer:1, explanation:'コンデンサ2個の直列接続の合成静電容量は「和分の積」で求められ、C=C1×C2/(C1+C2)=(2×4)/(2+4)=4/3〔μF〕。コンデンサに蓄えられるエネルギーはW=(1/2)CV^2〔J〕なので、W=(1/2)×(4/3)×10^-6×12^2=9.6×10^-5〔J〕となる。なお並列接続の場合の合成容量は単純な足し算になる。' },
        { category:'直流回路', question:'内部抵抗r=10〔Ω〕、起電力E=8〔V〕の電源に抵抗R〔Ω〕の素子を接続したとき、素子に供給される電力〔W〕の最大値として、適当なものはどれか。', options:['0.8〔W〕','1.6〔W〕','3.2〔W〕','6.4〔W〕'], answer:1, explanation:'抵抗素子Rに供給される電力はPR=64R/(10+R)^2〔W〕と整理でき、これは負荷抵抗Rが内部抵抗rと同じ値をとるとき（R=10Ω）に最大値をとる。このときPmax=64×10/(10+10)^2=1.6〔W〕となる。' },
        { category:'直流回路（キルヒホッフの法則）', question:'起電力8〔V〕の直流電源と抵抗R1=4〔Ω〕の直列枝、起電力5〔V〕の直流電源と抵抗R2=2〔Ω〕の直列枝、および抵抗R3=2〔Ω〕の枝が並列に接続された回路において、抵抗R2を流れる電流I2〔A〕の値として、適当なものはどれか。', options:['0.2〔A〕','0.7〔A〕','1.9〔A〕','2.3〔A〕'], answer:1, explanation:'キルヒホッフの法則を用いる。電流は回路を一周する間に増えたり減ったりせず、電圧は回路を一周して戻ってきたときに0〔V〕になる。R3を流れる電流をI3とするとI3=I1+I2。各ループについて8-I1×R1-I3×R3=0、5-I2×R2-I3×R3=0の式を立て、3つの連立方程式を解くとI2=0.7〔A〕が得られる。' },
        { category:'交流回路（直列共振）', question:'電圧10〔V〕の交流電源に抵抗R=4〔Ω〕、インダクタンスL=120〔mH〕、コンデンサC=0.75〔μF〕を直列に接続したRLC直列共振回路において、共振時にコイルLにかかる電圧VL〔V〕として、適当なものはどれか。', options:['250〔V〕','500〔V〕','1000〔V〕','2000〔V〕'], answer:2, explanation:'共振時は合成インピーダンスの虚数部が0となり、Zは抵抗分の4〔Ω〕のみとなるため、回路電流はI=10/4=2.5〔A〕。共振条件XL=XC（XL=2πfL、XC=1/(2πfC)）から共振周波数を求めるとf=10^4/(6π)〔Hz〕、これよりXL=4×10^2〔Ω〕。よってVL=I×XL=2.5×400=1000〔V〕となる。' },
        { category:'交流回路（並列つなぎ）', question:'交流電源電圧E=160〔V〕に、抵抗R=20〔Ω〕、誘導性リアクタンスXL=40〔Ω〕、容量性リアクタンスXC=16〔Ω〕が並列に接続されたRLC並列回路において、回路に流れる電流I〔A〕として、適当なものはどれか。', options:['5〔A〕','8〔A〕','10〔A〕','16〔A〕'], answer:2, explanation:'RLC並列回路の合成インピーダンスの大きさは、1/Z=√((1/R)^2+(1/XL-1/XC)^2)〔S〕で表される。数値を代入すると1/Z=√((1/20)^2+(1/40-1/16)^2)=1/16〔S〕、よってZ=16〔Ω〕。オームの法則によりI=E/Z=160/16=10〔A〕となる。' },
        { category:'論理回路（論理式）', question:'論理式に関するド・モルガンの法則として、適当なものはどれか。ただし、A+Bは論理和を表し、A・Bは論理積を表し、上線（バー）は否定を表す。', options:['(A+B)全体の否定は、（Aの否定）・（Bの否定）に等しい','(A+B)全体の否定は、（Aの否定）+（Bの否定）に等しい','(A・B)全体の否定は、（Aの否定）・（Bの否定）に等しい','(A+B)全体の否定は、A・Bに等しい'], answer:0, explanation:'ド・モルガンの法則は暗記必須の重要公式である。論理和全体の否定は各項の否定の論理積（A+Bの否定＝Aの否定・Bの否定）となり、論理積全体の否定は各項の否定の論理和（A・Bの否定＝Aの否定+Bの否定）となる。論理回路の式を整理する際、バーを外す計算の中心となる。' },
        { category:'論理回路（論理式）', question:'論理式「（Aの否定・B ＋ A・Bの否定）全体の否定」を簡単化したものとして、適当なものはどれか。ただし、A+Bは論理和、A・Bは論理積、否定はその変数・式の反転を表す。', options:['A','Aの否定・B ＋ A・Bの否定','B','A・B ＋ Aの否定・Bの否定'], answer:3, explanation:'ド・モルガンの法則により、全体の否定は（Aの否定・B）の否定と（A・Bの否定）の否定の論理積となり、(A+Bの否定)・(Aの否定+B)と変形できる。これを展開するとA・Aの否定+A・B+Aの否定・Bの否定+B・Bの否定となり、A・Aの否定=0、B・Bの否定=0を用いて整理すると、A・B＋Aの否定・Bの否定が得られる。' },
        { category:'論理回路（論理式）', question:'論理式「（Aの否定・B ＋ Aの否定・Bの否定）全体の否定」を簡単化したものとして、適当なものはどれか。ただし、A+Bは論理和、A・Bは論理積、否定はその変数・式の反転を表す。', options:['A・B','A','Aの否定・B ＋ A・Bの否定','A・B ＋ Aの否定・Bの否定'], answer:1, explanation:'ド・モルガンの法則により、(A+Bの否定)・(A+B)と変形できる。展開するとA・A+A・B+A・Bの否定+Bの否定・Bとなり、A・A=A、B・Bの否定=0を用いて整理すると、A+A・(B+Bの否定)=A+A=Aが得られる。ブール代数の性質A+A=A、A・A=Aも併せて覚えておきたい。' },
        { category:'論理回路（論理式）', question:'論理変数Aとその否定に関する論理式の性質として、適当なものはどれか。ただし、+は論理和、・は論理積、1は全体、0は空を表す。', options:['A ＋ A ＝ 1','A ・（Aの否定）＝ 1','A ＋（Aの否定）＝ 1','A ・ A ＝ 0'], answer:2, explanation:'Aを「日本人」とすると、日本人と日本人でない人を足した状態は全体になるので、A+（Aの否定）=1である。日本人と日本人でない人を兼任する人は1人もいないのでA・（Aの否定）=0、日本人と日本人を足しても日本人のみなのでA+A=A、日本人でありかつ日本人なのは日本人のみなのでA・A=Aとなる。また、（Aの否定）の否定はAに戻り、A+1=1である。' },
        { category:'交流回路（直列共振）', question:'抵抗R、コイルL、コンデンサCを直列に接続したRLC直列回路が共振する条件として、適当なものはどれか。ただし、XLはコイルのリアクタンス、XCはコンデンサのリアクタンスとする。', options:['XL ＝ XC となるとき','R ＝ XL となるとき','R ＝ XC となるとき','XL ＝ 2XC となるとき'], answer:0, explanation:'交流回路の共振条件は、コイルのリアクタンスXL=2πfL〔Ω〕とコンデンサのリアクタンスXC=1/(2πfC)〔Ω〕とが等しくなる場合である。共振状態では合成インピーダンスの虚数部が0となり、回路のインピーダンスは抵抗分Rのみとなる。この条件から電源の周波数や各素子にかかる電圧を算出できる。' },
        { category:'電気の基礎（電磁気学）', question:'真空中に平行に置いた2本の直線導体に、同じ向きに電流を流したとき、2本の導体間に働く力に関する記述として、適当なものはどれか。', options:['導体は互いに引き合う','導体は互いに反発し合う','導体間に力は働かない','導体は電流の向きに移動する'], answer:0, explanation:'平行な2本の導線に電流を流すと、片方の電流が作る磁場によってもう一方の導線が力を受ける。電流の向きが同じときは2本の導線は引き合い、逆に反対向きに流れている場合は反発し合う。これは右ねじの法則とフレミング左手の法則（左手：作用する力・磁界・電流）で理解できる。導体1mあたりに働く力はF=μ0×I1I2/(2πr)〔N/m〕で表される。' }
    ]
};

questions.beginner.forEach((q,i)     => q.id = 'b'+i);
questions.intermediate.forEach((q,i) => q.id = 'i'+i);
questions.advanced.forEach((q,i)     => q.id = 'a'+i);

const allQuestions = [
    ...questions.beginner.map(q => ({...q, _level:'初級'})),
    ...questions.intermediate.map(q => ({...q, _level:'中級'})),
    ...questions.advanced.map(q => ({...q, _level:'上級'}))
];

function loadWeakIds()      { return new Set(JSON.parse(localStorage.getItem('weakIds') || '[]')); }
function saveWeakIds(s)     { localStorage.setItem('weakIds', JSON.stringify([...s])); }

function updateHomeScreen() {
    const count = loadWeakIds().size;
    const btn = document.getElementById('weak-btn');
    if (count > 0) {
        btn.style.display = 'block';
        document.getElementById('weak-btn-sub').textContent = `記録された苦手問題 ${count}問を集中攻略`;
    } else {
        btn.style.display = 'none';
    }
}

let currentLevel = '';
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let sessionWrong = [];

function startQuiz(level) {
    currentLevel = level;
    if (level === 'random') {
        currentQuestions = shuffle([...allQuestions]).slice(0, 20);
    } else if (level === 'weak') {
        const weakIds = loadWeakIds();
        const pool = allQuestions.filter(q => weakIds.has(q.id));
        if (pool.length === 0) { alert('苦手問題はまだありません。'); return; }
        currentQuestions = shuffle(pool).slice(0, Math.min(20, pool.length));
    } else {
        currentQuestions = shuffle([...questions[level]]).slice(0, 20);
    }
    currentIndex = 0;
    score = 0;
    answered = false;
    sessionWrong = [];
    document.getElementById('level-screen').style.display  = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display   = 'block';
    showQuestion();
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;

    document.getElementById('progress-bar').style.width = ((currentIndex / total) * 100) + '%';
    document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${total} 問`;
    document.getElementById('category-tag').textContent  = q.category + (q._level ? '　[' + q._level + ']' : '');
    document.getElementById('question-text').textContent = q.question;

    // シャッフル済みなら再利用、初回のみシャッフル
    if (!q._shuffled) {
        const sd = shuffleOptions(q.options, q.answer);
        q._shuffledOptions = sd.options;
        q._correctIndex    = sd.correctIndex;
        q._shuffled        = true;
        q._selectedIndex   = null;
        q._answered        = false;
    }

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    q._shuffledOptions.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = '①②③④'[i] + ' ' + opt;
        if (q._answered) {
            btn.classList.add('disabled');
            if (i === q._correctIndex)   btn.classList.add('correct');
            else if (i === q._selectedIndex) btn.classList.add('wrong');
        } else {
            btn.onclick = () => selectAnswer(i, q._correctIndex);
        }
        optionsDiv.appendChild(btn);
    });

    if (q._answered) {
        answered = true;
        document.getElementById('explanation-text').textContent = q.explanation;
