        .level-btn.s2 { background: linear-gradient(135deg,#7cb342,#4b830d); color:#fff; box-shadow:0 4px 14px rgba(124,179,66,.4); }

        .result-circle .score-label { font-size: 13px; opacity: .9; }
        .result-message { font-size: 22px; font-weight: bold; color: #1a3a5c; margin-bottom: 8px; }
        .result-sub     { font-size: 14px; color: #666; margin-bottom: 28px; }
        .result-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-action {
            padding: 16px; border-radius: 12px;

        }
        .btn-action.primary   { background:linear-gradient(135deg,#1a3a5c,#2d6a9f); color:white; }
        .btn-action.secondary { background:white; color:#2d6a9f; border:2px solid #2d6a9f; }

        .weak-badge {
            display:inline-block; background:#ffebee; color:#c62828;
            font-size:12px; font-weight:bold; padding:2px 10px;
            border-radius:20px; margin-bottom:20px;
        }

        .quiz-nav {
            display: flex; gap: 8px; margin-bottom: 12px;
        }

            background: white; font-size: 13px; cursor: pointer; color: #555;
        }
        #prev-btn { display: none; }

        .category-breakdown {
            background:#f8f9fa; border-radius:12px; padding:16px;
            margin-bottom:20px; text-align:left;
        }
        .category-breakdown h3 { font-size:14px; color:#555; margin-bottom:10px; }
        .cat-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #eee; }

<body>

<header>
    <h1>電気通信施工管理技士 1級</h1>
    <p>第一次試験 問題集</p>
</header>

<div class="container">

    <div id="level-screen">
        <h2>問題を選んでください</h2>
        <p>全400問・解説付き・ランダム20問出題（2026年版テキスト対応）</p>
        <div class="tab-row">
            <button class="tab-btn" id="tab-star"  onclick="switchTab('star')">★重要度で選ぶ</button>
            <button class="tab-btn" id="tab-field" onclick="switchTab('field')">分野で選ぶ</button>
        </div>
        <div id="star-buttons"></div>
        <div id="group-buttons" style="display:none"></div>
        <button class="level-btn random" onclick="startQuiz('random')">
            🎲 ランダム（全問から20問）
        </button>
        <button class="level-btn weak" id="weak-btn" onclick="startQuiz('weak')">
            ❌ 苦手問題（集中攻略）
            <small id="weak-btn-sub"></small>
        </button>
        <div class="note-box">
            ★はテキスト「着手すべき優先度」に基づく章別の重要度です（★5が最優先）。
        </div>
    </div>

    <div id="quiz-screen">
        <div class="quiz-nav">
            <button class="quiz-nav-btn" onclick="goHomeFromQuiz()">🏠 最初に戻る</button>
            <button class="quiz-nav-btn" id="prev-btn" onclick="prevQuestion()">← 前の問題</button>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text"></div>
        <div class="question-card">
            <div class="category-tag"  id="category-tag"></div>
            <div class="question-text" id="question-text"></div>
            <div class="figure-wrap" id="figure-wrap" style="display:none"></div>
            <div class="options"       id="options"></div>
            <div class="result-banner" id="result-banner"></div>
            <div class="explanation"   id="explanation">
                <div class="explanation-title">📝 総合解説</div>
                <div id="explanation-text"></div>
            </div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
        <button class="skip-btn" id="skip-btn" onclick="skipQuestion()">⏭ この問題をスキップ（採点対象外）</button>
    </div>

    <div id="result-screen">
        <div class="result-circle" id="result-circle">
            <div class="score" id="result-score"></div>
            <div class="score-label">点</div>
        </div>
        <div class="result-message" id="result-message"></div>
        <div class="result-sub" id="result-sub"></div>
        <div class="category-breakdown" id="category-breakdown" style="display:none"></div>
        <div class="result-actions">
            <button class="btn-action primary"   onclick="retryQuiz()">もう一度挑戦</button>
            <button class="btn-action secondary" onclick="goHome()">分野選択に戻る</button>
        </div>
    </div>

</div>

<script>
const questions = [
  { id:'q0', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'工程表に関する記述として、適当でないものはどれか。', options:['バーチャートは、縦軸に工種(部分工事)をとり、横軸に各部分工事に必要な日数をとって表す','バーチャートは、作成が容易で各部分工事の工期がわかりやすく、総合工程表として広く用いられる','ガントチャートは、縦軸に部分工事をとり、横軸に各部分工事の出来高比率(達成度)をとって表す','ガントチャートは、工事全体の出来高比率の累計を容易に把握できるが、各部分工事の進捗度合いはわかりにくい'], answer:3, explanation:'ガントチャートは各部分工事の達成度(出来高比率)が一目で判断できる反面、工事全体の出来高比率の累計は把握できません。選択肢の記述は特徴が逆になっています。バーチャートは縦軸に工種、横軸に日数をとる形式で、作成が容易なため総合工程表として最もよく使われます。', choiceNotes:['正しい記述。バーチャートは縦軸に工種、横軸に日数(暦日)をとって各工事の期間を横棒で表す形式である。','正しい記述。作成が容易で各部分工事の工期が視覚的にわかりやすいため、総合工程表として広く用いられている。','正しい記述。ガントチャートは縦軸に部分工事、横軸に出来高比率(達成度)をとり、各工事の進捗率を表す。','誤り。ガントチャートは各部分工事の出来高比率(進捗度合い)は把握しやすいが、工事全体の出来高累計は把握できない。記述が特徴と逆になっている。'] },
  { id:'q1', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'構内電気設備の配線用図記号に関する記述として、適当でないものはどれか。', options:['構内電気設備の配線用図記号は、JIS C0303:2000 に定められている','日本産業規格(JIS)の根拠となる法律は、電気事業法である','テレビジョン受信用のアンテナの図記号は、VHF用とUHF用とで共通である','図記号には形状を象形的に模したものもあるが、由来が直感的にわかりにくいものも存在する'], answer:1, explanation:'日本産業規格(JIS)の根拠法は産業標準化法であり、電気事業法ではありません。構内電気設備の配線用図記号は JIS C0303:2000 として定義されています。テレビアンテナの図記号は、VHF波・UHF波のどちらを受信するものでも共通です。', choiceNotes:['正しい記述。構内電気設備の配線用図記号はJIS C0303:2000として規定されている。','誤り。JIS(日本産業規格)の根拠法は産業標準化法であり、電気事業法ではない。電気事業法は電気の使用・保安等を規律する法律である。','正しい記述。テレビジョン受信用アンテナの図記号はVHF用・UHF用で共通の記号が用いられる。','正しい記述。図記号には機器の形状を象形的に表したものがある一方、由来が直感的にわかりにくい記号も存在する。'] },
  { id:'q2', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'テレビ共同受信設備の系統図で用いられる図記号のうち、横棒にT字形の縦線を組み合わせた記号が表す機器として、適当なものはどれか。', options:['パラボラアンテナ','混合(分波)器','テレビアンテナ(八木アンテナ)','増幅器'], answer:2, explanation:'T字形の図記号は、VHF波やUHF波を受信する「テレビアンテナ」を表します。構造面から「八木アンテナ」と呼んでも構いません。BS・CS放送の受信には別記号のパラボラアンテナが用いられ、混合(分波)器や増幅器はそれぞれ円形・三角形をベースにした別の記号です。', choiceNotes:['誤り。パラボラアンテナは円の中に弧状の反射鏡を模した図記号で表され、横棒にT字形を組み合わせた記号ではない。','誤り。混合(分波)器は円形をベースとした図記号で表され、横棒とT字形の組み合わせではない。','正しい。横棒にT字形の縦線を組み合わせた図記号はVHF・UHF波を受信するテレビアンテナ(構造的には八木アンテナ)を表す。','誤り。増幅器は三角形やAMPの文字を用いた図記号で表され、横棒とT字形の組み合わせではない。'] },
  { id:'q3', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'テレビ共同受信設備で用いられるパラボラアンテナに関する記述として、適当でないものはどれか。', options:['BS放送やCS放送の電波を受信するために用いられる','地上デジタル放送のUHF波を受信するための標準的なアンテナである','はるか遠方の人工衛星からの微弱な電波を拾うために反射鏡形式が採用されている','構造面から捉えた名称として、オフセットパラボラアンテナとも呼ばれる'], answer:1, explanation:'パラボラアンテナは静止衛星からのBS・CS放送の電波を受信するためのアンテナです。地上デジタル放送(UHF帯)の受信には八木アンテナなどのテレビアンテナが用いられます。衛星からの微弱な電波を集めるために反射鏡(パラボラ)形式が採用されており、オフセットパラボラアンテナとも呼ばれます。', choiceNotes:['正しい記述。パラボラアンテナは静止衛星から送られるBS放送・CS放送の電波を受信するために用いられる。','誤り。地上デジタル放送のUHF波を受信する標準的なアンテナは八木アンテナ等のテレビアンテナであり、パラボラアンテナではない。','正しい記述。人工衛星からの微弱な電波を効率よく集めるため、反射鏡で電波を集約するパラボラ形式が採用されている。','正しい記述。反射鏡の形状的特徴からオフセットパラボラアンテナとも呼ばれる。'] },
  { id:'q4', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'テレビ共同受信設備に用いられる混合(分波)器に関する記述として、適当でないものはどれか。', options:['円の外側に描かれる枝線の向きが異なると、別の機器を表す図記号となる','八木アンテナからの系統と、パラボラアンテナで受信した衛星放送の系統とを1つに融合できる','混合された周波数帯域の異なる電波を、周波数ごとに分離することもできる','混合と分波の両方の機能を1つのデバイスで持つため、混合(分波)器と呼ばれる'], answer:0, explanation:'混合(分波)器の図記号では、円の外側の枝線の向きは意味を持たず、円の内側の形で判別します。VHF・UHF系統と衛星放送系統の混合、および周波数帯域ごとの分離(分波)の両機能を1つのデバイスで担うため、混合(分波)器と呼ばれます。', choiceNotes:['誤り。混合(分波)器の図記号は円の内側の形で機器を判別し、円の外側に描かれる枝線の向きに意味上の差異はない。','正しい記述。混合(分波)器は八木アンテナ系統とパラボラアンテナ(衛星放送)系統を1つの信号に融合(混合)する機能を持つ。','正しい記述。混合された異なる周波数帯域の電波を、周波数ごとに分離(分波)する機能も持つ。','正しい記述。混合と分波の両機能を1台で兼ね備えることから「混合(分波)器」と呼ばれる。'] },
  { id:'q5', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'テレビ共同受信設備における分岐器と分配器に関する記述として、適当でないものはどれか。', options:['分配器は、入力された信号を出力方に等分配する器具である','分岐器は、幹線と各分岐端子とを区別して、出力の大きさに差をつけられる器具である','図記号では、円の中に幹線を表す線が入っているものが分配器、入っていないものが分岐器である','分岐器の呼称は分岐線の本数で決まり、幹線の他に2本の分岐線があるものは2分岐器と呼ぶ'], answer:2, explanation:'図記号の見分け方が逆です。円の中に線があるものが分岐器、ないものが分配器です。機能面では、分配器は全端子への等分配、分岐器は幹線と分岐端子を区別して出力に差をつける点で異なります。分岐器は分岐線の本数により2分岐器・4分岐器などと呼びます。', choiceNotes:['正しい記述。分配器は入力信号を各出力端子へ均等に(等分配して)出力する器具である。','正しい記述。分岐器は幹線と各分岐端子を区別し、出力レベルに意図的な差をつけられる器具である。','誤り。図記号の見分け方が逆である。円の中に幹線を表す線が入っているものが分岐器、入っていないものが分配器である。','正しい記述。分岐器は分岐線の本数により呼称され、幹線の他に2本の分岐線があるものは2分岐器と呼ばれる。'] },
  { id:'q6', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'テレビ共同受信設備において、テレビ受像機を接続するユーザ側の共聴用端子を表す機器の名称として、適当なものはどれか。', options:['ヘッドエンド','テレビユニット(直列ユニット)','情報用アウトレット','分電盤'], answer:1, explanation:'テレビ受像機へ接続するユーザ側の共聴用端子は「テレビユニット」で、別名「直列ユニット」とも呼ばれます。ヘッドエンドはCATV網の起点設備、情報用アウトレットは有線LAN端末用のRJ45ジャックであり、いずれも別の機器です。', choiceNotes:['誤り。ヘッドエンドはCATVシステム網の起点(頭の端)となる送出設備であり、ユーザ側の共聴用端子ではない。','正しい。テレビ受像機を接続するユーザ側の共聴用端子はテレビユニットで、別名「直列ユニット」とも呼ばれる。','誤り。情報用アウトレットは有線LAN端末を接続するためのRJ45コネクタ用ジャックであり、テレビ用の端子ではない。','誤り。分電盤は電力を各回路に分配する強電設備であり、テレビ受信用の共聴端子とは無関係である。'] },
  { id:'q7', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'非常放送設備の系統図に用いられる図記号に関する記述として、適当でないものはどれか。', options:['アッテネータは、内蔵された抵抗器によって増幅器からの信号レベルを適切なレベルまで下げる減衰器である','四角の中にAMPと記した図記号は、音声信号を必要なレベルまで増大させる増幅器を表す','ホーン形スピーカは、ホーン構造によって平面波に近い音波を放射する特性がある','図記号の左側が黒く塗られたスピーカは、天井埋込形スピーカを表す'], answer:3, explanation:'左側が黒く塗られたスピーカの図記号は「壁付スピーカ」を表します。天井から下向きに設置されるタイプは通常のスピーカ記号(円に三角)です。アッテネータは信号レベルを下げる減衰器、AMPは増幅器で、増幅器は三角記号でもアルファベット略字でも表されます。', choiceNotes:['正しい記述。アッテネータは内蔵抵抗器により増幅器からの信号レベルを適切な値まで下げる減衰器である。','正しい記述。四角の中にAMPと記した図記号は音声信号を必要なレベルまで増大させる増幅器を表す。','正しい記述。ホーン形スピーカはホーン構造により指向性の高い平面波に近い音波を放射する特性を持つ。','誤り。図記号の左側が黒く塗られたスピーカは「壁付スピーカ」を表す。天井埋込形は通常の丸に三角の記号で表される。'] },
  { id:'q8', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'非常放送設備に用いられる警報サイレンに関する記述として、適当なものはどれか。', options:['災害発生等の非常時に警報音を吹鳴させ、多数の者に一斉周知するための機器である','電気信号を空気の振動に変換し、館内アナウンス等の音声放送を行うための機器である','増幅器からの過大な信号を減衰させて、スピーカを保護するための機器である','火災による熱を感知して、自動的に受信機へ信号を送出する機器である'], answer:0, explanation:'警報サイレンは、災害発生時などの非常時に警報音を吹鳴させて多数の者へ一斉に周知するための機器です。音声放送を行うのはスピーカ、信号レベルを下げるのはアッテネータの役割であり、熱感知は自動火災報知設備の感知器の機能です。', choiceNotes:['正しい。警報サイレンは災害発生等の非常時に警報音を吹鳴させ、多数の者に一斉周知するための機器である。','誤り。電気信号を音声に変換して館内アナウンス等を行うのはスピーカの役割であり、警報サイレンの機能ではない。','誤り。増幅器からの過大な信号を減衰させスピーカを保護するのはアッテネータの役割であり、警報サイレンの機能ではない。','誤り。火災の熱を感知して受信機へ信号を送るのは自動火災報知設備の感知器(熱感知器)の機能であり、警報サイレンとは異なる。'] },
  { id:'q9', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'CATVシステムに関する記述として、適当でないものはどれか。', options:['CATVはCommunity Antenna TeleVisionの略称で、有線によるテレビジョン放送を指す','ヘッドエンドは、CATVシステム網の終端となる加入者宅内の受信設備である','独自番組も展開するCATV事業者の場合、ヘッドエンドは局舎内に設置される','共同アンテナのような不感地帯の補完用途では、ヘッドエンドは受信アンテナの直下に置かれる'], answer:1, explanation:'ヘッドエンド(頭の端)は、CATVシステム網の「起点」となる設備であり、終端の加入者宅設備ではありません。事業者の形態によって局舎内、あるいは共同受信アンテナの直下に設置されます。CATVは有線テレビジョン放送全般を指す言葉です。', choiceNotes:['正しい記述。CATVはCommunity Antenna TeleVisionの略で、有線によるテレビジョン放送全般を指す。','誤り。ヘッドエンドはCATVシステム網の「起点」となる送出設備であり、加入者宅内の終端設備ではない。記述が逆になっている。','正しい記述。独自番組を展開するCATV事業者では、ヘッドエンドは局舎内に設置される。','正しい記述。共同アンテナのような難視聴(不感地帯)補完用途では、ヘッドエンドは受信アンテナの直下に置かれる。'] },
  { id:'q10', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'同軸ケーブルによるCATVシステムの系統図に用いられる機器に関する記述として、適当でないものはどれか。', options:['幹線分岐増幅器は、幹線を軸として分岐を行うと同時に、増幅の機能を持たせたデバイスである','同軸ケーブルで一定距離を伝送する場合には、一定間隔での増幅が不可欠である','幹線分岐増幅器の分岐線の本数は、必ず4本と定められている','分岐の機能を持たない増幅器の図記号は、屋内用と屋外用とで同じものが用いられる'], answer:2, explanation:'幹線分岐増幅器の分岐は4本に限らず、2本のものなども多く見られます。同軸ケーブルでの伝送では減衰が生じるため一定間隔での増幅が必要であり、幹線分岐増幅器は分岐と増幅を兼ねます。増幅器の図記号は屋内用・屋外用とも共通です。', choiceNotes:['正しい記述。幹線分岐増幅器は幹線からの分岐と信号の増幅の両機能を兼ね備えたデバイスである。','正しい記述。同軸ケーブルは伝送距離に応じて信号が減衰するため、一定間隔での増幅が必要となる。','誤り。幹線分岐増幅器の分岐線の本数は4本に限定されず、2本のものなど複数の種類がある。','正しい記述。分岐機能を持たない増幅器の図記号は、屋内用・屋外用ともに共通のものが用いられる。'] },
  { id:'q11', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'情報ネットワーク設備の系統図に用いられる図記号に関する記述として、適当でないものはどれか。', options:['四角の中にJBと記した図記号は、主に一般家庭で機器や配線を1か所に集約した情報分電盤を表す','四角の中にJBと記した図記号は、強電用の電源ブレーカを収納する分電盤を表す','円の中に白抜きの菱形を配した図記号は、各種接続口を集約した複合アウトレットを表す','情報分電盤は、別名ホームLANシステムとも呼ばれる'], answer:1, explanation:'JBの図記号が表す情報分電盤は、テレビジョンやネットワーク関連の機器・配線を集約したもので、強電の電源ブレーカを収納する分電盤とはスタイルが異なります。別名ホームLANシステムとも呼ばれます。複合アウトレットはLAN・電話・テレビ・ACコンセント等の接続口を集約したものです。', choiceNotes:['正しい記述。四角の中にJBと記した図記号は、主に一般家庭で機器や配線を1か所に集約した情報分電盤を表す。','誤り。JBの図記号は情報・通信系統を集約する情報分電盤を表すものであり、強電用の電源ブレーカを収納する分電盤とは別のものである。','正しい記述。円の中に白抜きの菱形を配した図記号は、LAN・電話・テレビ等の接続口を集約した複合アウトレットを表す。','正しい記述。情報分電盤は別名ホームLANシステムとも呼ばれる。'] },
  { id:'q12', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'情報ネットワーク設備に用いられるルータに関する記述として、適当なものはどれか。', options:['プロトコル階層のうちデータリンク層(第2層)のMACアドレスのみを参照してフレームを転送する','プロトコル階層のうちネットワーク層(第3層)の情報を解析して、データ転送の可否や転送先の決定等を行う','電気信号を増幅・整形して伝送距離を延長するだけの物理層(第1層)の機器である','複数の端末を単純に集線する装置であり、転送先の判断は行わない'], answer:1, explanation:'ルータはネットワーク層(第3層)の情報を解析して転送の可否や転送先の決定を行う機器で、TCP/IPネットワークの主要な中継機器です。図記号では四角にRTと記されます。第2層で転送するのはスイッチ、単純な集線はハブ、物理層の信号再生はリピータの機能です。', choiceNotes:['誤り。MACアドレスを参照して第2層でフレームを転送するのはスイッチ(スイッチングハブ)の機能であり、ルータの機能ではない。','正しい。ルータはネットワーク層(第3層)の情報(IPアドレス等)を解析し、データ転送の可否や転送先の決定等を行う機器である。','誤り。電気信号を増幅・整形して伝送距離を延長するだけの物理層(第1層)の機器はリピータであり、ルータの機能ではない。','誤り。複数端末を単純に集線し転送先の判断を行わないのはハブの機能であり、ルータはネットワーク層で経路を判断する。'] },
  { id:'q13', group:'有線・線路施工', category:'配線用図記号', chapter:'1章', stars:5, question:'情報ネットワーク設備の系統図に用いられる図記号に関する記述として、適当でないものはどれか。', options:['四角の中にHUBと記した図記号は、主にネットワークの集線装置を表す','円の中に黒塗りの長方形を配した図記号は、情報用アウトレットを表す','情報用アウトレットは、一般的にRJ45コネクタに対応したジャック(メス側の受け口)である','四角の中にRTと記した図記号は、有線LAN端末の壁面接続口を表す'], answer:3, explanation:'RTはルータ(Router)を表す図記号です。有線LAN端末の壁面接続口は「情報用アウトレット」で、円の中に黒塗りの長方形を配した記号で表され、一般にRJ45コネクタ対応のジャックとなっています。HUBは集線装置のハブを表します。', choiceNotes:['正しい記述。四角の中にHUBと記した図記号は、主にネットワークの集線装置(ハブ)を表す。','正しい記述。円の中に黒塗りの長方形を配した図記号は、有線LAN端末用の情報用アウトレットを表す。','正しい記述。情報用アウトレットは一般的にRJ45コネクタに対応したジャック(メス側の受け口)である。','誤り。RTはルータ(Router)を表す図記号であり、有線LAN端末の壁面接続口(情報用アウトレット)を表すものではない。'] },
  { id:'q14', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款における設計図書に関する記述として、適当でないものはどれか。', options:['設計図書には、図面、仕様書、現場説明書および現場説明に対する質問回答書が含まれる','現場説明書や現場説明に対する質問回答書は、契約締結前の書類であるため設計図書には含まれない','仕様書は工事の施工に際して要求される技術的要件を示す文書で、通常は共通仕様書と特記仕様書からなる','設計図書でいう図面には、基本設計や概略設計等の図面も含まれる'], answer:1, explanation:'公共工事標準請負契約約款で定める設計図書は、図面・仕様書・現場説明書・現場説明に対する質問回答書の4点です。現場説明書等は契約締結前の書類ですが、設計図書に含まれると定義されています。この4点は暗記必須の基本事項です。', choiceNotes:['正しい記述。公共工事標準請負契約約款上、設計図書には図面、仕様書、現場説明書および現場説明に対する質問回答書が含まれる。','誤り。現場説明書や質問回答書は契約締結前に作成される書類だが、約款上は明確に設計図書に含まれると定義されている。','正しい記述。仕様書は施工上要求される技術的要件を示す文書で、通常は共通仕様書と特記仕様書からなる。','正しい記述。設計図書でいう図面には、基本設計や概略設計等の図面も含まれる。'] },
  { id:'q15', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款に関する記述として、適当でないものはどれか。', options:['受注者は、設計図書の中の文書間に内容の不一致を発見したとき、優先順位の記載がない場合には監督員に通知し、その確認を請求しなければならない','施工方法等については、約款および設計図書に特別の定めがある場合を除き、受注者がその責任において定める','発注者が監督員を置かないときは、約款に定める監督員の権限は発注者に帰属する','施工方法等については、約款および設計図書に定めのない事項はすべて発注者が指示しなければならない'], answer:3, explanation:'工事目的物を完成するために必要な施工方法その他の手段は、約款および設計図書に特別の定めがある場合を除き、受注者がその責任において定めることとされています。発注者の指示によるのではありません。文書間の不一致発見時の監督員への通知・確認請求や、監督員不設置時の権限の発注者帰属は約款どおりの正しい記述です。', choiceNotes:['正しい記述。受注者は設計図書の文書間の内容不一致を発見し優先順位の記載がない場合、監督員に通知しその確認を請求しなければならない。','正しい記述。施工方法等は約款・設計図書に特別の定めがある場合を除き、受注者が自らの責任において定める。','正しい記述。発注者が監督員を置かないときは、約款に定める監督員の権限は発注者に帰属する。','誤り。施工方法等について約款・設計図書に定めのない事項は受注者が自らの責任で定めるものであり、発注者がすべて指示するわけではない。'] },
  { id:'q16', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款における設計図書の取扱いに関する記述として、適当でないものはどれか。', options:['受注者は、設計図書に誤謬または脱漏を発見した場合、工事着手までの時間がないときは、監督員への通知を工事着手後に行うことができる','発注者は、必要があると認めるときは、設計図書の変更内容を受注者に通知して、設計図書を変更することができる','発注者は、必要があると認めるときは、工事の中止内容を受注者に通知して、工事の全部または一部の施工を一時中止させることができる','工期や請負代金額の変更に応じて、発注者は受注者に損害が発生した場合にその費用を負担することが明記されている'], answer:0, explanation:'受注者は、設計図書に誤謬(誤り)や脱漏(必要な情報の抜け落ち)を発見したときは、その旨を「直ちに」監督員に通知して確認を請求しなければなりません。工事着手後に通知を先送りすることは認められていません。設計図書の変更や工事の一時中止は発注者の権限として認められており、損害費用の負担も明記されています。', choiceNotes:['誤り。受注者は設計図書の誤謬・脱漏を発見した場合、その旨を直ちに監督員に通知し確認を請求しなければならない。工事着手後への先送りは認められない。','正しい記述。発注者は必要があると認めるときは、変更内容を通知して設計図書を変更することができる。','正しい記述。発注者は必要があると認めるときは、工事の中止内容を通知して工事の全部または一部を一時中止させることができる。','正しい記述。工期や請負代金額の変更等により受注者に損害が生じた場合、発注者がその費用を負担することが約款に明記されている。'] },
  { id:'q17', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款における工事材料に関する記述として、適当でないものはどれか。', options:['工事材料の品質は、設計図書にその品質が明示されていない場合にあっては、中等の品質を有するものとする','受注者は、設計図書において監督員の検査を受けて使用すべきものと指定された工事材料については、当該検査に合格したものを使用しなければならない','受注者は、工事現場内に搬入した工事材料を、監督員による検査を受けなければ工事現場外に搬出してはならない','設計図書に定める監督員の検査に直接要する費用は、受注者の負担とされている'], answer:2, explanation:'工事現場内に搬入した工事材料の場外搬出に必要なのは、監督員の「承諾」であって検査ではありません。所有権の所在にかかわらず、受注者の意思のみでは搬出できない定めです。品質の明示がない場合は「中等の品質」とすること、指定検査材料は合格品のみ使用すること、検査費用が受注者負担であることは約款第13条のとおりです。', choiceNotes:['正しい記述。工事材料の品質が設計図書に明示されていない場合は、中等の品質を有するものとする。','正しい記述。監督員の検査を受けて使用すべきものと指定された工事材料は、検査に合格したものを使用しなければならない。','誤り。工事現場内に搬入した材料を場外へ搬出する際に必要なのは監督員の「承諾」であり、「検査」ではない。','正しい記述。設計図書に定める監督員の検査に直接要する費用は受注者の負担とされている。'] },
  { id:'q18', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款に基づく施工に関する記述として、適当なものはどれか。', options:['設計図書において監督員の立会いの上施工するものと指定された工事でも、受注者の判断で立会いを省略して施工できる','工事材料の品質が設計図書に明示されていない場合、受注者は価格優先で下等の品質のものを採用してよい','監督員は、災害防止その他工事の施工上特に必要があると認めるときは、受注者に対して臨機の措置をとることを請求することができる','工事現場に搬入した材料の所有権は常に発注者にあるため、受注者は自由に場外へ搬出できる'], answer:2, explanation:'監督員は、災害防止等のため施工上特に必要があると認めるときは、受注者に臨機の措置を請求できます。監督員の立会いが指定された工事は立会いなしには施工できず、品質の明示がない材料は中等の品質とし、搬入済み材料の場外搬出には監督員の承諾が必要です。', choiceNotes:['誤り。監督員の立会いの上施工するものと指定された工事は、受注者の独断で立会いを省略することはできない。','誤り。品質が明示されていない工事材料は中等の品質を有するものを用いなければならず、下等の品質のものを採用することはできない。','正しい。監督員は災害防止その他施工上特に必要があると認めるときは、受注者に対して臨機の措置をとることを請求できる。','誤り。搬入済み材料の所有権にかかわらず、場外への搬出には監督員の承諾が必要であり、受注者が自由に搬出できるわけではない。'] },
  { id:'q19', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款における現場代理人に関する記述として、適当でないものはどれか。', options:['現場代理人は、契約の履行に関し工事現場に常駐して、その運営や取締り等を行う','現場代理人には、請負代金額の変更、請負代金の請求および受領、契約の解除に係る権限が与えられている','工事現場における運営等に支障がなく発注者との連絡体制が確保される場合には、現場代理人の常駐義務を要しないこともあり得る','受注者は、現場代理人を定めたときは、その氏名その他必要な事項を発注者に通知しなければならない'], answer:1, explanation:'現場代理人は契約の履行に関して受注者の広範な権限を行使できますが、「請負代金額の変更」「請負代金の請求および受領」「契約の解除」の3つは権限から除外されています。連絡体制が確保されれば常駐を要しない場合もあり、現場代理人等を定めたときの発注者への通知義務も約款第10条に定められています。', choiceNotes:['正しい記述。現場代理人は契約の履行に関し工事現場に常駐して、その運営や取締り等を行う。','誤り。現場代理人には請負代金額の変更、請負代金の請求・受領、契約の解除に係る権限は与えられておらず、これらは除外事項である。','正しい記述。工事現場の運営等に支障がなく発注者との連絡体制が確保される場合、常駐義務を要しないこともあり得る。','正しい記述。受注者は現場代理人を定めたとき、その氏名その他必要な事項を発注者に通知しなければならない。'] },
  { id:'q20', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事の請負契約に関する記述として、適当でないものはどれか。', options:['受注者は、必要に応じて工事の全部を一括して第三者に請け負わせることができる','受注者は、契約書および設計図書に特別の定めがない場合には、仮設、施工方法その他工事目的物を完成するために必要な一切の手段を、自らの責任において定める','受注者は、工事の完成や設計図書の変更等によって不用となった支給材料を、発注者に返還しなければならない','発注者は、受注者に対して、下請負人の商号または名称その他必要な事項の通知を請求することができる'], answer:0, explanation:'工事の全部(あるいは主要部分の全部)を一括して第三者に請け負わせることは「一括下請負(丸投げ)」といい、厳しく禁止されています。支給材料が不用となった場合は発注者の財産であるため返還義務があり、仮設・施工方法等は特別の定めがなければ受注者が自らの責任で定めます。', choiceNotes:['誤り。工事の全部を一括して第三者に請け負わせる行為は一括下請負(丸投げ)として厳しく禁止されている。','正しい記述。契約書・設計図書に特別の定めがない場合、施工方法その他必要な一切の手段は受注者が自らの責任で定める。','正しい記述。工事完成や設計変更等により不用となった支給材料は発注者の財産であり、受注者は発注者に返還しなければならない。','正しい記述。発注者は受注者に対し、下請負人の商号または名称その他必要な事項の通知を請求することができる。'] },
  { id:'q21', group:'施工管理', category:'公共工事標準請負契約約款', chapter:'1章', stars:5, question:'公共工事標準請負契約約款における支払等の期限に関する記述として、誤っているものはどれか。ただし、請負契約には前金払および部分払に関する規定があるものとする。', options:['発注者は、前払金の支払の請求があったときは、請求を受けた日から14日以内に前払金を支払わなければならない','発注者は、工事を完成した旨の通知を受けたときは、通知を受けた日から14日以内に完成を確認するための検査を完了しなければならない','発注者は、部分払の請求があったときは、検査完了後の請求を受けた日から40日以内に部分払金を支払わなければならない','発注者は、工事が完成の検査に合格し請負代金の支払の請求があったときは、請求を受けた日から40日以内に請負代金を支払わなければならない'], answer:2, explanation:'部分払の場合、検査完了後の請求から「14日以内」に支払わなければなりません。40日以内となるのは完成時の請負代金の支払です。前払金は請求から14日以内、完成検査は通知から14日以内に完了という期限も重要です。部分払(14日)と完成時(40日)の違いを整理して覚えましょう。なお建設業法では日数が異なるため、根拠が約款か建設業法かの見極めも必要です。', choiceNotes:['正しい記述。前払金は請求を受けた日から14日以内に支払わなければならない。','正しい記述。工事完成の通知を受けたときは、通知を受けた日から14日以内に完成検査を完了しなければならない。','誤り。部分払金は検査完了後の請求を受けた日から「14日以内」に支払わなければならず、40日以内ではない。40日以内は完成時の請負代金の支払期限である。','正しい記述。完成の検査に合格し請負代金の支払請求があったときは、請求を受けた日から40日以内に支払わなければならない。'] },
  { id:'q22', group:'施工管理', category:'労働安全衛生法', chapter:'基礎', stars:0, question:'労働安全衛生法令に基づき、建設業を営む事業者が新たに職務につくこととなった職長に対して行う安全または衛生のための教育(職長教育)の内容として、定められていないものはどれか。', options:['作業方法の決定および労働者の配置に関すること','労働者に対する指導または監督の方法に関すること','就業規則の作成に関すること','危険性または有害性等の調査の方法に関すること'], answer:2, explanation:'職長教育の内容は、作業方法の決定・労働者の配置、指導・監督の方法、危険性または有害性等の調査とその結果に基づき講ずる措置、異常時・災害発生時における措置など、現場での作業に直接関連する事項に限られます。就業規則の作成や労働者の福利厚生といった本社・営業所で対応可能な事項は教育の対象外です。', choiceNotes:['職長教育の内容として定められている。作業方法の決定および労働者の配置に関する事項は、現場での指導監督に直結するため含まれる。','職長教育の内容として定められている。労働者に対する指導・監督の方法は職長教育の中心的な項目である。','誤り(定められていない)。就業規則の作成は本社・営業所レベルの労務管理事項であり、現場作業に直結する職長教育の内容には含まれない。','職長教育の内容として定められている。危険性または有害性等の調査(リスクアセスメント)の方法は現場管理の重要事項として含まれる。'] },
  { id:'q23', group:'施工管理', category:'労働安全衛生法', chapter:'基礎', stars:0, question:'労働安全衛生法に定める職長等に対する安全衛生教育に関する記述として、適当でないものはどれか。', options:['職長とは、現場に常駐して作業者に対し直接の指揮を行う第一線の現場監督者を指す','職長教育の対象には、作業主任者も含まれる','事業者は、新たに職務につくこととなった職長に対し安全または衛生のための教育を行わなければならない','教育内容には、労働災害防止についての関心の保持および労働者の創意工夫を引き出す方法に関することが含まれる'], answer:1, explanation:'労働安全衛生法第60条では、新たに職務につく職長その他労働者を直接指導または監督する者に対する安全衛生教育を事業者に義務付けていますが、条文上「作業主任者を除く」とされており、作業主任者は職長教育の対象に含まれません。職長は班長・作業長・リーダー等の名称でも呼ばれる第一線の現場監督者です。', choiceNotes:['正しい記述。職長とは現場に常駐して作業者に直接の指揮を行う第一線の現場監督者を指す。','誤り。労働安全衛生法第60条では、職長教育の対象者から「作業主任者」は除かれており、作業主任者は職長教育の対象に含まれない。','正しい記述。事業者は新たに職務につくこととなった職長に対し、安全または衛生のための教育を行わなければならない。','正しい記述。教育内容には労働災害防止についての関心の保持や労働者の創意工夫を引き出す方法に関することが含まれる。'] },
  { id:'q24', group:'施工管理', category:'労働安全衛生法令(飛来・落下対策)', chapter:'2章', stars:5, question:'高所からの物体の投下に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['2m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等の措置を講じなければならない','5m以上の高所から物体を投下する場合に限り、投下設備の設置が義務付けられている','3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等の措置を講じなければならない','高さにかかわらず、物体を投下するときは常に投下設備と監視人の配置が必要である'], answer:2, explanation:'労働安全衛生規則第536条により、3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等の措置が必要です。高さ3m未満の投下は規制の対象外です。2mという数値は作業床の囲い等(高所作業の定義)に関するもので、投下の基準ではない点に注意しましょう。', choiceNotes:['誤り。労働安全衛生規則第536条の基準は2mではなく、3m以上の高所からの投下について定められている。','誤り。5m以上に限定する規定はなく、基準は3m以上である。','正しい。労働安全衛生規則第536条により、3m以上の高所から物体を投下するときは投下設備の設置と監視人の配置等の措置が必要である。','誤り。高さにかかわらず常に必要とする規定ではなく、3m以上の場合に限り義務付けられている。'] },
  { id:'q25', group:'施工管理', category:'労働安全衛生法令(飛来・落下対策)', chapter:'2章', stars:5, question:'物体の飛来・落下による労働者の危険防止措置に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['作業のため物体が飛来するおそれがあるときは、飛来防止の設備を設け、労働者に保護具を使用させる','作業のため物体が落下するおそれがあるときは、防網の設備を設け、立入区域を設定する','高さ2m以上の作業床の開口部等には、囲い、手すり、覆い等を設ける','作業のため物体が落下するおそれがあるときは、要求性能墜落制止用器具を安全に取り付けるための設備を設ける'], answer:3, explanation:'物体の落下による危険防止措置は、労働安全衛生規則第537条により「防網の設備を設けること」と「立入区域を設定すること」です。要求性能墜落制止用器具は作業者自身の墜落を防ぐための器具であり、物品の落下対策とは関係ありません。飛来については第538条で飛来防止の設備と保護具の使用が定められています。', choiceNotes:['正しい記述。物体の飛来のおそれがあるときは、飛来防止の設備を設け、労働者に保護具を使用させる措置が必要(労働安全衛生規則第538条)。','正しい記述。物体の落下のおそれがあるときは、防網の設備を設け、立入区域を設定する措置が必要(労働安全衛生規則第537条)。','正しい記述。高さ2m以上の作業床の開口部等には囲い、手すり、覆い等を設けなければならない。','誤り。物体の落下防止措置として労働安全衛生規則第537条が定めるのは防網の設備と立入区域の設定であり、要求性能墜落制止用器具は作業者自身の墜落防止用の器具であって物体落下対策ではない。'] },
  { id:'q26', group:'施工管理', category:'労働安全衛生法令(墜落防止)', chapter:'2章', stars:5, question:'脚立を用いた作業に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['脚と水平面との角度が80度のものを使用した','丈夫な構造で、著しい損傷や腐食が認められないものを使用した','折りたたみ式のものは、脚と水平面との角度を確実に保つための金具等を備えたものを使用した','踏み面は、作業を安全に行うため必要な面積を有するものを使用した'], answer:0, explanation:'労働安全衛生規則第528条により、脚立の脚と水平面との角度は75度以下でなければなりません。80度では基準を超えており使用できません。その他、丈夫な構造であること、著しい損傷・腐食がないこと、折りたたみ式は角度を保つ金具等を備えること、踏み面は必要な面積を有することが要件です。', choiceNotes:['誤り。労働安全衛生規則第528条により、脚立の脚と水平面との角度は75度以下でなければならず、80度は基準を超え不適合である。','正しい記述。脚立は丈夫な構造で、著しい損傷や腐食が認められないものを使用しなければならない。','正しい記述。折りたたみ式のものは、脚と水平面との角度を確実に保つための金具等を備えたものを使用しなければならない。','正しい記述。踏み面は作業を安全に行うために必要な面積を有するものを使用しなければならない。'] },
  { id:'q27', group:'施工管理', category:'労働安全衛生法令(墜落防止)', chapter:'2章', stars:5, question:'移動はしごに関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['丈夫な構造のものを使用する','幅は25cm以上のものを使用する','すべり止め装置の取り付け等、転位を防止するために必要な措置を講じる','材料は、著しい損傷や腐食等がないものを使用する'], answer:1, explanation:'労働安全衛生規則第527条により、移動はしごの幅は30cm以上でなければなりません。25cmでは基準未満です。幅が狭いほど足を踏み外す懸念があり、立てた際の安定性も悪くなります。なお、移動はしごは脚立と異なり自立しない構造のため、角度に関する規定はなく、代わりに転位防止措置(すべり止め装置等)が求められます。', choiceNotes:['正しい記述。移動はしごは丈夫な構造のものを使用しなければならない。','誤り。労働安全衛生規則第527条により、移動はしごの幅は30cm以上でなければならず、25cmでは基準未満である。','正しい記述。すべり止め装置の取り付け等、はしごの転位を防止するために必要な措置を講じなければならない。','正しい記述。移動はしごの材料は、著しい損傷や腐食等がないものを使用しなければならない。'] },
  { id:'q28', group:'施工管理', category:'労働安全衛生法令(墜落防止)', chapter:'2章', stars:5, question:'スレート屋根等における踏み抜きの危険防止に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['幅25cm以上の歩み板を設ければよい','防網を張れば、歩み板の幅に規定はない','幅30cm以上の歩み板を設け、防網を張る等の措置を講じる','footholdの設置は高さ3m以上の屋根に限って義務付けられている'], answer:2, explanation:'労働安全衛生規則第524条により、スレート等の材料でふかれた屋根の上で作業を行う場合、踏み抜きによる危険を防止するため、幅30cm以上の歩み板を設け、防網を張る等の措置が必要です。歩み板の幅は法令上30cm以上と定められており、25cmでは不足します。', choiceNotes:['誤り。労働安全衛生規則第524条の基準は幅30cm以上であり、25cmでは不足する。','誤り。防網を張った場合でも歩み板の幅を30cm以上とする規定は省略されず、幅の規定がなくなるわけではない。','正しい。労働安全衛生規則第524条により、幅30cm以上の歩み板を設け、防網を張る等の踏み抜き防止措置を講じなければならない。','誤り。歩み板・防網等の措置は屋根の高さにかかわらず、スレート等でふかれた屋根で作業する場合に適用される。'] },
  { id:'q29', group:'施工管理', category:'労働安全衛生法令(墜落防止)', chapter:'2章', stars:5, question:'作業場所における昇降設備の設置に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['高さまたは深さが1.5mを超える箇所で作業を行うときは、作業者が安全に昇降するための設備を設けなければならない','高さまたは深さが1.0mを超える箇所で作業を行うときは、昇降設備を設けなければならない','高さまたは深さが2.0mを超える箇所で作業を行うときに限り、昇降設備が必要となる','昇降設備の設置義務は高さのみに適用され、深さについては規定がない'], answer:0, explanation:'労働安全衛生規則第526条により、高さ又は深さが1.5mを超える箇所で作業を行うときは、当該作業に従事する労働者が安全に昇降するための設備等を設けなければなりません。高低差1.5m以下の場合は法令上の義務はありません。「2m」は高所作業(作業床の囲い等)の基準であり、混同しないよう注意が必要です。', choiceNotes:['正しい。労働安全衛生規則第526条により、高さまたは深さが1.5mを超える箇所での作業には安全な昇降設備を設けなければならない。','誤り。基準は1.0mではなく1.5mを超える箇所である。','誤り。2.0mは高所作業(作業床の囲い等)に関する基準であり、昇降設備の基準である1.5mと混同している。','誤り。昇降設備の設置義務は高さだけでなく深さにも適用される(高さまたは深さが1.5mを超える箇所)。'] },
  { id:'q30', group:'施工管理', category:'労働安全衛生法令(感電事故防止)', chapter:'2章', stars:5, question:'架空電線の充電電路に近接する場所で工作物の建設作業を行う場合の感電防止措置として、「労働安全衛生法令」上、誤っているものはどれか。', options:['当該充電電路を移設する','感電の危険を防止するための囲いを設ける','労働者に静電気帯電防止用作業靴を着用させる','当該充電電路に絶縁用防護具を装着する'], answer:2, explanation:'労働安全衛生規則第349条に定める措置は、①充電電路の移設、②感電防止の囲いの設置、③絶縁用防護具の装着、④これらが著しく困難なときは監視人を置き作業を監視させること、の4つです。静電気帯電防止用作業靴は、人体に帯電した静電気による弱電部品の破損等を防ぐためのものであり、感電防止対策にはなりません。', choiceNotes:['正しい措置。労働安全衛生規則第349条により、充電電路を移設することは感電防止措置の一つである。','正しい措置。感電の危険を防止するための囲いを設けることは同条に定める措置の一つである。','誤り。静電気帯電防止用作業靴は人体の静電気帯電による電子部品破損等を防ぐためのものであり、架空電線への感電防止措置には該当しない。','正しい措置。当該充電電路に絶縁用防護具を装着することは同条に定める措置の一つである。'] },
  { id:'q31', group:'施工管理', category:'労働安全衛生法令(感電事故防止)', chapter:'2章', stars:5, question:'電気による危険の防止に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['停電作業終了後の通電にあたっては、感電の危険がないことおよび短絡接地器具を取りはずしたことを確認してから行う','分電盤の電路を開路して点検作業を行う場合、開路した開閉器に「通電禁止」の表示をする','電気機械器具の充電部分に設けた囲いは、毎月1回以上その損傷の有無を点検する','架空電線の充電電路に近接する場所での建物修理作業では、作業場所に注意看板を設置すれば感電防止措置として足りる'], answer:3, explanation:'注意看板の設置だけでは感電防止措置として不十分です。気付かない間に接触してしまう可能性が高いため、充電電路の移設、囲いの設置、絶縁用防護具の装着等の措置が必要です。なお、電気機械器具の囲い・絶縁覆いの点検頻度は労働安全衛生規則第353条により毎月1回以上と定められています(1年に1回ではありません)。', choiceNotes:['正しい記述。停電作業終了後の通電にあたっては、感電の危険がないことおよび短絡接地器具を取りはずしたことを確認してから行う。','正しい記述。分電盤の電路を開路して点検作業を行う場合、開路した開閉器には「通電禁止」等の表示をしなければならない。','正しい記述。電気機械器具の充電部分に設けた囲い・絶縁覆いは、労働安全衛生規則第353条により毎月1回以上その損傷の有無を点検する。','誤り。架空電線に近接する場所での作業では、注意看板の設置のみでは不十分であり、充電電路の移設・囲いの設置・絶縁用防護具の装着等の措置が必要である。'] },
  { id:'q32', group:'施工管理', category:'労働安全衛生法令(足場)', chapter:'2章', stars:5, question:'高さ2m以上の足場(一側足場およびつり足場を除く)の作業床に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['床材間の隙間を3cm以下とする','作業床の幅を40cm以上とする','床材と建地との隙間を12cm以下とする','床材は2つ以上の支持物に取り付ける'], answer:2, explanation:'労働安全衛生規則第563条により、床材と建地との隙間は「12cm未満」としなければなりません。「12cm以下」では12cm丁度が許容されることになりNGです。その他の基準は、作業床の幅40cm以上、床材間の隙間3cm以下、床材は2以上の支持物に取り付ける、であり正しい記述です。数値と「以下/未満」の区別まで正確に覚えましょう。', choiceNotes:['正しい基準。床材間の隙間は3cm以下としなければならない。','正しい基準。作業床の幅は40cm以上としなければならない。','誤り。床材と建地との隙間は「12cm未満」としなければならず、「12cm以下」では12cm丁度を許容してしまい基準を満たさない。','正しい基準。床材の脱落・作業床の崩落を防ぐため、床材は2つ以上の支持物に取り付けなければならない。'] },
  { id:'q33', group:'施工管理', category:'労働安全衛生法令(足場)', chapter:'2章', stars:5, question:'高さ2m以上の足場(一側足場およびつり足場を除く)に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['作業床の幅は30cm以上とする','床材は1つの支持物に取り付ければよい','床材間の隙間は5cm以下とする','作業床の幅は40cm以上とし、床材間の隙間は3cm以下とする'], answer:3, explanation:'足場の作業床の基準は、幅40cm以上、床材間の隙間3cm以下、床材と建地との隙間12cm未満です。幅30cmでは不足し、床材間の隙間が5cmでは靴の先端が挟まったり工具が落下するおそれがあります。また床材の支持物は2つ以上必要で、1つでは不安定となり床材崩落の原因になります。', choiceNotes:['誤り。作業床の幅は30cmではなく40cm以上としなければならない。','誤り。床材は1つではなく、2つ以上の支持物に取り付けなければ崩落のおそれがある。','誤り。床材間の隙間は5cmではなく3cm以下としなければならない。','正しい。作業床の幅は40cm以上、床材間の隙間は3cm以下とする基準が労働安全衛生規則第563条に定められている。'] },
  { id:'q34', group:'施工管理', category:'労働安全衛生法令(移動式足場)', chapter:'2章', stars:5, question:'移動式足場(ローリングタワー)の使用に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['傾斜が著しい場所で使用するときは、ジャッキ等を利用して作業床の水平を保持する','監視者を配置すれば、労働者を乗せたまま移動式足場を移動させることができる','わく組構造部の外側空間を昇降路とする構造では、同一面より同時に2名以上の者が昇降しないようにする','手すりや中さんを作業のため取り外したときは、必要がなくなった後直ちに元の状態に戻す'], answer:1, explanation:'移動式足場は不安定な構造であるため、人を乗せた状態での移動は禁止されています。監視者や作業責任者の監視の有無は関係ありません。傾斜が著しい場所ではジャッキ等で作業床の水平を保持し、外側空間を昇降路とする構造では同一面から同時に2名以上昇降させないこと等が「移動式足場の安全基準に関する技術上の指針」に定められています。', choiceNotes:['正しい記述。傾斜が著しい場所で移動式足場を使用するときは、ジャッキ等を利用して作業床の水平を保持する必要がある。','誤り。移動式足場は構造上不安定であり、労働者を乗せたまま移動させることは監視者を配置していても禁止されている。','正しい記述。わく組構造部の外側空間を昇降路とする構造では、同一面から同時に2名以上が昇降しないようにする必要がある。','正しい記述。作業のため取り外した手すりや中さんは、必要がなくなった後直ちに元の状態に戻さなければならない。'] },
  { id:'q35', group:'施工管理', category:'労働安全衛生法令(移動式足場)', chapter:'2章', stars:5, question:'移動式足場に関する記述として、適当でないものはどれか。', options:['脚輪のブレーキは、移動中を除き、常に作動させておく','移動式足場の上では、脚立や移動はしごを使用しない','移動式足場の高さが2m未満であれば、安全基準に関する技術上の指針を遵守する必要はない','凹凸が著しい場所で使用するときは、ジャッキ等を用いて作業床の水平を保持する'], answer:2, explanation:'移動式足場には固定式足場のような高さによる制約の適用条件がなく、高さが2m未満の場合でも「移動式足場の安全基準に関する技術上の指針」を遵守する必要があります。また、移動式足場の上での脚立・移動はしごの使用は、確実に固定したとしても禁止です。脚輪のブレーキは移動中を除き常に作動させておかなければなりません。', choiceNotes:['正しい記述。脚輪のブレーキは移動中を除き、常に作動させておかなければならない。','正しい記述。移動式足場の上では、たとえ固定しても脚立や移動はしごを使用してはならない。','誤り。移動式足場には固定式足場のような高さの適用除外条件はなく、高さ2m未満であっても「移動式足場の安全基準に関する技術上の指針」を遵守する必要がある。','正しい記述。凹凸が著しい場所で使用するときは、ジャッキ等を用いて作業床の水平を保持する必要がある。'] },
  { id:'q36', group:'施工管理', category:'労働安全衛生法令(届出)', chapter:'2章', stars:5, question:'工事開始前に労働基準監督署長に対して計画の届出が必要なものとして、「労働安全衛生法令」上、正しいものはどれか。', options:['高さ25mの建築物を建設する場合','掘削の深さが10m以上となる地山の掘削を行う場合','組立から解体までの期間が50日間で、つり足場を設置する場合','掘削の深さが5m以上となる地山の掘削を行う場合'], answer:1, explanation:'計画の届出が必要なのは、高さ31mを超える建築物・工作物(橋梁を除く)の建設等、および掘削の高さまたは深さが10m以上である地山の掘削等です。高さ25mの建築物は31m以下のため対象外、つり足場は設置期間60日以上の場合に届出が必要となるため50日間では対象外です。', choiceNotes:['誤り。届出が必要な建築物・工作物の高さの基準は31mを超えるものであり、高さ25mは対象外である。','正しい。掘削の高さまたは深さが10m以上となる地山の掘削は、計画の届出が必要な工事に該当する。','誤り。つり足場の届出基準は設置期間60日以上であり、組立から解体まで50日間では対象外である。','誤り。届出が必要な地山の掘削の基準は深さ10m以上であり、5m以上では対象とならない。'] },
  { id:'q37', group:'施工管理', category:'労働安全衛生法令(届出)', chapter:'2章', stars:5, question:'足場・架設通路の設置に係る機械等設置届に関する記述として、「労働安全衛生法令」上、届出が必要なものはどれか。', options:['組立から解体までの期間が50日間で、高さ10m、長さ10mの架設通路を設置する場合','組立から解体までの期間が59日間で、つり足場を設置する場合','組立から解体までの期間が70日間で、高さ8mの構造の足場を設置する場合','組立から解体までの期間が80日間で、高さ20m、長さ10mの架設通路を設置する場合'], answer:3, explanation:'足場・架設通路の届出はまず設置期間に着目します。59日以下であれば一律に届出不要です。60日以上の場合、つり足場・張出し足場は条件によらず全て届出対象、一般的な足場は高さ10m以上のもの、架設通路は高さと長さが共に10m以上のものが対象です。設置期間80日で高さ20m・長さ10mの架設通路は要件を満たすため届出が必要です。', choiceNotes:['誤り。架設通路は高さ・長さとも10m以上が届出対象の要件だが、設置期間が59日以下(60日未満)であるため、要件を満たしても一律に届出不要となる。','誤り。つり足場は設置期間60日以上であれば条件によらず届出対象となるが、59日間では設置期間の条件を満たさず届出不要である。','誤り。一般的な足場は高さ10m以上が届出対象要件だが、高さ8mはこれを満たさないため届出不要である。','正しい。設置期間80日(60日以上)、高さ20m・長さ10m(いずれも10m以上)の架設通路は届出要件をすべて満たすため、届出が必要である。'] },
  { id:'q38', group:'施工管理', category:'労働安全衛生法令(移動式クレーン)', chapter:'2章', stars:5, question:'移動式クレーンを用いて作業を行うとき、事業者があらかじめ定めるべき事項として、「労働安全衛生法令」上、正しいものの組み合わせはどれか。', options:['作業の方法、転倒を防止するための方法、労働者の配置および指揮の系統','作業の方法、衝撃を軽減するための方法、労働者の作業時間','作業の方法、転倒を防止するための方法、労働者の作業時間','作業の方法、衝撃を軽減するための方法、労働者の配置および指揮の系統'], answer:0, explanation:'事業者は移動式クレーンを用いる作業の前に、作業場所の広さ、地形・地質の状態、荷の重量、使用するクレーンの種類・能力等を考慮して、①作業の方法、②転倒を防止するための方法、③作業に係る労働者の配置および指揮の系統、を定めなければなりません。指揮の系統を1本化することで、複数人の合図による操作者の判断ミスを防ぎます。', choiceNotes:['正しい。事業者があらかじめ定めるべき事項は、作業の方法、転倒を防止するための方法、労働者の配置および指揮の系統の3点である。','誤り。「衝撃を軽減するための方法」や「労働者の作業時間」は移動式クレーン作業であらかじめ定めるべき事項として規定されていない。','誤り。「労働者の作業時間」は規定事項ではなく、転倒防止の方法と労働者の配置・指揮の系統を定める必要がある。','誤り。「衝撃を軽減するための方法」は規定事項ではなく、正しくは転倒を防止するための方法である。'] },
  { id:'q39', group:'施工管理', category:'労働安全衛生法令(移動式クレーン)', chapter:'2章', stars:5, question:'移動式クレーンの安全確保に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['荷を吊り上げるときは、外れ止め装置を使用しなければならない','定格荷重をこえる荷重をかけて使用してはならない','吊り上げ荷重が1t以上5t未満の移動式クレーンの運転業務(道路上の走行を除く)は、特別教育を修了した者を就かせることができる','ハッカーを用いて玉掛けをした荷が吊り上げられているときは、荷の下に労働者を立ち入らせてはならない'], answer:2, explanation:'吊り上げ荷重1t以上5t未満の移動式クレーンの運転には、小型移動式クレーン運転技能講習の修了が必要です。特別教育の修了のみで運転できるのは吊り上げ荷重1t未満(0.5t以上)の場合です。資格区分は、0.5t未満は不要、0.5t以上1t未満は特別教育、1t以上5t未満は技能講習、5t以上は免許となります。', choiceNotes:['正しい記述。荷を吊り上げるときは、フックからの荷外れを防ぐ外れ止め装置を使用しなければならない。','正しい記述。移動式クレーンは定格荷重をこえる荷重をかけて使用してはならない。','誤り。吊り上げ荷重1t以上5t未満の移動式クレーンの運転には、特別教育ではなく小型移動式クレーン運転技能講習の修了が必要である。','正しい記述。ハッカーを用いて玉掛けをした荷が吊り上げられているときは、荷の下に労働者を立ち入らせてはならない。'] },
  { id:'q40', group:'施工管理', category:'労働安全衛生法令(特別教育)', chapter:'2章', stars:5, question:'労働者を業務に従事させるにあたり特別教育が必要な業務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['吊り上げ荷重が0.5tの移動式クレーンの運転の業務(道路上を走行させる運転を除く)','高圧の充電電路の点検の業務','作業床の高さが8mの高所作業車の運転の業務(道路上を走行させる運転を除く)','吊り上げ荷重が1tのクレーンの玉掛けの業務'], answer:3, explanation:'玉掛け業務は吊り上げ荷重1tが資格区分の境界であり、1t以上の場合は特別教育ではなく上位の技能講習の修了が必要です。特別教育で足りるのは1t未満の玉掛けです。移動式クレーンの運転は1t未満、高所作業車は作業床の高さ10m未満であれば特別教育で従事でき、高圧・特別高圧の充電電路の敷設・点検等も特別教育の対象業務です。', choiceNotes:['吊り上げ荷重0.5tの移動式クレーンは1t未満であり、運転には特別教育で従事できるため正しい記述である。','高圧の充電電路の点検業務は特別教育の対象業務として法令で定められているため正しい記述である。','作業床高さ8mの高所作業車は境界の10m未満であり、運転には特別教育で従事できるため正しい記述である。','玉掛け業務は吊り上げ荷重1t以上になると特別教育では不足し、技能講習の修了が必要となるため誤り。'] },
  { id:'q41', group:'施工管理', category:'労働安全衛生法令(特別教育)', chapter:'2章', stars:5, question:'特別教育を修了した者を従事させることができる業務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['地下に敷設させる物を収容するためのマンホールの内部における作業に係る業務','作業床の高さが15mの高所作業車の運転の業務(道路上を走行させる運転を除く)','高圧の充電電路の敷設の業務','吊り上げ荷重が0.9tの移動式クレーンの運転の業務(道路上を走行させる運転を除く)'], answer:1, explanation:'高所作業車の運転は作業床の高さ10mが境界であり、10m以上の場合は技能講習の修了が必要です。作業床の高さ15mでは特別教育のみでは従事できません。マンホール内部の作業は酸素欠乏危険作業に該当するため特別教育が必要であり、高圧・特別高圧の充電電路の敷設・点検、吊り上げ荷重1t未満の移動式クレーンの運転は特別教育の対象業務です。', choiceNotes:['マンホール内部作業は酸素欠乏危険場所での作業に該当し、特別教育の対象業務として正しい記述である。','高所作業車の運転は作業床高さ10mが境界であり、15mでは特別教育のみでは従事できず技能講習が必要なため誤り。','高圧の充電電路の敷設業務は特別教育の対象業務として法令で定められているため正しい記述である。','吊り上げ荷重0.9tの移動式クレーンは1t未満であり、運転には特別教育で従事できるため正しい記述である。'] },
  { id:'q42', group:'施工管理', category:'労働安全衛生法令(酸欠危険作業)', chapter:'2章', stars:5, question:'酸素欠乏危険作業に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['酸素欠乏とは、空気中の酸素濃度が21%未満の状態をいう','空気中の酸素濃度の測定は、午前・午後の各1回実施しなければならない','酸素欠乏とは、空気中の酸素濃度が18%未満の状態をいう','マンホール内での光ファイバケーブル敷設作業は、酸素欠乏危険場所における作業に該当しない'], answer:2, explanation:'酸素欠乏は、空気中の酸素濃度が18%未満の状態と定義されています(21%未満ではありません)。酸素濃度の測定はその日の作業を開始する前に実施するよう定められており、午前・午後の各1回ではありません。また、マンホール内での作業は作業内容にかかわらず酸素欠乏危険作業に該当し、作業主任者の選任が必要です。', choiceNotes:['酸素欠乏の定義は酸素濃度18%未満であり、21%未満という基準は誤りである。','酸素濃度の測定はその日の作業開始前に実施すると定められており、午前・午後各1回という規定はないため誤り。','酸素欠乏は空気中の酸素濃度が18%未満の状態と法令上定義されており、正しい記述である。','マンホール内での作業は作業内容にかかわらず酸素欠乏危険作業に該当するため、この記述は誤りである。'] },
  { id:'q43', group:'施工管理', category:'労働安全衛生法令(酸欠危険作業)', chapter:'2章', stars:5, question:'酸素欠乏危険作業における教育・資格に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['作業者本人は、特別教育または技能講習の修了が必要である','酸素欠乏危険作業主任者には、特別の教育を受けた者のうちから選任することができる','技能講習は特別教育の内容を含んでおり、特別教育より上位に位置づけられる','マンホールの内部に降りて行う活動は、酸素欠乏危険作業に該当する'], answer:1, explanation:'酸素欠乏危険作業主任者として選任できるのは、技能講習を修了した者のみです。特別教育だけでは作業主任者にはなれません。作業者本人は特別教育または技能講習の修了で従事できます。暗記必須事項として、酸素欠乏状態は18%未満、酸素濃度測定は作業開始前に実施、作業者本人は特別教育でよい、作業主任者は技能講習が必要、と整理しておきましょう。', choiceNotes:['酸素欠乏危険作業に従事する作業者本人は特別教育または技能講習の修了により従事できるため正しい記述である。','作業主任者に選任できるのは技能講習を修了した者のみであり、特別教育を受けただけでは選任できないため誤り。','技能講習は特別教育より内容が高度で上位に位置づけられ、これは正しい記述である。','マンホール内部に降りて行う作業は酸素欠乏危険作業に該当するため、正しい記述である。'] },
  { id:'q44', group:'施工管理', category:'施工計画(全般)', chapter:'2章', stars:5, question:'施工計画書を作成する上での基本事項に関する記述として、適当でないものはどれか。', options:['施工計画書の作成にあたっては、基本方針を十分に把握し、施工性のほか生産性の向上や環境保全についても検討する','施工計画の作成にあたっては、工事の目的・内容・契約条件、現場条件、全体工法、施工方法といった基本方針を考慮する','現地調査による諸条件のチェックは、施工計画書の提出後に行うことが一般的である','施工計画は、過去の実績や経験を生かすとともに、実績の少ない新工法・新技術についても積極的に採用を検討する'], answer:2, explanation:'現地調査を行って工事に必要な諸条件をチェックすることは、施工計画を立案する中での必須事項であり、施工計画書の提出前に実施しておかなければなりません。また、過去の実績や経験を生かすことに加えて、実績の少ない新工法・新技術にも積極的に関心をもち、必要であれば採用していく姿勢が求められます。', choiceNotes:['施工計画作成では基本方針の把握に加え生産性向上や環境保全も検討すべきであり、正しい記述である。','工事の目的・内容・契約条件や現場条件、全体工法等を考慮して基本方針を検討することは正しい記述である。','現地調査による諸条件の確認は施工計画立案の必須事項であり、計画書提出前に実施すべきであるため、提出後に行うとする本肢は誤り。','実績が少ない新工法・新技術についても積極的に採用を検討する姿勢が求められ、正しい記述である。'] },
  { id:'q45', group:'施工管理', category:'施工計画(全般)', chapter:'2章', stars:5, question:'施工計画立案時の事前調査に関する記述として、適当でないものはどれか。', options:['不可抗力による損害の取り扱いや工事代金の支払条件の確認は、現場条件の調査に該当する','事前調査には、契約条件の確認と現場条件の調査がある','現場条件の調査は、調査項目が多いため、脱落がないように事前にチェックリスト等を作成しておくのがよい','現場条件の調査の精度を高めるには、複数の人で調査したり調査回数を重ねる等により、個人的偶発的な要因による錯誤や調査漏れを取り除く'], answer:0, explanation:'不可抗力による損害の取り扱いや工事代金の支払条件の確認は、契約条件の確認に該当するものであり、現場条件の調査ではありません。なお、現場条件の調査で脱落を防ぐために作成するのはチェックリストであり、特性要因図は品質管理の場面で用いる図表なので混同しないよう注意しましょう。', choiceNotes:['不可抗力による損害の取り扱いや支払条件の確認は契約条件の確認事項であり、現場条件の調査ではないため誤り。','事前調査が契約条件の確認と現場条件の調査に分かれるとする記述は正しい。','現場条件の調査は項目が多いためチェックリストを事前に作成しておくべきであり、正しい記述である。','複数人での調査や調査回数を重ねることで個人的・偶発的な錯誤や漏れを防ぐことは正しい記述である。'] },
  { id:'q46', group:'施工管理', category:'施工計画(留意事項)', chapter:'2章', stars:5, question:'施工計画の作成にあたっての留意事項に関する記述として、適当でないものはどれか。', options:['個人の考えや技術水準だけで計画せず、企業内の関係組織を活用して全社的な技術水準で検討する','契約書、発注図面および工事仕様書に基づいて施工計画を作成すれば、現地調査を行わなくても現場条件や発注者の意向を十分反映できる','品質、工程、原価は相互に関連するため、これらの関係を考慮しながら最善の施工計画を立てる','施工計画は1つの計画のみでなく、いくつかの代替案を作り比較検討のうえ最適案を採用する'], answer:1, explanation:'施工計画の作成にあたって現地調査は必須です。契約書や発注図面等の書類だけでは、現場条件や発注者の意向を高い水準で反映することはできません。また、複数の代替案(安全・品質・工程・環境・原価の5つの視点で評価)を作成して総合的に比較検討し、最適案を採用することが望ましいとされています。', choiceNotes:['個人の考えに頼らず企業内の関係組織を活用して全社的な技術水準で検討することは正しい記述である。','契約書・図面・仕様書のみでは現場条件や発注者の意向を十分反映できず、現地調査は必須であるため誤り。','品質・工程・原価は相互に関連するため、これらの関係を考慮して最善の計画を立てるとする記述は正しい。','複数の代替案を作成し比較検討のうえ最適案を採用することは施工計画作成の望ましい進め方であり、正しい記述である。'] },
  { id:'q47', group:'施工管理', category:'施工計画(留意事項)', chapter:'2章', stars:5, question:'施工計画の作成にあたっての考え方として、適当でないものはどれか。', options:['発注者の要求品質の確保を意識しつつ、何より安全を最優先に考えることが大原則である','工期・環境・経済性等のバランスを考慮しながら全体を検討する','発注者から示された工程が常に最適とは限らないため、経済性や安全性、品質の確保も考慮しながら検討する','請負者の利益を最優先にした計画を策定することが、施工計画の最も大切な目的である'], answer:3, explanation:'請負者の利益を確保することも大切な目的の1つですが、それを最優先にして他の要素が疎かになるのは好ましくありません。安全を最優先に考えることが大原則であり、そのうえで品質、工程、環境、原価等の広い視野を持って計画を立案します。発注者から示された工程も常に最適とは限らず、受注者側が専門家としてアドバイスする姿勢が望まれます。', choiceNotes:['発注者の要求品質を確保しつつ安全を最優先に考えることは施工計画の大原則であり、正しい記述である。','工期・環境・経済性等のバランスを考慮しながら全体を検討することは正しい記述である。','発注者から示された工程が常に最適とは限らないため、受注者側からの検討・提案が必要であり、正しい記述である。','請負者の利益を最優先にすると安全や品質等が疎かになる恐れがあり、施工計画の最も大切な目的とはいえないため誤り。'] },
  { id:'q48', group:'施工管理', category:'施工計画(計画書)', chapter:'2章', stars:5, question:'新築工事の着手に先立ち作成する施工計画書に記載するものとして、不適当なものはどれか。', options:['総合工程表','機器承諾図','官公庁届出書類一覧','現場施工体制表'], answer:1, explanation:'施工計画書は着工前に工事の総合的な道筋を俯瞰するために作成するもので、着手後に判明する詳細な設計レベルの仕様や数値は含めないのが一般的です。機器承諾図は、設計を進める中で具体的な仕様が決まった後に作成される施工図に含まれるものであり、施工計画書には含まれません。総合工程表、官公庁届出書類一覧表、現場施工体制表などは施工計画書に記載する事項です。', choiceNotes:['総合工程表は工事全体の道筋を示すもので施工計画書に記載する事項であり、正しい記述である。','機器承諾図は設計が進み具体的仕様が決定した後に作成される施工図の一部であり、着工前の施工計画書には含まれないため誤り。','官公庁届出書類一覧は着工前に整理しておくべき事項であり、施工計画書に記載する事項として正しい記述である。','現場施工体制表は着工前の体制整備として施工計画書に記載する事項であり、正しい記述である。'] },
  { id:'q49', group:'施工管理', category:'施工計画(計画書)', chapter:'2章', stars:5, question:'施工計画書の作成に関する記述として、不適当なものはどれか。', options:['労務計画では、合理的かつ経済的に管理するために労務工程表を作成する','搬入計画書は、建築業者や関連業者と打ち合わせて、工期に支障のないように作成する','安全衛生管理計画では、安全管理体制の確立のために施工体制台帳を作成する','施工要領書は、品質の維持向上を図り安全かつ経済的施工方法を考慮して作成する'], answer:2, explanation:'施工体制台帳は、建設工事の適正な施工を確保し下請負人を手抜き工事から保護することを目的として建設業法(第24条の7)に基づき作成するものであり、安全衛生管理計画とは関連性がありません。安全衛生管理計画で作成する書類は、作業者名簿、安全衛生管理組織表、官公庁届出書類等であり、労働災害の防止と労働環境の向上を目的とします。', choiceNotes:['労務計画で労務工程表を作成し合理的・経済的に管理することは正しい記述である。','搬入計画書を関連業者と打ち合わせて工期に支障のないよう作成することは正しい記述である。','施工体制台帳は建設業法に基づき下請保護等を目的として作成するものであり、安全衛生管理計画の書類ではないため誤り。','施工要領書は品質維持向上と安全かつ経済的な施工方法を考慮して作成するものであり、正しい記述である。'] },
  { id:'q50', group:'施工管理', category:'施工計画(施工体制台帳)', chapter:'2章', stars:5, question:'施工体制台帳の記載に関する記述として、適当でないものはどれか。', options:['「健康保険等の加入状況」は、健康保険、厚生年金保険および雇用保険の加入状況について記載する','下請負人に関する事項も、必ず作成建設業者が自ら記載しなければならない','記載事項に変更があったときは、遅滞なく変更年月日を付記して、既に記載されている事項に加えて変更後の事項を記載する','作成建設業者の建設業の種類は、請け負った建設工事に係る建設業の種類に関わることなく、その全てについて特定か一般かの別を明示して記載する'], answer:1, explanation:'下請が階層的になっている場合、元請と直接の契約がない二次下請(孫請)より下の情報は元請が把握しにくいため、再下請負通知書を提出してもらい各社が協力して記載する場合もあり得ます。元請負人が全情報を自ら記載するばかりではありません。なお、健康保険等の加入状況の記載対象は健康保険・厚生年金保険・雇用保険の3つであり、労災保険ではない点も頻出です。', choiceNotes:['健康保険等の加入状況は健康保険・厚生年金保険・雇用保険の加入状況を記載する事項であり、正しい記述である。','下請が階層的な場合、末端の情報は元請が直接把握しにくく再下請負通知書等により各社協力して記載することもあり、必ず自ら記載するとは限らないため誤り。','記載事項の変更時は変更年月日を付記し、既存事項に加えて変更後の事項を記載することは正しい記述である。','作成建設業者の建設業の種類は請負工事に関わらず全ての種類について特定・一般の別を明示するとされ、正しい記述である。'] },
  { id:'q51', group:'施工管理', category:'施工計画(施工体制台帳)', chapter:'2章', stars:5, question:'民間工事における施工体制台帳および施工体系図に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['施工体制台帳の備置きおよび施工体系図の掲示は、建設工事の目的物の引渡しをするまで行う','施工体制台帳は、工事現場ごとに備え置かなければならない','施工体系図は、当該工事現場の見やすい場所に掲げなければならない','特定建設業者が発注者から直接建設工事を請け負った場合は、下請に発注しない場合であっても施工体制台帳および施工体系図を作成しなければならない'], answer:3, explanation:'施工体制台帳・施工体系図の作成義務が生じるのは、下請契約を行う場合に限られます。全ての作業を自社内のみで完結する場合には、受注金額の大小によらず作成義務はありません。なお、施工体系図の掲示場所は、公共工事では工事関係者が見やすい場所と公衆が見やすい場所、民間工事では工事関係者が見やすい場所とされています。', choiceNotes:['施工体制台帳の備置きと施工体系図の掲示は目的物引渡しまで行うとされ、正しい記述である。','施工体制台帳は工事現場ごとに備え置く必要があり、正しい記述である。','施工体系図は当該工事現場の見やすい場所に掲げる必要があり、正しい記述である。','台帳・体系図の作成義務は下請契約を行う場合に生じ、下請に発注しない場合には作成義務はないため誤り。'] },
  { id:'q52', group:'施工管理', category:'施工計画(届出書等)', chapter:'2章', stars:5, question:'建設工事における法令に基づく申請書等とその提出先の組み合わせとして、適当でないものはどれか。', options:['特定建設作業実施届出書 : 市町村長','道路使用許可申請書 : 道路管理者','機械等設置届 : 所轄労働基準監督署長','航空障害灯の設置の届出 : 地方航空局長'], answer:1, explanation:'道路使用許可申請書の提出先は所轄警察署長です。道路管理者に提出するのは道路占用許可申請書と特殊車両通行許可申請書です。暗記必須の5種は、道路使用許可申請書=所轄警察署長、道路占用許可申請書=道路管理者、特定建設作業実施届出書=市町村長、機械等設置届=所轄労働基準監督署長、航空障害灯の設置届出=地方航空局長です。', choiceNotes:['特定建設作業実施届出書の提出先は市町村長であり、正しい組み合わせである。','道路使用許可申請書の提出先は所轄警察署長であり、道路管理者ではないため誤りの組み合わせである。','機械等設置届の提出先は所轄労働基準監督署長であり、正しい組み合わせである。','航空障害灯の設置の届出の提出先は地方航空局長であり、正しい組み合わせである。'] },
  { id:'q53', group:'施工管理', category:'施工計画(届出書等)', chapter:'2章', stars:5, question:'法令に基づく申請書・届出書等の提出先に関する記述として、適当でないものはどれか。', options:['自家用電気工作物の使用開始後、自家用電気工作物使用開始届出書を都道府県知事に提出する','限度超過車両(特殊車両)による運搬のため、特殊車両通行許可申請書を道路管理者に提出して許可を受ける','国定公園の特別地域内で工事用の木竹を伐採するため、伐採許可申請書を都道府県知事に提出する','騒音規制法の指定地域内で特定建設作業を伴う建設工事を施工するため、特定建設作業実施届出書を市町村長に届け出る'], answer:0, explanation:'自家用電気工作物使用開始届出書の提出先は経済産業大臣であり、都道府県知事ではありません。特殊車両通行許可申請書は道路管理者(警察署長ではない)、特別地域内木竹の伐採許可申請書は都道府県知事、特定建設作業実施届出書は市町村長が正しい提出先です。書類の種類だけでなく提出先も合わせて覚えておきましょう。', choiceNotes:['自家用電気工作物使用開始届出書の提出先は経済産業大臣であり、都道府県知事とする本肢は誤りである。','特殊車両通行許可申請書の提出先は道路管理者であり、正しい記述である。','国定公園特別地域内での木竹伐採許可申請書の提出先は都道府県知事であり、正しい記述である。','特定建設作業実施届出書の提出先は市町村長であり、正しい記述である。'] },
  { id:'q54', group:'有線・線路施工', category:'線路施工(低圧配線)', chapter:'2章', stars:5, question:'低圧ケーブルの屋内配線に関する記述として、適当でないものはどれか。', options:['はしご形ケーブルラックに配線する場合、ケーブルは整然と並べ、水平部では5m以下の間隔ごとに固定する','二重床内配線において、ころがし配線として弱電流電線と接触するおそれがある場合は、セパレータにより接触しないように処置する','低圧耐火ケーブル(単心以外)を配線する場合は、ケーブルの曲げ半径(内側半径)を仕上がり外径の6倍以上として敷設する','平形保護層配線において、電力用フラットケーブルとフラットケーブル状の弱電流電線を平行して敷設する場合は、離隔距離を0.1m以上とする'], answer:0, explanation:'ケーブルラックに電線類を配線する場合、ラックの子桁への捕縛の間隔は水平部では3m以下、垂直部では1.5m以下とします。5m以下では基準を超えています。この数値はケーブルラック本体の固定間隔とは異なるため注意が必要です。電源ケーブルの曲げ半径は仕上がり外径の6倍以上、フラットケーブル同士の平行敷設は0.1m以上の離隔が適当です。', choiceNotes:['ケーブルラックへの配線ではケーブルの捕縛間隔は水平部で3m以下が基準であり、5m以下とする本肢は基準を超えており誤り。','二重床内ころがし配線で弱電流電線と接触の恐れがある場合はセパレータで離隔する処置は正しい記述である。','低圧耐火ケーブル(単心以外)の曲げ半径を仕上がり外径の6倍以上とすることは正しい記述である。','電力用フラットケーブルと弱電流電線を平行敷設する際の離隔距離0.1m以上は正しい記述である。'] },
  { id:'q55', group:'有線・線路施工', category:'線路施工(低圧配線)', chapter:'2章', stars:5, question:'低圧屋内配線の接地工事および絶縁抵抗に関する記述として、適当なものはどれか。', options:['使用電圧415Vの配管にはD種接地工事を施す','400V回路の低圧電路の絶縁抵抗値は、0.2MΩ以上であればよい','通信線路の絶縁抵抗は、直流100Vで測定して0.4MΩ以上が要求される','使用電圧が300Vを超える低圧配線にはC種接地工事を施し、その電路の絶縁抵抗値は0.4MΩ以上とする'], answer:3, explanation:'低圧で用いる接地工事は300Vを境に区分され、300V超はC種、300V以下はD種です。使用電圧415VはC種接地工事が必要で、D種では不適当です。また、対地電圧もしくは線間電圧が300Vを超える低圧電路の絶縁抵抗は0.4MΩ以上が求められます(電気設備の技術基準)。なお通信線路の絶縁抵抗は直流100Vで測定して1MΩ以上(有線電気通信設備令)であり、電路とは基準が異なります。', choiceNotes:['接地工事は300Vを境にC種とD種に区分され、使用電圧415VはC種が必要でありD種とする本肢は誤り。','対地電圧300Vを超える低圧電路の絶縁抵抗値は0.4MΩ以上が必要であり、0.2MΩ以上とする本肢は基準に満たず誤り。','通信線路の絶縁抵抗は有線電気通信設備令により直流100Vで測定して1MΩ以上とされ、0.4MΩ以上とする本肢は誤り。','使用電圧300Vを超える低圧配線にはC種接地工事を施し、絶縁抵抗値0.4MΩ以上とすることは電気設備技術基準に合致し正しい記述である。'] },
  { id:'q56', group:'有線・線路施工', category:'線路施工(メタル系)', chapter:'2章', stars:5, question:'通信用メタルケーブルの屋内配線に関する記述として、適当でないものはどれか。', options:['管内配線において、通線直前に管内を清掃し、ケーブルを破損しないように通線する','床上配線では、ワイヤープロテクタを使用して配線し、ケーブルを引出す箇所では被覆を損傷しないように保護する','ころがし配線において、既設低圧ケーブルの上に通信用メタルケーブルを直接乗せて交差させる','ケーブルラック配線において、垂直に敷設する場合はケーブルをケーブルラックの子桁に捕縛する'], answer:2, explanation:'天井裏等でころがし配線をする場合、低圧ケーブルと通信用ケーブルは離隔しなければならず、直接乗せて交差させることは禁止です。接触や積み重ねを行うと、電磁誘導などによりノイズを拾う原因にもなります。なお、垂直敷設時の捕縛では、ケーブルが複数あるときは捕縛の箇所を分散して、特定の子桁に重量が集中しないように施工します。', choiceNotes:['管内配線で通線前に管内を清掃しケーブルを破損しないよう通線することは正しい記述である。','床上配線でワイヤープロテクタを使用し引出し箇所で被覆損傷を防ぐことは正しい記述である。','ころがし配線で低圧ケーブルと通信用ケーブルを直接乗せて交差させると誘導ノイズ等の原因となるため離隔が必要であり、直接乗せるのは誤り。','垂直敷設のケーブルラック配線でケーブルを子桁に捕縛することは正しい記述である。'] },
  { id:'q57', group:'有線・線路施工', category:'線路施工(メタル系)', chapter:'2章', stars:5, question:'通信用メタルケーブルの敷設に関する記述として、適当なものはどれか。', options:['造営材に直接敷設するケーブル工事では、曲げ半径をケーブル外径の2倍以下とする','垂直に敷設する管路内のケーブルは、プルボックス内で支持部材に緊縛し、6m以下の間隔で支持する','ケーブルラック配線で電力用ケーブルと共に敷設する場合は、電力用ケーブルに積み重ねて整然と並べて敷設する','垂直配管内のケーブルは、プルボックス内の他の電力用ケーブルを支持物として緊縛する'], answer:1, explanation:'垂直配管内に敷設するケーブルは、プルボックス内で支持部材に緊縛し、支持間隔はケーブルの場合6m以下とします(プルボックスも6m以下で配置)。周辺の他のケーブル類に緊縛してはいけません。造営材に直接敷設する場合の曲げ半径はケーブルの種類によって外径の4~10倍以上とし、2倍以下に曲げると内部構造を壊すおそれがあります。電力用と通信用のケーブルは離隔が必要で、積み重ねは不適当です。', choiceNotes:['造営材直接敷設のケーブルの曲げ半径は外径の4~10倍以上とすべきで、2倍以下は内部構造を損傷するため誤り。','垂直配管内のケーブルはプルボックス内で支持部材に緊縛し6m以下の間隔で支持することは正しい記述である。','電力用ケーブルと通信用ケーブルは離隔が必要であり、積み重ねて敷設するのは不適当なため誤り。','垂直配管内のケーブルは専用の支持部材に緊縛すべきで、他の電力用ケーブルを支持物として緊縛するのは不適当なため誤り。'] },
  { id:'q58', group:'有線・線路施工', category:'線路施工(UTPケーブル)', chapter:'2章', stars:5, question:'UTPケーブルの施工に関する記述として、適当でないものはどれか。', options:['水平配線の配線後の許容曲げ半径は、ケーブル外径の4倍とした','水平配線の長さは、パッチコード等も含め100m以内とした','ケーブルの成端作業時、対の撚り戻し長は最大とした','ケーブルに過度の外圧が加わらないように固定した'], answer:2, explanation:'ツイストペアケーブルを成端する場合の撚り戻し長は、最小となるように努めなければなりません(Cat5eで12.7mm、Cat6で6.4mmが限度)。撚り戻しが長過ぎると漏話減衰量を増大させてしまいます。フロア配線盤から通信アウトレットまでの水平配線長は、パッチコード等も含めて最長100mであり、150mは超過となります。', choiceNotes:['水平配線後の許容曲げ半径をケーブル外径の4倍とすることは基準を満たし正しい記述である。','水平配線長をパッチコード等含め100m以内とすることはUTP配線の基準に合致し正しい記述である。','成端時の撚り戻し長は漏話減衰量増大を防ぐため最小にすべきであり、最大としたとする本肢は誤り。','ケーブルに過度の外圧が加わらないよう固定することは正しい施工上の配慮である。'] },
  { id:'q59', group:'有線・線路施工', category:'線路施工(同軸ケーブル)', chapter:'2章', stars:5, question:'同軸ケーブルの施工に関する記述として、適当でないものはどれか。', options:['屋内配線において、同軸ケーブルが低圧ケーブルと交差する場合は、接触しないように敷設する','同軸ケーブルと機器との接続や同軸ケーブル相互の接続は、ケーブルの種類に対応したコネクタを用いて行う','同軸ケーブルの呼び「S-5C-2V」の先頭の「S」は、衛星放送対応であることを表す','新4K8K衛星放送に対応した衛星放送受信アンテナからテレビ受像機までの給電線には、3C-2Vの同軸ケーブルが適している'], answer:3, explanation:'3C-2Vは衛星放送に対応していない同軸ケーブルであり、衛星放送受信用の給電線には適しません。衛星放送受信用のものは、呼びの先頭の項が「S」になります(例:S-5C-FB)。また、同軸ケーブルを曲げる場合は、曲げ半径を使用するケーブルの許容曲げ半径より大きくする必要があり、小さく曲げると内部構造を破壊して損失の原因となります。特性インピーダンスはC:75Ω(主にテレビ用)、D:50Ω(主に通信用)です。', choiceNotes:['同軸ケーブルが低圧ケーブルと交差する場合に接触しないよう敷設することは正しい記述である。','同軸ケーブルの接続にケーブル種類に対応したコネクタを用いることは正しい記述である。','同軸ケーブルの呼びの先頭「S」は衛星放送対応を表すものであり、正しい記述である。','3C-2Vは衛星放送に対応していない規格であり、衛星放送受信用給電線には先頭がSの規格(例S-5C-FB)が必要なため誤り。'] },
  { id:'q60', group:'有線・線路施工', category:'線路施工(光ファイバ)', chapter:'2章', stars:5, question:'光ファイバケーブルの接続に関する記述として、適当でないものはどれか。', options:['メカニカルスプライスは、光ファイバの端面と端面をV溝上や精密パイプ内等で突き合わせ、機械的に保持固定する方法である','融着接続は、誘導加熱により光ファイバを直接加熱して溶かすことで接続する方法が一般的である','コネクタ接続は、比較的頻繁に接続替えが行われる可能性のある箇所に使用される','融着接続やメカニカルスプライスは永久接続であり、コネクタ接続は着脱可能な接続である'], answer:1, explanation:'融着接続の加熱方式は、一般的にはアーク放電式が用いられます。光ファイバの先端を2,000℃以上に加熱溶融して接続を行うもので、誘導加熱ではありません。融着接続とメカニカルスプライスは永久接続に区分され、いったん接続すると着脱できません。頻繁に接続替えの可能性がある箇所(光回線を装置に収容する場合等)にはコネクタ方式が有効です。', choiceNotes:['メカニカルスプライスがV溝等で端面同士を突き合わせ機械的に固定する方法であることは正しい記述である。','融着接続は一般にアーク放電により光ファイバを溶融接続する方式であり、誘導加熱とする本肢は誤り。','コネクタ接続が頻繁な接続替えが想定される箇所に用いられることは正しい記述である。','融着接続・メカニカルスプライスが永久接続、コネクタ接続が着脱可能な接続であることは正しい記述である。'] },
  { id:'q61', group:'有線・線路施工', category:'線路施工(光ファイバ)', chapter:'2章', stars:5, question:'光ファイバケーブルの施工に関する記述として、適当でないものはどれか。', options:['一定方向への延線が困難な場合や、敷設張力が許容張力を超えるおそれがある場合は、敷設ルートの中間で8の字取りを行う','許容曲げ半径は、延線作業中は仕上り外径の20倍以上、敷設後は10倍以上とする','引張り端は、テンションメンバに張力がかかるようにし、ケーブル端面から浸水しないように防水処置を施す','ノンメタリック光ファイバケーブルを使用する場合は、誘導雷サージ対策としてテンションメンバを接地する'], answer:3, explanation:'ノンメタリック仕様の光ファイバは、中心のテンションメンバがFRP繊維で作られており金属製ではないため、接地する効果はありません。そのため誘導雷サージ対策としての接地は不適当です。許容曲げ半径は延線時が仕上り外径の20倍以上、敷設後が10倍以上であり、敷設ルート中間での一時滞留は8の字形に取ります(日形ではよじれが一方的になり取り回しが困難になります)。', choiceNotes:['延線が困難な場合や張力超過の恐れがある場合に敷設ルート中間で8の字取りを行うことは正しい記述である。','許容曲げ半径を延線中は仕上り外径の20倍以上、敷設後は10倍以上とすることは正しい記述である。','引張り端でテンションメンバに張力をかけ、端面からの浸水を防ぐ防水処置は正しい記述である。','ノンメタリック光ファイバのテンションメンバはFRP繊維製で金属ではないため接地しても効果がなく、誘導雷サージ対策としての接地は不適当で誤り。'] },
  { id:'q62', group:'有線・線路施工', category:'線路施工(配線材)', chapter:'2章', stars:5, question:'屋内に設置する金属製ケーブルラックの施工に関する記述として、適当でないものはどれか。', options:['アルミ製ケーブルラックは、支持物との間に異種金属接触による腐食を起こさないように措置する','ケーブルラック本体相互は、ボルト等により機械的に接続すれば、電気的には接続しなくてもよい','温度変化の大きな箇所に施設する直線部分の長いケーブルラックには、伸縮継手金具を使用する','使用電圧が300V以下の低圧ケーブルの配線に使用するケーブルラックには、D種接地工事を施す'], answer:1, explanation:'ケーブルラック本体相互を連結する際には、機械的に堅牢な接続を実施するとともに、両者間を等電位に保つために電気的な接続も施さなくてはなりません。接地工事の区分は電圧により、A種とB種は高圧用、低圧はC種(300V超)とD種(300V以下)です。使用電圧300V以下の場合はD種接地工事となり、B種を施すという記述が出たら誤りです。', choiceNotes:['アルミ製ケーブルラックで異種金属接触による腐食を防ぐ措置をとることは正しい記述である。','ケーブルラック本体相互は機械的接続に加え等電位を保つための電気的接続も必要であり、電気的接続不要とする本肢は誤り。','温度変化の大きい箇所の直線部長いケーブルラックに伸縮継手金具を使用することは正しい記述である。','使用電圧300V以下の低圧ケーブル用ケーブルラックにD種接地工事を施すことは正しい記述である。'] },
  { id:'q63', group:'有線・線路施工', category:'線路施工(配線材)', chapter:'2章', stars:5, question:'屋内配線に使用する合成樹脂管の施工に関する記述として、適当なものはどれか。', options:['太さ28mmの硬質ビニル管を曲げるときは、曲げの内側の半径を管内径の5倍以上とする','PF管の露出配管において管を支持するサドルの支持点間の距離は、2m以下とする','CD管は耐燃性を有するため、露出場所への配管に適している','CD管相互の接続は、適合するカップリングにより接続する'], answer:3, explanation:'CD管相互の接続は適合するカップリングによる接続が適当です。合成樹脂可とう電線管の曲げ半径は、太さが22mmを超える場合、曲げの内側部分の半径を管内径の6倍以上としなければならず、5倍では不可です。可とう電線管の支持点間距離は内線規程により1m以下と定められており、2mではNGです。また耐燃性を有するのはPF管であり、CD管は耐燃性がないためオレンジ色に着色して区別され、主にコンクリート埋設に用いられます。', choiceNotes:['太さ22mmを超える硬質ビニル管の曲げ内側半径は管内径の6倍以上が必要であり、5倍以上とする本肢は基準未満で誤り。','PF管などの可とう電線管の支持点間距離は内線規程により1m以下とされ、2m以下とする本肢は基準を超え誤り。','耐燃性を有するのはPF管でありCD管には耐燃性がなく主にコンクリート埋設用途のため、露出場所に適するとする本肢は誤り。','CD管相互の接続は適合するカップリングにより接続することが正しい施工方法である。'] },
  { id:'q64', group:'施工管理', category:'線路施工', chapter:'2章', stars:5, question:'マイクロ波多重無線設備で使用される導波管の施工に関する記述として、適当でないものを全て選べ。', options:['導波管のフランジ接続は、ノックピンを使用してズレが起こらないように正確に接続し、その結合用ねじには、ステンレス製を使用する','導波管を通信機械室に引き込むため、適合する引込口金具を使用し、室内に雨水が浸入しないように防水処置を行う','導波管のフランジには、無線機から気密窓導波管までは気密形を使い、気密窓導波管から空中線までは非気密形を使用する','空中線から気密窓導波管までの区間に長尺可とう導波管を使用し、直線部だけでなく曲がり部にも使用する'], answer:2, explanation:'室外に施設する導波管には雨水等が入り込まないように気密形を使用し、室内に設けるものは非気密形でも問題ない。③は部材の使用法が逆であり、不適当。', choiceNotes:['フランジ接続にノックピンを用いズレを防止し、結合用ねじにステンレス製を使用することは正しい施工である。','通信機械室への引込みで適合する引込口金具を使用し雨水浸入を防ぐ防水処置を行うことは正しい記述である。','室外側(無線機から気密窓導波管まで)は気密形、室内側(気密窓導波管から空中線まで)は非気密形とする本肢は使用箇所が逆であり誤り。実際は室外側に気密形を使うのは屋外側であり本肢の記述は反対になっている。','空中線から気密窓導波管までの区間に長尺可とう導波管を直線部・曲がり部の両方に使用することは正しい記述である。'] },
  { id:'q65', group:'施工管理', category:'機器据付', chapter:'2章', stars:5, question:'建物内での電気通信機器等の耐震施工に関する記述として、適当でないものを全て選べ。', options:['機器の設置は、可能な限り床置きとし、天井つりおよび壁掛けは極力さける','卓上装置は、地震時に水平移動又は卓上から落下しないように、耐震用品で固定する','機器を建築物の床に固定するためのアンカーボルトは、一般的に地震の揺れが下層階より上層階のほうが小さいため、上層階ほど強度の弱いものを使う','据付面の大きさと比べて高さの高い機器は、壁、柱等から頂部揺れ止めが容易な場所に設置する'], answer:2, explanation:'耐震設計の根拠となる加速度は支点からの距離に依存し、下層階よりも上層階のほうが加速度が大きく揺れも大きい。③が不適当。', choiceNotes:['機器の設置を可能な限り床置きとし天井つり・壁掛けを避けることは耐震上正しい記述である。','卓上装置を地震時の水平移動や落下防止のため耐震用品で固定することは正しい記述である。','地震の加速度は下層階より上層階の方が大きく揺れも大きいため、上層階ほど強度の弱いアンカーボルトを使うとする本肢は誤りで、実際は上層階ほど強度の高いものが必要である。','据付面に対し高さの高い機器を頂部揺れ止めが容易な壁・柱等付近に設置することは正しい記述である。'] },
  { id:'q66', group:'施工管理', category:'機器据付', chapter:'2章', stars:5, question:'建物内での電気通信機器等の耐震施工に関する記述として、適当でないものを全て選べ。', options:['機器を建築物の床に固定するアンカーボルトは、一般的に地震の揺れが下層階より上層階のほうが大きいため、上層階ほど強度の高いものを使う','機器の設置は、可能な限り床置きとし、天井つりおよび壁掛けは極力さける','機器の頂部を固定する頂部支持材は、軽量間仕切壁に固定する','卓上装置は、地震時に水平移動または卓上から落下しないように、耐震用品で固定する'], answer:2, explanation:'機器頂部の揺れ止めは、壁や柱、もしくは梁といった丈夫な構造の部位から出すべきである。軽量間仕切壁では強度が不十分。③が不適当。', choiceNotes:['地震の揺れは上層階ほど大きいため、上層階ほど強度の高いアンカーボルトを使うことは正しい記述である。','機器の設置を可能な限り床置きとし天井つり・壁掛けを避けることは耐震上正しい記述である。','機器頂部の頂部支持材は壁・柱・梁等の強固な構造部位に固定すべきであり、軽量間仕切壁に固定するのは強度不足で誤り。','卓上装置を地震時の水平移動や落下防止のため耐震用品で固定することは正しい記述である。'] },
  { id:'q67', group:'施工管理', category:'機器据付', chapter:'2章', stars:5, question:'あと施工アンカーの施工に関する記述として、適当でないものを全て選べ。', options:['締付け方式の金属拡張アンカーは、アンカーのサイズに適合した重さの専用ハンマーと専用打込み棒を用いて拡張部を拡張する','打込み方式の金属拡張アンカーは、施工終了後に目視または打音でアンカーが固着されていることを確認する','カプセル方式の接着系アンカーの打込み型は、カプセルを孔内に挿入し、その上からアンカー筋をハンマー等で打ち込んで埋め込む','カプセル方式の接着系アンカーは、アンカー筋の埋め込み後は、接着剤が硬化するまで、アンカー筋が動かないように養生する'], answer:0, explanation:'ハンマーと打込み棒を用いて拡張部を広げるのは打込み方式。締付け方式はボルトやナットを締め込むことで拡張部を引っ張り上げて固着させるもの。①が不適当。', choiceNotes:['ハンマーと打込み棒を用いて拡張部を拡張するのは打込み方式の手順であり、締付け方式の説明として誤り。','打込み方式の金属拡張アンカーは施工後に目視・打音で固着を確認することは正しい記述である。','カプセル方式接着系アンカーの打込み型はカプセルを孔内に挿入しアンカー筋を打ち込んで埋め込むことは正しい記述である。','カプセル方式接着系アンカーは接着剤硬化までアンカー筋が動かないよう養生することは正しい記述である。'] },
  { id:'q68', group:'施工管理', category:'機器据付', chapter:'2章', stars:5, question:'あと施工アンカーの施工に関する記述として、適当でないものを全て選べ。', options:['墨出しは、施工図に基づき、鉄筋等の干渉物がないことを確認したうえで、母材に穿孔を満足する厚みがあることを確認したのちに行う','母材の穿孔は、墨出し位置に、施工面に対し垂直方向に、仕様に合った適正なドリルで穴あけを行う','金属拡張アンカーと母材との固着は、打込み方式の場合は専用打ち込み棒を用いて拡張部を拡張し、締付け方式の場合は適切な締付け工具で拡張部を拡張する','芯棒打込み式金属拡張アンカーの施工終了後、ダイヤル型トルクレンチによりトルク値を確認する'], answer:3, explanation:'打込み方式はハンマーで叩いて固着させるものであり、トルク値の管理が必要となるのは締付け方式の場合である。④の記述は不適当。', choiceNotes:['墨出しは施工図に基づき干渉物の有無と母材厚みを確認したうえで行うことは正しい記述である。','母材の穿孔を墨出し位置に施工面垂直方向で適正なドリルにより行うことは正しい記述である。','金属拡張アンカーの固着は打込み方式では打込み棒、締付け方式では締付け工具で拡張部を拡張するという説明は正しい記述である。','芯棒打込み式は打込み方式でありトルク管理を要するのは締付け方式であるため、打込み式でトルク値を確認するとする本肢は誤り。'] },
  { id:'q69', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'建設工事の工程管理に関する記述として、適当でないものを全て選べ。', options:['工程管理とは、実際に進行している工事が工程計画の通りに進行するように調整することである','工程管理は、PDCAサイクルの手順で実施される','工程管理、品質管理、原価管理は、お互いに関連性がないため、品質や原価を考慮せずに工程管理が行われる','工程管理に際しては、工程の進行状況を全作業員に周知徹底させ、作業能率を高めるように努力させることが重要である'], answer:2, explanation:'工程・品質・原価の3つの管理は互いに密接な関連性を持っている。品質や原価との関連性を考慮して適正なバランスをとりながら工程管理を進めることが大切。③が不適当（相互に関連性あり）。', choiceNotes:['工程管理が工程計画通りに進行するよう調整することであるとする定義は正しい記述である。','工程管理がPDCAサイクルの手順で実施されることは正しい記述である。','工程・品質・原価の3管理は相互に密接な関連があり、これらを考慮せずに工程管理を行うとする本肢は誤り。','工程の進行状況を全作業員に周知徹底し作業能率向上に努めさせることは正しい記述である。'] },
  { id:'q70', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'建設工事の工程管理に関する記述として、適当でないものを全て選べ。', options:['施工段階においても実施工程を分析・検討し、工程計画に実施工程を近づけるように施工状況を調整したり、計画を修正する等総合的管理を行う','工程管理は、計画→実施→検討→処置の手順で行われるが、この手順において、工程計画は計画に該当し、工事の指示・承諾・協議は実施に該当する','工程管理の目的は、工期を守るための単なる時間的管理に留まらず、労働力や機械設備、資材、施工方法等の生産手段を最も効率的に活用させることにある','工程と原価の関係は、施工速度を上げると原価は安くなり、さらに施工速度を上げようとすると突貫工事により原価はさらに安くなる'], answer:3, explanation:'突貫工事を行うと多くの作業者の投入や高性能な機材の調達等でコストが増大する性質がある。コストが最も低くなる施工速度を「経済速度」と呼ぶ。④が不適当。', choiceNotes:['施工段階でも実施工程を分析し計画に近づけるよう調整・修正する総合的管理を行うことは正しい記述である。','計画→実施→検討→処置の手順で、工程計画が計画、指示・承諾・協議が実施に該当するとする説明は正しい記述である。','工程管理の目的が時間管理に留まらず生産手段を効率的に活用することにあるとする記述は正しい。','施工速度を上げ過ぎ突貫工事となると人員・機材増加等でコストが増大するため、原価がさらに安くなるとする本肢は誤り。'] },
  { id:'q71', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'各種工程表の種類と特徴に関する記述として、適当なものを全て選べ。', options:['バーチャートは、横軸に部分工事をとり、縦軸に各部分工事に必要な日数をとる','バーチャートは、図表の作成が容易であり、各部分工事の工期がわかりやすいので、総合工程表として一般的に使用される','ガントチャートは、縦軸に出来高比率をとり、横軸に工期をとって工事全体の出来高比率の累計を曲線で表す','ガントチャートは、工事全体の出来高比率の累計はよくわかるが、部分工事の進捗度合いはわかりにくい'], answer:1, explanation:'バーチャートは縦軸に工種（部分工事）をとり、横軸に日数を棒線で記入するもので①は不適当。ガントチャートは縦軸に部分工事、横軸に出来高比率をとるもので③は不適当。ガントチャートは部分工事の進捗度合いは一目で判断できるが、工事全体の出来高比率の累計は把握できないため④も不適当。②が適当。', choiceNotes:['バーチャートは縦軸に部分工事(工種)、横軸に日数をとる図表であり、縦横が逆の本肢は誤り。','バーチャートは作成が容易で各工事の工期が分かりやすく総合工程表として一般的に使われるため正しい記述である。','ガントチャートは縦軸に部分工事、横軸に出来高比率をとる図表であり、本肢の縦横の説明は逆であるため誤り。','ガントチャートは各時点での進捗率は把握できるが工事全体の出来高累計は表せず、累計が分かるとする趣旨の記述は誤り。'] },
  { id:'q72', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'下図に示すバナナカーブによる工程管理に関する次の記述の□に当てはまる語句の組み合わせとして、適当なものはどれか。「時間経過率に応じた当該工事の出来高比率をプロットし、その出来高比率が、上方許容限界曲線と下方許容限界曲線の（ア）にあれば良く、下方許容限界曲線の（イ）にある場合は工程の進捗が遅れており、上方許容限界曲線の（ウ）にある場合は人員や機械の配置が多過ぎる等計画に誤りがあることが考えられる。」', options:['（ア）上　（イ）上　（ウ）上','（ア）上　（イ）下　（ウ）下','（ア）間　（イ）下　（ウ）上','（ア）間　（イ）上　（ウ）下'], answer:2, explanation:'上方許容限界と下方許容限界の2本のS字曲線に囲まれたエリアが適正な日程で進行している範囲。実績値が下方許容限界曲線の下にある場合は進捗が遅れており、上方許容限界曲線の上にある場合は計画より進み過ぎていると判断する。③が適当。', figure:'<svg viewBox="0 0 320 200" style="width:100%;max-width:360px;margin:0 auto;display:block">       <line x1="30" y1="180" x2="300" y2="180" stroke="currentColor" stroke-width="1.5"/>       <line x1="30" y1="180" x2="30" y2="10" stroke="currentColor" stroke-width="1.5"/>       <text x="290" y="195" font-size="11">時間経過率</text>       <text x="5" y="15" font-size="11">出来高%</text>       <path d="M30,180 C90,140 150,60 300,20" fill="none" stroke="#e53935" stroke-width="2"/>       <path d="M30,180 C110,170 200,110 300,60" fill="none" stroke="#1e88e5" stroke-width="2"/>       <path d="M30,180 C100,155 220,90 300,40" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>       <text x="230" y="30" font-size="11" fill="#e53935">上方許容限界曲線</text>       <text x="230" y="70" font-size="11" fill="#1e88e5">下方許容限界曲線</text>     </svg>', choiceNotes:['（ア）を「上」とする組み合わせは、実際には上下許容限界曲線の「間」にあれば良いとされるため誤り。','（イ）を「上」とする組み合わせは、下方限界曲線の「下」にある場合が遅れとなるため誤り。','出来高比率が上下許容限界曲線の間にあれば良く、下方限界曲線の下にあれば遅れ、上方限界曲線の上にあれば計画誤りとなり、この組み合わせが適当である。','（イ）を「上」とする組み合わせは、進捗の遅れは下方限界曲線の「下」で判断するため誤り。'] },
  { id:'q73', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'工程管理で使われる工程表に関する次の記述（ア）〜（ウ）の名称の組み合わせとして、適当なものはどれか。（ア）縦軸に出来高比率をとり、横軸に日数をとって、工種ごとの工程を斜線やS字曲線で表した図表である（イ）縦軸に部分工事をとり、横軸に各部分工事に必要な日数を棒線で記入した図表である（ウ）縦軸に出来高比率をとり、横軸に工期をとって、工事全体の出来高比率の累計を曲線で表した図表である', options:['（ア）出来高累計曲線　（イ）バーチャート　（ウ）グラフ式工程表','（ア）グラフ式工程表　（イ）出来高累計曲線　（ウ）バーチャート','（ア）グラフ式工程表　（イ）バーチャート　（ウ）出来高累計曲線','（ア）バーチャート　（イ）グラフ式工程表　（ウ）出来高累計曲線'], answer:2, explanation:'縦軸に出来高比率を配し横軸に時間を置いて作業ごとの工程を斜め方向に記入する（ア）はグラフ式工程表。（イ）はバーチャート、（ウ）は出来高累計曲線の説明。③が適当。', choiceNotes:['（ア）を出来高累計曲線とする組み合わせは、（ア）の説明が工種ごとの斜線・S字曲線でありグラフ式工程表の特徴のため誤り。','（ア）をグラフ式工程表とする点は妥当だが（イ）を出来高累計曲線とする組み合わせは、（イ）の説明がバーチャートの特徴であるため誤り。','（ア）はグラフ式工程表、（イ）はバーチャート、（ウ）は出来高累計曲線の説明と一致しており、正しい組み合わせである。','（ア）をバーチャートとする組み合わせは、（ア）の説明が出来高比率と日数を斜線で示すグラフ式工程表の特徴であるため誤り。'] },
  { id:'q74', group:'施工管理', category:'ネットワーク工程表', chapter:'2章', stars:5, question:'ネットワーク工程表のクリティカルパスに関する記述として、適当なものはどれか。', options:['クリティカルパスは、開始時点から終了時点までの全ての経路のうち、最も日数の短い経路である','工程短縮の手順として、クリティカルパスに着目する','クリティカルパスは、必ず1本になる','クリティカルパス以外の作業では、フロートを使ってしまってもクリティカルパスにはならない'], answer:1, explanation:'クリティカルパスは最も日数がかかる経路であり①は不適当。工程を短縮したい場合はクリティカルパス上の作業内容に着目せざるを得ないため②は適当。クリティカルパスは必ずしも1本とは限らず③は不適当。フロートを使い切ってしまうと、そこがクリティカルパスになってしまう場合があるため④も不適当。', choiceNotes:['クリティカルパスは開始から終了までの経路のうち最も日数の長い経路であり、最も短い経路とする本肢は誤り。','工程短縮を図る際はクリティカルパス上の作業に着目する必要があり、正しい記述である。','クリティカルパスは複数本存在する場合もあり、必ず1本になるとする本肢は誤り。','クリティカルパス以外の作業でもフロートを使い切るとその経路がクリティカルパスになり得るため、本肢は誤り。'] },
  { id:'q75', group:'施工管理', category:'ネットワーク工程表', chapter:'2章', stars:5, question:'ネットワーク工程表に関する記述として、適当でないものはどれか。', options:['アクティビティは、トータルフロートが0の作業の結合点を結んだ一連の経路である','フリーフロートは、作業を最早開始時刻で始めてから完了した後、後続作業を最早開始時刻で始めるまでの余裕日数である','ダミーは、実際に遂行しなければならない作業を表すものではなく、作業の相互関係を示すために使用される所要時間が0の矢線である','先行作業でトータルフロートを消費すると、後続作業のトータルフロートは、その消費した日数分少なくなる'], answer:0, explanation:'トータルフロートが0となる作業の結合点を結んだルートはクリティカルパスであり、アクティビティではない。アクティビティとは作業を意味する。①が不適当。', choiceNotes:['トータルフロート0の結合点を結んだ経路はクリティカルパスであり、アクティビティ(作業)の説明ではないため誤り。','フリーフロートを最早開始時刻基準の後続作業までの余裕日数とする説明は正しい記述である。','ダミーが実作業を表さず作業相互の関係を示す所要時間0の矢線であるとする説明は正しい記述である。','先行作業でトータルフロートを消費すると後続作業のトータルフロートがその分減少するとする説明は正しい記述である。'] },
  { id:'q76', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'JIS Q 9000:2015の品質マネジメントシステム−基本および用語における品質特性の定義として、適当なものはどれか。', options:['要求事項に関連する、対象に本来備わっている特性','特徴付けている性質','測定結果に影響を与え得る特性','対象に本来備わっている特性の集まりが、要求事項を満たす程度'], answer:0, explanation:'「要求事項に関連する、対象に本来備わっている特性」が品質特性の定義であり①が適当。②は「特性」、③は「計量特性」、④は「品質」の定義である。', choiceNotes:['JIS Q 9000で品質特性は「要求事項に関連する、対象に本来備わっている特性」と定義されており正しい記述である。','「特徴付けている性質」は「特性」の定義であり、品質特性の定義としては誤り。','「測定結果に影響を与え得る特性」は「計量特性」の定義であり、品質特性の定義としては誤り。','「特性の集まりが要求事項を満たす程度」は「品質」の定義であり、品質特性の定義としては誤り。'] },
  { id:'q77', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'ISO 9000ファミリー規格の品質マネジメントシステムのリーダーシップおよびコミットメントに関する記述として、適当でないものはどれか。', options:['組織の事業プロセスへの品質マネジメントシステム要求事項の統合を確実にする','品質マネジメントシステムがその意図した結果を達成することを確実にする','品質マネジメントシステムに必要な資源が利用可能であることを確実にする','品質マネジメントシステムのリスクに説明責任を負う'], answer:3, explanation:'ISO 9001（要求事項）のリーダーシップの中では「品質マネジメントシステムの有効性に説明責任を負う」と定義されており、「リスクに説明責任」ではない。④が不適当。', choiceNotes:['事業プロセスへの品質マネジメントシステム要求事項の統合を確実にすることはリーダーシップの要求事項として正しい。','品質マネジメントシステムが意図した結果を達成することを確実にすることはリーダーシップの要求事項として正しい。','必要な資源が利用可能であることを確実にすることはリーダーシップの要求事項として正しい。','ISO 9001では「品質マネジメントシステムの有効性」に説明責任を負うと定義されており、「リスクに説明責任」とする本肢は誤り。'] },
  { id:'q78', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'品質管理で使用される「ヒストグラム」に関する記述として、適当なものはどれか。', options:['データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図である','不良、クレーム、故障、事故等の問題の解決にあたり、原因別、結果別に分類し、大きい順に並べ、棒グラフと累計曲線で表した図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである','2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる'], answer:0, explanation:'ヒストグラムを説明したものは①。分布の状態（山の形）によって工程の異常等を判断する材料とする。②はパレート図、③は特性要因図、④は散布図の説明。', choiceNotes:['データを区間に分け各区間の度数を高さで表す図はヒストグラムの定義であり正しい記述である。','原因別・結果別に分類し大きい順に棒グラフと累計曲線で表す図はパレート図の説明であり、ヒストグラムではないため誤り。','特性と要因の関連を魚の骨状にまとめた図は特性要因図の説明であり、ヒストグラムではないため誤り。','2つの対データを点で表す図は散布図の説明であり、ヒストグラムではないため誤り。'] },
  { id:'q79', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'品質管理で使用される「パレート図」に関する記述として、適当なものはどれか。', options:['2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる','不適合、クレーム等を、その現象や原因別に分類してデータをとり、不適合品数や手直し件数等の多い順に並べて、その大きさを棒グラフで表し、累積曲線で結んだ図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである','中心線と上下2本の管理限界線が書かれたグラフの中に、統計処理したデータを点として書き入れたもので、その点が管理限界線より外に出れば、工程に異常があると判断して、原因究明や処置を行う'], answer:1, explanation:'パレート図は棒グラフと折れ線グラフ（累積曲線）を融合させた図表で、②が適当。①は散布図、③は特性要因図、④は管理図の説明。', choiceNotes:['対になったデータを点で表す図は散布図の説明であり、パレート図の説明としては誤り。','不適合等を件数の多い順に並べ棒グラフと累積曲線で表す図はパレート図の定義そのものであり正しい記述である。','特性と要因の関連を魚の骨状にまとめた図は特性要因図の説明であり、パレート図ではないため誤り。','中心線と管理限界線内にデータを点で表す図は管理図の説明であり、パレート図ではないため誤り。'] },
  { id:'q80', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'品質管理で使用される「特性要因図」に関する記述として、適当なものはどれか。', options:['データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図である','不良、クレーム、故障、事故等の問題の解決にあたり、原因別、結果別に分類し、大きい順に並べ、棒グラフと累計曲線で表した図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである','2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる'], answer:2, explanation:'特性要因図の説明は③。結果から原因に遡って問題点を洗い出す手法で、図表全体が魚の骨に似ていることから別名フィッシュボーンともいう。①はヒストグラム、②はパレート図、④は散布図。', choiceNotes:['ヒストグラムの説明であり、特性要因図の説明ではない。','パレート図の説明であり、特性要因図とは異なる。','特性と要因の関連を魚の骨状に整理した図が特性要因図であり、正しい説明である。','散布図の説明であり、特性要因図ではない。'] },
  { id:'q81', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'品質管理で使用される「散布図」に関する記述として、適当なものはどれか。', options:['データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図である','2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる','不適合、クレーム等を、その現象や原因別に分類してデータをとり、不適合品数や手直し件数等の多い順に並べて、その大きさを棒グラフで表し、累積曲線で結んだ図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである'], answer:1, explanation:'散布図は②の説明が該当。2つの特性値の相関関係の有無を視覚的に判断するためのグラフ。①はヒストグラム、③はパレート図、④は特性要因図。', choiceNotes:['ヒストグラムの説明であり、散布図ではない。','2つの対になったデータを点でプロットし相関関係を見る図が散布図であり、正しい説明である。','パレート図の説明であり、散布図ではない。','特性要因図の説明であり、散布図ではない。'] },
  { id:'q82', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'下図の管理図が示す工程の状態に関する記述として、適当なものはどれか。', options:['全ての点が上下2本の管理限界線の内にあるが、点が次第に上昇する傾向にあるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、点が次第に下降する傾向にあるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、中心線より上の側に点が9個連続して並んでいるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、隣り合う点が周期的に上下しているため、工程に異常がある'], answer:2, explanation:'JIS Z 9021「シューハート管理図」の異常判定ルールには「連続する9点が中心線に対して同じ側にある」がある。選択肢のうち異常判定ルールに抵触するのは③が該当し、③が適当。', figure:'<svg viewBox="0 0 320 180" style="width:100%;max-width:360px;margin:0 auto;display:block">       <line x1="20" y1="30" x2="300" y2="30" stroke="#e53935" stroke-width="1.2" stroke-dasharray="3 2"/>       <line x1="20" y1="150" x2="300" y2="150" stroke="#e53935" stroke-width="1.2" stroke-dasharray="3 2"/>       <line x1="20" y1="90" x2="300" y2="90" stroke="#999" stroke-width="1" stroke-dasharray="2 2"/>       <text x="302" y="33" font-size="10">UCL</text>       <text x="302" y="153" font-size="10">LCL</text>       <text x="302" y="93" font-size="10">CL</text>       <polyline points="30,60 55,55 80,50 105,45 130,60 155,42 180,48 205,40 230,45 255,38 280,50" fill="none" stroke="#1e88e5" stroke-width="2"/>       <g fill="#1e88e5">         <circle cx="30" cy="60" r="3"/><circle cx="55" cy="55" r="3"/><circle cx="80" cy="50" r="3"/>         <circle cx="105" cy="45" r="3"/><circle cx="130" cy="60" r="3"/><circle cx="155" cy="42" r="3"/>         <circle cx="180" cy="48" r="3"/><circle cx="205" cy="40" r="3"/><circle cx="230" cy="45" r="3"/>         <circle cx="255" cy="38" r="3"/><circle cx="280" cy="50" r="3"/>       </g>       <text x="20" y="15" font-size="11">※ 中心線(CL)より上に点が9個連続</text>     </svg>', choiceNotes:['図中の点は上昇傾向を示しておらず、この管理図の状態とは合致しない。','図中の点は下降傾向を示しておらず、この管理図の状態とは合致しない。','図は中心線より上に9個連続して点が並んでおり、JIS Z 9021の異常判定ルールに抵触するため異常と判断できる。','図中の点に周期的な上下変動は見られず、この管理図の状態とは合致しない。'] },
  { id:'q83', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'工場立会検査に関する記述として、適当でないものはどれか。', options:['発注者が、設計図書で要求される機器の品質・性能を満足していることを確認するために行う','検査対象機器および検査方法については、検査要領書にて発注者の承認を得る','工場立会検査の結果、設計図書で要求される品質・性能を満たさない場合は、受注者に手直しをさせる','工場立会検査の結果、手直しが必要となった場合、その手直しについては、工事全体工程を考慮しなくてもよい'], answer:3, explanation:'手直しが数日間に及ぶと現場への納入が遅延し下流工程に影響を与え、工事全体工期も遅延する要因となるため、工事全体工程は当然に考慮すべき項目である。④が不適当。', choiceNotes:['発注者要求品質を確認する目的で行う立会検査の説明として正しい。','検査対象・方法を検査要領書で発注者の承認を得ることは工場立会検査の正しい手順である。','品質・性能を満たさない場合に受注者へ手直しをさせることは適切な対応である。','手直しが生じれば納入遅延により下流工程や工事全体工期に影響するため、全体工程を考慮しなくてよいとするのは誤りである。'] },
  { id:'q84', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'製品の全数を検査し良品と不良品に分け、良品だけを合格とする方法である全数検査が有効な場合として、適当なものはどれか。', options:['製品の破壊検査が必要な場合','製品の数量が非常に多い場合','わずかな不良品の混入も許されない場合','製品が連続体の場合'], answer:2, explanation:'破壊検査は検査対象を破壊するため全数検査は実施できない。数量が非常に多い場合や連続体の場合は抜取検査が望まれる。わずかな不良品の混入も許されない場合は全数検査が望まれるケースであり、③が適当。', choiceNotes:['破壊検査は対象を壊してしまうため全数検査には適用できず、抜取検査が用いられる。','数量が非常に多い場合は全数検査だと時間・コストがかかりすぎるため、抜取検査が望ましい。','わずかな不良品の混入も許されない場合は全数検査が有効であり、正しい説明である。','連続体（ケーブル等）は個々に区切って全数検査することが困難なため、抜取検査が用いられる。'] },
  { id:'q85', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'無線機のスプリアス発射の強度の測定に使用する測定器として、適当なものはどれか。', options:['周波数カウンタ','クランプメータ','電力量計','スペクトラムアナライザ'], answer:3, explanation:'必要周波数帯の周辺で電波のスペクトルがどのように分布しているかを俯瞰するには、周波数方向に広い画角を持つスペクトラムアナライザが該当する。④が適当。', choiceNotes:['周波数カウンタは特定の1つの周波数を測定するもので、スプリアスのような周波数分布の測定には不向きである。','クランプメータは電流を測定する測定器であり、スプリアス強度の測定には使用しない。','電力量計は消費電力量の積算値を測る計器であり、スプリアス測定には用いない。','周波数方向に広い範囲のスペクトル分布を測定できるスペクトラムアナライザがスプリアス発射強度の測定に適しており、正しい。'] },
  { id:'q86', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'150MHz帯4値FSK変調方式の移動無線設備工事の品質管理に関する記述として、適当なものはどれか。', options:['BER測定器により送信周波数を測定し、規格値を満足していることを確認した','クランプメータにより受信感度を測定し、規格値を満足していることを確認した','SWR計により反射電力を測定し、規格値を満足していることを確認した','電力量計により送信出力を測定し、規格値を満足していることを確認した'], answer:2, explanation:'BER測定器では周波数は測れない（周波数カウンタを使用）。クランプメータは電流値を測る測定器で受信感度は測れない。送信出力を測るのは電力計（電力量計は累計値用）。SWRは進行電力に対する反射電力の度合いを表すものであり、③が適当。', choiceNotes:['BER測定器はビット誤り率を測定するもので、送信周波数の測定はできない。','クランプメータは電流を測る測定器であり、受信感度の測定には使用しない。','SWR計により反射電力の度合いを測定し規格値を確認する方法は適切であり、正しい。','電力量計は積算電力量を測るもので、送信出力（瞬時電力）の測定には電力計を用いる。'] },
  { id:'q87', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'ツイストペアケーブルの測定試験項目であるワイヤマップの試験に関する記述として、適当なものはどれか。', options:['信号が一端から他端へ伝搬するために要する時間を測定するものである','ツイストペアケーブルの各心線について、正しい対組み合わせ、対反転や対交差等、ケーブル両端の接続状態を確認するものである','任意の2対において1対を送信回線として、残りの1対を受信回線とし受信回線に漏れてくる近端側の受信レベルを測定するものである','送信端に信号を入力し、受信端で信号の減衰量を測定するものである'], answer:1, explanation:'ワイヤマップ試験はツイストペアケーブルの両端の接続状態を確認するための測定試験で、断線や短絡、対反転、対交差、対分割についてのテストを行うことができる。②が適当。', choiceNotes:['信号の伝搬時間を測るのは遅延時間測定であり、ワイヤマップ試験の説明ではない。','ケーブル両端の接続状態（対反転・対交差等）を確認する試験がワイヤマップ試験であり、正しい説明である。','近端漏話（NEXT）の測定に関する説明であり、ワイヤマップ試験ではない。','減衰量測定の説明であり、ワイヤマップ試験ではない。'] },
  { id:'q88', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'LAN工事の施工品質の確認に関する記述として、適当なものはどれか。', options:['LAN用光ファイバケーブル敷設後に高周波電力計により光損失を測定する','UTPケーブル敷設後に絶縁抵抗計により挿入損失を測定する','無線LANアクセスポイント設置後にOTDRにより電界強度を測定する','IP系ネットワーク機器設置後にpingコマンドにより端末機器間の疎通確認を行う'], answer:3, explanation:'光損失の測定はOTDR等で行い、高周波電力計では測定できない。UTPケーブルの挿入損失はLANケーブルテスタ等で測定する。電界強度の測定には電界強度計を使う。pingコマンドはICMPを用いてIPネットワークの正常性・疎通を確認する機能であり、④が適当。', choiceNotes:['光損失の測定はOTDR等で行うものであり、高周波電力計では測定できない。','UTPケーブルの挿入損失はLANケーブルテスタ等で測定するものであり、絶縁抵抗計では測定できない。','電界強度の測定には電界強度計を用いるものであり、OTDRは光ファイバの損失測定に使う機器である。','pingコマンドによる疎通確認はIP系ネットワーク機器の品質確認手法として適切であり、正しい。'] },
  { id:'q89', group:'施工管理', category:'原価管理', chapter:'2章', stars:5, question:'次に示す利益図表に関する記述として、適当なものはどれか。', options:['減価償却される自社所有の建設用機械のコストは、固定費であるため固定原価に該当する','工事原価は、固定原価、変動原価、利益に区分される','労務費は、固定費であるため固定原価に該当する','施工出来高が増え損益分岐点を超えると利益が出なくなる'], answer:0, explanation:'減価償却費は工事案件の進捗状況に左右されないため固定費となり、①が適当。工事原価は固定原価と変動原価の2種に分けられ利益は含まれない（②不適当）。労務費は必ずしも固定費とは限らない（③不適当）。', figure:'<svg viewBox="0 0 320 220" style="width:100%;max-width:360px;margin:0 auto;display:block">   <line x1="35" y1="190" x2="300" y2="190" stroke="currentColor" stroke-width="1.5"/>   <line x1="35" y1="190" x2="35" y2="15" stroke="currentColor" stroke-width="1.5"/>   <text x="270" y="205" font-size="11">施工出来高</text>   <text x="5" y="15" font-size="11">工事原価</text>   <line x1="35" y1="150" x2="300" y2="150" stroke="#1e88e5" stroke-width="2"/>   <text x="240" y="145" font-size="10" fill="#1e88e5">固定原価線</text>   <line x1="35" y1="150" x2="290" y2="60" stroke="#e53935" stroke-width="2"/>   <text x="230" y="80" font-size="10" fill="#e53935">変動原価加算線(総原価)</text>   <line x1="35" y1="190" x2="290" y2="30" stroke="#43a047" stroke-width="2"/>   <text x="230" y="45" font-size="10" fill="#43a047">売上線</text>   <circle cx="165" cy="105" r="4" fill="#333"/>   <text x="170" y="100" font-size="10" font-weight="bold">損益分岐点</text> </svg>', choiceNotes:['減価償却費は施工出来高に左右されない固定費であり、固定原価に該当するため正しい。','工事原価は固定原価と変動原価の2つに区分され、利益は原価には含まれないため誤りである。','労務費は稼働量に応じて増減する変動費的性格を持つことが多く、必ずしも固定費とは限らないため誤りである。','損益分岐点を超えると出来高の増加に伴い利益は増加していくため、利益が出なくなるとする記述は誤りである。'] },
  { id:'q90', group:'施工管理', category:'原価管理', chapter:'2章', stars:5, question:'建設工事の原価管理に関する記述として、適当でないものはどれか。', options:['原価管理では、合理的な施工方法に基づき見積原価を算出し、これに企業経営に必要な一般管理費を加えて、実行予算原価を編成する','原価管理では、実際にかかった原価と工事施工開始に伴って積算された実行予算との差を分析・検討して適切な処置を行い、実際の原価と実行予算の管理を行う','原価管理では、発注者の要求事項を無視して利益を出すのではなく、受注した金額以下でそれ以上の価値を完成させ、適正利潤を確保できるよう管理を行う','原価管理では、工程管理、品質管理、労務管理、資材管理、安全管理と関連して種々の能率向上やコストダウンを図ることが重要である'], answer:0, explanation:'一般管理費は現場で管理すべき実行予算原価とはいえず、本社側で管理すべきものと解釈するのが自然。①が不適当（一般管理費は実行予算に含まない）。', choiceNotes:['一般管理費は現場の実行予算原価には含めず本社側で管理すべき費用であり、実行予算原価に加えるとする記述は誤りである。','実行予算と実際原価の差異を分析し適切な処置を行うことは原価管理の基本であり、正しい。','発注金額以下で価値を実現し適正利潤を確保することを目指す姿勢は原価管理の目的として正しい。','工程・品質・労務・資材・安全管理と連携して能率向上やコストダウンを図ることは原価管理の重要な要素であり、正しい。'] },
  { id:'q91', group:'電気・電子理論', category:'携帯電話システム（LTE）', chapter:'3章', stars:4, question:'第4世代移動通信システムと呼ばれるLTEに関する記述として、適当でないものはどれか。', options:['データの変調において、FSKを採用している','複数のアンテナにより送受信を行うMIMO伝送技術を採用している','無線アクセス方式において、上りリンクと下りリンクで異なった方式を採用している','パケット交換でサービスすることを前提としている'], answer:0, explanation:'LTE携帯電話システムでは、データの変調はPSKとQAMとで行われている。FSKもデジタル変調方式の1つだが、あまり多くの信号を載せることができないため、現行の携帯電話システムでは採用されていない。MIMOは送信・受信アンテナとも複数となっている無線伝送のスタイルで採用されている。①が不適当。', choiceNotes:['LTEのデータ変調にはPSKやQAMが用いられ、FSKは採用されていないため誤りである。','LTEは複数送受信アンテナによるMIMO伝送技術を採用しており、正しい。','LTEは上りにSC-FDMA、下りにOFDMAと異なる方式を採用しており、正しい。','LTEはパケット交換方式を前提としたシステムであり、正しい。'] },
  { id:'q92', group:'電気・電子理論', category:'携帯電話システム（LTE）', chapter:'3章', stars:4, question:'携帯電話システムであるLTEに関する記述として、適当でないものはどれか。', options:['複数の送受信アンテナにより、異なる信号のセットを同一時間に同一周波数帯を用いて送受信することで、伝送容量の増大や伝送品質の向上を図るMIMOが採用されている','上りリンクの無線アクセス方式にはSC-FDMAを採用し、下りリンクの無線アクセス方式にはCDMAを採用している','音声サービスを実現するため、IPパケットにより音声データをリアルタイムに伝送するVoiceover LTEを採用している','フェージング等の無線環境に合わせて、データの変調方式を柔軟に切り替える適応変調を採用している'], answer:1, explanation:'LTEの無線アクセス方式は、基地局から移動端末へ向かう下り回線ではOFDMAが採用されている。上り回線ではSC-FDMAを用いる。下りはCDMAではないため②が不適当。また符号誤りを防ぐため、受信電界強度が低くなるにつれて変調方式を切り替える適応変調が採用されている。', choiceNotes:['MIMOは複数アンテナで同一時間・同一周波数を用い伝送容量や品質向上を図る技術で、LTEに採用されており正しい。','下りリンクにはOFDMAが用いられておりCDMAではないため誤りである。','VoLTEはIPパケットで音声をリアルタイム伝送する方式でありLTEに採用されており正しい。','無線環境に応じて変調方式を切り替える適応変調はLTEに採用されており正しい。'] },
  { id:'q93', group:'電気・電子理論', category:'電気の基礎（電磁気学）', chapter:'3章', stars:4, question:'右図に示すように、真空中にr=0.1〔m〕の間隔で平行に置いた無限に長い2本の直線導体に、同じ向きにI1=I2=2〔A〕の電流が流れているとき、導体1mあたりに働く力F〔N/m〕として、適当なものはどれか。ただし、真空中の透磁率μ0=4π×10^-7〔H/m〕とする。', options:['4×10^-6〔N/m〕','8×10^-6〔N/m〕','16×10^-6〔N/m〕','25×10^-6〔N/m〕'], answer:1, explanation:'導線1mあたりに働く力はF=μ0×(I1・I2)/(2πr)〔N/m〕。諸数値を代入すると、F=4π×10^-7×(2×2)/(2π×0.1)=8.0×10^-6〔N/m〕となり②が適当。電流の向きが同じときは2本の導線は引き合い、反対向きのときは反発し合う。', figure:'<svg viewBox="0 0 260 140" style="width:100%;max-width:300px;margin:0 auto;display:block">       <line x1="70" y1="15" x2="70" y2="125" stroke="currentColor" stroke-width="3"/>       <line x1="170" y1="15" x2="170" y2="125" stroke="currentColor" stroke-width="3"/>       <text x="55" y="10" font-size="12">I1=2A</text>       <text x="155" y="10" font-size="12">I2=2A</text>       <path d="M70,70 L90,70" stroke="currentColor" marker-end="url(#a2)"/>       <path d="M170,70 L190,70" stroke="currentColor" marker-end="url(#a2)"/>       <line x1="70" y1="130" x2="170" y2="130" stroke="currentColor" stroke-width="1"/>       <text x="105" y="145" font-size="12">r = 0.1m</text>       <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="currentColor"/></marker></defs>     </svg>', choiceNotes:['4×10^-6は計算過程を誤った値であり、正しい計算結果と一致しない。','F=μ0I1I2/(2πr)に代入すると8×10^-6〔N/m〕となり、正しい計算結果である。','16×10^-6は正しい計算結果の2倍にあたる誤った値である。','25×10^-6は計算過程を誤った値であり、正しい計算結果と一致しない。'] },
  { id:'q94', group:'電気・電子理論', category:'電気の基礎（コンデンサ）', chapter:'3章', stars:4, question:'下図に示す電極間の距離d0=0.02〔mm〕、電極の面積S=100〔cm2〕の平行板空気コンデンサにおいて、電極間に厚さd1=0.01〔mm〕、比誘電率εr=10の誘電体を挿入し、電極間に充電電圧V=24〔V〕を与えたときの、このコンデンサが蓄える電気量Q〔μC〕の値として、適当なものはどれか。ただし、コンデンサの初期電荷は0とし、端効果は無視できるものとする。また、真空の誘電率ε0=8.85×10^-12〔F/m〕、空気の比誘電率は1とする。', options:['0.01〔μC〕','0.19〔μC〕','0.30〔μC〕','2.3〔μC〕'], answer:1, explanation:'誘電体を電極間距離の半分のみ挿入しているため、真空（空気）部分と誘電体部分で作られる2つのコンデンサが直列につながっているとして計算する。C0=8.85×10^-9〔F〕、Cr=8.85×10^-8〔F〕、合成静電容量は和分の積でC=8.045×10^-9〔F〕。Q=C・V=8.045×10^-9×24=0.193×10^-6〔C〕となり②が適当。', figure:'<svg viewBox="0 0 260 140" style="width:100%;max-width:300px;margin:0 auto;display:block">       <rect x="40" y="20" width="180" height="8" fill="currentColor"/>       <rect x="40" y="105" width="180" height="8" fill="currentColor"/>       <rect x="40" y="55" width="180" height="20" fill="#ffb300" opacity="0.5"/>       <text x="230" y="68" font-size="11">誘電体 d1, εr=10</text>       <text x="100" y="45" font-size="11">空気層</text>       <text x="100" y="98" font-size="11">空気層</text>       <line x1="20" y1="20" x2="20" y2="113" stroke="currentColor" stroke-width="1"/>       <text x="0" y="70" font-size="11">d0</text>       <text x="120" y="130" font-size="12">S=100cm², V=24V</text>     </svg>', choiceNotes:['0.01μCは合成静電容量の計算を誤った値であり、正しい結果と一致しない。','空気層と誘電体層を直列接続とみなし合成静電容量を求めQ=CVで計算すると約0.19μCとなり、正しい。','0.30μCは空気層と誘電体層の直列関係を無視するなど誤った仮定に基づく計算値である。','2.3μCは誘電体の効果を過大に評価するなどした誤った計算値である。'] },
  { id:'q95', group:'電気・電子理論', category:'直流回路', chapter:'3章', stars:4, question:'下図に示す最大目盛Ia=50〔mA〕、内部抵抗r=5.6〔Ω〕の電流計に分流器を接続して、測定範囲をI=0.4〔A〕まで拡大したときの分流器の倍率mと、分流器の抵抗RS〔Ω〕の値の組み合わせとして、適当なものはどれか。', options:['分流器の倍率m：7、分流器の抵抗RS：0.9〔Ω〕','分流器の倍率m：7、分流器の抵抗RS：0.8〔Ω〕','分流器の倍率m：8、分流器の抵抗RS：0.9〔Ω〕','分流器の倍率m：8、分流器の抵抗RS：0.8〔Ω〕'], answer:3, explanation:'電流計に流せる最大の電流は0.05〔A〕なので、残りの0.35〔A〕を分流器のルートに迂回させる。電流計の両端にかかる最高電圧はE=0.05×5.6=0.28〔V〕で、これが分流器RSにも印加されるため、RS=0.28/0.35=0.8〔Ω〕。分流器の倍率は抵抗値の比ではなく、全体として何倍まで電流を流せるかを指すので、m=0.4/0.05=8。④が適当。', figure:'<svg viewBox="0 0 260 140" style="width:100%;max-width:300px;margin:0 auto;display:block">       <circle cx="130" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="130" y="55" text-anchor="middle" font-size="14">A</text>       <text x="130" y="88" text-anchor="middle" font-size="11">Ia=50mA, r=5.6Ω</text>       <line x1="60" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width="2"/>       <rect x="115" y="92" width="30" height="16" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="130" y="130" text-anchor="middle" font-size="12">分流器 Rs</text>       <line x1="60" y1="100" x2="60" y2="60" stroke="currentColor" stroke-width="1.5"/>       <line x1="60" y1="60" x2="104" y2="60" stroke="currentColor" stroke-width="1.5"/>       <line x1="200" y1="100" x2="200" y2="60" stroke="currentColor" stroke-width="1.5"/>       <line x1="200" y1="60" x2="156" y2="60" stroke="currentColor" stroke-width="1.5"/>       <text x="30" y="120" font-size="12">I=0.4A</text>     </svg>', choiceNotes:['倍率m=I/Ia=0.4/0.05=8であり、m=7は計算誤りである。','mが7という時点で誤りであり、Rsの値も正しい組み合わせとはならない。','m=8は正しいが、Rs=Ia・r/(I−Ia)=0.28/0.35=0.8Ωとなるため0.9Ωは誤りである。','m=I/Ia=8、Rs=Ia・r/(I−Ia)=0.28/0.35=0.8〔Ω〕となり、正しい組み合わせである。'] },
  { id:'q96', group:'電気・電子理論', category:'交流回路', chapter:'3章', stars:4, question:'下図に示すRLC直列回路において、R=40〔Ω〕、XL=20〔Ω〕、XC=60〔Ω〕のとき、インピーダンスの大きさZ〔Ω〕と回路の性質の組み合わせとして、適当なものはどれか。', options:['Z=40√2〔Ω〕、回路の性質：容量性','Z=40√2〔Ω〕、回路の性質：誘導性','Z=40√5〔Ω〕、回路の性質：容量性','Z=40√5〔Ω〕、回路の性質：誘導性'], answer:0, explanation:'直列接続の合成インピーダンスはZ=√(R2+(XL−XC)2)。代入するとZ=√(40^2+(20−60)^2)=40√2〔Ω〕。リアクタンスをベクトルで見たとき、XL（コイル）寄りなら誘導性、XC（コンデンサ）寄りなら容量性となる。本例題ではXC寄りなので容量性の回路であり、①が適当。', figure:'<svg viewBox="0 0 300 100" style="width:100%;max-width:340px;margin:0 auto;display:block">       <line x1="10" y1="50" x2="60" y2="50" stroke="currentColor" stroke-width="2"/>       <rect x="60" y="35" width="50" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="85" y="55" text-anchor="middle" font-size="13">R=40Ω</text>       <line x1="110" y1="50" x2="140" y2="50" stroke="currentColor" stroke-width="2"/>       <rect x="140" y="35" width="50" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="165" y="55" text-anchor="middle" font-size="12">XL=20Ω</text>       <line x1="190" y1="50" x2="220" y2="50" stroke="currentColor" stroke-width="2"/>       <rect x="220" y="35" width="50" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="245" y="55" text-anchor="middle" font-size="12">XC=60Ω</text>       <line x1="270" y1="50" x2="290" y2="50" stroke="currentColor" stroke-width="2"/>       <text x="150" y="85" text-anchor="middle" font-size="11">R・XL・XC 直列接続</text>     </svg>', choiceNotes:['Z=√(R²+(XL−XC)²)=40√2〔Ω〕であり、XCがXLより大きいため容量性となり正しい。','Zの値は正しいが、XC（60Ω）がXL（20Ω）より大きいため誘導性ではなく容量性であり誤りである。','Z=40√5は計算過程を誤った値であり正しくない。','誘導性という判定もZの値も誤りである。'] },
