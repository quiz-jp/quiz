  { id:'q332', group:'施工管理', category:'移動式クレーン安全', chapter:'2章', stars:5, question:'事業者が実施すべき安全確保に関する次の記述の[ ]に当てはまる語句の組み合わせとして、「労働安全衛生法令」上、正しいものはどれか。「事業者は、移動式クレーンを用いて作業を行うときは、移動式クレーンの転倒等による労働者の危険を防止するため、あらかじめ、当該作業に係る場所の広さ、地形および地質の状態、運搬しようとする荷の重量、使用する移動式クレーンの種類および能力等を考慮して、次の事項を定めなければならない。1 移動式クレーンによる作業の方法 2 移動式クレーンの[ア]するための作業の方法 3 移動式クレーンに係る作業に従事する労働者の[イ]」', options:['(ア)衝撃を軽減 (イ)作業時間','(ア)衝撃を軽減 (イ)配置および指揮の系統','(ア)転倒を防止 (イ)作業時間','(ア)転倒を防止 (イ)配置および指揮の系統'], answer:3, explanation:'移動式クレーンは転倒の危険性が常に伴う。事業者は転倒を防止するための作業方法と、作業に従事する労働者の配置および指揮の系統を定める必要がある。指揮系統を1本化することで判断ミスを防ぐ。' },
  { id:'q333', group:'施工管理', category:'移動式クレーン安全', chapter:'2章', stars:5, question:'移動式クレーンの安全確保に関する記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['移動式クレーンを用いて荷を吊り上げるときは、外れ止め装置を使用しなければならない','移動式クレーンに係る作業を行う場合であって、ハッカーを用いて玉掛けをした荷が吊り上げられているときは、吊り上げられている荷の下に労働者を立ち入らせることができる','移動式クレーンにその定格荷重をこえる荷重をかけて使用することはできない','吊り上げ荷重が1t以上5t未満の移動式クレーンの運転(道路上を走行させる運転を除く)の業務は、移動式クレーンに係る特別教育を修了した者を当該業務に就かせることができる'], answer:1, explanation:'ハッカーを用いて玉掛けした荷が吊り上げられている場合、その下に労働者を立ち入らせてはならない。吊り上げ荷重1t以上5t未満の移動式クレーンの運転には技能講習(小型移動式クレーン運転技能講習)の修了が必要で、特別教育の修了のみでは操作できない。①③は正しい。' },
  { id:'q334', group:'施工管理', category:'特別教育', chapter:'2章', stars:5, question:'労働者を業務に従事させるにあたり特別教育が必要な業務として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['吊り上げ荷重が1tのクレーン玉掛けの業務','高圧の充電電路の点検の業務','吊り上げ荷重が0.5tの移動式クレーンの運転の業務(道路上を走行させる運転を除く)','作業床の高さが15mの高所作業車の運転の業務'], answer:0, explanation:'クレーンの玉掛け業務で特別教育の対象となるのは吊り上げ荷重1t未満のもの。1t以上は技能講習が必要なため①は誤り。高所作業車の運転で特別教育の対象は作業床の高さが10m未満のもの。10m以上は技能講習が必要なため④も誤り。②③は正しい(特別教育で足りる)。' },
  { id:'q335', group:'施工管理', category:'特別教育', chapter:'2章', stars:5, question:'労働者を業務に従事させるにあたり特別教育が必要な業務として、「労働安全衛生法令」上、正しいものを全て選べ。', options:['吊り上げ荷重が0.9tの移動式クレーンの運転の業務(道路上を走行させる運転を除く)','地下に敷設された電線に接続するためのマンホールの内部における作業に係る業務','作業床の高さが8mの高所作業車の運転の業務(道路上を走行させる運転を除く)','高圧の充電電路の敷設の業務'], answer:0, explanation:'①~④いずれも特別教育の対象。0.9t未満の移動式クレーン運転、酸素欠乏危険作業に該当するマンホール内作業、10m未満(8m)の高所作業車運転、高圧充電電路の敷設・点検・修理は全て特別教育が必要な業務である(全て正しい)。' },
  { id:'q336', group:'施工管理', category:'酸欠危険作業', chapter:'2章', stars:5, question:'酸素欠乏危険作業に関する記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['酸素欠乏とは、空気中の酸素濃度が、21%未満の状態である','作業場所において、酸素欠乏のおそれがあるため、酸素欠乏のおそれがないことを確認するまでの間、その場所に特に指名した者以外の者が立ち入ることを禁止し、かつ、その旨を見やすい箇所に表示する','地下に設置されたマンホール内での光ファイバケーブル敷設作業は、酸素欠乏危険場所における作業に該当しないため、酸素欠乏危険作業主任者の選任は不要である','酸素欠乏危険場所における空気中の酸素濃度測定は、午前、午後の各1回測定しなければならない'], answer:0, explanation:'酸素欠乏とは酸素濃度18%未満の状態であり、21%未満ではないため①は誤り。マンホール内は酸素欠乏危険場所に該当し作業主任者(技能講習修了者)の選任が必要なため③も誤り。酸素濃度測定はその日の作業開始前に実施するもので、午前午後各1回ではないため④も誤り。②は正しい。' },
  { id:'q337', group:'施工管理', category:'酸欠危険作業', chapter:'2章', stars:5, question:'酸素欠乏危険作業に関する次の記述のうち、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['酸素欠乏危険場所における空気中の酸素濃度測定は、午前、午後の各1回測定しなければならない','作業を行うにあたり、当該現場で行う特別の教育を受けた者のうちから、酸素欠乏危険作業主任者を選任する','地下に敷設されたケーブルを収容するマンホール内部での作業は、酸素欠乏危険作業である','空気中の酸素濃度が18%未満の状態は、酸素欠乏である'], answer:0, explanation:'酸素濃度測定はその日の作業開始前に実施すべきもので、午前午後各1回ではないため①は誤り。作業主任者には特別教育ではなく技能講習の修了者を選任する必要があるため②も誤り。③④は正しい。' },
  { id:'q338', group:'施工管理', category:'施工計画全般', chapter:'2章', stars:5, question:'施工計画書を作成する上での基本事項に関する記述として、適当でないものを全て選べ。', options:['施工計画は、仮設、工法の工事目的物を完成するために必要な一切の手段について、過去の実績や経験を生かし、実績の少ない新工法、新技術は控えて作成する','施工計画書の作成にあたっては、基本方針を十分に把握し施工することはもちろん、生産性の向上、環境保全に関しても検討することが重要である','施工計画作成にあたっては、工事の目的・内容・契約条件、現場条件、全体工法、施工方法といった基本方針を考慮するものとする','施工計画を立てる上で、現場調査は重要な要素であるが、現地調査を行い、諸条件のチェックは、施工計画書の提出後に行うことが一般的である'], answer:0, explanation:'施工計画では過去の実績だけでなく、実績の少ない新工法・新技術にも積極的に関心をもって取り入れる姿勢が必要であり①は不適当。現地調査による諸条件のチェックは施工計画書の提出前に実施しなければならず④も不適当。②③は適当。' },
  { id:'q339', group:'施工管理', category:'事前調査', chapter:'2章', stars:5, question:'施工計画立案時の事前調査に関する記述として、適当でないものを全て選べ。', options:['事前調査には、工事内容と契約条件を把握するための契約条件の確認と、現場の諸条件を把握するための現場条件の調査がある','現場条件の調査は、調査項目が多いので、脱落がないようにするため特性要因図を作成しておくのがよい','現場条件の調査の精度を高めるためには、複数の人で調査したり、調査回数を重ねるとともに、個人的偶発的な要因による錯誤や調査漏れを取り除くことが必要である','不可抗力による損害の取り扱いや工事代金の支払条件の確認は、現場条件の調査に該当する'], answer:1, explanation:'調査項目の脱落を防ぐにはチェックリスト等を作成するのがよく、特性要因図は品質管理の場面で用いる図表であるため②は不適当。不可抗力による損害の取扱いや工事代金の支払条件の確認は契約条件の確認に該当し現場条件の調査ではないため④も不適当。①③は適当。' },
  { id:'q340', group:'施工管理', category:'施工計画留意事項', chapter:'2章', stars:5, question:'施工計画の作成にあたっての留意事項に関する記述として、適当でないものを全て選べ。', options:['施工計画の作成にあたっては、個人の考えや技術水準だけで計画せず、企業内の関係組織を活用して、全社的な技術水準で検討する','発注者の要求品質の確保を意識して、品質を最優先にした施工を基本とする施工計画を作成する','契約書、発注図面および工事仕様書に基づいて施工計画を作成すれば、現地調査を行わなくても現場条件や発注者の意向を十分反映できる','品質、工程、原価は相互に関連するため、これらの関係を考慮しながら、最善の施工計画を立てる'], answer:1, explanation:'施工計画は安全、品質、工程、環境、原価の5つの視点を軸に立案し、その中でも安全を最優先とすべきであり、品質を最優先とする②は不適当。契約書や図面だけでなく現地調査は必須であり、これなしに現場条件や発注者の意向を十分反映するのは考えにくいため③も不適当。①④は適当。' },
  { id:'q341', group:'施工管理', category:'施工計画留意事項', chapter:'2章', stars:5, question:'施工計画の作成にあたっての留意事項に関する記述として、適当でないものを全て選べ。', options:['個人の考えや技術水準だけで計画せず、企業内の関係組織を活用して、全社的な技術水準で検討する','発注者の要求品質や施工上の安全よりも、請負者の利益を最優先にした計画を策定する','施工計画は、1つの計画のみでなく、いくつかの代替案を作り比較検討のうえ最適案を採用する','発注者から示された工程が最適であるため、これを前提として、経済性や安全性、品質の確保も考慮しながら検討する'], answer:1, explanation:'請負者の利益を最優先にすることは好ましくなく、安全を最優先に品質・工程・環境・原価等の広い視野をもって計画すべきであり②は不適当。発注者から示された工程は必ずしも最適とは限らず、現実的な工程が提示される可能性が高いため、これを前提とする④も不適当。①③は適当。' },
  { id:'q342', group:'施工管理', category:'施工計画書', chapter:'2章', stars:5, question:'新築工事の着手に先立ち、工事の総合的な計画をまとめた施工計画書に記載するものとして、不適当なものを全て選べ。', options:['現場施工体制表','総合工程表','機器承諾図','官公庁届出書類一覧'], answer:2, explanation:'施工図は施工計画書の後に作成する書類の代表格であり、機器承諾図はこの施工図に含まれるものである。順序関係から機器承諾図は施工計画書には含まれないため③が不適当。①②④はいずれも施工計画書に含まれる。' },
  { id:'q343', group:'施工管理', category:'施工体制台帳', chapter:'2章', stars:5, question:'施工体制台帳の記載上の留意事項に関する記述として、適当でないものを全て選べ。', options:['施工体制台帳の作成にあたっては、下請負人に関する事項も必ず作成建設業者が自ら記載しなければならない','作成建設業者の建設業の種類は、請け負った建設工事にかかる建設業の種類に関わることなく、その全てについて特定建設業の許可か一般建設業の許可かのいずれかを明示して記載する','「健康保険等の加入状況」は、健康保険、厚生年金保険および労災保険の加入状況についてそれぞれ記載する','記載事項について変更があったときは、遅滞なく、当該変更があった年月日を付記して、既に記載されている事項に加えて、変更後の事項を記載しなければならない'], answer:0, explanation:'下請が階層的になっていると元請は二次下請以下の情報を把握しにくいため、再下請通知等により各社が協力して記載するのが実務上妥当であり、元請が全て自ら記載しなければならないとする①は不適当。「加入状況」の記載欄は健康保険・厚生年金保険・雇用保険の3点で、労災保険ではないため③も不適当。②④は適当。' },
  { id:'q344', group:'施工管理', category:'施工体制台帳', chapter:'2章', stars:5, question:'民間工事における施工体制台帳および施工体系図の作成等に関する記述として、「建設業令」上、誤っているものを全て選べ。', options:['特定建設業者が発注者より直接建設工事を請け負った場合において、下請に発注しない場合であっても、施工体制台帳および施工体系図を作成しなければならない','施工体制台帳は、工事現場ごとに備え置かなければならない','施工体制台帳の備置きおよび施工体系図の掲示は、建設工事の目的物の引渡しをするまで行わなければならない','施工体系図は、当該工事現場の見やすい場所に掲げなければならない'], answer:0, explanation:'元請負人が施工体制台帳・施工体系図を作成しなければならないのは下請契約を締結する場合に限られる。全ての作業を自社のみで完結する場合には作成義務はないため①は誤り。②③④は正しい。' },
  { id:'q345', group:'施工管理', category:'届出書等', chapter:'2章', stars:5, question:'建設工事における法令に基づく申請書等とその提出先に関する記述として、適当でないものを全て選べ。', options:['つり足場を90日間設置するため、機器等設置届を所轄労働基準監督署長に届け出る','騒音規制法の指定地域内で、特定建設作業を伴う建設工事を実施するため、特定建設作業実施届出書を市町村長に届け出る','道路において工事を行うため、道路使用許可申請書を道路管理者に提出して許可を受ける','限度超過車両(特殊車両)による運搬のため、特殊車両通行許可申請書を所轄警察署長に提出して許可を受ける'], answer:2, explanation:'道路使用許可申請書の提出先は所轄警察署長であり道路管理者ではないため③は不適当。特殊車両通行許可申請書の提出先は道路管理者であり警察署長ではないため④も不適当。①②は正しい。' },
  { id:'q346', group:'施工管理', category:'届出書等', chapter:'2章', stars:5, question:'法令に基づく申請書等の提出先に関する記述として、適当でないものを全て選べ。', options:['自家用電気工作物の使用開始後に自家用電気工作物使用開始届出書を都道府県知事に提出する','国定公園の特別地域内に、木を伐採して工事用の資材置き場を確保するため、特別地域内木竹の伐採許可申請書を都道府県知事に提出する','ハロゲン化物消火設備の設置工事を行ったため、工事整備対象設備等着工届出書を消防長または消防署長に届け出る','航空障害灯の設置後に遅滞なく、航空障害灯の設置について(届出)を、地方整備局長に届け出る'], answer:0, explanation:'自家用電気工作物使用開始届出書の提出先は経済産業大臣であり都道府県知事ではないため①は不適当。航空障害灯の設置届出先は地方航空局長であり地方整備局長ではないため④も不適当。②③は正しい。' },
  { id:'q347', group:'有線・線路施工', category:'低圧配線施工', chapter:'2章', stars:5, question:'低圧ケーブルの屋内配線に関する記述として、適当でないものを全て選べ。', options:['はしご形ケーブルラックに配線する場合、ケーブルは整然と並べ、水平部では5m以下の間隔ごとに固定する','低圧配線ケーブル(単心以外)を配線する場合は、ケーブルの曲げ半径(内側半径)を仕上がり外径の6倍以上として敷設する','二重床内配線において、ころがし配線として弱電流線と接触するおそれがある場合は、セパレータにより接触しないように処置する','平形保護層配線において、電力用フラットケーブルとフラットケーブル状の弱電流線を平行して敷設する場合は、できるだけ離して離隔距離を0.1m以上とする'], answer:0, explanation:'ケーブルラックの水平部の固縛間隔は3m以下(垂直部は1.5m以下)とする必要があり、5m以下は誤りのため①が不適当。②③④は適当な記述。' },
  { id:'q348', group:'有線・線路施工', category:'低圧配線施工', chapter:'2章', stars:5, question:'低圧ケーブルの屋内配線の施工に関する記述として、適当でないものを全て選べ。', options:['通信ケーブルと接近する箇所では、通信ケーブルから5cm離して配線した','使用電圧が415Vで、重量物の圧力を受けるおそれがある場所であったため、防護のため長さ3mの厚保護管等により防護し、その配管にはD種接地工事を施した','ピット内に余裕がなかったため、屈曲部の内側半径をケーブル仕上がり外径寸法の5倍以下の曲がりをとった','400V回路で使用する電路において、低圧ケーブルと大地間との間の絶縁抵抗値が0.2MΩ以上であることを確認した'], answer:1, explanation:'接地工事は電圧で区分され、300V超はC種、300V以下はD種となる。415Vは300V超のためC種接地工事が必要でD種は誤り。曲げ半径は仕上り外径の6倍以上を目安とすべきで5倍以下は不適当。低圧電路の絶縁抵抗は対地電圧300V超の場合0.4MΩ以上が必要で0.2MΩでは不足のため不適当。①は適当。' },
  { id:'q349', group:'有線・線路施工', category:'メタル系配線', chapter:'2章', stars:5, question:'通信用メタルケーブルの屋内配線に関する記述として、適当でないものを全て選べ。', options:['管内配線において、通線直前に管内を清掃し、通信用メタルケーブルを破損しないように通線する','ケーブルラック配線において、通信用メタルケーブルを垂直に敷設する場合は、特定の子桁に集約して捕縛する','床上配線では、ワイヤープロテクタを使用して配線し、ワイヤープロテクタから通信用メタルケーブルを引出す箇所には、被覆を損傷するおそれがある場合に保護を行う','ころがし配線において、既設低圧ケーブルの上に通信用メタルケーブルを直接乗せて交差させる'], answer:1, explanation:'ケーブルラック垂直部で捕縛する際は特定の子桁に集約せず捕縛箇所を分散させ、特定の子桁に重量が集中しないようにする必要があり②は不適当。ころがし配線で低圧ケーブルと通信ケーブルを直接接触させ交差させることは禁止で離隔が必要なため④も不適当。①③は適当。' },
  { id:'q350', group:'有線・線路施工', category:'メタル系配線', chapter:'2章', stars:5, question:'通信用メタルケーブルの屋内配線に関する記述として、適当なものを全て選べ。', options:['ケーブルを造営材に沿わせて敷設する場合で、ケーブルを曲げて固定する場合の曲げ半径は、特定の子桁を考慮して、ケーブルの仕上がり外径の2倍以下になるよう敷設する','垂直に敷設する管路内のケーブルは、プルボックス内の他の電気用および通信・情報用ケーブルを支持材として緊縛し、12m以内の間隔で支持する','ケーブルラック配線で電力用ケーブルと共に敷設される場合は、電力用ケーブルに積極的に整然と並べて敷設する','床上配線で、ワイヤープロテクタ等を使用してケーブルを敷設する場合は、室内のレイアウトを考慮し、ケーブルが摺曲しないよう保護して敷設する'], answer:3, explanation:'ケーブル工事(直接敷設)の曲げ半径は外径の4~10倍以上必要で、2倍以下とする①は不適当。垂直配管内のケーブルはプルボックス内の支持部材に捕縛するもので、他のケーブル類を支持材にしてはならず②も不適当。通信用と電力用ケーブルは離隔が必要で、積み重ねて敷設するとノイズの原因となるため③も不適当。④のみ適当。' },
  { id:'q351', group:'有線・線路施工', category:'UTPケーブル施工', chapter:'2章', stars:5, question:'UTPケーブルの施工に関する記述として、適当でないものを全て選べ。', options:['水平配線の配線後の許容曲げ半径は、ケーブル外径の4倍とした','ケーブルに過度の外圧が加わらないように固定した','水平配線の長さは、パッチコード等も含め150m以内とした','ケーブルの成端作業時、対の撚り戻し長は最大とした'], answer:2, explanation:'フロア配線盤から通信アウトレットまでの水平配線長は、パッチコードも含め最長100mが上限であり、150m以内とする③は不適当。撚り戻し長は通話漏話量を増大させるため最小となるよう努める必要があり、最大とする④も不適当。①②は適当。' },
  { id:'q352', group:'有線・線路施工', category:'同軸ケーブル施工', chapter:'2章', stars:5, question:'同軸ケーブルの施工に関する記述として、適当でないものを全て選べ。', options:['屋内配線において、同軸ケーブルが低圧ケーブルと交差する場合は、同軸ケーブルと低圧ケーブルが接触しないように敷設する','同軸ケーブルを曲げる場合、被覆が傷まないように行い、その曲げ半径は使用する同軸ケーブルの計器曲げ半径より小さくする','同軸ケーブルと機器との接続、同軸ケーブル相互の接続は、同軸ケーブルの種類に対応したコネクタを用いて行う','新4K8K衛星放送に対応した衛星放送用受信アンテナからテレビ受像機までの給線用として使用する同軸ケーブルには3C-2Vが適している'], answer:1, explanation:'ケーブルを曲げる際は許容曲げ半径より大きくなるようにしなければならず、小さく曲げると内部構造を破損させるため②は不適当。新4K8K衛星放送対応には衛星放送対応の同軸ケーブルが必要で、3C-2Vは衛星放送非対応のため④も不適当。①③は適当。' },
  { id:'q353', group:'有線・線路施工', category:'光ファイバ接続', chapter:'2章', stars:5, question:'光ファイバケーブルの接続に関する記述として、適当でないものを全て選べ。', options:['融着接続は、誘導加熱により光ファイバを直接加熱して溶かすことで接続する方法が一般的である','メカニカルスプライスは、光ファイバの端面と端面をV溝や精密パイプ内等で突き合わせ、機械的に保持固定する方法である','コネクタ接続は、比較的頻繁に接続替えが行われる可能性のある箇所に使用される','融着接続やメカニカルスプライスは永久接続であり、コネクタ接続は着脱可能な接続である'], answer:0, explanation:'融着接続の加熱方式は一般的にアーク放電式が用いられ、光ファイバの先端を2,000℃以上に加熱溶融して接続を行う。誘導加熱ではないため①は不適当。②③④は適当な記述。' },
  { id:'q354', group:'有線・線路施工', category:'光ファイバ施工', chapter:'2章', stars:5, question:'光ファイバケーブルの施工に関する記述として、適当でないものを全て選べ。', options:['一定方向への延線が困難な場合や、敷設張力が光ファイバケーブルの許容張力を超えるおそれがある箇所には、敷設ルートの途中で光ファイバケーブルの8の字取りを行う','光ファイバケーブルの引張り端は、テンションメンバに張力がかかるように、ケーブル端末から浸水しないように防水処置を施す','ノンメタリック光ファイバケーブルを使用する場合は、誘導雷サージ対策として、テンションメンバを接地する','光ファイバケーブルの許容曲げ半径を超えて曲げないように敷設する'], answer:2, explanation:'ノンメタリック仕様の光ファイバケーブルは中心のテンションメンバがFRP繊維で作られ金属製ではないため、接地する効果はなく③が不適当。①②④は適当。' },
  { id:'q355', group:'有線・線路施工', category:'ケーブルラック施工', chapter:'2章', stars:5, question:'屋内に設置する金属製のケーブルラックの施工に関する記述として、適当でないものを全て選べ。', options:['アルミ製ケーブルラックは、支持物との間に異種金属腐食による腐食を起こさないよう措置する','温度変化の大きな箇所に施設する直線部分の長いケーブルラックには、伸縮継手金具を使用する','使用電圧が300V以下の低圧ケーブルの配線に使用するケーブルラックには、B種接地工事を施す必要がある','ケーブルラック本体相互は、ボルト等により機械的に接続するものとし、電気的には接続してはならない'], answer:2, explanation:'接地工事はA種・B種(高圧用)、C種・D種(低圧用で300V超がC種、300V以下がD種)に区分される。300V以下のケーブルラックにはD種接地工事が必要でB種とする③は不適当。ケーブルラック本体相互は機械的接続に加え、両者間を等電位に保つための電気的な接続も必要であり④も不適当。①②は適当。' },
  { id:'q356', group:'有線・線路施工', category:'合成樹脂管施工', chapter:'2章', stars:5, question:'屋内配線に使用する合成樹脂管の施工に関する記述として、適当でないものを全て選べ。', options:['CD管相互の接続は、適合するカップリングにより接続する','太さ28mmの硬質ビニル管を曲げるときは、その内側の半径を管内径の5倍以上とする','PF管の露出配管において管を支持する場合、サドルの支持点間の距離を2m以下とする','コンクリートに埋め込みとなる配管では、管をバインド線で鉄筋に結束し、コンクリート打設時に移動しないようにする'], answer:1, explanation:'合成樹脂可とう電線管の曲げ半径は、太さが22mmを超える場合、管内径の6倍以上とする必要があり、5倍以上とする②は不適当。可とう電線管の造営材への支持点間距離は1m以下と定められており、2m以下とする③も不適当。①④は適当。' },
  { id:'q357', group:'有線・線路施工', category:'架空配線', chapter:'2章', stars:5, question:'架空通信ケーブルと他の電線等との離隔距離に関する記述として、「有線電気通信法令」上、誤っているものを全て選べ。', options:['架空通信ケーブルと他の架空通信ケーブルとの離隔距離を40cmとする','架空通信ケーブルと他人の建造物との離隔距離を50cmとする','架空通信ケーブルと使用電圧が高圧の強電流ケーブルが交差するので、その離隔距離を35cmとする','架空通信ケーブルを強電流電線路の電柱に4径間連続して共架するので、当該電線路の電柱に設置されている使用電圧が高圧の強電流ケーブルとの離隔距離を25cmとする'], answer:2, explanation:'高圧の強電流ケーブルと通信ケーブルが交差する場合の離隔距離は50cm以上必要であり、35cmとする③は誤り。また強電流ケーブルと2か所以上連続して共架する場合も離隔距離は50cm以上必要であり、25cmとする④も誤り。' },
  { id:'q358', group:'有線・線路施工', category:'架空配線', chapter:'2章', stars:5, question:'架空配線に関する記述として、「有線電気通信法令」上、誤っているものを全て選べ。', options:['横断歩道橋の上に架空配線を行うにあたり、その架空配線の横断歩道橋の路面からの高さを2.5mとする','道路の縦断方向に架空配線を行うにあたり、その架空配線の路面からの高さを4.5mとする','鉄道を横断する架空配線を行うにあたり、その架空配線の軌条面からの高さを5.5mとする','河川を横断する架空配線を行うにあたり、その架空配線を舟行に支障を及ぼすおそれがない高さとした'], answer:0, explanation:'横断歩道橋上の架空配線は路面から3m以上必要であり2.5mとする①は誤り。道路上は路面から5m以上必要であり4.5mとする②も誤り。鉄道・軌道を横断する場合は軌条面から6m以上必要であり5.5mとする③も誤り。河川は舟行に支障を及ぼさない高さとの定めのみで④は正しい。' },
  { id:'q359', group:'施工管理', category:'各種工程表', chapter:'2章', stars:5, question:'工程表の種類と特徴に関する記述として、適当なものを全て選べ。', options:['バーチャートは、各部分工事の工期に対する影響の度合いが把握できる','バーチャートは、縦軸に出来高比率をとり、横軸に工期をとって工事全体の出来高比率の累計を曲線で表した図表である','ガントチャートは、縦軸に部分工事をとり、横軸に各部分工事の出来高比率を棒線で記入した図表である','ガントチャートは、各部分工事に必要な日数を把握できない'], answer:2, explanation:'バーチャートは各部分工事の開始日・終了日はわかるが、全体工期への影響度合いは把握できないため①は不適当。②は出来高累計曲線の説明であり不適当。③はガントチャートの説明として適当。④はガントチャートが横軸に時間を配置しないため所要日数の算出ができないという内容で適当。' },
  { id:'q360', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'下図に示すバナナカーブによる工程管理に関する次の記述の[ ]に当てはまる語句の組み合わせとして、適当なものはどれか。時間経過率に応じた当該工事の出来高比率をプロットし、その出来高比率が、上方許容限界曲線と下方許容限界曲線の[ア]にあれば良く、下方許容限界曲線の[イ]にある場合は工程の進捗が遅れており、上方許容限界曲線の[ウ]にある場合は人員や機械の配置が過多であることが考えられる。', options:['(ア)上 (イ)上 (ウ)上','(ア)間 (イ)下 (ウ)下','(ア)間 (イ)下 (ウ)上','(ア)上 (イ)下 (ウ)下'], answer:2, explanation:'バナナ曲線は過去の実績を基に作成した上方・下方許容限界曲線に囲まれた範囲が適正な進捗の範囲を示す。出来高比率が両曲線の間にあれば良好、下方許容限界曲線より下にあれば進捗遅れ、上方許容限界曲線より上にあれば人員・機械の配置過多と判断する。' },
  { id:'q361', group:'施工管理', category:'工程管理', chapter:'2章', stars:5, question:'工程管理曲線の代表的なものであるバナナ曲線に関する記述として、適当でないものを全て選べ。', options:['バナナ曲線の上方許容限界曲線や下方許容限界曲線は、過去の工事実績データから作成される','予定工程曲線がバナナ曲線の許容限界範囲内に入らない場合は、一般に不合理な工程計画と考えられ、工程計画の調整を行う必要がある','バナナ曲線によって管理する工程曲線は出来高累計曲線で描かれるが、実施工程曲線は直線で表現される','実施工程曲線が上方許容限界曲線より上にいく場合は、工程遅延により突貫工事を必要とする場合が多く、最適な手法を考えなければならない'], answer:2, explanation:'予定工程曲線・実施工程曲線ともに出来高累計曲線と同様にS字曲線で描かれ、直線ではないため③は不適当。実施線が上方許容限界曲線より上になった場合は工程が進み過ぎている状況を示し、工程遅延で突貫工事が必要になるのは実施線が下方許容限界曲線より下に来た場合であるため④も不適当。' },
  { id:'q362', group:'施工管理', category:'各種工程表', chapter:'2章', stars:5, question:'タクト工程表に関する記述として、適当なものを全て選べ。', options:['縦軸にその建物の階層を取り、横軸に出来高比率を取った工程表である','高層ビルの繰り返し行われる作業の工程管理に適している','全体の稼働人数の把握が容易で、工期の遅れ等による変化への対応が容易である','バーチャート工程表に比べ、他の作業との関連性が理解しやすい'], answer:1, explanation:'タクト工程表は縦軸に建物の階層、横軸に時間(日数)を配置する工程表であり出来高比率ではないため①は不適当。フロア全体の作業内容を1セットとして繰り返す高層ビル工事の工程管理に適しており②は適当。フロア全体を1単位で計画できるため人員・機械の把握や対応が容易であり③も適当。フロア間の関連性は明確だが特定作業と他作業との詳細な関連性は把握しにくく④は不適当。' },
  { id:'q363', group:'施工管理', category:'各種工程表', chapter:'2章', stars:5, question:'建設工事の工程管理に用いられる斜線式工程表に関する記述として、適当なものを全て選べ。', options:['斜線式工程表は、横軸に工期(日数)、縦軸に各部分工事の出来高比率をとったものである','斜線式工程表は、工事の進行方向が一定の方向にしか進捗できない工事によく用いられる','斜線式工程表は、工事のクリティカルパスがわかる','斜線式工程表は、工事の施工場所と日数の関係を明確にすることができる'], answer:1, explanation:'斜線式工程表は縦軸に工期(日数)、横軸に工事延長等の距離を配置する形式であり①は不適当。トンネルや舗装工事のように一方向に進行する性質の工事に用いられ②は適当。クリティカルパスが算出可能なのはネットワーク工程表のみであり③は不適当。各工種の作業を1本の斜線で表現し、場所と日程との関係が読み取れる特徴があり④は適当。' },
  { id:'q364', group:'施工管理', category:'各種工程表', chapter:'2章', stars:5, question:'工程管理における作業人員や資材の山積みや山崩しに関する記述として、適当なものを全て選べ。', options:['作業人員の山積みで凹部になっている部分は、作業のネックになる部分であるため、作業人員を増員する','山積みでは、作業を進めるのに必要な作業人員や資材の日々の累計を計算して、その状況を把握する','他工事の完了後に行われる工事であっても、独自の工法で先行して作業を進めることができれば山崩しを図れる','山崩しでは、許容される余裕の範囲を超えて作業を遅らせることによって、作業の平準化を図る'], answer:1, explanation:'山積みの凹部は縦軸方向のリソースが少ない箇所を示すだけでボトルネックの意味ではなく①は不適当。山積みは作業の順序と各作業に要する資源(人員や資材)の配置を棒グラフで示し、その状況を把握するもので②は適当。前後関係を工夫や順序調整することで可能な場合に山崩しを図れ③は適当。山崩しは全体工期を守ることが前提であり、許容される余裕の範囲を超えて作業を遅らせることは避けるべきであり④は不適当。' },
  { id:'q365', group:'施工管理', category:'品質管理', chapter:'2章', stars:5, question:'JIS Q 9000:2015の品質マネジメントシステムー基本および用語における品質特性の定義として、適当なものはどれか。', options:['要求事項に関連する、対象に本来備わっている特性','特徴付けている性質','測定結果に影響を与え得る特性','対象に本来備わっている特性の集まりが、要求事項を満たす程度'], answer:0, explanation:'「要求事項に関連する、対象に本来備わっている特性」が品質特性の定義であり①が適当。②は「特性」、③は「計測特性」、④は「品質」の定義であり、それぞれ品質特性とは異なる用語の説明となる。' },
  { id:'q366', group:'施工管理', category:'QC7つ道具', chapter:'2章', stars:5, question:'下図の管理図が示す工程の状態に関する記述として、適当なものはどれか。（上方管理限界・中心線・下方管理限界を持つ折れ線グラフで、点が上下に細かく変動しているが、そのうち中心線より上側に9個連続して並んでいる区間がある）', options:['全ての点が上下2本の管理限界線の内にあるが、点が次第に上昇する傾向にあるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、点が次第に下降する傾向にあるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、中心線より上の側に点が9個連続して並んでいるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、隣り合う点が周期的に上下しているため、工程に異常がある'], answer:2, explanation:'管理図の異常判定ルール(JIS Z 9021)のうち、「連続する9点以上が中心線に対して同じ側にある」場合は工程に異常があると判定する。図では中心線より上側に点が9個連続しており③が該当する。', figure:'<svg viewBox="0 0 320 180" style="width:100%;max-width:360px;margin:0 auto;display:block">       <line x1="20" y1="30" x2="300" y2="30" stroke="#e53935" stroke-width="1.2" stroke-dasharray="3 2"/>       <line x1="20" y1="150" x2="300" y2="150" stroke="#e53935" stroke-width="1.2" stroke-dasharray="3 2"/>       <line x1="20" y1="90" x2="300" y2="90" stroke="#999" stroke-width="1" stroke-dasharray="2 2"/>       <text x="302" y="33" font-size="10">UCL</text>       <text x="302" y="153" font-size="10">LCL</text>       <text x="302" y="93" font-size="10">CL</text>       <polyline points="30,60 55,55 80,50 105,45 130,60 155,42 180,48 205,40 230,45 255,38 280,50" fill="none" stroke="#1e88e5" stroke-width="2"/>       <g fill="#1e88e5">         <circle cx="30" cy="60" r="3"/><circle cx="55" cy="55" r="3"/><circle cx="80" cy="50" r="3"/>         <circle cx="105" cy="45" r="3"/><circle cx="130" cy="60" r="3"/><circle cx="155" cy="42" r="3"/>         <circle cx="180" cy="48" r="3"/><circle cx="205" cy="40" r="3"/><circle cx="230" cy="45" r="3"/>         <circle cx="255" cy="38" r="3"/><circle cx="280" cy="50" r="3"/>       </g>       <text x="20" y="15" font-size="11">※ 中心線(CL)より上に点が9個連続</text>     </svg>' },
  { id:'q367', group:'施工管理', category:'原価管理', chapter:'2章', stars:5, question:'次に示す利益図表に関する記述として、適当なものはどれか。（横軸に施工出来高、縦軸に工事原価をとったグラフで、固定原価線・変動原価線・売上線が示され、損益分岐点が図示されている）', options:['減価償却される自社所有の建設用機械のコストは、固定費のための固定原価に該当する','工事原価は、固定原価、変動原価、利益に区分される','労務費は、固定費であるため固定原価に該当する','施工出来高が増え損益分岐点を超えると利益が出なくなる'], answer:0, explanation:'減価償却費は工事案件の進捗状況に左右されないため固定費であり①は適当。工事原価は固定原価と変動原価の2種に区分され、利益は工事原価には含まれないため②は不適当。労務費は必ずしも固定費とは限らず、残業や派遣人員の増加等により変動的な要素も含むため③は不適当。損益分岐点を超えると利益が出るようになるため④は不適当。', figure:'<svg viewBox="0 0 320 220" style="width:100%;max-width:360px;margin:0 auto;display:block">   <line x1="35" y1="190" x2="300" y2="190" stroke="currentColor" stroke-width="1.5"/>   <line x1="35" y1="190" x2="35" y2="15" stroke="currentColor" stroke-width="1.5"/>   <text x="270" y="205" font-size="11">施工出来高</text>   <text x="5" y="15" font-size="11">工事原価</text>   <line x1="35" y1="150" x2="300" y2="150" stroke="#1e88e5" stroke-width="2"/>   <text x="240" y="145" font-size="10" fill="#1e88e5">固定原価線</text>   <line x1="35" y1="150" x2="290" y2="60" stroke="#e53935" stroke-width="2"/>   <text x="230" y="80" font-size="10" fill="#e53935">変動原価加算線(総原価)</text>   <line x1="35" y1="190" x2="290" y2="30" stroke="#43a047" stroke-width="2"/>   <text x="230" y="45" font-size="10" fill="#43a047">売上線</text>   <circle cx="165" cy="105" r="4" fill="#333"/>   <text x="170" y="100" font-size="10" font-weight="bold">損益分岐点</text> </svg>' },
  { id:'q368', group:'電気・電子理論', category:'論理式', chapter:'3章', stars:4, question:'下図に示す論理回路において、出力Fの論理式として、適当なものはどれか。ただし、論理変数A、Bに対して、A＋Bは論理和を表し、A・Bは論理積を表す。', options:['A','Ā・B＋A・B̄','A・B','A・B＋Ā・B̄'], answer:2, explanation:'ド・モルガンの法則(Ā+B=Ā・B̄、Ā・B=Ā+B̄)と「A+1=1」の関係を使って式を整理する。出力F=Ā・B+A・B̄を変形すると、Ā+B(A+1)=Ā+B・A・Ā+B・B̄などを経て最終的にĀ・B+A・B̄=A・Bとなる。したがって③が適当。', figure:'<svg viewBox="0 0 320 220" style="width:100%;max-width:360px;margin:0 auto;display:block">   <text x="10" y="60" font-size="13">A</text>   <text x="10" y="140" font-size="13">B</text>   <line x1="25" y1="55" x2="70" y2="55" stroke="currentColor" stroke-width="1.5"/>   <line x1="25" y1="135" x2="70" y2="135" stroke="currentColor" stroke-width="1.5"/>   <path d="M70,40 h30 a25,25 0 0 1 0,50 h-30 z" fill="none" stroke="#1e88e5" stroke-width="2"/>   <text x="78" y="70" font-size="10" fill="#1e88e5">AND</text>   <line x1="125" y1="65" x2="150" y2="65" stroke="currentColor" stroke-width="1.5"/>   <circle cx="158" cy="65" r="8" fill="none" stroke="#e53935" stroke-width="2"/>   <text x="150" y="90" font-size="10" fill="#e53935">NOT</text>   <line x1="166" y1="65" x2="230" y2="65" stroke="currentColor" stroke-width="1.5"/>   <path d="M230,50 h30 a25,25 0 0 1 0,30 h-30 a20,20 0 0 0 0,-30 z" fill="none" stroke="#43a047" stroke-width="2"/>   <text x="235" y="100" font-size="10" fill="#43a047">OR</text>   <line x1="70" y1="150" x2="230" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="230" y1="150" x2="230" y2="80" stroke="currentColor" stroke-width="1.5"/>   <line x1="285" y1="65" x2="310" y2="65" stroke="currentColor" stroke-width="1.5"/>   <text x="290" y="55" font-size="13" font-weight="bold">F</text> </svg>' },
  { id:'q369', group:'電気・電子理論', category:'論理式', chapter:'3章', stars:4, question:'下図に示す論理回路において、出力Fの論理式として、適当なものはどれか。', options:['A','Ā・B＋A・B̄','B','A・B＋Ā・B̄'], answer:3, explanation:'前問と同様にA、Bの変数を進めると、出力はĀ・B+A・B̄となる。A・Ā=0であることを踏まえてド・モルガンの法則等で式を整理すると、Ā・B+A・B̄=(Ā+B̄)・(A+B)=A・Ā+A・B+Ā・B̄+B・B̄=A・B+Ā・B̄となる。したがって④が適当。', figure:'<svg viewBox="0 0 320 220" style="width:100%;max-width:360px;margin:0 auto;display:block">   <text x="10" y="60" font-size="13">A</text>   <text x="10" y="140" font-size="13">B</text>   <circle cx="35" cy="55" r="6" fill="none" stroke="#e53935" stroke-width="2"/>   <text x="5" y="40" font-size="9" fill="#e53935">NOT</text>   <line x1="41" y1="55" x2="80" y2="55" stroke="currentColor" stroke-width="1.5"/>   <line x1="25" y1="135" x2="80" y2="135" stroke="currentColor" stroke-width="1.5"/>   <path d="M80,40 h30 a25,25 0 0 1 0,50 h-30 z" fill="none" stroke="#1e88e5" stroke-width="2"/>   <text x="88" y="70" font-size="10" fill="#1e88e5">AND</text>   <line x1="135" y1="65" x2="310" y2="65" stroke="currentColor" stroke-width="1.5"/>   <text x="290" y="55" font-size="13" font-weight="bold">F</text> </svg>' },
  { id:'q370', group:'電気・電子理論', category:'論理式', chapter:'3章', stars:4, question:'下図に示す論理回路において、出力Fの論理式として、適当なものはどれか。', options:['A・B','A','Ā・B＋A・B̄','A・B＋Ā・B̄'], answer:1, explanation:'A+A=A、A+Ā=1、A・A=Aの性質を用いて計算する。出力Ā・B+Ā+A・B̄を整理していくと、最終的にA+A=Aとなる。したがって②が適当。', figure:'<svg viewBox="0 0 320 220" style="width:100%;max-width:360px;margin:0 auto;display:block">   <text x="10" y="60" font-size="13">A</text>   <text x="10" y="140" font-size="13">B</text>   <line x1="25" y1="55" x2="80" y2="55" stroke="currentColor" stroke-width="1.5"/>   <line x1="25" y1="135" x2="80" y2="135" stroke="currentColor" stroke-width="1.5"/>   <path d="M80,40 h30 a25,25 0 0 1 0,50 h-30 z" fill="none" stroke="#1e88e5" stroke-width="2"/>   <text x="88" y="70" font-size="10" fill="#1e88e5">OR</text>   <line x1="135" y1="65" x2="160" y2="65" stroke="currentColor" stroke-width="1.5"/>   <circle cx="168" cy="65" r="8" fill="none" stroke="#e53935" stroke-width="2"/>   <text x="155" y="90" font-size="10" fill="#e53935">NOT</text>   <line x1="176" y1="65" x2="310" y2="65" stroke="currentColor" stroke-width="1.5"/>   <text x="290" y="55" font-size="13" font-weight="bold">F</text> </svg>' },
  { id:'q371', group:'電気・電子理論', category:'電磁気学', chapter:'3章', stars:4, question:'次の図に示す磁性体の磁束密度B[T]と磁界の強さH[A/m]の曲線に関する記述として、適当なものはどれか。', options:['この曲線は、無負荷飽和曲線と呼ばれる','電磁石の鉄心の材料としては、残留磁気と保磁力が大きい強磁性体が適している','この曲線を一回りするときに消費される電気エネルギーは、この曲線内の面積に反比例する','この曲線のaは残留磁気を表し、bは保磁力を表す'], answer:3, explanation:'掲出のグラフはヒステリシス曲線(磁化曲線)であり、無負荷飽和曲線ではないので①は不適当。電磁石には残留磁気・保磁力が小さい材料が好ましいため②も不適当。曲線を一周する際に消費される電気エネルギー(ヒステリシス損)は曲線内の面積に比例するため③は不適当。aは残留磁気(残留磁束密度)、bは保磁力を表しており④が適当。', figure:'<svg viewBox="0 0 320 260" style="width:100%;max-width:360px;margin:0 auto;display:block">   <line x1="30" y1="130" x2="300" y2="130" stroke="currentColor" stroke-width="1.5"/>   <line x1="160" y1="230" x2="160" y2="20" stroke="currentColor" stroke-width="1.5"/>   <text x="290" y="145" font-size="11">H</text>   <text x="165" y="30" font-size="11">B</text>   <path d="M60,120 C90,40 200,30 270,60" fill="none" stroke="#1e88e5" stroke-width="2"/>   <path d="M270,60 C230,110 260,180 60,120" fill="none" stroke="#1e88e5" stroke-width="2"/>   <circle cx="160" cy="60" r="4" fill="#e53935"/>   <text x="168" y="55" font-size="10" fill="#e53935">a (残留磁束密度)</text>   <circle cx="95" cy="130" r="4" fill="#43a047"/>   <text x="60" y="150" font-size="10" fill="#43a047">b (保磁力)</text> </svg>' },
  { id:'q372', group:'電気・電子理論', category:'電磁気学', chapter:'3章', stars:4, question:'右図に示すように、真空中にr=0.1[m]の間隔で平行に置いた無限に長い2本の直線導体に、同じ向きにI₁=I₂=2[A]の電流が流れているとき、導体1mあたりに働く力F[N/m]として、適当なものはどれか。ただし、真空中の透磁率μ₀=4π×10⁻⁷[H/m]とする。', options:['4×10⁻⁶[N/m]','8×10⁻⁶[N/m]','16×10⁻⁶[N/m]','25×10⁻⁶[N/m]'], answer:1, explanation:'F=μ₀×I₁I₂/(2πr)の式に数値を代入する。F=4π×10⁻⁷×(2×2)/(2π×0.1)=4×10⁻⁷×2×10=8.0×10⁻⁶[N/m]。したがって②が適当。電流の向きが同じ場合は導線同士が引き合い、逆向きの場合は反発し合う(フレミングの法則で説明できる)。', figure:'<svg viewBox="0 0 320 200" style="width:100%;max-width:360px;margin:0 auto;display:block">   <line x1="100" y1="20" x2="100" y2="180" stroke="#1e88e5" stroke-width="3"/>   <line x1="220" y1="20" x2="220" y2="180" stroke="#1e88e5" stroke-width="3"/>   <text x="80" y="15" font-size="12">A</text>   <text x="215" y="15" font-size="12">B</text>   <polygon points="95,40 105,40 100,25" fill="#e53935"/>   <polygon points="215,40 225,40 220,25" fill="#e53935"/>   <text x="70" y="105" font-size="10">I₁</text>   <text x="225" y="105" font-size="10">I₂</text>   <line x1="100" y1="190" x2="220" y2="190" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>   <text x="145" y="205" font-size="11">r [m]</text> </svg>' },
  { id:'q373', group:'電気・電子理論', category:'コンデンサ', chapter:'3章', stars:4, question:'下図に示すように、電極間の距離d₀=0.02[mm]、電極の面積S=100[cm²]の平行板空気コンデンサにおいて、電極間に厚さd₁=0.01[mm]、比誘電率εᵣ=10の誘電体を挿入し、電極間に充電電圧V=24[V]を与えたときの、このコンデンサが蓄える電気量Q[μC]の値として、適当なものはどれか。ただし、コンデンサの初期電荷は0とし、端効果は無視できるものとする。また、真空の誘電率ε₀=8.85×10⁻¹²[F/m]、空気の比誘電率を1とする。', options:['0.01[μC]','0.19[μC]','0.30[μC]','2.3[μC]'], answer:1, explanation:'比誘電率εᵣ=10の誘電体を電極間距離の半分のみ挿入しているため、真空(空気)部分と誘電体部分とで作られる2つのコンデンサが直列につながっているとして計算する。真空部分の静電容量C₀=ε₀×S/(d₀-d₁)=8.85×10⁻⁹[F]、誘電体部分の静電容量Cᵣ=εᵣ×ε₀×S/d₁=8.85×10⁻⁸[F]。これらの合成静電容量は和分の積で C=8.045×10⁻⁹[F]。電気量Q=C・V=8.045×10⁻⁹×24=0.193×10⁻⁴[C]≒0.19[μC]。したがって②が適当。', figure:'<svg viewBox="0 0 320 200" style="width:100%;max-width:360px;margin:0 auto;display:block">   <line x1="60" y1="30" x2="60" y2="170" stroke="#333" stroke-width="4"/>   <line x1="260" y1="30" x2="260" y2="170" stroke="#333" stroke-width="4"/>   <text x="50" y="20" font-size="11">+Q</text>   <text x="250" y="20" font-size="11">−Q</text>   <rect x="150" y="30" width="40" height="140" fill="#bbdefb" opacity="0.6"/>   <text x="145" y="105" font-size="10">εr</text>   <line x1="60" y1="185" x2="260" y2="185" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>   <text x="140" y="198" font-size="10">d₀</text>   <line x1="150" y1="180" x2="190" y2="180" stroke="#1e88e5" stroke-width="2"/>   <text x="155" y="192" font-size="9" fill="#1e88e5">d₁</text> </svg>' },
  { id:'q374', group:'電気・電子理論', category:'直流回路', chapter:'3章', stars:4, question:'下図に示す最大目盛Iₐ=50[mA]、内部抵抗r=5.6[Ω]の電流計に分流器を接続して、測定範囲をI=0.4[A]まで拡大したときの分流器の倍率mと、分流器の抵抗RS[Ω]の値の組み合わせとして、適当なものはどれか。', options:['m=7, RS=0.9[Ω]','m=7, RS=0.8[Ω]','m=8, RS=0.9[Ω]','m=8, RS=0.8[Ω]'], answer:3, explanation:'電流計に流せる最大の電流は0.05[A]であり、残りの0.35[A]を分流器のルートに迂回させる。このときの電流計の両端にかかる最高電圧はE=I・R=0.05×5.6=0.28[V]。この電圧は分流器RSにも同様に印加されるため、RS=E/IS=0.28/0.35=0.8[Ω]。分流器の倍率mは「分流器がない場合と比較して、全体として何倍まで電流を流せるか」を指し、m=0.4/0.05=8となる。したがって④が適当。', figure:'<svg viewBox="0 0 320 200" style="width:100%;max-width:360px;margin:0 auto;display:block">   <circle cx="160" cy="70" r="30" fill="none" stroke="#1e88e5" stroke-width="2"/>   <text x="152" y="76" font-size="14" fill="#1e88e5">A</text>   <text x="130" y="35" font-size="10">Iₐ, r</text>   <line x1="60" y1="70" x2="130" y2="70" stroke="currentColor" stroke-width="1.5"/>   <line x1="190" y1="70" x2="260" y2="70" stroke="currentColor" stroke-width="1.5"/>   <line x1="60" y1="70" x2="60" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="260" y1="70" x2="260" y2="150" stroke="currentColor" stroke-width="1.5"/>   <rect x="130" y="140" width="60" height="20" fill="none" stroke="#e53935" stroke-width="2"/>   <text x="140" y="155" font-size="11" fill="#e53935">Rs</text>   <line x1="60" y1="150" x2="130" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="190" y1="150" x2="260" y2="150" stroke="currentColor" stroke-width="1.5"/>   <text x="15" y="75" font-size="11">I</text>   <text x="275" y="75" font-size="11">I</text> </svg>' },
  { id:'q375', group:'電気・電子理論', category:'直流回路', chapter:'3章', stars:4, question:'下図に示す回路において、抵抗R₂を流れる電流I₂[A]の値として、適当なものはどれか。ただし、抵抗R₁=4[Ω]、R₂=2[Ω]、R₃=2[Ω]とする。', options:['0.2[A]','0.7[A]','1.9[A]','2.3[A]'], answer:1, explanation:'キルヒホッフの法則を用いる。回路を一周する間、電流値は常に一定であることに着目し、外周を時計回りに一周する電流をI1[A]、右半分を時計回りに一周する電流をI2[A]とすると、抵抗R3を通る電流はI3=I1+I2となる。各ループについて電圧則を立てると、8-I1×R1-I3×R3=0、5-I2×R2-I3×R3=0という連立方程式が得られる。これらを解くとI2=0.7[A]となる。したがって②が適当。', figure:'<svg viewBox="0 0 320 220" style="width:100%;max-width:360px;margin:0 auto;display:block">   <rect x="40" y="90" width="50" height="20" fill="none" stroke="#333" stroke-width="2"/>   <text x="50" y="85" font-size="10">R₁</text>   <rect x="140" y="40" width="50" height="20" fill="none" stroke="#333" stroke-width="2"/>   <text x="150" y="35" font-size="10">R₂</text>   <rect x="140" y="140" width="50" height="20" fill="none" stroke="#333" stroke-width="2"/>   <text x="150" y="135" font-size="10">R₃</text>   <line x1="40" y1="100" x2="20" y2="100" stroke="currentColor" stroke-width="1.5"/>   <line x1="20" y1="100" x2="20" y2="50" stroke="currentColor" stroke-width="1.5"/>   <line x1="20" y1="50" x2="140" y2="50" stroke="currentColor" stroke-width="1.5"/>   <line x1="20" y1="100" x2="20" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="20" y1="150" x2="140" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="90" y1="100" x2="270" y2="100" stroke="currentColor" stroke-width="1.5"/>   <line x1="270" y1="100" x2="270" y2="50" stroke="currentColor" stroke-width="1.5"/>   <line x1="270" y1="50" x2="190" y2="50" stroke="currentColor" stroke-width="1.5"/>   <line x1="270" y1="100" x2="270" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="270" y1="150" x2="190" y2="150" stroke="currentColor" stroke-width="1.5"/>   <text x="0" y="45" font-size="10" fill="#1e88e5">8V</text>   <text x="0" y="165" font-size="10" fill="#1e88e5">5V</text>   <text x="200" y="75" font-size="10">I₁</text>   <text x="200" y="130" font-size="10">I₂</text> </svg>' },
  { id:'q376', group:'電気・電子理論', category:'交流回路', chapter:'3章', stars:4, question:'下図に示すRLC直列回路において、R=40[Ω]、X_L=20[Ω]、X_C=60[Ω]とするとき、インピーダンスの大きさZ[Ω]と回路の性質の組み合わせとして、適当なものはどれか。', options:['Z=40√2[Ω]、容量性','Z=40√2[Ω]、誘導性','Z=40√5[Ω]、容量性','Z=40√5[Ω]、誘導性'], answer:0, explanation:'直列接続の場合、合成インピーダンスの大きさを求める公式はZ=√(R²+(X_L-X_C)²)。数値を代入すると、Z=√(40²+(20-60)²)=√(40²×2)=40√2[Ω]。リアクタンスをベクトルで見た場合、コイル側に寄っていれば誘導性、コンデンサ側に寄っていれば容量性となる。本例題ではX_C寄りなので容量性の回路である。したがって①が適当。', figure:'<svg viewBox="0 0 320 160" style="width:100%;max-width:360px;margin:0 auto;display:block">   <line x1="20" y1="80" x2="60" y2="80" stroke="currentColor" stroke-width="1.5"/>   <rect x="60" y="70" width="45" height="20" fill="none" stroke="#333" stroke-width="2"/>   <text x="70" y="65" font-size="11">R</text>   <line x1="105" y1="80" x2="130" y2="80" stroke="currentColor" stroke-width="1.5"/>   <path d="M130,80 q8,-15 16,0 q8,-15 16,0 q8,-15 16,0" fill="none" stroke="#1e88e5" stroke-width="2"/>   <text x="140" y="65" font-size="11" fill="#1e88e5">L(X_L)</text>   <line x1="178" y1="80" x2="205" y2="80" stroke="currentColor" stroke-width="1.5"/>   <line x1="215" y1="65" x2="215" y2="95" stroke="#e53935" stroke-width="2"/>   <line x1="225" y1="65" x2="225" y2="95" stroke="#e53935" stroke-width="2"/>   <text x="205" y="112" font-size="11" fill="#e53935">C(X_C)</text>   <line x1="225" y1="80" x2="290" y2="80" stroke="currentColor" stroke-width="1.5"/>   <line x1="290" y1="80" x2="290" y2="130" stroke="currentColor" stroke-width="1.5"/>   <line x1="20" y1="80" x2="20" y2="130" stroke="currentColor" stroke-width="1.5"/>   <line x1="20" y1="130" x2="290" y2="130" stroke="currentColor" stroke-width="1.5"/>   <circle cx="20" cy="105" r="10" fill="none" stroke="#43a047" stroke-width="2"/>   <text x="0" y="110" font-size="10" fill="#43a047">V</text> </svg>' },
  { id:'q377', group:'電気・電子理論', category:'交流回路', chapter:'3章', stars:4, question:'下図に示すRLC並列回路において、回路のインピーダンスZ[Ω]として、適当なものはどれか。ただし、ωは電源の角周波数[rad/s]である。', options:['Z=1/(R+j(ωL-1/(ωC)))[Ω]','Z=1/(R+j(ωC-1/(ωL)))[Ω]','Z=R/(1+jR(ωC-1/(ωL)))[Ω]','Z=R/(1+jR(ωL-1/(ωC)))[Ω]'], answer:2, explanation:'抵抗、コイル、コンデンサの3素子が並列につながる回路の合成インピーダンスZを求めるには、それぞれのアドミタンス(インピーダンスの逆数、単位S)を足し合わせる。1/Z=1/R+1/(jωL)+jωCとなり、これを整理して逆数をとると、Z=R/(1+jR(ωC-1/(ωL)))[Ω]となる。したがって③が適当。', figure:'<svg viewBox="0 0 260 140" style="width:100%;max-width:300px;margin:0 auto;display:block">       <line x1="30" y1="20" x2="230" y2="20" stroke="currentColor" stroke-width="2"/>       <line x1="30" y1="120" x2="230" y2="120" stroke="currentColor" stroke-width="2"/>       <line x1="60" y1="20" x2="60" y2="45" stroke="currentColor" stroke-width="2"/>       <rect x="45" y="45" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <line x1="60" y1="75" x2="60" y2="120" stroke="currentColor" stroke-width="2"/>       <text x="60" y="65" text-anchor="middle" font-size="11">R</text>       <line x1="130" y1="20" x2="130" y2="45" stroke="currentColor" stroke-width="2"/>       <rect x="115" y="45" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <line x1="130" y1="75" x2="130" y2="120" stroke="currentColor" stroke-width="2"/>       <text x="130" y="65" text-anchor="middle" font-size="11">L</text>       <line x1="200" y1="20" x2="200" y2="45" stroke="currentColor" stroke-width="2"/>       <rect x="185" y="45" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <line x1="200" y1="75" x2="200" y2="120" stroke="currentColor" stroke-width="2"/>       <text x="200" y="65" text-anchor="middle" font-size="11">C</text>       <text x="130" y="135" text-anchor="middle" font-size="11">R・L・C 並列接続、角周波数ω</text>     </svg>' },
  { id:'q378', group:'電気・電子理論', category:'マイクロ波通信', chapter:'3章', stars:4, question:'マイクロ波通信の中継方式の1である無給電中継方式に関する記述として、適当なものはどれか。', options:['受信したマイクロ波からベースバンド信号を復調し、波形整形や同期調整を行った後、再び変調して送信する方式である','受信したマイクロ波をそのまま増幅して送信するか、または受信したマイクロ波を目的の周波数に変換した後増幅して送信する方式である','受信したマイクロ波帯の信号を中間周波数に変換して増幅した後、再びマイクロ波帯に変換して送信する方式である','電波を反射板等で反射させて、電波の伝搬方向を変えて中継する方式である'], answer:3, explanation:'受信波をベースバンド信号まで復調して波形整形・同期調整を行った後、再び変調して送信する方式は再生中継であるため①は不適当。マイクロ波の周波数のまま増幅するか目的の周波数に変換した後増幅して送信する方式は直接中継であるため②は不適当。受信波を中間周波数に変換して増幅した後、再びマイクロ波帯に変換して送信する方式はヘテロダイン中継であるため③は不適当。反射板等で電波を反射させて伝搬方向だけを変更する、電気的な中継装置を持たない中継方式が無給電中継方式である。したがって④が適当。' },
  { id:'q379', group:'電気・電子理論', category:'波形整形回路', chapter:'3章', stars:4, question:'次の図に示す波形整形回路(短絡通路にダイオードD1・D2と直流電源E1・E2を互いに逆向きに配置した回路)に正弦波を入力した場合の出力波形として、適当なものはどれか。', options:['ベースクリッパの波形からピーク部をカットした形の出力波形','入力波形をそのまま通過させた波形','半波整流された波形','出力端に何も現れない波形'], answer:0, explanation:'例題の回路は、上ルートの短絡通路(ピーククリッパ:上側の頂上をE[V]でカットする)と、下ルートの短絡通路(ベースクリッパ:波形のベース部を底上げする)が互いに相反する形で組み合わされている。ベースクリッパの波形から、さらにピーク部をカットした形が全体の出力波形となる。', figure:'<svg viewBox="0 0 320 200" style="width:100%;max-width:360px;margin:0 auto;display:block">   <text x="15" y="60" font-size="12">Vin</text>   <line x1="40" y1="60" x2="280" y2="60" stroke="currentColor" stroke-width="1.5"/>   <line x1="40" y1="60" x2="40" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="280" y1="60" x2="280" y2="150" stroke="currentColor" stroke-width="1.5"/>   <line x1="40" y1="150" x2="120" y2="150" stroke="currentColor" stroke-width="1.5"/>   <polygon points="130,140 130,160 150,150" fill="none" stroke="#1e88e5" stroke-width="2"/>   <text x="120" y="130" font-size="9" fill="#1e88e5">D1</text>   <line x1="150" y1="150" x2="170" y2="150" stroke="currentColor" stroke-width="1.5"/>   <text x="175" y="145" font-size="9">E1</text>   <line x1="40" y1="170" x2="120" y2="170" stroke="currentColor" stroke-width="1.5"/>   <polygon points="150,160 150,180 130,170" fill="none" stroke="#e53935" stroke-width="2"/>   <text x="120" y="195" font-size="9" fill="#e53935">D2</text>   <line x1="130" y1="170" x2="110" y2="170" stroke="currentColor" stroke-width="1.5"/>   <text x="95" y="190" font-size="9">E2</text>   <text x="290" y="105" font-size="12">Vout</text> </svg>' },
  { id:'q380', group:'法規', category:'作業主任者', chapter:'4章', stars:4, question:'作業主任者の選任を必要とする作業に関する記述として、「労働安全衛生法」上、誤っているものはどれか。', options:['掘削面の高さが3mの地山の掘削(ずい道およびたて坑以外の坑の掘削を除く)の作業','土止め支保工の切りばりまたは腹起こしの取り外しの作業','高さが3mの無線通信用鉄塔の組立て作業','地下に設置されたマンホール内の通信ケーブルの敷設作業'], answer:2, explanation:'鉄塔の組立て作業は高さ5m以上が選任対象で、無線通信用に限らずどのような鉄塔でも5m以上であれば選任が必要(解体の場合も同様)。3mでは対象外のため③が誤り。' },
  { id:'q381', group:'法規', category:'建設業許可', chapter:'4章', stars:4, question:'「建設業法」を根拠法とし、指定建設業として定められていないものを選べ。', options:['建築工事業','電気工事業','電気通信工事業','管工事業'], answer:2, explanation:'指定建設業として定められているのは、土木工事業・建築工事業・電気工事業・管工事業・鋼構造物工事業・舗装工事業・造園工事業の7種のみであり、電気通信工事業は該当しない。' },
  { id:'q382', group:'法規', category:'電波法令', chapter:'4章', stars:4, question:'受信設備の条件に関する次の記述の[ ]に当てはまる語句の組み合わせとして、「電波法」上、正しいものはどれか。「受信設備は、その副次的に発する(ア)または(イ)が、総務省令で定める限度をこえて、他の無線設備の機能に支障を与えるものであってはならない。」', options:['(ア)電波 (イ)高周波電流','(ア)電波 (イ)渦電流','(ア)熱 (イ)高周波電流','(ア)熱 (イ)渦電流'], answer:0, explanation:'電波法第29条により、受信設備が副次的に発する「電波又は高周波電流」が総務省令で定める限度を超えて他の無線設備の機能に支障を与えてはならないと規定されている。' },
  { id:'q383', group:'法規', category:'電波法令', chapter:'4章', stars:4, question:'無線局の免許の欠格事由に関する次の記述の[ ]に当てはまる語句の組み合わせとして、「電波法」上、正しいものはどれか。「電波法に規定する罪を犯し(ア)以上の刑に処せられ、その(イ)を終わり、またはその(イ)を受けることがなくなった日から(ウ)年を経過しない者には、無線局の免許を与えないことができる。」', options:['(ア)罰金 (イ)執行 (ウ)2','(ア)罰金 (イ)処分 (ウ)3','(ア)過料 (イ)執行 (ウ)3','(ア)過料 (イ)処分 (ウ)2'], answer:0, explanation:'電波法に規定する罪を犯し罰金以上の刑に処せられ、その執行を終わり、またはその執行を受けることがなくなった日から2年を経過しない者は、無線局の免許を与えないことができる。' },
  { id:'q384', group:'法規', category:'電波法令', chapter:'4章', stars:4, question:'無線局の種別および定義に関する記述として、「電波法」上、正しいものはどれか。', options:['無線標定陸上局とは、無線測位業務を行う無線局をいう','無線呼出局とは、携帯局と通信を行うため陸上に開設する移動しない無線局をいう','地球局とは、固定業務を行う無線局をいう','陸上移動局とは、陸上を移動中またはその特定しない地点に停止中運用する無線局(船上通信局を除く)をいう'], answer:3, explanation:'無線標定陸上局は「無線標定業務を行う移動しない無線局」であり、①は無線測位業務とする点が誤り(無線測位業務を行うのは無線測位局)。無線呼出局は「無線呼出業務を行う陸上に開設する無線局」でポケットベル基地局が代表例であり、②は移動しないとする点が誤り(携帯局に加えて移動する場合も含む)。地球局は「宇宙局と通信を行い、又は受動衛星その他宇宙にある物体を利用して通信を行うため、地表又は地球の大気圏の主要部分に開設する無線局」であり、③は誤り。④のみ正しい。' },
  { id:'q385', group:'法規', category:'不正アクセス禁止法', chapter:'4章', stars:4, question:'不正アクセス行為に関する次の記述の[ ]に当てはまる語句の組み合わせとして、「不正アクセス行為の禁止等に関する法律」上、正しいものはどれか。「(ア)を有する特定電子計算機に電気通信回線を通じて、当該(ア)に係る他人の識別符号を入力して当該特定電子計算機を作動させ、当該(ア)により制限されている(イ)をし得る状態にさせる行為。」', options:['(ア)通信制御機能 (イ)遠隔操作','(ア)通信制御機能 (イ)特定利用','(ア)アクセス制御機能 (イ)遠隔操作','(ア)アクセス制御機能 (イ)特定利用'], answer:3, explanation:'「アクセス制御機能を有する」とは、当該計算機の利用にあたりIDやパスワード等を必要とする形に設定されている状態をいう。「特定利用」とは、その計算機を利用することをいう。④が正しい組み合わせ。' },
  { id:'q386', group:'ネットワーク・情報', category:'RAID稼働率計算', chapter:'5章', stars:2, question:'2台のハードディスク(HDD)で構成したRAID1(ミラーリング)を2組用いて、RAID0(ストライピング)構成とした場合の稼働率を算出せよ。ただし、HDD単体の稼働率は0.8とし、RAIDコントローラ等HDD以外の故障はないものとする。', options:['約0.64','約0.80','約0.92','約0.96'], answer:2, explanation:'HDD1台の故障率は1-0.8=0.2。RAID1構成(2台並列)の故障率は0.2×0.2=0.04、稼働率は1-0.04=0.96。この稼働率0.96のRAID1構成を2組直列(RAID0構成)で用いるため、全体の稼働率は0.96×0.96=0.9216、約0.92となる。', figure:'<svg viewBox="0 0 320 200" style="width:100%;max-width:360px;margin:0 auto;display:block">   <rect x="20" y="20" width="280" height="40" fill="none" stroke="#1e88e5" stroke-width="2" rx="6"/>   <text x="130" y="45" font-size="12" fill="#1e88e5">RAID0 (ストライピング)</text>   <rect x="30" y="80" width="120" height="90" fill="none" stroke="#43a047" stroke-width="2" rx="6"/>   <text x="45" y="98" font-size="10" fill="#43a047">RAID1組①</text>   <rect x="45" y="110" width="40" height="45" fill="none" stroke="#333" stroke-width="1.5"/>   <text x="50" y="135" font-size="9">HDD</text>   <rect x="95" y="110" width="40" height="45" fill="none" stroke="#333" stroke-width="1.5"/>   <text x="100" y="135" font-size="9">HDD</text>   <rect x="170" y="80" width="120" height="90" fill="none" stroke="#43a047" stroke-width="2" rx="6"/>   <text x="185" y="98" font-size="10" fill="#43a047">RAID1組②</text>   <rect x="185" y="110" width="40" height="45" fill="none" stroke="#333" stroke-width="1.5"/>   <text x="190" y="135" font-size="9">HDD</text>   <rect x="235" y="110" width="40" height="45" fill="none" stroke="#333" stroke-width="1.5"/>   <text x="240" y="135" font-size="9">HDD</text> </svg>' },
  { id:'q387', group:'ネットワーク・情報', category:'サブネットマスク計算', chapter:'5章', stars:2, question:'IPv4アドレスが「192.168.3.64」で、サブネットマスクが「255.255.255.224」のとき、このネットワークで収容できるホストの最大数を求めよ。', options:['14個','30個','62個','126個'], answer:1, explanation:'サブネットマスク255.255.255.224を2進数にすると11111111.11111111.11111111.11100000となり、左から27ビットまでがネットワークアドレスとなる(=/27と同一内容)。残り右寄りの5ビットがホストアドレスとなり、収容ホスト数は30個となる。' },
  { id:'q388', group:'有線・線路施工', category:'レイリー散乱損失', chapter:'5章', stars:2, question:'光ファイバの損失要因であるレイリー散乱損失に関する次の記述の[ ]に当てはまる語句の組み合わせとして、適当なものはどれか。「レイリー散乱損失は、光ファイバの屈折率のゆらぎにより生じる損失であり、その大きさは波長の(ア)乗に(イ)する。」', options:['(ア)2 (イ)比例','(ア)2 (イ)反比例','(ア)4 (イ)比例','(ア)4 (イ)反比例'], answer:3, explanation:'レイリー散乱は光がその波長より十分小さい粒子に当たった際にさまざまな方向に散乱される現象。光ファイバの製造過程で溶融状態のガラス材料に生じた熱的なゆらぎが固化後も残り、屈折率が不均一になることで光が不規則に散乱し損失となる。損失の大きさは波長の4乗に反比例するため、波長が短くなるほど光損失は急激に増大する。' },
  { id:'q389', group:'無線・放送', category:'無線受信電力計算', chapter:'5章', stars:2, question:'マイクロ波通信を行う無線局であるA局とB局において、A局から送信出力1[W]で送信したときのB局の受信機入力電力[dBm]の値として、適当なものはどれか。ただし、A局の送信空中線およびB局の受信空中線の絶対利得はそれぞれ35[dBi]、A局における送信空中線から送信機までの給電線の損失およびB局における受信空中線から受信機までの給電線の損失はそれぞれ0[dB]とし、A局とB局の間の自由空間基本伝搬損失は120[dB]とする。', options:['-160[dBm]','-90[dBm]','-20[dBm]','80[dBm]'], answer:2, explanation:'送信機出力1[W]=1000[mW]=10^3[mW]をdBmに換算すると10log10^3=30[dBm]。全体の電力収支は足し算で求められ、受信機の入力電力=+30+35-120+35=-20[dBm]となる。' },
  { id:'q390', group:'無線・放送', category:'自由空間伝搬損失計算', chapter:'5章', stars:2, question:'自由空間上の距離d=25[km]離れた無線局A、Bにおいて、A局から使用周波数f=10[GHz]、送信機出力1[W]を送信したときのB局の受信機入力電力[dBm]の値を算出せよ。ただし、送信および受信空中線の絶対利得は、それぞれ40[dB]、給電線および送受信機での損失はないものとする。自由空間基本伝搬損失L0は、L0=(4πd/λ)^2で与えられるものとし、dはA局とB局の間における送受信空中線間の距離、λは使用周波数の波長であり、ここではπ=3として計算するものとする。', options:['-30[dBm]','-90[dBm]','30[dBm]','90[dBm]'], answer:0, explanation:'送信機出力1[W]は30[dBm]。波長λ=300×10^6/f=300×10^6/(10×10^9)=30×10^-3[m]。L0=(4×3×25×10^3/30×10^-3)^2=(10^7)^2=10^14で、dBに換算すると10log10^14=140[dB]。全体の電力収支は、受信機の入力電力=+30+40-140+40=-30[dBm]となる。' },
  { id:'q391', group:'ネットワーク・情報', category:'OSI参照モデル', chapter:'5章', stars:2, question:'下表に示すOSI参照モデルの空欄(ア)、(イ)、(ウ)に当てはまる名称の組み合わせとして、適当なものはどれか。階層7:アプリケーション層、6:(ア)、5:セッション層、4:トランスポート層、3:(イ)、2:データリンク層、1:(ウ)', options:['(ア)ネットワーク層 (イ)プレゼンテーション層 (ウ)物理層','(ア)ネットワーク層 (イ)物理層 (ウ)プレゼンテーション層','(ア)プレゼンテーション層 (イ)ネットワーク層 (ウ)物理層','(ア)プレゼンテーション層 (イ)物理層 (ウ)ネットワーク層'], answer:2, explanation:'OSI参照モデルの7階層は上位から、アプリケーション層、プレゼンテーション層、セッション層、トランスポート層、ネットワーク層、データリンク層、物理層。定番の暗記法は「あ!プレゼントね、デーブ」でした。ゆえに(ア)はプレゼンテーション層、(イ)はネットワーク層、(ウ)は物理層となる。' },
  { id:'q392', group:'無線・放送', category:'アンテナ利得', chapter:'5章', stars:2, question:'無線通信で使用する、アンテナの利得に関する次の記述の(ア)、(イ)に当てはまる語句の組み合わせとして、適当なものはどれか。「アンテナの利得は、同じ入力電力を与えたときの、アンテナの最大輻射電力と基準アンテナの最大輻射電力の比で与えられ、基準アンテナを全方向に均等に電波を放射する[(ア)]アンテナとしたときの利得を[(イ)]利得という。」', options:['(ア)半波長ダイポール (イ)相対','(ア)半波長ダイポール (イ)絶対','(ア)等方性 (イ)相対','(ア)等方性 (イ)絶対'], answer:3, explanation:'利得とは、電波をどれだけ多く受け取れるか、あるいは放射できるかの「能力」のことで、基準となる空中線との比較で数値化される。全方向に均等に電波を放出する理論上の空中線を等方性アンテナといい、これと比較した場合の利得を「絶対利得」と定義する。一方、半波長ダイポールアンテナと比較した場合は「相対利得」と呼ばれる。' },
  { id:'q393', group:'無線・放送', category:'レーダ雨量計', chapter:'5章', stars:2, question:'レーダ雨量計に利用されているMPレーダ(マルチパラメータレーダ)に関する記述として、適当でないものはどれか。', options:['MPレーダは、落下中の雨滴がつぶれた形をしている性質を利用し、偏波間位相差から高精度に降雨強度を推定している','MPレーダは、水平偏波と垂直偏波の電波を交互に送受信して観測する気象レーダである','偏波間位相差は、Xバンドのほうが弱から中程度の雨でも敏感に反応するため、XバンドMPレーダは電波が完全に消滅して観測不可能とならない限り高精度な降雨強度推定ができる','XバンドのMPレーダでは、降雨減衰の影響により観測不能となる領域が発生する場合があるが、レーダのネットワークを構築し、観測不能となる領域を別のレーダでカバーすることにより解決できる'], answer:1, explanation:'水平偏波と垂直偏波は交互ではなく同時に送受信する。落下中の雨滴は扁平になるため、水平偏波と垂直偏波で反射の振る舞いが異なり、位相差を測定することで降雨強度を推定する。' },

  { id:'q395', group:'有線・線路施工', category:'高圧受変電', chapter:'6章', stars:1, question:'キュービクル式高圧受電設備の主遮断装置に関する、次の記述の[ ]に当てはまる語句の組み合わせとして、適当なものはどれか。 「PF・S形は、[ア]と[イ]とを組み合わせたもの、または一体としたものをいう。」', options:['(ア)遮断器 (イ)限流ヒューズ','(ア)遮断器 (イ)過電流継電器','(ア)高圧交流負荷開閉器 (イ)限流ヒューズ','(ア)高圧交流負荷開閉器 (イ)過電流継電器'], answer:2, explanation:'キュービクル式高圧受電設備はCB形(遮断器+過電流継電器、大容量向け)とPF・S形(高圧交流負荷開閉器+限流ヒューズ、中容量向け、パワーヒューズ・スイッチの略、300kVA以下)に分類される。③の組み合わせが適当。' },

  { id:'q397', group:'有線・線路施工', category:'消防設備', chapter:'6章', stars:1, question:'消防設備に関する記述として、適当でないものはどれか。', options:['不活性ガス消火設備は、二酸化炭素、窒素、あるいはこれらのガスとアルゴンとの混合ガスを放射することで、不活性ガスによる窒息効果により消火する','スプリンクラー設備は、建築物の天井等に設けたスプリンクラーヘッドが火災時の熱を感知して感熱分解破壊することで、自動的に散水を開始して消火する','屋内消火栓設備は、人が操作することによって消火を行う固定式の消火設備であり、泡の放出により消火する','粉末消火設備は、噴射ヘッドまたはノズルから粉末消火剤を放出し、火災の熱により、粉末消火剤が分解して発生する二酸化炭素による窒息効果により消火する'], answer:2, explanation:'屋内消火栓設備は水を放出することで消火の効果を得る設備であり、屋内には泡消火設備という名称ではない。泡を放出して消火するのは泡消火設備。③が不適当。' },
  { id:'q398', group:'有線・線路施工', category:'非常用装置', chapter:'6章', stars:1, question:'非常用の照明装置に関する記述として、「建築基準法」上、誤っているものはどれか。', options:['照明器具には、LEDランプが認められておらず、白熱灯または蛍光灯のいずれかでなければならない','電気配線に使用する電線は、600V二種ビニル絶縁電線その他これと同等以上の耐熱性を有するものでなければならない','予備電源は、常用の電源が断たれた場合に自動的に切り替えられて接続され、かつ、常用の電源が復帰した場合に自動的に切り替えられて復帰するものとしなければならない','照明器具(照明カバーその他附属器具に付属するものを含む)のうち主要な部分は、難燃材料で覆い、または覆うこと'], answer:0, explanation:'非常用の照明装置の構造方法を定める告示では、照明器具は白熱灯・蛍光灯・LEDランプのいずれかとすることができると規定されている。①の「LEDランプが認められていない」は誤り。' },
  { id:'q399', group:'有線・線路施工', category:'空調設備', chapter:'6章', stars:1, question:'空気調和設備の空気調和方式に関する記述として、適当でないものはどれか。', options:['定風量単一ダクト方式は、空調機でつくり出された調和空気を、ダクトを通して各室へ一定風量で送風する方式である','放射冷暖房方式(ダクト併用)は、圧縮機・凝縮器・蒸発機等の冷凍サイクル系機器および、送風機・エアフィルタ・自動制御機器等をケーシングに収納した工場生産のパッケージ型空調機を、単独または多設置する方式である','ファンコイルユニット方式は、冷却加熱コイルおよび送風機等を内蔵したファンコイルユニットと呼ばれる室内用小型空調機を各室に設置して、それに中央機械室より冷水または温水を供給し、送風機で室内空気を循環させる方式である','パッケージユニット方式は、床・天井・壁等に埋設したパイプに冷水や温水を通して、冷却パネルまたは放射パネルとし、パネル表面からの放射熱を利用して冷暖房を行う方式である'], answer:1, explanation:'選択肢②の内容はパッケージユニット方式の説明であり、④の内容は放射冷暖房方式の説明である。両者が入れ替わっているため②が不適当。' }
];

questions.forEach((q,i) => q.id = q.id || ('q'+i));

function starHtml(n) {
    if (n === 0) return '☆入門';
    return '★'.repeat(n) + '☆'.repeat(5-n);
}

function buildStarButtons() {
    const wrap = document.getElementById('star-buttons');
    wrap.innerHTML = CHAPTERS.map(c => {
        const meta = CHAPTER_META[c];
        const n = questions.filter(q => q.chapter === c).length;
        if (n === 0) return '';
        return `<button class="level-btn s${meta.stars}" onclick="startQuiz('chapter:${c}')">
            ${c==='基礎'?'入門':c}　${meta.title}　<span class="count">${n}問</span>
            <small class="stars">${starHtml(meta.stars)}</small>
            <small>${meta.desc}</small>
        </button>`;
    }).join('');
}

function buildGroupButtons() {
    const wrap = document.getElementById('group-buttons');
    wrap.innerHTML = GROUPS.map(g => {
        const meta = GROUP_META[g];
        const n = questions.filter(q => q.group === g).length;
        return `<button class="level-btn ${meta.cls}" onclick="startQuiz('group:${g}')">
            ${meta.emoji} ${g}　<span class="count">${n}問</span>
            <small>${meta.desc}</small>
        </button>`;
    }).join('');
}

function switchTab(tab) {
    document.getElementById('tab-star').classList.toggle('active', tab === 'star');
    document.getElementById('tab-field').classList.toggle('active', tab === 'field');
    document.getElementById('star-buttons').style.display  = tab === 'star'  ? 'block' : 'none';
    document.getElementById('group-buttons').style.display = tab === 'field' ? 'block' : 'none';
    localStorage.setItem('selectTab', tab);
}

function loadWeakIds()      { return new Set(JSON.parse(localStorage.getItem('weakIds') || '[]')); }
function saveWeakIds(s)     { localStorage.setItem('weakIds', JSON.stringify([...s])); }

function updateHomeScreen() {
    buildStarButtons();
    buildGroupButtons();
    switchTab(localStorage.getItem('selectTab') || 'star');
    const count = loadWeakIds().size;
    const btn = document.getElementById('weak-btn');
    if (count > 0) {
        btn.style.display = 'block';
        document.getElementById('weak-btn-sub').textContent = `記録された苦手問題 ${count}問を集中攻略`;
    } else {
        btn.style.display = 'none';
    }
}

let currentLevel = '';
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let sessionWrong = [];

function startQuiz(level) {
    currentLevel = level;
    if (level === 'random') {
        currentQuestions = shuffle([...questions]).slice(0, 20);
    } else if (level === 'weak') {
        const weakIds = loadWeakIds();
        const pool = questions.filter(q => weakIds.has(q.id));
        if (pool.length === 0) { alert('苦手問題はまだありません。'); return; }
        currentQuestions = shuffle(pool).slice(0, Math.min(20, pool.length));
    } else if (level.startsWith('chapter:')) {
        const c = level.slice(8);
        const pool = questions.filter(q => q.chapter === c);
        currentQuestions = shuffle([...pool]).slice(0, Math.min(20, pool.length));
    } else if (level.startsWith('group:')) {
        const g = level.slice(6);
        const pool = questions.filter(q => q.group === g);
        currentQuestions = shuffle([...pool]).slice(0, Math.min(20, pool.length));
    }
    currentIndex = 0;
    score = 0;
    answered = false;
    sessionWrong = [];
    document.getElementById('level-screen').style.display  = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display   = 'block';
    showQuestion();
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;

    document.getElementById('progress-bar').style.width = ((currentIndex / total) * 100) + '%';
    document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${total} 問`;
    const starTag = q.stars > 0 ? '　' + starHtml(q.stars) : '';
    document.getElementById('category-tag').textContent  = q.category + (q.group ? '　[' + q.group + ']' : '') + starTag;
    document.getElementById('question-text').textContent = q.question;

    const figWrap = document.getElementById('figure-wrap');
    if (q.figure) {
        figWrap.innerHTML = q.figure;
        figWrap.style.display = 'block';
    } else {
        figWrap.innerHTML = '';
        figWrap.style.display = 'none';
    }

    if (!q._shuffled) {
        const sd = shuffleOptions(q.options, q.answer, q.choiceNotes);
        q._shuffledOptions = sd.options;
        q._shuffledNotes   = sd.notes;
        q._correctIndex    = sd.correctIndex;
        q._shuffled        = true;
        q._selectedIndex   = null;
        q._answered        = false;
    }

    renderOptions(q);

    const banner = document.getElementById('result-banner');
    if (q._answered) {
        answered = true;
        const isCorrect = q._selectedIndex === q._correctIndex;
        banner.className = 'result-banner show ' + (isCorrect ? 'correct' : 'wrong');
        banner.textContent = isCorrect ? '⭕ 正解です！' : '❌ 不正解です';
        document.getElementById('explanation-text').textContent = q.explanation;
        document.getElementById('explanation').classList.add('show');
        const nextBtn = document.getElementById('next-btn');
        nextBtn.textContent = currentIndex + 1 < total ? '次の問題 →' : '結果を見る';
        nextBtn.classList.add('show');
        document.getElementById('skip-btn').classList.remove('show');
    } else {
        banner.className = 'result-banner';
        banner.textContent = '';
        document.getElementById('explanation').classList.remove('show');
        document.getElementById('next-btn').classList.remove('show');
        document.getElementById('skip-btn').classList.add('show');
    }

    document.getElementById('prev-btn').style.display = currentIndex > 0 ? 'block' : 'none';
}

function renderOptions(q) {
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    q._shuffledOptions.forEach((opt, i) => {
        const row = document.createElement('div');
        row.className = 'option-row';

        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '①②③④'[i] + ' ' + opt;

        const note = document.createElement('div');
        note.className = 'choice-note';
        if (q._shuffledNotes && q._shuffledNotes[i]) note.textContent = q._shuffledNotes[i];

        if (q._answered) {
            btn.classList.add('disabled');
            if (i === q._correctIndex) {
                btn.classList.add('correct');
                btn.innerHTML += '<span class="mark">✓ 正解</span>';
                note.classList.add('show', 'for-correct');
            } else if (i === q._selectedIndex) {
                btn.classList.add('wrong');
                btn.innerHTML += '<span class="mark">✗ あなたの回答</span>';
                note.classList.add('show', 'for-wrong');
            } else {
                note.classList.add('show', 'for-wrong');
            }
        } else {
            btn.onclick = () => selectAnswer(i, q._correctIndex);
        }
        row.appendChild(btn);
        if (note.textContent) row.appendChild(note);
        optionsDiv.appendChild(row);
    });
}

function shuffleOptions(options, correctIndex, notes) {
    const indexed = options.map((opt, i) => ({ opt, isCorrect: i === correctIndex, note: notes ? notes[i] : null }));
    for (let i = indexed.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
    }
    return {
        options: indexed.map(o => o.opt),
        notes: indexed.map(o => o.note),
        correctIndex: indexed.findIndex(o => o.isCorrect)
    };
}

function selectAnswer(selected, correctIndex) {
    if (answered) return;
    answered = true;
    const q = currentQuestions[currentIndex];
    q._answered      = true;
    q._skipped       = false;
    q._selectedIndex = selected;
    document.getElementById('skip-btn').classList.remove('show');

    const isCorrect = selected === correctIndex;
    const banner = document.getElementById('result-banner');
    banner.className = 'result-banner show ' + (isCorrect ? 'correct' : 'wrong');
    banner.textContent = isCorrect ? '⭕ 正解です！' : '❌ 不正解です';

    renderOptions(q);

    const weakIds = loadWeakIds();
    if (isCorrect) {
        score++;
        weakIds.delete(q.id);
    } else {
        weakIds.add(q.id);
        sessionWrong.push(q);
    }
    saveWeakIds(weakIds);

    document.getElementById('explanation-text').textContent = q.explanation;
    document.getElementById('explanation').classList.add('show');

    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = currentIndex + 1 < currentQuestions.length ? '次の問題 →' : '結果を見る';
    nextBtn.classList.add('show');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        showQuestion();
    }
}

function skipQuestion() {
    const q = currentQuestions[currentIndex];
    if (!q._answered) q._skipped = true;
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function goHomeFromQuiz() {
    if (confirm('最初に戻りますか？（進捗はリセットされます）')) {
        document.getElementById('quiz-screen').style.display  = 'none';
        document.getElementById('level-screen').style.display = 'block';
        updateHomeScreen();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display   = 'none';
    document.getElementById('result-screen').style.display = 'block';

    const skipped  = currentQuestions.filter(q => q._skipped && !q._answered).length;
    const total    = currentQuestions.filter(q => q._answered).length;
    const skipNote = skipped > 0 ? `（${skipped}問スキップ）` : '';
    const circle = document.getElementById('result-circle');
    document.getElementById('result-score').textContent = `${score}/${total}`;

    if (total === 0) {
        circle.className = 'result-circle fail';
        document.getElementById('result-message').textContent = '全問スキップしました';
        document.getElementById('result-sub').textContent     = '回答した問題がありません';
    } else if (Math.round((score / total) * 100) >= 60) {
        const pct = Math.round((score / total) * 100);
        circle.className = 'result-circle pass';
        document.getElementById('result-message').textContent = '合格ライン達成！ 🎉';
        document.getElementById('result-sub').textContent     = `正解率 ${pct}%${skipNote}　引き続き実力を磨きましょう`;
    } else {
        const pct = Math.round((score / total) * 100);
        circle.className = 'result-circle fail';
        document.getElementById('result-message').textContent = 'もう少し！ 💪';
        document.getElementById('result-sub').textContent     = `正解率 ${pct}%${skipNote}　解説を確認して再挑戦しましょう`;
    }

    const breakdown = document.getElementById('category-breakdown');
    if (sessionWrong.length > 0) {
        const catMap = {};
        currentQuestions.filter(q => q._answered).forEach(q => { catMap[q.category] = catMap[q.category] || {correct:0,total:0}; catMap[q.category].total++; });
        sessionWrong.forEach(q   => { if (catMap[q.category]) catMap[q.category].correct--; });
        Object.keys(catMap).forEach(k => { catMap[k].correct = catMap[k].total + catMap[k].correct; });

        let html = '<h3>📊 カテゴリ別結果</h3>';
        Object.entries(catMap).sort((a,b) => (a[1].correct/a[1].total)-(b[1].correct/b[1].total)).forEach(([cat,v]) => {
            const p = Math.round(v.correct/v.total*100);
            const cls = p < 60 ? 'bad' : 'good';
            html += `<div class="cat-row"><span class="cat-name">${cat}</span><span class="cat-score ${cls}">${v.correct}/${v.total} (${p}%)</span></div>`;
        });
        html += `<div style="font-size:12px;color:#888;margin-top:8px;">❌ 間違えた${sessionWrong.length}問を苦手リストに追加しました</div>`;
        breakdown.innerHTML = html;
        breakdown.style.display = 'block';
    } else {
        breakdown.innerHTML = '<div style="color:#388e3c;font-size:14px;">✅ 全問正解！苦手リストから削除されました</div>';
        breakdown.style.display = 'block';
    }
}

function retryQuiz() { startQuiz(currentLevel); }
function goHome() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('level-screen').style.display  = 'block';
    updateHomeScreen();
}

updateHomeScreen();
</script>
