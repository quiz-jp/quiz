<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電気通信施工管理技士1級 一次試験 問題集</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
            background: #f0f4f8; color: #333; min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
            color: white; padding: 20px 16px; text-align: center;
        }
        header h1 { font-size: 17px; font-weight: bold; line-height: 1.5; }
        header p  { font-size: 13px; margin-top: 5px; opacity: 0.85; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

        #level-screen { text-align: center; padding: 24px 0; }
        #level-screen h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 6px; }
        #level-screen p  { font-size: 13px; color: #666; margin-bottom: 24px; }

        .level-btn {
            display: block; width: 100%; padding: 20px 16px;
            margin-bottom: 14px; border: none; border-radius: 14px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        .level-btn:active { transform: scale(0.97); }
        .level-btn small { display: block; font-size: 13px; font-weight: normal; margin-top: 4px; opacity: 0.9; }
        .level-btn.beginner     { background: linear-gradient(135deg,#4CAF50,#388e3c); color:#fff; box-shadow:0 4px 14px rgba(76,175,80,.35); }
        .level-btn.intermediate { background: linear-gradient(135deg,#FF9800,#e65100); color:#fff; box-shadow:0 4px 14px rgba(255,152,0,.35); }
        .level-btn.advanced     { background: linear-gradient(135deg,#e53935,#b71c1c); color:#fff; box-shadow:0 4px 14px rgba(229,57,53,.35); }
        .level-btn.random       { background: linear-gradient(135deg,#7b1fa2,#4a148c); color:#fff; box-shadow:0 4px 14px rgba(123,31,162,.35); }

        #quiz-screen { display: none; }
        .progress-wrap { background:#ddd; border-radius:8px; height:8px; margin-bottom:6px; }
        .progress-bar  { background:linear-gradient(90deg,#2d6a9f,#4CAF50); height:8px; border-radius:8px; transition:width .3s; }
        .progress-text { font-size:13px; color:#666; text-align:right; margin-bottom:14px; }

        .question-card {
            background: white; border-radius: 16px;
            padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 14px;
        }
        .category-tag {
            display: inline-block; background: #e8f0fe; color: #2d6a9f;
            font-size: 11px; font-weight: bold; padding: 3px 10px;
            border-radius: 20px; margin-bottom: 12px;
        }
        .question-text { font-size: 16px; line-height: 1.75; color: #222; }

        .options { margin-top: 18px; }
        .option-btn {
            display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px;
            background: white; border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; text-align: left; cursor: pointer; line-height: 1.5;
            transition: border-color .2s, background .2s; color: #333;
        }
        .option-btn.correct  { background:#e8f5e9; border-color:#4CAF50; color:#2e7d32; }
        .option-btn.wrong    { background:#ffebee; border-color:#f44336; color:#c62828; }
        .option-btn.disabled { cursor: default; }

        .explanation {
            display: none; background: #f8f9fa; border-left: 4px solid #2d6a9f;
            padding: 14px 16px; border-radius: 0 10px 10px 0;
            margin-top: 14px; font-size: 14px; line-height: 1.75; color: #444;
        }
        .explanation.show { display: block; }
        .explanation-title { font-weight: bold; color: #2d6a9f; margin-bottom: 6px; }

        .next-btn {
            display: none; width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(135deg,#1a3a5c,#2d6a9f); color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px;
        }
        .next-btn.show { display: block; }

        .skip-btn {
            display: none; width: 100%; padding: 12px; margin-top: 10px;
            border: 1px dashed #999; border-radius: 12px;
            background: #f5f5f5; color: #666;
            font-size: 14px; cursor: pointer;
        }
        .skip-btn.show { display: block; }

        #result-screen { display: none; text-align: center; padding: 20px 0; }
        .result-circle {
            width: 140px; height: 140px; border-radius: 50%;
            margin: 0 auto 22px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-weight: bold;
        }
        .result-circle.pass { background:linear-gradient(135deg,#4CAF50,#388e3c); color:white; box-shadow:0 6px 20px rgba(76,175,80,.4); }
        .result-circle.fail { background:linear-gradient(135deg,#FF9800,#e65100); color:white; box-shadow:0 6px 20px rgba(255,152,0,.4); }
        .result-circle .score       { font-size: 36px; }
        .result-circle .score-label { font-size: 13px; opacity: .9; }
        .result-message { font-size: 22px; font-weight: bold; color: #1a3a5c; margin-bottom: 8px; }
        .result-sub     { font-size: 14px; color: #666; margin-bottom: 28px; }
        .result-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-action {
            padding: 16px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; border: none;
        }
        .btn-action.primary   { background:linear-gradient(135deg,#1a3a5c,#2d6a9f); color:white; }
        .btn-action.secondary { background:white; color:#2d6a9f; border:2px solid #2d6a9f; }

        .level-btn.weak { background:linear-gradient(135deg,#c62828,#6a1010); color:#fff; box-shadow:0 4px 14px rgba(198,40,40,.4); }
        #weak-btn { display:none; }

        .weak-badge {
            display:inline-block; background:#ffebee; color:#c62828;
            font-size:12px; font-weight:bold; padding:2px 10px;
            border-radius:20px; margin-bottom:20px;
        }

        .quiz-nav {
            display: flex; gap: 8px; margin-bottom: 12px;
        }
        .quiz-nav-btn {
            padding: 8px 14px; border: 1px solid #ccc; border-radius: 8px;
            background: white; font-size: 13px; cursor: pointer; color: #555;
        }
        #prev-btn { display: none; }

        .category-breakdown {
            background:#f8f9fa; border-radius:12px; padding:16px;
            margin-bottom:20px; text-align:left;
        }
        .category-breakdown h3 { font-size:14px; color:#555; margin-bottom:10px; }
        .cat-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #eee; }
        .cat-row:last-child { border-bottom:none; }
        .cat-name { color:#333; }
        .cat-score { font-weight:bold; }
        .cat-score.bad  { color:#e53935; }
        .cat-score.good { color:#388e3c; }
    </style>
</head>
<body>

<header>
    <h1>電気通信施工管理技士 1級</h1>
    <p>第一次試験 問題集</p>
</header>

<div class="container">

    <div id="level-screen">
        <h2>レベルを選んでください</h2>
        <p>解説付き・全375問からランダム20問出題（2026年版テキスト対応）</p>
        <button class="level-btn beginner"     onclick="startQuiz('beginner')">
            🟢 初級（20問）
            <small>基本用語・基礎知識の確認</small>
        </button>
        <button class="level-btn intermediate" onclick="startQuiz('intermediate')">
            🟠 中級（20問）
            <small>計算問題・応用・法規</small>
        </button>
        <button class="level-btn advanced"     onclick="startQuiz('advanced')">
            🔴 上級（20問）
            <small>過去問レベル・本番想定</small>
        </button>
        <button class="level-btn random"       onclick="startQuiz('random')">
            🎲 ランダム（20問）
            <small>全レベルからランダム出題</small>
        </button>
        <button class="level-btn weak" id="weak-btn" onclick="startQuiz('weak')">
            ❌ 苦手問題（集中攻略）
            <small id="weak-btn-sub"></small>
        </button>
        <div id="weak-badge-wrap"></div>
    </div>

    <div id="quiz-screen">
        <div class="quiz-nav">
            <button class="quiz-nav-btn" onclick="goHomeFromQuiz()">🏠 最初に戻る</button>
            <button class="quiz-nav-btn" id="prev-btn" onclick="prevQuestion()">← 前の問題</button>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text"></div>
        <div class="question-card">
            <div class="category-tag"  id="category-tag"></div>
            <div class="question-text" id="question-text"></div>
            <div class="options"       id="options"></div>
            <div class="explanation"   id="explanation">
                <div class="explanation-title">📝 解説</div>
                <div id="explanation-text"></div>
            </div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
        <button class="skip-btn" id="skip-btn" onclick="skipQuestion()">⏭ この問題をスキップ（採点対象外）</button>
    </div>

    <div id="result-screen">
        <div class="result-circle" id="result-circle">
            <div class="score" id="result-score"></div>
            <div class="score-label">点</div>
        </div>
        <div class="result-message" id="result-message"></div>
        <div class="result-sub"     id="result-sub"></div>
        <div class="category-breakdown" id="category-breakdown"></div>
        <div class="result-actions">
            <button class="btn-action primary"   onclick="retryQuiz()">🔄 同じレベルをもう一度</button>
            <button class="btn-action secondary" onclick="goHome()">🏠 レベル選択に戻る</button>
        </div>
    </div>

</div>

<script>
const questions = {
    beginner: [
        { category:'電気通信工学', question:'光ファイバーケーブルの特徴として正しいものはどれか。', options:['電磁誘導の影響を受けやすい','電気信号をそのまま伝送する','電磁誘導の影響を受けにくい','銅線より重い'], answer:2, explanation:'光ファイバーは光信号で伝送するため、電磁誘導（ノイズ）の影響を受けにくい。また軽量・細径・広帯域という特徴もある。' },
        { category:'電気通信工学', question:'デシベル（dB）の説明として正しいものはどれか。', options:['電力の絶対値を表す単位','電力比・電圧比を対数で表した単位','周波数を表す単位','電流の大きさを表す単位'], answer:1, explanation:'dBは電力比や電圧比を常用対数で表した相対的な単位。電力比：dB=10log(P1/P2)、電圧比：dB=20log(V1/V2)。' },
        { category:'電気通信工学', question:'電気通信回線の「伝送損失」とは何か。', options:['信号レベルが増加する現象','信号レベルが減少する現象','送受信端の周波数の差','電流の変化率'], answer:1, explanation:'伝送損失とは、信号が伝送路を通過する際に信号レベルが減少する現象。光ファイバーはdB/km単位で表す。' },
        { category:'施工管理', question:'施工管理の「4大管理」に含まれないものはどれか。', options:['工程管理','品質管理','設計管理','安全管理'], answer:2, explanation:'4大管理は「工程管理・品質管理・安全管理・原価管理」。設計管理は含まれない。' },
        { category:'施工管理', question:'バーチャート（横線式工程表）の特徴として正しいものはどれか。', options:['各作業の関連性が明確にわかる','各作業の開始・終了時期が視覚的にわかりやすい','クリティカルパスが容易に把握できる','コンピューターがないと作成できない'], answer:1, explanation:'バーチャートは横棒グラフで各作業の期間を表す。見やすい反面、作業間の関連性やクリティカルパスの把握には向いていない。' },
        { category:'法規', question:'電気通信事業法の目的として正しいものはどれか。', options:['電波の公平かつ能率的な利用を確保する','電気通信事業の適正な運営を確保し利用者の利益を保護する','建設業の健全な発達を促進する','労働者の安全と健康を守る'], answer:1, explanation:'電気通信事業法は、電気通信事業の適正な運営を確保し、電気通信の健全な発達と国民の利便確保を目的とする。' },
        { category:'法規', question:'建設業法における「主任技術者」の配置が必要な工事はどれか。', options:['請負金額500万円未満の軽微な工事のみ','すべての建設工事','公共工事のみ','請負金額3,000万円以上の工事のみ'], answer:1, explanation:'建設業法により、建設業者はすべての工事現場に主任技術者（または監理技術者）を配置しなければならない。' },
        { category:'電気工学', question:'オームの法則の式として正しいものはどれか。', options:['V = I + R','V = I × R','V = I / R','V = I² × R'], answer:1, explanation:'オームの法則はV=I×R（電圧＝電流×抵抗）。V(V)、I(A)、R(Ω)の関係を表す。' },
        { category:'電気通信工学', question:'無線LANの規格「IEEE 802.11ac（Wi-Fi 5）」が主に使用する周波数帯はどれか。', options:['2.4GHz帯のみ','5GHz帯のみ','900MHz帯','60GHz帯'], answer:1, explanation:'IEEE 802.11ac（Wi-Fi 5）は5GHz帯を使用。両帯域対応はIEEE 802.11n（Wi-Fi 4）やIEEE 802.11ax（Wi-Fi 6）。' },
        { category:'施工管理', question:'ヒヤリハットの説明として正しいものはどれか。', options:['死亡・重傷事故のこと','危うく事故になりそうだったが災害に至らなかった事象','軽傷事故のこと','設備の故障のこと'], answer:1, explanation:'ヒヤリハットは危うく事故になりそうだった事象。ハインリッヒの法則では1件の重大事故の背後に29件の軽微事故と300件のヒヤリハットがあるとされる。' },
        { category:'電気通信工学', question:'IPアドレス「192.168.1.0/24」のサブネットマスクはどれか。', options:['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.128'], answer:2, explanation:'/24はサブネットマスクの上位24ビットが1であることを示す。24ビット＝255.255.255.0に相当。' },
        { category:'法規', question:'労働安全衛生法に基づき、高さ何m以上の場所での作業時に墜落防止措置が必要か。', options:['1m以上','2m以上','3m以上','5m以上'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の箇所での作業では安全帯の使用や手すりの設置など墜落防止措置が必要。' },
        { category:'電気通信工学', question:'UTPケーブルとSTPケーブルの違いとして正しいものはどれか。', options:['UTPはシールドあり、STPはシールドなし','UTPはシールドなし、STPはシールドあり','UTPは光ファイバー、STPは銅線','速度の違いのみで構造は同じ'], answer:1, explanation:'UTP（Unshielded Twisted Pair）はシールドなし、STP（Shielded Twisted Pair）はシールドあり。STPはノイズに強い。' },
        { category:'施工管理', question:'QC（品質管理）の「PDCAサイクル」の正しい順序はどれか。', options:['Plan→Check→Do→Act','Plan→Do→Check→Act','Do→Plan→Check→Act','Check→Plan→Do→Act'], answer:1, explanation:'PDCAはPlan（計画）→Do（実施）→Check（確認）→Act（改善）の順に繰り返す継続的品質改善手法。' },
        { category:'電気工学', question:'交流電力において「力率」とは何か。', options:['有効電力と皮相電力の比','電圧と電流の比','周波数と電圧の比','無効電力と皮相電力の比'], answer:0, explanation:'力率は有効電力（W）÷皮相電力（VA）で求める。力率が1に近いほど電力を効率よく使える。' },
        { category:'電気通信工学', question:'PONシステムにおける「ONU」とは何か。', options:['局側の光通信装置','加入者側の光通信装置','光ファイバーの分岐装置','無線アクセスポイント'], answer:1, explanation:'ONU（Optical Network Unit）は加入者側（ユーザー宅）に設置される光通信装置。局側はOLT（Optical Line Terminal）。' },
        { category:'施工管理', question:'工事着手前に作成する「施工計画書」に含まれないものはどれか。', options:['工程表','安全管理計画','完成検査報告書','品質管理計画'], answer:2, explanation:'完成検査報告書は工事完了後に作成するもの。施工計画書は着手前に工程表・安全管理計画・品質管理計画などを記載。' },
        { category:'法規', question:'電波法における「不法無線局」の開設に対する罰則はどれか。', options:['5万円以下の罰金','1年以下の懲役または100万円以下の罰金','警告のみ','罰則規定はない'], answer:1, explanation:'電波法により、不法無線局（無免許）の開設は1年以下の懲役または100万円以下の罰金が科せられる。' },
        { category:'電気通信工学', question:'VoIPの説明として正しいものはどれか。', options:['映像信号をIP網で伝送する技術','音声をデジタル化しIP網で伝送する技術','無線通信の一規格','データの暗号化技術'], answer:1, explanation:'VoIP（Voice over Internet Protocol）は音声をデジタル変換してIP網で伝送する技術。IP電話などに利用される。' },
        { category:'施工管理', question:'作業主任者の選任が必要な作業はどれか。', options:['地上での一般清掃作業','高圧電気設備の取扱い作業','書類整理作業','資材の室内保管作業'], answer:1, explanation:'労働安全衛生法により、高圧・特別高圧電気設備の取扱い作業などの危険有害作業では作業主任者の選任が義務付けられている。' },
        { category:'電気通信工学', question:'「DNS」の役割として正しいものはどれか。', options:['データを暗号化して送信する','ドメイン名をIPアドレスに変換する','メールを送信する','ファイルを転送する'], answer:1, explanation:'DNS（Domain Name System）はドメイン名（例：www.example.com）をIPアドレスに変換する仕組み。インターネットの電話帳とも呼ばれる。' },
        { category:'電気通信工学', question:'「ルーター」の役割として正しいものはどれか。', options:['同一ネットワーク内のデータを中継する','異なるネットワーク間でデータを転送する','電気信号を増幅する','無線信号を有線に変換する'], answer:1, explanation:'ルーターは異なるネットワーク間でIPアドレスを参照してデータを転送（ルーティング）する機器。' },
        { category:'電気工学', question:'コンデンサの特徴として正しいものはどれか。', options:['直流を通し交流を遮断する','交流を通し直流を遮断する','抵抗として働く','電気を磁気に変換する'], answer:1, explanation:'コンデンサは交流を通し直流を遮断する特性を持つ。フィルタ回路や結合回路に使用される。' },
        { category:'施工管理', question:'「KY活動（危険予知活動）」の目的として正しいものはどれか。', options:['作業効率を上げること','作業前に危険を予測し事故を防止すること','品質を検査すること','コストを削減すること'], answer:1, explanation:'KY活動は作業開始前に作業員が話し合い、潜在する危険を予測・確認することで労働災害を防止する安全管理活動。' },
        { category:'法規', question:'建設工事の請負契約書に記載しなければならない事項として、建設業法で定められていないものはどれか。', options:['工事内容','請負代金の額','工事着手の時期および工事完成の時期','下請業者の氏名'], answer:3, explanation:'建設業法で定める請負契約書の必須記載事項は工事内容、請負代金、着工・完成時期、支払方法など。下請業者の氏名は必須ではない。' },
        { category:'電気通信工学', question:'「FTTH」とは何か。', options:['光ファイバーを家庭まで引き込むサービス','携帯電話の通信規格','無線LANの規格','ケーブルテレビの方式'], answer:0, explanation:'FTTH（Fiber To The Home）は光ファイバーケーブルを一般家庭まで引き込む光インターネット接続サービス。' },
        { category:'電気工学', question:'三相交流の特徴として正しいものはどれか。', options:['単相交流より効率が悪い','位相が120°ずつずれた3つの交流を使う','直流の一種である','変圧器が使えない'], answer:1, explanation:'三相交流は位相が互いに120°ずれた3つの交流電圧を使う方式。電力の伝送効率が高く、工場設備・モーターなどに広く使われる。' },

        { category:'法規', question:'「消防法」において、自動火災報知設備の設置が義務付けられる建物の用途として正しいものはどれか。', options:['個人住宅のみ','旅館・ホテル・病院・学校など特定の用途の建物','すべての建物','延べ面積に関わらずすべての飲食店'], answer:1, explanation:'消防法施行令により、旅館・ホテル・病院・学校・百貨店など特定用途の建物および一定規模以上の建物に自動火災報知設備の設置が義務付けられる。' },

    intermediate: [
        { category:'電気通信工学（計算）', question:'光ファイバー伝送路の損失が0.3dB/kmの場合、10kmの伝送損失は何dBか。', options:['0.3dB','3dB','30dB','0.03dB'], answer:1, explanation:'伝送損失=損失係数×距離=0.3dB/km×10km=3dB。dBは線形に加算できる。' },
        { category:'電気通信工学', question:'TDM（時分割多重）とFDM（周波数分割多重）の違いとして正しいものはどれか。', options:['TDMは時間・FDMは周波数で信号を分割して多重化する','TDMは周波数・FDMは時間で分割する','どちらも同じ方式の別名称','TDMはアナログ専用・FDMはデジタル専用'], answer:0, explanation:'TDM（時間軸で分割）とFDM（周波数帯域で分割）はそれぞれ異なる多重化方式。' },
        { category:'施工管理', question:'ネットワーク工程表（アローダイアグラム）における「クリティカルパス」とは何か。', options:['最も短い経路','最も長い経路で遅延すると工期全体が延びる','最もコストがかかる経路','安全上最も危険な工程'], answer:1, explanation:'クリティカルパスは最長の作業経路。この経路上の作業が遅れると工期全体が延びるため重点管理が必要。' },
        { category:'法規', question:'建設業法において、下請契約の総額が何円以上の場合に「特定建設業許可」が必要か。', options:['1,000万円以上','3,000万円以上（建築は4,500万円以上）','5,000万円以上','1億円以上'], answer:1, explanation:'発注者から直接請け負った工事で下請契約の総額が3,000万円以上（建築一式は4,500万円以上）となる場合は特定建設業許可が必要。' },
        { category:'電気通信工学', question:'MIMO技術の説明として正しいものはどれか。', options:['1本のアンテナで複数の周波数を使う技術','複数の送受信アンテナを使い通信速度・品質を向上させる技術','信号を暗号化する技術','伝送距離を延長する中継技術'], answer:1, explanation:'MIMO（Multiple Input Multiple Output）は複数の送受信アンテナを同時に使用し通信速度向上や品質改善を実現。LTEやWi-Fiに広く採用。' },
        { category:'電気工学（計算）', question:'三相交流回路（Y結線）において、線間電圧と相電圧の関係として正しいものはどれか。', options:['線間電圧 = 相電圧','線間電圧 = √3 × 相電圧','線間電圧 = 3 × 相電圧','線間電圧 = 相電圧 / √3'], answer:1, explanation:'Y（スター）結線では線間電圧=√3×相電圧。相電圧200Vなら線間電圧は約346V（200×1.732）。' },
        { category:'施工管理', question:'品質管理における「管理図」の説明として正しいものはどれか。', options:['工程の時間的な流れを表す図','工程が統計的に安定した状態にあるかを監視するための図','作業員の配置を示す図','材料の発注量を管理する図'], answer:1, explanation:'管理図（コントロールチャート）はQC7つ道具の一つ。工程データを時系列プロットし管理限界線と照合することで異常を検出する。' },
        { category:'法規', question:'電波法における「技術基準適合証明（技適マーク）」の説明として正しいものはどれか。', options:['無線局の免許が不要になる証明','端末機器が電波法の技術基準に適合していることの証明','建設業者の技術力を証明するもの','電気通信事業者の認定'], answer:1, explanation:'技適マークは無線機器が電波法で定める技術基準を満たすことを証明するもの。技適マークのない機器の日本での使用は原則禁止。' },
        { category:'電気通信工学', question:'SDHの基本速度STM-1の伝送速度はどれか。', options:['1.544Mbit/s','51.84Mbit/s','155.52Mbit/s','622.08Mbit/s'], answer:2, explanation:'SDHのSTM-1の伝送速度は155.52Mbit/s。STM-4は622.08Mbit/s、STM-16は約2.5Gbit/s。' },
        { category:'施工管理', question:'工事現場における「新規入場者教育」の目的として最も適切なものはどれか。', options:['工事の設計内容を理解させること','現場ルール・危険箇所・緊急連絡先などを周知し安全確保を図ること','工事の原価計算をさせること','品質検査の方法を習得させること'], answer:1, explanation:'新規入場者教育は現場に初めて入場する作業員に現場ルール・危険箇所・緊急連絡先・作業手順を説明し安全な作業を確保することが目的。' },
        { category:'電気通信工学', question:'OSI参照モデルの第3層（ネットワーク層）のプロトコルはどれか。', options:['TCP','HTTP','IP','Ethernet'], answer:2, explanation:'OSI第3層（ネットワーク層）はIP。TCPは第4層（トランスポート層）、HTTPは第7層（アプリケーション層）、Ethernetは第2層（データリンク層）。' },
        { category:'法規', question:'労働安全衛生法において、特定元方事業者（元請）の義務として正しいものはどれか。', options:['下請事業者の賃金を直接支払う義務','関係請負人を含めた統括的な安全衛生管理を行う義務','下請事業者の利益を保証する義務','材料をすべて支給する義務'], answer:1, explanation:'特定元方事業者（元請）は自社および関係請負人（下請）の労働者を含めた統括安全衛生管理が義務付けられている。' },
        { category:'電気通信工学', question:'OTDR（光パルス試験器）の用途として正しいものはどれか。', options:['光ファイバーの伝送損失分布や断線箇所を測定する','電気ケーブルの絶縁抵抗を測定する','無線の電波強度を測定する','IPネットワークの通信速度を測定する'], answer:0, explanation:'OTDR（Optical Time Domain Reflectometer）は光パルスを入射し後方散乱光を分析することで損失分布・断線箇所を測定する機器。' },
        { category:'施工管理', question:'EVMにおけるSPI（スケジュール効率指数）が1.0未満を示す場合はどれか。', options:['予定より工程が進んでいる','予定通り工程が進んでいる','予定より工程が遅れている','コストが超過している'], answer:2, explanation:'SPI=EV（出来高）÷PV（計画値）。SPI<1.0は工程が計画より遅れていることを示す。SPI>1.0は進んでいる。' },
        { category:'電気工学', question:'UPS（無停電電源装置）のバッテリーを常時充電し停電時に瞬断なく給電できる方式はどれか。', options:['オフライン方式（スタンバイ方式）','オンライン方式（常時インバータ方式）','ラインインタラクティブ方式','インライン方式'], answer:1, explanation:'オンライン方式はバッテリーを介して常時インバータで給電するため停電時に切替時間がなく瞬断しない。サーバーなど重要機器に適する。' },
        { category:'法規', question:'電気通信工事の「監理技術者」の配置が必要な条件として正しいものはどれか。', options:['すべての下請工事','下請契約総額が3,000万円以上（建築は4,500万円以上）となる特定建設業者が施工する工事','工事金額500万円以上のすべての工事','公共工事のみ'], answer:1, explanation:'特定建設業者が元請として下請契約の総額が3,000万円以上（建築一式は4,500万円以上）となる工事では監理技術者を配置しなければならない。' },
        { category:'電気通信工学', question:'IPv6アドレスのビット数はどれか。', options:['32ビット','64ビット','128ビット','256ビット'], answer:2, explanation:'IPv6アドレスは128ビット（16バイト）。IPv4の32ビットに対して大幅に拡張。16進数8グループ（各16ビット）をコロン区切りで表記。' },
        { category:'施工管理', question:'受注者が発注者に提出する「施工体制台帳」の作成義務が生じる条件はどれか。', options:['すべての工事','公共工事において下請契約を締結したとき','工事金額が1億円を超えるとき','工期が1年以上の工事'], answer:1, explanation:'建設業法により、公共工事を受注した建設業者が下請契約を締結した場合、施工体制台帳を作成し発注者に提出する義務がある。' },
        { category:'電気通信工学（計算）', question:'送信電力が10Wの場合、dBm（ミリワット基準）で表すと何dBmか。', options:['10dBm','30dBm','40dBm','100dBm'], answer:2, explanation:'dBm=10×log₁₀(電力mW/1mW)。10W=10,000mWなので10×log₁₀(10,000)=10×4=40dBm。' },
        { category:'法規', question:'電気通信工事施工管理技士1級の「第一次検定」の受験資格として正しいものはどれか。', options:['実務経験なしで受験可能（19歳以上）','学歴に応じた所定の実務経験が必要','2級合格後5年以上の実務経験が必要','年齢・経験問わず誰でも受験可能'], answer:0, explanation:'2021年度の法改正により、1級第一次検定は19歳以上であれば実務経験なしで受験可能。第二次検定には所定の実務経験が必要。' },
        { category:'電気通信工学', question:'「VLAN（仮想LAN）」の説明として正しいものはどれか。', options:['物理的な配線を変えずに論理的なネットワークを分割する技術','複数の物理スイッチを1台に束ねる技術','無線通信を仮想化する技術','IPアドレスを自動割り当てする技術'], answer:0, explanation:'VLANは物理的な接続を変えることなく、スイッチの設定で論理的にネットワークを分割する技術。セキュリティ向上やブロードキャスト制御に使われる。' },
        { category:'施工管理', question:'工程管理における「山積み・山崩し」の説明として正しいものはどれか。', options:['土砂の量を管理すること','各時期の作業員・機械の必要量を均等化する調整作業','品質のばらつきを管理すること','工事費用の配分を行うこと'], answer:1, explanation:'山積みは各期間の作業量（労務・機械）をグラフ化したもの。山崩しはこれを均等化する調整作業で、工程の平準化・効率化を図る。' },
        { category:'電気通信工学（計算）', question:'周波数2GHzの電波の波長はおよそ何cmか。（光速3×10⁸m/s）', options:['1.5cm','15cm','150cm','1500cm'], answer:1, explanation:'波長λ=c/f=3×10⁸÷2×10⁹=0.15m=15cm。周波数が高いほど波長は短くなる。' },
        { category:'法規', question:'「有線電気通信法」の目的として正しいものはどれか。', options:['無線通信の秩序を維持すること','有線電気通信設備の設置・維持の規律を定め、有害な混信や障害を防止すること','電気通信事業者の経営を支援すること','建設工事の品質を確保すること'], answer:1, explanation:'有線電気通信法は有線電気通信設備の設置・維持に関する規律を定め、有害な混信・障害の防止と有線電気通信の発達を目的とする。' },
        { category:'電気通信工学', question:'「SIP（Session Initiation Protocol）」の説明として正しいものはどれか。', options:['データを圧縮するプロトコル','VoIPやテレビ会議などのセッション制御プロトコル','メールを送信するプロトコル','ファイルを転送するプロトコル'], answer:1, explanation:'SIPはVoIP・テレビ会議・インスタントメッセージなどのマルチメディアセッションの開始・変更・終了を制御するアプリケーション層プロトコル。' },
        { category:'施工管理', question:'「品質管理のQC七つ道具」に含まれないものはどれか。', options:['パレート図','特性要因図（フィッシュボーン）','PERT図','ヒストグラム'], answer:2, explanation:'QC七つ道具はパレート図・特性要因図・ヒストグラム・管理図・散布図・チェックシート・グラフ。PERT図（ネットワーク工程表）は含まれない。' },
        { category:'電気工学', question:'「絶縁抵抗測定」に使用する測定器はどれか。', options:['電流計（アンメーター）','絶縁抵抗計（メガー）','電力計（ワットメーター）','周波数計'], answer:1, explanation:'絶縁抵抗測定には絶縁抵抗計（メガー）を使用する。直流高電圧を印加して電気設備の絶縁状態を確認する。' },
        { category:'法規', question:'建設業法における「一括下請負（丸投げ）」について正しいものはどれか。', options:['元請業者は常に一括下請負ができる','公共工事では一括下請負は禁止されている','工事金額に関わらずすべて禁止','発注者の書面による承諾があれば住宅以外はすべて可能'], answer:1, explanation:'建設業法第22条により、公共工事の一括下請負は禁止。民間工事は発注者・元請負人双方の書面による承諾があれば認められる場合がある。' },
        { category:'電気通信工学', question:'「QoS（Quality of Service）」の説明として正しいものはどれか。', options:['通信のセキュリティを確保する技術','ネットワーク上でデータの種類により優先度をつけ品質を確保する技術','ネットワーク機器の消費電力を削減する技術','無線通信の周波数を管理する技術'], answer:1, explanation:'QoSはネットワークトラフィックに優先度を設定し、VoIPや動画など遅延に敏感なアプリケーションの通信品質を保証する技術。' },
        { category:'施工管理', question:'「労働災害の発生率」を表す「度数率」の計算式として正しいものはどれか。', options:['死傷者数÷労働者数×1,000','死傷者数÷延べ労働時間数×1,000,000','延べ労働損失日数÷延べ労働時間数×1,000','死亡者数÷工事件数×100'], answer:1, explanation:'度数率=死傷者数÷延べ労働時間数×1,000,000。100万延べ労働時間あたりの死傷者数で表し、安全管理の指標として使われる。' },
        { category:'工程管理', question:'工程表に関する記述として、適当でないものはどれか。', options:['バーチャートは、縦軸に工種(部分工事)をとり、横軸に各部分工事に必要な日数をとって表す','バーチャートは、作成が容易で各部分工事の工期がわかりやすく、総合工程表として広く用いられる','ガントチャートは、縦軸に部分工事をとり、横軸に各部分工事の出来高比率(達成度)をとって表す','ガントチャートは、工事全体の出来高比率の累計を容易に把握できるが、各部分工事の進捗度合いはわかりにくい'], answer:3, explanation:'ガントチャートは各部分工事の達成度(出来高比率)が一目で判断できる反面、工事全体の出来高比率の累計は把握できません。選択肢の記述は特徴が逆になっています。バーチャートは縦軸に工種、横軸に日数をとる形式で、作成が容易なため総合工程表として最もよく使われます。' },
        { category:'配線用図記号', question:'構内電気設備の配線用図記号に関する記述として、適当でないものはどれか。', options:['構内電気設備の配線用図記号は、JIS C0303:2000 に定められている','日本産業規格(JIS)の根拠となる法律は、電気事業法である','テレビジョン受信用のアンテナの図記号は、VHF用とUHF用とで共通である','図記号には形状を象形的に模したものもあるが、由来が直感的にわかりにくいものも存在する'], answer:1, explanation:'日本産業規格(JIS)の根拠法は産業標準化法であり、電気事業法ではありません。構内電気設備の配線用図記号は JIS C0303:2000 として定義されています。テレビアンテナの図記号は、VHF波・UHF波のどちらを受信するものでも共通です。' },
        { category:'配線用図記号', question:'テレビ共同受信設備の系統図で用いられる図記号のうち、横棒にT字形の縦線を組み合わせた記号が表す機器として、適当なものはどれか。', options:['パラボラアンテナ','混合(分波)器','テレビアンテナ(八木アンテナ)','増幅器'], answer:2, explanation:'T字形の図記号は、VHF波やUHF波を受信する「テレビアンテナ」を表します。構造面から「八木アンテナ」と呼んでも構いません。BS・CS放送の受信には別記号のパラボラアンテナが用いられ、混合(分波)器や増幅器はそれぞれ円形・三角形をベースにした別の記号です。' },
        { category:'配線用図記号', question:'テレビ共同受信設備で用いられるパラボラアンテナに関する記述として、適当でないものはどれか。', options:['BS放送やCS放送の電波を受信するために用いられる','地上デジタル放送のUHF波を受信するための標準的なアンテナである','はるか遠方の人工衛星からの微弱な電波を拾うために反射鏡形式が採用されている','構造面から捉えた名称として、オフセットパラボラアンテナとも呼ばれる'], answer:1, explanation:'パラボラアンテナは静止衛星からのBS・CS放送の電波を受信するためのアンテナです。地上デジタル放送(UHF帯)の受信には八木アンテナなどのテレビアンテナが用いられます。衛星からの微弱な電波を集めるために反射鏡(パラボラ)形式が採用されており、オフセットパラボラアンテナとも呼ばれます。' },
        { category:'配線用図記号', question:'テレビ共同受信設備に用いられる混合(分波)器に関する記述として、適当でないものはどれか。', options:['円の外側に描かれる枝線の向きが異なると、別の機器を表す図記号となる','八木アンテナからの系統と、パラボラアンテナで受信した衛星放送の系統とを1つに融合できる','混合された周波数帯域の異なる電波を、周波数ごとに分離することもできる','混合と分波の両方の機能を1つのデバイスで持つため、混合(分波)器と呼ばれる'], answer:0, explanation:'混合(分波)器の図記号では、円の外側の枝線の向きは意味を持たず、円の内側の形で判別します。VHF・UHF系統と衛星放送系統の混合、および周波数帯域ごとの分離(分波)の両機能を1つのデバイスで担うため、混合(分波)器と呼ばれます。' },
        { category:'配線用図記号', question:'テレビ共同受信設備における分岐器と分配器に関する記述として、適当でないものはどれか。', options:['分配器は、入力された信号を出力方に等分配する器具である','分岐器は、幹線と各分岐端子とを区別して、出力の大きさに差をつけられる器具である','図記号では、円の中に幹線を表す線が入っているものが分配器、入っていないものが分岐器である','分岐器の呼称は分岐線の本数で決まり、幹線の他に2本の分岐線があるものは2分岐器と呼ぶ'], answer:2, explanation:'図記号の見分け方が逆です。円の中に線があるものが分岐器、ないものが分配器です。機能面では、分配器は全端子への等分配、分岐器は幹線と分岐端子を区別して出力に差をつける点で異なります。分岐器は分岐線の本数により2分岐器・4分岐器などと呼びます。' },
        { category:'配線用図記号', question:'テレビ共同受信設備において、テレビ受像機を接続するユーザ側の共聴用端子を表す機器の名称として、適当なものはどれか。', options:['ヘッドエンド','テレビユニット(直列ユニット)','情報用アウトレット','分電盤'], answer:1, explanation:'テレビ受像機へ接続するユーザ側の共聴用端子は「テレビユニット」で、別名「直列ユニット」とも呼ばれます。ヘッドエンドはCATV網の起点設備、情報用アウトレットは有線LAN端末用のRJ45ジャックであり、いずれも別の機器です。' },
        { category:'配線用図記号', question:'非常放送設備の系統図に用いられる図記号に関する記述として、適当でないものはどれか。', options:['アッテネータは、内蔵された抵抗器によって増幅器からの信号レベルを適切なレベルまで下げる減衰器である','四角の中にAMPと記した図記号は、音声信号を必要なレベルまで増大させる増幅器を表す','ホーン形スピーカは、ホーン構造によって平面波に近い音波を放射する特性がある','図記号の左側が黒く塗られたスピーカは、天井埋込形スピーカを表す'], answer:3, explanation:'左側が黒く塗られたスピーカの図記号は「壁付スピーカ」を表します。天井から下向きに設置されるタイプは通常のスピーカ記号(円に三角)です。アッテネータは信号レベルを下げる減衰器、AMPは増幅器で、増幅器は三角記号でもアルファベット略字でも表されます。' },
        { category:'配線用図記号', question:'非常放送設備に用いられる警報サイレンに関する記述として、適当なものはどれか。', options:['災害発生等の非常時に警報音を吹鳴させ、多数の者に一斉周知するための機器である','電気信号を空気の振動に変換し、館内アナウンス等の音声放送を行うための機器である','増幅器からの過大な信号を減衰させて、スピーカを保護するための機器である','火災による熱を感知して、自動的に受信機へ信号を送出する機器である'], answer:0, explanation:'警報サイレンは、災害発生時などの非常時に警報音を吹鳴させて多数の者へ一斉に周知するための機器です。音声放送を行うのはスピーカ、信号レベルを下げるのはアッテネータの役割であり、熱感知は自動火災報知設備の感知器の機能です。' },
        { category:'配線用図記号', question:'CATVシステムに関する記述として、適当でないものはどれか。', options:['CATVはCommunity Antenna TeleVisionの略称で、有線によるテレビジョン放送を指す','ヘッドエンドは、CATVシステム網の終端となる加入者宅内の受信設備である','独自番組も展開するCATV事業者の場合、ヘッドエンドは局舎内に設置される','共同アンテナのような不感地帯の補完用途では、ヘッドエンドは受信アンテナの直下に置かれる'], answer:1, explanation:'ヘッドエンド(頭の端)は、CATVシステム網の「起点」となる設備であり、終端の加入者宅設備ではありません。事業者の形態によって局舎内、あるいは共同受信アンテナの直下に設置されます。CATVは有線テレビジョン放送全般を指す言葉です。' },
        { category:'配線用図記号', question:'同軸ケーブルによるCATVシステムの系統図に用いられる機器に関する記述として、適当でないものはどれか。', options:['幹線分岐増幅器は、幹線を軸として分岐を行うと同時に、増幅の機能を持たせたデバイスである','同軸ケーブルで一定距離を伝送する場合には、一定間隔での増幅が不可欠である','幹線分岐増幅器の分岐線の本数は、必ず4本と定められている','分岐の機能を持たない増幅器の図記号は、屋内用と屋外用とで同じものが用いられる'], answer:2, explanation:'幹線分岐増幅器の分岐は4本に限らず、2本のものなども多く見られます。同軸ケーブルでの伝送では減衰が生じるため一定間隔での増幅が必要であり、幹線分岐増幅器は分岐と増幅を兼ねます。増幅器の図記号は屋内用・屋外用とも共通です。' },
        { category:'配線用図記号', question:'情報ネットワーク設備の系統図に用いられる図記号に関する記述として、適当でないものはどれか。', options:['四角の中にJBと記した図記号は、主に一般家庭で機器や配線を1か所に集約した情報分電盤を表す','四角の中にJBと記した図記号は、強電用の電源ブレーカを収納する分電盤を表す','円の中に白抜きの菱形を配した図記号は、各種接続口を集約した複合アウトレットを表す','情報分電盤は、別名ホームLANシステムとも呼ばれる'], answer:1, explanation:'JBの図記号が表す情報分電盤は、テレビジョンやネットワーク関連の機器・配線を集約したもので、強電の電源ブレーカを収納する分電盤とはスタイルが異なります。別名ホームLANシステムとも呼ばれます。複合アウトレットはLAN・電話・テレビ・ACコンセント等の接続口を集約したものです。' },
        { category:'配線用図記号', question:'情報ネットワーク設備に用いられるルータに関する記述として、適当なものはどれか。', options:['プロトコル階層のうちデータリンク層(第2層)のMACアドレスのみを参照してフレームを転送する','プロトコル階層のうちネットワーク層(第3層)の情報を解析して、データ転送の可否や転送先の決定等を行う','電気信号を増幅・整形して伝送距離を延長するだけの物理層(第1層)の機器である','複数の端末を単純に集線する装置であり、転送先の判断は行わない'], answer:1, explanation:'ルータはネットワーク層(第3層)の情報を解析して転送の可否や転送先の決定を行う機器で、TCP/IPネットワークの主要な中継機器です。図記号では四角にRTと記されます。第2層で転送するのはスイッチ、単純な集線はハブ、物理層の信号再生はリピータの機能です。' },
        { category:'配線用図記号', question:'情報ネットワーク設備の系統図に用いられる図記号に関する記述として、適当でないものはどれか。', options:['四角の中にHUBと記した図記号は、主にネットワークの集線装置を表す','円の中に黒塗りの長方形を配した図記号は、情報用アウトレットを表す','情報用アウトレットは、一般的にRJ45コネクタに対応したジャック(メス側の受け口)である','四角の中にRTと記した図記号は、有線LAN端末の壁面接続口を表す'], answer:3, explanation:'RTはルータ(Router)を表す図記号です。有線LAN端末の壁面接続口は「情報用アウトレット」で、円の中に黒塗りの長方形を配した記号で表され、一般にRJ45コネクタ対応のジャックとなっています。HUBは集線装置のハブを表します。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款における設計図書に関する記述として、適当でないものはどれか。', options:['設計図書には、図面、仕様書、現場説明書および現場説明に対する質問回答書が含まれる','現場説明書や現場説明に対する質問回答書は、契約締結前の書類であるため設計図書には含まれない','仕様書は工事の施工に際して要求される技術的要件を示す文書で、通常は共通仕様書と特記仕様書からなる','設計図書でいう図面には、基本設計や概略設計等の図面も含まれる'], answer:1, explanation:'公共工事標準請負契約約款で定める設計図書は、図面・仕様書・現場説明書・現場説明に対する質問回答書の4点です。現場説明書等は契約締結前の書類ですが、設計図書に含まれると定義されています。この4点は暗記必須の基本事項です。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款に関する記述として、適当でないものはどれか。', options:['受注者は、設計図書の中の文書間に内容の不一致を発見したとき、優先順位の記載がない場合には監督員に通知し、その確認を請求しなければならない','施工方法等については、約款および設計図書に特別の定めがある場合を除き、受注者がその責任において定める','発注者が監督員を置かないときは、約款に定める監督員の権限は発注者に帰属する','施工方法等については、約款および設計図書に定めのない事項はすべて発注者が指示しなければならない'], answer:3, explanation:'工事目的物を完成するために必要な施工方法その他の手段は、約款および設計図書に特別の定めがある場合を除き、受注者がその責任において定めることとされています。発注者の指示によるのではありません。文書間の不一致発見時の監督員への通知・確認請求や、監督員不設置時の権限の発注者帰属は約款どおりの正しい記述です。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款における設計図書の取扱いに関する記述として、適当でないものはどれか。', options:['受注者は、設計図書に誤謬または脱漏を発見した場合、工事着手までの時間がないときは、監督員への通知を工事着手後に行うことができる','発注者は、必要があると認めるときは、設計図書の変更内容を受注者に通知して、設計図書を変更することができる','発注者は、必要があると認めるときは、工事の中止内容を受注者に通知して、工事の全部または一部の施工を一時中止させることができる','工期や請負代金額の変更に応じて、発注者は受注者に損害が発生した場合にその費用を負担することが明記されている'], answer:0, explanation:'受注者は、設計図書に誤謬(誤り)や脱漏(必要な情報の抜け落ち)を発見したときは、その旨を「直ちに」監督員に通知して確認を請求しなければなりません。工事着手後に通知を先送りすることは認められていません。設計図書の変更や工事の一時中止は発注者の権限として認められており、損害費用の負担も明記されています。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款における工事材料に関する記述として、適当でないものはどれか。', options:['工事材料の品質は、設計図書にその品質が明示されていない場合にあっては、中等の品質を有するものとする','受注者は、設計図書において監督員の検査を受けて使用すべきものと指定された工事材料については、当該検査に合格したものを使用しなければならない','受注者は、工事現場内に搬入した工事材料を、監督員による検査を受けなければ工事現場外に搬出してはならない','設計図書に定める監督員の検査に直接要する費用は、受注者の負担とされている'], answer:2, explanation:'工事現場内に搬入した工事材料の場外搬出に必要なのは、監督員の「承諾」であって検査ではありません。所有権の所在にかかわらず、受注者の意思のみでは搬出できない定めです。品質の明示がない場合は「中等の品質」とすること、指定検査材料は合格品のみ使用すること、検査費用が受注者負担であることは約款第13条のとおりです。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款に基づく施工に関する記述として、適当なものはどれか。', options:['設計図書において監督員の立会いの上施工するものと指定された工事でも、受注者の判断で立会いを省略して施工できる','工事材料の品質が設計図書に明示されていない場合、受注者は価格優先で下等の品質のものを採用してよい','監督員は、災害防止その他工事の施工上特に必要があると認めるときは、受注者に対して臨機の措置をとることを請求することができる','工事現場に搬入した材料の所有権は常に発注者にあるため、受注者は自由に場外へ搬出できる'], answer:2, explanation:'監督員は、災害防止等のため施工上特に必要があると認めるときは、受注者に臨機の措置を請求できます。監督員の立会いが指定された工事は立会いなしには施工できず、品質の明示がない材料は中等の品質とし、搬入済み材料の場外搬出には監督員の承諾が必要です。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款における現場代理人に関する記述として、適当でないものはどれか。', options:['現場代理人は、契約の履行に関し工事現場に常駐して、その運営や取締り等を行う','現場代理人には、請負代金額の変更、請負代金の請求および受領、契約の解除に係る権限が与えられている','工事現場における運営等に支障がなく発注者との連絡体制が確保される場合には、現場代理人の常駐義務を要しないこともあり得る','受注者は、現場代理人を定めたときは、その氏名その他必要な事項を発注者に通知しなければならない'], answer:1, explanation:'現場代理人は契約の履行に関して受注者の広範な権限を行使できますが、「請負代金額の変更」「請負代金の請求および受領」「契約の解除」の3つは権限から除外されています。連絡体制が確保されれば常駐を要しない場合もあり、現場代理人等を定めたときの発注者への通知義務も約款第10条に定められています。' },
        { category:'公共工事標準請負契約約款', question:'公共工事の請負契約に関する記述として、適当でないものはどれか。', options:['受注者は、必要に応じて工事の全部を一括して第三者に請け負わせることができる','受注者は、契約書および設計図書に特別の定めがない場合には、仮設、施工方法その他工事目的物を完成するために必要な一切の手段を、自らの責任において定める','受注者は、工事の完成や設計図書の変更等によって不用となった支給材料を、発注者に返還しなければならない','発注者は、受注者に対して、下請負人の商号または名称その他必要な事項の通知を請求することができる'], answer:0, explanation:'工事の全部(あるいは主要部分の全部)を一括して第三者に請け負わせることは「一括下請負(丸投げ)」といい、厳しく禁止されています。支給材料が不用となった場合は発注者の財産であるため返還義務があり、仮設・施工方法等は特別の定めがなければ受注者が自らの責任で定めます。' },
        { category:'公共工事標準請負契約約款', question:'公共工事標準請負契約約款における支払等の期限に関する記述として、誤っているものはどれか。ただし、請負契約には前金払および部分払に関する規定があるものとする。', options:['発注者は、前払金の支払の請求があったときは、請求を受けた日から14日以内に前払金を支払わなければならない','発注者は、工事を完成した旨の通知を受けたときは、通知を受けた日から14日以内に完成を確認するための検査を完了しなければならない','発注者は、部分払の請求があったときは、検査完了後の請求を受けた日から40日以内に部分払金を支払わなければならない','発注者は、工事が完成の検査に合格し請負代金の支払の請求があったときは、請求を受けた日から40日以内に請負代金を支払わなければならない'], answer:2, explanation:'部分払の場合、検査完了後の請求から「14日以内」に支払わなければなりません。40日以内となるのは完成時の請負代金の支払です。前払金は請求から14日以内、完成検査は通知から14日以内に完了という期限も重要です。部分払(14日)と完成時(40日)の違いを整理して覚えましょう。なお建設業法では日数が異なるため、根拠が約款か建設業法かの見極めも必要です。' },
        { category:'労働安全衛生法', question:'労働安全衛生法令に基づき、建設業を営む事業者が新たに職務につくこととなった職長に対して行う安全または衛生のための教育(職長教育)の内容として、定められていないものはどれか。', options:['作業方法の決定および労働者の配置に関すること','労働者に対する指導または監督の方法に関すること','就業規則の作成に関すること','危険性または有害性等の調査の方法に関すること'], answer:2, explanation:'職長教育の内容は、作業方法の決定・労働者の配置、指導・監督の方法、危険性または有害性等の調査とその結果に基づき講ずる措置、異常時・災害発生時における措置など、現場での作業に直接関連する事項に限られます。就業規則の作成や労働者の福利厚生といった本社・営業所で対応可能な事項は教育の対象外です。' },
        { category:'労働安全衛生法', question:'労働安全衛生法に定める職長等に対する安全衛生教育に関する記述として、適当でないものはどれか。', options:['職長とは、現場に常駐して作業者に対し直接の指揮を行う第一線の現場監督者を指す','職長教育の対象には、作業主任者も含まれる','事業者は、新たに職務につくこととなった職長に対し安全または衛生のための教育を行わなければならない','教育内容には、労働災害防止についての関心の保持および労働者の創意工夫を引き出す方法に関することが含まれる'], answer:1, explanation:'労働安全衛生法第60条では、新たに職務につく職長その他労働者を直接指導または監督する者に対する安全衛生教育を事業者に義務付けていますが、条文上「作業主任者を除く」とされており、作業主任者は職長教育の対象に含まれません。職長は班長・作業長・リーダー等の名称でも呼ばれる第一線の現場監督者です。' },
        { category:'労働安全衛生法令(飛来・落下対策)', question:'高所からの物体の投下に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['2m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等の措置を講じなければならない','5m以上の高所から物体を投下する場合に限り、投下設備の設置が義務付けられている','3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等の措置を講じなければならない','高さにかかわらず、物体を投下するときは常に投下設備と監視人の配置が必要である'], answer:2, explanation:'労働安全衛生規則第536条により、3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等の措置が必要です。高さ3m未満の投下は規制の対象外です。2mという数値は作業床の囲い等(高所作業の定義)に関するもので、投下の基準ではない点に注意しましょう。' },
        { category:'労働安全衛生法令(飛来・落下対策)', question:'物体の飛来・落下による労働者の危険防止措置に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['作業のため物体が飛来するおそれがあるときは、飛来防止の設備を設け、労働者に保護具を使用させる','作業のため物体が落下するおそれがあるときは、防網の設備を設け、立入区域を設定する','高さ2m以上の作業床の開口部等には、囲い、手すり、覆い等を設ける','作業のため物体が落下するおそれがあるときは、要求性能墜落制止用器具を安全に取り付けるための設備を設ける'], answer:3, explanation:'物体の落下による危険防止措置は、労働安全衛生規則第537条により「防網の設備を設けること」と「立入区域を設定すること」です。要求性能墜落制止用器具は作業者自身の墜落を防ぐための器具であり、物品の落下対策とは関係ありません。飛来については第538条で飛来防止の設備と保護具の使用が定められています。' },
        { category:'労働安全衛生法令(墜落防止)', question:'脚立を用いた作業に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['脚と水平面との角度が80度のものを使用した','丈夫な構造で、著しい損傷や腐食が認められないものを使用した','折りたたみ式のものは、脚と水平面との角度を確実に保つための金具等を備えたものを使用した','踏み面は、作業を安全に行うため必要な面積を有するものを使用した'], answer:0, explanation:'労働安全衛生規則第528条により、脚立の脚と水平面との角度は75度以下でなければなりません。80度では基準を超えており使用できません。その他、丈夫な構造であること、著しい損傷・腐食がないこと、折りたたみ式は角度を保つ金具等を備えること、踏み面は必要な面積を有することが要件です。' },
        { category:'労働安全衛生法令(墜落防止)', question:'移動はしごに関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['丈夫な構造のものを使用する','幅は25cm以上のものを使用する','すべり止め装置の取り付け等、転位を防止するために必要な措置を講じる','材料は、著しい損傷や腐食等がないものを使用する'], answer:1, explanation:'労働安全衛生規則第527条により、移動はしごの幅は30cm以上でなければなりません。25cmでは基準未満です。幅が狭いほど足を踏み外す懸念があり、立てた際の安定性も悪くなります。なお、移動はしごは脚立と異なり自立しない構造のため、角度に関する規定はなく、代わりに転位防止措置(すべり止め装置等)が求められます。' },
        { category:'労働安全衛生法令(墜落防止)', question:'スレート屋根等における踏み抜きの危険防止に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['幅25cm以上の歩み板を設ければよい','防網を張れば、歩み板の幅に規定はない','幅30cm以上の歩み板を設け、防網を張る等の措置を講じる','footholdの設置は高さ3m以上の屋根に限って義務付けられている'], answer:2, explanation:'労働安全衛生規則第524条により、スレート等の材料でふかれた屋根の上で作業を行う場合、踏み抜きによる危険を防止するため、幅30cm以上の歩み板を設け、防網を張る等の措置が必要です。歩み板の幅は法令上30cm以上と定められており、25cmでは不足します。' },
        { category:'労働安全衛生法令(墜落防止)', question:'作業場所における昇降設備の設置に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['高さまたは深さが1.5mを超える箇所で作業を行うときは、作業者が安全に昇降するための設備を設けなければならない','高さまたは深さが1.0mを超える箇所で作業を行うときは、昇降設備を設けなければならない','高さまたは深さが2.0mを超える箇所で作業を行うときに限り、昇降設備が必要となる','昇降設備の設置義務は高さのみに適用され、深さについては規定がない'], answer:0, explanation:'労働安全衛生規則第526条により、高さ又は深さが1.5mを超える箇所で作業を行うときは、当該作業に従事する労働者が安全に昇降するための設備等を設けなければなりません。高低差1.5m以下の場合は法令上の義務はありません。「2m」は高所作業(作業床の囲い等)の基準であり、混同しないよう注意が必要です。' },
        { category:'労働安全衛生法令(感電事故防止)', question:'架空電線の充電電路に近接する場所で工作物の建設作業を行う場合の感電防止措置として、「労働安全衛生法令」上、誤っているものはどれか。', options:['当該充電電路を移設する','感電の危険を防止するための囲いを設ける','労働者に静電気帯電防止用作業靴を着用させる','当該充電電路に絶縁用防護具を装着する'], answer:2, explanation:'労働安全衛生規則第349条に定める措置は、①充電電路の移設、②感電防止の囲いの設置、③絶縁用防護具の装着、④これらが著しく困難なときは監視人を置き作業を監視させること、の4つです。静電気帯電防止用作業靴は、人体に帯電した静電気による弱電部品の破損等を防ぐためのものであり、感電防止対策にはなりません。' },
        { category:'労働安全衛生法令(感電事故防止)', question:'電気による危険の防止に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['停電作業終了後の通電にあたっては、感電の危険がないことおよび短絡接地器具を取りはずしたことを確認してから行う','分電盤の電路を開路して点検作業を行う場合、開路した開閉器に「通電禁止」の表示をする','電気機械器具の充電部分に設けた囲いは、毎月1回以上その損傷の有無を点検する','架空電線の充電電路に近接する場所での建物修理作業では、作業場所に注意看板を設置すれば感電防止措置として足りる'], answer:3, explanation:'注意看板の設置だけでは感電防止措置として不十分です。気付かない間に接触してしまう可能性が高いため、充電電路の移設、囲いの設置、絶縁用防護具の装着等の措置が必要です。なお、電気機械器具の囲い・絶縁覆いの点検頻度は労働安全衛生規則第353条により毎月1回以上と定められています(1年に1回ではありません)。' },
        { category:'労働安全衛生法令(足場)', question:'高さ2m以上の足場(一側足場およびつり足場を除く)の作業床に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['床材間の隙間を3cm以下とする','作業床の幅を40cm以上とする','床材と建地との隙間を12cm以下とする','床材は2つ以上の支持物に取り付ける'], answer:2, explanation:'労働安全衛生規則第563条により、床材と建地との隙間は「12cm未満」としなければなりません。「12cm以下」では12cm丁度が許容されることになりNGです。その他の基準は、作業床の幅40cm以上、床材間の隙間3cm以下、床材は2以上の支持物に取り付ける、であり正しい記述です。数値と「以下/未満」の区別まで正確に覚えましょう。' },
        { category:'労働安全衛生法令(足場)', question:'高さ2m以上の足場(一側足場およびつり足場を除く)に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['作業床の幅は30cm以上とする','床材は1つの支持物に取り付ければよい','床材間の隙間は5cm以下とする','作業床の幅は40cm以上とし、床材間の隙間は3cm以下とする'], answer:3, explanation:'足場の作業床の基準は、幅40cm以上、床材間の隙間3cm以下、床材と建地との隙間12cm未満です。幅30cmでは不足し、床材間の隙間が5cmでは靴の先端が挟まったり工具が落下するおそれがあります。また床材の支持物は2つ以上必要で、1つでは不安定となり床材崩落の原因になります。' },
        { category:'労働安全衛生法令(移動式足場)', question:'移動式足場(ローリングタワー)の使用に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['傾斜が著しい場所で使用するときは、ジャッキ等を利用して作業床の水平を保持する','監視者を配置すれば、労働者を乗せたまま移動式足場を移動させることができる','わく組構造部の外側空間を昇降路とする構造では、同一面より同時に2名以上の者が昇降しないようにする','手すりや中さんを作業のため取り外したときは、必要がなくなった後直ちに元の状態に戻す'], answer:1, explanation:'移動式足場は不安定な構造であるため、人を乗せた状態での移動は禁止されています。監視者や作業責任者の監視の有無は関係ありません。傾斜が著しい場所ではジャッキ等で作業床の水平を保持し、外側空間を昇降路とする構造では同一面から同時に2名以上昇降させないこと等が「移動式足場の安全基準に関する技術上の指針」に定められています。' },
        { category:'労働安全衛生法令(移動式足場)', question:'移動式足場に関する記述として、適当でないものはどれか。', options:['脚輪のブレーキは、移動中を除き、常に作動させておく','移動式足場の上では、脚立や移動はしごを使用しない','移動式足場の高さが2m未満であれば、安全基準に関する技術上の指針を遵守する必要はない','凹凸が著しい場所で使用するときは、ジャッキ等を用いて作業床の水平を保持する'], answer:2, explanation:'移動式足場には固定式足場のような高さによる制約の適用条件がなく、高さが2m未満の場合でも「移動式足場の安全基準に関する技術上の指針」を遵守する必要があります。また、移動式足場の上での脚立・移動はしごの使用は、確実に固定したとしても禁止です。脚輪のブレーキは移動中を除き常に作動させておかなければなりません。' },
        { category:'労働安全衛生法令(届出)', question:'工事開始前に労働基準監督署長に対して計画の届出が必要なものとして、「労働安全衛生法令」上、正しいものはどれか。', options:['高さ25mの建築物を建設する場合','掘削の深さが10m以上となる地山の掘削を行う場合','組立から解体までの期間が50日間で、つり足場を設置する場合','掘削の深さが5m以上となる地山の掘削を行う場合'], answer:1, explanation:'計画の届出が必要なのは、高さ31mを超える建築物・工作物(橋梁を除く)の建設等、および掘削の高さまたは深さが10m以上である地山の掘削等です。高さ25mの建築物は31m以下のため対象外、つり足場は設置期間60日以上の場合に届出が必要となるため50日間では対象外です。' },
        { category:'労働安全衛生法令(届出)', question:'足場・架設通路の設置に係る機械等設置届に関する記述として、「労働安全衛生法令」上、届出が必要なものはどれか。', options:['組立から解体までの期間が50日間で、高さ10m、長さ10mの架設通路を設置する場合','組立から解体までの期間が59日間で、つり足場を設置する場合','組立から解体までの期間が70日間で、高さ8mの構造の足場を設置する場合','組立から解体までの期間が80日間で、高さ20m、長さ10mの架設通路を設置する場合'], answer:3, explanation:'足場・架設通路の届出はまず設置期間に着目します。59日以下であれば一律に届出不要です。60日以上の場合、つり足場・張出し足場は条件によらず全て届出対象、一般的な足場は高さ10m以上のもの、架設通路は高さと長さが共に10m以上のものが対象です。設置期間80日で高さ20m・長さ10mの架設通路は要件を満たすため届出が必要です。' },
        { category:'労働安全衛生法令(移動式クレーン)', question:'移動式クレーンを用いて作業を行うとき、事業者があらかじめ定めるべき事項として、「労働安全衛生法令」上、正しいものの組み合わせはどれか。', options:['作業の方法、転倒を防止するための方法、労働者の配置および指揮の系統','作業の方法、衝撃を軽減するための方法、労働者の作業時間','作業の方法、転倒を防止するための方法、労働者の作業時間','作業の方法、衝撃を軽減するための方法、労働者の配置および指揮の系統'], answer:0, explanation:'事業者は移動式クレーンを用いる作業の前に、作業場所の広さ、地形・地質の状態、荷の重量、使用するクレーンの種類・能力等を考慮して、①作業の方法、②転倒を防止するための方法、③作業に係る労働者の配置および指揮の系統、を定めなければなりません。指揮の系統を1本化することで、複数人の合図による操作者の判断ミスを防ぎます。' },
        { category:'労働安全衛生法令(移動式クレーン)', question:'移動式クレーンの安全確保に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['荷を吊り上げるときは、外れ止め装置を使用しなければならない','定格荷重をこえる荷重をかけて使用してはならない','吊り上げ荷重が1t以上5t未満の移動式クレーンの運転業務(道路上の走行を除く)は、特別教育を修了した者を就かせることができる','ハッカーを用いて玉掛けをした荷が吊り上げられているときは、荷の下に労働者を立ち入らせてはならない'], answer:2, explanation:'吊り上げ荷重1t以上5t未満の移動式クレーンの運転には、小型移動式クレーン運転技能講習の修了が必要です。特別教育の修了のみで運転できるのは吊り上げ荷重1t未満(0.5t以上)の場合です。資格区分は、0.5t未満は不要、0.5t以上1t未満は特別教育、1t以上5t未満は技能講習、5t以上は免許となります。' },
        { category:'労働安全衛生法令(特別教育)', question:'労働者を業務に従事させるにあたり特別教育が必要な業務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['吊り上げ荷重が0.5tの移動式クレーンの運転の業務(道路上を走行させる運転を除く)','高圧の充電電路の点検の業務','作業床の高さが8mの高所作業車の運転の業務(道路上を走行させる運転を除く)','吊り上げ荷重が1tのクレーンの玉掛けの業務'], answer:3, explanation:'玉掛け業務は吊り上げ荷重1tが資格区分の境界であり、1t以上の場合は特別教育ではなく上位の技能講習の修了が必要です。特別教育で足りるのは1t未満の玉掛けです。移動式クレーンの運転は1t未満、高所作業車は作業床の高さ10m未満であれば特別教育で従事でき、高圧・特別高圧の充電電路の敷設・点検等も特別教育の対象業務です。' },
        { category:'労働安全衛生法令(特別教育)', question:'特別教育を修了した者を従事させることができる業務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['地下に敷設させる物を収容するためのマンホールの内部における作業に係る業務','作業床の高さが15mの高所作業車の運転の業務(道路上を走行させる運転を除く)','高圧の充電電路の敷設の業務','吊り上げ荷重が0.9tの移動式クレーンの運転の業務(道路上を走行させる運転を除く)'], answer:1, explanation:'高所作業車の運転は作業床の高さ10mが境界であり、10m以上の場合は技能講習の修了が必要です。作業床の高さ15mでは特別教育のみでは従事できません。マンホール内部の作業は酸素欠乏危険作業に該当するため特別教育が必要であり、高圧・特別高圧の充電電路の敷設・点検、吊り上げ荷重1t未満の移動式クレーンの運転は特別教育の対象業務です。' },
        { category:'労働安全衛生法令(酸欠危険作業)', question:'酸素欠乏危険作業に関する記述として、「労働安全衛生法令」上、正しいものはどれか。', options:['酸素欠乏とは、空気中の酸素濃度が21%未満の状態をいう','空気中の酸素濃度の測定は、午前・午後の各1回実施しなければならない','酸素欠乏とは、空気中の酸素濃度が18%未満の状態をいう','マンホール内での光ファイバケーブル敷設作業は、酸素欠乏危険場所における作業に該当しない'], answer:2, explanation:'酸素欠乏は、空気中の酸素濃度が18%未満の状態と定義されています(21%未満ではありません)。酸素濃度の測定はその日の作業を開始する前に実施するよう定められており、午前・午後の各1回ではありません。また、マンホール内での作業は作業内容にかかわらず酸素欠乏危険作業に該当し、作業主任者の選任が必要です。' },
        { category:'労働安全衛生法令(酸欠危険作業)', question:'酸素欠乏危険作業における教育・資格に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['作業者本人は、特別教育または技能講習の修了が必要である','酸素欠乏危険作業主任者には、特別の教育を受けた者のうちから選任することができる','技能講習は特別教育の内容を含んでおり、特別教育より上位に位置づけられる','マンホールの内部に降りて行う活動は、酸素欠乏危険作業に該当する'], answer:1, explanation:'酸素欠乏危険作業主任者として選任できるのは、技能講習を修了した者のみです。特別教育だけでは作業主任者にはなれません。作業者本人は特別教育または技能講習の修了で従事できます。暗記必須事項として、酸素欠乏状態は18%未満、酸素濃度測定は作業開始前に実施、作業者本人は特別教育でよい、作業主任者は技能講習が必要、と整理しておきましょう。' },
        { category:'施工計画(全般)', question:'施工計画書を作成する上での基本事項に関する記述として、適当でないものはどれか。', options:['施工計画書の作成にあたっては、基本方針を十分に把握し、施工性のほか生産性の向上や環境保全についても検討する','施工計画の作成にあたっては、工事の目的・内容・契約条件、現場条件、全体工法、施工方法といった基本方針を考慮する','現地調査による諸条件のチェックは、施工計画書の提出後に行うことが一般的である','施工計画は、過去の実績や経験を生かすとともに、実績の少ない新工法・新技術についても積極的に採用を検討する'], answer:2, explanation:'現地調査を行って工事に必要な諸条件をチェックすることは、施工計画を立案する中での必須事項であり、施工計画書の提出前に実施しておかなければなりません。また、過去の実績や経験を生かすことに加えて、実績の少ない新工法・新技術にも積極的に関心をもち、必要であれば採用していく姿勢が求められます。' },
        { category:'施工計画(全般)', question:'施工計画立案時の事前調査に関する記述として、適当でないものはどれか。', options:['不可抗力による損害の取り扱いや工事代金の支払条件の確認は、現場条件の調査に該当する','事前調査には、契約条件の確認と現場条件の調査がある','現場条件の調査は、調査項目が多いため、脱落がないように事前にチェックリスト等を作成しておくのがよい','現場条件の調査の精度を高めるには、複数の人で調査したり調査回数を重ねる等により、個人的偶発的な要因による錯誤や調査漏れを取り除く'], answer:0, explanation:'不可抗力による損害の取り扱いや工事代金の支払条件の確認は、契約条件の確認に該当するものであり、現場条件の調査ではありません。なお、現場条件の調査で脱落を防ぐために作成するのはチェックリストであり、特性要因図は品質管理の場面で用いる図表なので混同しないよう注意しましょう。' },
        { category:'施工計画(留意事項)', question:'施工計画の作成にあたっての留意事項に関する記述として、適当でないものはどれか。', options:['個人の考えや技術水準だけで計画せず、企業内の関係組織を活用して全社的な技術水準で検討する','契約書、発注図面および工事仕様書に基づいて施工計画を作成すれば、現地調査を行わなくても現場条件や発注者の意向を十分反映できる','品質、工程、原価は相互に関連するため、これらの関係を考慮しながら最善の施工計画を立てる','施工計画は1つの計画のみでなく、いくつかの代替案を作り比較検討のうえ最適案を採用する'], answer:1, explanation:'施工計画の作成にあたって現地調査は必須です。契約書や発注図面等の書類だけでは、現場条件や発注者の意向を高い水準で反映することはできません。また、複数の代替案(安全・品質・工程・環境・原価の5つの視点で評価)を作成して総合的に比較検討し、最適案を採用することが望ましいとされています。' },
        { category:'施工計画(留意事項)', question:'施工計画の作成にあたっての考え方として、適当でないものはどれか。', options:['発注者の要求品質の確保を意識しつつ、何より安全を最優先に考えることが大原則である','工期・環境・経済性等のバランスを考慮しながら全体を検討する','発注者から示された工程が常に最適とは限らないため、経済性や安全性、品質の確保も考慮しながら検討する','請負者の利益を最優先にした計画を策定することが、施工計画の最も大切な目的である'], answer:3, explanation:'請負者の利益を確保することも大切な目的の1つですが、それを最優先にして他の要素が疎かになるのは好ましくありません。安全を最優先に考えることが大原則であり、そのうえで品質、工程、環境、原価等の広い視野を持って計画を立案します。発注者から示された工程も常に最適とは限らず、受注者側が専門家としてアドバイスする姿勢が望まれます。' },
        { category:'施工計画(計画書)', question:'新築工事の着手に先立ち作成する施工計画書に記載するものとして、不適当なものはどれか。', options:['総合工程表','機器承諾図','官公庁届出書類一覧','現場施工体制表'], answer:1, explanation:'施工計画書は着工前に工事の総合的な道筋を俯瞰するために作成するもので、着手後に判明する詳細な設計レベルの仕様や数値は含めないのが一般的です。機器承諾図は、設計を進める中で具体的な仕様が決まった後に作成される施工図に含まれるものであり、施工計画書には含まれません。総合工程表、官公庁届出書類一覧表、現場施工体制表などは施工計画書に記載する事項です。' },
        { category:'施工計画(計画書)', question:'施工計画書の作成に関する記述として、不適当なものはどれか。', options:['労務計画では、合理的かつ経済的に管理するために労務工程表を作成する','搬入計画書は、建築業者や関連業者と打ち合わせて、工期に支障のないように作成する','安全衛生管理計画では、安全管理体制の確立のために施工体制台帳を作成する','施工要領書は、品質の維持向上を図り安全かつ経済的施工方法を考慮して作成する'], answer:2, explanation:'施工体制台帳は、建設工事の適正な施工を確保し下請負人を手抜き工事から保護することを目的として建設業法(第24条の7)に基づき作成するものであり、安全衛生管理計画とは関連性がありません。安全衛生管理計画で作成する書類は、作業者名簿、安全衛生管理組織表、官公庁届出書類等であり、労働災害の防止と労働環境の向上を目的とします。' },
        { category:'施工計画(施工体制台帳)', question:'施工体制台帳の記載に関する記述として、適当でないものはどれか。', options:['「健康保険等の加入状況」は、健康保険、厚生年金保険および雇用保険の加入状況について記載する','下請負人に関する事項も、必ず作成建設業者が自ら記載しなければならない','記載事項に変更があったときは、遅滞なく変更年月日を付記して、既に記載されている事項に加えて変更後の事項を記載する','作成建設業者の建設業の種類は、請け負った建設工事に係る建設業の種類に関わることなく、その全てについて特定か一般かの別を明示して記載する'], answer:1, explanation:'下請が階層的になっている場合、元請と直接の契約がない二次下請(孫請)より下の情報は元請が把握しにくいため、再下請負通知書を提出してもらい各社が協力して記載する場合もあり得ます。元請負人が全情報を自ら記載するばかりではありません。なお、健康保険等の加入状況の記載対象は健康保険・厚生年金保険・雇用保険の3つであり、労災保険ではない点も頻出です。' },
        { category:'施工計画(施工体制台帳)', question:'民間工事における施工体制台帳および施工体系図に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['施工体制台帳の備置きおよび施工体系図の掲示は、建設工事の目的物の引渡しをするまで行う','施工体制台帳は、工事現場ごとに備え置かなければならない','施工体系図は、当該工事現場の見やすい場所に掲げなければならない','特定建設業者が発注者から直接建設工事を請け負った場合は、下請に発注しない場合であっても施工体制台帳および施工体系図を作成しなければならない'], answer:3, explanation:'施工体制台帳・施工体系図の作成義務が生じるのは、下請契約を行う場合に限られます。全ての作業を自社内のみで完結する場合には、受注金額の大小によらず作成義務はありません。なお、施工体系図の掲示場所は、公共工事では工事関係者が見やすい場所と公衆が見やすい場所、民間工事では工事関係者が見やすい場所とされています。' },
        { category:'施工計画(届出書等)', question:'建設工事における法令に基づく申請書等とその提出先の組み合わせとして、適当でないものはどれか。', options:['特定建設作業実施届出書 : 市町村長','道路使用許可申請書 : 道路管理者','機械等設置届 : 所轄労働基準監督署長','航空障害灯の設置の届出 : 地方航空局長'], answer:1, explanation:'道路使用許可申請書の提出先は所轄警察署長です。道路管理者に提出するのは道路占用許可申請書と特殊車両通行許可申請書です。暗記必須の5種は、道路使用許可申請書=所轄警察署長、道路占用許可申請書=道路管理者、特定建設作業実施届出書=市町村長、機械等設置届=所轄労働基準監督署長、航空障害灯の設置届出=地方航空局長です。' },
        { category:'施工計画(届出書等)', question:'法令に基づく申請書・届出書等の提出先に関する記述として、適当でないものはどれか。', options:['自家用電気工作物の使用開始後、自家用電気工作物使用開始届出書を都道府県知事に提出する','限度超過車両(特殊車両)による運搬のため、特殊車両通行許可申請書を道路管理者に提出して許可を受ける','国定公園の特別地域内で工事用の木竹を伐採するため、伐採許可申請書を都道府県知事に提出する','騒音規制法の指定地域内で特定建設作業を伴う建設工事を施工するため、特定建設作業実施届出書を市町村長に届け出る'], answer:0, explanation:'自家用電気工作物使用開始届出書の提出先は経済産業大臣であり、都道府県知事ではありません。特殊車両通行許可申請書は道路管理者(警察署長ではない)、特別地域内木竹の伐採許可申請書は都道府県知事、特定建設作業実施届出書は市町村長が正しい提出先です。書類の種類だけでなく提出先も合わせて覚えておきましょう。' },
        { category:'線路施工(低圧配線)', question:'低圧ケーブルの屋内配線に関する記述として、適当でないものはどれか。', options:['はしご形ケーブルラックに配線する場合、ケーブルは整然と並べ、水平部では5m以下の間隔ごとに固定する','二重床内配線において、ころがし配線として弱電流電線と接触するおそれがある場合は、セパレータにより接触しないように処置する','低圧耐火ケーブル(単心以外)を配線する場合は、ケーブルの曲げ半径(内側半径)を仕上がり外径の6倍以上として敷設する','平形保護層配線において、電力用フラットケーブルとフラットケーブル状の弱電流電線を平行して敷設する場合は、離隔距離を0.1m以上とする'], answer:0, explanation:'ケーブルラックに電線類を配線する場合、ラックの子桁への捕縛の間隔は水平部では3m以下、垂直部では1.5m以下とします。5m以下では基準を超えています。この数値はケーブルラック本体の固定間隔とは異なるため注意が必要です。電源ケーブルの曲げ半径は仕上がり外径の6倍以上、フラットケーブル同士の平行敷設は0.1m以上の離隔が適当です。' },
        { category:'線路施工(低圧配線)', question:'低圧屋内配線の接地工事および絶縁抵抗に関する記述として、適当なものはどれか。', options:['使用電圧415Vの配管にはD種接地工事を施す','400V回路の低圧電路の絶縁抵抗値は、0.2MΩ以上であればよい','通信線路の絶縁抵抗は、直流100Vで測定して0.4MΩ以上が要求される','使用電圧が300Vを超える低圧配線にはC種接地工事を施し、その電路の絶縁抵抗値は0.4MΩ以上とする'], answer:3, explanation:'低圧で用いる接地工事は300Vを境に区分され、300V超はC種、300V以下はD種です。使用電圧415VはC種接地工事が必要で、D種では不適当です。また、対地電圧もしくは線間電圧が300Vを超える低圧電路の絶縁抵抗は0.4MΩ以上が求められます(電気設備の技術基準)。なお通信線路の絶縁抵抗は直流100Vで測定して1MΩ以上(有線電気通信設備令)であり、電路とは基準が異なります。' },
        { category:'線路施工(メタル系)', question:'通信用メタルケーブルの屋内配線に関する記述として、適当でないものはどれか。', options:['管内配線において、通線直前に管内を清掃し、ケーブルを破損しないように通線する','床上配線では、ワイヤープロテクタを使用して配線し、ケーブルを引出す箇所では被覆を損傷しないように保護する','ころがし配線において、既設低圧ケーブルの上に通信用メタルケーブルを直接乗せて交差させる','ケーブルラック配線において、垂直に敷設する場合はケーブルをケーブルラックの子桁に捕縛する'], answer:2, explanation:'天井裏等でころがし配線をする場合、低圧ケーブルと通信用ケーブルは離隔しなければならず、直接乗せて交差させることは禁止です。接触や積み重ねを行うと、電磁誘導などによりノイズを拾う原因にもなります。なお、垂直敷設時の捕縛では、ケーブルが複数あるときは捕縛の箇所を分散して、特定の子桁に重量が集中しないように施工します。' },
        { category:'線路施工(メタル系)', question:'通信用メタルケーブルの敷設に関する記述として、適当なものはどれか。', options:['造営材に直接敷設するケーブル工事では、曲げ半径をケーブル外径の2倍以下とする','垂直に敷設する管路内のケーブルは、プルボックス内で支持部材に緊縛し、6m以下の間隔で支持する','ケーブルラック配線で電力用ケーブルと共に敷設する場合は、電力用ケーブルに積み重ねて整然と並べて敷設する','垂直配管内のケーブルは、プルボックス内の他の電力用ケーブルを支持物として緊縛する'], answer:1, explanation:'垂直配管内に敷設するケーブルは、プルボックス内で支持部材に緊縛し、支持間隔はケーブルの場合6m以下とします(プルボックスも6m以下で配置)。周辺の他のケーブル類に緊縛してはいけません。造営材に直接敷設する場合の曲げ半径はケーブルの種類によって外径の4~10倍以上とし、2倍以下に曲げると内部構造を壊すおそれがあります。電力用と通信用のケーブルは離隔が必要で、積み重ねは不適当です。' },
        { category:'線路施工(UTPケーブル)', question:'UTPケーブルの施工に関する記述として、適当でないものはどれか。', options:['水平配線の配線後の許容曲げ半径は、ケーブル外径の4倍とした','水平配線の長さは、パッチコード等も含め100m以内とした','ケーブルの成端作業時、対の撚り戻し長は最大とした','ケーブルに過度の外圧が加わらないように固定した'], answer:2, explanation:'ツイストペアケーブルを成端する場合の撚り戻し長は、最小となるように努めなければなりません(Cat5eで12.7mm、Cat6で6.4mmが限度)。撚り戻しが長過ぎると漏話減衰量を増大させてしまいます。フロア配線盤から通信アウトレットまでの水平配線長は、パッチコード等も含めて最長100mであり、150mは超過となります。' },
        { category:'線路施工(同軸ケーブル)', question:'同軸ケーブルの施工に関する記述として、適当でないものはどれか。', options:['屋内配線において、同軸ケーブルが低圧ケーブルと交差する場合は、接触しないように敷設する','同軸ケーブルと機器との接続や同軸ケーブル相互の接続は、ケーブルの種類に対応したコネクタを用いて行う','同軸ケーブルの呼び「S-5C-2V」の先頭の「S」は、衛星放送対応であることを表す','新4K8K衛星放送に対応した衛星放送受信アンテナからテレビ受像機までの給電線には、3C-2Vの同軸ケーブルが適している'], answer:3, explanation:'3C-2Vは衛星放送に対応していない同軸ケーブルであり、衛星放送受信用の給電線には適しません。衛星放送受信用のものは、呼びの先頭の項が「S」になります(例:S-5C-FB)。また、同軸ケーブルを曲げる場合は、曲げ半径を使用するケーブルの許容曲げ半径より大きくする必要があり、小さく曲げると内部構造を破壊して損失の原因となります。特性インピーダンスはC:75Ω(主にテレビ用)、D:50Ω(主に通信用)です。' },
        { category:'線路施工(光ファイバ)', question:'光ファイバケーブルの接続に関する記述として、適当でないものはどれか。', options:['メカニカルスプライスは、光ファイバの端面と端面をV溝上や精密パイプ内等で突き合わせ、機械的に保持固定する方法である','融着接続は、誘導加熱により光ファイバを直接加熱して溶かすことで接続する方法が一般的である','コネクタ接続は、比較的頻繁に接続替えが行われる可能性のある箇所に使用される','融着接続やメカニカルスプライスは永久接続であり、コネクタ接続は着脱可能な接続である'], answer:1, explanation:'融着接続の加熱方式は、一般的にはアーク放電式が用いられます。光ファイバの先端を2,000℃以上に加熱溶融して接続を行うもので、誘導加熱ではありません。融着接続とメカニカルスプライスは永久接続に区分され、いったん接続すると着脱できません。頻繁に接続替えの可能性がある箇所(光回線を装置に収容する場合等)にはコネクタ方式が有効です。' },
        { category:'線路施工(光ファイバ)', question:'光ファイバケーブルの施工に関する記述として、適当でないものはどれか。', options:['一定方向への延線が困難な場合や、敷設張力が許容張力を超えるおそれがある場合は、敷設ルートの中間で8の字取りを行う','許容曲げ半径は、延線作業中は仕上り外径の20倍以上、敷設後は10倍以上とする','引張り端は、テンションメンバに張力がかかるようにし、ケーブル端面から浸水しないように防水処置を施す','ノンメタリック光ファイバケーブルを使用する場合は、誘導雷サージ対策としてテンションメンバを接地する'], answer:3, explanation:'ノンメタリック仕様の光ファイバは、中心のテンションメンバがFRP繊維で作られており金属製ではないため、接地する効果はありません。そのため誘導雷サージ対策としての接地は不適当です。許容曲げ半径は延線時が仕上り外径の20倍以上、敷設後が10倍以上であり、敷設ルート中間での一時滞留は8の字形に取ります(日形ではよじれが一方的になり取り回しが困難になります)。' },
        { category:'線路施工', question:'マイクロ波多重無線設備で使用される導波管の施工に関する記述として、適当でないものを全て選べ。', options:['導波管のフランジ接続は、ノックピンを使用してズレが起こらないように正確に接続し、その結合用ねじには、ステンレス製を使用する','導波管を通信機械室に引き込むため、適合する引込口金具を使用し、室内に雨水が浸入しないように防水処置を行う','導波管のフランジには、無線機から気密窓導波管までは気密形を使い、気密窓導波管から空中線までは非気密形を使用する','空中線から気密窓導波管までの区間に長尺可とう導波管を使用し、直線部だけでなく曲がり部にも使用する'], answer:2, explanation:'室外に施設する導波管には雨水等が入り込まないように気密形を使用し、室内に設けるものは非気密形でも問題ない。③は部材の使用法が逆であり、不適当。' },
        { category:'機器据付', question:'建物内での電気通信機器等の耐震施工に関する記述として、適当でないものを全て選べ。', options:['機器の設置は、可能な限り床置きとし、天井つりおよび壁掛けは極力さける','卓上装置は、地震時に水平移動又は卓上から落下しないように、耐震用品で固定する','機器を建築物の床に固定するためのアンカーボルトは、一般的に地震の揺れが下層階より上層階のほうが小さいため、上層階ほど強度の弱いものを使う','据付面の大きさと比べて高さの高い機器は、壁、柱等から頂部揺れ止めが容易な場所に設置する'], answer:2, explanation:'耐震設計の根拠となる加速度は支点からの距離に依存し、下層階よりも上層階のほうが加速度が大きく揺れも大きい。③が不適当。' },
        { category:'機器据付', question:'建物内での電気通信機器等の耐震施工に関する記述として、適当でないものを全て選べ。', options:['機器を建築物の床に固定するアンカーボルトは、一般的に地震の揺れが下層階より上層階のほうが大きいため、上層階ほど強度の高いものを使う','機器の設置は、可能な限り床置きとし、天井つりおよび壁掛けは極力さける','機器の頂部を固定する頂部支持材は、軽量間仕切壁に固定する','卓上装置は、地震時に水平移動または卓上から落下しないように、耐震用品で固定する'], answer:2, explanation:'機器頂部の揺れ止めは、壁や柱、もしくは梁といった丈夫な構造の部位から出すべきである。軽量間仕切壁では強度が不十分。③が不適当。' },
        { category:'機器据付', question:'あと施工アンカーの施工に関する記述として、適当でないものを全て選べ。', options:['締付け方式の金属拡張アンカーは、アンカーのサイズに適合した重さの専用ハンマーと専用打込み棒を用いて拡張部を拡張する','打込み方式の金属拡張アンカーは、施工終了後に目視または打音でアンカーが固着されていることを確認する','カプセル方式の接着系アンカーの打込み型は、カプセルを孔内に挿入し、その上からアンカー筋をハンマー等で打ち込んで埋め込む','カプセル方式の接着系アンカーは、アンカー筋の埋め込み後は、接着剤が硬化するまで、アンカー筋が動かないように養生する'], answer:0, explanation:'ハンマーと打込み棒を用いて拡張部を広げるのは打込み方式。締付け方式はボルトやナットを締め込むことで拡張部を引っ張り上げて固着させるもの。①が不適当。' },
        { category:'機器据付', question:'あと施工アンカーの施工に関する記述として、適当でないものを全て選べ。', options:['墨出しは、施工図に基づき、鉄筋等の干渉物がないことを確認したうえで、母材に穿孔を満足する厚みがあることを確認したのちに行う','母材の穿孔は、墨出し位置に、施工面に対し垂直方向に、仕様に合った適正なドリルで穴あけを行う','金属拡張アンカーと母材との固着は、打込み方式の場合は専用打ち込み棒を用いて拡張部を拡張し、締付け方式の場合は適切な締付け工具で拡張部を拡張する','芯棒打込み式金属拡張アンカーの施工終了後、ダイヤル型トルクレンチによりトルク値を確認する'], answer:3, explanation:'打込み方式はハンマーで叩いて固着させるものであり、トルク値の管理が必要となるのは締付け方式の場合である。④の記述は不適当。' },
        { category:'工程管理', question:'建設工事の工程管理に関する記述として、適当でないものを全て選べ。', options:['工程管理とは、実際に進行している工事が工程計画の通りに進行するように調整することである','工程管理は、PDCAサイクルの手順で実施される','工程管理、品質管理、原価管理は、お互いに関連性がないため、品質や原価を考慮せずに工程管理が行われる','工程管理に際しては、工程の進行状況を全作業員に周知徹底させ、作業能率を高めるように努力させることが重要である'], answer:2, explanation:'工程・品質・原価の3つの管理は互いに密接な関連性を持っている。品質や原価との関連性を考慮して適正なバランスをとりながら工程管理を進めることが大切。③が不適当（相互に関連性あり）。' },
        { category:'工程管理', question:'建設工事の工程管理に関する記述として、適当でないものを全て選べ。', options:['施工段階においても実施工程を分析・検討し、工程計画に実施工程を近づけるように施工状況を調整したり、計画を修正する等総合的管理を行う','工程管理は、計画→実施→検討→処置の手順で行われるが、この手順において、工程計画は計画に該当し、工事の指示・承諾・協議は実施に該当する','工程管理の目的は、工期を守るための単なる時間的管理に留まらず、労働力や機械設備、資材、施工方法等の生産手段を最も効率的に活用させることにある','工程と原価の関係は、施工速度を上げると原価は安くなり、さらに施工速度を上げようとすると突貫工事により原価はさらに安くなる'], answer:3, explanation:'突貫工事を行うと多くの作業者の投入や高性能な機材の調達等でコストが増大する性質がある。コストが最も低くなる施工速度を「経済速度」と呼ぶ。④が不適当。' },
        { category:'工程管理', question:'各種工程表の種類と特徴に関する記述として、適当なものを全て選べ。', options:['バーチャートは、横軸に部分工事をとり、縦軸に各部分工事に必要な日数をとる','バーチャートは、図表の作成が容易であり、各部分工事の工期がわかりやすいので、総合工程表として一般的に使用される','ガントチャートは、縦軸に出来高比率をとり、横軸に工期をとって工事全体の出来高比率の累計を曲線で表す','ガントチャートは、工事全体の出来高比率の累計はよくわかるが、部分工事の進捗度合いはわかりにくい'], answer:1, explanation:'バーチャートは縦軸に工種（部分工事）をとり、横軸に日数を棒線で記入するもので①は不適当。ガントチャートは縦軸に部分工事、横軸に出来高比率をとるもので③は不適当。ガントチャートは部分工事の進捗度合いは一目で判断できるが、工事全体の出来高比率の累計は把握できないため④も不適当。②が適当。' },
        { category:'工程管理', question:'下図に示すバナナカーブによる工程管理に関する次の記述の□に当てはまる語句の組み合わせとして、適当なものはどれか。「時間経過率に応じた当該工事の出来高比率をプロットし、その出来高比率が、上方許容限界曲線と下方許容限界曲線の（ア）にあれば良く、下方許容限界曲線の（イ）にある場合は工程の進捗が遅れており、上方許容限界曲線の（ウ）にある場合は人員や機械の配置が多過ぎる等計画に誤りがあることが考えられる。」', options:['（ア）上　（イ）上　（ウ）上','（ア）上　（イ）下　（ウ）下','（ア）間　（イ）下　（ウ）上','（ア）間　（イ）上　（ウ）下'], answer:2, explanation:'上方許容限界と下方許容限界の2本のS字曲線に囲まれたエリアが適正な日程で進行している範囲。実績値が下方許容限界曲線の下にある場合は進捗が遅れており、上方許容限界曲線の上にある場合は計画より進み過ぎていると判断する。③が適当。' },
        { category:'工程管理', question:'工程管理で使われる工程表に関する次の記述（ア）〜（ウ）の名称の組み合わせとして、適当なものはどれか。（ア）縦軸に出来高比率をとり、横軸に日数をとって、工種ごとの工程を斜線やS字曲線で表した図表である（イ）縦軸に部分工事をとり、横軸に各部分工事に必要な日数を棒線で記入した図表である（ウ）縦軸に出来高比率をとり、横軸に工期をとって、工事全体の出来高比率の累計を曲線で表した図表である', options:['（ア）出来高累計曲線　（イ）バーチャート　（ウ）グラフ式工程表','（ア）グラフ式工程表　（イ）出来高累計曲線　（ウ）バーチャート','（ア）グラフ式工程表　（イ）バーチャート　（ウ）出来高累計曲線','（ア）バーチャート　（イ）グラフ式工程表　（ウ）出来高累計曲線'], answer:2, explanation:'縦軸に出来高比率を配し横軸に時間を置いて作業ごとの工程を斜め方向に記入する（ア）はグラフ式工程表。（イ）はバーチャート、（ウ）は出来高累計曲線の説明。③が適当。' },
        { category:'ネットワーク工程表', question:'ネットワーク工程表のクリティカルパスに関する記述として、適当なものはどれか。', options:['クリティカルパスは、開始時点から終了時点までの全ての経路のうち、最も日数の短い経路である','工程短縮の手順として、クリティカルパスに着目する','クリティカルパスは、必ず1本になる','クリティカルパス以外の作業では、フロートを使ってしまってもクリティカルパスにはならない'], answer:1, explanation:'クリティカルパスは最も日数がかかる経路であり①は不適当。工程を短縮したい場合はクリティカルパス上の作業内容に着目せざるを得ないため②は適当。クリティカルパスは必ずしも1本とは限らず③は不適当。フロートを使い切ってしまうと、そこがクリティカルパスになってしまう場合があるため④も不適当。' },
        { category:'ネットワーク工程表', question:'ネットワーク工程表に関する記述として、適当でないものはどれか。', options:['アクティビティは、トータルフロートが0の作業の結合点を結んだ一連の経路である','フリーフロートは、作業を最早開始時刻で始めてから完了した後、後続作業を最早開始時刻で始めるまでの余裕日数である','ダミーは、実際に遂行しなければならない作業を表すものではなく、作業の相互関係を示すために使用される所要時間が0の矢線である','先行作業でトータルフロートを消費すると、後続作業のトータルフロートは、その消費した日数分少なくなる'], answer:0, explanation:'トータルフロートが0となる作業の結合点を結んだルートはクリティカルパスであり、アクティビティではない。アクティビティとは作業を意味する。①が不適当。' },
        { category:'品質管理', question:'JIS Q 9000:2015の品質マネジメントシステム−基本および用語における品質特性の定義として、適当なものはどれか。', options:['要求事項に関連する、対象に本来備わっている特性','特徴付けている性質','測定結果に影響を与え得る特性','対象に本来備わっている特性の集まりが、要求事項を満たす程度'], answer:0, explanation:'「要求事項に関連する、対象に本来備わっている特性」が品質特性の定義であり①が適当。②は「特性」、③は「計量特性」、④は「品質」の定義である。' },
        { category:'品質管理', question:'ISO 9000ファミリー規格の品質マネジメントシステムのリーダーシップおよびコミットメントに関する記述として、適当でないものはどれか。', options:['組織の事業プロセスへの品質マネジメントシステム要求事項の統合を確実にする','品質マネジメントシステムがその意図した結果を達成することを確実にする','品質マネジメントシステムに必要な資源が利用可能であることを確実にする','品質マネジメントシステムのリスクに説明責任を負う'], answer:3, explanation:'ISO 9001（要求事項）のリーダーシップの中では「品質マネジメントシステムの有効性に説明責任を負う」と定義されており、「リスクに説明責任」ではない。④が不適当。' },
        { category:'品質管理', question:'品質管理で使用される「ヒストグラム」に関する記述として、適当なものはどれか。', options:['データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図である','不良、クレーム、故障、事故等の問題の解決にあたり、原因別、結果別に分類し、大きい順に並べ、棒グラフと累計曲線で表した図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである','2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる'], answer:0, explanation:'ヒストグラムを説明したものは①。分布の状態（山の形）によって工程の異常等を判断する材料とする。②はパレート図、③は特性要因図、④は散布図の説明。' },
        { category:'品質管理', question:'品質管理で使用される「パレート図」に関する記述として、適当なものはどれか。', options:['2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる','不適合、クレーム等を、その現象や原因別に分類してデータをとり、不適合品数や手直し件数等の多い順に並べて、その大きさを棒グラフで表し、累積曲線で結んだ図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである','中心線と上下2本の管理限界線が書かれたグラフの中に、統計処理したデータを点として書き入れたもので、その点が管理限界線より外に出れば、工程に異常があると判断して、原因究明や処置を行う'], answer:1, explanation:'パレート図は棒グラフと折れ線グラフ（累積曲線）を融合させた図表で、②が適当。①は散布図、③は特性要因図、④は管理図の説明。' },
        { category:'品質管理', question:'品質管理で使用される「特性要因図」に関する記述として、適当なものはどれか。', options:['データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図である','不良、クレーム、故障、事故等の問題の解決にあたり、原因別、結果別に分類し、大きい順に並べ、棒グラフと累計曲線で表した図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである','2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる'], answer:2, explanation:'特性要因図の説明は③。結果から原因に遡って問題点を洗い出す手法で、図表全体が魚の骨に似ていることから別名フィッシュボーンともいう。①はヒストグラム、②はパレート図、④は散布図。' },
        { category:'品質管理', question:'品質管理で使用される「散布図」に関する記述として、適当なものはどれか。', options:['データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図である','2つの対になったデータをグラフ用紙の上に点で表した図であり、対になったデータの関係がわかる','不適合、クレーム等を、その現象や原因別に分類してデータをとり、不適合品数や手直し件数等の多い順に並べて、その大きさを棒グラフで表し、累積曲線で結んだ図である','問題とする特性と、それに影響を及ぼしていると思われる要因との関連を整理して、魚の骨のような図に体系的にまとめたものである'], answer:1, explanation:'散布図は②の説明が該当。2つの特性値の相関関係の有無を視覚的に判断するためのグラフ。①はヒストグラム、③はパレート図、④は特性要因図。' },
        { category:'品質管理', question:'下図の管理図が示す工程の状態に関する記述として、適当なものはどれか。', options:['全ての点が上下2本の管理限界線の内にあるが、点が次第に上昇する傾向にあるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、点が次第に下降する傾向にあるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、中心線より上の側に点が9個連続して並んでいるため、工程に異常がある','全ての点が上下2本の管理限界線の内にあるが、隣り合う点が周期的に上下しているため、工程に異常がある'], answer:2, explanation:'JIS Z 9021「シューハート管理図」の異常判定ルールには「連続する9点が中心線に対して同じ側にある」がある。選択肢のうち異常判定ルールに抵触するのは③が該当し、③が適当。' },
        { category:'品質管理', question:'工場立会検査に関する記述として、適当でないものはどれか。', options:['発注者が、設計図書で要求される機器の品質・性能を満足していることを確認するために行う','検査対象機器および検査方法については、検査要領書にて発注者の承認を得る','工場立会検査の結果、設計図書で要求される品質・性能を満たさない場合は、受注者に手直しをさせる','工場立会検査の結果、手直しが必要となった場合、その手直しについては、工事全体工程を考慮しなくてもよい'], answer:3, explanation:'手直しが数日間に及ぶと現場への納入が遅延し下流工程に影響を与え、工事全体工期も遅延する要因となるため、工事全体工程は当然に考慮すべき項目である。④が不適当。' },
        { category:'品質管理', question:'製品の全数を検査し良品と不良品に分け、良品だけを合格とする方法である全数検査が有効な場合として、適当なものはどれか。', options:['製品の破壊検査が必要な場合','製品の数量が非常に多い場合','わずかな不良品の混入も許されない場合','製品が連続体の場合'], answer:2, explanation:'破壊検査は検査対象を破壊するため全数検査は実施できない。数量が非常に多い場合や連続体の場合は抜取検査が望まれる。わずかな不良品の混入も許されない場合は全数検査が望まれるケースであり、③が適当。' },
        { category:'品質管理', question:'無線機のスプリアス発射の強度の測定に使用する測定器として、適当なものはどれか。', options:['周波数カウンタ','クランプメータ','電力量計','スペクトラムアナライザ'], answer:3, explanation:'必要周波数帯の周辺で電波のスペクトルがどのように分布しているかを俯瞰するには、周波数方向に広い画角を持つスペクトラムアナライザが該当する。④が適当。' },
        { category:'品質管理', question:'150MHz帯4値FSK変調方式の移動無線設備工事の品質管理に関する記述として、適当なものはどれか。', options:['BER測定器により送信周波数を測定し、規格値を満足していることを確認した','クランプメータにより受信感度を測定し、規格値を満足していることを確認した','SWR計により反射電力を測定し、規格値を満足していることを確認した','電力量計により送信出力を測定し、規格値を満足していることを確認した'], answer:2, explanation:'BER測定器では周波数は測れない（周波数カウンタを使用）。クランプメータは電流値を測る測定器で受信感度は測れない。送信出力を測るのは電力計（電力量計は累計値用）。SWRは進行電力に対する反射電力の度合いを表すものであり、③が適当。' },
        { category:'品質管理', question:'ツイストペアケーブルの測定試験項目であるワイヤマップの試験に関する記述として、適当なものはどれか。', options:['信号が一端から他端へ伝搬するために要する時間を測定するものである','ツイストペアケーブルの各心線について、正しい対組み合わせ、対反転や対交差等、ケーブル両端の接続状態を確認するものである','任意の2対において1対を送信回線として、残りの1対を受信回線とし受信回線に漏れてくる近端側の受信レベルを測定するものである','送信端に信号を入力し、受信端で信号の減衰量を測定するものである'], answer:1, explanation:'ワイヤマップ試験はツイストペアケーブルの両端の接続状態を確認するための測定試験で、断線や短絡、対反転、対交差、対分割についてのテストを行うことができる。②が適当。' },
        { category:'品質管理', question:'LAN工事の施工品質の確認に関する記述として、適当なものはどれか。', options:['LAN用光ファイバケーブル敷設後に高周波電力計により光損失を測定する','UTPケーブル敷設後に絶縁抵抗計により挿入損失を測定する','無線LANアクセスポイント設置後にOTDRにより電界強度を測定する','IP系ネットワーク機器設置後にpingコマンドにより端末機器間の疎通確認を行う'], answer:3, explanation:'光損失の測定はOTDR等で行い、高周波電力計では測定できない。UTPケーブルの挿入損失はLANケーブルテスタ等で測定する。電界強度の測定には電界強度計を使う。pingコマンドはICMPを用いてIPネットワークの正常性・疎通を確認する機能であり、④が適当。' },
        { category:'原価管理', question:'次に示す利益図表に関する記述として、適当なものはどれか。', options:['減価償却される自社所有の建設用機械のコストは、固定費であるため固定原価に該当する','工事原価は、固定原価、変動原価、利益に区分される','労務費は、固定費であるため固定原価に該当する','施工出来高が増え損益分岐点を超えると利益が出なくなる'], answer:0, explanation:'減価償却費は工事案件の進捗状況に左右されないため固定費となり、①が適当。工事原価は固定原価と変動原価の2種に分けられ利益は含まれない（②不適当）。労務費は必ずしも固定費とは限らない（③不適当）。' },
        { category:'原価管理', question:'建設工事の原価管理に関する記述として、適当でないものはどれか。', options:['原価管理では、合理的な施工方法に基づき見積原価を算出し、これに企業経営に必要な一般管理費を加えて、実行予算原価を編成する','原価管理では、実際にかかった原価と工事施工開始に伴って積算された実行予算との差を分析・検討して適切な処置を行い、実際の原価と実行予算の管理を行う','原価管理では、発注者の要求事項を無視して利益を出すのではなく、受注した金額以下でそれ以上の価値を完成させ、適正利潤を確保できるよう管理を行う','原価管理では、工程管理、品質管理、労務管理、資材管理、安全管理と関連して種々の能率向上やコストダウンを図ることが重要である'], answer:0, explanation:'一般管理費は現場で管理すべき実行予算原価とはいえず、本社側で管理すべきものと解釈するのが自然。①が不適当（一般管理費は実行予算に含まない）。' },
        { category:'河川法令', question:'河川管理者の許可が必要な事項に関する記述として、「河川法令」上、誤っているものはどれか。', options:['河川区域内に仮設の資材置場を設置する場合は、河川管理者の許可が必要である','電線を河川区域内の上空を通過して設置する場合は、河川管理者の許可が必要である','河川区域内で下水処理場の排出口の付近に積もった土砂を排除するときは、河川管理者の許可が必要である','一時的に少量の水をバケツで河川からくみ取る場合は、河川管理者の許可は必要ない'], answer:2, explanation:'排出口の付近に積もった土砂を排除する等の保守的な措置については、許可は必要ない。したがって③が誤り。河川区域内の上空に電線を通過させる場合や仮設の資材置場を設ける場合は占有にあたり許可が必要。少量の水のくみ取りも許可不要。' },
        { category:'河川法令', question:'河川管理者の許可が必要な事項に関する記述として、「河川法」上、正しいものはどれか。', options:['河川区域の上空に、光ファイバケーブルを横断して新設する場合は、河川管理者の許可を受ける必要はない','河川区域内における電柱の新設について、河川管理者の許可を受けている場合は、その電柱を施行するための土地の掘削に関して、新たに許可を受ける必要はない','河川区域内の民有地に一時的な仮設工作物として現場事務所を設置する場合は、河川管理者の許可を受ける必要はない','河川区域内で河川管理者の許可を受けて設置した送電鉄塔を撤去する場合は、河川管理者の許可を受ける必要はない'], answer:1, explanation:'電柱の新設の許可は、施工に関わる個々の作業（掘削等）を含んだ包括的なものと理解すればよく、掘削にあたっての新たな許可は不要。②が正しい。工作物の新設・改築だけでなく撤去する際にも許可は必要であり④は誤り。' },
        { category:'河川法令', question:'河川管理者の許可が必要な事項に関する記述として、「河川法」上、誤っているものはどれか。', options:['河川区域の上空に、光ファイバケーブルを横断して新設する場合は、河川管理者の許可を受ける必要がある','河川区域内に河川管理者の許可を受けて設置された監視カメラの故障した機器を交換する場合は、河川管理者の許可を受ける必要がある','河川区域内に河川管理者の許可を受けて設置された水位計を撤去する場合は、河川管理者の許可を受ける必要がある','河川区域内の民有地に一時的に仮設の資材倉庫を設置する場合は、河川管理者の許可を受ける必要がある'], answer:1, explanation:'許可を受けて設置した監視カメラや水位計等の機材が故障したときは修理に向かうことになるが、この際の部品や機器の交換については許可は不要。②が誤り。河川区域の内方であれば民有地・一時的・仮設であろうと新設の場合には全て許可が必要。' },
        { category:'労働安全衛生法令', question:'作業主任者の選任を必要とする作業に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['掘削面の高さが3mの地山の掘削（ずい道およびたて坑以外の坑の掘削を除く）の作業','土止め支保工の切りばりまたは腹起こしの取り付けまたは取り外しの作業','高さが3mの無線通信用鉄塔の組立て作業','地下に設置されたマンホール内の通信ケーブルの敷設作業'], answer:2, explanation:'鉄塔の組立て作業については高さ5m以上が該当し、5m未満の場合は対象外。したがって③が誤り。地山の掘削は高さ（深さ）2m以上で作業主任者の選任が必要。マンホール内部は酸素欠乏危険作業に該当し選任が必要。' },
        { category:'労働安全衛生法令', question:'作業主任者の選任を必要とする作業として、「労働安全衛生法令」上、誤っているものはどれか。', options:['高さ3mの構造の足場の組立ての作業','掘削面の高さが2mとなる地山の掘削（ずい道およびたて坑以外の坑の掘削を除く）の作業','高さが10mの無線通信用鉄塔の組立ての作業','地下に設置されたマンホール内での通信ケーブルの敷設の作業'], answer:0, explanation:'足場の組立て作業は5m以上の現場が対象で、5m未満の場合は該当しない。①が誤り。なお、つり足場と張出し足場は高さによる条件がなく、常に作業主任者の選任が必要。その他の選択肢②〜④はいずれも作業主任者を要する作業となる。' },
        { category:'労働安全衛生法令', question:'総括安全衛生管理者が行う統括管理の業務として、「労働安全衛生法」上、誤っているものはどれか。', options:['健康診断の実施その他、健康の保持促進のための措置に関すること','工事遅延の原因の調査、および再発防止対策に関すること','労働者の危険または、健康障害を防止するための措置に関すること','労働者の安全または、衛生のための教育の実施に関すること'], answer:1, explanation:'総括安全衛生管理者が行うべき統括管理の業務は根拠法令に示す5項目が該当し、選択肢のうち含まれないのは②。近い表現の項目として「労働災害の原因の調査及び再発防止対策に関すること」があるが、工事遅延に関するものではない。' },
        { category:'労働安全衛生法令', question:'産業医を選任しなければならない規模の事業場として、「労働安全衛生法令」上、正しいものはどれか。', options:['常時10人以上の労働者を使用する事業場','常時20人以上の労働者を使用する事業場','常時30人以上の労働者を使用する事業場','常時50人以上の労働者を使用する事業場'], answer:3, explanation:'安全管理者や衛生管理者を選任する場合と同じく、常に50人以上が所属する事業場では産業医を選任して配置しなければならない。④が正しい。産業医は医師であって、その組織に所属する従業者の健康管理等を行う。' },
        { category:'労働安全衛生法令', question:'安全衛生推進者に関する記述として、「労働安全衛生法」上、誤っているものはどれか。', options:['安全衛生推進者を選任しなければならない事業場の規模は、常時10人以上の労働者を使用する事業場である','労働者の危険または健康障害を防止するための措置に関することは、安全衛生推進者の業務に該当する','安全衛生推進者の選任は、都道府県労働局長の登録を受けた者が行う講習を修了した者のうちから行い、その事業場に専属の者を選任する','安全衛生推進者の選任は、選任すべき事由が発生した日から7日以内に行わなければならない'], answer:3, explanation:'選任すべき状況となった場合には、14日以内に選任する必要がある。したがって④が誤り。' },
        { category:'労働安全衛生法令', question:'建設工事現場における店社安全衛生管理者の職務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['少なくとも毎月1回、労働者が作業を行う場所を巡視すること','衛生委員会を設けること','協議組織の会議に随時参加すること','労働者の作業の種類その他作業の実施の状況を把握すること'], answer:1, explanation:'店社安全衛生管理者が行うべき職務は根拠法令に示した4項目であり、「衛生委員会を設けること」は含まれていない。衛生委員会の設置は事業者が行うべき事項とされている。②が誤り。' },
        { category:'労働安全衛生法令', question:'特定元方事業者が統括安全衛生責任者に統括管理させなければならない事項に関する記述として、「労働安全衛生法」上、誤っているものはどれか。', options:['作業間の連絡および調整を行うこと','関係請負人が行う労働者の安全または衛生のための教育に対する指導、および援助を行うこと','協議組織の設置および運営を行うこと','施工体制台帳および施工体系図の作成を行うこと'], answer:3, explanation:'統括安全衛生責任者が統括管理すべき事項は6項目あり、「施工体制台帳および施工体系図の作成」は対象外。これは元請となる特定建設業者の役割である。④が誤り。' },
        { category:'建設業法令', question:'「建設業法」を根拠法として、指定建設業として定められていないものを選べ。', options:['建築工事業','電気工事業','電気通信工事業','管工事業'], answer:2, explanation:'建設業許可の区分は29種あり、そのうち指定建設業として定められているのは、土木工事業・建築工事業・電気工事業・管工事業・鋼構造物工事業・舗装工事業・造園工事業の7種のみ。電気通信工事業は該当しない。' },
        { category:'建設業法令', question:'「建設業法」を根拠法とし、建設業の許可について、誤っているものを選べ。', options:['都道府県知事の許可を受けた建設業者は、他の都道府県において営業することができる','発注者から直接請け負う一件の請負代金の額により、建設業の許可は、一般建設業と特定建設業とに分類される','建設工事の種類に対応する建設業ごとに、建設業の許可を受けなければならない','政令で定める軽微な建設工事のみを請け負う者を除き、建設業を営もうとする者は、建設業法に基づく許可を受けなければならない'], answer:1, explanation:'建設業の許可は、下請業者に再発注する金額の規模によって一般建設業と特定建設業に分けられる。元請自らの受注金額は建設業許可には関係ない。発注者から直接請け負った際に下請に再発注する総額が5,000万円未満であれば一般建設業で構わない。②が誤り。' },
        { category:'建設業法令', question:'建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。', options:['一般建設業の許可を受けた者が、当該許可に係る建設業について、特定建設業の許可を受けたときは、その者に対する当該建設業に係る一般建設業の許可は、その効力を失う','建設業の許可は、5年ごとにその更新を受けなければ、その期間の経過によって、その効力を失う','建設業者は、許可を受けた建設業に係る建設工事を請け負う場合においては、当該建設工事に附帯する他の建設業に係る建設工事を請け負うことができる','2以上の都道府県の区域内に営業所を設けて営業をしようとする場合は、それぞれの営業所の所在地を管轄する都道府県知事の許可を受けなければならない'], answer:3, explanation:'営業所が2つ以上の都道府県に置かれている場合には、それぞれの知事ではなく国土交通大臣の許可が必要。大臣許可を受けた場合には知事の許可は必要ない。④が誤り。' },
        { category:'建設業法令', question:'建設業の許可に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['法人が建設業の許可を受けようとする場合、当該法人またはその役員等もしくは政令で定める使用人が、請負契約に関して不正または不誠実な行為をするおそれが明らかな者でないこと','建設業の許可は、5年ごとにその更新を受けなければ、その期間の経過によって効力を失う','特定建設業の許可を受けようとする者は、発注者との間の請負契約で、その請負代金の額が6,000万円以上であるものを履行するに足りる財産的基礎を有する必要がある','建設業を営もうとする者は、2以上の都道府県の区域内に営業所を設けて営業をしようとする場合にあっては、国土交通大臣の許可を受けなければならない'], answer:2, explanation:'特定建設業の許可では「発注者との請負契約で、その請負代金の額が政令で定める金額以上であるものを履行するに足りる財産的基礎を有すること」と規定されており、この金額は建設業法施行令で指定されていて現在は8,000万円となっている。③が誤り。' },
        { category:'建設業法令', question:'建設工事の請負契約に関する記述として、「建設業法」上、誤っているものはどれか。', options:['建設工事の請負契約において請負代金の全部または一部の前金払をする定めがなされたときは、注文者は、建設業者に対して前金払をする前に、現場代理人を立てることを請求することができる','建設業者は、建設工事の注文者から請求があったときは、請負契約が成立するまでの間に、建設工事の見積書を交付しなければならない','注文者は、請負契約の履行に関し、工事現場に監督員を置く場合においては、監督員に関する事項を書面により請負人に通知しなければならない','注文者は、その注文した建設工事を施工するために通常必要と認められる期間に比して、著しく短い期間を工期とする請負契約を締結してはならない'], answer:0, explanation:'前金を受領した請負業者が債務不履行となる可能性に備えて、注文者は当該の請負業者に保証人を付けることを請求する権利がある。現場代理人ではない。①が誤り。現場代理人は、元請が代表者（社長等）の代理として現場に配置するべき人物であり、ここでの保証人とは一切関係ない。' },
        { category:'建設業法令', question:'建設工事の請負契約に関する記述として、「建設業法」上、誤っているものはどれか。', options:['建設業者は、その請け負った建設工事を、いかなる方法をもってするかを問わず、一括して他人に請け負わせてはならない','建設業者は、建設工事の注文者から請求があったときは、請負契約の締結後速やかに、建設工事の見積書を交付しなければならない','注文者は、自己の取引上の地位を不当に利用して、その注文した建設工事を施工するために通常必要と認められる原価に満たない金額を請負代金の額とする請負契約を締結してはならない','委託その他いかなる名義をもってするかを問わず、報酬を得て建設工事の完成を目的として締結する契約は、建設工事の請負契約とみなして、建設業法の規定が適用される'], answer:1, explanation:'見積書と契約との関係では、見積とは注文者が金額を知るための手段であり、金額が不明の状態で先行して契約を締結する行為は不自然。建設業者は請求があったときは請負契約が成立するまでの間に見積書を交付しなければならない。契約成立より見積書が先であり、②が明らかに誤り。' },
        { category:'建設業法令', question:'建設工事現場に配置する主任技術者および監理技術者に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['発注者から直接建設工事を請け負った特定建設業者は、当該建設工事を施工するために締結した下請契約の請負代金の総額が政令で定める金額以上になる場合は監理技術者を当該工事現場に置かなければならない','注文者が国である建設工事の場合は工事1件の請負代金の額にかかわらず、注文者から直接建設工事を請け負った建設業者は、工事現場ごとに置く主任技術者または監理技術者を専任の者としなければならない','主任技術者および監理技術者は、当該建設工事の施工計画の作成、工程管理、品質管理その他の技術上の管理および当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない','工事現場における建設工事の施工に従事する者は、主任技術者または監理技術者がその職務として行う指導に従わなければならない'], answer:1, explanation:'主任技術者や監理技術者を現場に専任とする必要があるのは、国や地方公共団体の発注で請負額4,500万円以上、または民間発注で公共性があり多数の者が利用する施設で請負額4,500万円以上の場合。請負代金の額にかかわらずではなく、4,500万円以上の場合のみが該当するため②が誤り。' },
        { category:'建設業法令', question:'建設工事現場に配置する主任技術者や監理技術者に関する記述として、建設業法令上、誤っているものはどれか。', options:['発注者から直接建設工事を請け負った特定建設業者は、当該建設工事を施工するために締結した下請契約の請負代金の額にかかわらず、監理技術者を当該工事現場に配置しなければならない','1級電気通信工事施工管理技士の資格を有する者は、電気通信工事の監理技術者になることができる','主任技術者及び監理技術者は、当該建設工事の施工計画の作成、工程管理、品質管理その他の技術上の管理及び当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない','工事現場における建設工事の施工に従事する者は、主任技術者または監理技術者がその職務として行う指導に従わなければならない'], answer:0, explanation:'監理技術者の選任が必要となるのは、特定建設業者であり、かつ元請であり、かつ下請への再発注額5,000万円以上となる場合のみ。これ以外の条件では主任技術者で十分。したがって①が誤り(5,000万円以上の場合のみ)。なお2級電気通信工事施工管理技士は電気通信工事の主任技術者になれる。' },
        { category:'建設業法令', question:'国土交通大臣が交付する監理技術者資格者証に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['申請者が2以上の監理技術者資格を有する者であるときは、これらの監理技術者資格を合わせて記載した監理技術者資格者証が交付される','監理技術者資格者証を保有する者の申請により、更新される更新後の監理技術者資格者証の有効期間は、3年である','監理技術者資格者証には、交付を受ける者の氏名、生年月日、本籍および住所が記載されている','監理技術者資格を有する者の申請により監理技術者資格者証が交付されるが、その有効期間は、5年である'], answer:1, explanation:'資格者証の有効期間は交付日から5年間。講習を受講して有効期間を延長する場合の更新後の有効期間も同じく5年間である。したがって②(3年)が誤り。' },
        { category:'建設業法令(元請の義務)', question:'元請負人の義務に関する記述として、「建設業法」上、誤っているものはどれか。', options:['元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、発注者の意見をきかなければならない','元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない','元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から20日以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない','元請負人は、下請契約において引渡しに関する特約がされている場合を除き、完成を確認するための検査によって建設工事の完成を確認した後、下請負人が申し出たときは、直ちに、当該建設工事の目的物の引渡しを受けなければならない'], answer:0, explanation:'工事の一部を下請負人に再発注する場合には、事前に下請負人の意見を聞く必要がある。発注者の意見ではない。したがって①が誤り。' },
        { category:'建設業法令(元請の義務)', question:'元請負人の義務に関する記述として、「建設業法」上、誤っているものはどれか。', options:['元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、直ちに当該建設工事の目的物の引渡しを受けなければならない','元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他、元請負人において定めるべき事項を定めようとするときは、あらかじめ、下請負人の意見をきかなければならない','特定建設業者は、当該特定建設業者が注文者となった下請契約に係る下請代金の支払いにつき、当該下請代金の支払期日までに一般の金融機関による割引を受けることが困難であると認められる手形を交付してはならない','元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他、建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない'], answer:0, explanation:'元請が下請から工事完成の通知を受けたときは、まずは検査を実施する。検査は通知を受けた日から20日以内で、かつできる限り短い期間内に完了しなければならない。いきなり引渡しではないため①が誤り。' },
        { category:'建設業法令(業者の義務)', question:'民間工事における施工体制台帳および施工体系図の作成等に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['施工体制台帳は、工事現場ごとに備え置かなければならない','施工体系図は、当該工事現場の見やすい場所に掲げなければならない','発注者から直接建設工事を請け負った一般建設業者は、当該建設工事を施行するために締結した下請契約の請負代金の総額が政令で定める金額以上になるときは、施工体制台帳および、施工体系図を作成しなければならない','施行体制台帳の備置きおよび施工体系図の掲示は、建設工事の目的物の引渡しをするまで行わなければならない'], answer:2, explanation:'施工体制台帳・施工体系図の作成義務があるのは元請であって、下請への再発注額の総額が5,000万円以上となる特定建設業者だけである。一般建設業者が該当する状況はあり得ないため③が誤り。' },
        { category:'建設業法令(業者の義務)', question:'建設業者が建設工事現場に掲げなければならない標識の記載事項に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['一般建設業または特定建設業の別','許可年月日、許可番号および許可を受けた建設業','主任技術者または監理技術者の氏名','健康保険等の加入状況'], answer:3, explanation:'標識(許可票)の記載事項は、一般建設業または特定建設業の別、許可年月日・許可番号および許可を受けた建設業、商号または名称、代表者の氏名、主任技術者または監理技術者の氏名の5項目。健康保険等の加入状況は対象外であり④が誤り。' },
        { category:'労働基準法(労働条件)', question:'労働契約の締結に際し、使用者が労働者に対して必ず書面の交付により明示しなければならない労働条件に関する記述として、「労働基準法令」上、誤っているものはどれか。', options:['労働契約の期間に関する事項','職業訓練に関する事項','始業および終業の時刻に関する事項','退職に関する事項'], answer:1, explanation:'契約期間や稼働時間、退職等は特に重要な説明事項で書面交付での明示が義務付けられている。職業訓練に関する事項は明示すべき労働条件に含まれるが、書面を交付する義務まではない。したがって②が対象外。' },
        { category:'労働基準法(労働条件)', question:'労働契約の締結に際し、使用者が労働者に対して書面(労働者の希望によりFAXまたは電子メール等により送信する場合を含む)の交付により明示しなければならない労働条件に関する記述として、「労働基準法令」上、誤っているものはどれか。', options:['労働契約の期間に関する事項','従事すべき業務に関する事項','福利厚生に関する事項','所定労働時間を超える労働の有無に関する事項'], answer:2, explanation:'契約期間や従事すべき業務の内容、所定労働時間の超過等は特に重要な事項。福利厚生については法的にも明示すべき項目に含まれていない。したがって③が誤り(対象外)。' },
        { category:'労働基準法(年少者等)', question:'年少者の就業に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、満18歳に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない','親権者または後見人は、未成年者に代って労働契約を締結しなければならない','使用者は、交替制によって使用する満16歳以上の男性を除き、満18歳に満たない者を午後10時から午前5時までの間において使用してはならない','使用者は、児童が満15歳に達した日以後の最初の3月31日が終了するまで、これを使用してはならない'], answer:1, explanation:'労働契約は当事者の意思のみによって成されるべきで、未成年者の代理として親権者や後見人が労働契約を締結することはできません(禁止事項)。したがって②が誤り。' },
        { category:'労働基準法(年少者等)', question:'年少者および女性の使用に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、児童が満15歳に達した日以後の最初の3月31日が終了するまで、これを使用してはならない','使用者は、満18歳に満たない者を午後10時から午前5時までの間において使用してはならない。ただし、交替制によって使用する満16歳以上の男性については、この限りでない','使用者は、満20歳に満たない者を坑内で労働させてはならない','使用者は、妊娠中の女性および産後1年を経過しない女性を、重量物を取り扱う業務に就かせてはならない'], answer:2, explanation:'坑内での労働をさせられないのは満18歳未満の者であり、20歳未満ではないため③が誤り。' },
        { category:'労働基準法(労働時間等)', question:'労働時間、休憩、休日等に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、労働時間が8時間を超える場合においては、少くとも1時間の休憩時間を労働時間の途中に与えなければならない','使用者は、原則として、労働者に休憩時間を除き、1週間について40時間を超えて労働させてはならない','使用者は、原則として1週間の各日については、労働者に休憩時間を除き、1日について8時間を超えて労働させてはならない','使用者は、その雇入れの日から起算して、8か月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、または分割した10労働日の有給休暇を与えなければならない'], answer:3, explanation:'有給休暇を付与する条件は「雇入れの日から起算して6か月間継続勤務」かつ「全労働日のうちの8割以上に出勤」。8か月間ではなく6か月間のため④が誤り。' },
        { category:'労働基準法(労働時間等)', question:'使用者に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、労働者名簿、賃金台帳および雇入、解雇、災害補償、賃金その他、労働関係に関する重要な書類を5年間保存しなければならない','使用者は、労働時間が6時間を超える場合においては少くとも45分、8時間を超える場合においては少くとも1時間の休憩時間を、労働時間の途中に与えなければならない','使用者は、その雇入れの日から起算して6か月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、または分割した10労働日の有給休暇を与えなければならない','使用者は、労働者を解雇しようとする場合においては、少くとも30日前にその予告をしなければならない'], answer:0, explanation:'労働関係の重要な書類は労働基準法第109条では5年間保存と謳われているが、同法第143条にて「当分の間は3年間でよい」と臨時の規定がなされている。現行法での保存義務は3年間が正解のため①が誤り。' },
        { category:'労働基準法(賃金等)', question:'労働者に支払う賃金に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['出来高払制その他の請負制で使用する労働者については、使用者は、労働時間に応じ一定額の賃金の保障をしなければならない','使用者は、労働者が女性であることを理由として、賃金について、男性と差別的取り扱いをしてはならない','使用者は、労働者が出産、疾病、災害その他厚生労働省令で定める非常の場合の費用に充てるために請求する場合においては、支払期日前であっても、既往の労働に対する賃金を支払わなければならない','使用者は、前借金その他労働することを条件とする前貸の債権と賃金を相殺することができる'], answer:3, explanation:'従業員へ支払う賃金の中から、雇用主が借金の返済分として一方的に差し引くことは禁止されている(前借金相殺の禁止)。したがって④が誤り。' },
        { category:'労働基準法(賃金等)', question:'災害補償に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['労働者が業務上負傷し、または疾病にかかった場合においては、使用者は、その費用で必要な療養を行い、または必要な療養の費用を負担しなければならない','労働者が業務上負傷し、または疾病にかかり、治った場合において、その身体に障害が存するときは、使用者は、その障害の程度に応じて障害補償を行わなければならない','補償を受ける権利は、労働者の退職によって失われる','労働者が重大な過失によって業務上負傷し、または疾病にかかり、かつ使用者がその過失について行政官庁の認定を受けた場合においては、休業補償または障害補償を行わなくてもよい'], answer:2, explanation:'従業員が補償を受ける権利は、その従業員の退職によって消滅はしない(労働基準法第83条)。したがって③が誤り。' },
        { category:'道路法令(占用)', question:'道路占用許可申請書の記載事項として、「道路法令」上、誤っているものはどれか。', options:['道路の占用の期間','道路の復旧方法','工事の費用','道路の占用の場所'], answer:2, explanation:'道路占用許可申請書に記載すべき事項は、目的・期間・場所・工作物、物件または施設の構造・工事実施の方法・工事の時期・道路の復旧方法の7項目。「工事の費用」は非該当のため③が誤り。' },
        { category:'道路法令(占用)', question:'道路占用工事における工事実施方法に関する記述として、「道路法令」上、誤っているものはどれか。', options:['道路の一方の側は、常に通行することができるようにする','工事現場においては、柵または覆いの設置、夜間における赤色灯または黄色灯の点灯、その他道路の交通の危険防止のために必要な措置を講ずる','路面の排水を妨げない措置を講ずる','道路を掘削する場合は、溝掘、えぐり掘または推進工法、その他これに準ずる方法により掘削する'], answer:3, explanation:'道路の掘削は溝掘、つぼ掘、推進工法等による方法でなければならず、「えぐり掘」は禁止されている(埋め戻しの際の締固めが十分に行えず沈下の原因となるため)。したがって④が誤り。' },
        { category:'道路法令(車両制限)', question:'車両の制限に関する記述として、「道路法令」上、誤っているものはどれか。', options:['車両制限令で定める車両とは、自動車、原動機付自転車、軽車両、トロリーバスをいい、他の車両をけん引している場合はそのけん引されている車両は含まない','車両制限令には、道路の構造を保全しまたは交通の危険を防止するために、車両の幅、重量、高さ、長さおよび最小回転半径の最高限度が定められている','道路管理者は、車両の構造または車両に積載する貨物が特殊であるためやむを得ないと認めるときは、当該車両を通行させようとする者の申請に基づいて、必要な条件を付して通行を許可することができる','限度超過車両(特殊車両)を通行させようとする場合、通行する国道および都道府県道の道路管理者が2以上となる場合、1の道路管理者に通行許可の申請を行う'], answer:0, explanation:'他の車両にけん引されている車も法令上の車両に含まれる(車両制限令第2条)。したがって①が誤り(被けん引車も含む)。' },
        { category:'道路法令(車両制限)', question:'車両の制限に関する記述として、「道路法令」上、誤っているものはどれか。', options:['車両制限令には、道路の構造を保全しまたは交通の危険を防止するために、車両の幅、重量、高さ、長さおよび最小回転半径の最高限度が定められている','限度超過車両(特殊車両)を通行させようとする者は、通行する国道および都道府県道の道路管理者が2以上となる場合、それぞれの道路管理者に通行許可の申請を行わなければならない','道路管理者は、車両の構造または車両に積載する貨物が特殊であるためやむを得ないと認めるときは、当該車両を通行させようとする者の申請に基づいて、必要な条件を付して通行を許可することができる','限度超過車両(特殊車両)の通行の許可証の交付を受けた者は、当該許可に係る通行中は当該許可証を当該車両に備え付けていなければならない'], answer:1, explanation:'通行する国道および都道府県道の道路管理者が2つ以上となる場合は、それぞれの道路管理者に申請するのではなく、代表として1つの道路管理者に申請をすればよい。したがって②が誤り。' },
        { category:'電気通信事業法(定義)', question:'「電気通信事業法」で規定されている用語に関する記述として、正しいものはどれか。', options:['電気通信とは、有線、無線その他の電磁的方式により、符号、音響または影像を送り、伝え、または情報を処理することをいう','電気通信設備とは、電気通信を行うための機械、器具、線路その他の電気的設備をいう','電気通信事業とは、電気通信回線設備を他人の需要に応ずるために提供する事業をいう','電気通信業務とは、電気通信事業者の行う電気通信設備の維持および運用の提供の業務をいう'], answer:1, explanation:'電気通信事業法第2条(定義)による。電気通信は「符号、音響又は影像を送り、伝え、又は受けること」、電気通信事業は「電気通信役務を他人の需要に応ずるために提供する事業」、電気通信業務は「電気通信事業者の行う電気通信役務の提供の業務」。②のみが正しい表現。' },
        { category:'電気通信事業法(定義)', question:'「電気通信事業法」に関する記述として、誤っているものはどれか。', options:['電気通信事業を営もうとする者は、都道府県知事の登録を受けなければならない','電気通信事業者の取り扱い中に係る通信の秘密は、侵してはならない','電気通信事業者の取り扱い中に係る通信は、検閲してはならない','電気通信事業者は、電気通信役務の提供について、不当な差別的取り扱いをしてはならない'], answer:0, explanation:'電気通信事業に参入する際には、総務大臣に対して申請を行い、登録を受ける必要がある(小規模の場合は届出のみ)。都道府県知事ではないため①が誤り。' },
        { category:'電気通信事業法(関連規則)', question:'「事業用電気通信設備規則」に関する記述として、誤っているものはどれか。', options:['専用役務とは、専ら符号または影像を伝送交換するための電気通信設備を他人の通信の用に供する電気通信役務をいう','音声伝送役務とは、おおむね4kHz帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であってデータ伝送役務以外のものをいう','直流回路とは、電気通信回線設備に接続して電気通信事業者の交換設備の動作の開始および終了の制御を行うための回路をいう','絶対レベルとは、1の皮相電力の1mWに対する比をデシベルで表したものをいう'], answer:0, explanation:'専用役務の定義は「特定の者に電気通信設備を専用させる電気通信役務」である。①の内容は「データ伝送役務」の説明になるため①が誤り。その他の3つの文章は正しい。' },
        { category:'電気通信事業法(関連規則)', question:'「電気通信事業法」に基づく「端末設備等規則」に規定されている用語に関する記述として、正しいものはどれか。', options:['「呼設定用メッセージ」とは、切断メッセージ、解放メッセージまたは解放完了メッセージをいう','「発信」とは、電気通信回線からの呼出しに応ずるための動作をいう','「選択信号」とは、主として相手の端末設備を指定するために使用する信号をいう','「アナログ電話用設備」とは、電話用設備であって、端末設備または自営電気通信設備との接続において電波を使用するものをいう'], answer:2, explanation:'①は「呼切断用メッセージ」の説明(呼設定用メッセージは呼設定メッセージまたは応答メッセージ)。②は「応答」の説明(発信は通信を行う相手を呼び出すための動作)。④は「移動電話用設備」の説明。「選択信号」の説明は法令と一致しており③が正しい。' },
        { category:'有線電気通信法令(技術基準)', question:'「有線電気通信法令」に基づく、有線電気通信設備の技術基準に関する記述として、誤っているものはどれか。', options:['架空電線の高さは、横断歩道橋の上にあるときを除き道路上にあるときは、路面から5m以上でなければならない','架空電線の支持物には、取扱者が昇降に使用する足場金具等を、地表上2m未満の高さに取り付けてはならない','架空電線は、他人の設置した架空電線との離隔距離が30cm以下となるように設置してはならない','屋内電線と大地との間および屋内電線相互間の絶縁抵抗は、直流100Vの電圧で測定した値で、1MΩ以上でなければならない'], answer:1, explanation:'架空電線の支持物の足場金具等は、最下段の足場金具の最低高が定められており、地表上1.8m以上にしなければならない。すなわち1.8m未満の高さに取り付けてはならない。2m未満ではないため②が誤り。' },
        { category:'有線電気通信法令(技術基準)', question:'「有線電気通信法」に基づく、「有線電気通信設備令」に関する記述として、誤っているものはどれか。', options:['通信回線(導体が光ファイバであるものを除く)の平衡度は1,000Hzの交流において34dB以上でなければならない','通信回線の線路の電圧は100V以下でなければならない','有線電気通信設備に使用する電線は、絶縁電線でなければならない','架空電線の支持物には取扱者が昇降に使用する足場金具等を地表上1.8m未満の高さに取り付けてはならない'], answer:2, explanation:'有線電気通信設備に使用する電線は、絶縁電線あるいはケーブルを用いる必要がある(有線電気通信設備令第2条の2)。絶縁電線に限定したものではないため③が誤り。' },
        { category:'有線電気通信法令(通信回線)', question:'「有線電気通信設備令」に関する記述として、誤っているものはどれか。', options:['通信回線(導体が光ファイバであるものを除く)の電力は、絶対レベルで表した値で、その周波数が音声周波であるときは、プラス10dB以下、高周波であるときは、プラス20dB以下でなければならない','屋内電線(光ファイバを除く)と大地との間および屋内電線相互間の絶縁抵抗は、直流100Vの電圧で測定した値で、1MΩ以上でなければならない','通信回線(導体が光ファイバであるものを除く)の平衡度は、1,000Hzの交流において34dB以上でなければならない','通信回線(導体が光ファイバであるものを除く)の線路の電圧は、150V以下でなければならない'], answer:3, explanation:'通信回線の線路の電圧は100V以下と定められている(有線電気通信設備令第4条)。150V以下ではないため④が誤り。' },
        { category:'有線電気通信法令(通信回線)', question:'「有線電気通信設備令」に関する記述として、誤っているものはどれか。', options:['通信回線(導体が光ファイバであるものを除く)の線路の電圧は、100V以下でなければならない','通信回線(導体が光ファイバであるものを除く)の平衡度は、1,000Hzの交流において10dB以上でなければならない','通信回線(導体が光ファイバであるものを除く)の電力は、絶対レベルで表した値で、その周波数が音声周波であるときは、プラス10dB以下、高周波であるときは、プラス20dB以下でなければならない','屋内電線(光ファイバを除く)と大地との間および屋内電線相互間の絶縁抵抗は、直流100Vの電圧で測定した値で、1MΩ以上でなければならない'], answer:1, explanation:'通信回線の平衡度は、1,000Hzの交流において34dB以上でなければならない(有線電気通信設備令第3条)。10dB以上ではないため②が誤り。' },
