<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電気通信施工管理技士1級 一次試験 問題集</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #f0f4f8; color: #333; min-height: 100vh; }
        header { background: linear-gradient(135deg, #1a3a5c, #2d6a9f); color: white; padding: 20px 16px; text-align: center; }
        header h1 { font-size: 17px; font-weight: bold; line-height: 1.5; }
        header p  { font-size: 13px; margin-top: 5px; opacity: 0.85; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
        #level-screen { text-align: center; padding: 24px 0; }
        #level-screen h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 6px; }
        #level-screen p  { font-size: 13px; color: #666; margin-bottom: 24px; }
        .level-btn { display: block; width: 100%; padding: 20px 16px; margin-bottom: 14px; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .level-btn:active { transform: scale(0.97); }
        .level-btn small { display: block; font-size: 13px; font-weight: normal; margin-top: 4px; opacity: 0.9; }
        .level-btn.beginner     { background: linear-gradient(135deg,#4CAF50,#388e3c); color:#fff; box-shadow:0 4px 14px rgba(76,175,80,.35); }
        .level-btn.intermediate { background: linear-gradient(135deg,#FF9800,#e65100); color:#fff; box-shadow:0 4px 14px rgba(255,152,0,.35); }
        .level-btn.advanced     { background: linear-gradient(135deg,#e53935,#b71c1c); color:#fff; box-shadow:0 4px 14px rgba(229,57,53,.35); }
        .level-btn.random       { background: linear-gradient(135deg,#7b1fa2,#4a148c); color:#fff; box-shadow:0 4px 14px rgba(123,31,162,.35); }
        .level-btn.weak { background: linear-gradient(135deg,#c62828,#6a1010); color:#fff; box-shadow:0 4px 14px rgba(198,40,40,.4); }
        #weak-btn { display:none; }
        #quiz-screen { display: none; }
        .progress-wrap { background:#ddd; border-radius:8px; height:8px; margin-bottom:6px; }
        .progress-bar  { background:linear-gradient(90deg,#2d6a9f,#4CAF50); height:8px; border-radius:8px; transition:width .3s; }
        .progress-text { font-size:13px; color:#666; text-align:right; margin-bottom:14px; }
        .question-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 14px; }
        .category-tag { display: inline-block; background: #e8f0fe; color: #2d6a9f; font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
        .question-text { font-size: 16px; line-height: 1.75; color: #222; }
        .options { margin-top: 18px; }
        .option-btn { display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px; background: white; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; text-align: left; cursor: pointer; line-height: 1.5; transition: border-color .2s, background .2s; color: #333; }
        .option-btn.correct  { background:#e8f5e9; border-color:#4CAF50; color:#2e7d32; }
        .option-btn.wrong    { background:#ffebee; border-color:#f44336; color:#c62828; }
        .option-btn.disabled { cursor: default; }
        .explanation { display: none; background: #f8f9fa; border-left: 4px solid #2d6a9f; padding: 14px 16px; border-radius: 0 10px 10px 0; margin-top: 14px; font-size: 14px; line-height: 1.75; color: #444; }
        .explanation.show { display: block; }
        .explanation-title { font-weight: bold; color: #2d6a9f; margin-bottom: 6px; }
        .next-btn { display: none; width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg,#1a3a5c,#2d6a9f); color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .next-btn.show { display: block; }
        #result-screen { display: none; text-align: center; padding: 20px 0; }
        .result-circle { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        .result-circle.pass { background:linear-gradient(135deg,#4CAF50,#388e3c); color:white; box-shadow:0 6px 20px rgba(76,175,80,.4); }
        .result-circle.fail { background:linear-gradient(135deg,#FF9800,#e65100); color:white; box-shadow:0 6px 20px rgba(255,152,0,.4); }
        .result-circle .score { font-size: 36px; }
        .result-circle .score-label { font-size: 13px; opacity: .9; }
        .result-message { font-size: 22px; font-weight: bold; color: #1a3a5c; margin-bottom: 8px; }
        .result-sub { font-size: 14px; color: #666; margin-bottom: 20px; }
        .result-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-action { padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; }
        .btn-action.primary   { background:linear-gradient(135deg,#1a3a5c,#2d6a9f); color:white; }
        .btn-action.secondary { background:white; color:#2d6a9f; border:2px solid #2d6a9f; }
        .category-breakdown { background:#f8f9fa; border-radius:12px; padding:16px; margin-bottom:20px; text-align:left; }
        .category-breakdown h3 { font-size:14px; color:#555; margin-bottom:10px; }
        .cat-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #eee; }
        .cat-row:last-child { border-bottom:none; }
        .cat-name { color:#333; }
        .cat-score { font-weight:bold; }
        .cat-score.bad  { color:#e53935; }
        .cat-score.good { color:#388e3c; }
    </style>
</head>
<body>
<header>
    <h1>電気通信施工管理技士 1級</h1>
    <p>第一次試験 問題集</p>
</header>
<div class="container">
    <div id="level-screen">
        <h2>レベルを選んでください</h2>
        <p>解説付き・毎回ランダム出題</p>
        <button class="level-btn beginner"     onclick="startQuiz('beginner')">🟢 初級（20問）<small>基本用語・基礎知識の確認</small></button>
        <button class="level-btn intermediate" onclick="startQuiz('intermediate')">🟠 中級（20問）<small>計算問題・応用・法規</small></button>
        <button class="level-btn advanced"     onclick="startQuiz('advanced')">🔴 上級（20問）<small>過去問レベル・本番想定</small></button>
        <button class="level-btn random"       onclick="startQuiz('random')">🎲 ランダム（20問）<small>全レベルからランダム出題</small></button>
        <button class="level-btn weak" id="weak-btn" onclick="startQuiz('weak')">❌ 苦手問題（集中攻略）<small id="weak-btn-sub"></small></button>
    </div>
    <div id="quiz-screen">
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="progress-text" id="progress-text"></div>
        <div class="question-card">
            <div class="category-tag"  id="category-tag"></div>
            <div class="question-text" id="question-text"></div>
            <div class="options"       id="options"></div>
            <div class="explanation"   id="explanation">
                <div class="explanation-title">📝 解説</div>
                <div id="explanation-text"></div>
            </div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
    <div id="result-screen">
        <div class="result-circle" id="result-circle">
            <div class="score" id="result-score"></div>
            <div class="score-label">点</div>
        </div>
        <div class="result-message" id="result-message"></div>
        <div class="result-sub"     id="result-sub"></div>
        <div class="category-breakdown" id="category-breakdown"></div>
        <div class="result-actions">
            <button class="btn-action primary"   onclick="retryQuiz()">🔄 同じレベルをもう一度</button>
            <button class="btn-action secondary" onclick="goHome()">🏠 レベル選択に戻る</button>
        </div>
    </div>
</div>
<script>
const questions = {
    beginner: [
        { category:'電気通信工学', question:'光ファイバーケーブルの特徴として正しいものはどれか。', options:['電磁誘導の影響を受けやすい','電気信号をそのまま伝送する','電磁誘導の影響を受けにくい','銅線より重い'], answer:2, explanation:'光ファイバーは光信号で伝送するため、電磁誘導（ノイズ）の影響を受けにくい。また軽量・細径・広帯域という特徴もある。' },
        { category:'電気通信工学', question:'デシベル（dB）の説明として正しいものはどれか。', options:['電力の絶対値を表す単位','電力比・電圧比を対数で表した単位','周波数を表す単位','電流の大きさを表す単位'], answer:1, explanation:'dBは電力比や電圧比を常用対数で表した相対的な単位。電力比：dB=10log(P1/P2)、電圧比：dB=20log(V1/V2)。' },
        { category:'電気通信工学', question:'電気通信回線の「伝送損失」とは何か。', options:['信号レベルが増加する現象','信号レベルが減少する現象','送受信端の周波数の差','電流の変化率'], answer:1, explanation:'伝送損失とは、信号が伝送路を通過する際に信号レベルが減少する現象。光ファイバーはdB/km単位で表す。' },
        { category:'施工管理', question:'施工管理の「4大管理」に含まれないものはどれか。', options:['工程管理','品質管理','設計管理','安全管理'], answer:2, explanation:'4大管理は「工程管理・品質管理・安全管理・原価管理」。設計管理は含まれない。' },
        { category:'施工管理', question:'バーチャート（横線式工程表）の特徴として正しいものはどれか。', options:['各作業の関連性が明確にわかる','各作業の開始・終了時期が視覚的にわかりやすい','クリティカルパスが容易に把握できる','コンピューターがないと作成できない'], answer:1, explanation:'バーチャートは横棒グラフで各作業の期間を表す。見やすい反面、作業間の関連性やクリティカルパスの把握には向いていない。' },
        { category:'法規', question:'電気通信事業法の目的として正しいものはどれか。', options:['電波の公平かつ能率的な利用を確保する','電気通信事業の適正な運営を確保し利用者の利益を保護する','建設業の健全な発達を促進する','労働者の安全と健康を守る'], answer:1, explanation:'電気通信事業法は、電気通信事業の適正な運営を確保し、電気通信の健全な発達と国民の利便確保を目的とする。' },
        { category:'法規', question:'建設業法における「主任技術者」の配置が必要な工事はどれか。', options:['請負金額500万円未満の軽微な工事のみ','すべての建設工事','公共工事のみ','請負金額3,000万円以上の工事のみ'], answer:1, explanation:'建設業法により、建設業者はすべての工事現場に主任技術者（または監理技術者）を配置しなければならない。' },
        { category:'電気工学', question:'オームの法則の式として正しいものはどれか。', options:['V = I + R','V = I × R','V = I / R','V = I² × R'], answer:1, explanation:'オームの法則はV=I×R（電圧＝電流×抵抗）。V(V)、I(A)、R(Ω)の関係を表す。' },
        { category:'電気通信工学', question:'無線LANの規格「IEEE 802.11ac（Wi-Fi 5）」が主に使用する周波数帯はどれか。', options:['2.4GHz帯のみ','5GHz帯のみ','900MHz帯','60GHz帯'], answer:1, explanation:'IEEE 802.11ac（Wi-Fi 5）は5GHz帯を使用。両帯域対応はIEEE 802.11n（Wi-Fi 4）やIEEE 802.11ax（Wi-Fi 6）。' },
        { category:'施工管理', question:'ヒヤリハットの説明として正しいものはどれか。', options:['死亡・重傷事故のこと','危うく事故になりそうだったが災害に至らなかった事象','軽傷事故のこと','設備の故障のこと'], answer:1, explanation:'ヒヤリハットは危うく事故になりそうだった事象。ハインリッヒの法則では1件の重大事故の背後に29件の軽微事故と300件のヒヤリハットがあるとされる。' },
        { category:'電気通信工学', question:'IPアドレス「192.168.1.0/24」のサブネットマスクはどれか。', options:['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.128'], answer:2, explanation:'/24はサブネットマスクの上位24ビットが1であることを示す。24ビット＝255.255.255.0に相当。' },
        { category:'法規', question:'労働安全衛生法に基づき、高さ何m以上の場所での作業時に墜落防止措置が必要か。', options:['1m以上','2m以上','3m以上','5m以上'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の箇所での作業では安全帯の使用や手すりの設置など墜落防止措置が必要。' },
        { category:'電気通信工学', question:'UTPケーブルとSTPケーブルの違いとして正しいものはどれか。', options:['UTPはシールドあり、STPはシールドなし','UTPはシールドなし、STPはシールドあり','UTPは光ファイバー、STPは銅線','速度の違いのみで構造は同じ'], answer:1, explanation:'UTP（Unshielded Twisted Pair）はシールドなし、STP（Shielded Twisted Pair）はシールドあり。STPはノイズに強い。' },
        { category:'施工管理', question:'QC（品質管理）の「PDCAサイクル」の正しい順序はどれか。', options:['Plan→Check→Do→Act','Plan→Do→Check→Act','Do→Plan→Check→Act','Check→Plan→Do→Act'], answer:1, explanation:'PDCAはPlan（計画）→Do（実施）→Check（確認）→Act（改善）の順に繰り返す継続的品質改善手法。' },
        { category:'電気工学', question:'交流電力において「力率」とは何か。', options:['有効電力と皮相電力の比','電圧と電流の比','周波数と電圧の比','無効電力と皮相電力の比'], answer:0, explanation:'力率は有効電力（W）÷皮相電力（VA）で求める。力率が1に近いほど電力を効率よく使える。' },
        { category:'電気通信工学', question:'PONシステムにおける「ONU」とは何か。', options:['局側の光通信装置','加入者側の光通信装置','光ファイバーの分岐装置','無線アクセスポイント'], answer:1, explanation:'ONU（Optical Network Unit）は加入者側（ユーザー宅）に設置される光通信装置。局側はOLT（Optical Line Terminal）。' },
        { category:'施工管理', question:'工事着手前に作成する「施工計画書」に含まれないものはどれか。', options:['工程表','安全管理計画','完成検査報告書','品質管理計画'], answer:2, explanation:'完成検査報告書は工事完了後に作成するもの。施工計画書は着手前に工程表・安全管理計画・品質管理計画などを記載。' },
        { category:'法規', question:'電波法における「不法無線局」の開設に対する罰則はどれか。', options:['5万円以下の罰金','1年以下の懲役または100万円以下の罰金','警告のみ','罰則規定はない'], answer:1, explanation:'電波法により、不法無線局（無免許）の開設は1年以下の懲役または100万円以下の罰金が科せられる。' },
        { category:'電気通信工学', question:'VoIPの説明として正しいものはどれか。', options:['映像信号をIP網で伝送する技術','音声をデジタル化しIP網で伝送する技術','無線通信の一規格','データの暗号化技術'], answer:1, explanation:'VoIP（Voice over Internet Protocol）は音声をデジタル変換してIP網で伝送する技術。IP電話などに利用される。' },
        { category:'施工管理', question:'作業主任者の選任が必要な作業はどれか。', options:['地上での一般清掃作業','高圧電気設備の取扱い作業','書類整理作業','資材の室内保管作業'], answer:1, explanation:'労働安全衛生法により、高圧・特別高圧電気設備の取扱い作業などの危険有害作業では作業主任者の選任が義務付けられている。' },
        { category:'電気通信工学', question:'「DNS」の役割として正しいものはどれか。', options:['データを暗号化して送信する','ドメイン名をIPアドレスに変換する','メールを送信する','ファイルを転送する'], answer:1, explanation:'DNS（Domain Name System）はドメイン名（例：www.example.com）をIPアドレスに変換する仕組み。インターネットの電話帳とも呼ばれる。' },
        { category:'電気通信工学', question:'「ルーター」の役割として正しいものはどれか。', options:['同一ネットワーク内のデータを中継する','異なるネットワーク間でデータを転送する','電気信号を増幅する','無線信号を有線に変換する'], answer:1, explanation:'ルーターは異なるネットワーク間でIPアドレスを参照してデータを転送（ルーティング）する機器。' },
        { category:'電気工学', question:'コンデンサの特徴として正しいものはどれか。', options:['直流を通し交流を遮断する','交流を通し直流を遮断する','抵抗として働く','電気を磁気に変換する'], answer:1, explanation:'コンデンサは交流を通し直流を遮断する特性を持つ。フィルタ回路や結合回路に使用される。' },
        { category:'施工管理', question:'「KY活動（危険予知活動）」の目的として正しいものはどれか。', options:['作業効率を上げること','作業前に危険を予測し事故を防止すること','品質を検査すること','コストを削減すること'], answer:1, explanation:'KY活動は作業開始前に作業員が話し合い、潜在する危険を予測・確認することで労働災害を防止する安全管理活動。' },
        { category:'法規', question:'建設工事の請負契約書に記載しなければならない事項として、建設業法で定められていないものはどれか。', options:['工事内容','請負代金の額','工事着手の時期および工事完成の時期','下請業者の氏名'], answer:3, explanation:'建設業法で定める請負契約書の必須記載事項は工事内容、請負代金、着工・完成時期、支払方法など。下請業者の氏名は必須ではない。' },
        { category:'電気通信工学', question:'「FTTH」とは何か。', options:['光ファイバーを家庭まで引き込むサービス','携帯電話の通信規格','無線LANの規格','ケーブルテレビの方式'], answer:0, explanation:'FTTH（Fiber To The Home）は光ファイバーケーブルを一般家庭まで引き込む光インターネット接続サービス。' },
        { category:'電気工学', question:'三相交流の特徴として正しいものはどれか。', options:['単相交流より効率が悪い','位相が120°ずつずれた3つの交流を使う','直流の一種である','変圧器が使えない'], answer:1, explanation:'三相交流は位相が互いに120°ずれた3つの交流電圧を使う方式。電力の伝送効率が高く、工場設備・モーターなどに広く使われる。' },
        { category:'施工管理', question:'現場での「安全帯」の使用について正しいものはどれか。', options:['高さ1m以上での作業時に使用する','高さ2m以上での作業で墜落の危険がある場合に使用する','使用は任意である','屋外作業時のみ使用する'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の作業床を設けることが困難な場合、安全帯（ハーネス型）を使用させなければならない。' },
        { category:'法規', question:'「消防法」において、自動火災報知設備の設置が義務付けられる建物の用途として正しいものはどれか。', options:['個人住宅のみ','旅館・ホテル・病院・学校など特定の用途の建物','すべての建物','延べ面積に関わらずすべての飲食店'], answer:1, explanation:'消防法施行令により、旅館・ホテル・病院・学校・百貨店など特定用途の建物および一定規模以上の建物に自動火災報知設備の設置が義務付けられる。' },
        { category:'電気通信工学', question:'「スイッチングハブ（レイヤ2スイッチ）」の機能として正しいものはどれか。', options:['MACアドレスを参照してデータを転送する','IPアドレスを参照してデータを転送する','単純にすべてのポートにデータを転送する','無線と有線を変換する'], answer:0, explanation:'スイッチングハブはMACアドレステーブルを参照し、宛先MACアドレスのポートにのみデータを転送する。ハブ（リピーター）と異なり効率的な通信が可能。' },

        { category:'電気通信工学', question:'OSI参照モデルの第3層（ネットワーク層）のプロトコルはどれか。', options:['TCP','HTTP','IP','Ethernet'], answer:2, explanation:'OSI第3層（ネットワーク層）はIP。TCPは第4層（トランスポート層）、HTTPは第7層（アプリケーション層）、Ethernetは第2層（データリンク層）。' },

        { category:'電気通信工学', question:'OTDR（光パルス試験器）の用途として正しいものはどれか。', options:['光ファイバーの伝送損失分布や断線箇所を測定する','電気ケーブルの絶縁抵抗を測定する','無線の電波強度を測定する','IPネットワークの通信速度を測定する'], answer:0, explanation:'OTDR（Optical Time Domain Reflectometer）は光パルスを入射し後方散乱光を分析することで損失分布・断線箇所を測定する機器。' },
        { category:'施工管理', question:'EVMにおけるSPI（スケジュール効率指数）が1.0未満を示す場合はどれか。', options:['予定より工程が進んでいる','予定通り工程が進んでいる','予定より工程が遅れている','コストが超過している'], answer:2, explanation:'SPI=EV（出来高）÷PV（計画値）。SPI<1.0は工程が計画より遅れていることを示す。SPI>1.0は進んでいる。' },
        { category:'電気工学', question:'UPS（無停電電源装置）のバッテリーを常時充電し停電時に瞬断なく給電できる方式はどれか。', options:['オフライン方式（スタンバイ方式）','オンライン方式（常時インバータ方式）','ラインインタラクティブ方式','インライン方式'], answer:1, explanation:'オンライン方式はバッテリーを介して常時インバータで給電するため停電時に切替時間がなく瞬断しない。サーバーなど重要機器に適する。' },
        { category:'法規', question:'電気通信工事の「監理技術者」の配置が必要な条件として正しいものはどれか。', options:['すべての下請工事','下請契約総額が3,000万円以上（建築は4,500万円以上）となる特定建設業者が施工する工事','工事金額500万円以上のすべての工事','公共工事のみ'], answer:1, explanation:'特定建設業者が元請として下請契約の総額が3,000万円以上（建築一式は4,500万円以上）となる工事では監理技術者を配置しなければならない。' },
        { category:'電気通信工学', question:'IPv6アドレスのビット数はどれか。', options:['32ビット','64ビット','128ビット','256ビット'], answer:2, explanation:'IPv6アドレスは128ビット（16バイト）。IPv4の32ビットに対して大幅に拡張。16進数8グループ（各16ビット）をコロン区切りで表記。' },
        { category:'施工管理', question:'受注者が発注者に提出する「施工体制台帳」の作成義務が生じる条件はどれか。', options:['すべての工事','公共工事において下請契約を締結したとき','工事金額が1億円を超えるとき','工期が1年以上の工事'], answer:1, explanation:'建設業法により、公共工事を受注した建設業者が下請契約を締結した場合、施工体制台帳を作成し発注者に提出する義務がある。' },
        { category:'電気通信工学（計算）', question:'送信電力が10Wの場合、dBm（ミリワット基準）で表すと何dBmか。', options:['10dBm','30dBm','40dBm','100dBm'], answer:2, explanation:'dBm=10×log₁₀(電力mW/1mW)。10W=10,000mWなので10×log₁₀(10,000)=10×4=40dBm。' },

        { category:'施工管理', question:'工程管理における「山積み・山崩し」の説明として正しいものはどれか。', options:['土砂の量を管理すること','各時期の作業員・機械の必要量を均等化する調整作業','品質のばらつきを管理すること','工事費用の配分を行うこと'], answer:1, explanation:'山積みは各期間の作業量（労務・機械）をグラフ化したもの。山崩しはこれを均等化する調整作業で、工程の平準化・効率化を図る。' },
        { category:'電気通信工学（計算）', question:'周波数2GHzの電波の波長はおよそ何cmか。（光速3×10⁸m/s）', options:['1.5cm','15cm','150cm','1500cm'], answer:1, explanation:'波長λ=c/f=3×10⁸÷2×10⁹=0.15m=15cm。周波数が高いほど波長は短くなる。' },
        { category:'法規', question:'「有線電気通信法」の目的として正しいものはどれか。', options:['無線通信の秩序を維持すること','有線電気通信設備の設置・維持の規律を定め、有害な混信や障害を防止すること','電気通信事業者の経営を支援すること','建設工事の品質を確保すること'], answer:1, explanation:'有線電気通信法は有線電気通信設備の設置・維持に関する規律を定め、有害な混信・障害の防止と有線電気通信の発達を目的とする。' },
        { category:'電気通信工学', question:'「SIP（Session Initiation Protocol）」の説明として正しいものはどれか。', options:['データを圧縮するプロトコル','VoIPやテレビ会議などのセッション制御プロトコル','メールを送信するプロトコル','ファイルを転送するプロトコル'], answer:1, explanation:'SIPはVoIP・テレビ会議・インスタントメッセージなどのマルチメディアセッションの開始・変更・終了を制御するアプリケーション層プロトコル。' },
        { category:'施工管理', question:'「品質管理のQC七つ道具」に含まれないものはどれか。', options:['パレート図','特性要因図（フィッシュボーン）','PERT図','ヒストグラム'], answer:2, explanation:'QC七つ道具はパレート図・特性要因図・ヒストグラム・管理図・散布図・チェックシート・グラフ。PERT図（ネットワーク工程表）は含まれない。' },
        { category:'電気工学', question:'「絶縁抵抗測定」に使用する測定器はどれか。', options:['電流計（アンメーター）','絶縁抵抗計（メガー）','電力計（ワットメーター）','周波数計'], answer:1, explanation:'絶縁抵抗測定には絶縁抵抗計（メガー）を使用する。直流高電圧を印加して電気設備の絶縁状態を確認する。' },
        { category:'法規', question:'建設業法における「一括下請負（丸投げ）」について正しいものはどれか。', options:['元請業者は常に一括下請負ができる','公共工事では一括下請負は禁止されている','工事金額に関わらずすべて禁止','発注者の書面による承諾があれば住宅以外はすべて可能'], answer:1, explanation:'建設業法第22条により、公共工事の一括下請負は禁止。民間工事は発注者・元請負人双方の書面による承諾があれば認められる場合がある。' },
        { category:'電気通信工学', question:'「QoS（Quality of Service）」の説明として正しいものはどれか。', options:['通信のセキュリティを確保する技術','ネットワーク上でデータの種類により優先度をつけ品質を確保する技術','ネットワーク機器の消費電力を削減する技術','無線通信の周波数を管理する技術'], answer:1, explanation:'QoSはネットワークトラフィックに優先度を設定し、VoIPや動画など遅延に敏感なアプリケーションの通信品質を保証する技術。' },
        { category:'施工管理', question:'「労働災害の発生率」を表す「度数率」の計算式として正しいものはどれか。', options:['死傷者数÷労働者数×1,000','死傷者数÷延べ労働時間数×1,000,000','延べ労働損失日数÷延べ労働時間数×1,000','死亡者数÷工事件数×100'], answer:1, explanation:'度数率=死傷者数÷延べ労働時間数×1,000,000。100万延べ労働時間あたりの死傷者数で表し、安全管理の指標として使われる。' }

    advanced: [
        { category:'電気通信工学', question:'フレネルゾーンの説明として正しいものはどれか。', options:['アンテナの指向性を表す概念','無線通信において送受信アンテナ間の見通し線を中心とする楕円体状の空間','光ファイバーの伝搬モードのこと','周波数帯域幅のこと'], answer:1, explanation:'フレネルゾーンは送受信アンテナを焦点とする楕円体状の空間。第1フレネルゾーン内に障害物がないことが安定した通信に必要。' },
        { category:'電気通信工学（計算）', question:'自由空間伝搬損失の計算において、周波数を2倍にすると伝搬損失はどのように変化するか。', options:['変化しない','約6dB増加する','約3dB増加する','約6dB減少する'], answer:1, explanation:'自由空間伝搬損失L=20log(4πdf/c)。周波数fが2倍になると20log(2)≒6dB増加する。' },
        { category:'電気通信工学', question:'「OFDM（直交周波数分割多重）」の特徴として正しいものはどれか。', options:['単一の搬送波を使う変調方式','多数の直交する搬送波を使い周波数利用効率が高くマルチパスに強い','時間軸で多重化する方式','アナログ変調の一種'], answer:1, explanation:'OFDMは互いに直交する多数のサブキャリアを使う変調方式。周波数利用効率が高くマルチパス干渉に強い。LTE・Wi-Fi・地上デジタル放送などに採用。' },
        { category:'電気通信工学', question:'光ファイバーの「シングルモード」と「マルチモード」の比較として正しいものはどれか。', options:['シングルモードはコア径が大きく長距離伝送に不向き','シングルモードはコア径が小さく分散が小さいため長距離・広帯域伝送に適する','マルチモードは光源にレーザーを使い高価','マルチモードの方が伝送損失が小さい'], answer:1, explanation:'シングルモードファイバーはコア径約9μmで1つの伝搬モードのみ使用。モード分散がなく長距離・広帯域。マルチモード（コア径50/62.5μm）は短距離向き。' },
        { category:'電気通信工学', question:'「MPLS（Multi-Protocol Label Switching）」の説明として正しいものはどれか。', options:['無線通信の多重化技術','IPヘッダの代わりに短いラベルを使いパケット転送を高速化するネットワーク技術','光ファイバーの多重化方式','VoIPの音声圧縮方式'], answer:1, explanation:'MPLSはIPパケットにラベルを付与し、ラベルに基づいて高速転送する技術。QoSの確保やVPN構築に使われる。' },
        { category:'電気通信工学', question:'「WDM（波長分割多重）」の説明として正しいものはどれか。', options:['時間軸で光信号を多重化する方式','複数の異なる波長の光を1本の光ファイバーで同時に伝送する技術','電気信号を多重化する方式','無線通信の周波数多重方式'], answer:1, explanation:'WDM（Wavelength Division Multiplexing）は異なる波長の光を1本のファイバーで同時伝送する技術。波長数を増やすことで容量を大幅に増加できる。' },
        { category:'施工管理', question:'「施工体系図」の説明として正しいものはどれか。', options:['工事の工程を時系列で表した図','発注者・元請・各下請業者の施工分担関係を図示したもの','品質管理の手順を表した図','安全管理体制を表した組織図'], answer:1, explanation:'施工体系図は各下請業者の作業内容・工事範囲・相互関係を明確にした図。公共工事では工事現場への掲示が義務付けられている。' },
        { category:'法規', question:'電気通信事業法における「端末設備」の接続について正しいものはどれか。', options:['どのような端末設備でも自由に接続できる','技術基準に適合した端末設備のみ電気通信回線に接続できる','通信事業者の端末設備のみ接続できる','無線端末のみ接続できる'], answer:1, explanation:'電気通信事業法第52条により、端末設備を電気通信回線設備に接続するには技術基準適合認定（技適）を受けた端末設備でなければならない。' },
        { category:'電気通信工学', question:'「スペクトラム拡散（SS）」技術の特徴として正しいものはどれか。', options:['信号を狭い帯域に集中させる方式','信号を広い帯域に拡散させることで耐ノイズ性・秘匿性を高める方式','信号を時分割で多重化する方式','アナログ変調の一種'], answer:1, explanation:'スペクトラム拡散は信号を広い帯域に拡散させる方式。耐ノイズ性・耐干渉性・秘匿性が高い。CDMA・GPS・無線LANなどに使われる。' },
        { category:'電気工学（計算）', question:'抵抗R₁=4Ω、R₂=6Ωの並列接続の合成抵抗として正しいものはどれか。', options:['10Ω','2.4Ω','5Ω','0.42Ω'], answer:1, explanation:'並列合成抵抗1/R=1/4+1/6=5/12。よってR=12/5=2.4Ω。' },
        { category:'電気通信工学', question:'「SNMP」の用途として正しいものはどれか。', options:['メールの送受信','ネットワーク機器の監視・管理','ファイルの転送','Webページの閲覧'], answer:1, explanation:'SNMPはネットワーク機器（ルーター・スイッチ・サーバー等）の状態監視・設定変更・障害検知に使われる管理プロトコル。' },
        { category:'施工管理', question:'「ツールボックスミーティング（TBM）」の説明として正しいものはどれか。', options:['工具の点検会議のこと','作業開始前に作業員が集まり当日の作業内容・危険事項などを確認する短時間の打合せ','月1回開催される安全委員会','工事完了後に行う反省会'], answer:1, explanation:'TBMは毎朝作業開始前に行う短時間のミーティング。その日の作業内容・役割分担・危険箇所・KY活動を確認し、事故防止を図る。' },
        { category:'法規', question:'「建設リサイクル法」における特定建設資材に含まれないものはどれか。', options:['コンクリート','アスファルト・コンクリート','木材','ガラス'], answer:3, explanation:'建設リサイクル法の特定建設資材はコンクリート・コンクリートおよび鉄からなる建設資材・木材・アスファルト・コンクリートの4種類。ガラスは含まれない。' },
        { category:'電気通信工学', question:'「DWDM」においてチャネル間隔として標準化されているものはどれか（ITU-T G.694.1）。', options:['0.1nm間隔','0.4nm（50GHz）または0.8nm（100GHz）間隔','1nm間隔','10nm間隔'], answer:1, explanation:'ITU-T G.694.1ではDWDMのチャネル間隔として100GHz（約0.8nm）や50GHz（約0.4nm）などが標準化されている。' },
        { category:'施工管理', question:'「完成検査（竣工検査）」について正しいものはどれか。', options:['着工前に行う設計図書の確認作業','施工中に行う中間確認作業','工事完成後に設計図書と照合して品質・数量などを確認する検査','材料搬入時に行う確認作業'], answer:2, explanation:'完成検査は工事完了後に発注者が行う最終確認検査。設計図書・仕様書との整合、品質・数量・機能の確認を行い、合格後に引き渡しとなる。' },
        { category:'法規', question:'「電気通信主任技術者」について正しいものはどれか。', options:['すべての電気通信事業者が選任しなければならない','電気通信事業者が事業用電気通信設備の工事・維持・運用を監督するために選任しなければならない','建設業者が選任しなければならない','資格は不要で誰でもなれる'], answer:1, explanation:'電気通信事業法第45条により、電気通信事業者は事業用電気通信設備の工事・維持・運用を監督させるため、電気通信主任技術者を選任しなければならない。' },
        { category:'電気通信工学', question:'「PLC（電力線搬送通信）」の説明として正しいものはどれか。', options:['光ファイバーを使った通信技術','既存の電力線を使ってデータ通信を行う技術','携帯電話の通信方式','衛星通信の一種'], answer:1, explanation:'PLC（Power Line Communication）は商用電力線をデータ通信媒体として使用する技術。宅内LANやスマートメーターに利用される。' },
        { category:'施工管理', question:'「特定化学物質障害予防規則（特化則）」に関して正しいものはどれか。', options:['電磁波から労働者を守るための規則','鉛・六価クロム・石綿などの有害化学物質から労働者の健康を守るための規則','工事現場の墜落防止に関する規則','重機操作に関する資格の規則'], answer:1, explanation:'特化則は鉛・有機溶剤・石綿（アスベスト）などの特定化学物質を扱う作業における健康障害防止のための規則。' },
        { category:'電気通信工学（計算）', question:'アンテナのERP（実効輻射電力）が1000Wのとき、dBi換算でおよそ何dBiか（ダイポール基準）。', options:['30dBm','60dBm','約32.15dBi','約62.15dBi'], answer:2, explanation:'ERP 1000W=30dBWをダイポールアンテナ基準dBdで表すと30dBd。dBi=dBd+2.15なので30+2.15≒32.15dBi。' },
        { category:'法規', question:'「騒音規制法」における「特定建設作業」として定められていないものはどれか。', options:['くい打ち機を使用する作業','削岩機を使用する作業','コンクリートプラントを設けて行う作業','スコップによる手掘り作業'], answer:3, explanation:'騒音規制法の特定建設作業はくい打ち機・削岩機・空気圧縮機・コンクリートプラントなどを使う作業。手工具による作業は対象外。' },
        { category:'電気通信工学', question:'「NGN（Next Generation Network）」の特徴として正しいものはどれか。', options:['回線交換技術をベースにした次世代ネットワーク','IPをベースとし音声・データ・映像を統合的に扱うオープンな次世代ネットワーク','無線通信専用のネットワーク','衛星通信ネットワーク'], answer:1, explanation:'NGNはIPをベースとした次世代電話網。音声・データ・映像を統合してQoS・セキュリティ・信頼性を確保するオープンネットワーク。NTTのひかり電話に使われている。' },
        { category:'施工管理', question:'「親杭横矢板工法」の説明として正しいものはどれか。', options:['H型鋼などを一定間隔で打設し、掘削に合わせて横矢板を挿入する工法','鋼矢板を連続して打設する工法','コンクリートを現場で打設する工法','グラウトで地盤を固める工法'], answer:0, explanation:'親杭横矢板工法はH鋼などの親杭を一定間隔で打設し、掘削の進行に合わせて親杭間に横矢板を挿入して土圧を受ける山留め工法。軟弱地盤には不向き。' },
        { category:'法規', question:'電気通信工事で発生する廃プラスチック類は廃棄物処理法上何に分類されるか。', options:['一般廃棄物','産業廃棄物','特別管理廃棄物','有価物'], answer:1, explanation:'建設工事で発生する廃プラスチック類・金属くず・ガラスくず等は産業廃棄物に分類される。適切な処理業者に委託して処理しなければならない。' },
        { category:'電気通信工学', question:'「スループット」の説明として正しいものはどれか。', options:['理論上の最大伝送速度','実際のネットワークで単位時間内に転送できるデータ量（実効転送速度）','回線の遅延時間','信号の周波数'], answer:1, explanation:'スループットは実際のネットワークにおける実効転送速度（bps）。オーバーヘッド・再送・輻輳制御などにより理論値より低くなる。' },
        { category:'施工管理', question:'「工事写真」の撮影について正しいものはどれか。', options:['工事完成後に主要箇所のみ撮影すればよい','施工の各段階（着工前・施工中・完成後）において、設計図書との整合が確認できるよう適切に撮影・整理する','写真は任意であり義務ではない','スマートフォンによる撮影は認められない'], answer:1, explanation:'工事写真は施工記録として重要。着工前の現況・施工中の埋設物や隠蔽部・完成状況を撮影し整理・保存する。公共工事では提出が義務付けられている。' },
        { category:'電気通信工学', question:'「LTE」の特徴として正しいものはどれか。', options:['第2世代（2G）移動通信システム','OFDMA・MIMOを採用した第4世代（4G）に向けた3.9世代移動通信システム','有線通信の規格','衛星通信の規格'], answer:1, explanation:'LTEはOFDMA（下り）・SC-FDMA（上り）とMIMO技術を採用した第3.9世代移動通信規格。LTE-Advancedが本来の4G規格。' },
        { category:'法規', question:'「電気通信設備工事担任者」の資格について正しいものはどれか。', options:['電気通信事業法に基づき、端末設備等の接続工事を行うために必要な資格','建設業法に基づく資格','電波法に基づく資格','自主的な民間資格であり法的根拠はない'], answer:0, explanation:'工事担任者は電気通信事業法に基づく国家資格。端末設備等を電気通信回線設備に接続するための工事を行い・監督する者に必要。AI・DD総合種などの種別がある。' },
        { category:'電気通信工学', question:'「IDS」と「IPS」の違いとして正しいものはどれか。', options:['IDSは不正アクセスを検知して通報し、IPSは検知に加えて自動的にブロックする','IDSはIPSの旧称で機能は同じ','IPSは検知のみでIDSがブロックする','どちらも同じ機能'], answer:0, explanation:'IDSは不正アクセスを検知してアラートを発するシステム。IPSはさらに進んで不正なパケットを自動的にブロックする予防的なシステム。' },
        { category:'施工管理', question:'「受電設備工事」における「耐圧試験」の目的として正しいものはどれか。', options:['通信速度を測定すること','電気設備の絶縁性能が規定値以上あることを確認すること','機器の消費電力を確認すること','接地抵抗値を確認すること'], answer:1, explanation:'耐圧試験（絶縁耐力試験）は最大使用電圧の1.5倍の電圧を印加して絶縁破壊しないことを確認する試験。電気設備技術基準で義務付けられている。' },
        { category:'法規', question:'公衆電気通信回線に端末設備を接続する場合の条件として正しいものはどれか。', options:['誰でも自由に接続できる','技術基準適合認定（技適）を受けた端末設備、またはその旨の認定を受けた自営端末設備のみ接続できる','NTTが販売した端末設備のみ接続できる','無線端末のみ接続できる'], answer:1, explanation:'電気通信事業法により、電気通信回線設備に接続する端末設備は技術基準適合認定を受けたもの、または同等の認定を受けた自営端末設備でなければならない。' }
    ]
};
questions.beginner.forEach((q,i)     => q.id = 'b'+i);
questions.intermediate.forEach((q,i) => q.id = 'i'+i);
questions.advanced.forEach((q,i)     => q.id = 'a'+i);
const allQuestions = [
    ...questions.beginner.map(q => ({...q, _level:'初級'})),
    ...questions.intermediate.map(q => ({...q, _level:'中級'})),
    ...questions.advanced.map(q => ({...q, _level:'上級'}))
];
function loadWeakIds() { return new Set(JSON.parse(localStorage.getItem('weakIds') || '[]')); }
function saveWeakIds(s) { localStorage.setItem('weakIds', JSON.stringify([...s])); }
function updateHomeScreen() {
    const count = loadWeakIds().size;
    const btn = document.getElementById('weak-btn');
    if (count > 0) { btn.style.display = 'block'; document.getElementById('weak-btn-sub').textContent = '記録された苦手問題 '+count+'問を集中攻略'; }
    else { btn.style.display = 'none'; }
}
let currentLevel='', currentQuestions=[], currentIndex=0, score=0, answered=false, sessionWrong=[];
function startQuiz(level) {
    currentLevel = level;
    if (level==='random') { currentQuestions = shuffle([...allQuestions]).slice(0,20); }
    else if (level==='weak') {
        const weakIds=loadWeakIds(), pool=allQuestions.filter(q=>weakIds.has(q.id));
        if (pool.length===0) { alert('苦手問題はまだありません。'); return; }
        currentQuestions = shuffle(pool).slice(0,Math.min(20,pool.length));
    } else { currentQuestions = shuffle([...questions[level]]).slice(0,20); }
    currentIndex=0; score=0; answered=false; sessionWrong=[];
    document.getElementById('level-screen').style.display='none';
    document.getElementById('result-screen').style.display='none';
    document.getElementById('quiz-screen').style.display='block';
    showQuestion();
}
function shuffle(arr) { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr; }
function showQuestion() {
    answered=false;
    const q=currentQuestions[currentIndex], total=currentQuestions.length;
    document.getElementById('progress-bar').style.width=((currentIndex/total)*100)+'%';
    document.getElementById('progress-text').textContent=(currentIndex+1)+' / '+total+' 問';
    document.getElementById('category-tag').textContent=q.category+(q._level?'　['+q._level+']':'');
    document.getElementById('question-text').textContent=q.question;
    const so=shuffleOptions(q.options,q.answer);
    const optionsDiv=document.getElementById('options'); optionsDiv.innerHTML='';
    so.options.forEach((opt,i)=>{
        const btn=document.createElement('button'); btn.className='option-btn';
        btn.textContent='①②③④'[i]+' '+opt; btn.onclick=()=>selectAnswer(i,so.correctIndex);
        optionsDiv.appendChild(btn);
    });
    document.getElementById('explanation').classList.remove('show');
    document.getElementById('next-btn').classList.remove('show');
}
function shuffleOptions(options,correctIndex) {
    const indexed=options.map((opt,i)=>({opt,isCorrect:i===correctIndex}));
    for(let i=indexed.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indexed[i],indexed[j]]=[indexed[j],indexed[i]];}
    return{options:indexed.map(o=>o.opt),correctIndex:indexed.findIndex(o=>o.isCorrect)};
}
function selectAnswer(selected,correctIndex) {
    if(answered)return; answered=true;
    const q=currentQuestions[currentIndex];
    document.querySelectorAll('.option-btn').forEach((btn,i)=>{
        btn.classList.add('disabled');
        if(i===correctIndex)btn.classList.add('correct');
        else if(i===selected)btn.classList.add('wrong');
    });
    const weakIds=loadWeakIds();
    if(selected===correctIndex){score++;weakIds.delete(q.id);}else{weakIds.add(q.id);sessionWrong.push(q);}
    saveWeakIds(weakIds);
    document.getElementById('explanation-text').textContent=q.explanation;
    document.getElementById('explanation').classList.add('show');
    const nextBtn=document.getElementById('next-btn');
    nextBtn.textContent=currentIndex+1<currentQuestions.length?'次の問題 →':'結果を見る';
    nextBtn.classList.add('show');
}
function nextQuestion() { currentIndex++; if(currentIndex<currentQuestions.length)showQuestion();else showResult(); }
function showResult() {
    document.getElementById('quiz-screen').style.display='none';
    document.getElementById('result-screen').style.display='block';
    const total=currentQuestions.length,pct=Math.round((score/total)*100);
    const circle=document.getElementById('result-circle');
    document.getElementById('result-score').textContent=score+'/'+total;
    if(pct>=60){circle.className='result-circle pass';document.getElementById('result-message').textContent='合格ライン達成！ 🎉';document.getElementById('result-sub').textContent='正解率 '+pct+'%　引き続き実力を磨きましょう';}
    else{circle.className='result-circle fail';document.getElementById('result-message').textContent='もう少し！ 💪';document.getElementById('result-sub').textContent='正解率 '+pct+'%　解説を確認して再挑戦しましょう';}
    const breakdown=document.getElementById('category-breakdown');
    if(sessionWrong.length>0){
        const catMap={};
        currentQuestions.forEach(q=>{catMap[q.category]=catMap[q.category]||{correct:0,total:0};catMap[q.category].total++;});
        sessionWrong.forEach(q=>{if(catMap[q.category])catMap[q.category].correct--;});
        Object.keys(catMap).forEach(k=>{catMap[k].correct=catMap[k].total+catMap[k].correct;});
        let html='<h3>📊 カテゴリ別結果</h3>';
        Object.entries(catMap).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total)).forEach(([cat,v])=>{
            const p=Math.round(v.correct/v.total*100),cls=p<60?'bad':'good';
            html+='<div class="cat-row"><span class="cat-name">'+cat+'</span><span class="cat-score '+cls+'">'+v.correct+'/'+v.total+' ('+p+'%)</span></div>';
        });
        html+='<div style="font-size:12px;color:#888;margin-top:8px;">❌ 間違えた'+sessionWrong.length+'問を苦手リストに追加しました</div>';
        breakdown.innerHTML=html;breakdown.style.display='block';
    }else{breakdown.innerHTML='<div style="color:#388e3c;font-size:14px;">✅ 全問正解！苦手リストから削除されました</div>';breakdown.style.display='block';}
}
function retryQuiz(){startQuiz(currentLevel);}
function goHome(){document.getElementById('result-screen').style.display='none';document.getElementById('level-screen').style.display='block';updateHomeScreen();}
updateHomeScreen();
</script>
