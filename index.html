  { id:'q97', group:'電気・電子理論', category:'交流回路', chapter:'3章', stars:4, question:'下図に示すRLC並列回路において、回路のインピーダンスZ〔Ω〕として、適当なものはどれか。ただし、ωは電源の角周波数〔rad/s〕である。', options:['Z = 1 / ( R + j(ωL − 1/ωC) )〔Ω〕','Z = 1 / ( R + j(ωC − 1/ωL) )〔Ω〕','Z = R / ( 1 + jR(ωC − 1/ωL) )〔Ω〕','Z = R / ( 1 + jR(ωL − 1/ωC) )〔Ω〕'], answer:2, explanation:'抵抗・コイル・コンデンサの3素子が並列につながる回路では、それぞれのアドミタンス（インピーダンスの逆数）を足す。1/Z=1/R+1/(jωL)+jωC を整理して逆数をとると、Z=R/(1+jR(ωC−1/ωL))〔Ω〕となり、③が適当。', figure:'<svg viewBox="0 0 260 140" style="width:100%;max-width:300px;margin:0 auto;display:block">       <line x1="30" y1="20" x2="230" y2="20" stroke="currentColor" stroke-width="2"/>       <line x1="30" y1="120" x2="230" y2="120" stroke="currentColor" stroke-width="2"/>       <line x1="60" y1="20" x2="60" y2="45" stroke="currentColor" stroke-width="2"/>       <rect x="45" y="45" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <line x1="60" y1="75" x2="60" y2="120" stroke="currentColor" stroke-width="2"/>       <text x="60" y="65" text-anchor="middle" font-size="11">R</text>       <line x1="130" y1="20" x2="130" y2="45" stroke="currentColor" stroke-width="2"/>       <rect x="115" y="45" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <line x1="130" y1="75" x2="130" y2="120" stroke="currentColor" stroke-width="2"/>       <text x="130" y="65" text-anchor="middle" font-size="11">L</text>       <line x1="200" y1="20" x2="200" y2="45" stroke="currentColor" stroke-width="2"/>       <rect x="185" y="45" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>       <line x1="200" y1="75" x2="200" y2="120" stroke="currentColor" stroke-width="2"/>       <text x="200" y="65" text-anchor="middle" font-size="11">C</text>       <text x="130" y="135" text-anchor="middle" font-size="11">R・L・C 並列接続、角周波数ω</text>     </svg>', choiceNotes:['R+jXの形は並列合成の結果として現れる式ではなく、誤りである。','並列合成の式の立て方および項の符号が誤っている。','アドミタンスの和1/R+jωC+1/(jωL)から逆数をとるとZ=R/(1+jR(ωC−1/ωL))となり、正しい。','ωLとωCの項の符号関係が入れ替わっており誤りである。'] },
  { id:'q98', group:'電気・電子理論', category:'情報源符号化（PCM方式）', chapter:'3章', stars:4, question:'パルス符号変調（PCM）に関する記述として、適当でないものはどれか。', options:['標本化は、連続したアナログ信号の振幅を一定の時間間隔で区切り、断続的な信号にすることであり、この時間間隔は標本化定理により決められる','パルス符号変調は、標本化、量子化、符号化の3段階の手順で行われる','符号化は、量子化された信号の振幅値を2進符号に置き換えることである','量子化によって生じる量子化前の信号の振幅値と量子化後の信号の振幅値の差を、折り返し雑音という'], answer:3, explanation:'PCMは標本化→量子化→符号化の順で処理を行う。アナログ信号の元値と量子化された後のデータとの差分は「量子化雑音」または「量子化誤差」といい、折り返し雑音ではない。したがって④が不適当。標本化は取り扱うアナログ信号の最高周波数の2倍以上の周波数でサンプリングを行う。', choiceNotes:['標本化定理に基づき標本化の時間間隔（サンプリング周波数）を決めるという記述は正しい。','PCMは標本化・量子化・符号化の3段階で行われるという記述は正しい。','量子化された振幅値を2進符号に変換することを符号化と呼ぶという記述は正しい。','量子化前後の振幅値の差は量子化雑音（量子化誤差）と呼ばれ、折り返し雑音ではないため誤りである。'] },
  { id:'q99', group:'電気・電子理論', category:'変調方式（QAM）', chapter:'3章', stars:4, question:'デジタル変調のQAM方式に関する記述として、適当でないものはどれか。', options:['16QAMは、受信信号レベルが安定であれば16PSKに比べBER特性が良好となる','64QAMは、16QAMよりも1シンボルで多くの情報を伝送できる','QAM方式は、搬送波の位相と周波数の両方を変化させる変調方式である','QAM方式は、我が国の地上デジタルテレビ放送のOFDM信号を構成するサブキャリアの変調に利用されている'], answer:2, explanation:'QAM変調は、複数の振幅を持つ2つの正弦波を互いに軸をπ/2ラジアン変化させて掛け算する方式であり、搬送波の位相と周波数を変化させる方式ではない。③が不適当。16PSKの信号点間距離は0.39、16QAMは0.47であり、16QAMのほうがエラーに強い。64QAMは1シンボルあたり6ビット分の情報を載せる。', choiceNotes:['16QAMは16PSKより信号点間距離が広くBER特性が良好であるという記述は正しい。','64QAMは16QAMより多くの情報（1シンボル6ビット対4ビット）を伝送できるという記述は正しい。','QAMは振幅と位相を組み合わせて変化させる変調方式であり、位相と周波数を変化させる方式ではないため誤りである。','地上デジタルテレビ放送のOFDM信号のサブキャリア変調にQAMが利用されているという記述は正しい。'] },
  { id:'q100', group:'電気・電子理論', category:'変調方式（QAM）', chapter:'3章', stars:4, question:'デジタル変調のQAM方式に関する記述として、適当でないものはどれか。', options:['16QAMは、直交している2つの4値ASK変調信号を合成して得ることができる','16QAMは、受信信号レベルが安定であれば16PSKに比べBER特性が良好となる','64QAMの信号点間距離は、QPSK（4PSK）の1/7となる','64QAMは、16QAMに比べ同程度の占有周波数帯幅で2倍の情報量を伝送できる'], answer:3, explanation:'64QAMは16QAMよりも1.5倍の情報量を伝送することが可能。64値は2の6乗で6ビット分、16値は2の4乗で4ビット分であり、6ビット/4ビット=1.5倍。したがって④が不適当。16QAMは4値ASKを掛け合わせて4×4=16値をとる。64QAMの信号点間距離は約0.2、4PSKは約1.4で約7倍の開きがある。', choiceNotes:['16QAMは直交する2つの4値ASK信号を合成して得られるという記述は正しい。','16QAMは16PSKよりBER特性が良好であるという記述は正しい。','64QAMの信号点間距離はQPSKの約1/7であるという記述は正しい。','64QAMは16QAMに比べ6ビット/4ビット=1.5倍の情報量を伝送できるのであって、2倍という記述は誤りである。'] },
  { id:'q101', group:'電気・電子理論', category:'変調方式（シフトキーイング）', chapter:'3章', stars:4, question:'デジタル無線の変調方式に関する記述として、適当でないものはどれか。', options:['ASKは、伝送信号の振幅の違いに情報を載せる方式であり、振幅性雑音や受信信号のレベル変化によってBERが悪化しやすい','QPSKは、4つの位相点を用いて情報を伝送する方式であり、1シンボルで4ビットの情報を送ることができる','64QAMは、直交する2つの8値のASK変調信号を合成する方式であり、1シンボルで6ビットの情報を送ることができる','FSKは、情報を搬送波の周波数の違いに置き換えて伝送する方式であり、振幅性雑音に強い'], answer:1, explanation:'4PSK（QPSK）は、1シンボルに2ビット分の情報を格納し、これの表現に4値を必要とする。4ビットではないため②が不適当。64QAMは縦軸8通り、横軸8通りの振幅を持ち8×8=64個の位置を取ることができ、1シンボルで64値（6ビット分）を伝送可能。', choiceNotes:['ASKは振幅性雑音やレベル変動でBERが悪化しやすいという記述は正しい。','QPSKは1シンボルで2ビットの情報を伝送する方式であり、4ビットという記述は誤りである。','64QAMは直交する2つの8値ASK信号を合成し1シンボルで6ビット伝送できるという記述は正しい。','FSKは周波数の違いに情報を載せる方式で振幅性雑音に強いという記述は正しい。'] },
  { id:'q102', group:'電気・電子理論', category:'変調方式（シフトキーイング）', chapter:'3章', stars:4, question:'デジタル変調であるPSKに関する記述として、適当でないものはどれか。', options:['搬送波電力対雑音電力比（C/N）が同じ場合、BPSKと8PSKの誤り率を比較するとBPSKのほうが誤り率が小さい','QPSKの変調信号は、搬送波発振回路から出力される搬送波とその搬送波の位相を90度ずらした搬送波にそれぞれBPSK変調を行った後、この2つの信号を合成することで得られる','PSKは、ベースバンド信号の0と1に応じて、搬送波の振幅を変化させる変調方式である','QPSKは1シンボルで2ビットの情報を伝送でき、8PSKは1シンボルで3ビットの情報を伝送できる'], answer:2, explanation:'PSKは搬送波を時間方向にずらして（位相を変化させて）信号を表現する変調方式である。搬送波の振幅を変化させる変調方式はASKであり、PSKではない。③の記載が不適当。2PSKと8PSKを比べると、2PSKが格納できる情報量は1/3だが送受信エラーが起きた場合の被害も1/3で済む。', choiceNotes:['C/Nが同じ場合、信号点間距離が広いBPSKの方が8PSKより誤り率が小さいという記述は正しい。','QPSKは2つのBPSK信号を90度位相をずらして合成することで得られるという記述は正しい。','PSKは搬送波の位相を変化させる変調方式であり、振幅を変化させる方式（ASK）ではないため誤りである。','QPSKは1シンボル2ビット、8PSKは1シンボル3ビットの情報を伝送できるという記述は正しい。'] },
  { id:'q103', group:'電気・電子理論', category:'多元接続', chapter:'3章', stars:4, question:'CDMA（符号分割多元接続）に関する記述として、適当なものはどれか。', options:['個々のユーザに使用チャネルとして直交周波数関係にある複数のキャリアを個別に割り当てる方式である','個々のユーザに使用チャネルとして個別に信号のスペクトルを拡散する拡散符号を割り当てる方式である','個々のユーザに使用チャネルとして1つの搬送波のタイムスロットを個別に割り当てる方式である','個々のユーザに対して個別に使用する周波数を割り当てる方式である'], answer:1, explanation:'信号のスペクトルを拡散する符号を使用チャネルとして個々のユーザに割り当てる方式がCDMAであり、②が適当。①の直交周波数関係にある複数のキャリアを割り当てる方式はOFDMA、③のタイムスロットを個別に割り当てる方式はTDMA、④の周波数を割り当てる方式はFDMAである。', choiceNotes:['直交する複数キャリアを個別に割り当てる方式はOFDMAの説明であり、CDMAではない。','ユーザ固有の拡散符号をチャネルとして割り当てる方式がCDMAであり、正しい。','タイムスロットを個別に割り当てる方式はTDMAの説明であり、CDMAではない。','周波数を個別に割り当てる方式はFDMAの説明であり、CDMAではない。'] },
  { id:'q104', group:'電気・電子理論', category:'多元接続', chapter:'3章', stars:4, question:'移動体通信で用いられる無線アクセス方式の特徴に関する記述として、適当でないものはどれか。', options:['無線資源を周波数で分割するFDMA方式は、デジタル変調だけでなくアナログ変調にも用いることができる','送信信号にユーザ固有の符号を乗算してスペクトルを拡散するCDMA方式は、隣接する基地局間で異なる周波数を使用する必要がある','無線資源を時間で分割するTDMA方式は、各ユーザはフレームごとに間欠的に情報を送信するため、音声データ等を圧縮して送信する必要があることから、デジタル変調で用いられる','直交関係にある複数のキャリアを個々のユーザの使用チャネルに割り当てるOFDMAは、移動通信のマルチパス環境下でも高品質な信号伝送が可能である'], answer:1, explanation:'CDMA方式は、ユーザに固有の符号を付与してスペクトル拡散を行うことで、他のユーザと同じ周波数を用いても区別が可能。基地局に対しても同一の周波数を使うことで、瞬断なく基地局間を移動できるソフトハンドオーバが実現した。したがって②が不適当。', choiceNotes:['FDMA方式はデジタル変調・アナログ変調のいずれにも適用できるという記述は正しい。','CDMAはユーザ固有の符号で識別するため隣接基地局間で同一周波数を共用でき、ソフトハンドオーバも可能であるため、異なる周波数を使う必要があるという記述は誤りである。','TDMAは間欠送信のためデータを圧縮しデジタル変調で用いられるという記述は正しい。','OFDMAはマルチパス環境下でも高品質な伝送が可能であるという記述は正しい。'] },
  { id:'q105', group:'電気・電子理論', category:'電波伝播', chapter:'3章', stars:4, question:'中波帯の電波の伝わり方に関する記述として、適当なものはどれか。', options:['直接波による伝搬が主体であるが、電波の伝搬路中に降雨域があると降水粒子による散乱やエネルギーの吸収による電波の減衰が発生し、周波数が高くなるほどその減衰が大きくなる','昼間は主に地表波により伝搬し、夜間は電離層のE層で反射して遠くまで伝搬する','大地と電離層のD層の間を反射しながら伝搬するので、導波管の中を伝わる電波と同じような電磁界の模様が生じ、減衰が少なく非常に遠くまで伝搬する','スポラディックE層の発生により、電波が反射され、見通し距離を超えて非常に遠くまで伝搬することがある'], answer:1, explanation:'降雨による減衰を多く受けるのは10GHz以上の高い周波数帯（SHF帯）なので①は不適当。電離層のうちE層で反射を起こすのは中波であり②が適当。電離層のD層で反射をするのは周波数の低い長波（LF）なので③は不適当。スポラディックE層で反射するのは超短波（VHF）帯なので④も不適当。', choiceNotes:['降雨減衰が顕著になるのはSHF帯以上の高い周波数であり、中波（MF帯）の説明としては誤りである。','中波は昼間は地表波、夜間は電離層E層反射で遠方まで伝搬するという記述は正しい。','大地とD層間を反射しながら導波管的に伝わるのは長波（LF）の特徴であり、中波の説明としては誤りである。','スポラディックE層で反射するのはVHF帯の特徴であり、中波の説明としては誤りである。'] },
  { id:'q106', group:'電気・電子理論', category:'電波伝播', chapter:'3章', stars:4, question:'VHF帯の電波の見通し外伝搬に関する記述として、適当でないものはどれか。', options:['電波の伝搬路上に山岳があるとき、山岳の尾根の厚みが波長に比べて薄く、完全導体とみなせるような場合には、山頂が二次放射源となった電波の受信電界強度が、山岳のない場合の球面大地回折波より著しく強くなる場合がある','大地と電離層のD層の間を反射しながら伝搬するので、導波管の中を伝わる電波と同じような電磁界の模様が生じ、減衰が少なく非常に遠くまで伝搬する','送信点および受信点から見通せる地上から数km上空の空間に電波を放射すると、送受信アンテナのビームが交差する部分のうち、受信アンテナのビーム角に含まれる方向に散乱された電波が受信される','地上約100kmの所に突然電子密度の濃い層のスポラディックE層が現われると、電波が密度の濃い層で反射され、地上に戻ってくるため非常に遠くまで伝搬する'], answer:1, explanation:'VHF帯は通常はD〜Fの全ての層を突き抜けてしまい、宇宙へと進む。D層での反射は起こさないため②が不適当。①はナイフエッジと呼ばれる尖った山岳の尾根で起こる回折現象。③は対流圏散乱を意味する。④のスポラディックE層は突発的に発生し、VHF帯はこの層で反射を起こして想定外の遠方まで電波が届く場合がある。', choiceNotes:['山岳回折（ナイフエッジ効果）による受信電界強度増大の記述は正しい。','VHF帯は電離層D層を突き抜けてしまい反射しないため、D層間を反射しながら伝搬するという記述は誤りである。','対流圏散乱によりビーム交差領域からの散乱波を受信するという記述は正しい。','スポラディックE層による見通し外への異常伝搬の記述は正しい。'] },
  { id:'q107', group:'電気・電子理論', category:'マイクロ波通信（中継方式）', chapter:'3章', stars:4, question:'マイクロ波通信の中継方式の1つである無給電中継方式に関する記述として、適当なものはどれか。', options:['受信したマイクロ波からベースバンド信号を復調し、波形整形や同期調整を行った後、再び変調して送信する方式である','受信したマイクロ波をそのまま増幅して送信するか、または受信したマイクロ波を目的の周波数に変換した後に増幅して送信する方式である','受信したマイクロ波帯の信号を中間周波数に変換して増幅した後、再びマイクロ波帯に変換して送信する方式である','電波を反射板等で反射させて、電波の伝搬方向を変えて中継する方式である'], answer:3, explanation:'①は再生中継、②は直接中継、③はヘテロダイン中継の説明でありいずれも不適当。電気的な中継装置を持たずに反射板等で伝搬方向を変える形式を無給電中継方式と呼び、④が適当。反射板を鏡のように配置する形や、2つの空中線を給電線で背中合わせに接続する形等がある。', choiceNotes:['復調・波形整形後に再変調する方式は再生中継方式の説明であり、無給電中継方式ではない。','受信波を増幅または周波数変換して送信する方式は直接中継方式の説明であり、無給電中継方式ではない。','中間周波数に変換して増幅する方式はヘテロダイン中継方式の説明であり、無給電中継方式ではない。','反射板等で伝搬方向を変える方式が無給電中継方式であり、正しい説明である。'] },
  { id:'q108', group:'電気・電子理論', category:'マイクロ波通信（中継方式）', chapter:'3章', stars:4, question:'マイクロ波通信の中継方式に関する記述として、適当でないものはどれか。', options:['受信したマイクロ波帯の信号を中間周波数に変換して増幅した後、再びマイクロ波帯に変換して送信する方式をヘテロダイン中継方式という','電波を反射板等で反射させて電波の伝搬方向を変えて中継する方式を、無給電中継方式という','受信した信号を目的の周波数に変換した後、または直接増幅して送信する方式を直接中継方式といい、衛星回線の中継で用いられる','受信波よりベースバンド信号を復調し、波形整形や同期調整を行った後、再び変調して送信する方式を再生中継方式といい、アナログ回線の中継に用いられる'], answer:3, explanation:'再生中継は、中継局に到着した受信波をいったん復調して信号レベルまで戻し、波形の歪み等を一掃して完全な形のパルスを生成し直す方式。つまりデジタル信号のための方式であって、アナログ回線には適用できない。したがって④が不適当。', choiceNotes:['中間周波数に変換して増幅後マイクロ波帯に戻す方式がヘテロダイン中継方式であるという記述は正しい。','反射板等で伝搬方向を変える方式が無給電中継方式であるという記述は正しい。','増幅または周波数変換のみで中継する方式が直接中継方式であり、衛星回線でも用いられるという記述は正しい。','再生中継方式はデジタル信号を復調・整形して再送信する方式であり、アナログ回線には適用できないため誤りである。'] },
  { id:'q109', group:'電気・電子理論', category:'交換方式', chapter:'3章', stars:4, question:'回線交換方式とパケット交換方式の特徴に関する記述として、適当でないものはどれか。', options:['回線交換方式は、送信側と受信側のデータ端末装置の通信速度が異なっていてもよい','回線交換方式は、送信側と受信側のデータ端末装置の伝送制御方式が同じでなければならない','パケット交換方式は、回線交換方式に比べて回線の利用効率が高い','パケット交換方式は、各パケットは異なる伝送路をたどる可能性がある'], answer:0, explanation:'回線交換方式の場合は、送信方と受信方とで、データ端末装置の通信速度を一致させる必要がある。①の記述は不適当。同様に伝送制御方式も一致させなければならない。パケット交換方式はデータを圧縮して送受信できることや、1つの回線をユーザが占有しないことから利用効率は高くなる。', choiceNotes:['回線交換方式は送受信端末の通信速度を一致させる必要があるため、異なっていてもよいという記述は誤りである。','回線交換方式では伝送制御方式も送受信で一致させる必要があるという記述は正しい。','パケット交換方式は回線を占有しないため利用効率が高いという記述は正しい。','パケット交換方式は各パケットが異なる伝送路を通る可能性があるという記述は正しい。'] },
  { id:'q110', group:'電気・電子理論', category:'交換方式', chapter:'3章', stars:4, question:'パケット交換方式に関する記述として、適当でないものはどれか。', options:['端末装置からのデータを、パケットと呼ぶ一定量の単位に区切って交換機内のメモリに蓄積し、パケットに付加された宛先等の情報によりパケットを次の交換機に転送する','通信回線を特定の端末装置間で占有することがないので、通信回線の利用効率を高めることができる','パケットは、故障箇所を回避する迂回ルートを自動的に選択して転送される','送信側の端末装置と受信側の端末装置の通信速度を一致させる必要がある'], answer:3, explanation:'パケット交換方式は回線交換方式と異なり、送受信間で端末の通信速度を一致させる必要はない。通信プロトコルであるTCP/IPに準拠していれば、双方で適切な速度を選択して伝送が行なわれる。したがって④が不適当。', choiceNotes:['パケットに分割し宛先情報を用いて交換機を経由して転送するという記述は正しい。','回線を占有しないため利用効率が高いという記述は正しい。','故障箇所を迂回する経路を自動選択して転送できるという記述は正しい。','パケット交換方式は送受信端末の通信速度を一致させる必要はなく、TCP/IP等のプロトコルにより適切に伝送されるため、一致させる必要があるという記述は誤りである。'] },
  { id:'q111', group:'ネットワーク・情報', category:'コンピュータ', chapter:'3章', stars:4, question:'コンピュータの中央処理装置に関する記述として、適当でないものはどれか。', options:['制御装置は、主記憶装置に記憶されているプログラムの命令を取り出して解読し、制御信号を各装置に送り制御する','中央処理装置は、制御装置、演算装置、主記憶装置および補助記憶装置で構成される','演算装置は、制御装置からの制御信号により算術・論理・比較・シフト等の演算を行う','中央処理装置の性能を表す指標であるMIPSは、1秒間に実行できる命令の数を10^6で除した値である'], answer:1, explanation:'中央処理装置は制御装置と演算装置を包括した概念として定義され、一般論的には記憶装置は中央処理装置には含まない場合が多い。少なくとも補助記憶装置を含むことはないため、②が不適当。MIPSは1秒間に実行できる百万単位の命令数なので④は適当。', choiceNotes:['制御装置がプログラム命令を取り出し解読して各装置を制御するという記述は正しい。','中央処理装置は一般に制御装置と演算装置で構成され、主記憶・補助記憶装置は含まないため誤りである。','演算装置が制御信号により算術・論理・比較・シフト等の演算を行うという記述は正しい。','MIPSは1秒間に実行できる命令数を10^6で除した指標であるという記述は正しい。'] },
  { id:'q112', group:'ネットワーク・情報', category:'コンピュータ', chapter:'3章', stars:4, question:'ハードディスク装置に関する記述として、適当でないものはどれか。', options:['平均アクセス時間は、平均シーク時間、平均サーチ時間およびデータ転送時間を合計した時間である','セクタは、トラックをいくつかに等分割した領域で、データの読み書きの最小単位である','平均シーク時間は、磁気ディスクの1回転に要する時間の半分である','磁性材料を塗布した磁気ディスクを高速で回転させ、磁気ヘッドによってデータの読み書きを行う'], answer:2, explanation:'シーク時間とは位置決め時間ともいい、磁気ヘッドが目的の場所まで移動するのにかかる時間のこと。「磁気ディスクの1回転に要する時間の半分」は平均サーチ時間の説明であるため、③が不適当。', choiceNotes:['平均アクセス時間は平均シーク時間・平均サーチ時間・データ転送時間の合計であるという記述は正しい。','セクタはトラックを分割したデータ読み書きの最小単位であるという記述は正しい。','「磁気ディスク1回転に要する時間の半分」は平均サーチ（回転待ち）時間の説明であり、平均シーク時間の説明ではないため誤りである。','磁性材料を塗布したディスクを高速回転させ磁気ヘッドで読み書きするという記述は正しい。'] },
  { id:'q113', group:'ネットワーク・情報', category:'コンピュータ', chapter:'3章', stars:4, question:'コンピュータシステムの利用形態である、バッチ処理に関する記述として、適当なものはどれか。', options:['コンピュータに入力するデータを、一定量または一定期間蓄えておき、それをひとまとめにして処理する方式である','人とコンピュータが、ディスプレイ等を通じて、やり取りをしながら処理を進める方式である','コンピュータの処理時間をごく短い時間単位に分割し、それを各端末に順次割り当てて実行することで、各端末の利用者があたかもコンピュータを独占しているかのように使える方式である','処理要求やデータの発生に対して、ただちに処理を行い結果を返す方式である'], answer:0, explanation:'データを一定量あるいは一定期間蓄えておき、あるタイミングで一括処理する方式がバッチ処理であり①が適当。②は対話型処理、③はマルチタスク、④はリアルタイム処理の説明である。', choiceNotes:['データを一定量・一定期間蓄積し一括処理する方式がバッチ処理であり、正しい説明である。','対話しながら処理を進める方式は対話型処理の説明であり、バッチ処理ではない。','処理時間を短時間に分割し各端末に順次割り当てる方式はマルチタスク（TSS）の説明であり、バッチ処理ではない。','要求に対し即座に処理し結果を返す方式はリアルタイム処理の説明であり、バッチ処理ではない。'] },
  { id:'q114', group:'ネットワーク・情報', category:'コンピュータ', chapter:'3章', stars:4, question:'コンピュータシステムの利用形態に関する記述として、適当なものはどれか。', options:['コンピュータに入力するデータ等を、一定量または一定期間蓄えておき、それをひとまとめにして処理する方式をリアルタイム制御処理という','人とコンピュータが、ディスプレイ等を通じて、やり取りをしながら処理を進める方式を対話型処理という','センサにより機器の状態や外部の状況を常に監視し、状態や環境の変化に応じて機器の制御を行う方式をバッチ処理という','オンラインで接続された端末からの要求に基づいて、関連する複数の処理を1つの処理単位として即座に実行し結果を返す方式を、パイプライン処理という'], answer:1, explanation:'リアルタイム処理は処理要求を即座に実行して結果を返す方式なので①は不適当。人間に近い形でコンピュータを扱える方式を対話型処理と呼ぶため②が適当。バッチ処理は一定量・一定期間蓄積して一括処理する方式なので③は不適当。関連する複数の事項を1つの処理単位として実行する方式はトランザクション処理であり④も不適当。', choiceNotes:['データを蓄積し一括処理する方式はバッチ処理の説明であり、リアルタイム制御処理ではないため誤りである。','人とコンピュータが対話しながら処理を進める方式が対話型処理であり、正しい説明である。','センサで状態を監視し変化に応じて制御する方式はリアルタイム制御処理の説明であり、バッチ処理ではないため誤りである。','複数処理を1単位として即座に実行する方式はトランザクション処理の説明であり、パイプライン処理ではないため誤りである。'] },
  { id:'q115', group:'ネットワーク・情報', category:'データベース', chapter:'3章', stars:4, question:'データベース管理システム（DBMS）の機能に関する記述として、適当でないものはどれか。', options:['データベース定義機能とは、データベースの構造やデータの格納形式を内部スキーマ、概念スキーマおよび外部スキーマとして定義する機能をいう','障害回復機能とは、バックアップファイルやログファイルを事前に採取し、データベースの運用中に発生した障害から回復させるための機能をいう','排他制御機能とは、データベースの利用者ごとに利用できるデータを制限することにより、不正なアクセスからデータを守る機能をいう','データベース操作機能とは、データベースへの操作（登録、読出し、更新、削除）をデータベース言語を用いて行う機能をいう'], answer:2, explanation:'排他制御機能は、複数のユーザによって共有されているデータに対して、データの整合性を保つための仕組みであり、最初の1ユーザのみにアクセス権を与えて他のユーザには更新を禁止する手法。不正なアクセスからデータを守る機能ではないため、③が不適当。', choiceNotes:['データベース定義機能が内部・概念・外部スキーマを定義する機能であるという記述は正しい。','障害回復機能がバックアップやログを用いて障害から回復させる機能であるという記述は正しい。','排他制御機能は複数ユーザによる同時更新から整合性を守る仕組みであり、不正アクセス防止（アクセス制限）の機能ではないため誤りである。','データベース操作機能がデータベース言語で登録・読出し・更新・削除を行う機能であるという記述は正しい。'] },
  { id:'q116', group:'ネットワーク・情報', category:'データベース', chapter:'3章', stars:4, question:'データベースのデータモデルの1つであるリレーショナルモデルに関する記述として、適当なものはどれか。', options:['データを2次元の表形式で表し、複数の表を関連付けてデータ構造を表現するデータモデルである','データを階層型の木構造で表現し、データ間を網の目状につないでおり、親が複数の子を持つことができるだけでなく、子も複数の親を持つことができる','データを階層型の木構造で表現し、データ間は親子関係になっており、親は複数の子を持つことができるが、子は1つの親しか持つことができない','文字や数値等のデータだけでなく、データとデータに対する操作を含めてオブジェクトとして扱うデータモデルである'], answer:0, explanation:'リレーショナル型データベースはテーブルの概念を用いてデータを表形式で整理する方式であり①が適当。子が複数の親を持てる形はネットワーク型（②）、子が1つの親しか持てない形式は階層型（③）、データと操作をまとめて扱うのはオブジェクト指向データベース（④）である。', choiceNotes:['データを2次元の表形式で表し複数の表を関連付けるモデルがリレーショナルモデルであり、正しい。','親も子も複数関係を持てる網状構造はネットワーク型モデルの説明であり、リレーショナルモデルではない。','親が複数の子を持ち子は1つの親しか持てない木構造は階層型モデルの説明であり、リレーショナルモデルではない。','データと操作をオブジェクトとして扱うのはオブジェクト指向データベースの説明であり、リレーショナルモデルではない。'] },
  { id:'q117', group:'電気・電子理論', category:'半導体', chapter:'3章', stars:4, question:'半導体に関する記述として、適当でないものはどれか。', options:['シリコンの真性半導体にヒ素等のドナーを混入したN形半導体では、自由電子の数が正孔の数より多くなる','半導体の電気伝導度は、真性半導体に添加されるドナーやアクセプタとなる不純物の濃度に依存する','逆方向電圧を加えたPN接合ダイオードでは、空乏層の領域で正孔と自由電子が結合しにくい状態になり、空乏層が狭くなる','ガリウムヒ素を用いた化合物半導体では、半導体材料中を移動する電子の速度がシリコン半導体より速くなり、電子回路の高速動作が可能になる'], answer:2, explanation:'PN接合に逆方向の電圧を印加すると、電子と正孔の双方が電源側に引っ張られるため、空乏層の間隔は広くなる。したがって③が不適当。', choiceNotes:['ドナー混入のN形半導体で自由電子が正孔より多くなるという記述は正しい。','半導体の電気伝導度が添加不純物濃度に依存するという記述は正しい。','逆方向電圧を加えると空乏層は広くなるのであり、狭くなるという記述は誤りである。','ガリウムヒ素半導体は電子移動速度が速く高速動作が可能であるという記述は正しい。'] },
  { id:'q118', group:'電気・電子理論', category:'半導体', chapter:'3章', stars:4, question:'トランジスタ増幅回路の接地方式に関する記述として、適当でないものはどれか。', options:['エミッタ接地回路の入力信号と出力信号は、同位相である','ベース接地回路の入力信号と出力信号は、同位相である','コレクタ接地回路の入力信号と出力信号は、同位相である','コレクタ接地回路は、エミッタホロワとも呼ばれている'], answer:0, explanation:'エミッタ接地回路では、ベース電流が大きくなるほど比例して電圧降下も大きくなり、出力には入力と裏返しの模様の波形が現れる。波形の正負が反転した状態で位相で見ると180度ずれた逆位相になるため、①が不適当。', choiceNotes:['エミッタ接地回路は入力と出力の位相が180度反転する逆位相であり、同位相という記述は誤りである。','ベース接地回路は入力と出力が同位相であるという記述は正しい。','コレクタ接地回路は入力と出力が同位相であるという記述は正しい。','コレクタ接地回路はエミッタホロワとも呼ばれるという記述は正しい。'] },
  { id:'q119', group:'電気・電子理論', category:'各種回路', chapter:'3章', stars:4, question:'下図に示す発振回路のブロック図に関する記述として、適当でないものはどれか。', options:['特定の周波数を発振させるには、帰還回路に周波数選択回路を入れて、単一周波数だけを帰還するようにする','増幅度Aの増幅回路と帰還率βの帰還回路で構成された発振回路を発振させるための利得条件は、A・β≧1にする必要がある','帰還回路をコイルLとコンデンサCで作る発振回路には、ハートレー発振回路がある','増幅回路と帰還回路で構成された発振回路を発振させるための、帰還回路の出力Vfと増幅回路の入力Viの位相条件は、逆位相にする必要がある'], answer:3, explanation:'増幅回路が吐き出した広帯域の信号の中から希望の周波数だけを帰還回路で絞り込み、増幅回路に戻して循環させて発振する仕組みであるため、位相は当然に同位相でなければならない。④が不適当。', figure:'<svg viewBox="0 0 340 160" style="width:100%;max-width:360px;margin:0 auto;display:block">       <rect x="110" y="20" width="100" height="46" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="160" y="48" text-anchor="middle" font-size="15">増幅回路 A</text>       <rect x="110" y="100" width="100" height="46" fill="none" stroke="currentColor" stroke-width="2"/>       <text x="160" y="128" text-anchor="middle" font-size="15">帰還回路 β</text>       <path d="M210,43 h40 v0" stroke="currentColor" stroke-width="2" fill="none"/>       <path d="M250,43 v80 h-40" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#arrow)"/>       <path d="M110,123 h-40 v-80 h40" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#arrow)"/>       <text x="255" y="90" font-size="13">出力 V0</text>       <text x="45" y="90" font-size="13">Vf</text>       <text x="120" y="15" font-size="12">Vi（入力）</text>       <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="currentColor"/></marker></defs>     </svg>', choiceNotes:['帰還回路に周波数選択回路を入れ単一周波数のみ帰還させるという記述は正しい。','発振継続にはAβ≧1の利得条件が必要であるという記述は正しい。','LとCで帰還回路を構成する発振回路にハートレー発振回路があるという記述は正しい。','発振を持続させるには帰還回路の出力Vfと増幅回路の入力Viは同位相である必要があり、逆位相という記述は誤りである。'] },
  { id:'q120', group:'電気・電子理論', category:'制御', chapter:'3章', stars:4, question:'フィードバック制御システムに関する記述として、適当でないものはどれか。', options:['フィードバック制御とは、フィードバックによって制御量を目標値と比較し、それらを一致させるように操作量を生成する制御である','伝達関数を四角で囲んだものをブロックといい、ブロックと加算・減算・分岐の記号を組み合わせ、信号の流れを矢印で描いた図をシーケンス図という','フィードバック制御は制御量により、プロセス制御、サーボ機構、自動調整に分類される','目標値が時間的に一定である制御を定値制御、時間的に変化する目標値に追従する制御を追従制御という'], answer:1, explanation:'フィードバック制御の流れを描いた図表はブロック線図と呼ばれる。シーケンス図は主にシーケンス制御で用いられるため、②が不適当。', choiceNotes:['フィードバック制御の定義として正しい。制御量を目標値と比較し操作量を生成する仕組みそのものである。','信号の流れをブロックと加算・減算・分岐記号で描いた図は「ブロック線図」であり「シーケンス図」ではない。名称が誤り。','フィードバック制御はプロセス制御・サーボ機構・自動調整に分類されるという記述は正しい。','定値制御と追従制御の定義は正しい。目標値の時間的変化の有無による分類として妥当である。'] },
  { id:'q121', group:'電気・電子理論', category:'制御', chapter:'3章', stars:4, question:'フィードバック制御システムの制御動作に関する記述として、適当でないものはどれか。', options:['積分動作は、過去の偏差の積算値を操作量として与える動作であり、フィードバック制御システムの応答性の改善に効果がある','PID動作は、比例動作、積分動作、微分動作を組み合わせたもので、それぞれのゲインを適切に設定してフィードバック制御システムを構成する','微分動作は、偏差の変化率に微分ゲインを掛け算した値を操作量とするものであり、微分ゲインが大きな値ほど操作量が大きくなる','比例動作は、操作量を偏差に比例させる動作であり、フィードバック制御システムにおいて基本となる動作である'], answer:0, explanation:'積分動作（I動作）は偏差を時間に関して積分して比例動作に加える考え方で、オフセットを埋める方向に作用するが、積分するための準備として過去の偏差を蓄積するため応答性が悪い欠点がある。①が不適当。', choiceNotes:['積分動作は過去の偏差を蓄積して用いるため応答が遅れる欠点があり、応答性の改善に効果があるとする記述は誤り。','PID動作が比例・積分・微分の3動作の組み合わせであるという記述は正しい。','微分動作が偏差の変化率に微分ゲインを乗じた値を操作量とし、ゲインが大きいほど操作量が大きくなるという記述は正しい。','比例動作が偏差に比例した操作量を与える基本動作であるという記述は正しい。'] },
  { id:'q122', group:'法規', category:'河川法令', chapter:'4章', stars:4, question:'河川管理者の許可が必要な事項に関する記述として、「河川法令」上、誤っているものはどれか。', options:['河川区域内に仮設の資材置場を設置する場合は、河川管理者の許可が必要である','電線を河川区域内の上空を通過して設置する場合は、河川管理者の許可が必要である','河川区域内で下水処理場の排出口の付近に積もった土砂を排除するときは、河川管理者の許可が必要である','一時的に少量の水をバケツで河川からくみ取る場合は、河川管理者の許可は必要ない'], answer:2, explanation:'排出口の付近に積もった土砂を排除する等の保守的な措置については、許可は必要ない。したがって③が誤り。河川区域内の上空に電線を通過させる場合や仮設の資材置場を設ける場合は占有にあたり許可が必要。少量の水のくみ取りも許可不要。', choiceNotes:['河川区域内への仮設資材置場の設置は占用にあたり、河川管理者の許可が必要という記述は正しい。','河川区域上空への電線の設置も占用行為であり、河川管理者の許可が必要という記述は正しい。','排出口付近の堆積土砂の除去といった保守的措置は許可不要であるにもかかわらず、許可が必要としている点が誤り。','バケツで少量の水をくみ取る行為は河川の機能に影響しないため許可不要という記述は正しい。'] },
  { id:'q123', group:'法規', category:'河川法令', chapter:'4章', stars:4, question:'河川管理者の許可が必要な事項に関する記述として、「河川法」上、正しいものはどれか。', options:['河川区域の上空に、光ファイバケーブルを横断して新設する場合は、河川管理者の許可を受ける必要はない','河川区域内における電柱の新設について、河川管理者の許可を受けている場合は、その電柱を施行するための土地の掘削に関して、新たに許可を受ける必要はない','河川区域内の民有地に一時的な仮設工作物として現場事務所を設置する場合は、河川管理者の許可を受ける必要はない','河川区域内で河川管理者の許可を受けて設置した送電鉄塔を撤去する場合は、河川管理者の許可を受ける必要はない'], answer:1, explanation:'電柱の新設の許可は、施工に関わる個々の作業（掘削等）を含んだ包括的なものと理解すればよく、掘削にあたっての新たな許可は不要。②が正しい。工作物の新設・改築だけでなく撤去する際にも許可は必要であり④は誤り。', choiceNotes:['河川区域上空の光ファイバケーブル新設も占用行為にあたり許可が必要であるにもかかわらず、不要としている点が誤り。','電柱新設の許可は施工に伴う掘削等の作業を包括するため、掘削について改めて許可を受ける必要はないという記述は正しい。','民有地であっても河川区域内での仮設工作物の設置は許可が必要であるにもかかわらず、不要としている点が誤り。','許可を受けて設置した工作物の撤去にも許可が必要であるにもかかわらず、不要としている点が誤り。'] },
  { id:'q124', group:'法規', category:'河川法令', chapter:'4章', stars:4, question:'河川管理者の許可が必要な事項に関する記述として、「河川法」上、誤っているものはどれか。', options:['河川区域の上空に、光ファイバケーブルを横断して新設する場合は、河川管理者の許可を受ける必要がある','河川区域内に河川管理者の許可を受けて設置された監視カメラの故障した機器を交換する場合は、河川管理者の許可を受ける必要がある','河川区域内に河川管理者の許可を受けて設置された水位計を撤去する場合は、河川管理者の許可を受ける必要がある','河川区域内の民有地に一時的に仮設の資材倉庫を設置する場合は、河川管理者の許可を受ける必要がある'], answer:1, explanation:'許可を受けて設置した監視カメラや水位計等の機材が故障したときは修理に向かうことになるが、この際の部品や機器の交換については許可は不要。②が誤り。河川区域の内方であれば民有地・一時的・仮設であろうと新設の場合には全て許可が必要。', choiceNotes:['河川区域上空への光ファイバケーブルの新設は許可が必要という記述は正しい。','既設の許可設備について故障した部品や機器を交換する作業は保守行為であり、新たな許可は不要であるにもかかわらず、必要としている点が誤り。','許可を受けて設置した水位計の撤去には許可が必要という記述は正しい。','民有地であっても河川区域内であれば仮設資材倉庫の設置には許可が必要という記述は正しい。'] },
  { id:'q125', group:'施工管理', category:'労働安全衛生法令', chapter:'2章', stars:5, question:'作業主任者の選任を必要とする作業に関する記述として、「労働安全衛生法令」上、誤っているものはどれか。', options:['掘削面の高さが3mの地山の掘削（ずい道およびたて坑以外の坑の掘削を除く）の作業','土止め支保工の切りばりまたは腹起こしの取り付けまたは取り外しの作業','高さが3mの無線通信用鉄塔の組立て作業','地下に設置されたマンホール内の通信ケーブルの敷設作業'], answer:2, explanation:'鉄塔の組立て作業については高さ5m以上が該当し、5m未満の場合は対象外。したがって③が誤り。地山の掘削は高さ（深さ）2m以上で作業主任者の選任が必要。マンホール内部は酸素欠乏危険作業に該当し選任が必要。', choiceNotes:['地山の掘削は掘削面の高さ（深さ）2m以上で作業主任者の選任が必要であり、3mはこれを満たすため正しい。','土止め支保工の切りばり・腹起こしの取付け・取外し作業は作業主任者の選任が必要な作業であり正しい。','無線通信用鉄塔の組立て作業は高さ5m以上が選任の対象で、3mは基準未満のため本来は選任不要であり、対象作業として挙げている点が誤り。','地下マンホール内の通信ケーブル敷設作業は酸素欠乏危険作業に該当し、作業主任者の選任が必要という記述は正しい。'] },
  { id:'q126', group:'施工管理', category:'労働安全衛生法令', chapter:'4章', stars:4, question:'作業主任者の選任を必要とする作業として、「労働安全衛生法令」上、誤っているものはどれか。', options:['高さ3mの構造の足場の組立ての作業','掘削面の高さが2mとなる地山の掘削（ずい道およびたて坑以外の坑の掘削を除く）の作業','高さが10mの無線通信用鉄塔の組立ての作業','地下に設置されたマンホール内での通信ケーブルの敷設の作業'], answer:0, explanation:'足場の組立て作業は5m以上の現場が対象で、5m未満の場合は該当しない。①が誤り。なお、つり足場と張出し足場は高さによる条件がなく、常に作業主任者の選任が必要。その他の選択肢②〜④はいずれも作業主任者を要する作業となる。', choiceNotes:['足場の組立て作業は高さ5m以上が選任の対象で、3mは基準未満のため本来は選任不要であり、対象作業として挙げている点が誤り。','地山の掘削は掘削面の高さ（深さ）2m以上で作業主任者の選任が必要であり正しい。','無線通信用鉄塔の組立て作業は高さ5m以上が対象で、10mはこれを満たすため正しい。','地下マンホール内の通信ケーブル敷設作業は酸素欠乏危険作業に該当し、選任が必要という記述は正しい。'] },
  { id:'q127', group:'施工管理', category:'労働安全衛生法令', chapter:'4章', stars:4, question:'総括安全衛生管理者が行う統括管理の業務として、「労働安全衛生法」上、誤っているものはどれか。', options:['健康診断の実施その他、健康の保持促進のための措置に関すること','工事遅延の原因の調査、および再発防止対策に関すること','労働者の危険または、健康障害を防止するための措置に関すること','労働者の安全または、衛生のための教育の実施に関すること'], answer:1, explanation:'総括安全衛生管理者が行うべき統括管理の業務は根拠法令に示す5項目が該当し、選択肢のうち含まれないのは②。近い表現の項目として「労働災害の原因の調査及び再発防止対策に関すること」があるが、工事遅延に関するものではない。', choiceNotes:['健康診断の実施等、健康の保持促進のための措置は総括安全衛生管理者の統括管理業務の一つであり正しい。','工事遅延の原因調査や再発防止対策は根拠法令に定める統括管理業務に含まれず、労働災害の原因調査と混同した誤った記述である。','労働者の危険・健康障害を防止するための措置は統括管理業務の一つであり正しい。','労働者の安全・衛生のための教育の実施は統括管理業務の一つであり正しい。'] },
  { id:'q128', group:'施工管理', category:'労働安全衛生法令', chapter:'4章', stars:4, question:'産業医を選任しなければならない規模の事業場として、「労働安全衛生法令」上、正しいものはどれか。', options:['常時10人以上の労働者を使用する事業場','常時20人以上の労働者を使用する事業場','常時30人以上の労働者を使用する事業場','常時50人以上の労働者を使用する事業場'], answer:3, explanation:'安全管理者や衛生管理者を選任する場合と同じく、常に50人以上が所属する事業場では産業医を選任して配置しなければならない。④が正しい。産業医は医師であって、その組織に所属する従業者の健康管理等を行う。', choiceNotes:['産業医選任の基準は常時10人以上ではなく、実際は常時50人以上の事業場であるため誤り。','産業医選任の基準は常時20人以上ではなく、実際は常時50人以上の事業場であるため誤り。','産業医選任の基準は常時30人以上ではなく、実際は常時50人以上の事業場であるため誤り。','安全管理者・衛生管理者と同様、常時50人以上の労働者を使用する事業場で産業医の選任が必要であり正しい。'] },
  { id:'q129', group:'施工管理', category:'労働安全衛生法令', chapter:'4章', stars:4, question:'安全衛生推進者に関する記述として、「労働安全衛生法」上、誤っているものはどれか。', options:['安全衛生推進者を選任しなければならない事業場の規模は、常時10人以上の労働者を使用する事業場である','労働者の危険または健康障害を防止するための措置に関することは、安全衛生推進者の業務に該当する','安全衛生推進者の選任は、都道府県労働局長の登録を受けた者が行う講習を修了した者のうちから行い、その事業場に専属の者を選任する','安全衛生推進者の選任は、選任すべき事由が発生した日から7日以内に行わなければならない'], answer:3, explanation:'選任すべき状況となった場合には、14日以内に選任する必要がある。したがって④が誤り。', choiceNotes:['安全衛生推進者の選任が必要な事業場規模は常時10人以上であり正しい。','労働者の危険・健康障害を防止するための措置は安全衛生推進者の業務に該当し正しい。','登録講習修了者からその事業場に専属の者を選任するという記述は正しい。','選任すべき事由発生日から7日以内ではなく、実際は14日以内に選任する必要があるため誤り。'] },
  { id:'q130', group:'施工管理', category:'労働安全衛生法令', chapter:'4章', stars:4, question:'建設工事現場における店社安全衛生管理者の職務として、「労働安全衛生法令」上、誤っているものはどれか。', options:['少なくとも毎月1回、労働者が作業を行う場所を巡視すること','衛生委員会を設けること','協議組織の会議に随時参加すること','労働者の作業の種類その他作業の実施の状況を把握すること'], answer:1, explanation:'店社安全衛生管理者が行うべき職務は根拠法令に示した4項目であり、「衛生委員会を設けること」は含まれていない。衛生委員会の設置は事業者が行うべき事項とされている。②が誤り。', choiceNotes:['少なくとも毎月1回の作業場所の巡視は店社安全衛生管理者の職務であり正しい。','衛生委員会の設置は事業者が行うべき事項であり、店社安全衛生管理者の職務には含まれないため誤り。','協議組織の会議への随時参加は店社安全衛生管理者の職務であり正しい。','労働者の作業の種類等、作業実施状況の把握は店社安全衛生管理者の職務であり正しい。'] },
  { id:'q131', group:'施工管理', category:'労働安全衛生法令', chapter:'4章', stars:4, question:'特定元方事業者が統括安全衛生責任者に統括管理させなければならない事項に関する記述として、「労働安全衛生法」上、誤っているものはどれか。', options:['作業間の連絡および調整を行うこと','関係請負人が行う労働者の安全または衛生のための教育に対する指導、および援助を行うこと','協議組織の設置および運営を行うこと','施工体制台帳および施工体系図の作成を行うこと'], answer:3, explanation:'統括安全衛生責任者が統括管理すべき事項は6項目あり、「施工体制台帳および施工体系図の作成」は対象外。これは元請となる特定建設業者の役割である。④が誤り。', choiceNotes:['作業間の連絡・調整は統括安全衛生責任者が統括管理すべき事項の一つであり正しい。','関係請負人が行う安全衛生教育への指導・援助は統括管理すべき事項の一つであり正しい。','協議組織の設置・運営は統括管理すべき事項の一つであり正しい。','施工体制台帳・施工体系図の作成は元請となる特定建設業者自身の義務であり、統括安全衛生責任者が統括管理すべき事項には含まれないため誤り。'] },
  { id:'q132', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'「建設業法」を根拠法として、指定建設業として定められていないものを選べ。', options:['建築工事業','電気工事業','電気通信工事業','管工事業'], answer:2, explanation:'建設業許可の区分は29種あり、そのうち指定建設業として定められているのは、土木工事業・建築工事業・電気工事業・管工事業・鋼構造物工事業・舗装工事業・造園工事業の7種のみ。電気通信工事業は該当しない。', choiceNotes:['建築工事業は土木・電気・管・鋼構造物・舗装・造園とともに指定建設業7業種に含まれるため、「定められていない」の答えとしては誤り。','電気工事業は指定建設業7業種の一つであり、「定められていない」の答えとしては誤り。','電気通信工事業は指定建設業7業種（土木・建築・電気・管・鋼構造物・舗装・造園）には含まれず、定められていないため正しい。','管工事業は指定建設業7業種の一つであり、「定められていない」の答えとしては誤り。'] },
  { id:'q133', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'「建設業法」を根拠法とし、建設業の許可について、誤っているものを選べ。', options:['都道府県知事の許可を受けた建設業者は、他の都道府県において営業することができる','発注者から直接請け負う一件の請負代金の額により、建設業の許可は、一般建設業と特定建設業とに分類される','建設工事の種類に対応する建設業ごとに、建設業の許可を受けなければならない','政令で定める軽微な建設工事のみを請け負う者を除き、建設業を営もうとする者は、建設業法に基づく許可を受けなければならない'], answer:1, explanation:'建設業の許可は、下請業者に再発注する金額の規模によって一般建設業と特定建設業に分けられる。元請自らの受注金額は建設業許可には関係ない。発注者から直接請け負った際に下請に再発注する総額が5,000万円未満であれば一般建設業で構わない。②が誤り。', choiceNotes:['許可を受けた業者は他の都道府県でも営業できるという記述は正しい。知事許可は営業地域を限定するものではない。','一般建設業と特定建設業の区分は、下請へ再発注する請負代金の総額の規模によるものであり、発注者から直接請け負う代金額によるとする記述は誤り。','建設工事の種類に対応した建設業ごとに許可を受ける必要があるという記述は正しい。','軽微な工事のみを請け負う者を除き許可が必要という記述は正しい。'] },
  { id:'q134', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'建設業の許可に関する記述として、「建設業法」上、誤っているものはどれか。', options:['一般建設業の許可を受けた者が、当該許可に係る建設業について、特定建設業の許可を受けたときは、その者に対する当該建設業に係る一般建設業の許可は、その効力を失う','建設業の許可は、5年ごとにその更新を受けなければ、その期間の経過によって、その効力を失う','建設業者は、許可を受けた建設業に係る建設工事を請け負う場合においては、当該建設工事に附帯する他の建設業に係る建設工事を請け負うことができる','2以上の都道府県の区域内に営業所を設けて営業をしようとする場合は、それぞれの営業所の所在地を管轄する都道府県知事の許可を受けなければならない'], answer:3, explanation:'営業所が2つ以上の都道府県に置かれている場合には、それぞれの知事ではなく国土交通大臣の許可が必要。大臣許可を受けた場合には知事の許可は必要ない。④が誤り。', choiceNotes:['一般建設業の許可を受けた業種で特定建設業の許可を受けたときは、一般建設業の許可は効力を失うという記述は正しい。','建設業の許可は5年ごとの更新を受けなければ効力を失うという記述は正しい。','許可を受けた建設業に付帯する他業種の工事も請け負うことができるという記述は正しい。','2以上の都道府県に営業所を設ける場合はそれぞれの知事ではなく国土交通大臣の許可が必要であり、各知事の許可とする記述は誤り。'] },
  { id:'q135', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'建設業の許可に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['法人が建設業の許可を受けようとする場合、当該法人またはその役員等もしくは政令で定める使用人が、請負契約に関して不正または不誠実な行為をするおそれが明らかな者でないこと','建設業の許可は、5年ごとにその更新を受けなければ、その期間の経過によって効力を失う','特定建設業の許可を受けようとする者は、発注者との間の請負契約で、その請負代金の額が6,000万円以上であるものを履行するに足りる財産的基礎を有する必要がある','建設業を営もうとする者は、2以上の都道府県の区域内に営業所を設けて営業をしようとする場合にあっては、国土交通大臣の許可を受けなければならない'], answer:2, explanation:'特定建設業の許可では「発注者との請負契約で、その請負代金の額が政令で定める金額以上であるものを履行するに足りる財産的基礎を有すること」と規定されており、この金額は建設業法施行令で指定されていて現在は8,000万円となっている。③が誤り。', choiceNotes:['不正・不誠実な行為を行うおそれが明らかな者でないことが許可要件であるという記述は正しい。','建設業の許可は5年ごとの更新を受けなければ効力を失うという記述は正しい。','特定建設業の財産的基礎要件となる請負代金額は6,000万円ではなく、建設業法施行令で定める8,000万円以上であるため誤り。','2以上の都道府県に営業所を設ける場合は国土交通大臣の許可が必要という記述は正しい。'] },
  { id:'q136', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'建設工事の請負契約に関する記述として、「建設業法」上、誤っているものはどれか。', options:['建設工事の請負契約において請負代金の全部または一部の前金払をする定めがなされたときは、注文者は、建設業者に対して前金払をする前に、現場代理人を立てることを請求することができる','建設業者は、建設工事の注文者から請求があったときは、請負契約が成立するまでの間に、建設工事の見積書を交付しなければならない','注文者は、請負契約の履行に関し、工事現場に監督員を置く場合においては、監督員に関する事項を書面により請負人に通知しなければならない','注文者は、その注文した建設工事を施工するために通常必要と認められる期間に比して、著しく短い期間を工期とする請負契約を締結してはならない'], answer:0, explanation:'前金を受領した請負業者が債務不履行となる可能性に備えて、注文者は当該の請負業者に保証人を付けることを請求する権利がある。現場代理人ではない。①が誤り。現場代理人は、元請が代表者（社長等）の代理として現場に配置するべき人物であり、ここでの保証人とは一切関係ない。', choiceNotes:['前払金の支払前に注文者が請求できるのは現場代理人の配置ではなく保証人を立てることであり、現場代理人としている点が誤り。','注文者から請求があれば契約成立までの間に見積書を交付しなければならないという記述は正しい。','工事現場に監督員を置く場合は監督員に関する事項を書面で通知しなければならないという記述は正しい。','通常必要な期間に比べ著しく短い工期での契約締結を禁じる記述は正しい。'] },
  { id:'q137', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'建設工事の請負契約に関する記述として、「建設業法」上、誤っているものはどれか。', options:['建設業者は、その請け負った建設工事を、いかなる方法をもってするかを問わず、一括して他人に請け負わせてはならない','建設業者は、建設工事の注文者から請求があったときは、請負契約の締結後速やかに、建設工事の見積書を交付しなければならない','注文者は、自己の取引上の地位を不当に利用して、その注文した建設工事を施工するために通常必要と認められる原価に満たない金額を請負代金の額とする請負契約を締結してはならない','委託その他いかなる名義をもってするかを問わず、報酬を得て建設工事の完成を目的として締結する契約は、建設工事の請負契約とみなして、建設業法の規定が適用される'], answer:1, explanation:'見積書と契約との関係では、見積とは注文者が金額を知るための手段であり、金額が不明の状態で先行して契約を締結する行為は不自然。建設業者は請求があったときは請負契約が成立するまでの間に見積書を交付しなければならない。契約成立より見積書が先であり、②が明らかに誤り。', choiceNotes:['一括下請negotiatedの禁止（一括下請負の禁止）に関する記述は正しい。','見積書は契約締結後ではなく、請負契約が成立するまでの間に交付しなければならないため、締結後に交付するとしている点が誤り。','取引上の地位を不当に利用した低廉な請負代金設定を禁じる記述は正しい。','名義を問わず報酬を得て建設工事の完成を目的とする契約は請負契約とみなすという記述は正しい。'] },
  { id:'q138', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'建設工事現場に配置する主任技術者および監理技術者に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['発注者から直接建設工事を請け負った特定建設業者は、当該建設工事を施工するために締結した下請契約の請負代金の総額が政令で定める金額以上になる場合は監理技術者を当該工事現場に置かなければならない','注文者が国である建設工事の場合は工事1件の請負代金の額にかかわらず、注文者から直接建設工事を請け負った建設業者は、工事現場ごとに置く主任技術者または監理技術者を専任の者としなければならない','主任技術者および監理技術者は、当該建設工事の施工計画の作成、工程管理、品質管理その他の技術上の管理および当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない','工事現場における建設工事の施工に従事する者は、主任技術者または監理技術者がその職務として行う指導に従わなければならない'], answer:1, explanation:'主任技術者や監理技術者を現場に専任とする必要があるのは、国や地方公共団体の発注で請負額4,500万円以上、または民間発注で公共性があり多数の者が利用する施設で請負額4,500万円以上の場合。請負代金の額にかかわらずではなく、4,500万円以上の場合のみが該当するため②が誤り。', choiceNotes:['下請契約の請負代金総額が政令で定める金額（4,500万円等）以上になる場合に監理技術者を置くべきという記述は正しい。','専任配置が必要となるのは請負代金の額にかかわらずではなく、公共性のある工作物等で請負代金4,500万円以上の場合に限られるため誤り。','主任技術者・監理技術者が施工計画作成や技術上の指導監督を行うという記述は正しい。','施工に従事する者は主任技術者・監理技術者の指導に従わなければならないという記述は正しい。'] },
  { id:'q139', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'建設工事現場に配置する主任技術者や監理技術者に関する記述として、建設業法令上、誤っているものはどれか。', options:['発注者から直接建設工事を請け負った特定建設業者は、当該建設工事を施工するために締結した下請契約の請負代金の額にかかわらず、監理技術者を当該工事現場に配置しなければならない','1級電気通信工事施工管理技士の資格を有する者は、電気通信工事の監理技術者になることができる','主任技術者及び監理技術者は、当該建設工事の施工計画の作成、工程管理、品質管理その他の技術上の管理及び当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない','工事現場における建設工事の施工に従事する者は、主任技術者または監理技術者がその職務として行う指導に従わなければならない'], answer:0, explanation:'監理技術者の選任が必要となるのは、特定建設業者であり、かつ元請であり、かつ下請への再発注額5,000万円以上となる場合のみ。これ以外の条件では主任技術者で十分。したがって①が誤り(5,000万円以上の場合のみ)。なお2級電気通信工事施工管理技士は電気通信工事の主任技術者になれる。', choiceNotes:['監理技術者の配置が必要となるのは下請代金額にかかわらずではなく、下請への再発注総額が5,000万円以上の場合に限られるため誤り。','1級電気通信工事施工管理技士は電気通信工事の監理技術者になれるという記述は正しい。','主任技術者・監理技術者が施工計画作成や技術上の指導監督を行うという記述は正しい。','施工に従事する者は主任技術者・監理技術者の指導に従わなければならないという記述は正しい。'] },
  { id:'q140', group:'法規', category:'建設業法令', chapter:'4章', stars:4, question:'国土交通大臣が交付する監理技術者資格者証に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['申請者が2以上の監理技術者資格を有する者であるときは、これらの監理技術者資格を合わせて記載した監理技術者資格者証が交付される','監理技術者資格者証を保有する者の申請により、更新される更新後の監理技術者資格者証の有効期間は、3年である','監理技術者資格者証には、交付を受ける者の氏名、生年月日、本籍および住所が記載されている','監理技術者資格を有する者の申請により監理技術者資格者証が交付されるが、その有効期間は、5年である'], answer:1, explanation:'資格者証の有効期間は交付日から5年間。講習を受講して有効期間を延長する場合の更新後の有効期間も同じく5年間である。したがって②(3年)が誤り。', choiceNotes:['2以上の監理技術者資格を有する場合、それらを合わせて記載した資格者証が交付されるという記述は正しい。','更新後の資格者証の有効期間は3年ではなく、新規交付時と同じ5年間であるため誤り。','資格者証には氏名、生年月日、本籍、住所が記載されるという記述は正しい。','資格者証の有効期間は交付の日から5年間であるという記述は正しい。'] },
  { id:'q141', group:'法規', category:'建設業法令(元請の義務)', chapter:'4章', stars:4, question:'元請負人の義務に関する記述として、「建設業法」上、誤っているものはどれか。', options:['元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、発注者の意見をきかなければならない','元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない','元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から20日以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない','元請負人は、下請契約において引渡しに関する特約がされている場合を除き、完成を確認するための検査によって建設工事の完成を確認した後、下請負人が申し出たときは、直ちに、当該建設工事の目的物の引渡しを受けなければならない'], answer:0, explanation:'工事の一部を下請負人に再発注する場合には、事前に下請負人の意見を聞く必要がある。発注者の意見ではない。したがって①が誤り。', choiceNotes:['工程の細目等を定めようとするときは、発注者ではなく下請負人の意見を聞かなければならないため誤り。','前払金を受けた元請は下請負人に着手費用の前払を配慮すべきという記述は正しい。','工事完成通知を受けてから20日以内かつできる限り短期間で検査を完了しなければならないという記述は正しい。','検査による完成確認後、下請負人の申出があれば直ちに引渡しを受けなければならないという記述は正しい。'] },
  { id:'q142', group:'法規', category:'建設業法令(元請の義務)', chapter:'4章', stars:4, question:'元請負人の義務に関する記述として、「建設業法」上、誤っているものはどれか。', options:['元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、直ちに当該建設工事の目的物の引渡しを受けなければならない','元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他、元請負人において定めるべき事項を定めようとするときは、あらかじめ、下請負人の意見をきかなければならない','特定建設業者は、当該特定建設業者が注文者となった下請契約に係る下請代金の支払いにつき、当該下請代金の支払期日までに一般の金融機関による割引を受けることが困難であると認められる手形を交付してはならない','元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他、建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない'], answer:0, explanation:'元請が下請から工事完成の通知を受けたときは、まずは検査を実施する。検査は通知を受けた日から20日以内で、かつできる限り短い期間内に完了しなければならない。いきなり引渡しではないため①が誤り。', choiceNotes:['工事完成の通知を受けたときは直ちに引渡しを受けるのではなく、まず20日以内に検査を完了する必要があるため誤り。','工程の細目等を定めようとするときは下請負人の意見を聞かなければならないという記述は正しい。','特定建設業者は割引困難な手形の交付を禁じられているという記述は正しい。','前払金を受けた元請は下請負人に着手費用の前払を配慮すべきという記述は正しい。'] },
  { id:'q143', group:'法規', category:'建設業法令(業者の義務)', chapter:'4章', stars:4, question:'民間工事における施工体制台帳および施工体系図の作成等に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['施工体制台帳は、工事現場ごとに備え置かなければならない','施工体系図は、当該工事現場の見やすい場所に掲げなければならない','発注者から直接建設工事を請け負った一般建設業者は、当該建設工事を施行するために締結した下請契約の請負代金の総額が政令で定める金額以上になるときは、施工体制台帳および、施工体系図を作成しなければならない','施行体制台帳の備置きおよび施工体系図の掲示は、建設工事の目的物の引渡しをするまで行わなければならない'], answer:2, explanation:'施工体制台帳・施工体系図の作成義務があるのは元請であって、下請への再発注額の総額が5,000万円以上となる特定建設業者だけである。一般建設業者が該当する状況はあり得ないため③が誤り。', choiceNotes:['施工体制台帳は工事現場ごとに備え置く必要があるという記述は正しい。','施工体系図は工事現場の見やすい場所に掲げる必要があるという記述は正しい。','施工体制台帳・施工体系図の作成義務は下請再発注総額が政令額以上となる特定建設業者にのみ課され、一般建設業者が該当することはないため誤り。','備置き・掲示は工事目的物の引渡しまで行う必要があるという記述は正しい。'] },
  { id:'q144', group:'法規', category:'建設業法令(業者の義務)', chapter:'4章', stars:4, question:'建設業者が建設工事現場に掲げなければならない標識の記載事項に関する記述として、「建設業法令」上、誤っているものはどれか。', options:['一般建設業または特定建設業の別','許可年月日、許可番号および許可を受けた建設業','主任技術者または監理技術者の氏名','健康保険等の加入状況'], answer:3, explanation:'標識(許可票)の記載事項は、一般建設業または特定建設業の別、許可年月日・許可番号および許可を受けた建設業、商号または名称、代表者の氏名、主任技術者または監理技術者の氏名の5項目。健康保険等の加入状況は対象外であり④が誤り。', choiceNotes:['一般建設業または特定建設業の別は標識の記載事項であり正しい。','許可年月日・許可番号・許可を受けた建設業は標識の記載事項であり正しい。','主任技術者または監理技術者の氏名は標識の記載事項であり正しい。','健康保険等の加入状況は標識の記載事項に含まれておらず、含めている点が誤り。'] },
  { id:'q145', group:'法規', category:'労働基準法(労働条件)', chapter:'4章', stars:4, question:'労働契約の締結に際し、使用者が労働者に対して必ず書面の交付により明示しなければならない労働条件に関する記述として、「労働基準法令」上、誤っているものはどれか。', options:['労働契約の期間に関する事項','職業訓練に関する事項','始業および終業の時刻に関する事項','退職に関する事項'], answer:1, explanation:'契約期間や稼働時間、退職等は特に重要な説明事項で書面交付での明示が義務付けられている。職業訓練に関する事項は明示すべき労働条件に含まれるが、書面を交付する義務まではない。したがって②が対象外。', choiceNotes:['労働契約の期間に関する事項は書面交付による明示が義務付けられており正しい。','職業訓練に関する事項は明示すべき労働条件ではあるが、書面交付が義務付けられた事項には含まれないため誤り。','始業・終業の時刻に関する事項は書面交付による明示が義務付けられており正しい。','退職に関する事項は書面交付による明示が義務付けられており正しい。'] },
  { id:'q146', group:'法規', category:'労働基準法(労働条件)', chapter:'4章', stars:4, question:'労働契約の締結に際し、使用者が労働者に対して書面(労働者の希望によりFAXまたは電子メール等により送信する場合を含む)の交付により明示しなければならない労働条件に関する記述として、「労働基準法令」上、誤っているものはどれか。', options:['労働契約の期間に関する事項','従事すべき業務に関する事項','福利厚生に関する事項','所定労働時間を超える労働の有無に関する事項'], answer:2, explanation:'契約期間や従事すべき業務の内容、所定労働時間の超過等は特に重要な事項。福利厚生については法的にも明示すべき項目に含まれていない。したがって③が誤り(対象外)。', choiceNotes:['労働契約の期間に関する事項は書面交付による明示が義務付けられており正しい。','従事すべき業務に関する事項は書面交付による明示が義務付けられており正しい。','福利厚生に関する事項は法定の書面交付が義務付けられた明示事項には含まれないため誤り。','所定労働時間を超える労働の有無に関する事項は書面交付による明示が義務付けられており正しい。'] },
  { id:'q147', group:'法規', category:'労働基準法(年少者等)', chapter:'4章', stars:4, question:'年少者の就業に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、満18歳に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない','親権者または後見人は、未成年者に代って労働契約を締結しなければならない','使用者は、交替制によって使用する満16歳以上の男性を除き、満18歳に満たない者を午後10時から午前5時までの間において使用してはならない','使用者は、児童が満15歳に達した日以後の最初の3月31日が終了するまで、これを使用してはならない'], answer:1, explanation:'労働契約は当事者の意思のみによって成されるべきで、未成年者の代理として親権者や後見人が労働契約を締結することはできません(禁止事項)。したがって②が誤り。', choiceNotes:['満18歳未満の者について年齢証明書を事業場に備え付けるという記述は正しい。','未成年者の労働契約は本人自身が締結すべきものであり、親権者や後見人が代わって締結することは労働基準法で禁止されているため誤り。','交替制で使用する満16歳以上の男性を除き、18歳未満の深夜労働を禁じる記述は正しい。','児童は満15歳に達した日以後の最初の3月31日まで使用してはならないという記述は正しい。'] },
  { id:'q148', group:'法規', category:'労働基準法(年少者等)', chapter:'4章', stars:4, question:'年少者および女性の使用に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、児童が満15歳に達した日以後の最初の3月31日が終了するまで、これを使用してはならない','使用者は、満18歳に満たない者を午後10時から午前5時までの間において使用してはならない。ただし、交替制によって使用する満16歳以上の男性については、この限りでない','使用者は、満20歳に満たない者を坑内で労働させてはならない','使用者は、妊娠中の女性および産後1年を経過しない女性を、重量物を取り扱う業務に就かせてはならない'], answer:2, explanation:'坑内での労働をさせられないのは満18歳未満の者であり、20歳未満ではないため③が誤り。', choiceNotes:['児童は満15歳に達した日以後の最初の3月31日まで使用してはならないという記述は正しい。','交替制で使用する満16歳以上の男性を除き、18歳未満の深夜労働を禁じる記述は正しい。','坑内労働が禁止されるのは満20歳未満ではなく満18歳未満の者であるため誤り。','妊娠中・産後1年以内の女性を重量物取扱業務に就かせてはならないという記述は正しい。'] },
  { id:'q149', group:'法規', category:'労働基準法(労働時間等)', chapter:'4章', stars:4, question:'労働時間、休憩、休日等に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、労働時間が8時間を超える場合においては、少くとも1時間の休憩時間を労働時間の途中に与えなければならない','使用者は、原則として、労働者に休憩時間を除き、1週間について40時間を超えて労働させてはならない','使用者は、原則として1週間の各日については、労働者に休憩時間を除き、1日について8時間を超えて労働させてはならない','使用者は、その雇入れの日から起算して、8か月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、または分割した10労働日の有給休暇を与えなければならない'], answer:3, explanation:'有給休暇を付与する条件は「雇入れの日から起算して6か月間継続勤務」かつ「全労働日のうちの8割以上に出勤」。8か月間ではなく6か月間のため④が誤り。', choiceNotes:['1日の労働時間が8時間を超える場合は少なくとも1時間の休憩を要するという記述は正しい。','週40時間を超えて労働させてはならないという記述は正しい。','1日8時間を超えて労働させてはならないという記述は正しい。','年次有給休暇の付与条件は雇入れから8か月間ではなく6か月間継続勤務であるため誤り。'] },
  { id:'q150', group:'法規', category:'労働基準法(労働時間等)', chapter:'4章', stars:4, question:'使用者に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['使用者は、労働者名簿、賃金台帳および雇入、解雇、災害補償、賃金その他、労働関係に関する重要な書類を5年間保存しなければならない','使用者は、労働時間が6時間を超える場合においては少くとも45分、8時間を超える場合においては少くとも1時間の休憩時間を、労働時間の途中に与えなければならない','使用者は、その雇入れの日から起算して6か月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、または分割した10労働日の有給休暇を与えなければならない','使用者は、労働者を解雇しようとする場合においては、少くとも30日前にその予告をしなければならない'], answer:0, explanation:'労働関係の重要な書類は労働基準法第109条では5年間保存と謳われているが、同法第143条にて「当分の間は3年間でよい」と臨時の規定がなされている。現行法での保存義務は3年間が正解のため①が誤り。', choiceNotes:['重要書類の保存期間は労基法上5年とされるが、附則の経過措置により当分の間は3年間でよいとされており、5年間としている点が誤り。','労働時間6時間超で45分、8時間超で1時間の休憩を要するという記述は正しい。','6か月継続勤務・8割以上出勤で10労働日の有給休暇を付与するという記述は正しい。','解雇の際は少なくとも30日前に予告しなければならないという記述は正しい。'] },
  { id:'q151', group:'法規', category:'労働基準法(賃金等)', chapter:'4章', stars:4, question:'労働者に支払う賃金に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['出来高払制その他の請負制で使用する労働者については、使用者は、労働時間に応じ一定額の賃金の保障をしなければならない','使用者は、労働者が女性であることを理由として、賃金について、男性と差別的取り扱いをしてはならない','使用者は、労働者が出産、疾病、災害その他厚生労働省令で定める非常の場合の費用に充てるために請求する場合においては、支払期日前であっても、既往の労働に対する賃金を支払わなければならない','使用者は、前借金その他労働することを条件とする前貸の債権と賃金を相殺することができる'], answer:3, explanation:'従業員へ支払う賃金の中から、雇用主が借金の返済分として一方的に差し引くことは禁止されている(前借金相殺の禁止)。したがって④が誤り。', choiceNotes:['出来高払制等の労働者にも労働時間に応じた一定額の賃金保障が必要という記述は正しい。','女性であることを理由とした賃金差別を禁じる記述は正しい。','非常時の費用に充てるための請求があれば支払期日前でも既往の賃金を支払う必要があるという記述は正しい。','前借金その他労働を条件とする前貸債権と賃金の相殺は労働基準法で禁止されており、できるとしている点が誤り。'] },
  { id:'q152', group:'法規', category:'労働基準法(賃金等)', chapter:'4章', stars:4, question:'災害補償に関する記述として、「労働基準法」上、誤っているものはどれか。', options:['労働者が業務上負傷し、または疾病にかかった場合においては、使用者は、その費用で必要な療養を行い、または必要な療養の費用を負担しなければならない','労働者が業務上負傷し、または疾病にかかり、治った場合において、その身体に障害が存するときは、使用者は、その障害の程度に応じて障害補償を行わなければならない','補償を受ける権利は、労働者の退職によって失われる','労働者が重大な過失によって業務上負傷し、または疾病にかかり、かつ使用者がその過失について行政官庁の認定を受けた場合においては、休業補償または障害補償を行わなくてもよい'], answer:2, explanation:'従業員が補償を受ける権利は、その従業員の退職によって消滅はしない(労働基準法第83条)。したがって③が誤り。', choiceNotes:['業務上の負傷・疾病に対し使用者が療養費用を負担すべきという記述は正しい。','治癒後に障害が残る場合は障害の程度に応じた障害補償を行うべきという記述は正しい。','災害補償を受ける権利は労働者の退職によって消滅しないと定められており、失われるとしている点が誤り。','重大な過失について行政官庁の認定を受けた場合は休業・障害補償を要しないという記述は正しい。'] },
  { id:'q153', group:'法規', category:'道路法令(占用)', chapter:'4章', stars:4, question:'道路占用許可申請書の記載事項として、「道路法令」上、誤っているものはどれか。', options:['道路の占用の期間','道路の復旧方法','工事の費用','道路の占用の場所'], answer:2, explanation:'道路占用許可申請書に記載すべき事項は、目的・期間・場所・工作物、物件または施設の構造・工事実施の方法・工事の時期・道路の復旧方法の7項目。「工事の費用」は非該当のため③が誤り。', choiceNotes:['道路の占用期間は道路占用許可申請書の記載事項であり正しい。','道路の復旧方法は道路占用許可申請書の記載事項であり正しい。','工事の費用は道路占用許可申請書の記載事項に含まれておらず、含めている点が誤り。','道路の占用場所は道路占用許可申請書の記載事項であり正しい。'] },
  { id:'q154', group:'法規', category:'道路法令(占用)', chapter:'4章', stars:4, question:'道路占用工事における工事実施方法に関する記述として、「道路法令」上、誤っているものはどれか。', options:['道路の一方の側は、常に通行することができるようにする','工事現場においては、柵または覆いの設置、夜間における赤色灯または黄色灯の点灯、その他道路の交通の危険防止のために必要な措置を講ずる','路面の排水を妨げない措置を講ずる','道路を掘削する場合は、溝掘、えぐり掘または推進工法、その他これに準ずる方法により掘削する'], answer:3, explanation:'道路の掘削は溝掘、つぼ掘、推進工法等による方法でなければならず、「えぐり掘」は禁止されている(埋め戻しの際の締固めが十分に行えず沈下の原因となるため)。したがって④が誤り。', choiceNotes:['道路の一方の側は常に通行可能とすべきという記述は正しい。','柵・覆いの設置や夜間の赤色灯・黄色灯の点灯等、危険防止措置を講ずるべきという記述は正しい。','路面排水を妨げない措置を講ずるべきという記述は正しい。','道路の掘削方法として認められるのは溝掘・つぼ掘・推進工法等であり、「えぐり掘」は埋戻し締固め不良の原因となるため認められておらず誤り。'] },
  { id:'q155', group:'法規', category:'道路法令(車両制限)', chapter:'4章', stars:4, question:'車両の制限に関する記述として、「道路法令」上、誤っているものはどれか。', options:['車両制限令で定める車両とは、自動車、原動機付自転車、軽車両、トロリーバスをいい、他の車両をけん引している場合はそのけん引されている車両は含まない','車両制限令には、道路の構造を保全しまたは交通の危険を防止するために、車両の幅、重量、高さ、長さおよび最小回転半径の最高限度が定められている','道路管理者は、車両の構造または車両に積載する貨物が特殊であるためやむを得ないと認めるときは、当該車両を通行させようとする者の申請に基づいて、必要な条件を付して通行を許可することができる','限度超過車両(特殊車両)を通行させようとする場合、通行する国道および都道府県道の道路管理者が2以上となる場合、1の道路管理者に通行許可の申請を行う'], answer:0, explanation:'他の車両にけん引されている車も法令上の車両に含まれる(車両制限令第2条)。したがって①が誤り(被けん引車も含む)。', choiceNotes:['車両制限令上の車両には他の車両にけん引されている車両（被けん引車）も含まれ、含まないとしている点が誤り。','車両制限令に幅・重量・高さ・長さ・最小回転半径の最高限度が定められているという記述は正しい。','構造や積載貨物が特殊でやむを得ない場合、道路管理者が条件を付して通行を許可できるという記述は正しい。','道路管理者が2以上となる場合は1の道路管理者に申請すればよいという記述は正しい。'] },
  { id:'q156', group:'法規', category:'道路法令(車両制限)', chapter:'4章', stars:4, question:'車両の制限に関する記述として、「道路法令」上、誤っているものはどれか。', options:['車両制限令には、道路の構造を保全しまたは交通の危険を防止するために、車両の幅、重量、高さ、長さおよび最小回転半径の最高限度が定められている','限度超過車両(特殊車両)を通行させようとする者は、通行する国道および都道府県道の道路管理者が2以上となる場合、それぞれの道路管理者に通行許可の申請を行わなければならない','道路管理者は、車両の構造または車両に積載する貨物が特殊であるためやむを得ないと認めるときは、当該車両を通行させようとする者の申請に基づいて、必要な条件を付して通行を許可することができる','限度超過車両(特殊車両)の通行の許可証の交付を受けた者は、当該許可に係る通行中は当該許可証を当該車両に備え付けていなければならない'], answer:1, explanation:'通行する国道および都道府県道の道路管理者が2つ以上となる場合は、それぞれの道路管理者に申請するのではなく、代表として1つの道路管理者に申請をすればよい。したがって②が誤り。', choiceNotes:['車両制限令に幅・重量・高さ・長さ・最小回転半径の最高限度が定められているという記述は正しい。','道路管理者が2以上となる場合はそれぞれではなく、代表となる1の道路管理者に申請すればよいため、それぞれに申請するとしている点が誤り。','構造や積載貨物が特殊でやむを得ない場合、道路管理者が条件を付して通行を許可できるという記述は正しい。','通行許可証の交付を受けた者は通行中に許可証を車両に備え付けておく必要があるという記述は正しい。'] },
  { id:'q157', group:'法規', category:'電気通信事業法(定義)', chapter:'4章', stars:4, question:'「電気通信事業法」で規定されている用語に関する記述として、正しいものはどれか。', options:['電気通信とは、有線、無線その他の電磁的方式により、符号、音響または影像を送り、伝え、または情報を処理することをいう','電気通信設備とは、電気通信を行うための機械、器具、線路その他の電気的設備をいう','電気通信事業とは、電気通信回線設備を他人の需要に応ずるために提供する事業をいう','電気通信業務とは、電気通信事業者の行う電気通信設備の維持および運用の提供の業務をいう'], answer:1, explanation:'電気通信事業法第2条(定義)による。電気通信は「符号、音響又は影像を送り、伝え、又は受けること」、電気通信事業は「電気通信役務を他人の需要に応ずるために提供する事業」、電気通信業務は「電気通信事業者の行う電気通信役務の提供の業務」。②のみが正しい表現。', choiceNotes:['電気通信事業法上の「電気通信」の定義は符号・音響・影像を送り、伝え、または受けることであり、「情報を処理すること」は含まれないため誤り。','電気通信設備を電気通信を行うための機械、器具、線路その他の電気的設備とする定義は正しい。','「電気通信事業」は電気通信回線設備ではなく電気通信役務を他人の需要に応ずるために提供する事業と定義されており、回線設備としている点が誤り。','「電気通信業務」は設備の維持及び運用の提供ではなく、電気通信役務の提供の業務と定義されているため誤り。'] },
  { id:'q158', group:'法規', category:'電気通信事業法(定義)', chapter:'4章', stars:4, question:'「電気通信事業法」に関する記述として、誤っているものはどれか。', options:['電気通信事業を営もうとする者は、都道府県知事の登録を受けなければならない','電気通信事業者の取り扱い中に係る通信の秘密は、侵してはならない','電気通信事業者の取り扱い中に係る通信は、検閲してはならない','電気通信事業者は、電気通信役務の提供について、不当な差別的取り扱いをしてはならない'], answer:0, explanation:'電気通信事業に参入する際には、総務大臣に対して申請を行い、登録を受ける必要がある(小規模の場合は届出のみ)。都道府県知事ではないため①が誤り。', choiceNotes:['電気通信事業を営もうとする者は都道府県知事ではなく総務大臣の登録（小規模は届出）を受ける必要があるため誤り。','取扱い中の通信の秘密を侵してはならないという記述は正しい。','取扱い中の通信を検閲してはならないという記述は正しい。','電気通信役務の提供について不当な差別的取扱いを禁じる記述は正しい。'] },
  { id:'q159', group:'法規', category:'電気通信事業法(関連規則)', chapter:'4章', stars:4, question:'「事業用電気通信設備規則」に関する記述として、誤っているものはどれか。', options:['専用役務とは、専ら符号または影像を伝送交換するための電気通信設備を他人の通信の用に供する電気通信役務をいう','音声伝送役務とは、おおむね4kHz帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であってデータ伝送役務以外のものをいう','直流回路とは、電気通信回線設備に接続して電気通信事業者の交換設備の動作の開始および終了の制御を行うための回路をいう','絶対レベルとは、1の皮相電力の1mWに対する比をデシベルで表したものをいう'], answer:0, explanation:'専用役務の定義は「特定の者に電気通信設備を専用させる電気通信役務」である。①の内容は「データ伝送役務」の説明になるため①が誤り。その他の3つの文章は正しい。', choiceNotes:['「専ら符号・影像を伝送交換する設備を他人の通信の用に供する役務」という説明は専用役務ではなくデータ伝送役務の定義であるため誤り。','音声伝送役務の定義（約4kHz帯域の音声等を伝送交換しデータ伝送役務以外のもの）は正しい。','直流回路の定義（交換設備の動作開始・終了の制御を行う回路）は正しい。','絶対レベルの定義（1mWに対する皮相電力比をデシベルで表したもの）は正しい。'] },
  { id:'q160', group:'法規', category:'電気通信事業法(関連規則)', chapter:'4章', stars:4, question:'「電気通信事業法」に基づく「端末設備等規則」に規定されている用語に関する記述として、正しいものはどれか。', options:['「呼設定用メッセージ」とは、切断メッセージ、解放メッセージまたは解放完了メッセージをいう','「発信」とは、電気通信回線からの呼出しに応ずるための動作をいう','「選択信号」とは、主として相手の端末設備を指定するために使用する信号をいう','「アナログ電話用設備」とは、電話用設備であって、端末設備または自営電気通信設備との接続において電波を使用するものをいう'], answer:2, explanation:'①は「呼切断用メッセージ」の説明(呼設定用メッセージは呼設定メッセージまたは応答メッセージ)。②は「応答」の説明(発信は通信を行う相手を呼び出すための動作)。④は「移動電話用設備」の説明。「選択信号」の説明は法令と一致しており③が正しい。', choiceNotes:['誤り。切断・解放・解放完了メッセージは「呼切断用メッセージ」の説明であり、呼設定用メッセージは呼設定メッセージまたは応答メッセージを指す。','誤り。これは「応答」の説明であり、発信は通信を行う相手を呼び出すための動作を指す。','正しい。選択信号は相手の端末設備を指定するために使用する信号であり、規則の定義と一致する。','誤り。これは「移動電話用設備」の説明であり、アナログ電話用設備は電波を使用しないアナログ電話用の設備を指す。'] },
  { id:'q161', group:'法規', category:'有線電気通信法令(技術基準)', chapter:'4章', stars:4, question:'「有線電気通信法令」に基づく、有線電気通信設備の技術基準に関する記述として、誤っているものはどれか。', options:['架空電線の高さは、横断歩道橋の上にあるときを除き道路上にあるときは、路面から5m以上でなければならない','架空電線の支持物には、取扱者が昇降に使用する足場金具等を、地表上2m未満の高さに取り付けてはならない','架空電線は、他人の設置した架空電線との離隔距離が30cm以下となるように設置してはならない','屋内電線と大地との間および屋内電線相互間の絶縁抵抗は、直流100Vの電圧で測定した値で、1MΩ以上でなければならない'], answer:1, explanation:'架空電線の支持物の足場金具等は、最下段の足場金具の最低高が定められており、地表上1.8m以上にしなければならない。すなわち1.8m未満の高さに取り付けてはならない。2m未満ではないため②が誤り。', choiceNotes:['正しい記述。横断歩道橋上を除き、道路上の架空電線は路面から5m以上の高さが必要。','誤り。足場金具等の取付け禁止高さは地表上1.8m未満であり、2m未満ではない。','正しい記述。他人の設置した架空電線との離隔距離は30cmを超えるよう設置しなければならない。','正しい記述。屋内電線の絶縁抵抗は直流100Vで測定し1MΩ以上必要。'] },
  { id:'q162', group:'法規', category:'有線電気通信法令(技術基準)', chapter:'4章', stars:4, question:'「有線電気通信法」に基づく、「有線電気通信設備令」に関する記述として、誤っているものはどれか。', options:['通信回線(導体が光ファイバであるものを除く)の平衡度は1,000Hzの交流において34dB以上でなければならない','通信回線の線路の電圧は100V以下でなければならない','有線電気通信設備に使用する電線は、絶縁電線でなければならない','架空電線の支持物には取扱者が昇降に使用する足場金具等を地表上1.8m未満の高さに取り付けてはならない'], answer:2, explanation:'有線電気通信設備に使用する電線は、絶縁電線あるいはケーブルを用いる必要がある(有線電気通信設備令第2条の2)。絶縁電線に限定したものではないため③が誤り。', choiceNotes:['正しい。導体が光ファイバでない通信回線の平衡度は1,000Hzにおいて34dB以上必要。','正しい。通信回線の線路電圧は100V以下と定められている。','誤り。有線電気通信設備に使用する電線は絶縁電線またはケーブルであればよく、絶縁電線に限定されない。','正しい。架空電線の支持物の足場金具等は地表上1.8m未満の高さに取り付けてはならない。'] },
  { id:'q163', group:'法規', category:'有線電気通信法令(通信回線)', chapter:'4章', stars:4, question:'「有線電気通信設備令」に関する記述として、誤っているものはどれか。', options:['通信回線(導体が光ファイバであるものを除く)の電力は、絶対レベルで表した値で、その周波数が音声周波であるときは、プラス10dB以下、高周波であるときは、プラス20dB以下でなければならない','屋内電線(光ファイバを除く)と大地との間および屋内電線相互間の絶縁抵抗は、直流100Vの電圧で測定した値で、1MΩ以上でなければならない','通信回線(導体が光ファイバであるものを除く)の平衡度は、1,000Hzの交流において34dB以上でなければならない','通信回線(導体が光ファイバであるものを除く)の線路の電圧は、150V以下でなければならない'], answer:3, explanation:'通信回線の線路の電圧は100V以下と定められている(有線電気通信設備令第4条)。150V以下ではないため④が誤り。', choiceNotes:['正しい。通信回線の電力は音声周波でプラス10dB以下、高周波でプラス20dB以下と規定されている。','正しい。屋内電線の絶縁抵抗は直流100Vで測定し1MΩ以上必要。','正しい。通信回線の平衡度は1,000Hzの交流で34dB以上必要。','誤り。通信回線の線路電圧は150V以下ではなく100V以下でなければならない。'] },
  { id:'q164', group:'法規', category:'有線電気通信法令(通信回線)', chapter:'4章', stars:4, question:'「有線電気通信設備令」に関する記述として、誤っているものはどれか。', options:['通信回線(導体が光ファイバであるものを除く)の線路の電圧は、100V以下でなければならない','通信回線(導体が光ファイバであるものを除く)の平衡度は、1,000Hzの交流において10dB以上でなければならない','通信回線(導体が光ファイバであるものを除く)の電力は、絶対レベルで表した値で、その周波数が音声周波であるときは、プラス10dB以下、高周波であるときは、プラス20dB以下でなければならない','屋内電線(光ファイバを除く)と大地との間および屋内電線相互間の絶縁抵抗は、直流100Vの電圧で測定した値で、1MΩ以上でなければならない'], answer:1, explanation:'通信回線の平衡度は、1,000Hzの交流において34dB以上でなければならない(有線電気通信設備令第3条)。10dB以上ではないため②が誤り。', choiceNotes:['正しい。通信回線の線路電圧は100V以下でなければならない。','誤り。平衡度は1,000Hzの交流において34dB以上必要であり、10dB以上ではない。','正しい。通信回線の電力は音声周波でプラス10dB以下、高周波でプラス20dB以下と規定されている。','正しい。屋内電線の絶縁抵抗は直流100Vで測定し1MΩ以上必要。'] },
  { id:'q165', group:'法規', category:'電波法令(無線設備)', chapter:'4章', stars:4, question:'受信設備の条件に関する次の記述の□に当てはまる語句の組み合わせとして、「電波法」上、正しいものはどれか。「受信設備は、その副次的に発する(ア)または(イ)が、総務省令で定める限度をこえて、他の無線設備の機能に支障を与えるものであってはならない。」', options:['(ア)電波 (イ)高周波電流','(ア)電波 (イ)渦電流','(ア)熱 (イ)高周波電流','(ア)熱 (イ)渦電流'], answer:0, explanation:'電波法第29条(受信設備の条件)により、受信設備は、その副次的に発する電波又は高周波電流が、総務省令で定める限度をこえて他の無線設備の機能に支障を与えるものであってはならない。①が正しい組み合わせ。', choiceNotes:['正しい。電波法第29条の条文どおり「電波または高周波電流」が該当する。','誤り。イに入るのは「渦電流」ではなく「高周波電流」である。','誤り。アに入るのは「熱」ではなく「電波」である。','誤り。アもイも誤り。正しくは「電波」と「高周波電流」である。'] },
  { id:'q166', group:'法規', category:'電波法令(無線設備)', chapter:'4章', stars:4, question:'無線設備の送信装置における周波数の安定のための条件について、「電波法令」上、誤っているものはどれか。', options:['周波数をその許容偏差内に維持するため、送信装置は、できる限り電源電圧または負荷の変化によって、発振周波数に影響を与えないものでなければならない','移動局の送信装置は、実際上起り得る気圧の変化によっても、周波数をその許容偏差内に維持するものでなければならない','周波数をその許容偏差内に維持するため、発振回路の方式は、できる限り外囲の温度もしくは湿度の変化によって、影響を受けないものでなければならない','水晶発振回路に使用する水晶発振子は、発振周波数が当該送信装置の水晶発振回路により、またはこれと同一の条件の回路により、あらかじめ試験を行って決定されているものであることこと'], answer:1, explanation:'移動局の送信装置は、実際上起り得る振動又は衝撃によっても周波数をその許容偏差内に維持するものでなければならない(無線設備規則第15条)。気圧の変化は関係ないため②が誤り。', choiceNotes:['正しい。周波数の安定のため送信装置は電源電圧や負荷変化の影響を受けないものとされる。','誤り。移動局の送信装置に求められるのは気圧変化ではなく、振動または衝撃を受けても周波数の許容偏差を維持できることである。','正しい。発振回路の方式は外囲の温度・湿度変化の影響を受けにくいものでなければならない。','正しい。水晶発振子は当該送信装置の回路またはこれと同一条件の回路であらかじめ試験して決定されたものを使用する。'] },
  { id:'q167', group:'法規', category:'電波法令(無線局)', chapter:'4章', stars:4, question:'無線局の免許の欠格事由に関する次の記述の□に当てはまる語句の組み合わせとして、「電波法」上、正しいものはどれか。「電波法に規定する罪を犯し(ア)以上の刑に処せられ、その(イ)を終わり、またはその(イ)を受けることがなくなった日から(ウ)年を経過しない者には、無線局の免許を与えないことができる。」', options:['(ア)罰金 (イ)執行 (ウ)2','(ア)罰金 (イ)処分 (ウ)3','(ア)過料 (イ)執行 (ウ)3','(ア)過料 (イ)処分 (ウ)2'], answer:0, explanation:'電波法第5条(欠格事由)により、罰金以上の刑に処せられたときは、その執行を終わるか、あるいはその執行を受けることがなくなった日から2年を経過しないと新たな免許を受けることができない。①が正しい。', choiceNotes:['正しい。電波法第5条のとおり「罰金以上の刑」「執行」「2年」の組み合わせが正しい。','誤り。「処分」ではなく「執行」、「3年」ではなく「2年」が正しい。','誤り。「過料」ではなく「罰金」、「3年」ではなく「2年」が正しい。','誤り。「過料」ではなく「罰金」、「処分」ではなく「執行」が正しい。'] },
  { id:'q168', group:'法規', category:'電波法令(無線局)', chapter:'4章', stars:4, question:'無線局の種別および定義に関する記述として、「電波法令」上、正しいものはどれか。', options:['無線標定陸上局とは、無線測位業務を行う無線局をいう','無線呼出局とは、携帯局と通信を行うため陸上に開設する移動しない無線局をいう','地球局とは、固定業務を行う無線局をいう','陸上移動局とは、陸上を移動中またはその特定しない地点に停止中運用する無線局(船上通信局を除く)をいう'], answer:3, explanation:'無線標定陸上局は「無線標定業務を行う移動しない無線局」(無線測位業務を行うのは無線測位局)。無線呼出局は「無線呼出業務を行う陸上に開設する無線局」(②の記述は携帯基地局)。地球局は宇宙局と通信を行う等のため地表または地球の大気圏の主要部分に開設する無線局(固定業務を行うのは固定局)。④の記載が正しい。', choiceNotes:['誤り。無線標定陸上局が行うのは無線測位業務ではなく無線標定業務である。','誤り。この説明は「携帯基地局」に該当し、無線呼出局は無線呼出業務を行う陸上に開設する無線局である。','誤り。地球局は固定業務ではなく、宇宙局等と通信を行うために地表等に開設する無線局である。','正しい。陸上移動局は陸上を移動中または特定しない地点で停止中に運用する無線局(船上通信局を除く)である。'] },
  { id:'q169', group:'法規', category:'消防法(消防用設備等)', chapter:'4章', stars:4, question:'消防用設備等に関する記述として、「消防法令」上、誤っているものはどれか。', options:['消火設備、警報設備および避難設備は、消防の用に供する設備に該当する','無線通信補助設備は、消火活動上必要な施設に該当する','自動火災報知設備には、非常電源を附置しなければならない','漏電火災警報器は、甲種消防設備士が設置工事にあたり、乙種消防設備士が整備にあたる'], answer:3, explanation:'漏電火災警報器を扱う第7類には甲種が存在しない。例外的に電気工事士が設置工事にあたり、整備は乙種消防設備士が行う。したがって④が誤り(工事は電気工事士が行う)。', choiceNotes:['正しい。消火設備、警報設備、避難設備は「消防の用に供する設備」に該当する。','正しい。無線通信補助設備は「消火活動上必要な施設」に区分される。','正しい。自動火災報知設備には非常電源の附置が義務付けられている。','誤り。漏電火災警報器(第7類)には甲種消防設備士の資格区分がなく、設置工事は電気工事士が行い、整備を乙種消防設備士が行う。'] },
  { id:'q170', group:'法規', category:'建築基準法(用語の定義)', chapter:'4章', stars:4, question:'「建築基準法」を根拠法とし、以下の用途に供する建築物の中で特殊建築物として、定められていないものを選べ。', options:['劇場','学校','事務所','危険物の貯蔵場'], answer:2, explanation:'建築基準法第2条の第2号にて特殊建築物の定義がなされており、学校、劇場、危険物の貯蔵場等24種が特殊建築物である。一戸建住宅と事務所、商店等は除かれるため、該当しない建築物は③事務所。', choiceNotes:['特殊建築物に該当する。劇場は建築基準法上の特殊建築物として定められている。','特殊建築物に該当する。学校は建築基準法上の特殊建築物として定められている。','正しい。事務所は特殊建築物の定義に含まれておらず、該当しない建築物である。','特殊建築物に該当する。危険物の貯蔵場は建築基準法上の特殊建築物として定められている。'] },
  { id:'q171', group:'法規', category:'建築基準法(用語の定義)', chapter:'4章', stars:4, question:'「建築基準法」に規定されている用語に関する記述として、誤っているものはどれか。', options:['居室とは、居住、執務、作業、集会、娯楽その他、これらに類する目的のために、継続的に使用する室をいう','建築設備とは、土地に定着する工作物のうち、屋根および柱、もしくは壁を有するもの(これに類する構造のものを含む)をいう','建築とは、建築物を新築し、増築し、改築し、または移転することをいう','建築主とは、建築物に関する工事の請負契約の注文者、または請負契約によらないで自らその工事をする者をいう'], answer:1, explanation:'建築設備の定義は「建築物に設ける電気、ガス、給水、排水、換気、暖房、冷房、消火、排煙、もしくは汚物処理の設備、または煙突、昇降機もしくは避雷針」である。②で示されている内容は「建築物」の説明のため②が誤り。', choiceNotes:['正しい。居室は居住・執務・作業・集会・娯楽等の目的で継続的に使用する室と定義される。','誤り。この記述は「建築物」の定義であり、建築設備は電気・ガス・給排水・換気等の設備や煙突・昇降機・避雷針を指す。','正しい。建築とは建築物の新築・増築・改築・移転を指す。','正しい。建築主は工事請負契約の注文者、または請負契約によらず自ら工事をする者を指す。'] },
  { id:'q172', group:'法規', category:'廃棄物処理法', chapter:'4章', stars:4, question:'建設現場で発生する廃棄物の種類に関する記述として、廃棄物の処理及び清掃に関する法令上、正しいものはどれか。', options:['工作物の除去に伴って生じた紙くずは、一般廃棄物である','工作物の除去に伴って生じた木くずは、一般廃棄物である','工作物の除去に伴って生じた繊維くずは、産業廃棄物である','工作物の除去に伴って生じたコンクリート破片は、特別管理一般廃棄物である'], answer:2, explanation:'産業廃棄物は事業活動に伴って生じた廃棄物のうち紙くず、木くず、繊維くず、コンクリートの破片等14項目が該当する。建設工事に関わる紙くずや木くずは産業廃棄物であり、コンクリート破片も特別管理一般廃棄物ではなく産業廃棄物。したがって③のみが正しい。', choiceNotes:['誤り。工作物の除去に伴って生じた紙くずは事業活動に伴う廃棄物として産業廃棄物に分類される。','誤り。工作物の除去に伴って生じた木くずも同様に産業廃棄物に分類される。','正しい。工作物の除去に伴って生じた繊維くずは産業廃棄物に該当する。','誤り。コンクリート破片は特別管理一般廃棄物ではなく産業廃棄物に分類される。'] },
  { id:'q173', group:'法規', category:'廃棄物処理法', chapter:'4章', stars:4, question:'廃棄物に関する記述について、「廃棄物の処理および清掃に関する法令」上、誤っているものはどれか。', options:['ごみ、粗大ごみ、燃え殻、汚泥、ふん尿、廃油、廃酸、廃アルカリ、動物の死体その他の汚物または不要物であって、固形状または液状のものは、廃棄物である','建設業に係るもので、工作物の新築、改築または除去に伴って生じた金属くずは、一般廃棄物である','産業廃棄物を生ずる事業者は、産業廃棄物の運搬または処分を他人に委託する場合には、当該委託に係る産業廃棄物の引渡しと同時に、当該産業廃棄物の運搬を受託した者に対し、産業廃棄物管理票を交付しなければならない','事業者は、産業廃棄物が運搬されるまでの間、環境省令で定める技術上の基準に従い、生活環境の保全上支障のないように、産業廃棄物を保管しなければならない'], answer:1, explanation:'建設業に係る工作物の新築、改築または除去に伴って生じた金属くずは産業廃棄物であり、一般廃棄物ではない。したがって②が誤り。', choiceNotes:['正しい。ごみ、汚泥、廃油等の固形状・液状の不要物は廃棄物として定義される。','誤り。建設業に係る工作物の新築・改築・除去に伴って生じた金属くずは一般廃棄物ではなく産業廃棄物である。','正しい。産業廃棄物の運搬・処分を委託する事業者は、引渡しと同時に産業廃棄物管理票を交付しなければならない。','正しい。事業者は運搬されるまでの間、技術上の基準に従い産業廃棄物を保管しなければならない。'] },
  { id:'q174', group:'法規', category:'不正アクセス禁止法', chapter:'4章', stars:4, question:'不正アクセス行為に関する次の記述の□に当てはまる語句の組み合わせとして、「不正アクセス行為の禁止等に関する法律」上、正しいものはどれか。「(ア)を有する特定電子計算機に電気通信回線を通じて、当該(ア)に係る他人の識別符号を入力して当該特定電子計算機を作動させ、当該(ア)により制限されている(イ)をし得る状態にさせる行為。」', options:['(ア)通信制御機能 (イ)遠隔操作','(ア)通信制御機能 (イ)特定利用','(ア)アクセス制御機能 (イ)遠隔操作','(ア)アクセス制御機能 (イ)特定利用'], answer:3, explanation:'「アクセス制御機能を有する」とは、当該計算機の利用にあたりIDやパスワード等を必要とする形に設定されている状態のこと。「特定利用」は「その計算機を利用」と読み替えてよい。④が正しい。', choiceNotes:['誤り。アは「通信制御機能」ではなく「アクセス制御機能」、イは「遠隔操作」ではなく「特定利用」が正しい。','誤り。アは「通信制御機能」ではなく「アクセス制御機能」が正しい。','誤り。イは「遠隔操作」ではなく「特定利用」が正しい。','正しい。アは「アクセス制御機能」、イは「特定利用」の組み合わせが条文と一致する。'] },
  { id:'q175', group:'法規', category:'不正アクセス禁止法', chapter:'4章', stars:4, question:'「不正アクセス行為の禁止等に関する法律」で禁止されている行為に関する記述として、誤っているものはどれか。', options:['アクセス制限されているコンピュータに対して、そのコンピュータの正規の利用者のIDとパスワードを、本人に無断でインターネットを経由して入力し、利用できる状態にする行為','電気通信回線に接続されていないパソコンを、そのパソコンの正規の利用者でない者が直接操作して表計算ソフトを使用する行為','Webサイトのログインに使用している他人のIDとパスワードを、正当な理由なしに正規の利用者以外の者に提供する行為','インターネット専業銀行のアクセス管理者に無断で、当該銀行のWebサイトを装った偽のWebサイトに顧客のIDとパスワードを入力するように求める文章、入力欄および送信ボタンを表示し、それをインターネット上に公開して、公衆が閲覧できる状態にする行為'], answer:1, explanation:'不正アクセス行為とされるのは、あくまで電気通信回線を経由したアクセスに限定される。サーバやコンピュータを目の前にして直接操作する行為は同法令の対象にならない。したがって②が誤り(オフラインは対象外)。', choiceNotes:['正しい。他人のID・パスワードを無断でインターネット経由により入力し利用可能にする行為は不正アクセス行為に該当する。','誤り。電気通信回線に接続されていない機器を直接操作する行為は、電気通信回線を通じたアクセスではないため同法の規制対象外である。','正しい。正当な理由なく他人のID・パスワードを第三者に提供する行為は同法で禁止されている。','正しい。フィッシングサイトを公開してID・パスワードの入力を求める行為は同法で禁止されている。'] },
  { id:'q176', group:'無線・放送', category:'放送(地上デジタルTV)', chapter:'5章', stars:2, question:'我が国の地上デジタルテレビ放送に関する記述として、適当なものはどれか。', options:['一定の帯域でできる限り大きい伝送容量を確保するため、TC8PSKの変調が採用されている','電波の反射等の妨害に強く、移動受信が可能なOFDMが採用されている','ITU-T勧告J.83 Annex Cによる64QAMや256QAMの変調が採用されている','映像信号の変調に振幅変調が採用され、音声信号の変調に周波数変調が採用されている'], answer:1, explanation:'TC8PSKはBSやCS放送で用いる変調方式で地デジ放送では使用していない(①不適当)。ITU-T勧告J.83 Annex Cはデジタル有線テレビジョン放送の枠組み(③不適当)。振幅変調(AM)や周波数変調(FM)はアナログ伝送の概念(④不適当)。地デジはOFDMを採用し、ガードインターバルにより遅延波を許容でき、電波が反射する環境でも比較的安定して受信できる。②が適当。', choiceNotes:['誤り。TC8PSKはBSやCS放送で用いられる変調方式であり、地上デジタル放送では採用されていない。','正しい。地上デジタル放送はOFDMを採用しており、マルチパスに強く移動受信にも適している。','誤り。ITU-T勧告J.83 Annex Cはデジタル有線テレビジョン放送(CATV)向けの規格である。','誤り。振幅変調・周波数変調はアナログ放送の伝送方式であり、地上デジタル放送では用いられない。'] },
  { id:'q177', group:'無線・放送', category:'放送(地上デジタルTV)', chapter:'5章', stars:2, question:'我が国の地上デジタルテレビ放送に関する記述として、適当でないものはどれか。', options:['1チャネルの周波数帯域幅6MHzを16等分したうちの13個のセグメントを組み合わせて、地上デジタルテレビ放送の信号としている','標準放送(SDTV)の場合は1チャネルあたり3本の放送が可能で、ハイビジョン放送(HDTV)の場合は1チャネルあたり1本の放送が可能である','中継局も親局と同じ周波数を使って放送する単一周波数ネットワーク(SFN)の構築が可能である','データ放送では、コンテンツを記述する言語としてBMLが採用されている'], answer:0, explanation:'1チャネルの帯域幅6MHzは14のマスに等分し、そのうち1つはワンセグ放送、12セグメントを標準放送またはハイビジョン放送に使用。両サイドの0.5セグメントは隣の局と干渉を防ぐクッションの役割を持つ。したがって16等分とする①が不適当(正しくは14等分)。', choiceNotes:['誤り。6MHz帯域幅は16等分ではなく14等分され、そのうち13セグメントを放送に使用する。','正しい。標準放送は1チャネルで3番組、ハイビジョン放送は1番組の放送が可能である。','正しい。地上デジタル放送は中継局が親局と同一周波数を使う単一周波数ネットワーク(SFN)の構築が可能である。','正しい。データ放送のコンテンツ記述言語にはBMLが採用されている。'] },
  { id:'q178', group:'無線・放送', category:'放送(地上デジタルTV)', chapter:'5章', stars:2, question:'我が国の地上デジタルテレビ放送に関する記述として、適当でないものはどれか。', options:['OFDMは、サブキャリア1本あたりの変調速度が低速であることや、ガードインターバルの挿入により、降雨減衰の影響を抑えることができる','1チャネルの周波数帯域幅6MHzを14等分したうちの13セグメントを画像、音声、データの情報伝送に使用している','マルチパス妨害に有効な周波数インタリーブと、インパルス雑音や移動受信で生じるフェージング妨害に有効な、時間インタリーブが採用されている','データ放送では、コンテンツを記述する言語としてBML(Broadcast Markup Language)が採用されている'], answer:0, explanation:'ガードインターバルは電波の反射等によって遅れて到着した信号を待つための工夫であり、降雨減衰の対策にはならない。降雨減衰を強く受けるのは10GHz以上の高い周波数帯で、地デジが使うUHF帯はあまり大きな減衰は受けない。①が不適当。', choiceNotes:['誤り。ガードインターバルは反射による遅延波(マルチパス)対策であり、降雨減衰への対策ではない。地デジが使うUHF帯は降雨減衰の影響も小さい。','正しい。6MHzの帯域幅は14等分され、そのうち13セグメントが情報伝送に使用される。','正しい。周波数インタリーブはマルチパス妨害に、時間インタリーブはインパルス雑音やフェージングに有効である。','正しい。データ放送のコンテンツ記述言語にはBMLが採用されている。'] },
  { id:'q179', group:'無線・放送', category:'放送(地上デジタルTV)', chapter:'5章', stars:2, question:'我が国の地上デジタルテレビ放送の放送電波に関する記述として、適当でないものはどれか。', options:['地上デジタルテレビ放送は、13〜52チャネルの周波数(470MHz〜710MHz)を使用している','地上デジタルテレビ放送の放送区域は、地上高10mにおいて電界強度が0.3mV/m(50dBμV/m)以上である区域と定められている','地上デジタルテレビ放送では、チャネルの周波数帯幅6MHzを14等分したうちの13セグメントを使用している','地上デジタルテレビ放送でモード3、64QAMの伝送パラメータで単一周波数ネットワーク(SFN)を行った場合を考慮し、送信周波数の許容差は1Hzと規定されている'], answer:1, explanation:'放送区域は「基幹放送局の開設の根本的基準」において、地上10mの高さで電界強度が1mV/m(60dBμV/m)以上である区域と規定されている。②が不適当。', choiceNotes:['正しい。地上デジタル放送は13〜52チャネル(470〜710MHz)の周波数を使用している。','誤り。放送区域は地上高10mで電界強度0.3mV/mではなく1mV/m(60dBμV/m)以上と規定されている。','正しい。6MHz帯域幅を14等分したうち13セグメントを放送に使用している。','正しい。モード3・64QAMでSFNを行う場合を考慮し、送信周波数の許容差は1Hzと規定されている。'] },
  { id:'q180', group:'無線・放送', category:'放送(CATV)', chapter:'5章', stars:2, question:'CATVシステムに関する記述として、適当でないものはどれか。', options:['CATVシステムは、同軸ケーブルや光ファイバケーブルを使って、視聴者にテレビ信号を分配するシステムである','CATVシステムのうち、ケーブルテレビ事業者と視聴者との間のネットワークは、一般的にリング状の構成をとっている','ケーブルテレビ事業者は、地上デジタルテレビ放送や衛星放送の他、自主放送番組を加え多チャンネル化した上で配信している','CATVシステムのネットワーク設備は、双方向通信機能を有する設備へと発展し、CATVシステムを活用したインターネット接続サービスも提供されている'], answer:1, explanation:'CATVシステムの接続構成はSS方式や、PDS方式の形をとることが多く、一般的にリング方式は見られない。②が不適当。', choiceNotes:['正しい。CATVシステムは同軸ケーブルや光ファイバを用いてテレビ信号を視聴者に分配するシステムである。','誤り。事業者と視聴者間のネットワークは一般にSS方式やPDS方式などツリー・スター状の構成をとり、リング状は一般的でない。','正しい。ケーブルテレビ事業者は地上デジタル・衛星放送に自主放送を加え多チャンネル化して配信している。','正しい。CATVは双方向通信機能を持つ設備に発展し、インターネット接続サービスにも活用されている。'] },
  { id:'q181', group:'無線・放送', category:'放送(CATV)', chapter:'5章', stars:2, question:'FTTH型CATVシステムに関する記述として、適当でないものはどれか。', options:['ネットワークの形態には、SS方式、PDS方式およびADS方式がある','光ファイバを視聴者宅まで延伸することで、同軸ケーブルを用いるよりも高い周波数帯域までの伝送が可能となる','PDS方式は、電源供給を受けて動作する多重化装置を光ファイバの分岐点に設置し、そこからスター状に複数の視聴者宅へ分配する方式である','SS方式は、CATV局と視聴者宅との間を1対1で光ファイバにより接続する方式である'], answer:2, explanation:'PDS(Passive Double Star)は分岐点で増幅を行わない方式で、到着した信号を単純に分岐するだけなので電源を必要としない。増幅を行い電源を必要とするのはADS(Active Double Star)方式。③が不適当。', choiceNotes:['正しい。FTTH型CATVのネットワーク形態にはSS方式、PDS方式、ADS方式がある。','正しい。光ファイバを宅内まで延伸することで同軸ケーブルより高い周波数帯域まで伝送可能となる。','誤り。PDS方式は分岐点に無電源の光スプリッタを設置し受動的に分配する方式であり、電源供給を受ける多重化装置を用いるのはADS方式である。','正しい。SS方式はCATV局と視聴者宅を1対1で光ファイバ接続する方式である。'] },
  { id:'q182', group:'無線・放送', category:'放送(CATV)', chapter:'5章', stars:2, question:'HFC型CATVシステムに関する記述として、適当でないものはどれか。', options:['HFC型CATVシステムは、同軸ケーブルシステムと光ファイバシステムを融合させたシステムである','全区間が同軸ケーブルによるCATVシステムと比べ、光ファイバケーブルの利用により信号品質の向上を図ることができる','全区間が同軸ケーブルによるCATVシステムと比べ、光ファイバケーブルの利用により増幅器の縦続接続段数を少なくできる','屋外に電源を必要とする機器の設置が不要であるため、屋外機器への電源供給が必要なくなる'], answer:3, explanation:'光ファイバと同軸ケーブルとが接続されていることから必ず変換点が必要になり、また同軸区間では増幅器を設けるケースもある。これらは電源がないと稼働しない機器であるため、④の記述は不適当。', choiceNotes:['正しい。HFC型CATVは同軸ケーブルシステムと光ファイバシステムを融合させたものである。','正しい。光ファイバの利用により全区間同軸に比べ信号品質が向上する。','正しい。光ファイバの利用により増幅器の縦続接続段数を減らすことができる。','誤り。光/同軸の変換点や同軸区間の増幅器など、屋外に電源を要する機器は必要であり、電源供給が不要になるわけではない。'] },
  { id:'q183', group:'無線・放送', category:'放送(CATV)', chapter:'5章', stars:2, question:'デジタルCATVの受信機であるSTB(Set Top Box)に関する記述として、適当でないものはどれか。', options:['スクランブルの解除に使用されるCASカードを装着するための、CASカードインターフェースを装備している','地上デジタルテレビ放送、BSデジタル放送、110度CSデジタル放送は、パススルー方式で再放送された64QAMまたは256QAMの変調信号を受信する','映像信号と音声信号をテレビにデジタルで出力するためのインターフェースには、HDMI端子がある','受信信号は、チューナで選択された後、変調信号の復調、スクランブルの解除、希望番組の選択、映像復号処理および音声復号処理を行い、テレビに出力する'], answer:1, explanation:'CATVの外部から取り入れた各放送を再放送する場合の手段はパススルー方式ばかりとは限らず、トランスモジュレーション方式の場合もあり得る。また各放送の多重化方式にはPSKや16QAMも採用されている。②が不適当。', choiceNotes:['正しい。STBはスクランブル解除用のCASカードを装着するインターフェースを備えている。','誤り。再放送方式はパススルー方式に限らずトランスモジュレーション方式もあり、変調方式もQAMだけでなくPSK等も用いられる。','正しい。映像・音声をデジタルでテレビへ出力するインターフェースとしてHDMI端子がある。','正しい。受信信号はチューナ選択後、復調、スクランブル解除、番組選択、映像・音声復号を経てテレビへ出力される。'] },
  { id:'q184', group:'無線・放送', category:'放送(符号化方式)', chapter:'5章', stars:2, question:'映像符号化方式に関する記述として、適当でないものはどれか。', options:['MPEG-2は、MPEG-4 AVC(H.264)より動画像情報の圧縮率が高い','MPEG-4 AVC(H.264)は、地上デジタルテレビ放送のワンセグ放送で使われている','HEVC(H.265)は、新4K8K衛星放送で使われている','MPEG-2は、MPEG-1相当の低解像度からフルハイビジョン相当の高解像度までの動画像を扱う'], answer:0, explanation:'MPEG-4 AVC(H.264)は、これより8年も前に制定されたMPEG-2と比較すると2倍近くの圧縮率を誇る。つまりMPEG-2の圧縮率のほうが低い。①が不適当(正しくは低い)。', choiceNotes:['誤り。MPEG-4 AVC(H.264)はMPEG-2より圧縮率が高く、MPEG-2の圧縮率のほうが低い。','正しい。MPEG-4 AVC(H.264)は地上デジタル放送のワンセグ放送で使用されている。','正しい。HEVC(H.265)は新4K8K衛星放送で使用されている。','正しい。MPEG-2はMPEG-1相当の低解像度からフルハイビジョン相当までの動画像を扱える。'] },
  { id:'q185', group:'無線・放送', category:'放送(符号化方式)', chapter:'5章', stars:2, question:'HEVC(H.265)に関する記述として、適当なものはどれか。', options:['HEVC(H.265)は、MPEG-2よりも先に国際標準化された映像符号化方式の規格である','HEVC(H.265)で処理できるのは、最大でSDTV相当の解像度の動画像までである','HEVC(H.265)は、我が国の地上デジタルテレビ放送のワンセグ放送に使われている','HEVC(H.265)は、MPEG-4 AVC(H.264)よりも動画像情報の圧縮率が高い'], answer:3, explanation:'HEVCは2013年に定められた標準規格で、MPEG-2(1995年)のほうが遥かに古い(①不適当)。HEVCは8Kスーパーハイビジョン相当の解像度まで対応可能(②不適当)。ワンセグ放送で採用されている圧縮形式はMPEG-4 AVC(H.264)(③不適当)。HEVCはMPEG-4 AVCと比較すると約2倍の圧縮効率となる。④が適当。', choiceNotes:['誤り。MPEG-2(1995年制定)のほうがHEVC(2013年制定)より先に標準化されている。','誤り。HEVCは8Kスーパーハイビジョン相当の解像度まで処理可能である。','誤り。ワンセグ放送で使われているのはHEVCではなくMPEG-4 AVC(H.264)である。','正しい。HEVCはMPEG-4 AVC(H.264)と比較して約2倍の圧縮効率を持つ。'] },
  { id:'q186', group:'ネットワーク・情報', category:'サーバ(RAID)', chapter:'5章', stars:2, question:'複数のハードディスクを組み合わせて構成するRAIDに関する記述として、適当なものはどれか。', options:['RAID0は、2台のハードディスクに同じデータを記録する方式であり、1台のハードディスクが故障しても他の1台で継続して利用できるが、記録するデータよりも倍の記憶容量が必要となる','RAID1は、複数のハードディスクにデータを分散して記録する方式であり、アクセスを高速化できるが、1台でもハードディスクが故障すると、データの読み書きができなくなる','RAID4は、複数のハードディスクのうち1台をパリティ情報の記録に割り当て、残りの複数のハードディスクにデータをブロック単位で分散して記録する方式である','RAID5は、複数のハードディスクにデータを分散して記録し、さらに複数の専用のハードディスクにハミングコードを分散して記録する方式である'], answer:2, explanation:'2台のディスクに同じデータを書き込む方式はRAID1(ミラーリング)であり①は不適当。データを分散して記録し高速化する方式はRAID0(ストライピング)であり②も不適当。1台をパリティ記録専用に割り当て、残りにブロック単位で分散して記録するのはRAID4で③が適当。RAID5はハミングコードは用いておらず④は不適当。', choiceNotes:['誤り。この記述はミラーリングを行うRAID1の説明であり、RAID0はデータを分散記録して高速化するストライピング方式である。','誤り。この記述はストライピングを行うRAID0の説明であり、RAID1は同じデータを2台に書き込むミラーリング方式である。','正しい。RAID4は1台をパリティ専用ディスクとし、残りにデータをブロック単位で分散記録する方式である。','誤り。RAID5はハミングコードではなくパリティ情報を各ディスクに分散して記録する方式である。'] },
  { id:'q187', group:'ネットワーク・情報', category:'サーバ(RAID)', chapter:'5章', stars:2, question:'ハードディスクの技術であるRAID5に関する記述として、適当なものはどれか。', options:['複数のハードディスクにデータを分散して記録する方式であり、アクセスを高速化できるが、1台でもハードディスクが故障するとデータの読み書きができなくなる','2台のハードディスクに同じデータを記録する方式であり、1台のハードディスクが故障しても他の1台で継続して利用できるが、記録するデータよりも倍の記憶容量が必要となる','複数のハードディスクにデータとパリティ情報をそれぞれ分散して記録する方式であり、1台のハードディスクが故障しても残りのハードディスクのデータとパリティ情報から元のデータを復元できる','複数のハードディスクのうち1台をパリティ情報の記録に割り当て、残りのハードディスクにデータを分散して記録する方式である'], answer:2, explanation:'①はRAID0(ストライピング)、②はRAID1(ミラーリング)の説明。複数のハードディスクにデータを分散して記録し、かつパリティ情報も分散して記録する方式がRAID5であり③が適当。④はパリティ専用ディスクを設けるRAID3または4の説明。', choiceNotes:['誤り。この記述はデータを分散記録して高速化するRAID0(ストライピング)の説明である。','誤り。この記述は2台に同一データを記録するRAID1(ミラーリング)の説明である。','正しい。RAID5はデータとパリティ情報の両方を複数ディスクに分散記録し、1台故障時も残りから復元できる方式である。','誤り。この記述はパリティ専用ディスクを設けるRAID3またはRAID4の説明である。'] },
  { id:'q188', group:'ネットワーク・情報', category:'サーバ(仮想化)', chapter:'5章', stars:2, question:'サーバの仮想化技術に関する記述として、適当でないものはどれか', options:['サーバの数を増やして処理を分散することにより、処理能力を上げる方法をスケールアップという','仮想サーバで稼働しているOSやソフトウェアを停止することなく、他の物理サーバへ移し替える技術をライブマイグレーションという','物理サーバのハードウェア上で、仮想化ソフトウェアを直接稼働させる方式をハイパーバイザ型という','物理サーバのOS上で、仮想化ソフトウェアを動作させる方式をホストOS型という'], answer:0, explanation:'サーバの台数を増やして分散処理を行い、システム全体の処理能力や可用性を高めることは「スケールアウト」という。ハードウェアを高性能なものに置き換えて処理能力を高めるのが「スケールアップ」。①が不適当。', choiceNotes:['誤り。サーバの台数を増やして処理を分散し能力を高める方法は「スケールアウト」であり、スケールアップはハードウェア性能自体を高める方法を指す。','正しい。稼働中のOS・ソフトを停止せず他の物理サーバへ移し替える技術はライブマイグレーションである。','正しい。物理サーバのハードウェア上で仮想化ソフトを直接稼働させる方式はハイパーバイザ型である。','正しい。物理サーバのOS上で仮想化ソフトを動作させる方式はホストOS型である。'] },
  { id:'q189', group:'ネットワーク・情報', category:'サーバ(仮想化)', chapter:'5章', stars:2, question:'仮想化技術に関する次の記述に該当する名称として、適当なものはどれか。「仮想マシンで稼働しているOSを停止させることなく、別の物理ホストに移動させる技術」', options:['クラスタリング','オペレーティングシステム','ライブマイグレーション','パーティショニング'], answer:2, explanation:'クラスタリングは複数のコンピュータを結合してあたかも1つのコンピュータのように扱う技術(①不適当)。オペレーティングシステムはシステム全体を管理する基本的なプログラム群(②不適当)。パーティショニングはデータベースにおいて1つのテーブルデータを分割して管理する仕組み(④不適当)。稼働中の仮想マシンを停止せずに別のホストへ移行させる機能はライブマイグレーションで③が適当。', choiceNotes:['誤り。クラスタリングは複数のコンピュータを結合し1台のように扱う技術であり、稼働中の移動技術ではない。','誤り。オペレーティングシステムはシステム全体を管理する基本ソフトウェアであり、設問の技術を指す名称ではない。','正しい。稼働中の仮想マシンを停止せずに別の物理ホストへ移動させる技術がライブマイグレーションである。','誤り。パーティショニングはデータベースの1テーブルを分割管理する仕組みであり、仮想マシンの移動技術ではない。'] },
  { id:'q190', group:'ネットワーク・情報', category:'IPアドレス(IPv4)', chapter:'5章', stars:2, question:'IPv4アドレス「192.168.3.64/27」のネットワークで収容できるホストの最大数として、適当なものはどれか。', options:['27','30','62','254'], answer:1, explanation:'「/27」は左から27ビット目までがネットワークアドレスという意味で、ホスト側で使用できるのは残りの5ビット。2進数の5ビットで表せるのは0〜31の32個だが、頭と最後は特殊アドレスで使用できないため、ホストに割り当て可能なのは差引きの30個。②が適当。', choiceNotes:['誤り。27はサブネットマスクのビット数であり、収容可能なホスト数ではない。','正しい。/27ではホスト部が5ビットとなり、2の5乗=32からネットワークアドレスとブロードキャストアドレスの2つを除いた30が最大ホスト数となる。','誤り。62はホスト部6ビット(/26相当)の場合の最大ホスト数であり、/27には該当しない。','誤り。254はホスト部8ビット(/24相当)の場合の最大ホスト数であり、/27には該当しない。'] },
  { id:'q191', group:'有線・線路施工', category:'光ファイバ伝送(特徴・性質)', chapter:'5章', stars:2, question:'PON(Passive Optical Network)システムに関する記述として、適当でないものはどれか。', options:['PONシステムでは、レンジング処理によってOLT(Optical Line Terminal)からONU(Optical Network Unit)への下り信号の衝突を防いでいる','GE-PON(Gigabit Ethernet-PON)は、下り信号と上り信号で異なる波長の光を使う波長分割多重により、1心の光ファイバで双方向通信を実現している','B-PON(Broadband-PON)は、ONUとOLT間の伝送をATMセル単位で行っている','GE-PONは、IEEE802.3ahで標準化された、高速光アクセス方式の1つである'], answer:0, explanation:'信号の衝突を懸念するのは各ONUからOLTへ向かう上り回線の場合。下り回線はOLTが全ONU宛の信号を整理して格納した形で送出するので衝突は起こらない。レンジング処理とは上り信号を送信させる準備として伝送の仕様や遅延時間等を調べる手順のこと。①が不適当。', choiceNotes:['誤り。信号衝突が問題となるのは各ONUからOLTへの上り信号であり、レンジング処理は上り信号の送信タイミング等を調整する処理である。下り信号はOLTが一括送信するため衝突しない。','正しい。GE-PONは上りと下りで異なる波長を用いる波長分割多重により1心の光ファイバで双方向通信を実現している。','正しい。B-PONはONUとOLT間の伝送をATMセル単位で行う。','正しい。GE-PONはIEEE802.3ahで標準化された高速光アクセス方式である。'] },
  { id:'q192', group:'有線・線路施工', category:'光ファイバ伝送(特徴・性質)', chapter:'5章', stars:2, question:'光変調方式に関する記述として、適当でないものはどれか。', options:['直接光変調方式は、送信信号で半導体レーザからの光の位相を変化させる変調方式である','直接光変調方式は、構成が簡単で、小型化も容易、コスト低廉である等の特徴を有する変調方式である','外部光変調方式は、半導体レーザからの無変調の光を光変調器により送信信号で変調を行う方式である','外部光変調方式には、電気光学効果による屈折率変化を利用する方式と、半導体の電界吸収効果による光透過率の変化を利用する方式がある'], answer:0, explanation:'直接変調方式は、送信信号のビットによって半導体レーザに電圧を印加し、変調はオンかオフのどちらかで表現する単純な形となり、振幅を変化させる強度変調に分類される。この方式では位相を変化させることはできない。①が不適当(強度変調のみ)。', choiceNotes:['誤り。直接光変調方式は半導体レーザの駆動電流をオンオフして光強度を変化させる強度変調方式であり、位相を変化させるものではない。','正しい。直接光変調方式は構成が簡単で小型化が容易、低コストという特徴がある。','正しい。外部光変調方式は無変調の光を光変調器により送信信号で変調する方式である。','正しい。外部光変調方式には電気光学効果や半導体の電界吸収効果を利用する方式がある。'] },
  { id:'q193', group:'有線・線路施工', category:'光ファイバ伝送(特徴・性質)', chapter:'5章', stars:2, question:'光ファイバの種類・特徴に関する記述として、適当でないものはどれか。', options:['光ファイバには、シングルモード光ファイバとマルチモード光ファイバがあり、伝送損失はシングルモード光ファイバのほうが小さい','長距離大容量伝送には、マルチモード光ファイバが適している','マルチモード光ファイバには、ステップインデックス型とグレーデッドインデックス型の2種類がある','シングルモード光ファイバは、マルチモード光ファイバと比べてコア径を小さくすることで、光伝搬経路を単一としたものである'], answer:1, explanation:'シングルモード光ファイバは反射をせずに一直線に進むため反射損がなく伝送損失が小さい。長距離の伝送にはシングルモード光ファイバのほうが向いており、標準的な伝送距離はマルチモードが2km程度なのに対しシングルモードは約40kmと圧倒的。②が不適当。', choiceNotes:['正しい。シングルモード光ファイバはマルチモードより伝送損失が小さい。','誤り。長距離大容量伝送に適しているのはマルチモードではなくシングルモード光ファイバである。','正しい。マルチモード光ファイバにはステップインデックス型とグレーデッドインデックス型がある。','正しい。シングルモード光ファイバはコア径を小さくして光伝搬経路を単一にしたものである。'] },
  { id:'q194', group:'有線・線路施工', category:'光ファイバ伝送(特徴・性質)', chapter:'5章', stars:2, question:'光ファイバ通信の波長分割多重方式に関する記述として、適当なものはどれか。', options:['DWDM伝送では、光ファイバの非線形効果に起因する四光波混合による波長チャーピングが発生する','WDMは、大容量伝送が可能で、光増幅器を使用することにより、複数の波長を各波長に分波して増幅する','DWDMは、波長間隔を20nmとすることが規定され、使用する帯域の規定はない','DWDMは、CWDMに比べて、多くの光信号を多重化することができる'], answer:3, explanation:'CWDMは収容数数本〜10本・波長間隔約20nm、DWDMは収容数約100本・波長間隔約1nm。DWDMはCWDMと比較して約10倍も多くの光信号を多重化することが可能で④が適当。光増幅器は分波せずに一括して増幅可能(②不適当)。DWDMの波長間隔は約1nm程度(③不適当)。波長チャーピングは光変調時にキャリアの密度が時間的に変化して波長が変動する現象(①不適当)。', choiceNotes:['誤り。波長チャーピングは光変調時にキャリア密度変化で波長が変動する現象であり、四光波混合による非線形効果とは別の現象である。','誤り。光増幅器は各波長を分波せず一括して増幅することができる。','誤り。DWDMの波長間隔は約20nmではなく約1nm程度と狭い。','正しい。DWDMはCWDMに比べ波長間隔が狭く、より多くの光信号を多重化できる。'] },
  { id:'q195', group:'有線・線路施工', category:'光ファイバ伝送(分散)', chapter:'5章', stars:2, question:'光ファイバの分散に関する記述として、適当でないものはどれか。', options:['モード分散は、シングルモード光ファイバでは発生しないが、マルチモード光ファイバで発生する','波長分散は、伝搬モードによって光の伝送経路が異なるために、到達時間が違うことで生じる分散である','構造分散は、光の一部がクラッド部分へ染み出して反射するが、この染み出しの割合が光の波長により異なり、結果的に伝搬経路の長さが光の波長により違ったものとなるために生じる分散である','材料分散は、光ファイバの媒質の屈折率が光の波長によって異なるために、光の伝搬速度が波長により異なることで生じる分散である'], answer:1, explanation:'伝搬モードによって伝搬経路が異なり到達時間にズレが生じるのはモード分散の説明。波長分散は材料分散と構造分散とを合算したもので、光源の波長のわずかな幅により波長ごとに伝搬時間が異なるため到達にズレが生じるもの。②が不適当。', choiceNotes:['正しい。モード分散はマルチモード光ファイバで発生し、シングルモードでは発生しない。','誤り。この記述はモード分散の説明であり、波長分散は材料分散と構造分散を合わせたもので、光源の波長幅により伝搬時間が異なることで生じる。','正しい。構造分散はクラッドへの光の染み出し割合が波長により異なるために生じる分散である。','正しい。材料分散は媒質の屈折率が波長により異なるために光の伝搬速度が変わることで生じる分散である。'] },
  { id:'q196', group:'有線・線路施工', category:'光ファイバ伝送(分散)', chapter:'5章', stars:2, question:'光ファイバの分散に関する記述として、適当でないものはどれか。', options:['パルス信号の伝送中に分散が発生すると、パルス幅が広がり、隣りのパルスと重なるため符号誤りが発生する要因となる','偏波モード分散は、光ファイバに外部から不均一な応力が加わった場合などにおいて、直交する2方向に偏波した2つのモード間に遅延差が生じる分散である','シングルモード光ファイバでは、主に波長分散によって伝送帯域が制限される','マルチモード光ファイバでは、主に構造分散によって伝送帯域が制限される'], answer:3, explanation:'マルチモードにおいても構造分散は発生するが、影響はそれほど大きくない。むしろモード分散が支配的といえる。④が不適当(主にモード分散による)。', choiceNotes:['正しい。分散が発生するとパルス幅が広がり隣接パルスと重なって符号誤りの要因となる。','正しい。偏波モード分散は不均一応力等により直交2偏波モード間に遅延差が生じる分散である。','正しい。シングルモード光ファイバでは主に波長分散によって伝送帯域が制限される。','誤り。マルチモード光ファイバで支配的な分散はモード分散であり、構造分散の影響は小さい。'] },
  { id:'q197', group:'有線・線路施工', category:'光ファイバ伝送(損失)', chapter:'5章', stars:2, question:'光ファイバの光損失の要因であるマイクロベンディングロスに関する記述として、適当なものはどれか。', options:['光ファイバを接続する場合にコアどうしが完全に均一に接続されない場合、一方のコアから出た光の一部が他方のコアに入射できず、放射されて生じる損失である','光ファイバのコアとクラッドの境界面の凹凸により光が乱反射され、光ファイバ外に放射されることにより生じる損失である','光ファイバに側面から不均一な圧力が加わると、光ファイバの軸がわずかに曲がることで生じる損失である','光ファイバ中を伝わる光が外へ漏れることなしに光ファイバ材料自身によって吸収され、熱に変換されることにより生じる損失である'], answer:2, explanation:'①は接続損失のうちの軸ずれ、②は構造の不均一性による散乱損失、④は吸収損失の説明。マイクロベンディングロスは曲がり損失の一種で、ファイバに対して側面から不均一な圧力が加わった場合に、ファイバの軸がわずかに曲がって発生する損失のこと。③が適当。', choiceNotes:['誤り。この記述は接続時のコア軸ずれによる接続損失の説明である。','誤り。この記述はコアとクラッドの境界面の凹凸による散乱損失の説明である。','正しい。マイクロベンディングロスは側面からの不均一な圧力でファイバ軸がわずかに曲がることで生じる損失である。','誤り。この記述は光が材料自身に吸収され熱に変換される吸収損失の説明である。'] },
  { id:'q198', group:'有線・線路施工', category:'光ファイバ伝送(損失)', chapter:'5章', stars:2, question:'光ファイバの損失要因であるレイリー散乱損失に関する次の記述の空欄に当てはまる語句の組み合わせとして、適当なものはどれか。「レイリー散乱損失は、光ファイバの屈折率のゆらぎにより生じる損失であり、その大きさは波長の(ア)乗に(イ)する。」', options:['(ア)2 (イ)比例','(ア)2 (イ)反比例','(ア)4 (イ)比例','(ア)4 (イ)反比例'], answer:3, explanation:'レイリー散乱による損失の大きさは、光波長の4乗に反比例する。つまり伝搬する光の波長が短くなるにしたがって光損失は急激に増大する。実際の光ファイバ通信ではレイリー散乱損失の影響が少ない1μm〜1.675μmの帯域の波長を用いている。④が適当。', choiceNotes:['誤り。レイリー散乱損失は波長の2乗ではなく4乗に、また比例ではなく反比例する。','誤り。指数は2乗ではなく4乗が正しい。','誤り。比例ではなく反比例が正しい。','正しい。レイリー散乱損失の大きさは波長の4乗に反比例する。'] },
  { id:'q199', group:'有線・線路施工', category:'線材(同軸ケーブル)', chapter:'5章', stars:2, question:'同軸ケーブルに関する記述として、適当でないものはどれか。', options:['同軸ケーブルの構造は、内部導体を中心にその周りを絶縁体と外部導体が同軸状に囲み、これらの保護のため、ポリ塩化ビニル等で被覆されている','同軸ケーブルの特性インピーダンスは、内部導体の直径、外部導体の内径および、絶縁体の比誘電率で決まる','整合状態で用いられている同軸ケーブルからの電波の漏れは、非常に少ない','導波管と比較すると損失が少なく、その値は周波数が高いほど小さくなる'], answer:3, explanation:'同軸ケーブルの短所として、流れる信号の周波数が高くなると損失が大きくなる傾向がある。また一般的に導波管のほうが損失は少ない。④が不適当。', choiceNotes:['正しい。同軸ケーブルは内部導体を絶縁体と外部導体が同軸状に囲み、ビニル等で被覆された構造である。','正しい。特性インピーダンスは内部導体径・外部導体内径・絶縁体の比誘電率で決まる。','正しい。整合状態で用いる同軸ケーブルからの電波漏れは非常に少ない。','誤り。同軸ケーブルは周波数が高くなるほど損失が大きくなる傾向があり、また一般に導波管より損失は大きい。'] },
  { id:'q200', group:'有線・線路施工', category:'線材(同軸ケーブル)', chapter:'5章', stars:2, question:'同軸ケーブルに関する記述として、適当でないものはどれか。', options:['同軸ケーブルは、通常、TE波のみが伝搬する周波数範囲で使われる','内部導体を同心円の外部導体で取り囲み、内部導体と外部導体の間に絶縁体を挟み込んだ構造である','特性インピーダンスは、外部導体の内径、内部導体の外径および、外部導体と内部導体の間の絶縁体の比誘電率で決まる','同軸ケーブルは、外部導体の外側に漏れる磁力線や電気力線が非常に少ない'], answer:0, explanation:'同軸ケーブルを断面で見ると、進行方向には電界成分も磁界成分も現れない。つまりTEMモードにて伝搬される。TEモードではないので①が不適当(TEM波のみを通す)。', choiceNotes:['不適当。同軸ケーブルはTE波ではなく、進行方向に電界・磁界成分を持たないTEM波のみが伝搬する構造である。','適当。内部導体を同心円状の外部導体で囲み、間に絶縁体(誘電体)を充填する構造で、これが同軸ケーブルの基本形である。','適当。特性インピーダンスは外部導体の内径と内部導体の外径の比、および絶縁体の比誘電率によって決まる関係式で表される。','適当。内外導体間に電磁界が閉じ込められるため、外部導体の外側への磁力線・電気力線の漏れが非常に少なく外部誘導を受けにくい。'] },
  { id:'q201', group:'無線・放送', category:'無線伝送(受信電力)', chapter:'5章', stars:2, question:'マイクロ波通信を行う無線局であるA局とB局の間において、A局から送信機出力1〔W〕で送信したときのB局の受信機入力電力〔dBm〕の値として、適当なものはどれか。ただし、A局の送信空中線およびB局の受信空中線の絶対利得はそれぞれ35〔dBi〕、A局における送信空中線から送信機までの給電線の損失およびB局における受信空中線から受信機までの給電線の損失はそれぞれないものとし、A局とB局の間の自由空間基本伝搬損失は120〔dB〕とする。', options:['-160〔dBm〕','-90〔dBm〕','-20〔dBm〕','80〔dBm〕'], answer:2, explanation:'送信機出力1〔W〕=1000〔mW〕=10³〔mW〕をdBmに換算すると10log10³=30〔dBm〕。受信機の入力電力は+30+35-120+35=-20〔dBm〕。③が適当。', choiceNotes:['不適当。送信出力30dBmにアンテナ利得35dBiを加え伝搬損失120dBを引き受信アンテナ利得35dBiを加えると-20dBmとなり、-160dBmは計算が誤り。','不適当。同様の計算過程から-90dBmという値は導出されず、損失や利得の加減を誤った結果である。','適当。30(dBm)+35(dBi)-120(dB)+35(dBi)=-20dBmとなり、自由空間伝搬損失とアンテナ利得を正しく加減した値と一致する。','不適当。80dBmは受信電力としてあり得ないほど大きい値で、伝搬損失120dBを考慮していない計算になっている。'] },
  { id:'q202', group:'無線・放送', category:'無線伝送(ダイバーシティ)', chapter:'5章', stars:2, question:'移動通信システムで用いられるダイバーシティ技術に関する記述として、適当でないものはどれか。', options:['CDMAは、1つの周波数を複数の基地局が共有しているため、周辺の基地局で受信される信号を利用する時間ダイバーシティ受信により回線の信頼性を高めている','2つ以上の周波数帯域を使用するキャリアアグリゲーションは、通信速度の向上だけでなく、通信が安定する周波数ダイバーシティ効果も得られる','複数の伝搬経路を経由して受信された信号を最大比合成するRAKE受信は、パスダイバーシティ効果が得られる','偏波ダイバーシティは、直交する偏波特性のアンテナを用いて、受信した信号を合成することにより電波の偏波面の変動による受信レベルの変動を改善する'], answer:0, explanation:'複数の受信局で受信された信号を合成したり補完したりする手法はルートダイバーシティに近い概念であり、時間ダイバーシティではない。時間ダイバーシティは同一の信号を時間をずらして2回以上送信することで信頼性を向上させる仕組み。①が不適当。', choiceNotes:['不適当。複数基地局の受信信号を利用する方式はルートダイバーシティに近く、時間ダイバーシティ(同一信号を時間をずらして送信)とは異なる概念である。','適当。異なる周波数帯を束ねるキャリアアグリゲーションは高速化に加え、周波数ごとのフェージング特性の違いを利用した周波数ダイバーシティ効果も得られる。','適当。RAKE受信は複数の遅延波(マルチパス)を個別に検出し最大比合成することでパスダイバーシティ効果を得る受信方式である。','適当。偏波ダイバーシティは直交する偏波のアンテナで受信した信号を合成し、偏波面の変動による受信レベル変動を改善する。'] },
  { id:'q203', group:'ネットワーク・情報', category:'OSI参照モデル', chapter:'5章', stars:2, question:'下表に示すOSI参照モデルの空欄(ア)、(イ)、(ウ)に当てはまる名称の組み合わせとして、適当なものはどれか。〔階層7:アプリケーション層、6:(ア)、5:セッション層、4:トランスポート層、3:(イ)、2:データリンク層、1:(ウ)〕', options:['(ア)ネットワーク層 (イ)プレゼンテーション層 (ウ)物理層','(ア)ネットワーク層 (イ)物理層 (ウ)プレゼンテーション層','(ア)プレゼンテーション層 (イ)ネットワーク層 (ウ)物理層','(ア)プレゼンテーション層 (イ)物理層 (ウ)ネットワーク層'], answer:2, explanation:'OSI参照モデルは第7層から順にアプリケーション層、プレゼンテーション層、セッション層、トランスポート層、ネットワーク層、データリンク層、物理層。第6層がプレゼンテーション層、第3層がネットワーク層、第1層が物理層となり③が適当。7階層の名称は暗記必須。', figure:'<table style="width:100%;max-width:280px;margin:8px auto;border-collapse:collapse;font-size:13px">       <tr><td style="border:1px solid #999;padding:4px 8px">7</td><td style="border:1px solid #999;padding:4px 8px">アプリケーション層</td></tr>       <tr><td style="border:1px solid #999;padding:4px 8px">6</td><td style="border:1px solid #999;padding:4px 8px">（ア）</td></tr>       <tr><td style="border:1px solid #999;padding:4px 8px">5</td><td style="border:1px solid #999;padding:4px 8px">セッション層</td></tr>       <tr><td style="border:1px solid #999;padding:4px 8px">4</td><td style="border:1px solid #999;padding:4px 8px">トランスポート層</td></tr>       <tr><td style="border:1px solid #999;padding:4px 8px">3</td><td style="border:1px solid #999;padding:4px 8px">（イ）</td></tr>       <tr><td style="border:1px solid #999;padding:4px 8px">2</td><td style="border:1px solid #999;padding:4px 8px">データリンク層</td></tr>       <tr><td style="border:1px solid #999;padding:4px 8px">1</td><td style="border:1px solid #999;padding:4px 8px">（ウ）</td></tr>     </table>', choiceNotes:['不適当。(イ)を物理層、(ウ)をプレゼンテーション層とする組み合わせは階層順序が入れ替わっており誤りである。','不適当。(ア)をネットワーク層とすると第6層の名称が誤りで、正しくは第6層はプレゼンテーション層である。','適当。第6層プレゼンテーション層、第3層ネットワーク層、第1層物理層であり、OSI参照モデルの正しい階層構成と一致する。','不適当。(イ)を物理層、(ウ)をネットワーク層とする組み合わせは第1層と第3層の名称が入れ替わっており誤りである。'] },
  { id:'q204', group:'ネットワーク・情報', category:'OSI参照モデル', chapter:'5章', stars:2, question:'OSI参照モデルのプロトコル階層に関する記述として、適当なものはどれか。', options:['OSI参照モデルは、データリンク層で信頼度の高いデータ転送を実現する機能をもち、データの順序制御、網内のデータ紛失に対する誤り検出・回復等を行っている','OSI参照モデルのセッション層は、トランスポート層以下の機能によって確立された通信をさらに、応用プロセス間で合意された一定のルールに従い、通信の多重化を行う','OSI参照モデルは、通信に必要な機能を7階層に分類し整理したモデルであり、コンピュータネットワークにおけるプロトコルの設計や機能を理解するためのガイドラインである','OSI参照モデルのトランスポート層、プレゼンテーション層、アプリケーション層が、TCP/IPでは、アプリケーション層としてまとめられている'], answer:2, explanation:'①の記述はトランスポート層の説明でデータリンク層ではない。TCP/IPのアプリケーション層に相当するのはOSI参照モデルのセッション層以上の全て(アプリケーション層、プレゼンテーション層、セッション層の3層)でトランスポート層は含まれない(④不適当)。通信に必要な機能を7階層に分類し整理したモデルという③がOSI参照モデルの説明として最も適した文面。', choiceNotes:['不適当。データの順序制御や誤り検出・回復により信頼性の高いデータ転送を実現するのはトランスポート層の機能であり、データリンク層の説明ではない。','不適当。応用プロセス間の合意に基づく通信の同期・対話制御を行うのはセッション層の役割だが、多重化の主機能ではなく説明として不適当。','適当。OSI参照モデルは通信機能を7階層に分類整理したモデルで、プロトコル設計や機能理解のガイドラインとして用いられる。','不適当。TCP/IPのアプリケーション層に相当するのはOSIのアプリケーション層・プレゼンテーション層・セッション層の3層で、トランスポート層は含まれない。'] },
  { id:'q205', group:'ネットワーク・情報', category:'IPネットワーク(DHCP)', chapter:'5章', stars:2, question:'TCP/IPで通信を行うため、各クライアントに対して、IPアドレスやサブネットマスク、デフォルトゲートウェイなど、さまざまな設定を自動的に割り当てるプロトコルとして、適当なものはどれか。', options:['ARP','SNMP','DHCP','MIME'], answer:2, explanation:'ARPはIPアドレスからMACアドレスの情報を取得するためのプロトコル。SNMPはネットワーク経由で機器の監視や制御を行うプロトコル。DHCPはLANに参加した端末(ホスト)に自動的にIPアドレス等の情報を割り当てる機能で、IPアドレスの他サブネットマスクやデフォルトゲートウェイのアドレス、DNSサーバのアドレス等も含まれる。③が適当。MIMEは電子メールでテキスト文字以外の情報を扱えるようにする拡張仕様。', choiceNotes:['不適当。ARPはIPアドレスからMACアドレスを求めるプロトコルであり、IPアドレス等の自動割当は行わない。','不適当。SNMPはネットワーク機器の監視・制御を行うためのプロトコルであり、アドレス自動割当機能はない。','適当。DHCPはLANに参加した端末にIPアドレス、サブネットマスク、デフォルトゲートウェイ等を自動的に割り当てるプロトコルである。','不適当。MIMEは電子メールでテキスト以外のデータを扱うための拡張仕様であり、アドレス割当とは無関係である。'] },
  { id:'q206', group:'ネットワーク・情報', category:'IPネットワーク(DHCP)', chapter:'5章', stars:2, question:'DHCPに関する記述として、適当なものはどれか。', options:['各クライアントに対して、IPアドレスやサブネットマスク、デフォルトゲートウェイのアドレス、DNSサーバのアドレスなどを、自動的に割り当てるためのプロトコルである','IPネットワークに接続される機器の時刻を、同期させるためのプロトコルである','メールクライアントからメールサーバへのメールの送信、あるいはメールサーバ相互間でメールを送受信するためのプロトコルである','WebサーバとWebブラウザとの間において、HTMLファイルや画像ファイルなどを送受信するためのプロトコルである'], answer:0, explanation:'時刻の同期を取るためのプロトコルはNTP(②不適当)。メールを送受信するためのプロトコルの代表的なものはSMTP(③不適当)。HTMLファイルや画像ファイル等を送受信するプロトコルはHTTP(④不適当)。各クライアントに通信に必要なIPアドレス等の情報を自動的に割り当てるためのプロトコルがDHCPで①が適当。', choiceNotes:['適当。DHCPはIPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSサーバのアドレス等を自動的に割り当てるプロトコルである。','不適当。機器間の時刻同期を行うのはNTP(Network Time Protocol)であり、DHCPの機能ではない。','不適当。メールの送受信を行うプロトコルはSMTPであり、DHCPとは役割が異なる。','不適当。WebブラウザとWebサーバ間でHTMLファイル等を送受信するのはHTTPであり、DHCPの説明ではない。'] },
