  { id:'q207', group:'ネットワーク・情報', category:'IPネットワーク(接続技術)', chapter:'5章', stars:2, question:'インターネットで使われている技術に関する記述として、適当でないものはどれか。', options:['DHCPサーバとは、ドメイン名をIPアドレスに変換する機能を持つサーバである','ルーティングとは、最適な経路を選択しながら宛先IPアドレスまでIPパケットを転送していくことである','プロキシサーバとは、クライアントに変わってインターネットにアクセスする機能を持つサーバである','CGIとは、Webブラウザからの要求に応じてWebサーバがプログラムを起動するための仕組みである'], answer:0, explanation:'DHCPはLANに参加した端末に自動的にIPアドレス等を割り当てる機能。ドメイン名をIPアドレスに変換する機能はDNS(Domain Name System)。①が不適当。', choiceNotes:['不適当。ドメイン名をIPアドレスに変換する機能を持つのはDNSであり、DHCPはIPアドレス等を自動割当するサーバである。','適当。ルーティングは最適経路を選択しながら宛先IPアドレスまでIPパケットを転送していく処理であり、正しい記述である。','適当。プロキシサーバはクライアントに代わってインターネットへアクセスする代理機能を持つサーバであり、正しい記述である。','適当。CGIはWebブラウザからの要求に応じてWebサーバ側でプログラムを起動する仕組みであり、正しい記述である。'] },
  { id:'q208', group:'ネットワーク・情報', category:'IPネットワーク(接続技術)', chapter:'5章', stars:2, question:'TCP/IPにおけるIP(インターネットプロトコル)の特徴に関する記述として、適当でないものはどれか。', options:['パケット通信を行う','最終的なデータの到達を保証しない','経路制御を行う','OSI参照モデルにおいて、トランスポート層に位置する'], answer:3, explanation:'TCP/IPは第4層のTCP(Transmission Control Protocol)と、第3層のIP(Internet Protocol)の総称。IPはOSI参照モデルのネットワーク層(第3層)に位置し、トランスポート層ではない。④が不適当(ネットワーク層)。', choiceNotes:['適当。IPはデータをパケット(データグラム)に分割して通信を行うプロトコルであり、正しい記述である。','適当。IPはコネクションレス型で到達を保証しないベストエフォート型のプロトコルであり、正しい記述である。','適当。IPは宛先までの経路を選択する経路制御(ルーティング)機能を持つプロトコルであり、正しい記述である。','不適当。IPはOSI参照モデルの第3層ネットワーク層に位置するプロトコルであり、第4層のトランスポート層ではない。'] },
  { id:'q209', group:'ネットワーク・情報', category:'IPネットワーク(経路選択)', chapter:'5章', stars:2, question:'IPネットワークで用いられるRIPに関する記述として、適当なものはどれか。', options:['各リンクにコストと呼ばれる重みをつけ、このコストの合計値が小さくなるように経路を選択する','ホップ数と呼ばれる通過するルータの数が、できるだけ少ない数を通過して目的のIPアドレスに到達するように経路を選択する','各組織が運用するネットワークである自律システムに対してAS番号が割り当てられ、このAS番号を使って経路を選択する','IPパケットにラベルと呼ばれる情報を付加し、そのラベルを使ってIPパケットを転送する'], answer:1, explanation:'コストの合計値が最少となるように経路を選択するのはリンクステート型のOSPF(①不適当)。AS番号を用いて経路選択を行うプロトコルはEGP(③不適当)。ラベルによってパケットを転送するプロトコルはMPLS(④不適当)。RIPはディスタンス・ベクタ型で、ホップ数(通過するルータの数)によって最適なルートを決定する。②が適当。', choiceNotes:['不適当。リンクにコストという重みを付け合計値最小の経路を選ぶのはリンクステート型のOSPFの特徴であり、RIPの説明ではない。','適当。RIPはディスタンス・ベクタ型で、ホップ数(通過するルータの数)が最小になるよう経路を選択するプロトコルである。','不適当。AS番号を用いて経路を選択するのはAS間で用いるEGP(BGP等)の特徴であり、RIPの説明ではない。','不適当。ラベルを付加してパケットを転送する方式はMPLSの特徴であり、RIPとは異なる仕組みである。'] },
  { id:'q210', group:'ネットワーク・情報', category:'IPネットワーク(経路選択)', chapter:'5章', stars:2, question:'IPネットワークで使用されるOSPFの特徴に関する記述として、適当なものはどれか。', options:['経路判断に通信帯域等を基にしたコストと呼ばれる重みパラメータを用いる','ディスタンス・ベクタ型のルーティング・プロトコルである','30秒ごとに配布される経路制御情報が180秒間待っても来ない場合には、接続が切れたと判断する','インターネットサービスプロバイダ間で使われるルーティング・プロトコルである'], answer:0, explanation:'OSPFは各リンクごとにコストという重みづけを設定し、コストの合計値が最少になるように経路を選択する。①が適当。OSPFはリンクステート型のルーティング・プロトコル(②不適当)。経路情報等の更新メッセージを30秒ごとに配信するのはRIP(③不適当)。プロバイダ間のルーティングはAS間で用いるEGPによって経路を選択する(④不適当)。', choiceNotes:['適当。OSPFは各リンクに通信帯域等を基にしたコストという重みを設定し、合計値が最小になる経路を選択するリンクステート型プロトコルである。','不適当。OSPFはリンクステート型のルーティングプロトコルであり、ディスタンス・ベクタ型ではない(ディスタンス・ベクタ型はRIP)。','不適当。30秒ごとに経路制御情報を配布し一定時間で断と判断するのはRIPの特徴であり、OSPFの動作ではない。','不適当。ISP間(自律システム間)で使われるルーティングプロトコルはEGP(BGP)であり、OSPFは主に自律システム内で使われる。'] },
  { id:'q211', group:'ネットワーク・情報', category:'IP電話(VoIP技術)', chapter:'5章', stars:2, question:'IPネットワークで使用されるVoIPに関する記述として、適当でないものはどれか。', options:['音声データに付加するヘッダとして、IPヘッダ、TCPヘッダ、RTPヘッダがある','アナログ信号である音声を、デジタル信号に変換する符号化方式にG.711がある','優先制御は、ルータが受け取った音声データのパケットを、他のデータのパケットよりも優先的に送信することである','呼制御は、回線の接続、切断、発呼や着呼等、電話をかけるための制御や、かけた相手を呼び出すための制御である'], answer:0, explanation:'デジタル音声を伝送するためのデータ構造では、第4層(トランスポート層)のプロトコルはTCPではなくUDPが用いられる。①が不適当(TCPではなくUDP)。', choiceNotes:['不適当。音声データの伝送にはリアルタイム性を優先するため、トランスポート層にTCPではなくUDPが用いられる。','適当。アナログ音声をデジタル信号に変換する代表的な符号化方式にG.711があり、正しい記述である。','適当。優先制御は音声パケットを他のデータパケットより優先的に送信する仕組みであり、正しい記述である。','適当。呼制御は回線の接続・切断、発着信等の電話をかけるための制御であり、正しい記述である。'] },
  { id:'q212', group:'ネットワーク・情報', category:'IP電話(VoIP技術)', chapter:'5章', stars:2, question:'IP電話等で使用されるSIPに関する記述として、適当でないものはどれか。', options:['SIPは、音声や動画等のリアルタイムデータを伝送するプロトコルである','SIPサーバは、プロキシサーバ、リダイレクトサーバ、登録サーバ、ロケーションサーバの機能で構成される','SIPメッセージは、スタートライン、ヘッダ、空白行、ボディで構成される','SIPメッセージの伝送には、トランスポート層のプロトコルである、UDPを使うことができる'], answer:0, explanation:'SIPは端末(UA)間でのセッションの生成、変更、切断のみを行うプロトコルであり、セッション確立後の音声データ等の伝送には関与しない。①が不適当(データ伝送は行わない)。', choiceNotes:['不適当。SIPはセッションの生成・変更・切断の制御のみを行うプロトコルで、音声や動画等のリアルタイムデータ自体の伝送は行わない。','適当。SIPサーバはプロキシサーバ、リダイレクトサーバ、登録サーバ、ロケーションサーバの機能で構成され、正しい記述である。','適当。SIPメッセージはスタートライン、ヘッダ、空白行、ボディで構成されるテキストベースの形式であり、正しい記述である。','適当。SIPメッセージの伝送にはUDPを使うことができ、TCPも使用可能であり、正しい記述である。'] },
  { id:'q213', group:'ネットワーク・情報', category:'情報保護(脅威)', chapter:'5章', stars:2, question:'サイバー攻撃に関する記述として、適当でないものはどれか。', options:['セッションハイジャックとは、他人のセッションIDを推測したり窃取することで、同じセッションIDを使用したHTTPリクエストによって、なりすましの通信を行う攻撃である','SQLインジェクションとは、ユーザからの入力値を用いてSQL文を組立てるWebアプリケーションの脆弱性を利用して、データベースを不正操作する攻撃である','バッファオーバフローとは、メモリ上のバッファ領域をあふれさせることによってWebサーバに送り込んだ不正なコードを実行させたり、データを書き換えたりする攻撃である','クロスサイトスクリプティングとは、Webアプリケーションを通じて、Webサーバ上でOSコマンドを不正に実行させる攻撃である'], answer:3, explanation:'クロスサイトスクリプティングとは、攻撃者が脆弱性のあるWebページに罠を仕掛け、一般ユーザがアクセスした際に個人情報を盗む等の攻撃。「Webアプリケーションを通じてWebサーバ上でOSコマンドを不正に実行させる攻撃」はOSコマンドインジェクションである。④が不適当。', choiceNotes:['適当。セッションハイジャックは他人のセッションIDを窃取・推測して、同じIDでなりすましのHTTPリクエストを行う攻撃であり、正しい記述である。','適当。SQLインジェクションは入力値を利用してSQL文を不正操作しデータベースを不正操作する攻撃であり、正しい記述である。','適当。バッファオーバフローはバッファ領域をあふれさせ不正コードを実行させたりデータを書き換えたりする攻撃であり、正しい記述である。','不適当。この説明はOSコマンドインジェクションの内容であり、クロスサイトスクリプティングは脆弱なWebページを利用しユーザ側で不正スクリプトを実行させる攻撃である。'] },
  { id:'q214', group:'ネットワーク・情報', category:'情報保護(脅威)', chapter:'5章', stars:2, question:'コンピュータネットワークの情報セキュリティのために使用されるIDSに関する記述として、適当でないものはどれか。', options:['アノマリ検知は、パケットの内容やホスト上の動作が既知の攻撃手法について、特徴的なパターンを登録したデータベースであるシグネチャと一致した場合に、攻撃と判定する','ネットワーク型IDSは、ネットワーク上に配置されて、ネットワークに流れるパケットを検査する','IDSは、ネットワークやサーバを監視し、侵入や攻撃等の不正なアクセスを検知した場合に、管理者へ通知する','IDSは、攻撃を検知できずに見逃してしまうことや、正常な通信や正常な動作を攻撃と誤検知してしまうことがある'], answer:0, explanation:'シグネチャと一致した場合に攻撃と判定するのはシグネチャ型の説明。アノマリ型は逆で、正常なパターンを登録しておき、これに外れた動作パターンを検知したときに攻撃と判断する。①が不適当。', choiceNotes:['不適当。既知の攻撃パターン(シグネチャ)と一致した場合に攻撃と判定するのはシグネチャ型の説明であり、アノマリ検知は正常な状態から外れた動作を検知する方式である。','適当。ネットワーク型IDSはネットワーク上に配置され、流れるパケットを検査する方式であり、正しい記述である。','適当。IDSはネットワークやサーバを監視し、不正アクセスを検知すると管理者へ通知する仕組みであり、正しい記述である。','適当。IDSには攻撃の見逃し(検知漏れ)や正常通信を攻撃と誤検知するケースがあり、正しい記述である。'] },
  { id:'q215', group:'ネットワーク・情報', category:'情報保護(暗号化)', chapter:'5章', stars:2, question:'公開鍵暗号方式に関する記述として、適当でないものはどれか。', options:['情報を公開鍵で暗号化して、それと対となっている秘密鍵で復号するので、秘密鍵を知らない第三者は、暗号文を復号することができないため情報の機密性を確保できる','代表的な公開鍵暗号アルゴリズムであるRSA暗号は、大きな数の素因数分解の困難性を利用した暗号方式である','n人がお互いに暗号文の交換を行うためには、n/2個の公開鍵と秘密鍵の対が必要となる','秘密鍵で暗号化した暗号文をそれと対となっている公開鍵で復号することができる'], answer:2, explanation:'1人が公開鍵暗号方式を構築したい場合には、公開鍵と秘密鍵のセットは1対だけ必要になる。2人であれば2対必要。n人が構築する際にはn対の鍵セットを用意する必要がある。n/2個とする③が不適当(n個)。', choiceNotes:['適当。公開鍵で暗号化した情報は対応する秘密鍵でしか復号できず、秘密鍵を持たない第三者は復号できないため機密性が確保される。','適当。RSA暗号は大きな数の素因数分解が困難であることを利用した代表的な公開鍵暗号アルゴリズムであり、正しい記述である。','不適当。n人が相互に暗号通信を行うには、各人が1対ずつ計n個の公開鍵と秘密鍵の対を用意する必要があり、n/2個ではない。','適当。秘密鍵で暗号化した文章は対となる公開鍵で復号でき、これはデジタル署名の仕組みとして利用される。'] },
  { id:'q216', group:'ネットワーク・情報', category:'情報保護(暗号化)', chapter:'5章', stars:2, question:'RSA暗号に関する記述として、適当なものはどれか。', options:['大きな数の素因数分解が困難であることを利用した方式である','離散対数問題を解くことが困難であることを利用した方式である','第2原像計算を解くことが困難であることを利用した方式である','部分集合和問題を解くことが困難であることを利用した方式である'], answer:0, explanation:'離散対数問題を解くことが困難であることを応用したのはElGamal暗号(②不適当)。第2原像計算を解くことが困難であることはハッシュ値の逆方向計算を難解にする手法として用いられている(③不適当)。RSA暗号は素因数分解の困難性を利用したもの。①が適当。', choiceNotes:['適当。RSA暗号は大きな数の素因数分解が困難であることを利用した暗号方式であり、正しい記述である。','不適当。離散対数問題の困難性を利用するのはElGamal暗号などであり、RSA暗号の原理ではない。','不適当。第2原像計算の困難性はハッシュ関数の一方向性に利用される性質であり、RSA暗号の原理ではない。','不適当。部分集合和問題(ナップザック問題)の困難性を利用するのはナップザック暗号であり、RSA暗号の原理ではない。'] },
  { id:'q217', group:'無線・放送', category:'無線アンテナ(基準アンテナ)', chapter:'5章', stars:2, question:'無線通信で使用する、アンテナの利得に関する次の記述の空欄の(ア)、(イ)に当てはまる語句の組み合わせとして、適当なものはどれか。「アンテナの利得は、同じ入力電力を与えたときの、アンテナの最大輻射電力と基準アンテナの最大輻射電力の比で与えられ、基準アンテナを全方向に均等に電波を放射する(ア)アンテナとしたときの利得を(イ)利得という。」', options:['(ア)半波長ダイポール (イ)相対','(ア)半波長ダイポール (イ)絶対','(ア)等方性 (イ)相対','(ア)等方性 (イ)絶対'], answer:3, explanation:'等方性アンテナと比較した場合を絶対利得と定義している。それに対し、半波長ダイポールアンテナと比較した場合は相対利得と呼ばれる。等方性アンテナとは前後左右上下斜めの全方向に均等に電波を放射する豆粒のような空中線モデルのこと。④が適当。', choiceNotes:['不適当。半波長ダイポールアンテナを基準とする利得は相対利得と呼ばれ、全方向均等放射の基準は等方性アンテナである。','不適当。全方向に均等放射する基準アンテナは等方性アンテナであり、半波長ダイポールアンテナを基準とする利得は絶対利得ではなく相対利得である。','不適当。等方性アンテナを基準とする利得は相対利得ではなく絶対利得と呼ばれる。','適当。全方向に均等に電波を放射する等方性アンテナを基準とした利得を絶対利得と呼び、正しい組み合わせである。'] },
  { id:'q218', group:'無線・放送', category:'無線アンテナ(基準アンテナ)', chapter:'5章', stars:2, question:'半波長ダイポールアンテナに関する記述として、適当なものはどれか。', options:['放射抵抗は、600Ωである','導波器、放射器、反射器で構成されるアンテナである','アンテナ素子を水平に設置した場合の水平面内指向性は、8の字の特性となる','絶対利得は、40dBiである'], answer:2, explanation:'半波長ダイポールアンテナの放射抵抗は約73Ωで600Ωではない(①不適当)。導波器、放射器、反射器の3本の要素で構成されるものは八木アンテナ(②不適当)。指向性はエレメント(素子)の直角方向に広がり、水平に置いた場合の水平面内指向性は8の字の特性で③が適当。絶対利得は2.15dB(④不適当)。', choiceNotes:['不適当。半波長ダイポールアンテナの放射抵抗は約73Ωであり、600Ωではない(600Ωは平行二線式給電線の特性インピーダンス等に近い値)。','不適当。導波器・放射器・反射器の3要素で構成されるのは八木アンテナであり、半波長ダイポールアンテナ単体の構成ではない。','適当。半波長ダイポールアンテナを水平設置した場合の水平面内指向性は8の字形の特性を示し、正しい記述である。','不適当。半波長ダイポールアンテナの絶対利得は約2.15dBiであり、40dBiという極めて高い値ではない。'] },
  { id:'q219', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'八木アンテナに関する記述として、適当でないものはどれか。', options:['導波器の本数を増やすことで、指向性を鋭くすることができる','放射器から見て、導波器の方向に電波を発射する','導波器の長さは放射器よりやや長い','放射器に給電し、反射器と導波器は無給電素子として動作する'], answer:2, explanation:'八木アンテナの基本形は3本の棒状のエレメントで構成され、中央の放射器は半波長ダイポールアンテナ。給電は放射器の中央部に行い、導波器と反射器には給電しない。電波は放射器から見て導波器のある方向へ進行する。3本のエレメントは長さが異なり、導波器は放射器より少し短く、逆に反射器は少し長い。したがって③が不適当。', choiceNotes:['適当。導波器の本数を増やすと指向性が鋭くなり利得が向上する特性があり、正しい記述である。','適当。八木アンテナは放射器から見て導波器のある方向に電波を発射する指向性を持ち、正しい記述である。','不適当。導波器の長さは放射器よりやや短く設計されており、「やや長い」は誤りである(反射器がやや長い)。','適当。給電するのは放射器のみで、反射器と導波器は無給電素子として動作しており、正しい記述である。'] },
  { id:'q220', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'無線通信で使用するアンテナに関する記述として、適当なものはどれか。', options:['オフセットパラボラアンテナは、回転放物面の主反射鏡、回転双曲面の副反射鏡、1次放射器で構成されたアンテナである','八木アンテナは、導波器、放射器、反射器からなり、導波器に給電する','ブラウンアンテナは、同軸ケーブルの内部導体を1/4波長だけ上に延ばして放射素子とし、同軸ケーブルの外部導体に長さ1/4波長の地線を放射状に複数本付けたものである','スリーブアンテナは、同軸ケーブルの内部導体を1/8波長だけ上に延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さが1/8波長の円筒導体をかぶせたものである'], answer:2, explanation:'オフセットパラボラアンテナの構成は回転放物面の主反射鏡と1次放射器で、回転双曲面の副反射鏡は用いない(①不適当)。八木アンテナの給電は放射器(輻射器)に行う(②不適当)。ブラウンアンテナは放射素子・地線ともに1/4波長で③が適当。スリーブアンテナの放射素子・円筒導体の長さはどちらも1/4波長(④不適当)。', choiceNotes:['不適当。オフセットパラボラアンテナは主反射鏡と一次放射器のみで構成され、回転双曲面の副反射鏡は用いない(副反射鏡を用いるのはカセグレンアンテナ)。','不適当。八木アンテナで給電するのは放射器であり、導波器には給電しない。','適当。ブラウンアンテナは同軸ケーブルの内部導体を1/4波長延ばして放射素子とし、外部導体に1/4波長の地線を放射状に複数付けた構造であり、正しい記述である。','不適当。スリーブアンテナの放射素子・円筒導体の長さはいずれも1/4波長であり、1/8波長ではない。'] },
  { id:'q221', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'無線通信で使用するアンテナに関する記述として、不適当なものはどれか。', options:['ホイップアンテナは、自動車、電車、航空機、船舶等の金属体を利用して設置される1/4波長垂直接地アンテナである','スリーブアンテナは、同軸ケーブルの内部導体を1/4波長延ばして放射素子とし、さらに同軸ケーブルの外部導体に長さが1/4波長の円筒導体を設けたものである','ブラウンアンテナは、水平面内の指向性が無指向性である','コーナレフレクタアンテナは、反射器を利用して指向性を広くしている'], answer:3, explanation:'コーナレフレクタアンテナは、半波長ダイポールアンテナの後部に折り曲げた金属板を鏡として配置した空中線で、反射板により電界成分が合成されて単一の方向へ放たれる。つまり反射器を利用して指向性を狭くしており、④が不適当。その他のホイップアンテナ、スリーブアンテナ、ブラウンアンテナの説明は適当。', choiceNotes:['適当。ホイップアンテナは車体等の金属体を接地面として利用する1/4波長垂直接地アンテナであり、正しい記述である。','適当。スリーブアンテナは内部導体を1/4波長延ばし外部導体に1/4波長の円筒導体を設けた構造であり、正しい記述である。','適当。ブラウンアンテナの水平面内指向性は無指向性であり、正しい記述である。','不適当。コーナレフレクタアンテナは反射器で電界を単一方向に合成し指向性を狭く(鋭く)するアンテナであり、「指向性を広くしている」は誤り。'] },
  { id:'q222', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'無線通信で使用する、アンテナに関する記述として、適当でないものはどれか。', options:['八木アンテナは、1/2波長ダイポールアンテナを放射器として中央に置き、その後方約1/4波長のところに反射器、前方約1/4波長のところに導波器を配置したアンテナである','フェーズドアレイアンテナは、複数のアンテナ素子を並べ、各アンテナ素子への励振電力を調整することで、ビーム方向を変えることができるアンテナである','オフセットパラボラアンテナは、伝送路となるパラボラ反射鏡の前面を避けた位置に一次放射器を置くことで、サイドローブ特性を改善している','ブラウンアンテナは、同軸ケーブルの内部導体を1/4波長だけ上に伸ばして放射素子とし、同軸ケーブルの外部導体に長さ1/4波長の地線を放射状に複数本付けたものである'], answer:1, explanation:'フェーズドアレイアンテナは、平面上に複数の放射素子を並べて固定し、各素子の上流方にデジタル移相器を設けて、給電電流の励振位相を変化させて電波を放射する。放射された電波が合成されることで主ビームを任意の方向に向けるよう制御される。励振電力ではなく励振位相を調整するため②が不適当。その他の選択肢の記述はいずれも適当。', choiceNotes:['適当。八木アンテナは中央に放射器、後方約1/4波長に反射器、前方約1/4波長に導波器を配置する構成であり、正しい記述である。','不適当。フェーズドアレイアンテナは各素子への励振電力ではなく励振位相を調整することでビーム方向を制御するアンテナである。','適当。オフセットパラボラアンテナは一次放射器を反射鏡前面から外すことでサイドローブ特性を改善しており、正しい記述である。','適当。ブラウンアンテナは内部導体を1/4波長延ばした放射素子と外部導体の1/4波長の地線から構成され、正しい記述である。'] },
  { id:'q223', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'パラボラアンテナに関する記述として、適当でないものはどれか。', options:['アンテナの性能を測定するための、基準アンテナとして用いられる','特定方向に電波をビーム状に放射したり、特定方向からの電波を高感度で受信できる','衛星通信やマイクロ波通信等では、利得の高いアンテナとして広く用いられている','放物面をもつ反射器と一次放射器から構成されるアンテナである'], answer:0, explanation:'パラボラアンテナは指向性が強く、電波を細く高密度(ペンシルビーム)で放射でき、送受信局が1対1の関係になるマイクロ波通信等で採用例が多い。他の空中線の性能を測定するための基準アンテナとして活用するのは電磁ホーンアンテナであり、パラボラを用いることは一般にはない。したがって①が不適当。', choiceNotes:['不適当。他アンテナの性能測定用の基準アンテナとして用いられるのは電磁ホーンアンテナ等であり、パラボラアンテナが基準として使われることは一般的ではない。','適当。パラボラアンテナは特定方向にビーム状の電波を放射・高感度受信でき、正しい記述である。','適当。パラボラアンテナは利得が高く、衛星通信やマイクロ波通信で広く用いられており、正しい記述である。','適当。パラボラアンテナは放物面をもつ反射器と一次放射器から構成されており、正しい記述である。'] },
  { id:'q224', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'パラボラアンテナに関する記述として、適当なものはどれか。', options:['放物面をもつ反射器と、一次放射器から構成されるアンテナである','放射器の後方にV型の反射器を配置したアンテナである','反射器、放射器、導波器で構成されるアンテナである','複数のアンテナ素子をある間隔で並べ、各アンテナ素子に給電するアンテナである'], answer:0, explanation:'パラボラアンテナは反射鏡を用いた空中線で、反射鏡には2次曲線(放物線)を回転させた回転放物面を採用し、焦点に一次放射器(電磁ホーンアンテナ)を配する。①が適当。放射器の後方にV型の反射器を配置したのはコーナレフレクタアンテナ(②不適当)。反射器・放射器・導波器の3要素で構成されるのは八木アンテナ(③不適当)。複数素子に給電する方式の一例は対数周期アンテナ(④不適当)。', choiceNotes:['適当。パラボラアンテナは放物面をもつ反射器と一次放射器から構成されるアンテナであり、正しい記述である。','不適当。放射器の後方にV型反射器を配置する構造はコーナレフレクタアンテナの説明であり、パラボラアンテナではない。','不適当。反射器・放射器・導波器の3要素で構成されるのは八木アンテナであり、パラボラアンテナの構成ではない。','不適当。複数のアンテナ素子を並べて給電する方式は対数周期アンテナ等の説明であり、パラボラアンテナの構成ではない。'] },
  { id:'q225', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'無線通信で使用するアンテナに関する記述として、適当なものはどれか。', options:['オフセットパラボラアンテナは、伝送路となるパラボラ反射鏡の前面に一次放射器を置かないことで、サイドローブ特性を改善している','折り返し半波長ダイポールアンテナの放射抵抗は、半波長ダイポールアンテナの約2倍になる','スリーブアンテナは、同軸ケーブルの内導体を1/8波長延ばして放射素子とし、さらに同軸ケーブルの外側導体に長さが1/8波長の円筒導体を設けることで、1波長のアンテナとして動作させるものである','八木アンテナは、導波器、放射器、反射器からなり、導波器に給電する'], answer:0, explanation:'折り返し半波長ダイポールアンテナの放射抵抗は約292Ωで、半波長ダイポールアンテナの約73Ωの4倍(②不適当)。スリーブアンテナの長さはどちらも1/4波長で、全体として半波長アンテナと等価(③不適当)。八木アンテナの給電は放射器に行う(④不適当)。オフセットパラボラアンテナは主反射鏡の一部を切り取った形にして伝播路から障害物を外しており、①が適当。', choiceNotes:['適当。オフセットパラボラアンテナは反射鏡前面から一次放射器を外すことで電波の障害を避けサイドローブ特性を改善しており、正しい記述である。','不適当。折り返し半波長ダイポールアンテナの放射抵抗は約292Ωで、半波長ダイポールアンテナ(約73Ω)の約4倍であり、約2倍ではない。','不適当。スリーブアンテナの内導体延長と円筒導体はいずれも1/4波長であり、全体で半波長アンテナと等価に動作する構造で、1/8波長・1波長という説明は誤り。','不適当。八木アンテナで給電するのは放射器であり、導波器には給電しない。'] },
  { id:'q226', group:'無線・放送', category:'無線アンテナ', chapter:'5章', stars:2, question:'無線通信で使用する、アンテナの指向性に関する記述として、適当でないものはどれか。', options:['半波長ダイポールアンテナは、アンテナ導体の垂直方向が強くなる、8の字形の指向性を持つ','カセグレンアンテナの垂直面内の指向性は、無指向性である','ブラウンアンテナの水平面内の指向性は、無指向性である','八木アンテナは、放射器から見て、導波器の方向に最も強い指向性を持つ'], answer:1, explanation:'カセグレンアンテナは、一次放射器と反射鏡との間に副反射鏡を挟んだパラボラアンテナの派生形で、大地雑音の直接混入を減らすことができる。パラボラアンテナの派生形であり鋭い指向性を持つため、②が不適当。', choiceNotes:['適当。半波長ダイポールアンテナはエレメント直角方向が強くなる8の字形の指向性を持ち、正しい記述である。','不適当。カセグレンアンテナはパラボラアンテナの派生形で鋭い指向性を持つアンテナであり、垂直面内の指向性が無指向性という記述は誤り。','適当。ブラウンアンテナの水平面内指向性は無指向性であり、正しい記述である。','適当。八木アンテナは放射器から見て導波器の方向に最も強い指向性を持ち、正しい記述である。'] },
  { id:'q227', group:'無線・放送', category:'気象レーダ', chapter:'5章', stars:2, question:'レーダにより降雨観測を行うレーダ雨量計に関する記述として、適当でないものはどれか。', options:['レーダ雨量計で観測する雨等の方位は、パラボラアンテナの方位角から求める','二重偏波レーダは、送信波と受信波の周波数のずれを観測することで雨等の移動速度を観測するレーダである','Cバンドレーダ雨量計は、Xバンドレーダ雨量計よりも観測範囲が広い','Cバンドレーダ雨量計は、Xバンドレーダ雨量計よりも直径の大きなパラボラアンテナが使われている'], answer:1, explanation:'二重偏波方式は、偏波を水平面と垂直面の2面に用意し、両波を同時に送信して大気中の雨粒で反射した電波を受信する。この際に両波の受信波の位相のずれを測定することで雨量強度を算出する。周波数のずれではないため②が不適当。Cバンド(5.3GHz帯・半径300km)はXバンド(9.3〜9.4GHz帯・半径50km)より観測範囲が広く、パラボラアンテナの直径も大きい(約4.3m対約2m)。', choiceNotes:['適当。レーダ雨量計はパラボラアンテナの方位角から観測対象(雨等)の方位を求めており、正しい記述である。','不適当。二重偏波レーダは送受信波の周波数のずれではなく、水平・垂直2偏波の受信波の位相差(偏波間位相差)から降雨強度を観測する方式である。','適当。Cバンド(5.3GHz帯、半径約300km)はXバンド(9.3〜9.4GHz帯、半径約50km)より観測範囲が広く、正しい記述である。','適当。Cバンドレーダのパラボラアンテナ(約4.3m)はXバンド(約2m)より直径が大きく、正しい記述である。'] },
  { id:'q228', group:'無線・放送', category:'気象レーダ', chapter:'5章', stars:2, question:'レーダ雨量計で利用されているMPレーダ(マルチパラメータレーダ)に関する記述として、適当でないものはどれか。', options:['MPレーダは、落下中の雨滴がつぶれた形をしている性質を利用し、偏波間位相差から高精度に降雨強度を推定している','MPレーダは、水平偏波と垂直偏波の電波を交互に送受信して観測する気象レーダである','偏波間位相差は、Xバンドのほうが弱から中程度の雨でも敏感に反応するため、XバンドMPレーダは電波が完全に消散して観測不可能とならない限り高精度な降雨強度推定ができる','XバンドのMPレーダでは、降雨減衰の影響により観測不能となる領域が発生する場合があるが、レーダのネットワークを構築し、観測不能となる領域を別のレーダでカバーすることにより解決している'], answer:1, explanation:'水平偏波と垂直偏波の電波は同時に送受信している。交互ではない。交互の送受信では、瞬間値に誤差が発生してしまうため②が不適当。雨滴は落下時に空気抵抗を受けて水平方向に扁平し、衝突するときの両偏波間の位相差を測定して降雨強度を算出する(①適当)。', choiceNotes:['適当。MPレーダは落下中の雨滴が偏平になる性質を利用し、偏波間位相差から高精度に降雨強度を推定しており、正しい記述である。','不適当。MPレーダは水平偏波と垂直偏波を同時に送受信して観測しており、交互に送受信する方式ではない(交互送受信では瞬間値に誤差が生じる)。','適当。偏波間位相差はXバンドの方が弱〜中程度の雨に敏感に反応し、電波が完全に消散しない限り高精度な推定ができ、正しい記述である。','適当。Xバンドは降雨減衰により観測不能領域が生じ得るが、レーダネットワークで別のレーダがカバーする運用がされており、正しい記述である。'] },
  { id:'q229', group:'ネットワーク・情報', category:'無線LAN', chapter:'5章', stars:2, question:'無線LAN(IEEE802.11標準)において、OFDMと呼ばれる規格の変調方式として正しいものはどれか。', options:['周波数ホッピング','直接拡散','シングルキャリア','マルチキャリア'], answer:3, explanation:'OFDMは直交周波数分割多重変調の意で、免許されている周波数(キャリア)をさらに細かいサブキャリアに分け、その1本1本を各ユーザに割り当てる。複数のキャリアを用いて通信することから「マルチキャリア」と呼ばれ、④が正しい。周波数ホッピング(FHSS)と直接拡散(DSSS)はスペクトル拡散変調を行うCDMの方式。', choiceNotes:['不適当。周波数ホッピング(FHSS)はスペクトル拡散変調の一種であり、OFDMの変調方式ではない。','不適当。直接拡散(DSSS)もスペクトル拡散変調の一種であり、OFDMの変調方式ではない。','不適当。OFDMは複数のサブキャリアを用いるマルチキャリア方式であり、単一搬送波によるシングルキャリア方式ではない。','適当。OFDMは周波数を細かいサブキャリアに分割し複数のキャリアで通信するマルチキャリア方式であり、正しい記述である。'] },
  { id:'q230', group:'ネットワーク・情報', category:'無線LAN', chapter:'5章', stars:2, question:'無線LANのアクセス制御に用いられるCSMA/CA方式に関する記述として、適当なものはどれか。', options:['送信ノードは、データの衝突を検知した場合は、データの送信を中止し、ランダムな時間だけ待機した後に、データの送信を再開する','情報をセルと呼ばれる固定長の伝送単位に分割して、ヘッダの宛先情報に基づいて伝送する','送信ノードは衝突検知ができないため、受信ノードからの肯定応答信号により、送信データが受信ノードに正しく届いたことを確認する','伝送路上を巡回しているトークンと呼ばれるデータを取得したノードだけが送信権を得ることで、データの衝突を回避する'], answer:2, explanation:'無線LANの場合は、各送信ノードは自分が送信したデータが衝突したかどうかの検知ができないため、衝突を前提とした設計になっている。送信ノードは衝突の有無にかかわらず、ランダムな時間だけ待機した後に送信を行う(①不適当)。②はATM(非同期転送モード)の説明。CSMA/CAではランダム時間の待機後にデータを送信し、相手方から肯定応答信号(ACK)を受信することで正常通信を把握する。③が適当。④はトークンパッシング方式の説明。', choiceNotes:['不適当。無線LANでは送信ノードが衝突を検知できないため、衝突検知を前提とした動作ではなく、常にランダム時間待機後に送信する仕組みになっている。','不適当。情報を固定長のセルに分割しヘッダの宛先情報に基づき伝送するのはATM(非同期転送モード)の説明であり、CSMA/CAではない。','適当。無線LANでは送信ノードが衝突検知できないため、受信ノードからの肯定応答(ACK)により正しく届いたことを確認する仕組みであり、正しい記述である。','不適当。トークンと呼ばれるデータを取得したノードのみが送信権を得るのはトークンパッシング方式の説明であり、CSMA/CAとは異なる。'] },
  { id:'q231', group:'ネットワーク・情報', category:'無線LAN', chapter:'5章', stars:2, question:'無線LANの認証で使われる規格IEEE802.1Xに関する記述として、適当でないものはどれか。', options:['EAP-PEAPは、TLSハンドシェイクの仕組みを利用する認証方式である','EAP-TTLSのクライアント認証は、ユーザ名とパスワードにより行う','EAP-MD5は、サーバ認証とクライアント認証の相互認証である','EAP-TLSのクライアント認証は、クライアントのデジタル証明書を検証することで行う'], answer:2, explanation:'数あるEAP方式の中でも、EAP-MD5だけはサーバ側の認証を行わない。したがって送信した情報が第三者に盗み取られるリスクがある。MD5以外の方式はいずれも相互認証の機能を持っている。③が不適当。', choiceNotes:['適当。EAP-PEAPはTLSハンドシェイクの仕組みを利用してセキュアなトンネルを構築する認証方式であり、正しい記述である。','適当。EAP-TTLSのクライアント認証はユーザ名とパスワードにより行われ、正しい記述である。','不適当。EAP-MD5はクライアント認証のみを行いサーバ認証を行わない方式であり、相互認証ではないため盗聴等のリスクがある。','適当。EAP-TLSのクライアント認証はクライアントのデジタル証明書を検証することで行われ、正しい記述である。'] },
  { id:'q232', group:'ネットワーク・情報', category:'無線LAN', chapter:'5章', stars:2, question:'無線LANの認証に関する記述として、適当でないものはどれか。', options:['IEEE802.1Xで用いられるEAP-TTLSのクライアント認証は、SSIDによる認証である','WPA-EAPやWPA2-EAPは、認証サーバによる認証方法である','WPA-PSKやWPA2-PSKは、IEEE802.1Xを利用しない認証方法である','IEEE802.1Xで用いられるEAP-MD5のクライアント認証は、パスワード認証である'], answer:0, explanation:'EAP-TTLS方式では、クライアント認証はユーザIDとパスワードの組み合わせを照合することによって行う。SSIDを用いた形ではないため①が不適当。パーソナルモード(WPA-PSK、WPA2-PSK)はAPとクライアント端末間でPSKという秘密鍵を生成して認証の手順を進め、IEEE802.1Xを利用しない(③適当)。', choiceNotes:['不適当。EAP-TTLSのクライアント認証はユーザIDとパスワードの組み合わせにより行われ、SSIDによる認証ではない。','適当。WPA-EAPやWPA2-EAPは認証サーバ(RADIUS等)を用いる認証方式であり、正しい記述である。','適当。WPA-PSKやWPA2-PSKはAP・端末間で共有鍵(PSK)を用いる方式でIEEE802.1Xを利用せず、正しい記述である。','適当。EAP-MD5のクライアント認証はパスワードによる認証であり、正しい記述である。'] },
  { id:'q233', group:'無線・放送', category:'衛星通信', chapter:'5章', stars:2, question:'静止衛星通信に関する記述として、適当なものはどれか。', options:['静止衛星は、赤道上空およそ36,000〔km〕の円軌道を約12時間かけて周回する','静止軌道上に2機の衛星を配置すれば、北極、南極付近を除く地球上の大部分を対象とする、世界的な通信網を構築できる','衛星通信には、電波の窓と呼ばれる周波数である1〜10〔GHz〕の電波しか使用できない','アップリンク周波数よりダウンリンク周波数のほうが低い'], answer:3, explanation:'静止衛星は地球の自転と同じサイクルで公転しており、公転周期は約24時間(①不適当)。北極と南極地域を除き世界のほぼ全域を網羅するためには、通信用の衛星は最低でも3個は必要(②不適当)。1GHz〜10GHzは「電波の窓」と呼ばれるが、静止衛星との通信はもっと高い10GHz以上の周波数を用いるケースが多い(③不適当)。したがって④が適当。', choiceNotes:['不適当。静止衛星は地球の自転周期と同じ約24時間で赤道上空約36,000kmの円軌道を周回しており、約12時間ではない。','不適当。北極・南極付近を除く地球全域をカバーするには最低3機の静止衛星が必要であり、2機では不十分である。','不適当。1〜10GHzは電波の窓と呼ばれる帯域だが、実際の衛星通信ではそれより高い10GHz以上の周波数も広く使われており、1〜10GHzのみに限定されない。','適当。降雨減衰対策等から、一般にアップリンク周波数の方がダウンリンク周波数より高く設定されており、ダウンリンクの方が低い。'] },
  { id:'q234', group:'無線・放送', category:'衛星通信', chapter:'5章', stars:2, question:'衛星通信に関する記述として、適当でないものはどれか。', options:['静止衛星の軌道は、赤道面にあることから、高緯度地域においては仰角(衛星を見上げる角度)が低くなり、建造物等により衛星と地球局との間の見通しを確保することが難しくなる','複数の地球局が同一周波数で同一帯域幅の信号を使用するFDMAによる多元接続方式は、回線ごとに異なる時間を割り当てて送受信する方式である','トランスポンダは、衛星が受信した微弱な信号の増幅、受信周波数から送信周波数への周波数変換および信号波の電力増幅を行う','衛星通信では、電波干渉を避けるため、地球局から衛星への無線回線と、衛星から地球局への無線回線に異なる周波数帯の電波を使用している'], answer:1, explanation:'1本の搬送波周波数を複数のユーザが共有し、各ユーザが自分の持ち時間にのみ通信を行う方式はTDMA(時分割多元接続)である。②の記述はTDMA方式の説明であり不適当。FDMAは免許された周波数帯をさらに細かく分割して各ユーザに割り当てる周波数分割多元接続方式。', choiceNotes:['適当。静止衛星は赤道面上にあるため高緯度地域では仰角が低くなり、建造物等により見通し確保が難しくなることがあり、正しい記述である。','不適当。同一周波数・同一帯域幅を複数地球局が共有し回線ごとに異なる時間を割り当てるのはTDMAの説明であり、FDMAは周波数を分割して割り当てる方式である。','適当。トランスポンダは受信した微弱信号の増幅、周波数変換、送信のための電力増幅を行う中継機能であり、正しい記述である。','適当。電波干渉を避けるためアップリンクとダウンリンクには異なる周波数帯を使用しており、正しい記述である。'] },
  { id:'q235', group:'有線・線路施工', category:'ディスプレイ', chapter:'5章', stars:2, question:'液晶ディスプレイに関する記述として、適当でないものはどれか。', options:['液晶ディスプレイは、液晶を透明電極で挟み、電圧を加えると液晶の分子配列が変わり、光が通過したり遮断されたりする原理を利用している','カラー表示は、透明電極の外側に取り付けたカラーフィルタにより、画素ごとにRGBの三原色を作ることで行う','IPS方式は、電圧をかけない状態では液晶分子はねじれているが、電圧をかけると液晶分子のねじれがなくなることを利用するものであるが視野角が狭い','液晶自体は発光しないため、LEDや蛍光管によるバックライトから放出された光が液晶を通過することで、文字や画像を表示させる'], answer:2, explanation:'電圧をかけない状態で液晶が捻じれた形で並び、電圧印加でねじれがなくなるのは一般的なTN方式の説明。IPS方式は構造が異なり、TN方式の弱点だった視野角の狭さを大幅に改善している。したがって③が不適当。', choiceNotes:['適当。液晶を透明電極で挟み電圧印加で分子配列を変化させ光の通過・遮断を制御する原理であり、正しい記述である。','適当。カラー表示は透明電極外側のカラーフィルタにより画素ごとにRGBの三原色を作ることで実現され、正しい記述である。','不適当。電圧無印加時に液晶分子がねじれ、電圧印加でねじれが解消される方式はTN方式の説明であり、IPS方式はこれと構造が異なり視野角の狭さを改善した方式である。','適当。液晶自体は発光しないためLEDや蛍光管のバックライトの光を通過させて表示しており、正しい記述である。'] },
  { id:'q236', group:'有線・線路施工', category:'ディスプレイ', chapter:'5章', stars:2, question:'ディスプレイに関する記述として、適当でないものはどれか。', options:['液晶ディスプレイは、液晶を透明電極で挟み、電圧を加えると分子配列が変わり、光が通過したり遮断されたりする原理を利用している','有機ELディスプレイは、キセノンガス等のガスが封入された微小空間で放電によりガスがプラズマ状態となり、紫外線が発生し、その紫外線を蛍光体に当てて可視光を発生させる','液晶ディスプレイは、液晶自体は発光しないため、LEDや蛍光管によるバックライトから放出された光が液晶を通過することで、文字や画像を表示させる','有機ELディスプレイは、液晶ディスプレイよりも薄型化が可能である'], answer:1, explanation:'有機ELディスプレイの「EL」とは電子発光という意味で、素子自体が発光するため液晶ディスプレイのようなバックライトを必要とせず、薄型化を実現できる。②の記述はプラズマディスプレイの説明であり不適当。', choiceNotes:['適当。液晶を透明電極で挟み電圧印加で分子配列を変化させ光の通過・遮断を制御する原理であり、正しい記述である。','不適当。ガスの放電でプラズマ状態を作り紫外線から蛍光体を発光させる仕組みはプラズマディスプレイの説明であり、有機ELディスプレイの原理ではない(有機ELは素子自体が発光する)。','適当。液晶自体は発光しないためバックライトの光を通過させて表示しており、正しい記述である。','適当。有機ELディスプレイは素子自体が発光しバックライトが不要なため、液晶ディスプレイより薄型化が可能であり、正しい記述である。'] },
  { id:'q237', group:'ネットワーク・情報', category:'信頼性設計', chapter:'5章', stars:2, question:'信頼性設計の考え方であるフェールセーフに関する記述として、適当なものはどれか。', options:['構成部品の品質を高めたり、十分なテストを行ったりして、故障や障害の原因となる要素を取り除くことで信頼性を向上させることである','故障や操作ミス、設計上の不具合等の障害が発生することをあらかじめ予測しておき、障害が生じてもできるだけ安全な状態に移行する仕組みにすることである','システムの一部に障害が発生しても、予備系統への切り替え等によりシステムの正常な稼働を維持することである','利用者が操作や取り扱い方を誤っても危険が生じない、あるいは、誤った操作や危険な使い方ができないような構造や仕掛けを、設計段階で組み込むことである'], answer:1, explanation:'①はフォールトアボイダンスで、そもそも「故障させない」前提で設計されるもの。フェールセーフのキーワードは「安全な状態」で、故障等が発生することを前提に安全に停止させることを目標とした考え方であり、②が適当。③はフェールオーバで、故障時はあらかじめ待機している予備系の設備に切り替えて運用を継続する。④はフールプルーフの説明。', choiceNotes:['不適当。部品品質向上や十分なテストで故障要因自体を取り除く考え方はフォールトアボイダンスの説明であり、フェールセーフではない。','適当。フェールセーフは故障や誤操作の発生を前提に、障害発生時にできるだけ安全な状態へ移行させる設計思想であり、正しい記述である。','不適当。予備系統への切り替えで正常稼働を維持する考え方はフェールオーバの説明であり、フェールセーフではない。','不適当。誤操作や危険な使い方ができない構造にする考え方はフールプルーフの説明であり、フェールセーフではない。'] },
  { id:'q238', group:'ネットワーク・情報', category:'信頼性設計', chapter:'5章', stars:2, question:'信頼性設計の考え方であるフェールソフトに関する記述として、適当なものはどれか。', options:['システムの一部に障害が発生した場合、障害が発生した部分を切り離して、機能や性能を低下させても、システムの稼働を継続できるようにすることである','利用者が操作や取り扱い方を誤っても危険が生じない、あるいは、誤った操作や危険な使い方ができないような構造や仕掛けを、設計段階で組み込むことである','故障や操作ミス、設計上の不具合等の障害が発生することをあらかじめ予測しておき、障害が生じてもできるだけ安全な状態に移行する仕組みにすることである','障害や故障が発生しても、外部に影響が出ないような仕組みにする設計思想のこと。故障の発生を他の装置から隠ぺいして、誤った処理結果の流出を防止する'], answer:0, explanation:'1つ目の記述はフェールソフトの説明で、キーワードは「切り離す」。別名を縮退運転ともいい、一例として航空機のエンジンは1台が故障しても残った1台で飛行を継続できる仕組みになっている。①が適当。②はフールプルーフ、④はフォールトマスキングの説明。', choiceNotes:['適当。フェールソフトは障害部分を切り離し機能・性能を低下させても稼働を継続する設計思想(縮退運転)であり、正しい記述である。','不適当。誤操作しても危険が生じない構造にする考え方はフールプルーフの説明であり、フェールソフトではない。','不適当。障害発生を前提に安全な状態へ移行する考え方はフェールセーフの説明であり、フェールソフトではない。','不適当。障害の発生を他装置から隠蔽し誤った結果の流出を防ぐ考え方はフォールトマスキングの説明であり、フェールソフトではない。'] },
  { id:'q239', group:'有線・線路施工', category:'低圧配線', chapter:'6章', stars:1, question:'電気設備において、低圧の幹線および配線に関する記述として、電気設備の技術基準の解釈上、誤っているものはどれか。ただし、負荷には電動機またはこれに類する起動電流が大きい電気機械器具は接続されていないものとする。', options:['低圧幹線の電線は、供給される負荷である電気使用機械器具の定格電流の合計値以上の許容電流のものを施設した','低圧分岐回路の電線の許容電流が、その電線に接続する低圧幹線を保護する過電流遮断器の定格電流の35%であるため、低圧幹線の分岐点から9mの箇所に分岐回路を保護する過電流遮断器を施設した','低圧幹線の電源側電路に施設する過電流遮断器は、当該低圧幹線に使用する電線の許容電流よりも低い値の定格電流のものを施設した','低圧分岐回路の電線の許容電流が、その電線に接続する低圧幹線を保護する過電流遮断器の定格電流の30%であるため、低圧幹線の分岐点から3mの箇所に分岐回路を保護する過電流遮断器を施設した'], answer:1, explanation:'分岐回路で使用する電線の許容電流値(Iw)が幹線遮断器の定格電流値IBの55%以上であれば距離に制限はない。IwがIBの55%未満で35%以上であれば、過電流遮断器と分岐点との距離は8m以下とする必要がある。9mでは不可のため②が誤り。35%未満の場合は3m以下としなければならない。', choiceNotes:['正しい。低圧幹線の電線は、供給される負荷である電気使用機械器具の定格電流の合計値以上の許容電流のものを施設する必要があり、規定通りである。','誤り。分岐回路電線の許容電流が幹線遮断器定格電流の35%以上55%未満の場合、分岐点から過電流遮断器までの距離は8m以下としなければならず、9mは基準を超え違反となる。','正しい。低圧幹線の電源側に施設する過電流遮断器は、当該幹線の電線の許容電流以下の定格電流のものを施設する必要があり、規定通りである。','正しい。分岐回路電線の許容電流が幹線遮断器定格電流の35%未満の場合、分岐点から過電流遮断器までの距離は3m以下とする必要があり、規定通りである。'] },
  { id:'q240', group:'有線・線路施工', category:'低圧配線', chapter:'6章', stars:1, question:'電気設備において、低圧幹線の施設や低圧分岐回路等の施設に関する記述として、「電気設備の技術基準の解釈」上、誤っているものはどれか。ただし、負荷には電動機またはこれに類する起動電流が大きい電気機械器具は接続されていないものとする。', options:['低圧幹線の電源側電路に施設する過電流遮断器には、当該低圧幹線の許容電流以下の定格電流のものを使用する','低圧分岐回路の電線の許容電流が、低圧幹線を保護する過電流遮断器の定格電流の35%であるため、低圧幹線の分岐点からの電線の長さが8mの箇所に低圧分岐回路を保護する過電流遮断器を施設する','低圧幹線の電線として、当該低圧幹線を通じて供給される電気使用機械器具の定格電流の合計値以上の許容電流のものを使用する','低圧分岐回路の電線の許容電流が、低圧幹線を保護する過電流遮断器の定格電流の30%であるため、低圧幹線の分岐点からの電線の長さが4mの箇所に低圧分岐回路を保護する過電流遮断器を施設する'], answer:3, explanation:'IwがIBの35%以上の場合、過電流遮断器と分岐点との距離は8m以下とすればよく②は正しい。IwがIBの35%未満となるケースでは、このときの距離は3m以下としなければならず、4mでは不可となる。したがって④が誤り。', choiceNotes:['幹線の過電流遮断器は幹線の許容電流以下の定格電流のものを用いるという電技解釈の原則どおりであり正しい。','許容電流IwがIBの35%以上であれば分岐点からの長さ制限は8m以下でよく、記述は電技解釈の規定通りで正しい。','低圧幹線の電線は、供給する機械器具の定格電流合計以上の許容電流のものを用いる必要があり、原則通りで正しい。','IwがIBの30%(35%未満)の場合は分岐点から3m以内に遮断器を施設する必要があり、4mでは規定を超えるため誤り。'] },
  { id:'q241', group:'有線・線路施工', category:'低圧配線', chapter:'6章', stars:1, question:'事務室におけるコンセント専用の低圧分岐回路に関する記述として、電気設備の技術基準の解釈上、誤っているものはどれか。ただし、電線は軟銅線のものを使用し、その長さは、分岐点から配線用遮断器までは2m、配線用遮断器からコンセントまでは7mとする。', options:['定格電流30Aの配線用遮断器に直径2mmの電線を配線し、定格電流15Aのコンセントを1個取り付ける','定格電流20Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流20Aのコンセントを1個取り付ける','定格電流15Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流15Aのコンセントを1個取り付ける','定格電流30Aの配線用遮断器に直径2.6mmの電線を配線し、定格電流30Aのコンセントを1個取り付ける'], answer:0, explanation:'定格電流30Aの配線用遮断器を用いた場合には30A分岐回路とみなされ、直径2.6mm以上の太さの電線を使用しなければならない。取り付けるコンセントも定格電流20A以上30A以下のものである必要がある。したがって選択肢①は規格を外れた配線となる。', choiceNotes:['30A分岐回路は直径2.6mm以上の電線とコンセント定格20~30Aが必要だが、直径2mmの電線と15Aコンセントは規格を満たさず誤り。','20A配線用遮断器の分岐回路は直径1.6mm以上の電線でよく、コンセントも20A以下であるため適合しており正しい組み合わせ。','15A分岐回路は直径1.6mm以上の電線、コンセント15A以下が基準であり、この組み合わせは規格を満たし正しい。','30A分岐回路は直径2.6mm以上の電線、コンセント20~30Aが基準であり、この組み合わせは規格通りで正しい。'] },
  { id:'q242', group:'有線・線路施工', category:'低圧配線', chapter:'6章', stars:1, question:'事務室におけるコンセント専用の低圧分岐回路に関する記述として、「電気設備の技術基準の解釈」上、誤っているものはどれか。ただし、電線は軟銅線のものを使用し、その長さは、分岐点から配線用遮断器までは2m、配線用遮断器からコンセントまでは7mとする。', options:['定格電流15Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流20Aのコンセントを1個取り付ける','定格電流20Aの配線用遮断器に直径1.6mmの電線を配線し、定格電流15Aのコンセントを1個取り付ける','定格電流30Aの配線用遮断器に直径2.6mmの電線を配線し、定格電流30Aのコンセントを1個取り付ける','定格電流40Aの配線用遮断器に断面積8mm2の電線を配線し、定格電流30Aのコンセントを1個取り付ける'], answer:0, explanation:'回路に取り付けるコンセントの定格電流値は、少なくとも遮断器の定格電流値と同じか、それ以下でなければならない。15A分岐回路のコンセントは15A以下とする必要があり、20Aのコンセントは明らかに超過しているため①が誤り。', choiceNotes:['コンセントの定格電流は遮断器の定格以下でなければならないが、15A遮断器に20Aコンセントは定格超過となり誤り。','コンセント定格15Aは遮断器定格20A以下に収まっており、分岐回路の規定に適合し正しい。','30A分岐回路として電線太さ・コンセント定格とも基準を満たしており正しい組み合わせ。','40A配線用遮断器の分岐回路には断面積8mm2以上の電線とコンセント30A以上40A以下が必要で、この組み合わせは基準に適合し正しい。'] },
  { id:'q243', group:'有線・線路施工', category:'高圧設備', chapter:'6章', stars:1, question:'キュービクル式高圧受電設備の主遮断装置に関する、次の記述の空欄に当てはまる語句の組み合わせとして、適当なものはどれか。「PF・S形は、(ア)と(イ)とを組み合わせたもの、または一体としたものである。」', options:['(ア)遮断器 (イ)限流ヒューズ','(ア)遮断器 (イ)過電流継電器','(ア)高圧交流負荷開閉器 (イ)限流ヒューズ','(ア)高圧交流負荷開閉器 (イ)過電流継電器'], answer:2, explanation:'キュービクル式の高圧受電設備は、受電用の主遮断装置の方式によってCB形とPF・S形の2種類に分類できる。CB形は主遮断装置に真空遮断器(VCB)+過電流継電器を用いた大容量向け。PF・S形は「パワーヒューズ・スイッチ」の略で、高圧交流負荷開閉器と限流ヒューズを組み合わせたもので、300kVA以下の中容量の受電に適している。③の組み合わせが適当。', choiceNotes:['PF・S形は遮断器ではなく高圧交流負荷開閉器を用いる方式であり、この組み合わせは誤り。','遮断器と過電流継電器の組み合わせはCB形の主遮断装置の構成であり、PF・S形の説明としては誤り。','PF・S形は高圧交流負荷開閉器と限流ヒューズを組み合わせた方式であり、300kVA以下の中容量受電に適した正しい組み合わせ。','PF・S形にはヒューズが用いられ、過電流継電器はCB形で使われる要素であるため誤り。'] },
  { id:'q244', group:'有線・線路施工', category:'高圧設備', chapter:'6章', stars:1, question:'高圧受変電設備に関する記述として、適当でないものはどれか。', options:['遮断器は、回路の開閉の他、保護継電器と組み合わせて用いられ、事故時には継電器からの信号により、過電流や短絡・地絡電流を自動的に遮断する装置である','保護継電器は、回路に異常が発生した場合に、これを検出して遮断器を動作させ、各機器の保護をするものである','キュービクル式高圧受電設備は、受電用の主遮断装置の方式によって、CB形とPF・S形がある','受電設備の引込口等に設置される避雷器は、雷および開閉等による異常電圧が回路に侵入したとき大地に放電させるものであり、接地はB種接地工事でなければならない'], answer:3, explanation:'高圧避雷器は、A種接地工事とする必要がある。この際の抵抗値は10Ω以下。なおB種接地は、高圧と低圧を変成する変圧器の低圧側に配するものである。したがって④の記載が不適当。', choiceNotes:['遮断器が保護継電器と連動して事故電流を自動遮断するという記述は標準的な説明であり正しい。','保護継電器が異常検出時に遮断器を動作させ機器を保護するという説明は正しい。','キュービクル式高圧受電設備の主遮断装置方式がCB形とPF・S形に分類されるという記述は正しい。','高圧避雷器の接地はB種ではなくA種接地工事(接地抵抗10Ω以下)とする必要があり、この記述は誤り。'] },
  { id:'q245', group:'有線・線路施工', category:'電気用品安全法', chapter:'6章', stars:1, question:'次の電気用品のうち、「電気用品安全法令」上、特定電気用品に該当しないものはどれか。ただし、使用電圧200Vの交流の電路に使用するものとする。', options:['ケーブル(CV22mm2 3心)','ケーブル配線用スイッチボックス','電流制限器(定格電流100A)','温度ヒューズ'], answer:1, explanation:'現行法での「特定電気用品」は100品目以上が指定されている。大分類を列挙すると、電線類、ヒューズ、配線器具、電流制限器、小形単相変圧器類、電熱器具、電動力応用機械器具、電子応用機械器具、交流用電気機械器具、携帯発電機の10種類。選択肢の中では②の「ケーブル配線用スイッチボックス」が該当しない。', choiceNotes:['ケーブルは電線類として特定電気用品に指定されており該当する。','スイッチボックスは配線器具そのものではなく付属部材にあたり、特定電気用品の指定品目には含まれない。','電流制限器は特定電気用品の分類に定められた品目であり該当する。','温度ヒューズはヒューズ類として特定電気用品に指定されており該当する。'] },
  { id:'q246', group:'有線・線路施工', category:'消防設備', chapter:'6章', stars:1, question:'粉末消火設備に関する記述として、適当でないものはどれか。', options:['全域放出方式は、防護対象物の火災消火を目的に、粉末消火剤を防護対象物に直接放射して消火する方式である','移動式は、粉末消火剤の貯蔵容器等は固定されており、人がホースを持って火災場所まで移動しノズルを操作することで、粉末消火剤を放射する方式である','第1種粉末、第2種粉末および第4種粉末は、油火災および電気火災に適応し、第3種粉末は普通火災、油火災および電気火災に適応する','固定式の粉末消火設備の起動方式には、自動式と手動式がある'], answer:0, explanation:'固定式には全域方式と局所方式の二種類があり、局所方式は防護対象物に消火剤を直接放射して消火する。一方の全域方式は、対象となる部屋全体に均一に消火剤を放射するものであり、①の記載は不適当。粉末消火設備は主成分の違いにより第1種から第4種に区分され、普通火災に適応しているのは第3種だけである(③適当)。', choiceNotes:['防護対象物に直接放射するのは局所方式の説明であり、全域放出方式は防護区画全体に均一に放射する方式であるため誤り。','移動式は貯蔵容器を固定し人がホースとノズルを操作して放射する方式であり、記述は正しい。','粉末消火剤は種類により適応火災が異なり、普通火災に適応するのは第3種のみという記述は正しい。','固定式粉末消火設備の起動方式には自動式と手動式があるという記述は正しい。'] },
  { id:'q247', group:'有線・線路施工', category:'消防設備', chapter:'6章', stars:1, question:'不活性ガス消火設備の特徴に関する記述として、適当でないものはどれか。', options:['移動式の不活性ガス消火設備は、ホースノズルを人が操作することで、移動しながら消火する方式である','全域放出方式と局所放出方式の不活性ガス消火設備は、常時、人がいない部分に設置される','不活性ガス消火設備の消火剤であるハロゲン化物は、窒息効果の他、化学的な連鎖反応抑制による燃焼抑制効果により消火する','水を使用することが不適切な油火災や、電気火災または散水によって二次的な被害が出ると予想される室に設置される'], answer:2, explanation:'不活性ガス消火設備の消火剤は、主に窒素ガスや二酸化炭素が用いられる。これらは熱の作用を受けても酸素を排出せず、酸素濃度を下げる窒息効果のみによって消火の作用を得る。ハロゲン化物を消火剤とする方式はハロゲン化物消火設備であり、③が不適当。', choiceNotes:['移動式は人がホースノズルを操作しながら移動して消火する方式であり、記述は正しい。','不活性ガスは酸欠の危険があるため、全域・局所放出方式とも常時人がいない部分に設置するという記述は正しい。','不活性ガス消火設備の消火剤は窒素や二酸化炭素であり窒息効果のみで消火する。ハロゲン化物や連鎖反応抑制効果はハロゲン化物消火設備の特徴であり誤り。','水損を避けたい油火災・電気火災の室に適するという記述は正しい。'] },
  { id:'q248', group:'有線・線路施工', category:'消防設備', chapter:'6章', stars:1, question:'消火設備に関する記述として、適当でないものはどれか。', options:['不活性ガス消火設備は、二酸化炭素、窒素、あるいはこれらのガスとアルゴンとの混合ガスを放射することで、不活性ガスによる窒息効果により消火する','スプリンクラー設備は、建築物の天井面等に設けたスプリンクラーヘッドが火災時の熱を感知して感熱分解部を破壊することで、自動的に散水を開始して消火する','屋内消火栓設備は、人が操作することによって消火を行う固定式の消火設備であり、泡の放出により消火する','粉末消火設備は、噴射ヘッドまたはノズルから粉末消火剤を放出し、火災の熱により、粉末消火剤が分解して発生する二酸化炭素による窒息効果により消火する'], answer:2, explanation:'泡を放出して消火の効果をもたらす設備は泡消火設備であり、屋内に施設されていたとしても屋内消火栓設備という名称ではない。屋内消火栓設備は水を放出することで消火の効果を得るため、③が不適当。その他の選択肢①、②、④は正しい。', choiceNotes:['不活性ガス消火設備が二酸化炭素・窒素等の放射による窒息効果で消火するという記述は正しい。','スプリンクラーヘッドが熱で感熱分解部を破壊し自動散水する仕組みの記述は正しい。','屋内消火栓設備は水を放出して消火する設備であり、泡を放出するのは泡消火設備であるためこの記述は誤り。','粉末消火剤の熱分解で発生する二酸化炭素による窒息効果で消火するという記述は正しい。'] },
  { id:'q249', group:'有線・線路施工', category:'消防設備', chapter:'6章', stars:1, question:'スプリンクラー設備に関する記述として、適当でないものはどれか。', options:['湿式方式は、配管内に常時圧力のかかった水が満たされており、火災の熱により、スプリンクラーヘッドが感熱開放することで自動的に放水する','乾式方式は、流水検知装置の1次側(ポンプ側)配管に圧力のかかった水が満たされており、2次側(スプリンクラーヘッド側)配管には圧縮空気が入っている','開放式は、一斉開放弁の1次側(ポンプ側)配管および2次側(スプリンクラーヘッド側)配管とも、圧縮空気や圧力のかかった水が入っておらず、開放されている','予作動方式は、火災による熱でスプリンクラーヘッドが作動して初めて放水するが、ヘッドだけが作動しても感知器の感知信号がなければ放水されない'], answer:2, explanation:'開放式は、文字通りヘッドが常に開いており、末端の配管内に水は充填されていないが、水は一斉開放弁で止められている。1次側には充填されているため③が不適当。火災発生時には、送水系統とは別に電気式の感知器を設けて火災信号を受信するか、または手動で起動させて送水を行う。', choiceNotes:['湿式は配管内に常時充水されており、熱でヘッドが開放すると自動放水するという記述は正しい。','乾式は1次側に充水、2次側に圧縮空気が入っているという記述は正しい。','開放式は2次側配管は開放されているが、1次側(一斉開放弁まで)には圧力のかかった水が充填されているため、この記述は誤り。','予作動方式は感知器の作動信号がないとヘッドが開いても放水しないという記述は正しい。'] },
  { id:'q250', group:'有線・線路施工', category:'非常用装置', chapter:'6章', stars:1, question:'非常用予備発電装置に関する記述として、適当でないものはどれか。', options:['建設工事現場の仮設電源として使用される移動用発電設備は電気事業法令上、非常用予備発電装置として扱われる','非常用予備発電装置の負荷容量は、一般的に商用電源の負荷容量と比較して、必要最小限にするため、必要な負荷を選択して投入する','法令や条例によって騒音値が規制される場合は、敷地境界における騒音規制値を満足する性能を有する必要がある','非常用予備発電装置が運転される場合には、電力会社の配電線等に電気が流出しないようにする必要がある'], answer:0, explanation:'経済産業省の通達によると、工事現場の仮設電源として使用される移動用発電設備は「発電所」に分類され、定義上は非常用予備発電装置としては扱われないことになる。①が不適当。', choiceNotes:['工事現場の仮設電源用移動発電設備は経済産業省通達上「発電所」に分類され、非常用予備発電装置には該当しないため誤り。','非常用予備発電装置は必要最小限の負荷を選択して投入するという記述は正しい運用である。','騒音規制がある場合は敷地境界での規制値を満足する必要があるという記述は正しい。','非常用発電時に電力会社系統へ電気を流出させない対策(逆潮流防止)が必要という記述は正しい。'] },
  { id:'q251', group:'有線・線路施工', category:'非常用装置', chapter:'6章', stars:1, question:'非常用の照明装置に関する記述として、「建築基準法令」上、誤っているものはどれか。', options:['照明器具には、LEDランプは認められておらず、白熱灯または蛍光灯のいずれかでなければならない','電気配線に使用する電線は、600V二種ビニル絶縁電線その他これと同等以上の耐熱性を有するものとしなければならない','予備電源は、常用の電源が断たれた場合に自動的に切り替えられて接続され、かつ、常用の電源が復旧した場合に自動的に切り替えられて復帰するものとしなければならない','照明器具(照明カバーその他照明器具に付属するものを含む)のうち主要な部分は、難燃材料で造り、または覆うこと'], answer:0, explanation:'非常用の照明装置は建築基準法が根拠法だが、実際には国土交通省の告示にて細目が定められている。その中で照明器具の仕様が限定されていて、白熱灯、蛍光灯、LEDランプのいずれかと規定されている。したがって①が誤り。', choiceNotes:['国土交通省告示により非常用照明の照明器具には白熱灯・蛍光灯に加えLEDランプも認められており、この記述は誤り。','非常用照明の配線には600V2種ビニル絶縁電線等の耐熱性を有する電線を用いる必要があり、記述は正しい。','予備電源は停電時に自動的に切替わり、復旧時に自動的に復帰する構造とする必要があり、記述は正しい。','照明器具の主要部分を難燃材料で造るか覆うことが求められており、記述は正しい。'] },
  { id:'q252', group:'有線・線路施工', category:'二次電池', chapter:'6章', stars:1, question:'二次電池の充電方式に関する次の記述に該当する用語として、適当なものはどれか。「自然放電で失った容量を補うために、継続的に微小電流を流すことで、満充電状態を維持する。」', options:['定電圧定電流充電','トリクル充電','浮動充電','パルス充電'], answer:1, explanation:'掲題の方式はトリクル充電。浮動(フロート)充電とも似ているが接続の仕方が異なり、浮動充電は蓄電池と負荷とが並列につながっているのに対し、トリクル充電は別回路で構成されている。浮動充電は常に定電圧を印加して満充電を維持し、流れる電流はほぼ0A。トリクル充電は通常時は微小電流を流して満充電を維持し、停電時には回路を切り替えて蓄電池から負荷へ供給する。②が適当。', choiceNotes:['定電圧定電流充電は充電初期は定電流、その後定電圧に切り替えて満充電にする方式であり、自然放電補償の説明とは異なる。','自然放電で失った容量を補うため継続的に微小電流を流し満充電を維持する方式はトリクル充電であり、記述に合致し正しい。','浮動充電は蓄電池と負荷を並列に接続し常時定電圧を印加する方式で、トリクル充電とは回路構成が異なるため誤り。','パルス充電は断続的なパルス電流で充電する方式であり、継続的な微小電流を流すトリクル充電とは異なる。'] },
  { id:'q253', group:'有線・線路施工', category:'二次電池', chapter:'6章', stars:1, question:'リチウムイオン電池に関する記述として、適当でないものはどれか。', options:['セルあたりの起電力が3.7Vと高く、高エネルギー密度の蓄電池である','自己放電や、メモリ効果が少ない','電解液に水酸化カリウム水溶液、正極にコバルト酸リチウム、負極に炭素を用いている','リチウムポリマー電池は、液漏れしにくく、小型・軽量で長時間の使用が可能である'], answer:2, explanation:'リチウムイオン電池の構造は、正極にはリチウムやコバルトの酸化物、負極には結晶構造中にリチウムを含んだ炭素を用いている。電解質には液状の、リチウム塩を溶かした有機溶媒が使われており、水酸化カリウム水溶液ではない。よって③が不適当。起電力は3.7Vで①は適当。', choiceNotes:['リチウムイオン電池のセル起電力は約3.7Vと高く高エネルギー密度であるという記述は正しい。','自己放電やメモリ効果が少ないという特徴の記述は正しい。','リチウムイオン電池の電解質はリチウム塩を溶かした有機溶媒であり、水酸化カリウム水溶液はニッケル水素電池等アルカリ系電池のものであるため誤り。','リチウムポリマー電池はゲル状電解質を用い液漏れしにくく小型軽量という記述は正しい。'] },
  { id:'q254', group:'有線・線路施工', category:'線路施工（架空配線）', chapter:'2章', stars:5, question:'「有線電気通信法令」上、架空通信ケーブルと他の電線等との離隔距離に関する記述として、誤っているものはどれか。', options:['架空通信ケーブルと他人の設置した架空電線との離隔距離を40cmとする','架空通信ケーブルと他人の建造物との離隔距離を50cmとする','架空通信ケーブルと使用電圧が高圧の強電流ケーブルが交差するので、その離隔距離を35cmとする','架空通信ケーブルを高圧の強電流ケーブルと同一の支持物に連続して共架するので、その離隔距離を60cmとする'], answer:2, explanation:'他人の架空電線や建造物との離隔は「30cm以下は不可」（30cm超が必要）なので40cm・50cmは適法。高圧の強電流ケーブルと交差する場合の離隔距離は40cm以上必要なため、35cmは誤り。高圧の強電流ケーブルと共架（同一支持物に2か所以上連続して架設）する場合は50cm以上必要（60cmは適法）。なお低圧では交差時30cm（強電流絶縁電線は60cm）、共架時30cm（絶縁電線75cm）となる。', choiceNotes:['他人の架空電線との離隔距離は30cmを超える必要があり、40cmはこれを満たすため適法。','他人の建造物との離隔距離は30cm超が必要であり、50cmは基準を満たすため適法。','高圧強電流ケーブルと交差する場合の離隔距離は40cm以上必要であり、35cmでは不足しているため誤り。','高圧強電流ケーブルと連続して共架する場合の離隔距離は50cm以上必要であり、60cmは基準を満たすため適法。'] },
  { id:'q255', group:'有線・線路施工', category:'線路施工（架空配線）', chapter:'2章', stars:5, question:'「有線電気通信法令」上、架空配線（架空電線）の高さに関する記述として、適当なものはどれか。', options:['横断歩道橋の上に架空配線を行う場合、その路面からの高さを2.5mとする','道路の縦断方向に架空配線を行う場合、その路面からの高さを4.5mとする','鉄道を横断する架空配線を行う場合、その軌条面からの高さを5.5mとする','河川を横断する架空配線は、舟行に支障を及ぼすおそれがない高さとする'], answer:3, explanation:'有線電気通信設備令施行規則第7条により、横断歩道橋の上は路面から3m以上、道路上は路面から5m以上、鉄道または軌道（路面電車）を横断するときは軌条面（レールの上面）から6m以上と定められている。河川については具体的な数値の規定はなく「舟行に支障を及ぼすおそれがない高さ」とされているため④が正しい。①は3m以上、②は5m以上、③は6m以上が必要。', choiceNotes:['横断歩道橋上の架空配線は路面から3m以上必要であり、2.5mでは基準に満たないため誤り。','道路上の架空配線は路面から5m以上必要であり、4.5mでは基準に満たないため誤り。','鉄道・軌道を横断する場合は軌条面から6m以上必要であり、5.5mでは基準に満たないため誤り。','河川横断部には具体的な数値規定はなく、舟行に支障を及ぼすおそれがない高さとすることとされており、記述は正しい。'] },
  { id:'q256', group:'施工管理', category:'工程管理（各種工程表）', chapter:'2章', stars:5, question:'工程管理に用いられるガントチャートに関する記述として、適当なものはどれか。', options:['縦軸に部分工事（工種）をとり、横軸に各部分工事の出来高比率（達成度）を棒線で記入した図表である','各部分工事に必要な日数を把握することができる','縦軸に出来高比率をとり、横軸に工期をとって、工事全体の出来高比率の累計を曲線で表した図表である','各部分工事の工期に対する影響の度合いを把握することができる'], answer:0, explanation:'ガントチャートは縦軸に工種（部分工事）をとり、横軸に各部分工事の出来高比率（達成度）を棒線で記入した図表で、部分工事ごとの進捗度合いが一目でわかる。ただし横軸が時間ではないため、各部分工事の開始・終了時期や所要日数は読み取れず、全体工期に対する影響の度合いや工事全体の出来高比率の累計も把握できない。③は工程管理曲線の説明である。', choiceNotes:['ガントチャートは縦軸に工種、横軸に出来高比率(達成度)を棒線で示す図表であり、記述は正しい。','ガントチャートの横軸は時間ではなく出来高比率のため、各工事に必要な日数は読み取れず誤り。','縦軸に出来高比率、横軸に工期をとり累計を曲線で示すのは工程管理曲線(バナナ曲線等)の説明でありガントチャートとは異なる。','各工事が全体工期に与える影響度を把握できるのはネットワーク工程表の特徴であり、ガントチャートでは把握できないため誤り。'] },
  { id:'q257', group:'施工管理', category:'工程管理（工程管理曲線）', chapter:'2章', stars:5, question:'工程管理曲線の代表的なものであるバナナ曲線に関する記述として、適当でないものはどれか。', options:['上方許容限界曲線や下方許容限界曲線は、過去の工事実績データから作成される','予定工程曲線がバナナ曲線の許容限界範囲内に入らない場合は、一般に不合理な工程計画と考えられ、工程計画の調整を行う必要がある','バナナ曲線によって管理する予定工程曲線は出来高累計曲線で描かれるが、実施工程曲線は3本の直線で表現される','実施工程曲線が上方許容限界曲線より上にくる場合は、工程が計画より進み過ぎている状態である'], answer:2, explanation:'予定工程曲線も実施工程曲線も、ともに出来高累計のS字曲線で描かれ、3本の直線ではないため③が不適当。上方・下方許容限界曲線は過去の工事実績等から作成され、予定工程曲線が許容限界範囲に入らない場合は工程計画の調整が必要となる。実施線が上方許容限界より上なら進み過ぎ、下方許容限界より下なら工程遅延の状態である。', choiceNotes:['上方・下方許容限界曲線は過去の工事実績データをもとに作成されるという記述は正しい。','予定工程曲線が許容限界範囲外なら不合理な計画とみなし調整が必要という記述は正しい。','実施工程曲線も予定工程曲線と同様に出来高累計のS字曲線で描かれ、3本の直線で表現されるわけではないため誤り。','実施工程曲線が上方許容限界曲線より上にある場合は工程が進み過ぎの状態を示すという記述は正しい。'] },
  { id:'q258', group:'施工管理', category:'工程管理（各種工程表）', chapter:'2章', stars:5, question:'タクト工程表に関する記述として、適当なものはどれか。', options:['縦軸にその建物の階層をとり、横軸に出来高比率をとった工程表である','高層ビルの基準階等の繰り返し行われる作業の工程管理に適している','全体の稼働人数の把握が難しく、工期の遅れ等に対する変化への対応が困難である','バーチャート工程表に比べ、特定の作業と他の作業との関連性を詳細に把握できる'], answer:1, explanation:'タクト工程表は縦軸に建物の階層別をとり、横軸には出来高比率ではなく時間（日程）を配した工程表である。各階で作業内容が近似するビルの内装・電気・水道等の付帯工事について、フロア全体の作業項目を1つのセットとして繰り返し作業で工程管理を行う手法で、高層ビルの基準階等の繰り返し作業に適する。フロアごとの作業内容が慣習的なものとなるため稼働人数の把握・算出は容易で、工程遅延時も人員や機械の追加等の対処がしやすい。ただし特定の1つの作業と他の作業との関連性は、バーチャートと同様に詳細には把握できない。', choiceNotes:['タクト工程表の横軸は出来高比率ではなく時間(日程)であり、この記述は誤り。','各階の作業が近似する高層ビルの基準階等、繰り返し作業の工程管理に適しているという記述は正しい。','作業内容が慣習化されるため稼働人数の把握は容易で、遅延時も人員・機械の追加等の対応がしやすく、この記述は誤り。','特定の作業と他作業との詳細な関連性の把握はバーチャートと同様に困難であり、この記述は誤り。'] },
  { id:'q259', group:'施工管理', category:'工程管理（各種工程表）', chapter:'2章', stars:5, question:'建設工事の工程管理に用いられる斜線式工程表に関する記述として、適当でないものはどれか。', options:['トンネルや舗装工事のように、一方向にしか進捗できない工事によく用いられる','工事の施工場所と日数の関係を明確にすることができる','工事のクリティカルパスを求めることができる','縦軸に工期をとり、横軸に工事総延長等の距離を配する形が一般的である'], answer:2, explanation:'クリティカルパスが算出可能な図表はネットワーク工程表（アロー・ダイヤグラム）だけであり、斜線式工程表では求められないため③が不適当。斜線式工程表は縦軸に工期、横軸に工事総延長等の距離を配し、各工種の作業を1本の斜線で表現することで、作業期間・着手地点・作業方向・作業速度等を示すことができ、場所と日程の関係が読み取りやすい。トンネルや舗装工事のように一方向に進行する工事に用いられる。', choiceNotes:['トンネルや舗装工事のような一方向にしか進行しない工事に適しているという記述は正しい。','施工場所(距離)と日数の関係を明確に示せるという記述は正しい。','クリティカルパスを算出できるのはネットワーク工程表のみであり、斜線式工程表では求められないため誤り。','縦軸に工期、横軸に工事総延長等の距離を配する形が一般的という記述は正しい。'] },
  { id:'q260', group:'施工管理', category:'工程管理（山積み・山崩し）', chapter:'2章', stars:5, question:'工程管理における作業人員や資材の山積みや山崩しに関する記述として、適当なものはどれか。', options:['山積みで凹部になっている部分は作業のネックになる部分であるため、作業人員を増員する','山積みでは、作業を進めるのに必要な作業人員や資材の日々の累計を計算して、その状況を把握する','山崩しでは、許容される余裕の範囲を超えて作業を遅らせることによって、作業の平均化を図る','山崩しでは、全体工期を守る必要はなく、平準化を最優先して作業を調整する'], answer:1, explanation:'山積みとは、工程計画の立案段階で作業の順序と各作業に要する資源（人員や資機材）の配置を棒グラフで示し、必要資源の日々の累計を計算して状況を把握するものである。山積みの凹部は縦軸方向のリソースが少ない箇所を指すだけで、ボトルネックという意味ではない。山崩しはピーク時の突出した部位を下げて平準化する試みだが、全体工期を守ることが前提であり、許容される余裕の範囲を超えて作業を遅らせ工事が遅延する状況は避けるべきである。', choiceNotes:['山積みの凹部は単に必要資源が少ない箇所を示すだけでボトルネックを意味するものではなく、この記述は誤り。','山積みは各作業に必要な人員・資材の日々の累計を計算し状況を把握する手法であり、記述は正しい。','山崩しは許容される余裕の範囲内で調整するものであり、範囲を超えて遅らせることは工期遅延を招くため誤り。','山崩しも全体工期を守ることが前提であり、平準化を工期より優先するという記述は誤り。'] },
  { id:'q261', group:'電気・電子理論', category:'ネットワーク工程表', chapter:'基礎', stars:0, question:'次のネットワーク工程表におけるクリティカルパスの所要日数として、適当なものはどれか。作業A（結合点0→1、4日）、作業B（1→2、5日）、作業C（1→3、6日）、作業D（1→4、8日）、作業E（3→5、7日）、作業F（2→5、8日）、作業G（5→6、3日）で、結合点2→3および4→3にダミー作業がある。', options:['19日','21日','22日','24日'], answer:2, explanation:'結合点3には、A+C=10日、A+B+ダミー=9日、A+D+ダミー=12日の3ルートが到達し、最も数値が大きい12日を採用する（作業B～Dの全てが完了しなければ作業Eに進めないため）。結合点5にはE経由で12+7=19日、F経由で4+5+8=17日が到達し、大きい19日を採用。最後に作業Gの3日を足して合計22日がクリティカルパスの所要日数となる。クリティカルパスは時間的な余裕が全くないルートであり、全体の作業工程はこれよりも短く実施できない。', choiceNotes:['結合点3への到達日数はA+D+ダミー経由の12日を採用すべきだが、これを考慮せず短いルートで計算すると19日となり、正しい計算ではない。','結合点5への到達をF経由の17日採用等、最長経路を選ばずに計算すると21日となるが、実際はE経由の19日を採用すべきであり誤り。','結合点3はA+D+ダミー経由の最長12日、結合点5はE経由の12+7=19日を採用し、最後にG(3日)を加えた22日がクリティカルパスの所要日数であり正しい。','各区間の日数を単純に合算する等、最長経路の選定を誤ると24日という過大な値になるが、これは正しい計算ではない。'] },
  { id:'q262', group:'施工管理', category:'品質管理（QC7つ道具）', chapter:'2章', stars:5, question:'品質管理に用いる図表のうち、横軸に測定対象のデータ区間をとり、縦軸にそのデータ区間ごとの出現度数を棒グラフとして積み上げた図表の名称として、適当なものはどれか。', options:['パレート図','管理図','特性要因図','ヒストグラム'], answer:3, explanation:'データの存在する範囲をいくつかの区間に分け、それぞれの区間に入るデータの数を度数として高さに表した図はヒストグラムである。中央が最も高く左右対称の正規分布（ガウス分布）に近い形が理想的で、山が2つに分かれる等の極端に歪んだ形になった場合は異常値としてアラームを上げて工程を疑い調査を行う。QC7つ道具の1つで、測定値の分布状況の把握に広く用いられる。', choiceNotes:['パレート図は不良項目等を件数の多い順に並べた棒グラフと累積比率の折れ線を組み合わせた図表であり、度数分布を示すものではないため該当しない。','管理図は時系列に測定値をプロットし上方・下方管理限界線で工程の安定性を判定する図表であり、度数分布の説明には該当しない。','特性要因図は結果(特性)とその要因の関係を魚の骨のような形に整理した図表であり、度数分布を表すものではないため該当しない。','測定対象データを区間に分け、区間ごとの出現度数を棒グラフで積み上げた図表はヒストグラムであり、記述に合致し正しい。'] },
  { id:'q263', group:'施工管理', category:'品質管理（管理図）', chapter:'2章', stars:5, question:'シューハート管理図に関する記述として、適当でないものはどれか。', options:['中心線（CL）は、設定された目標値のことである','上方管理限界（UCL）は、一般に中心線から標準偏差σの3倍の位置とされる','統計論的に、プロットした点が3σの外に出てしまう確率は約0.3%とされている','連続する9点が中心線に対して同じ側にあっても、管理限界線の内にあれば工程に異常はないと判断する'], answer:3, explanation:'JIS Z 9021「シューハート管理図」では異常判定ルールとして8項目が定められており、「連続する9点が中心線に対して同じ側にある」場合は管理限界線の内にあっても工程に異常があると判定される。他にも「点が管理限界線の外にある」「6点以上連続して上昇または下降している」「連続する14点が交互に増減している」等がある。中心線（CL）は目標値、上方管理限界（UCL）は3σの位置に置かれ、3σの外に出る確率は統計論的に約0.3%とされる。', choiceNotes:['中心線(CL)は設定された目標値であるという記述は正しい。','上方管理限界(UCL)は中心線から標準偏差の3倍(3σ)の位置に設定されるという記述は正しい。','統計上、プロット点が3σの外に出る確率は約0.3%とされており、記述は正しい。','JIS Z 9021の異常判定ルールでは、連続する9点が中心線に対して同じ側にある場合、管理限界線内であっても工程に異常があると判定されるため、この記述は誤り。'] },
  { id:'q264', group:'施工管理', category:'品質管理（検査）', chapter:'2章', stars:5, question:'抜取検査において、不合格とすべきロットを合格としてしまう可能性を表す用語として、適当なものはどれか。', options:['生産者危険','消費者危険','工程能力指数','抜取誤差'], answer:1, explanation:'抜取検査では検査の対象とならなかった製品が不良品である懸念が残る。このように不合格とすべきロットを合格としてしまう可能性を「消費者危険」と呼ぶ。逆に、合格とすべきロットを不合格にしてしまう可能性は「生産者危険」という。なお、抜取検査が望まれるのは破壊検査が必要な場合、数量が非常に多い場合、製品が連続体の場合等であり、全数検査が望まれるのはわずかな不良品の混入も許されない場合等である。', choiceNotes:['生産者危険は、合格とすべき良品ロットを誤って不合格としてしまう可能性のことであり、設問の定義とは逆であるため誤り。','不合格とすべきロットを誤って合格としてしまう可能性は消費者危険と呼ばれ、設問の定義に合致し正しい。','工程能力指数は工程のばらつきと規格幅との関係を数値化した指標であり、ロットの合否誤判定の可能性を表す用語ではないため該当しない。','抜取誤差という用語はこの定義を表す標準的な品質管理用語ではないため該当しない。'] },
  { id:'q265', group:'施工管理', category:'線路施工（導波管）', chapter:'2章', stars:5, question:'マイクロ波多重無線設備で使用される導波管に関する記述として、適当でないものはどれか。', options:['気密窓導波管は、導波管内の防湿のための乾燥空気充填用や気密試験用として、通信機械室内の引込口付近に配置される','テーパー導波管は、両端で寸法が異なる形状の導波管で、違うサイズの導波管を接続する際の中継部材として用いられる','テーパー導波管は防湿の機能をもつため、乾燥空気充填用として引込口付近に用いられる','導波管のフランジ結合用のねじには、錆を防ぐためにステンレス製を用いるケースが多い'], answer:2, explanation:'テーパー導波管は両端で寸法が異なる特殊な導波管で、違うサイズの導波管を接続する際の中継部材として用いられるものであり、防湿の機能は関係ない。防湿のための乾燥空気充填用・気密試験用の役割を持つのは、通信機械室と室外との境界部分（引込口付近）に配置される気密窓導波管である。フランジ結合用ねじはスチール（鋼鉄）製だと錆びるおそれがあるため、ステンレス製を用いるケースが多い。', choiceNotes:['気密窓導波管は防湿のための乾燥空気充填用・気密試験用として引込口付近に配置されるという記述は正しい。','テーパー導波管は両端で寸法が異なりサイズの違う導波管を接続する中継部材であるという記述は正しい。','防湿のための乾燥空気充填の機能を持つのは気密窓導波管であり、サイズ変換用のテーパー導波管に防湿機能はないため誤り。','フランジ結合用ねじは錆を防ぐためステンレス製が多く用いられるという記述は正しい。'] },
  { id:'q266', group:'施工管理', category:'線路施工（導波管）', chapter:'2章', stars:5, question:'導波管の施工における気密形・非気密形の使い分けに関する記述として、適当なものはどれか。', options:['室外に施設する導波管には、非気密形を使用する','室内に設ける導波管には、必ず気密形を使用しなければならない','室外に施設する導波管には気密形を使用し、室内に設けるものについては非気密形でも特に問題はない','フランジ接続の結合用ねじには、スチール（鋼鉄）製を使用するのがよい'], answer:2, explanation:'導波管はフランジ部をねじ止めして接続するが、このフランジ部から雨水等が入り込まないように、室外に施設する導波管には気密形を使用する。気密形は接合部にOリングを用いる等の措置を施して防水効果を高めている。逆に室内に設けるものについては非気密形でも特に問題はない。結合用ねじは錆を防ぐためステンレス製を使用する（スチール製は錆びるおそれがある）。', choiceNotes:['雨水の浸入を防ぐため室外に施設する導波管には気密形を使用する必要があり、非気密形とするのは誤り。','室内に設ける導波管は非気密形でも特に問題なく、必ず気密形とする必要はないため誤り。','室外は気密形、室内は非気密形でも問題ないという記述は導波管施工の一般的な使い分けに合致し正しい。','フランジ結合用ねじはスチール製だと錆びるおそれがあるため、ステンレス製を用いるのが適切であり、この記述は誤り。'] },
  { id:'q267', group:'電気・電子理論', category:'電気の基礎（電磁気学）', chapter:'3章', stars:4, question:'次の図に示す磁性体の磁束密度B〔T〕と磁界の強さH〔A/m〕の曲線（ヒステリシス曲線）に関する記述として、適当なものはどれか。', options:['この曲線は、無負荷飽和曲線と呼ばれる','電磁石の鉄心の材料としては、残留磁気と保磁力が大きい強磁性体が適している','この曲線を一回りするときに消費される電気エネルギーは、この曲線内の面積に反比例する','この曲線のaは残留磁気を表し、bは保磁力を表す'], answer:3, explanation:'掲出のグラフはヒステリシス曲線（磁化曲線）であり、無負荷飽和曲線は同期発電機の特性を示す別の曲線である（①は不適当）。電磁石の鉄心に残留磁気と保磁力の大きい材料を使うと、電流を増減しても希望の強さに到達しにくく好ましくない（②も不適当）。曲線を一周する際に消費されるヒステリシス損（コアロス）は曲線内の面積に比例する（③も不適当）。外部磁界を取り除いても磁性体に残る磁束密度aが残留磁気、磁束密度を0にするために必要な外部磁場の大きさbが保磁力であり、④が適当。', figure:'<svg viewBox="0 0 260 220" style="width:100%;max-width:300px;margin:0 auto;display:block">       <line x1="20" y1="110" x2="240" y2="110" stroke="currentColor" stroke-width="1.2"/>       <line x1="130" y1="10" x2="130" y2="210" stroke="currentColor" stroke-width="1.2"/>       <text x="245" y="114" font-size="12">H</text>       <text x="135" y="15" font-size="12">B</text>       <path d="M130,20 C190,30 210,80 210,110 C210,140 190,180 130,190 C70,180 50,140 50,110 C50,80 70,30 130,20 Z"             fill="none" stroke="#1e88e5" stroke-width="2"/>       <circle cx="130" cy="20" r="3" fill="#e53935"/>       <text x="140" y="20" font-size="10" fill="#e53935">a(残留磁気)</text>       <circle cx="50" cy="110" r="3" fill="#e53935"/>       <text x="10" y="130" font-size="10" fill="#e53935">b(保磁力)</text>     </svg>', choiceNotes:['図示された曲線はヒステリシス曲線(磁化曲線)であり、無負荷飽和曲線は同期発電機の特性を表す別の曲線であるため誤り。','電磁石の鉄心には、電流の増減に応じて磁化しやすく減磁もしやすい残留磁気・保磁力の小さい軟磁性材料が適しており、この記述は誤り。','ヒステリシス曲線を一周する際に消費されるヒステリシス損は曲線内の面積に比例するのであり、反比例するという記述は誤り。','aは外部磁界を除いても残る磁束密度である残留磁気、bは磁束密度を0にするのに必要な磁界の強さである保磁力を表しており、記述は正しい。'] },
  { id:'q268', group:'電気・電子理論', category:'電気の基礎（点電荷）', chapter:'3章', stars:4, question:'真空中においてA点にQA=+64〔μC〕の点電荷を置いたとき、A点から2m離れたB点における電界の強さ〔V/m〕として、適当なものはどれか。ただし、比例定数k=1/(4πε0)は9.0×10^9〔N・m^2/C^2〕とする。', options:['3.6×10^4〔V/m〕','7.2×10^4〔V/m〕','1.44×10^5〔V/m〕','2.88×10^5〔V/m〕'], answer:2, explanation:'点電荷Q〔C〕からr〔m〕離れた位置の電界強度はE=k×Q/r^2〔V/m〕で表される。距離の2乗に反比例する点に注意。E=9.0×10^9×(64×10^-6)/2^2=9.0×10^9×16×10^-6=1.44×10^5〔V/m〕となる。', choiceNotes:['距離の2乗の計算を誤ったことによる数値であり、正しくはE=kQ/r^2の公式でr=2mを正しく2乗して計算する必要があるため誤り。','電界の公式E=kQ/r^2の適用を誤った数値であり、正しい計算値の1.44×10^5〔V/m〕とは一致しないため誤り。','E=kQ/r^2=9.0×10^9×(64×10^-6)/2^2=1.44×10^5〔V/m〕となり、正しい計算結果と一致するため正しい。','距離rを2乗せずに計算した(E=kQ/rとした)場合の数値であり、電界は距離の2乗に反比例するため誤り。'] },
  { id:'q269', group:'電気・電子理論', category:'電気の基礎（点電荷）', chapter:'3章', stars:4, question:'真空中にQ1=2〔μC〕とQ2=8〔μC〕の正電荷が距離L=30〔cm〕を隔てて置かれているとき、2つの電荷間に働く静電力の大きさF〔N〕として、適当なものはどれか。ただし、真空の誘電率はε0=1/(36π)×10^-9〔F/m〕とする。', options:['0.4〔N〕','0.8〔N〕','1.6〔N〕','3.2〔N〕'], answer:2, explanation:'静電気に関するクーロンの法則より、F=Q1×Q2/(4πε0r^2)〔N〕。静電力の大きさは電荷量の積に比例し、距離の2乗に反比例する。距離が〔cm〕で与えられているので0.3〔m〕に換算して代入すると、F=(2×10^-6×8×10^-6)/(4π×(1/36π)×10^-9×0.3^2)=1.6〔N〕となる。同種の電荷は反発し合い、異種であれば引き合う。', choiceNotes:['距離の単位換算(cmをmに直す)や2乗計算を誤った場合に生じる数値であり、正しい計算結果1.6〔N〕とは一致しないため誤り。','距離の2乗計算等を誤った場合に生じる数値であり、正しいクーロンの法則の計算結果とは一致しないため誤り。','F=Q1Q2/(4πε0r^2)にQ1=2×10^-6、Q2=8×10^-6、r=0.3mを代入すると1.6〔N〕となり、正しい計算結果と一致するため正しい。','距離を2乗せずに計算した場合等に生じる数値であり、静電力は距離の2乗に反比例するため正しい値とは一致せず誤り。'] },
  { id:'q270', group:'電気・電子理論', category:'電気の基礎（環状鉄心）', chapter:'3章', stars:4, question:'平均磁路長ℓ=40〔cm〕、断面積S=8〔cm^2〕、透磁率μ=1.0×10^-2〔H/m〕の環状鉄心に巻かれた巻数N=100のコイルの自己インダクタンスL〔H〕として、適当なものはどれか。ただし、磁束の漏れはないものとする。', options:['2×10^-2〔H〕','2×10^-1〔H〕','2〔H〕','2×10^1〔H〕'], answer:1, explanation:'環状鉄心に巻かれたコイルの自己インダクタンスはL=μSN^2/ℓ〔H〕で表される。問題文の長さ〔cm〕、断面積〔cm^2〕をメートル単位に換算して代入すると、L=(1.0×10^-2×8×10^-4×100^2)/0.4=2×10^-1〔H〕となる。断面積が分子、磁路長が分母である点に注意。', choiceNotes:['計算過程で桁数(単位換算)を誤った場合に生じる過小な数値であり、正しい計算結果2×10^-1〔H〕とは一致しないため誤り。','L=μSN^2/ℓにμ=1.0×10^-2、S=8×10^-4m^2、N=100、ℓ=0.4mを代入すると2×10^-1〔H〕となり、正しい計算結果と一致するため正しい。','桁数の換算を誤った場合に生じる過大な数値であり、正しい計算結果とは一致しないため誤り。','単位換算等で二桁分の誤りが生じた場合の過大な数値であり、正しい計算結果とは一致しないため誤り。'] },
  { id:'q271', group:'電気・電子理論', category:'電気の基礎（環状鉄心）', chapter:'3章', stars:4, question:'平均磁路長L=50〔cm〕、断面積S=10〔cm^2〕、比透磁率μr=500の環状鉄心に巻数N1=500、N2=200の2つのコイルがあるとき、両コイルの相互インダクタンスM〔mH〕として、適当なものはどれか。ただし、真空の透磁率μ0=1.2×10^-6〔H/m〕とし、磁束の漏れはないものとする。', options:['1.2×10^1〔mH〕','6×10^1〔mH〕','1.2×10^2〔mH〕','2.4×10^2〔mH〕'], answer:2, explanation:'相互インダクタンスはM=μ0×μr×S×N1×N2/L〔H〕で表される。片方のコイルの電流がΔt秒間にΔIだけ変化したとき、もう一方のコイルに発生する起電力はe=-M×ΔI/Δt〔V〕であり、Mは相互誘導の大きさの程度を表す。数値を代入すると、M=(1.2×10^-6×500×0.1×0.01×500×200)/0.5=1.2×10^-1〔H〕=1.2×10^2〔mH〕。長さと断面積のメートル換算、および解答単位が〔mH〕である点に注意。', choiceNotes:['桁の換算を誤った場合に生じる過小な数値であり、正しい計算結果1.2×10^2〔mH〕とは一致しないため誤り。','計算過程で係数を誤った場合に生じる数値であり、正しい相互インダクタンスの値とは一致しないため誤り。','M=μ0μrSN1N2/Lに数値を代入し単位換算を行うと1.2×10^2〔mH〕(=1.2×10^-1〔H〕)となり、正しい計算結果と一致するため正しい。','計算過程で係数を2倍に誤った場合に生じる数値であり、正しい計算結果とは一致しないため誤り。'] },
  { id:'q272', group:'電気・電子理論', category:'電気の基礎（コンデンサ）', chapter:'3章', stars:4, question:'C1=2〔μF〕とC2=4〔μF〕のコンデンサを直列に接続し、その両端にV=12〔V〕を加えたとき、2つのコンデンサに蓄えられるエネルギーW〔J〕として、適当なものはどれか。', options:['4.8×10^-5〔J〕','9.6×10^-5〔J〕','1.92×10^-4〔J〕','4.32×10^-4〔J〕'], answer:1, explanation:'コンデンサ2個の直列接続の合成静電容量は「和分の積」で求められ、C=C1×C2/(C1+C2)=(2×4)/(2+4)=4/3〔μF〕。コンデンサに蓄えられるエネルギーはW=(1/2)CV^2〔J〕なので、W=(1/2)×(4/3)×10^-6×12^2=9.6×10^-5〔J〕となる。なお並列接続の場合の合成容量は単純な足し算になる。', choiceNotes:['直列合成容量の計算等を誤った場合に生じる過小な数値であり、正しい計算結果9.6×10^-5〔J〕とは一致しないため誤り。','直列合成静電容量C=C1C2/(C1+C2)=4/3〔μF〕を用いてW=(1/2)CV^2を計算すると9.6×10^-5〔J〕となり、正しい計算結果と一致するため正しい。','計算過程で係数を誤った場合に生じる数値であり、正しい計算結果とは一致しないため誤り。','直列接続にもかかわらず並列接続の合成容量(C1+C2=6μF)を用いて計算した場合に生じる数値であり、接続方式を誤っているため不適切。'] },
  { id:'q273', group:'電気・電子理論', category:'直流回路', chapter:'3章', stars:4, question:'内部抵抗r=10〔Ω〕、起電力E=8〔V〕の電源に抵抗R〔Ω〕の素子を接続したとき、素子に供給される電力〔W〕の最大値として、適当なものはどれか。', options:['0.8〔W〕','1.6〔W〕','3.2〔W〕','6.4〔W〕'], answer:1, explanation:'抵抗素子Rに供給される電力はPR=64R/(10+R)^2〔W〕と整理でき、これは負荷抵抗Rが内部抵抗rと同じ値をとるとき（R=10Ω）に最大値をとる。このときPmax=64×10/(10+10)^2=1.6〔W〕となる。', choiceNotes:['最大電力整合の条件(R=r)を用いずに計算した場合等に生じる過小な数値であり、正しい計算結果1.6〔W〕とは一致しないため誤り。','内部抵抗と負荷抵抗が等しいとき(R=r=10Ω)に消費電力は最大となり、Pmax=E^2/4r=64/40=1.6〔W〕となるため正しい。','整合条件を適用せず計算した場合等に生じる過大な数値であり、正しい計算結果とは一致しないため誤り。','計算過程で係数を誤った場合に生じる過大な数値であり、正しい最大電力の値とは一致しないため誤り。'] },
  { id:'q274', group:'電気・電子理論', category:'直流回路（キルヒホッフの法則）', chapter:'3章', stars:4, question:'起電力8〔V〕の直流電源と抵抗R1=4〔Ω〕の直列枝、起電力5〔V〕の直流電源と抵抗R2=2〔Ω〕の直列枝、および抵抗R3=2〔Ω〕の枝が並列に接続された回路において、抵抗R2を流れる電流I2〔A〕の値として、適当なものはどれか。', options:['0.2〔A〕','0.7〔A〕','1.9〔A〕','2.3〔A〕'], answer:1, explanation:'キルヒホッフの法則を用いる。電流は回路を一周する間に増えたり減ったりせず、電圧は回路を一周して戻ってきたときに0〔V〕になる。R3を流れる電流をI3とするとI3=I1+I2。各ループについて8-I1×R1-I3×R3=0、5-I2×R2-I3×R3=0の式を立て、3つの連立方程式を解くとI2=0.7〔A〕が得られる。', choiceNotes:['キルヒホッフの法則による連立方程式の解法過程を誤った場合に生じる数値であり、正しいI2=0.7〔A〕とは一致しないため誤り。','各ループの電圧方程式と電流則(I3=I1+I2)から連立方程式を解くとI2=0.7〔A〕となり、正しい計算結果と一致するため正しい。','連立方程式の解法を誤った場合に生じる数値であり、正しい計算結果とは一致しないため誤り。','連立方程式の解法を誤った場合に生じる数値であり、正しい計算結果とは一致しないため誤り。'] },
  { id:'q275', group:'電気・電子理論', category:'交流回路（直列共振）', chapter:'3章', stars:4, question:'電圧10〔V〕の交流電源に抵抗R=4〔Ω〕、インダクタンスL=120〔mH〕、コンデンサC=0.75〔μF〕を直列に接続したRLC直列共振回路において、共振時にコイルLにかかる電圧VL〔V〕として、適当なものはどれか。', options:['250〔V〕','500〔V〕','1000〔V〕','2000〔V〕'], answer:2, explanation:'共振時は合成インピーダンスの虚数部が0となり、Zは抵抗分の4〔Ω〕のみとなるため、回路電流はI=10/4=2.5〔A〕。共振条件XL=XC（XL=2πfL、XC=1/(2πfC)）から共振周波数を求めるとf=10^4/(6π)〔Hz〕、これよりXL=4×10^2〔Ω〕。よってVL=I×XL=2.5×400=1000〔V〕となる。', choiceNotes:['共振周波数やリアクタンスの計算を誤った場合に生じる過小な数値であり、正しい計算結果1000〔V〕とは一致しないため誤り。','共振時の回路電流やリアクタンスの計算を誤った場合に生じる数値であり、正しい計算結果とは一致しないため誤り。','共振時はZ=Rとなり回路電流I=E/R=2.5〔A〕、共振時のXL=400〔Ω〕からVL=I×XL=1000〔V〕となり、正しい計算結果と一致するため正しい。','共振周波数やリアクタンスの計算過程で係数を誤った場合に生じる過大な数値であり、正しい計算結果とは一致しないため誤り。'] },
  { id:'q276', group:'電気・電子理論', category:'交流回路（並列つなぎ）', chapter:'3章', stars:4, question:'交流電源電圧E=160〔V〕に、抵抗R=20〔Ω〕、誘導性リアクタンスXL=40〔Ω〕、容量性リアクタンスXC=16〔Ω〕が並列に接続されたRLC並列回路において、回路に流れる電流I〔A〕として、適当なものはどれか。', options:['5〔A〕','8〔A〕','10〔A〕','16〔A〕'], answer:2, explanation:'RLC並列回路の合成インピーダンスの大きさは、1/Z=√((1/R)^2+(1/XL-1/XC)^2)〔S〕で表される。数値を代入すると1/Z=√((1/20)^2+(1/40-1/16)^2)=1/16〔S〕、よってZ=16〔Ω〕。オームの法則によりI=E/Z=160/16=10〔A〕となる。', choiceNotes:['合成インピーダンスの計算を誤った場合に生じる過小な数値であり、正しい計算結果10〔A〕とは一致しないため誤り。','合成インピーダンスやリアクタンスの計算を誤った場合に生じる数値であり、正しい計算結果とは一致しないため誤り。','1/Z=√((1/R)^2+(1/XL-1/XC)^2)よりZ=16〔Ω〕となり、I=E/Z=160/16=10〔A〕となるため正しい。','オームの法則の適用を誤り、インピーダンスではなく他の値をそのまま電流として扱った場合等に生じる数値であり誤り。'] },
  { id:'q277', group:'電気・電子理論', category:'論理回路（論理式）', chapter:'3章', stars:4, question:'論理式に関するド・モルガンの法則として、適当なものはどれか。ただし、A+Bは論理和を表し、A・Bは論理積を表し、上線（バー）は否定を表す。', options:['(A+B)全体の否定は、（Aの否定）・（Bの否定）に等しい','(A+B)全体の否定は、（Aの否定）+（Bの否定）に等しい','(A・B)全体の否定は、（Aの否定）・（Bの否定）に等しい','(A+B)全体の否定は、A・Bに等しい'], answer:0, explanation:'ド・モルガンの法則は暗記必須の重要公式である。論理和全体の否定は各項の否定の論理積（A+Bの否定＝Aの否定・Bの否定）となり、論理積全体の否定は各項の否定の論理和（A・Bの否定＝Aの否定+Bの否定）となる。論理回路の式を整理する際、バーを外す計算の中心となる。', choiceNotes:['論理和(A+B)全体の否定は各項の否定同士の論理積に等しいというド・モルガンの法則の記述であり正しい。','(A+B)の否定はAの否定とBの否定の論理積になるべきところ、論理和のままとしており誤り。','論理積(A・B)の否定は各項の否定同士の論理和になるべきところ、論理積のままとしており誤り。','(A+B)の否定はAの否定とBの否定の論理積であるべきところ、否定を取らないA・Bとしており誤り。'] },
  { id:'q278', group:'電気・電子理論', category:'論理回路（論理式）', chapter:'3章', stars:4, question:'論理式「（Aの否定・B ＋ A・Bの否定）全体の否定」を簡単化したものとして、適当なものはどれか。ただし、A+Bは論理和、A・Bは論理積、否定はその変数・式の反転を表す。', options:['A','Aの否定・B ＋ A・Bの否定','B','A・B ＋ Aの否定・Bの否定'], answer:3, explanation:'ド・モルガンの法則により、全体の否定は（Aの否定・B）の否定と（A・Bの否定）の否定の論理積となり、(A+Bの否定)・(Aの否定+B)と変形できる。これを展開するとA・Aの否定+A・B+Aの否定・Bの否定+B・Bの否定となり、A・Aの否定=0、B・Bの否定=0を用いて整理すると、A・B＋Aの否定・Bの否定が得られる。', choiceNotes:['展開の途中式や簡単化を誤った場合に生じる結果であり、正しい簡単化結果A・B+Aの否定・Bの否定とは異なるため誤り。','これは否定を取る前の元の式(Aの否定・B+A・Bの否定)そのものであり、全体否定を施した結果としては誤り。','簡単化の展開を誤った場合に生じる結果であり、正しい答えとは異なるため誤り。','ド・モルガンの法則で(A+Bの否定)・(Aの否定+B)と変形し展開・整理するとA・B+Aの否定・Bの否定が得られ、正しい簡単化結果と一致する。'] },
  { id:'q279', group:'電気・電子理論', category:'論理回路（論理式）', chapter:'3章', stars:4, question:'論理式「（Aの否定・B ＋ Aの否定・Bの否定）全体の否定」を簡単化したものとして、適当なものはどれか。ただし、A+Bは論理和、A・Bは論理積、否定はその変数・式の反転を表す。', options:['A・B','A','Aの否定・B ＋ A・Bの否定','A・B ＋ Aの否定・Bの否定'], answer:1, explanation:'ド・モルガンの法則により、(A+Bの否定)・(A+B)と変形できる。展開するとA・A+A・B+A・Bの否定+Bの否定・Bとなり、A・A=A、B・Bの否定=0を用いて整理すると、A+A・(B+Bの否定)=A+A=Aが得られる。ブール代数の性質A+A=A、A・A=Aも併せて覚えておきたい。', choiceNotes:['展開・簡単化の過程を誤った場合に生じる結果であり、正しい簡単化結果Aとは異なるため誤り。','ド・モルガンの法則で(A+Bの否定)・(A+B)と変形し展開・整理すると、A・A=A、B・Bの否定=0等を用いてAに簡単化され、正しい結果と一致する。','これは別の論理式(否定を取る前の元の式に近い形)であり、この設問の簡単化結果としては誤り。','別の論理式の簡単化結果に相当するものであり、この設問の正しい簡単化結果Aとは異なるため誤り。'] },
  { id:'q280', group:'電気・電子理論', category:'論理回路（論理式）', chapter:'3章', stars:4, question:'論理変数Aとその否定に関する論理式の性質として、適当なものはどれか。ただし、+は論理和、・は論理積、1は全体、0は空を表す。', options:['A ＋ A ＝ 1','A ・（Aの否定）＝ 1','A ＋（Aの否定）＝ 1','A ・ A ＝ 0'], answer:2, explanation:'Aを「日本人」とすると、日本人と日本人でない人を足した状態は全体になるので、A+（Aの否定）=1である。日本人と日本人でない人を兼任する人は1人もいないのでA・（Aの否定）=0、日本人と日本人を足しても日本人のみなのでA+A=A、日本人でありかつ日本人なのは日本人のみなのでA・A=Aとなる。また、（Aの否定）の否定はAに戻り、A+1=1である。', choiceNotes:['A＋A＝Aとなり、Aそのままなので1にはならない。同じ変数の論理和は元の変数と等しい。','A・（Aの否定）は日本人かつ日本人でない人であり該当者は存在しないため0であり、1ではない。','Aと（Aの否定）を合わせれば全体を網羅するのでA＋（Aの否定）＝1となり正しい。','A・AはAと等しくなる（べき等則）ため0にはならない。全体または空にはならない。'] },
  { id:'q281', group:'電気・電子理論', category:'品質マネジメントシステム（JIS Q 9000）', chapter:'基礎', stars:0, question:'JIS Q 9000:2015（品質マネジメントシステム－基本及び用語）における「トレーサビリティ」の定義として、適当なものはどれか。', options:['対象の履歴、適用又は所在を追跡できること','要求事項を満たしていないこと','求められたとおりに、かつ、求められたときに、機能する能力','対象に本来備わっている特性の集まりが、要求事項を満たす程度'], answer:0, explanation:'JIS Q 9000:2015の用語及び定義において、トレーサビリティ（traceability）は「対象の履歴、適用又は所在を追跡できること」と定義されている。「要求事項を満たしていないこと」は不適合（nonconformity）、「求められたとおりに、かつ、求められたときに、機能する能力」はディペンダビリティ（dependability）、「対象に本来備わっている特性の集まりが要求事項を満たす程度」は品質（quality）の定義である。', choiceNotes:['JIS Q 9000:2015でトレーサビリティは「対象の履歴、適用又は所在を追跡できること」と定義されており正しい。','「要求事項を満たしていないこと」は不適合（nonconformity）の定義であり、トレーサビリティではない。','「求められたとおりに、かつ、求められたときに機能する能力」はディペンダビリティの定義であり異なる。','「特性の集まりが要求事項を満たす程度」は品質（quality）の定義であり、トレーサビリティとは別の用語。'] },
  { id:'q282', group:'電気・電子理論', category:'交流回路（直列共振）', chapter:'3章', stars:4, question:'抵抗R、コイルL、コンデンサCを直列に接続したRLC直列回路が共振する条件として、適当なものはどれか。ただし、XLはコイルのリアクタンス、XCはコンデンサのリアクタンスとする。', options:['XL ＝ XC となるとき','R ＝ XL となるとき','R ＝ XC となるとき','XL ＝ 2XC となるとき'], answer:0, explanation:'交流回路の共振条件は、コイルのリアクタンスXL=2πfL〔Ω〕とコンデンサのリアクタンスXC=1/(2πfC)〔Ω〕とが等しくなる場合である。共振状態では合成インピーダンスの虚数部が0となり、回路のインピーダンスは抵抗分Rのみとなる。この条件から電源の周波数や各素子にかかる電圧を算出できる。', choiceNotes:['共振はXL=2πfLとXC=1/(2πfC)が等しくなるときに生じ、虚数部が打ち消し合いインピーダンスが最小となる。','RはXLと単位は同じΩだが実数部と虚数部が等しいことは共振条件ではなく無関係な比較である。','RとXCが等しいことも共振の条件ではなく、インピーダンスの虚数部を打ち消す条件ではない。','XLが2XCになる条件は虚数部が残るため共振状態にはならず、誤った倍率設定である。'] },
  { id:'q283', group:'電気・電子理論', category:'電気の基礎（電磁気学）', chapter:'3章', stars:4, question:'真空中に平行に置いた2本の直線導体に、同じ向きに電流を流したとき、2本の導体間に働く力に関する記述として、適当なものはどれか。', options:['導体は互いに引き合う','導体は互いに反発し合う','導体間に力は働かない','導体は電流の向きに移動する'], answer:0, explanation:'平行な2本の導線に電流を流すと、片方の電流が作る磁場によってもう一方の導線が力を受ける。電流の向きが同じときは2本の導線は引き合い、逆に反対向きに流れている場合は反発し合う。これは右ねじの法則とフレミング左手の法則（左手：作用する力・磁界・電流）で理解できる。導体1mあたりに働く力はF=μ0×I1I2/(2πr)〔N/m〕で表される。', choiceNotes:['同じ向きの電流が流れる平行導体はそれぞれが作る磁界により互いに引力を受け、引き合う。','反発し合うのは電流の向きが互いに逆の場合であり、同じ向きの電流では成立しない。','各導体は相手の電流が作る磁界の中にあるため必ず力（電磁力）を受け、力が働かないことはない。','力は導体を電流方向ではなく電流に垂直な方向（引き合う・反発する向き）に作用させる。'] },
  { id:'q284', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'光ファイバーケーブルの特徴として正しいものはどれか。', options:['電磁誘導の影響を受けやすい','電気信号をそのまま伝送する','電磁誘導の影響を受けにくい','銅線より重い'], answer:2, explanation:'光ファイバーは光信号で伝送するため、電磁誘導（ノイズ）の影響を受けにくい。また軽量・細径・広帯域という特徴もある。', choiceNotes:['光ファイバーは電気信号ではなく光信号で伝送するため、実際には電磁誘導の影響を受けにくい。','光ファイバーは電気信号ではなく光信号（光の点滅）に変換して伝送する媒体である。','光は電磁ノイズの影響を受けにくいため、電磁誘導に強いという特徴があり正しい記述である。','光ファイバーは石英ガラスやプラスチック製で細く軽量であり、銅線より軽い。'] },
  { id:'q285', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'デシベル（dB）の説明として正しいものはどれか。', options:['電力の絶対値を表す単位','電力比・電圧比を対数で表した単位','周波数を表す単位','電流の大きさを表す単位'], answer:1, explanation:'dBは電力比や電圧比を常用対数で表した相対的な単位。電力比：dB=10log(P1/P2)、電圧比：dB=20log(V1/V2)。', choiceNotes:['dBは電力や電圧の絶対値ではなく、基準値との比を対数で表した相対的な単位である。','dBは電力比P1/P2や電圧比V1/V2を常用対数で表した単位であり正しい説明である。','dBは周波数の単位ではなく、周波数はHz（ヘルツ）で表される。','dBは電流の大きさそのものを表す単位ではなく、比を対数表示したものである。'] },
  { id:'q286', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'電気通信回線の「伝送損失」とは何か。', options:['信号レベルが増加する現象','信号レベルが減少する現象','送受信端の周波数の差','電流の変化率'], answer:1, explanation:'伝送損失とは、信号が伝送路を通過する際に信号レベルが減少する現象。光ファイバーはdB/km単位で表す。', choiceNotes:['伝送損失は信号レベルが増加するのではなく減少する現象を指し、この記述は逆である。','伝送路を通過する際に信号レベルが減衰（低下）する現象を伝送損失といい正しい。','伝送損失は周波数の差ではなく、信号レベル（電力・振幅）の減少を表す概念である。','伝送損失は電流の変化率ではなく、信号レベルの減衰量（dB/km等）で表される。'] },
  { id:'q287', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'施工管理の「4大管理」に含まれないものはどれか。', options:['工程管理','品質管理','設計管理','安全管理'], answer:2, explanation:'4大管理は「工程管理・品質管理・安全管理・原価管理」。設計管理は含まれない。', choiceNotes:['工程管理は施工の4大管理の一つであり、含まれないものには該当しない。','品質管理も施工の4大管理の一つであり、含まれないものには該当しない。','4大管理は工程・品質・安全・原価管理であり、設計管理はこれに含まれないため正しい。','安全管理は施工の4大管理の一つであり、含まれないものには該当しない。'] },
  { id:'q288', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'バーチャート（横線式工程表）の特徴として正しいものはどれか。', options:['各作業の関連性が明確にわかる','各作業の開始・終了時期が視覚的にわかりやすい','クリティカルパスが容易に把握できる','コンピューターがないと作成できない'], answer:1, explanation:'バーチャートは横棒グラフで各作業の期間を表す。見やすい反面、作業間の関連性やクリティカルパスの把握には向いていない。', choiceNotes:['バーチャートは作業ごとの横棒で期間を示すのみで、作業間の前後関係（関連性）は表現しにくい。','各作業の開始・終了時期を横軸の日程上に棒で示すため視覚的にわかりやすく、これが正しい。','作業の依存関係を示さないため、最も時間のかかる経路であるクリティカルパスの把握には不向きである。','バーチャートは手書きでも作成できる単純な図表であり、コンピューターが必須というわけではない。'] },
  { id:'q289', group:'法規', category:'法規', chapter:'基礎', stars:0, question:'電気通信事業法の目的として正しいものはどれか。', options:['電波の公平かつ能率的な利用を確保する','電気通信事業の適正な運営を確保し利用者の利益を保護する','建設業の健全な発達を促進する','労働者の安全と健康を守る'], answer:1, explanation:'電気通信事業法は、電気通信事業の適正な運営を確保し、電気通信の健全な発達と国民の利便確保を目的とする。', choiceNotes:['電波の公平かつ能率的な利用の確保は電波法の目的であり、電気通信事業法の目的ではない。','電気通信事業法第1条は事業の適正な運営を確保し利用者の利益を保護することを目的としており正しい。','建設業の健全な発達の促進は建設業法の目的であり、電気通信事業法とは異なる法律の目的である。','労働者の安全と健康の確保は労働安全衛生法の目的であり、電気通信事業法の目的ではない。'] },
  { id:'q290', group:'法規', category:'法規', chapter:'基礎', stars:0, question:'建設業法における「主任技術者」の配置が必要な工事はどれか。', options:['請負金額500万円未満の軽微な工事のみ','すべての建設工事','公共工事のみ','請負金額3,000万円以上の工事のみ'], answer:1, explanation:'建設業法により、建設業者はすべての工事現場に主任技術者（または監理技術者）を配置しなければならない。', choiceNotes:['軽微な工事のみに限定されるものではなく、主任技術者はすべての工事現場で必要となる。','建設業法によりすべての建設工事現場に主任技術者（または監理技術者）の配置が義務付けられており正しい。','公共工事に限らず、民間工事も含めすべての工事で主任技術者の配置が必要である。','金額の下限は請負金額の多寡にかかわらず、軽微な工事を除きすべての工事で必要とされる。'] },
  { id:'q291', group:'電気・電子理論', category:'電気工学', chapter:'基礎', stars:0, question:'オームの法則の式として正しいものはどれか。', options:['V = I + R','V = I × R','V = I / R','V = I² × R'], answer:1, explanation:'オームの法則はV=I×R（電圧＝電流×抵抗）。V(V)、I(A)、R(Ω)の関係を表す。', choiceNotes:['オームの法則は電圧＝電流×抵抗であり、加算ではなく乗算の関係のため誤りである。','V＝I×Rはオームの法則そのものであり正しい関係式である。','V＝I／Rは誤った変形であり、正しくはV＝I×R（またはI＝V／R）である。','V＝I²×Rは電力（消費電力）を表す式P＝I²Rに似た誤った式であり、電圧の式ではない。'] },
  { id:'q292', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'無線LANの規格「IEEE 802.11ac（Wi-Fi 5）」が主に使用する周波数帯はどれか。', options:['2.4GHz帯のみ','5GHz帯のみ','900MHz帯','60GHz帯'], answer:1, explanation:'IEEE 802.11ac（Wi-Fi 5）は5GHz帯を使用。両帯域対応はIEEE 802.11n（Wi-Fi 4）やIEEE 802.11ax（Wi-Fi 6）。', choiceNotes:['IEEE 802.11acは2.4GHz帯には対応しておらず、5GHz帯専用の規格である。','IEEE 802.11ac（Wi-Fi 5）は5GHz帯のみを使用する規格であり正しい記述である。','900MHz帯は無線LANではなく特定小電力無線などに利用される帯域であり、802.11acとは無関係。','60GHz帯を使用するのはIEEE 802.11ad等のミリ波規格であり、802.11acとは異なる。'] },
  { id:'q293', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'ヒヤリハットの説明として正しいものはどれか。', options:['死亡・重傷事故のこと','危うく事故になりそうだったが災害に至らなかった事象','軽傷事故のこと','設備の故障のこと'], answer:1, explanation:'ヒヤリハットは危うく事故になりそうだった事象。ハインリッヒの法則では1件の重大事故の背後に29件の軽微事故と300件のヒヤリハットがあるとされる。', choiceNotes:['死亡・重傷事故はヒヤリハットではなく実際に発生した重大災害そのものを指す。','ヒヤリハットは危うく事故になりかけたが実際の災害には至らなかった事象を指し正しい。','軽傷事故はすでに発生した災害であり、事故に至らなかったヒヤリハットとは異なる。','設備の故障そのものはヒヤリハットではなく、故障が事故につながりかけた場合が該当し得る。'] },
  { id:'q294', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'IPアドレス「192.168.1.0/24」のサブネットマスクはどれか。', options:['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.128'], answer:2, explanation:'/24はサブネットマスクの上位24ビットが1であることを示す。24ビット＝255.255.255.0に相当。', choiceNotes:['255.0.0.0は上位8ビットのみを表す/8のマスクであり、/24とは異なる。','255.255.0.0は上位16ビットのマスク（/16）であり、/24の24ビットマスクとは異なる。','/24は上位24ビットが1であることを示し、255.255.255.0に相当するため正しい。','255.255.255.128は上位25ビットのマスク（/25）であり、/24より1ビット多い。'] },
  { id:'q295', group:'法規', category:'法規', chapter:'基礎', stars:0, question:'労働安全衛生法に基づき、高さ何m以上の場所での作業時に墜落防止措置が必要か。', options:['1m以上','2m以上','3m以上','5m以上'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の箇所での作業では安全帯の使用や手すりの設置など墜落防止措置が必要。', choiceNotes:['労働安全衛生規則で墜落防止措置の基準となる高さは1mではなく2m以上と定められている。','労働安全衛生規則により高さ2m以上の箇所での作業では墜落防止措置が義務付けられており正しい。','基準の高さは3mではなく2m以上であり、この選択肢の数値は誤りである。','基準の高さは5mではなく2m以上であり、この選択肢の数値は誤りである。'] },
  { id:'q296', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'UTPケーブルとSTPケーブルの違いとして正しいものはどれか。', options:['UTPはシールドあり、STPはシールドなし','UTPはシールドなし、STPはシールドあり','UTPは光ファイバー、STPは銅線','速度の違いのみで構造は同じ'], answer:1, explanation:'UTP（Unshielded Twisted Pair）はシールドなし、STP（Shielded Twisted Pair）はシールドあり。STPはノイズに強い。', choiceNotes:['UTPはシールドなし、STPはシールドありであり、この記述は両者の説明が逆になっている。','UTP（Unshielded Twisted Pair）はシールドなし、STP（Shielded Twisted Pair）はシールドありで正しい。','UTP・STPはいずれも銅線（撚り対線）ケーブルであり、光ファイバーではない。','シールドの有無という構造上の違いがあり、単なる速度差のみで構造が同じというのは誤り。'] },
  { id:'q297', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'QC（品質管理）の「PDCAサイクル」の正しい順序はどれか。', options:['Plan→Check→Do→Act','Plan→Do→Check→Act','Do→Plan→Check→Act','Check→Plan→Do→Act'], answer:1, explanation:'PDCAはPlan（計画）→Do（実施）→Check（確認）→Act（改善）の順に繰り返す継続的品質改善手法。', choiceNotes:['PDCAはPlan→Do→Check→Actの順であり、Check→Doの順に入れ替えた誤った並びである。','Plan（計画）→Do（実施）→Check（確認）→Act（改善）の順番であり正しい。','最初はDoではなくPlanから始まるため、この順序は誤りである。','最初はCheckではなくPlanから始まるため、この順序は誤りである。'] },
  { id:'q298', group:'電気・電子理論', category:'電気工学', chapter:'基礎', stars:0, question:'交流電力において「力率」とは何か。', options:['有効電力と皮相電力の比','電圧と電流の比','周波数と電圧の比','無効電力と皮相電力の比'], answer:0, explanation:'力率は有効電力（W）÷皮相電力（VA）で求める。力率が1に近いほど電力を効率よく使える。', choiceNotes:['力率は有効電力÷皮相電力で求められ、これが正しい定義である。','電圧と電流の比はインピーダンス（抵抗）を表すものであり、力率の定義ではない。','周波数と電圧の比は特に意味を持つ物理量ではなく、力率とは無関係である。','無効電力と皮相電力の比は無効率と呼ばれる概念であり、力率（有効電力との比）ではない。'] },
  { id:'q299', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'PONシステムにおける「ONU」とは何か。', options:['局側の光通信装置','加入者側の光通信装置','光ファイバーの分岐装置','無線アクセスポイント'], answer:1, explanation:'ONU（Optical Network Unit）は加入者側（ユーザー宅）に設置される光通信装置。局側はOLT（Optical Line Terminal）。', choiceNotes:['局側の光通信装置はOLT（Optical Line Terminal）であり、ONUではない。','ONU（Optical Network Unit）は加入者（ユーザー）宅側に設置される光通信装置であり正しい。','光ファイバーの分岐装置は光スプリッタ（カプラ）であり、ONUとは異なる機器である。','無線アクセスポイントはWi-Fi用の機器であり、有線の光通信装置であるONUとは異なる。'] },
  { id:'q300', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'工事着手前に作成する「施工計画書」に含まれないものはどれか。', options:['工程表','安全管理計画','完成検査報告書','品質管理計画'], answer:2, explanation:'完成検査報告書は工事完了後に作成するもの。施工計画書は着手前に工程表・安全管理計画・品質管理計画などを記載。', choiceNotes:['工程表は工事の日程計画を示すものであり、着手前に作成する施工計画書に含まれる。','安全管理計画は施工計画書に含まれる着手前の計画事項の一つである。','完成検査報告書は工事完了後の検査結果をまとめる書類であり、着手前の施工計画書には含まれないため正解。','品質管理計画は施工計画書に含まれる着手前の計画事項の一つである。'] },
  { id:'q301', group:'法規', category:'法規', chapter:'基礎', stars:0, question:'電波法における「不法無線局」の開設に対する罰則はどれか。', options:['5万円以下の罰金','1年以下の懲役または100万円以下の罰金','警告のみ','罰則規定はない'], answer:1, explanation:'電波法により、不法無線局（無免許）の開設は1年以下の懲役または100万円以下の罰金が科せられる。', choiceNotes:['電波法の不法無線局開設に対する罰則は5万円以下の罰金ではなく、より重い懲役刑を含む規定である。','電波法では不法無線局の開設に1年以下の懲役または100万円以下の罰金が科され正しい。','無免許開設は警告のみで済まされるものではなく、刑事罰の対象となる違反行為である。','電波法には無線局の不法開設に対する明確な罰則規定が存在し、罰則がないというのは誤り。'] },
  { id:'q302', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'VoIPの説明として正しいものはどれか。', options:['映像信号をIP網で伝送する技術','音声をデジタル化しIP網で伝送する技術','無線通信の一規格','データの暗号化技術'], answer:1, explanation:'VoIP（Voice over Internet Protocol）は音声をデジタル変換してIP網で伝送する技術。IP電話などに利用される。', choiceNotes:['映像信号の伝送技術ではなく、VoIPは音声通話を対象とした技術である。','VoIPは音声をデジタル化しIPパケットとしてネットワーク上で伝送する技術であり正しい。','無線通信の規格ではなく、有線・無線を問わずIP網上で音声を伝送する仕組みである。','データの暗号化技術ではなく、音声通信をIPで実現するための伝送技術である。'] },
  { id:'q303', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'作業主任者の選任が必要な作業はどれか。', options:['地上での一般清掃作業','高圧電気設備の取扱い作業','書類整理作業','資材の室内保管作業'], answer:1, explanation:'労働安全衛生法により、高圧・特別高圧電気設備の取扱い作業などの危険有害作業では作業主任者の選任が義務付けられている。', choiceNotes:['地上での一般清掃作業は危険有害業務に該当せず、作業主任者の選任は不要である。','高圧電気設備の取扱いなど危険有害な作業には労働安全衛生法により作業主任者の選任が義務付けられ正しい。','書類整理作業は危険を伴わない事務作業であり、作業主任者の選任対象ではない。','資材の室内保管作業は通常危険有害業務に該当せず、作業主任者の選任は不要である。'] },
  { id:'q304', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'「DNS」の役割として正しいものはどれか。', options:['データを暗号化して送信する','ドメイン名をIPアドレスに変換する','メールを送信する','ファイルを転送する'], answer:1, explanation:'DNS（Domain Name System）はドメイン名（例：www.example.com）をIPアドレスに変換する仕組み。インターネットの電話帳とも呼ばれる。', choiceNotes:['データの暗号化はDNSの役割ではなく、SSL/TLS等の別の仕組みが担う機能である。','DNSはドメイン名を対応するIPアドレスに変換する仕組みであり正しい説明である。','メールの送信を行うのはSMTPなどのプロトコルであり、DNSの役割ではない。','ファイル転送を行うのはFTP等のプロトコルであり、DNSの役割ではない。'] },
  { id:'q305', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'「ルーター」の役割として正しいものはどれか。', options:['同一ネットワーク内のデータを中継する','異なるネットワーク間でデータを転送する','電気信号を増幅する','無線信号を有線に変換する'], answer:1, explanation:'ルーターは異なるネットワーク間でIPアドレスを参照してデータを転送（ルーティング）する機器。', choiceNotes:['同一ネットワーク内のデータ中継はスイッチやハブの役割であり、ルーターの主機能ではない。','ルーターは異なるネットワーク間でIPアドレスを基にデータを転送（ルーティング）する機器であり正しい。','電気信号を増幅するのはリピーターの機能であり、ルーターの本来の役割ではない。','無線信号を有線信号に変換するのは無線アクセスポイントなどの機能であり、ルーター固有の役割ではない。'] },
  { id:'q306', group:'電気・電子理論', category:'電気工学', chapter:'基礎', stars:0, question:'コンデンサの特徴として正しいものはどれか。', options:['直流を通し交流を遮断する','交流を通し直流を遮断する','抵抗として働く','電気を磁気に変換する'], answer:1, explanation:'コンデンサは交流を通し直流を遮断する特性を持つ。フィルタ回路や結合回路に使用される。', choiceNotes:['直流を通し交流を遮断するのはコイル（インダクタ）の特性であり、コンデンサの説明としては逆である。','コンデンサは直流を遮断し交流を通す特性を持ち、これが正しい説明である。','コンデンサは静電容量による充放電を利用する素子であり、単純な抵抗として働くわけではない。','電気を磁気に変換するのはコイル（インダクタ）の働きであり、コンデンサは電荷を蓄える素子である。'] },
  { id:'q307', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'「KY活動（危険予知活動）」の目的として正しいものはどれか。', options:['作業効率を上げること','作業前に危険を予測し事故を防止すること','品質を検査すること','コストを削減すること'], answer:1, explanation:'KY活動は作業開始前に作業員が話し合い、潜在する危険を予測・確認することで労働災害を防止する安全管理活動。', choiceNotes:['作業効率の向上はKY活動の直接の目的ではなく、あくまで副次的な効果にすぎない。','KY活動は作業前に危険要因を予測・確認し、労働災害を未然に防止することが目的であり正しい。','品質検査はQC活動などの品質管理の範囲であり、KY活動（危険予知）の目的ではない。','コスト削減はKY活動の目的ではなく、安全確保を主眼とした活動である。'] },
  { id:'q308', group:'法規', category:'法規', chapter:'基礎', stars:0, question:'建設工事の請負契約書に記載しなければならない事項として、建設業法で定められていないものはどれか。', options:['工事内容','請負代金の額','工事着手の時期および工事完成の時期','下請業者の氏名'], answer:3, explanation:'建設業法で定める請負契約書の必須記載事項は工事内容、請負代金、着工・完成時期、支払方法など。下請業者の氏名は必須ではない。', choiceNotes:['工事内容は建設業法で請負契約書への記載が義務付けられている必須事項である。','請負代金の額は建設業法で請負契約書への記載が義務付けられている必須事項である。','工事着手・完成の時期は建設業法で請負契約書への記載が義務付けられている必須事項である。','下請業者の氏名は建設業法上、請負契約書の必須記載事項として定められておらず正解となる。'] },
  { id:'q309', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'「FTTH」とは何か。', options:['光ファイバーを家庭まで引き込むサービス','携帯電話の通信規格','無線LANの規格','ケーブルテレビの方式'], answer:0, explanation:'FTTH（Fiber To The Home）は光ファイバーケーブルを一般家庭まで引き込む光インターネット接続サービス。', choiceNotes:['FTTH（Fiber To The Home）は光ファイバーを一般家庭まで引き込む接続サービスであり正しい。','携帯電話の通信規格（4G・5G等とは別物）ではなく、有線の光回線サービスを指す用語である。','無線LANの規格ではなく、有線の光ファイバー回線を利用するサービスを指す。','ケーブルテレビ方式（CATV）とは異なる仕組みであり、FTTHは光ファイバーによる家庭引き込みを指す。'] },
  { id:'q310', group:'電気・電子理論', category:'電気工学', chapter:'基礎', stars:0, question:'三相交流の特徴として正しいものはどれか。', options:['単相交流より効率が悪い','位相が120°ずつずれた3つの交流を使う','直流の一種である','変圧器が使えない'], answer:1, explanation:'三相交流は位相が互いに120°ずれた3つの交流電圧を使う方式。電力の伝送効率が高く、工場設備・モーターなどに広く使われる。', choiceNotes:['三相交流は単相に比べ同じ電力を送るのに導体量が少なく効率が良いとされ、効率が悪いというのは誤り。','三相交流は位相が互いに120°ずつずれた3つの交流電圧・電流を用いる方式であり正しい説明である。','三相交流は直流ではなく、時間とともに大きさと向きが周期的に変化する交流の一種である。','三相交流でも変圧器（三相変圧器等）は使用可能であり、変圧器が使えないというのは誤り。'] },
  { id:'q311', group:'電気・電子理論', category:'施工管理', chapter:'基礎', stars:0, question:'現場での「安全帯」の使用について正しいものはどれか。', options:['高さ1m以上での作業時に使用する','高さ2m以上での作業で墜落の危険がある場合に使用する','使用は任意である','屋外作業時のみ使用する'], answer:1, explanation:'労働安全衛生規則により、高さ2m以上の作業床を設けることが困難な場合、安全帯（ハーネス型）を使用させなければならない。', choiceNotes:['安全帯（ハーネス型）使用の基準は高さ1mではなく2m以上であり、この数値は誤りである。','労働安全衛生規則により高さ2m以上で墜落の危険がある作業では安全帯の使用が義務付けられ正しい。','安全帯の使用は任意ではなく、条件に該当する場合は法令上の義務である。','安全帯の使用基準は屋内外を問わず高さと墜落の危険性で判断され、屋外作業に限定されない。'] },
  { id:'q312', group:'法規', category:'法規', chapter:'基礎', stars:0, question:'「消防法」において、自動火災報知設備の設置が義務付けられる建物の用途として正しいものはどれか。', options:['個人住宅のみ','旅館・ホテル・病院・学校など特定の用途の建物','すべての建物','延べ面積に関わらずすべての飲食店'], answer:1, explanation:'消防法施行令により、旅館・ホテル・病院・学校・百貨店など特定用途の建物および一定規模以上の建物に自動火災報知設備の設置が義務付けられる。', choiceNotes:['個人住宅のみに限定されるものではなく、特定用途や一定規模の建物が対象となる。','消防法施行令により旅館・ホテル・病院・学校など特定用途の建物に設置が義務付けられ正しい。','すべての建物に一律に義務付けられるわけではなく、用途・規模により設置基準が定められている。','延べ面積に関わらずすべての飲食店に一律義務付けられるわけではなく、規模等の基準が存在する。'] },
  { id:'q313', group:'電気・電子理論', category:'電気通信工学', chapter:'基礎', stars:0, question:'「スイッチングハブ（レイヤ2スイッチ）」の機能として正しいものはどれか。', options:['MACアドレスを参照してデータを転送する','IPアドレスを参照してデータを転送する','単純にすべてのポートにデータを転送する','無線と有線を変換する'], answer:0, explanation:'スイッチングハブはMACアドレステーブルを参照し、宛先MACアドレスのポートにのみデータを転送する。ハブ（リピーター）と異なり効率的な通信が可能。', choiceNotes:['スイッチングハブはMACアドレステーブルを参照して宛先ポートにのみ転送する機能を持ち正しい。','IPアドレスを参照して転送するのはルーター（レイヤ3機器）の機能であり、レイヤ2スイッチではない。','すべてのポートに転送するのはリピーターハブの動作であり、スイッチングハブとは異なる。','無線と有線の変換は無線アクセスポイントの機能であり、スイッチングハブの役割ではない。'] },
  { id:'q314', group:'電気・電子理論', category:'電気工学', chapter:'基礎', stars:0, question:'インダクタ（コイル）の特徴として正しいものはどれか。', options:['直流を遮断する','周波数が高いほどインピーダンスが大きくなる','周波数に関わらず抵抗値が一定','静電気を蓄える'], answer:1, explanation:'インダクタのインピーダンスはXL=2πfLで表され、周波数が高いほど大きくなる。直流（f=0）はほぼ抵抗0で通過させる。', choiceNotes:['直流（周波数0）に対してインダクタのインピーダンスはほぼ0となり、直流を遮断するわけではない。','インダクタのインピーダンスXL＝2πfLは周波数fに比例して大きくなるため正しい説明である。','インダクタのインピーダンスは周波数に依存して変化するため、周波数に関わらず一定という記述は誤り。','静電気（電荷）を蓄えるのはコンデンサの特徴であり、インダクタは磁気エネルギーを蓄える素子である。'] },
  { id:'q315', group:'施工管理', category:'設計図書', chapter:'1章', stars:5, question:'設計図書に関する記述として、「公共工事標準請負契約約款」上、適当でないものはどれか。', options:['設計図書でいう図面は、発注者の意思を一定の規則に基づいて図示した図面をいい、通常、設計図と呼ばれているものであり、基本設計図、概略設計図等もここでいう図面に含まれる','現場説明書、現場説明に対する質疑回答書は、契約締結前の書類であり、契約上は設計図書に含まれない','仕様書は、工事の施工に際して要求される技術的要件を示すもので、工事を施工するために必要な工事の規準を詳細に説明した文書であり、通常は共通仕様書と特記仕様書からなる','受注者は工事の施工にあたり、設計図書の中の文書間に内容の不一致を発見したときは、設計図書に優先順位の記載がない場合には監督員に通知し、その確認を請求しなければならない'], answer:1, explanation:'公共工事標準請負契約約款上、設計図書は「図面」「仕様書」「現場説明書」「現場説明に対する質問回答書」の4点で明確に定義されている。現場説明書や質問回答書も設計図書に含まれるため、「契約上は設計図書に含まれない」とする②の記述が不適当。' },
  { id:'q316', group:'施工管理', category:'契約権限義務', chapter:'1章', stars:5, question:'公共工事における公共工事標準請負契約約款に関する次の記述のうち、誤っているものはどれか。', options:['現場代理人は、工事現場における運営等に支障がなく発注者との連絡体制が確保される場合には、現場に常駐する義務を要しないこともあり得る','発注者は、必要に応じて工事の全部を一括して第三者に請け負わせることができる','受注者は、契約書および設計図書に特別の定めがない場合は仮設、施工方法その他工事目的物を完成するために必要な一切の手段を、自らの責任において定める','受注者は、工事完成後、設計図書の変更等によって不用となった支給材料は発注者に返還しなければならない'], answer:1, explanation:'工事の全部または主要部分を一括して第三者に請け負わせる「一括請負(丸投げ)」は厳しく禁止されている。②は誤り。' },
  { id:'q317', group:'施工管理', category:'契約権限義務', chapter:'1章', stars:5, question:'請負契約に関する記述として、「公共工事標準請負契約約款」上、誤っているものはどれか。ただし、請負契約には前金払および部分払に関する規定があり、完成の検査は定められた期間内に行われたものとする。', options:['発注者は、前払金の支払の請求があったときは、請求を受けた日から14日以内に前払金を支払わなければならない','発注者は、部分払の請求に係る出来高部分の確認を行った後、部分払の請求があったときは、請求を受けた日から40日以内に部分払金を支払わなければならない','発注者は、工事を完成した旨の通知を受けたときは、通知を受けた日から14日以内に工事の完成を確認するための検査を完了しなければならない','発注者は、工事が完成の検査に合格し、請負代金の支払の請求があったときは、請求を受けた日から40日以内に請負代金を支払わなければならない'], answer:1, explanation:'部分払金は検査完了後の請求から「14日以内」に支払わなければならない。②は「40日以内」としており誤り。なお完成時の請負代金支払は請求から40日以内で正しい。' },
  { id:'q318', group:'施工管理', category:'職長教育', chapter:'2章', stars:5, question:'建設業を営む事業者が、新たに職長となった者に対して行う安全または衛生のための教育の内容に関して、「労働安全衛生法」上、誤っているものを全て選べ。', options:['労働者に対する指導または監督の方法に関すること','就業規則の作成に関すること','異常時等における措置に関すること','作業方法の決定および労働者の配置に関すること'], answer:1, explanation:'職長教育の内容は、作業手順の定め方、労働者の配置方法、指導・教育の方法、作業中の監督・指示方法、危険性・有害性の調査とその結果に基づく措置、設備・作業場所の保守管理、異常時・災害発生時の措置、労働災害防止への関心保持と創意工夫の引き出し方など、現場作業に直接関連する事項に限られる。就業規則の作成は現場作業との関連性が低く、対象外。②が誤り。' },
  { id:'q319', group:'施工管理', category:'職長教育', chapter:'2章', stars:5, question:'事業者が、新たに職務につくことになった職長に対して行う安全または衛生のための教育として、「労働安全衛生法」上、誤っているものを全て選べ。', options:['労働者の福利厚生に関すること','危険性または有害性等の調査の方法に関すること','災害発生時における措置に関すること','労働災害防止についての関心の保持、および労働者の創意工夫を引き出す方法に関すること'], answer:0, explanation:'職長教育の対象は現場での作業に直接関連する事項に限られる。労働者の福利厚生に関することは現場作業との関連性が低く、職長教育の対象外。①が誤り。' },
  { id:'q320', group:'施工管理', category:'飛来落下防止', chapter:'2章', stars:5, question:'飛来・落下防止対策に関する記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['作業のため物体が落下することにより、労働者に危険を及ぼすおそれがあるため、防網の設備を設け、立入区域を設定する','他の労働者がその上で作業を行っているところで作業を行うときは、物体の飛来または落下による労働者の危険を防止するため、労働者に保護帽を着用させる','作業のため物体が飛来することにより労働者に危険を及ぼすおそれがあるため、飛来防止の設備を設け労働者に保護具を使用させる','2mの高所から物体を投下するときは、投下設備を設け、監視人を置かなければならない'], answer:3, explanation:'3m以上の高所から物体を投下する場合には、適切な投下設備を設ける、監視人を置く等の措置を講じなければならない。高さが3m未満の場合は対象外となる。①②③は正しい記述。' },
  { id:'q321', group:'施工管理', category:'墜落飛来落下防止', chapter:'2章', stars:5, question:'墜落、飛来または落下による危険を防止するための措置に関する記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['高さ2.5mの高所からの物体の投下であるため、投下設備の設置および監視人の配置を行わずに物体を投下した','作業のため物体が飛来することにより、労働者に危険を及ぼすおそれがあるため、飛来防止の設備を設け、労働者に保護具を使用させた','作業のため物体が落下することにより、労働者に危険を及ぼすおそれがあるため、要求性能墜落制止用器具を安全に取り付けるための設備を設けた','高さが2mの作業床の開口部の周囲に囲いを設けた'], answer:2, explanation:'要求性能墜落制止用器具は作業者自身が墜落しないようにするための措置であり、物体の落下防止とは関係ない。したがって③が誤り。①②④は正しい。' },
  { id:'q322', group:'施工管理', category:'脚立墜落防止', chapter:'2章', stars:5, question:'脚立を用いた作業を行うにあたり、墜落等による危険を防止するために講ずべき措置に関する次の記述として、労働安全衛生法令上、誤っているものを全て選べ。', options:['軽度の損傷があったが、著しい損傷や腐食が認められないため作業に使用した','脚と水平面との角度が80度となるものを使用した','折りたたみ式のものであったが、脚と水平面との角度を確実に保つための金具を備えていれば使用してもよい','踏み面は、作業を安全に行うために必要な面積があれば、それで足りる'], answer:1, explanation:'脚立の脚と水平面との角度は75度以下でなければならない。80度は基準を超えるため誤り。①③④は正しい規定内容。' },
  { id:'q323', group:'施工管理', category:'移動はしご墜落防止', chapter:'2章', stars:5, question:'移動はしごを用いた作業を行うにあたり、墜落等による危険を防止するために講ずべき措置に関する次の記述として、労働安全衛生法令上、誤っているものを全て選べ。', options:['丈夫な構造のものを使用した','軽度の損傷があったが、著しい損傷や腐食が認められないため作業に使用した','すべり止めの装置の取付け、および転位を防止するために必要な措置を施して使用した','幅が25cmのものを使用した'], answer:3, explanation:'移動はしごの幅は30cm以上とする規定がある。25cmでは基準を満たさないため誤り。①②③は正しい。' },
  { id:'q324', group:'施工管理', category:'屋根踏み抜き防止', chapter:'2章', stars:5, question:'墜落による危険防止のための措置に関する記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['移動はしごでは、幅が30cmのものとし、すべり止め装置を取り付ける','高さが2mの作業床の開口部に囲いや覆いを設ける','踏み抜きの危険がある屋根の上で作業を行うため、幅が25cmの歩み板を設け、防網を張る','深さが1.6mの箇所で作業を行うため、作業員が昇降するための設備を設ける'], answer:2, explanation:'踏み抜き事故を防ぐための歩み板の幅は30cm以上と定められている。25cmは基準未満のため誤り。①②④は正しい。' },
  { id:'q325', group:'施工管理', category:'高低差昇降設備', chapter:'2章', stars:5, question:'墜落等による危険防止のための措置として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['踏み抜きの危険がある屋根の上で作業を行うため、幅が30cmの歩み板を設け、防網を張った','枠組構造部の外側空間を昇降路とする構造のローリングタワーでは、同一面より同時に2名以上昇降させないようにした','高さが2mの作業床の開口部には囲いと覆いを設置し、作業床の端には手すりを設置した','高さが1.9mでの作業のため、作業員が昇降するための設備を省略した'], answer:3, explanation:'高さまたは深さが1.5mを超える箇所では、はしごや階段等の昇降設備を設ける必要がある。1.9mは対象となるため設備の省略は誤り。①②③は正しい。' },
  { id:'q326', group:'施工管理', category:'感電事故防止', chapter:'2章', stars:5, question:'架空電線の充電電路に近接する場所で、工作物の建設の作業に従事する労働者の感電防止のための措置として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['当該充電電路を移設すること','感電の危険を防止するための囲いを設けること','当該充電電路に絶縁用防護具を装着すること','労働者に静電気帯電防止用作業靴を着用させること'], answer:3, explanation:'静電気帯電防止用作業靴は人体に帯電した静電気を大地に逃がすためのもので、感電防止の対策にはならない。①②③は法令で定められた正しい措置。' },
  { id:'q327', group:'施工管理', category:'感電事故防止', chapter:'2章', stars:5, question:'電気による危険の防止に関する記述として、「労働安全衛生法令」上、正しいものを全て選べ。', options:['停電作業の終了後の通電にあたっては、当該作業に従事する労働者に感電の危険のないこと、および短絡接地器具を取りはずしたことを確認してから行う','架空電線の充電電路に近接する場で建物の修理の作業を行うにあたり、当該作業に従事する労働者が作業中に感電のおそれがあるため、作業場所に注意看板を設置して作業を行う','分電盤の電路を開放し、その電路の点検作業を行う場合、開放した開閉器に「通電禁止」の表示をする','電気機械器具の充電部分に設けた感電を防止するための囲いは、1年に1回その損傷の有無を点検し、異常を認めたときは、直ちに補修する'], answer:0, explanation:'②は誤り(注意看板だけでなく充電電路の移設や絶縁用防護具の装着、囲いの設置等が必要)。④は誤り(点検頻度は毎月1回以上と定められている)。①③は正しい記述。' },
  { id:'q328', group:'施工管理', category:'足場基準', chapter:'2章', stars:5, question:'高さ2m以上の足場(一側足場およびつり足場を除く)に関する記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['床材間の隙間を2cmとする','作業床の幅を30cmとする','床材を1つの支持物に取り付ける','床材と建地との隙間を10cmとする'], answer:1, explanation:'作業床の幅は40cm以上必要であり30cmは基準未満で誤り。床材を取り付ける支持物は2つ以上でなければならず、1つでは崩壊の恐れがあるため誤り。①④は基準を満たす記述。' },
  { id:'q329', group:'施工管理', category:'移動式足場安全', chapter:'2章', stars:5, question:'移動式足場の安全確保に関する次の記述として、「労働安全衛生法令」上、誤っているものを全て選べ。', options:['わく組構造部の外周空間を昇降路とする構造の移動式足場では、同一面より同時に2名以上の者が昇降しないようにする','凹凸が著しい場所で移動式足場を使用するときは、特に脚輪のブレーキを確実に作動させる必要がある','移動式足場の上では、移動はしごや脚立を使用しない','労働者を乗せた状態で移動式足場を移動させる場合は、監視者を配置する'], answer:1, explanation:'凹凸や傾斜が著しい場所ではジャッキ等を用いて作業床の水平を保持する必要がある。脚輪のブレーキは移動中を除き常に作動させておくもので、地面の凹凸状況には左右されない。移動式足場は人を乗せた状態での移動が禁止されており、監視者の有無は関係ない。①③は正しい。' },
  { id:'q330', group:'施工管理', category:'移動式足場安全', chapter:'2章', stars:5, question:'移動式足場の作業に関する次の記述のうち、「労働安全衛生法」上、誤っているものを全て選べ。', options:['傾斜が著しい場所で移動式足場を使用するために、ジャッキを利用して作業床の水平を保持する','作業責任者の監視の下、作業者を乗せたまま移動式足場を移動させる','作業のため、手すり、中さんを取り外したときは、その必要がなくなった後は直ちに元の状態に戻す','移動式足場の上で脚立を使用するために、脚立を支持物に確実に固定してから使用する'], answer:1, explanation:'移動式足場は不安定な構造のため、人を乗せた状態での移動は監視者の有無にかかわらず禁止されている。移動式足場上での脚立使用も、固定の有無にかかわらず禁止されている。①③は正しい。' },
  { id:'q331', group:'施工管理', category:'労基署届出', chapter:'2章', stars:5, question:'工事開始前に労働基準監督署長に対して計画の届出が必要なものとして、「労働安全衛生法令」上、正しいものを全て選べ。', options:['組立から解体までの期間が80日間で、高さ20m、長さ10mの架設通路を設置する場合','高さ30mの工作物(橋りょうを除く)の建設の仕事を開始しようとする場合','組立から解体までの期間が50日間で、つり足場を設置する場合','組立から解体までの期間が70日間で、高さ10mの構造の足場を設置する場合'], answer:0, explanation:'高さ31mを超える建築物・工作物や、深さ10m以上の地山掘削などが届出対象となる。架設通路は高さ・長さ共に10m以上かつ設置期間60日以上で届出が必要なため①は該当する。足場は高さ10m以上かつ設置期間60日以上で届出が必要なため④も該当する(高さ10mの足場で70日間はこれを満たす)。②は高さ31m以下のため不要。③はつり足場だが設置期間が60日未満(50日)のため届出不要。' },
